<span id="S5.SS3.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.12em;">
<span id="S5.SS3.SSS0.Px2.p2.pic1.2.1" class="ltx_p"><span id="S5.SS3.SSS0.Px2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In <span id="S5.SS3.SSS0.Px2.p2.pic1.2.1.1.1" class="ltx_text ltx_font_smallcaps">REprompt</span>, the absence of any stage leads to a decline in task performance, with Requirements Analysis and Requirements Elicitation having the most substantial impact on the outcomes. This underscores the necessity of integrating requirements engineering into LLM-based software engineering. Further analysis reveals that the Requirements Elicitation and Requirements Analysis stages primarily enhance the integrity and cohesion of the output document. The Requirements Specification stage mainly contributes to improving the integrity of the output, while the Requirements validation stage plays a key role in enhancing the consistency of the generated document.</span></span>
