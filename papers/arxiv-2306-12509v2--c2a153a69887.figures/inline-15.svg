<span id="A7.SS2.p2.pic1.2.1" class="ltx_p"><span id="A7.SS2.p2.pic1.2.1.1" class="ltx_text ltx_font_sansserif" style="font-size:70%;--ltx-fg-color:#000000;">Read the sentence. Determine if it is expressing a fact or opinion. A fact is an accurate statement that can be confirmed, while an opinion is a personal viewpoint that reflects someone’s beliefs. Facts are typically statements about something that happened, such as events, actions, or conditions, or statements that describe a state of being, such as someone’s personality or a physical object. Opinions are typically statements that express judgement, approval, or disapproval. Examples of facts include statements about events that occurred, such as &quot;the film was released in 2012,&quot; or statements about conditions, such as &quot;the weather is sunny,&quot; or statements that describe a state of being, such as &quot;the detective is strong and independent.&quot; Examples of opinions include statements about how good or bad something is, such as &quot;the film was terrible&quot; or &quot;the weather is beautiful.&quot; Examples of questions that are not facts or opinions include hypothetical questions, such as &quot;how would you feel if when you woke, the nightmare had just begun?&quot;. Select &quot;objective&quot; for a fact and &quot;subjective&quot; for an opinion.</span></span>
</span></span></span></foreignobject></g></g></svg>