<span id="A6.p2.pic1.2.1" class="ltx_p"><span id="A6.p2.pic1.2.1.1" class="ltx_text ltx_font_sansserif" style="font-size:70%;--ltx-fg-color:#000000;">Read each sentence, then decide if the sentence is expressing a positive or negative sentiment. For example, if the sentence is &quot;supported&quot;, choose &quot;positive&quot;, and if the sentence is &quot;derail&quot;, choose &quot;negative&quot;. Similarly, if the sentence is &quot;victorious&quot;, choose &quot;positive&quot;, and if the sentence is &quot;would not be a bad idea&quot;, choose &quot;positive&quot;. Additionally, if the sentence contains multiple words, consider the overall sentiment of the sentence and choose the appropriate option. For example, if the sentence is &quot;counting on&quot;, choose &quot;negative&quot;, and if the sentence is &quot;peace and stability and prosperity&quot;, choose &quot;positive&quot;. Note that words like &quot;artificial&quot; tend to have a negative sentiment.</span></span>
