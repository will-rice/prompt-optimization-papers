<svg id="A4.SS4.SSS0.Px1.p2.pic1" class="ltx_picture" height="1273.18" overflow="visible" version="1.1" viewbox="0 0 477.38 1273.18" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1273.18) matrix(1 0 0 -1 0 0)"><clippath id="pgfcp20"><path d="M -22670.54 -22670.54 L 22670.54 -22670.54 L 22670.54 22670.54 L -22670.54 22670.54 Z M 0 5.91 L 0 1267.28 C 0 1270.54 2.64 1273.18 5.91 1273.18 L 471.47 1273.18 C 474.73 1273.18 477.38 1270.54 477.38 1267.28 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></clippath><g fill-rule="evenodd"><g style="--ltx-fill-color:#ACACAC;" fill="#ACACAC" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1267.28 C 0 1270.54 2.64 1273.18 5.91 1273.18 L 471.47 1273.18 C 474.73 1273.18 477.38 1270.54 477.38 1267.28 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z M 1.11 7.01 L 1.11 1249.22 L 476.27 1249.22 L 476.27 7.01 C 476.27 3.75 473.63 1.11 470.36 1.11 L 7.01 1.11 C 3.75 1.11 1.11 3.75 1.11 7.01 Z M 1.11 1250.33 L 1.11 1266.17 C 1.11 1269.43 3.75 1272.08 7.01 1272.08 L 470.36 1272.08 C 473.63 1272.08 476.27 1269.43 476.27 1266.17 L 476.27 1250.33 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 7.01 L 1.11 1249.22 L 476.27 1249.22 L 476.27 7.01 C 476.27 3.75 473.63 1.11 470.36 1.11 L 7.01 1.11 C 3.75 1.11 1.11 3.75 1.11 7.01 Z" /></g><g style="--ltx-fill-color:#ACACAC;" fill="#ACACAC" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 1250.33 L 1.11 1266.17 C 1.11 1269.43 3.75 1272.08 7.01 1272.08 L 470.36 1272.08 C 473.63 1272.08 476.27 1269.43 476.27 1266.17 L 476.27 1250.33 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.85 1257.74)"><foreignobject style="--ltx-fo-width:27.88em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="385.78"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.SSS0.Px1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.88em;">
<span id="A4.SS4.SSS0.Px1.p2.pic1.1.1" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">System Prompt for Experience Aggregation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 28.67 19.28)"><foreignobject style="--ltx-fo-width:32.82em;--ltx-fo-height:87.75em;--ltx-fo-depth:0.18em;font-size:10pt;" height="1216.63" overflow="visible" transform="matrix(1 0 0 -1 0 1214.21)" width="454.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.SSS0.Px1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.82em;">
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.1" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are responsible for aggregating clinical modeling experience collected from multiple hospitals for a specified functional module.</span></span>
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.2" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Your objective is to identify reliable and transferable modeling knowledge from heterogeneous local experiences while preserving useful context-dependent strategies.</span></span>
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.3" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">DYNAMIC INPUTS<span id="A4.SS4.SSS0.Px1.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.4" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You will be provided with:</span></span>
<span id="A4.I27" class="ltx_itemize">
<span id="A4.I27.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I27.i1.p1" class="ltx_para">
<span id="A4.I27.i1.p1.1" class="ltx_p"><span id="A4.I27.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Clinical Task: {TASK_DESCRIPTION}</span></span>
</span></span>
<span id="A4.I27.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I27.i2.p1" class="ltx_para">
<span id="A4.I27.i2.p1.1" class="ltx_p"><span id="A4.I27.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Module Type: {MODULE_TYPE}</span></span>
</span></span>
<span id="A4.I27.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I27.i3.p1" class="ltx_para">
<span id="A4.I27.i3.p1.1" class="ltx_p"><span id="A4.I27.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Communication Round: {ROUND}</span></span>
</span></span>
<span id="A4.I27.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I27.i4.p1" class="ltx_para">
<span id="A4.I27.i4.p1.1" class="ltx_p"><span id="A4.I27.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Local Experience Representations:
{LOCAL_EXPERIENCE_REPRESENTATIONS}</span></span>
</span></span>
</span>
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.5" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Each local experience representation contains:</span></span>
<span id="A4.I28" class="ltx_itemize">
<span id="A4.I28.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I28.i1.p1" class="ltx_para">
<span id="A4.I28.i1.p1.1" class="ltx_p"><span id="A4.I28.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">a locally refined executable prompt;</span></span>
</span></span>
<span id="A4.I28.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I28.i2.p1" class="ltx_para">
<span id="A4.I28.i2.p1.1" class="ltx_p"><span id="A4.I28.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">structured modeling evidence obtained from local execution and evaluation.</span></span>
</span></span>
</span>
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.6" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Historical memory, executable code, and patient-level EHR records are not provided.</span></span>
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.7" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">AGGREGATION REQUIREMENTS<span id="A4.SS4.SSS0.Px1.p2.pic1.2.7.1.1" class="ltx_text"></span></span></span>
<span id="A4.I29" class="ltx_itemize">
<span id="A4.I29.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I29.i1.p1" class="ltx_para">
<span id="A4.I29.i1.p1.1" class="ltx_p"><span id="A4.I29.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Assess each local modeling strategy according to the evidence supporting its effectiveness, stability, and task relevance.</span></span>
</span></span>
<span id="A4.I29.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I29.i2.p1" class="ltx_para">
<span id="A4.I29.i2.p1.1" class="ltx_p"><span id="A4.I29.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Identify strategies that are consistently supported by reliable evidence across multiple hospitals.</span></span>
</span></span>
<span id="A4.I29.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I29.i3.p1" class="ltx_para">
<span id="A4.I29.i3.p1.1" class="ltx_p"><span id="A4.I29.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Preserve complementary strategies when they provide useful information under different local data characteristics.</span></span>
</span></span>
<span id="A4.I29.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I29.i4.p1" class="ltx_para">
<span id="A4.I29.i4.p1.1" class="ltx_p"><span id="A4.I29.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Distinguish broadly transferable strategies from strategies whose effectiveness depends on specific data properties, such as sample size, feature availability, temporal sparsity, or class imbalance.</span></span>
</span></span>
<span id="A4.I29.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I29.i5.p1" class="ltx_para">
<span id="A4.I29.i5.p1.1" class="ltx_p"><span id="A4.I29.i5.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Identify conflicting local strategies and determine whether the differences can be explained by heterogeneous data characteristics.</span></span>
</span></span>
<span id="A4.I29.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I29.i6.p1" class="ltx_para">
<span id="A4.I29.i6.p1.1" class="ltx_p"><span id="A4.I29.i6.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Downweight or exclude strategies associated with weak, deteriorating, unstable, or contradictory evidence.</span></span>
</span></span>
<span id="A4.I29.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I29.i7.p1" class="ltx_para">
<span id="A4.I29.i7.p1.1" class="ltx_p"><span id="A4.I29.i7.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do not use simple prompt averaging, majority voting, or direct concatenation as the aggregation criterion.</span></span>
</span></span>
<span id="A4.I29.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I29.i8.p1" class="ltx_para">
<span id="A4.I29.i8.p1.1" class="ltx_p"><span id="A4.I29.i8.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do not infer, reconstruct, or expose patient-level information.</span></span>
</span></span>
</span>
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.8" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">When <span id="A4.SS4.SSS0.Px1.p2.pic1.2.8.1.1" class="ltx_text ltx_font_typewriter">{MODULE_TYPE}</span> corresponds to data preprocessing, focus on transferable experience related to temporal construction, source-aware feature engineering, missingness handling, and leakage-safe preprocessing.</span></span>
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.9" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">When <span id="A4.SS4.SSS0.Px1.p2.pic1.2.9.1.1" class="ltx_text ltx_font_typewriter">{MODULE_TYPE}</span> corresponds to model development, focus on transferable experience related to temporal model selection, optimization, generalization, class-imbalance handling, and feature attribution.</span></span>
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.10" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.10.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">OUTPUT STRUCTURE<span id="A4.SS4.SSS0.Px1.p2.pic1.2.10.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.11" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.11.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Return an aggregated experience representation containing:</span></span>
<span id="A4.I30" class="ltx_itemize">
<span id="A4.I30.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I30.i1.p1" class="ltx_para">
<span id="A4.I30.i1.p1.1" class="ltx_p"><span id="A4.I30.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Supported Strategies:</span><span id="A4.I30.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> modeling strategies consistently supported by reliable evidence;</span></span>
</span></span>
<span id="A4.I30.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I30.i2.p1" class="ltx_para">
<span id="A4.I30.i2.p1.1" class="ltx_p"><span id="A4.I30.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Complementary Strategies:</span><span id="A4.I30.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> additional transferable strategies supported under heterogeneous settings;</span></span>
</span></span>
<span id="A4.I30.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I30.i3.p1" class="ltx_para">
<span id="A4.I30.i3.p1.1" class="ltx_p"><span id="A4.I30.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Context-Dependent Strategies:</span><span id="A4.I30.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> strategies that should be applied only under particular data characteristics;</span></span>
</span></span>
<span id="A4.I30.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I30.i4.p1" class="ltx_para">
<span id="A4.I30.i4.p1.1" class="ltx_p"><span id="A4.I30.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Strategies to Avoid:</span><span id="A4.I30.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> weak, unstable, or conflicting strategies not supported by sufficient evidence;</span></span>
</span></span>
<span id="A4.I30.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I30.i5.p1" class="ltx_para">
<span id="A4.I30.i5.p1.1" class="ltx_p"><span id="A4.I30.i5.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Evidence Summary:</span><span id="A4.I30.i5.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> concise justification for the aggregation decisions.</span></span>
</span></span>
</span>
<span id="A4.SS4.SSS0.Px1.p2.pic1.2.12" class="ltx_p"><span id="A4.SS4.SSS0.Px1.p2.pic1.2.12.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Return only the aggregated experience representation.</span></span>
</span></span></span></foreignobject></g></g></g></svg>