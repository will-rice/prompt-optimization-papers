ntainer"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS0.Px3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.88em;">
<span id="A4.SS1.SSS0.Px3.p2.pic1.1.1" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Source-Specific Data Preprocessing Instruction: Laboratory</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 28.67 19.28)"><foreignobject style="--ltx-fo-width:32.82em;--ltx-fo-height:53.05em;--ltx-fo-depth:0.18em;font-size:10pt;" height="736.45" overflow="visible" transform="matrix(1 0 0 -1 0 734.03)" width="454.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS0.Px3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.82em;">
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.1" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">EHR SOURCE<span id="A4.SS1.SSS0.Px3.p2.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.2" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Laboratory</span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.3" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">DATA CHARACTERISTICS<span id="A4.SS1.SSS0.Px3.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.4" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The laboratory source contains sparse and irregular longitudinal measurements with potentially high missingness. Different laboratory variables may have substantially different sampling frequencies, and
multiple observations of the same variable may occur within one temporal interval.</span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.5" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">AVAILABLE VARIABLES<span id="A4.SS1.SSS0.Px3.p2.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.6" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Representative variables include glucose, creatinine, bicarbonate, potassium, platelets, and other available laboratory measurements.</span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.7" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">SOURCE-SPECIFIC FEATURE CONSTRUCTION<span id="A4.SS1.SSS0.Px3.p2.pic1.2.7.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.8" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">For each patient, temporal interval, and laboratory variable, construct a small set of informative and clinically interpretable features.</span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.9" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Candidate features may include:</span></span>
<span id="A4.I6" class="ltx_itemize">
<span id="A4.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i1.p1" class="ltx_para">
<span id="A4.I6.i1.p1.1" class="ltx_p"><span id="A4.I6.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">a representative value, such as the most recent or mean measurement within the interval;</span></span>
</span></span>
<span id="A4.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i2.p1" class="ltx_para">
<span id="A4.I6.i2.p1.1" class="ltx_p"><span id="A4.I6.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">temporal change relative to preceding observations when sufficient measurements are available;</span></span>
</span></span>
<span id="A4.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i3.p1" class="ltx_para">
<span id="A4.I6.i3.p1.1" class="ltx_p"><span id="A4.I6.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">within-interval variability when repeated measurements are available.</span></span>
</span></span>
</span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.10" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Avoid excessive or redundant feature expansion. Do not construct temporal change or variability features when the available observations are insufficient to support reliable estimation.</span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.11" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.11.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">REPEATED AND MISSING OBSERVATIONS<span id="A4.SS1.SSS0.Px3.p2.pic1.2.11.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.12" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.12.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">When multiple measurements of the same variable occur within one temporal interval, apply an appropriate aggregation strategy according to the characteristics of the variable.</span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.13" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.13.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">When no measurement is available, use a stable strategy such as forward filling, an explicit missing representation, or an appropriate default value.</span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.14" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.14.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">FEATURE NAMING<span id="A4.SS1.SSS0.Px3.p2.pic1.2.14.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.15" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.15.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Use deterministic and interpretable feature names following:</span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.16" class="ltx_p ltx_align_center"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{variable_name}_{feature_type}_t{time_index}</span></span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.17" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.17.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Examples include:</span></span>
<span id="A4.I7" class="ltx_itemize">
<span id="A4.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I7.i1.p1" class="ltx_para">
<span id="A4.I7.i1.p1.1" class="ltx_p"><span id="A4.I7.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">glucose_last_t0</span></span>
</span></span>
<span id="A4.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I7.i2.p1" class="ltx_para">
<span id="A4.I7.i2.p1.1" class="ltx_p"><span id="A4.I7.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">glucose_mean_t0</span></span>
</span></span>
<span id="A4.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I7.i3.p1" class="ltx_para">
<span id="A4.I7.i3.p1.1" class="ltx_p"><span id="A4.I7.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">creatinine_last_t0</span></span>
</span></span>
<span id="A4.I7.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I7.i4.p1" class="ltx_para">
<span id="A4.I7.i4.p1.1" class="ltx_p"><span id="A4.I7.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">potassium_mean_t0</span></span>
</span></span>
</span>
<span id="A4.SS1.SSS0.Px3.p2.pic1.2.18" class="ltx_p"><span id="A4.SS1.SSS0.Px3.p2.pic1.2.18.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Ensure that the feature-name ordering exactly matches the flattened temporal representation.</span></span>
</span></span></span></foreignobject></g></g></g></svg>