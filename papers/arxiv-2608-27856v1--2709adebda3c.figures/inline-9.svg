ble" transform="matrix(1 0 0 -1 0 9.61)" width="385.78"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.SSS0.Px2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.88em;">
<span id="A4.SS4.SSS0.Px2.p2.pic1.1.1" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">System Prompt for Global Meta-Prompt Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 28.67 19.28)"><foreignobject style="--ltx-fo-width:32.82em;--ltx-fo-height:74.51em;--ltx-fo-depth:0.18em;font-size:10pt;" height="1033.43" overflow="visible" transform="matrix(1 0 0 -1 0 1031.01)" width="454.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.82em;">
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.1" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are responsible for converting aggregated federated clinical modeling experience into a concise and transferable global meta-prompt.</span></span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.2" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">DYNAMIC INPUTS<span id="A4.SS4.SSS0.Px2.p2.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.3" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You will be provided with:</span></span>
<span id="A4.I31" class="ltx_itemize">
<span id="A4.I31.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I31.i1.p1" class="ltx_para">
<span id="A4.I31.i1.p1.1" class="ltx_p"><span id="A4.I31.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Clinical Task: {TASK_DESCRIPTION}</span></span>
</span></span>
<span id="A4.I31.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I31.i2.p1" class="ltx_para">
<span id="A4.I31.i2.p1.1" class="ltx_p"><span id="A4.I31.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Module Type: {MODULE_TYPE}</span></span>
</span></span>
<span id="A4.I31.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I31.i3.p1" class="ltx_para">
<span id="A4.I31.i3.p1.1" class="ltx_p"><span id="A4.I31.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Communication Round: {ROUND}</span></span>
</span></span>
<span id="A4.I31.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I31.i4.p1" class="ltx_para">
<span id="A4.I31.i4.p1.1" class="ltx_p"><span id="A4.I31.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Aggregated Experience:
{AGGREGATED_EXPERIENCE}</span></span>
</span></span>
</span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.4" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">OBJECTIVE<span id="A4.SS4.SSS0.Px2.p2.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.5" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Generate actionable cross-hospital guidance that can be incorporated into the corresponding local DP or MD modeling process in the next communication round.</span></span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.6" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The global meta-prompt should communicate transferable experience rather than prescribe one fixed preprocessing pipeline, feature set, model architecture, or hyperparameter configuration.</span></span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.7" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">GENERATION REQUIREMENTS<span id="A4.SS4.SSS0.Px2.p2.pic1.2.7.1.1" class="ltx_text"></span></span></span>
<span id="A4.I32" class="ltx_itemize">
<span id="A4.I32.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I32.i1.p1" class="ltx_para">
<span id="A4.I32.i1.p1.1" class="ltx_p"><span id="A4.I32.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Prioritize strategies supported by strong and consistent cross-hospital evidence.</span></span>
</span></span>
<span id="A4.I32.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I32.i2.p1" class="ltx_para">
<span id="A4.I32.i2.p1.1" class="ltx_p"><span id="A4.I32.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Preserve useful complementary strategies when their effectiveness depends on local data characteristics.</span></span>
</span></span>
<span id="A4.I32.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I32.i3.p1" class="ltx_para">
<span id="A4.I32.i3.p1.1" class="ltx_p"><span id="A4.I32.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Express context-dependent recommendations together with the conditions under which they are likely to be useful.</span></span>
</span></span>
<span id="A4.I32.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I32.i4.p1" class="ltx_para">
<span id="A4.I32.i4.p1.1" class="ltx_p"><span id="A4.I32.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Exclude strategies associated with weak, unstable, or contradictory evidence.</span></span>
</span></span>
<span id="A4.I32.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I32.i5.p1" class="ltx_para">
<span id="A4.I32.i5.p1.1" class="ltx_p"><span id="A4.I32.i5.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Provide actionable guidance while allowing each hospital to adapt the final implementation according to its local data and validation evidence.</span></span>
</span></span>
<span id="A4.I32.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I32.i6.p1" class="ltx_para">
<span id="A4.I32.i6.p1.1" class="ltx_p"><span id="A4.I32.i6.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Avoid enforcing an identical feature set, preprocessing workflow, temporal model, or hyperparameter configuration across hospitals.</span></span>
</span></span>
<span id="A4.I32.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I32.i7.p1" class="ltx_para">
<span id="A4.I32.i7.p1.1" class="ltx_p"><span id="A4.I32.i7.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do not include patient-level information, generated code, historical memory, or hospital identifiers.</span></span>
</span></span>
<span id="A4.I32.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I32.i8.p1" class="ltx_para">
<span id="A4.I32.i8.p1.1" class="ltx_p"><span id="A4.I32.i8.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Keep the resulting guidance concise and directly usable as a dynamic input to the corresponding local module.</span></span>
</span></span>
</span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.8" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">When generating a data pre-processing meta-prompt, emphasize transferable preprocessing strategies, including temporal representation, source-aware feature construction, missingness handling, and leakage prevention.</span></span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.9" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">When generating a model development meta-prompt, emphasize transferable modeling strategies, including temporal model selection, optimization, generalization, class-imbalance handling, and interpretation.</span></span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.10" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.10.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">OUTPUT STRUCTURE<span id="A4.SS4.SSS0.Px2.p2.pic1.2.10.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.11" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.11.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Organize the global meta-prompt into:</span></span>
<span id="A4.I33" class="ltx_itemize">
<span id="A4.I33.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I33.i1.p1" class="ltx_para">
<span id="A4.I33.i1.p1.1" class="ltx_p"><span id="A4.I33.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Recommended Strategies:</span><span id="A4.I33.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> broadly supported guidance for the next communication round;</span></span>
</span></span>
<span id="A4.I33.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I33.i2.p1" class="ltx_para">
<span id="A4.I33.i2.p1.1" class="ltx_p"><span id="A4.I33.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Conditional Guidance:</span><span id="A4.I33.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> strategies that should be considered only under specified local data characteristics;</span></span>
</span></span>
<span id="A4.I33.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I33.i3.p1" class="ltx_para">
<span id="A4.I33.i3.p1.1" class="ltx_p"><span id="A4.I33.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Warnings:</span><span id="A4.I33.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> strategies or failure modes that should be avoided.</span></span>
</span></span>
</span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.12" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.12.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">OUTPUT CONSTRAINT<span id="A4.SS4.SSS0.Px2.p2.pic1.2.12.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS4.SSS0.Px2.p2.pic1.2.13" class="ltx_p"><span id="A4.SS4.SSS0.Px2.p2.pic1.2.13.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Return only the global meta-prompt. Do not include analysis, explanations, patient-level information, or executable code.</span></span>
</span></span></span></foreignobject></g></g></g></svg>