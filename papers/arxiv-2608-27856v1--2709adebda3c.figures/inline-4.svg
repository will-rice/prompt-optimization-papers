ble" transform="matrix(1 0 0 -1 0 9.61)" width="385.78"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS0.Px4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.88em;">
<span id="A4.SS1.SSS0.Px4.p2.pic1.1.1" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">System Prompt for Data Preprocessing Evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 28.67 16.85)"><foreignobject style="--ltx-fo-width:32.82em;--ltx-fo-height:93.14em;--ltx-fo-depth:0em;font-size:10pt;" height="1288.83" overflow="visible" transform="matrix(1 0 0 -1 0 1288.83)" width="454.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS0.Px4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.82em;">
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.1" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are an expert in clinical EHR preprocessing acting as an evaluator for the current data preprocessing workflow.</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.2" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Your task is to critically assess the generated preprocessing pipeline and provide actionable feedback that can improve subsequent preprocessing and downstream clinical prediction performance.</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.3" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">DYNAMIC INPUTS<span id="A4.SS1.SSS0.Px4.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.4" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You will be provided with:</span></span>
<span id="A4.I8" class="ltx_itemize">
<span id="A4.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i1.p1" class="ltx_para">
<span id="A4.I8.i1.p1.1" class="ltx_p"><span id="A4.I8.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Clinical Task: {TASK_DESCRIPTION}</span></span>
</span></span>
<span id="A4.I8.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i2.p1" class="ltx_para">
<span id="A4.I8.i2.p1.1" class="ltx_p"><span id="A4.I8.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Target Outcome: {TARGET_OUTCOME}</span></span>
</span></span>
<span id="A4.I8.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i3.p1" class="ltx_para">
<span id="A4.I8.i3.p1.1" class="ltx_p"><span id="A4.I8.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Observation Window: {OBSERVATION_WINDOW}</span></span>
</span></span>
<span id="A4.I8.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i4.p1" class="ltx_para">
<span id="A4.I8.i4.p1.1" class="ltx_p"><span id="A4.I8.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Source Name: {TABLE_NAME}</span></span>
</span></span>
<span id="A4.I8.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i5.p1" class="ltx_para">
<span id="A4.I8.i5.p1.1" class="ltx_p"><span id="A4.I8.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Generated Preprocessing Code:
{PREPROCESSING_CODE}</span></span>
</span></span>
<span id="A4.I8.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i6.p1" class="ltx_para">
<span id="A4.I8.i6.p1.1" class="ltx_p"><span id="A4.I8.i6.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Feature Summary: {FEATURE_SUMMARY}</span></span>
</span></span>
<span id="A4.I8.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i7.p1" class="ltx_para">
<span id="A4.I8.i7.p1.1" class="ltx_p"><span id="A4.I8.i7.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Data Quality Statistics:
{DATA_QUALITY_STATISTICS}</span></span>
</span></span>
<span id="A4.I8.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i8.p1" class="ltx_para">
<span id="A4.I8.i8.p1.1" class="ltx_p"><span id="A4.I8.i8.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Execution Statistics:
{EXECUTION_STATISTICS}</span></span>
</span></span>
<span id="A4.I8.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i9.p1" class="ltx_para">
<span id="A4.I8.i9.p1.1" class="ltx_p"><span id="A4.I8.i9.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Validation Performance:
{VALIDATION_PERFORMANCE}</span></span>
</span></span>
<span id="A4.I8.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i10.p1" class="ltx_para">
<span id="A4.I8.i10.p1.1" class="ltx_p"><span id="A4.I8.i10.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Local Historical Context:
{LOCAL_HISTORICAL_CONTEXT}</span></span>
</span></span>
</span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.5" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The supplied information contains modeling-level summaries only. Do not request or infer patient-level EHR values.</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.6" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do not generate or rewrite executable code. Your role is evaluation and feedback only.</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.7" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Organize the evaluation into four parts.</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.8" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.8.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">PART 1: Historical Execution Analysis<span id="A4.SS1.SSS0.Px4.p2.pic1.2.8.1.1" class="ltx_text"></span></span></span>
<span id="A4.I9" class="ltx_itemize">
<span id="A4.I9.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I9.i1.p1" class="ltx_para">
<span id="A4.I9.i1.p1.1" class="ltx_p"><span id="A4.I9.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Compare the current preprocessing outcome with relevant previous local executions.</span></span>
</span></span>
<span id="A4.I9.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I9.i2.p1" class="ltx_para">
<span id="A4.I9.i2.p1.1" class="ltx_p"><span id="A4.I9.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Identify preprocessing decisions associated with previous improvements, degradation, stagnation, or abnormal outcomes.</span></span>
</span></span>
<span id="A4.I9.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I9.i3.p1" class="ltx_para">
<span id="A4.I9.i3.p1.1" class="ltx_p"><span id="A4.I9.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Determine whether the current workflow improves feature quality, data coverage, temporal representation, or downstream validation performance.</span></span>
</span></span>
</span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.9" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.9.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">PART 2: Preprocessing Correctness and Temporal Validity<span id="A4.SS1.SSS0.Px4.p2.pic1.2.9.1.1" class="ltx_text"></span></span></span>
<span id="A4.I10" class="ltx_itemize">
<span id="A4.I10.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I10.i1.p1" class="ltx_para">
<span id="A4.I10.i1.p1.1" class="ltx_p"><span id="A4.I10.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Verify that the preprocessing workflow is consistent with the specified clinical task and observation window.</span></span>
</span></span>
<span id="A4.I10.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I10.i2.p1" class="ltx_para">
<span id="A4.I10.i2.p1.1" class="ltx_p"><span id="A4.I10.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Detect potential target leakage, future-information leakage, or incorrect temporal alignment.</span></span>
</span></span>
<span id="A4.I10.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I10.i3.p1" class="ltx_para">
<span id="A4.I10.i3.p1.1" class="ltx_p"><span id="A4.I10.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Assess patient alignment and consistency of the temporal representation.</span></span>
</span></span>
<span id="A4.I10.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I10.i4.p1" class="ltx_para">
<span id="A4.I10.i4.p1.1" class="ltx_p"><span id="A4.I10.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluate whether repeated, missing, and irregular observations are handled appropriately for the current EHR source.</span></span>
</span></span>
</span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.10" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.10.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">PART 3: Feature Quality, Clinical Relevance, and Robustness<span id="A4.SS1.SSS0.Px4.p2.pic1.2.10.1.1" class="ltx_text"></span></span></span>
<span id="A4.I11" class="ltx_itemize">
<span id="A4.I11.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I11.i1.p1" class="ltx_para">
<span id="A4.I11.i1.p1.1" class="ltx_p"><span id="A4.I11.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Assess whether the constructed features are clinically meaningful and relevant to the target prediction task.</span></span>
</span></span>
<span id="A4.I11.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I11.i2.p1" class="ltx_para">
<span id="A4.I11.i2.p1.1" class="ltx_p"><span id="A4.I11.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluate whether temporal aggregation, feature construction, and feature selection are justified by the characteristics of the source.</span></span>
</span></span>
<span id="A4.I11.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I11.i3.p1" class="ltx_para">
<span id="A4.I11.i3.p1.1" class="ltx_p"><span id="A4.I11.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Identify redundant, unstable, excessively sparse, or weakly informative features.</span></span>
</span></span>
<span id="A4.I11.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I11.i4.p1" class="ltx_para">
<span id="A4.I11.i4.p1.1" class="ltx_p"><span id="A4.I11.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Examine whether missingness, measurement frequency, or source-specific recording patterns may introduce artifacts or reduce generalizability.</span></span>
</span></span>
</span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.11" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.11.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">PART 4: Refinement Recommendations<span id="A4.SS1.SSS0.Px4.p2.pic1.2.11.1.1" class="ltx_text"></span></span></span>
<span id="A4.I12" class="ltx_itemize">
<span id="A4.I12.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I12.i1.p1" class="ltx_para">
<span id="A4.I12.i1.p1.1" class="ltx_p"><span id="A4.I12.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Identify the highest-impact limitations of the current preprocessing strategy.</span></span>
</span></span>
<span id="A4.I12.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I12.i2.p1" class="ltx_para">
<span id="A4.I12.i2.p1.1" class="ltx_p"><span id="A4.I12.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Provide concrete and actionable recommendations for the next preprocessing iteration.</span></span>
</span></span>
<span id="A4.I12.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I12.i3.p1" class="ltx_para">
<span id="A4.I12.i3.p1.1" class="ltx_p"><span id="A4.I12.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Preserve strategies supported by positive execution or validation evidence.</span></span>
</span></span>
<span id="A4.I12.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I12.i4.p1" class="ltx_para">
<span id="A4.I12.i4.p1.1" class="ltx_p"><span id="A4.I12.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">If performance has stagnated or degraded across previous iterations, identify likely causes and recommend meaningful changes rather than minor variations of unsuccessful strategies.</span></span>
</span></span>
</span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.12" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.12.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">OUTPUT<span id="A4.SS1.SSS0.Px4.p2.pic1.2.12.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.13" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.13.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Return a concise four-part evaluation containing actionable textual feedback for subsequent local prompt refinement. Do not output executable code.</span></span>
</span></span></span></foreignobject></g></g></g></svg>