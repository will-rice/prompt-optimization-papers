<br class="ltx_break">
<br class="ltx_break">1. <span id="A3.F10.pic1.2.2.1.1" class="ltx_text ltx_font_italic">Faithfulness to Prompt</span>: Does the image accurately reflect the user’s input prompt in terms of objects, attributes, style, and composition? 
<br class="ltx_break">2. <span id="A3.F10.pic1.2.2.1.2" class="ltx_text ltx_font_italic">Aesthetic Quality</span>: Is the image visually appealing, well-composed, and artistically pleasant from a human perspective? 
<br class="ltx_break">
<br class="ltx_break">Please rate this image on a scale of 0-10 (10 being perfect) and explain your reasoning. Please put your score in <math id="A3.F10.pic1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>score<math id="A3.F10.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> score <math id="A3.F10.pic1.m3" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/score<math id="A3.F10.pic1.m4" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>. Prompt: {prompt}</span></span>
