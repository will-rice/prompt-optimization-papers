<span id="A3.F9.pic1.2.1" class="ltx_p"><span id="A3.F9.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">User Prompt:<span id="A3.F9.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
You are an expert evaluator of text-to-image alignment. Your primary goal is to check whether the image faithfully matches the input prompt. Pay special attention to object identity, count, attributes (such as color, size, shape), and spatial relationships.
<br class="ltx_break">Penalize any elements that are not requested in the prompt — unnecessary decorations, background additions, or irrelevant visual noise. Missing or incorrect objects should also lower the score.
<br class="ltx_break">The best images are object-centric: focused on the entities and relationships specified in the prompt, while also being visually coherent and pleasant.
<br class="ltx_break">
<br class="ltx_break">Please rate this image on a scale of 0-10 (10 being perfect) and explain your reasoning. Please put your score in <math id="A3.F9.pic1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>score<math id="A3.F9.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> score <math id="A3.F9.pic1.m3" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/score<math id="A3.F9.pic1.m4" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>. Prompt: {p}</span></span></span>
