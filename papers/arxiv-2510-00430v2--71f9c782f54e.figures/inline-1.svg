<span id="A3.F7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:49.27em;">
<span id="A3.F7.pic1.2.1" class="ltx_p"><span id="A3.F7.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">User Prompt:<span id="A3.F7.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A3.F7.pic1.2.2" class="ltx_p"><span id="A3.F7.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are helping to refine a prompt for an image generation diffusion model. At each timestep, you are given the input prompt, lastly improved prompt with timestep, current timestep, total timesteps, a target reward function, and the partially generated image at the current diffusion timestep. Your task is to suggest an improved prompt that better aligns with the goal. Do not attempt to correct blurriness, as the partially generated image is expected to be unclear during diffusion.

<br class="ltx_break">
<br class="ltx_break">Respond <span id="A3.F7.pic1.2.2.1.1" class="ltx_text ltx_font_italic">only</span> with a valid JSON object in the following format without any other text:</span></span><pre id="A3.F7.pic1.2.3" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
{
  &quot;improved_prompt&quot;: &quot;&lt;your improved prompt string&gt;&quot;
}

</pre>
<span id="A3.F7.pic1.2.4" class="ltx_p"><span id="A3.F7.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Input:</span></span><pre id="A3.F7.pic1.2.5" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
{
  &quot;input_prompt&quot;: {input_prompt},
  &quot;last_prompt&quot;: {applied_prompt},
  &quot;target_reward&quot;: {target_reward},
  &quot;current_timestep&quot;: {current_timestep},
  &quot;total_timesteps&quot;: {total_timesteps},
}
</pre>
</span></span></span></foreignobject></g></g></svg>