<span id="A3.F8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.72em;">
<span id="A3.F8.pic1.1.1" class="ltx_p"><span id="A3.F8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Policy Model Prompt (Composite Reward)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.89)"><foreignobject style="--ltx-fo-width:49.27em;--ltx-fo-height:21.42em;--ltx-fo-depth:0.24em;font-size:9.25pt;" height="277.33" overflow="visible" transform="matrix(1 0 0 -1 0 274.22)" width="630.62"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.F8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:49.27em;">
<span id="A3.F8.pic1.2.1" class="ltx_p"><span id="A3.F8.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">User Prompt:<span id="A3.F8.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A3.F8.pic1.2.2" class="ltx_p"><span id="A3.F8.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are helping to refine a prompt for an image generation diffusion model. 
<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A3.F8.pic1.2.3" class="ltx_p"><span id="A3.F8.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">[IMPORTANT] However, you must make <span id="A3.F8.pic1.2.3.1.1" class="ltx_text ltx_font_italic">minimal changes</span> to the original user’s input and <span id="A3.F8.pic1.2.3.1.2" class="ltx_text ltx_font_italic">keep the prompt as simple as possible</span>. I <span id="A3.F8.pic1.2.3.1.3" class="ltx_text ltx_font_italic">strongly</span> recommend <span id="A3.F8.pic1.2.3.1.4" class="ltx_text ltx_font_italic">not modifying</span> the input prompt if possible. [IMPORTANT] 
<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A3.F8.pic1.2.4" class="ltx_p"><span id="A3.F8.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Respond <span id="A3.F8.pic1.2.4.1.1" class="ltx_text ltx_font_italic">only</span> with a valid JSON object in the following format without any other text:</span></span><pre id="A3.F8.pic1.2.5" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{
  &quot;improved_prompt&quot;: &quot;&lt;your improved prompt string&gt;&quot;
}

</pre>
<span id="A3.F8.pic1.2.6" class="ltx_p"><span id="A3.F8.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Input:</span></span><pre id="A3.F8.pic1.2.7" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
{
  &quot;input_prompt&quot;: {input_prompt},
  &quot;last_prompt&quot;: {applied_prompt},
  &quot;target_reward&quot;: {target_reward},
  &quot;current_timestep&quot;: {current_timestep},
  &quot;total_timesteps&quot;: {total_timesteps},
}
</pre>
</span></span></span></foreignobject></g></g></svg>