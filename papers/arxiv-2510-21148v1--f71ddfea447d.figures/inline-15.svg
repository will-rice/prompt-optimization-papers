<span id="S8.I4.i1.p1.1" class="ltx_p"><span id="S8.I4.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Demographic Information]</span></span>
</span></span>
<span id="S8.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S8.I4.i2.p1" class="ltx_para">
<span id="S8.I4.i2.p1.1" class="ltx_p"><span id="S8.I4.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Healthcare System Condition]</span></span>
</span></span>
<span id="S8.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S8.I4.i3.p1" class="ltx_para">
<span id="S8.I4.i3.p1.1" class="ltx_p"><span id="S8.I4.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[ICU and Hospital Staffing Condition]</span></span>
</span></span>
<span id="S8.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S8.I4.i4.p1" class="ltx_para">
<span id="S8.I4.i4.p1.1" class="ltx_p"><span id="S8.I4.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Vaccination Coverage]</span></span>
