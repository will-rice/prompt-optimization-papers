<br class="ltx_break">Your revised prompt must follow the structure below:</span></span></span>
<span id="S8.I3" class="ltx_itemize" style="--ltx-enum-leftmargin:1.5em;">
<span id="S8.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
