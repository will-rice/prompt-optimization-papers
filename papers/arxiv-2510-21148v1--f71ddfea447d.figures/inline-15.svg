<div class="ltx_pagination ltx_role_end_2_columns"></div>
<span id="S8.SS10.p1.pic1.2.3" class="ltx_p"><span id="S8.SS10.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Operations<span id="S8.SS10.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You can only use the following operations:
<br class="ltx_break"></span>[1] Add<span id="S8.SS10.p1.pic1.2.3.1.2" class="ltx_text ltx_font_medium"> new causal relations if they are clearly supported by the input. Do not make assumptions without evidence. Use the format:</span></span></span>
<span id="S8.SS10.p1.pic1.2.4" class="ltx_quote">
<span id="S8.SS10.p1.pic1.2.4.1" class="ltx_p"><span id="S8.SS10.p1.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Node A] affects [Node B]</span><span id="S8.SS10.p1.pic1.2.4.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="S8.SS10.p1.pic1.2.4.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">(Explanation of how [Node A] affects [Node B])</span></span>
</span>
<span id="S8.SS10.p1.pic1.2.5" class="ltx_p"><span id="S8.SS10.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Both <span id="S8.SS10.p1.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">[Node A]</span> and <span id="S8.SS10.p1.pic1.2.5.1.2" class="ltx_text ltx_font_typewriter">[Node B]</span> must come from the list above. You may include node-to-node relations not involving the final prediction target to support broader reasoning and imputation.</span></span>
<span id="S8.SS10.p1.pic1.2.6" class="ltx_p"><span id="S8.SS10.p1.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[2] Modify<span id="S8.SS10.p1.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> existing causal relations. You may:</span></span></span>
<span id="S8.I5" class="ltx_itemize" style="--ltx-enum-leftmargin:1.5em;">
<span id="S8.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S8.I5.i1.p1" class="ltx_para">
<span id="S8.I5.i1.p1.1" class="ltx_p"><span id="S8.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Replace </span><span id="S8.I5.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Node A] affects [Node B]</span><span id="S8.I5.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> with a more accurate link such as </span><span id="S8.I5.i1.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Node A] affects [Node C]</span></span>
</span></span>
<span id="S8.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S8.I5.i2.p1" class="ltx_para">
<span id="S8.I5.i2.p1.1" class="ltx_p"><span id="S8.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Update the explanation for clarity or correctness</span></span>
</span></span>
</span>
<span id="S8.SS10.p1.pic1.2.7" class="ltx_p"><span id="S8.SS10.p1.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[3] Delete<span id="S8.SS10.p1.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> any causal relation that is unsupported or may negatively impact model inference.
<br class="ltx_break">Remove both the relation and its explanation.</span></span></span>
</span></span></span></foreignobject></g></g></svg>