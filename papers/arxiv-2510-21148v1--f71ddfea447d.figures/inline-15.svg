<span id="S8.I4.i6.p1" class="ltx_para">
<span id="S8.I4.i6.p1.1" class="ltx_p"><span id="S8.I4.i6.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Restriction Policy Response]</span></span>
