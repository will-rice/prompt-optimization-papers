</span></span>
<span id="S8.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S8.I3.i3.p1" class="ltx_para">
<span id="S8.I3.i3.p1.1" class="ltx_p"><span id="S8.I3.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;Output&gt;
<br class="ltx_break"></span><span id="S8.I3.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">(output format, fixed, don’t revise this)</span>
<br class="ltx_break"><span id="S8.I3.i3.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;\Output&gt;</span></span>
</span></span>
</span>
<span id="S8.SS10.p1.pic1.2.2" class="ltx_p"><span id="S8.SS10.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Causal Relations Guidelines<span id="S8.SS10.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Only include causal relations between nodes for which corresponding information is available in the input description:</span></span></span>
<div class="ltx_pagination ltx_role_start_2_columns"></div>
<span id="S8.I4" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="S8.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
