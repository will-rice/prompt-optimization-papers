<svg id="S8.SS8.p1.pic1" class="ltx_picture" height="1027.82" overflow="visible" version="1.1" viewbox="0 0 477.38 1027.82" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1027.82) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CCCCCC;" fill="#CCCCCC" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1021.92 C 0 1025.18 2.64 1027.82 5.91 1027.82 L 471.47 1027.82 C 474.73 1027.82 477.38 1025.18 477.38 1021.92 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1003.71 L 475.41 1003.71 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1012.31)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S8.SS8.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="S8.SS8.p1.pic1.1.1" class="ltx_p"><span id="S8.SS8.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt 8.5: Initial SCG for Pandemic Dataset</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:70.5em;--ltx-fo-depth:0.19em;font-size:10pt;" height="978.13" overflow="visible" transform="matrix(1 0 0 -1 0 975.44)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S8.SS8.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S8.SS8.p1.pic1.2.1" class="ltx_p"><span id="S8.SS8.p1.pic1.2.1.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000099;">Causal Statement 1</span><span id="S8.SS8.p1.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: <span id="S8.SS8.p1.pic1.2.1.2.1" class="ltx_text ltx_font_bold">[Demographic Information]</span> affects <span id="S8.SS8.p1.pic1.2.1.2.2" class="ltx_text ltx_font_bold">[Vaccination Coverage]</span> and <span id="S8.SS8.p1.pic1.2.1.2.3" class="ltx_text ltx_font_bold">[Restriction Policy Response]</span>. 
<br class="ltx_break">Older or vulnerable populations often have higher vaccination uptake and are more likely to be targeted by stricter restrictions. 
<br class="ltx_break"></span></span>
<span id="S8.SS8.p1.pic1.2.2" class="ltx_p"><span id="S8.SS8.p1.pic1.2.2.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000099;">Causal Statement 2</span><span id="S8.SS8.p1.pic1.2.2.2" class="ltx_text" style="--ltx-fg-color:#000000;">: <span id="S8.SS8.p1.pic1.2.2.2.1" class="ltx_text ltx_font_bold">[Healthcare System Condition]</span> affects <span id="S8.SS8.p1.pic1.2.2.2.2" class="ltx_text ltx_font_bold">[Vaccination Coverage]</span> and <span id="S8.SS8.p1.pic1.2.2.2.3" class="ltx_text ltx_font_bold">[Population Immunity]</span>. 
<br class="ltx_break">Regions with better healthcare access can distribute vaccines more effectively and maintain higher baseline immunity. 
<br class="ltx_break"></span></span>
<span id="S8.SS8.p1.pic1.2.3" class="ltx_p"><span id="S8.SS8.p1.pic1.2.3.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000099;">Causal Statement 3</span><span id="S8.SS8.p1.pic1.2.3.2" class="ltx_text" style="--ltx-fg-color:#000000;">: <span id="S8.SS8.p1.pic1.2.3.2.1" class="ltx_text ltx_font_bold">[ICU and Hospital Staffing Condition]</span> affects <span id="S8.SS8.p1.pic1.2.3.2.2" class="ltx_text ltx_font_bold">[Restriction Policy Response]</span>. 
<br class="ltx_break">When ICU beds are full or staffing is limited, governments tend to implement stricter control policies. 
<br class="ltx_break"></span></span>
<span id="S8.SS8.p1.pic1.2.4" class="ltx_p"><span id="S8.SS8.p1.pic1.2.4.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000099;">Causal Statement 4</span><span id="S8.SS8.p1.pic1.2.4.2" class="ltx_text" style="--ltx-fg-color:#000000;">: <span id="S8.SS8.p1.pic1.2.4.2.1" class="ltx_text ltx_font_bold">[Vaccination Coverage]</span> affects <span id="S8.SS8.p1.pic1.2.4.2.2" class="ltx_text ltx_font_bold">[Population Immunity]</span>. 
<br class="ltx_break">Higher vaccination coverage directly increases the proportion of immune individuals in the population. 
<br class="ltx_break"></span></span>
<span id="S8.SS8.p1.pic1.2.5" class="ltx_p"><span id="S8.SS8.p1.pic1.2.5.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000099;">Causal Statement 5</span><span id="S8.SS8.p1.pic1.2.5.2" class="ltx_text" style="--ltx-fg-color:#000000;">: <span id="S8.SS8.p1.pic1.2.5.2.1" class="ltx_text ltx_font_bold">[Population Immunity]</span> affects <span id="S8.SS8.p1.pic1.2.5.2.2" class="ltx_text ltx_font_bold">[Reported Cases per 100k]</span> and <span id="S8.SS8.p1.pic1.2.5.2.3" class="ltx_text ltx_font_bold">[Hospitalization per 100k]</span>. 
<br class="ltx_break">Stronger immunity reduces both the number of new infections and the chance of severe cases needing hospitalization. 
<br class="ltx_break"></span></span>
<span id="S8.SS8.p1.pic1.2.6" class="ltx_p"><span id="S8.SS8.p1.pic1.2.6.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000099;">Causal Statement 6</span><span id="S8.SS8.p1.pic1.2.6.2" class="ltx_text" style="--ltx-fg-color:#000000;">: <span id="S8.SS8.p1.pic1.2.6.2.1" class="ltx_text ltx_font_bold">[Reported Cases per 100k]</span> affects <span id="S8.SS8.p1.pic1.2.6.2.2" class="ltx_text ltx_font_bold">[Hospitalization per 100k]</span> and <span id="S8.SS8.p1.pic1.2.6.2.3" class="ltx_text ltx_font_bold">[Restriction Policy Response]</span>. 
<br class="ltx_break">A rise in reported cases usually precedes more hospital admissions and can trigger policy tightening. 
<br class="ltx_break"></span></span>
<span id="S8.SS8.p1.pic1.2.7" class="ltx_p"><span id="S8.SS8.p1.pic1.2.7.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000099;">Causal Statement 7</span><span id="S8.SS8.p1.pic1.2.7.2" class="ltx_text" style="--ltx-fg-color:#000000;">: <span id="S8.SS8.p1.pic1.2.7.2.1" class="ltx_text ltx_font_bold">[Hospitalization per 100k]</span> affects <span id="S8.SS8.p1.pic1.2.7.2.2" class="ltx_text ltx_font_bold">[Restriction Policy Response]</span>. 
<br class="ltx_break">High hospitalization levels often lead to immediate government intervention to limit further spread. 
<br class="ltx_break"></span></span>
<span id="S8.SS8.p1.pic1.2.8" class="ltx_p"><span id="S8.SS8.p1.pic1.2.8.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000099;">Causal Statement 8</span><span id="S8.SS8.p1.pic1.2.8.2" class="ltx_text" style="--ltx-fg-color:#000000;">: <span id="S8.SS8.p1.pic1.2.8.2.1" class="ltx_text ltx_font_bold">[Hospitalization per 100k]</span> and <span id="S8.SS8.p1.pic1.2.8.2.2" class="ltx_text ltx_font_bold">[Restriction Policy Response]</span> affect <span id="S8.SS8.p1.pic1.2.8.2.3" class="ltx_text ltx_font_bold">[Change of Hospitalization Next Week]</span>. 
<br class="ltx_break">The trends of hospitalization in past weeks have strong relation with change of hospitalization next week. 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>