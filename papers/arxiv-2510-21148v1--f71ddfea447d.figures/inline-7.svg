<span id="S8.SS7.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="S8.SS7.p2.pic1.1.1" class="ltx_p"><span id="S8.SS7.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt 8.3: Example of Organized Prompts for TrafficSafe Dataset</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 30.92)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:77.95em;--ltx-fo-depth:1.24em;font-size:10pt;" height="1095.75" overflow="visible" transform="matrix(1 0 0 -1 0 1078.61)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S8.SS7.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S8.SS7.p2.pic1.2.1" class="ltx_p"><span id="S8.SS7.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[System Prompt]<span id="S8.SS7.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Predict the crash severity reasoning on the causal descriptions provided between the crash event details provided between <span id="S8.SS7.p2.pic1.2.1.1.1.1" class="ltx_text ltx_font_typewriter">&lt;Crash Description&gt;</span> and <span id="S8.SS7.p2.pic1.2.1.1.1.2" class="ltx_text ltx_font_typewriter">&lt;\Crash Description&gt;</span>. 
<br class="ltx_break">Provide a single prediction enclosed in <span id="S8.SS7.p2.pic1.2.1.1.1.3" class="ltx_text ltx_font_typewriter">&lt; &gt;</span> using one of the following labels: 
<br class="ltx_break"><span id="S8.SS7.p2.pic1.2.1.1.1.4" class="ltx_text ltx_font_typewriter">&lt;no apparent injury&gt;</span>, <span id="S8.SS7.p2.pic1.2.1.1.1.5" class="ltx_text ltx_font_typewriter">&lt;minor injury&gt;</span>, <span id="S8.SS7.p2.pic1.2.1.1.1.6" class="ltx_text ltx_font_typewriter">&lt;serious injury&gt;</span>, <span id="S8.SS7.p2.pic1.2.1.1.1.7" class="ltx_text ltx_font_typewriter">&lt;fatal&gt;</span>. 
<br class="ltx_break">The last line of your response should only be of the following format: <span id="S8.SS7.p2.pic1.2.1.1.1.8" class="ltx_text ltx_font_typewriter">&lt;VALUE&gt;</span> where <span id="S8.SS7.p2.pic1.2.1.1.1.9" class="ltx_text ltx_font_typewriter">VALUE</span> is your prediction. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p2.pic1.2.2" class="ltx_p"><span id="S8.SS7.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;Crash Description&gt;<span id="S8.SS7.p2.pic1.2.2.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"><span id="S8.SS7.p2.pic1.2.2.1.1.1" class="ltx_text ltx_font_bold">[Time]</span> The crash occurred on April 29, 2022 at hour 16. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p2.pic1.2.3" class="ltx_p"><span id="S8.SS7.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Position]<span id="S8.SS7.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> The crash occurred in Champaign, within an Unincorporated area. It did not occur in a work zone. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p2.pic1.2.4" class="ltx_p"><span id="S8.SS7.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Dynamic Conditions]<span id="S8.SS7.p2.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> The light condition is Daylight and the weather condition is Clear. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p2.pic1.2.5" class="ltx_p"><span id="S8.SS7.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Infrastructure]<span id="S8.SS7.p2.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> The crash is not at an intersection. The traffic control device is Other Regulatory Sig. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p2.pic1.2.6" class="ltx_p"><span id="S8.SS7.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Road Surface]<span id="S8.SS7.p2.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> The road surface condition is Dry. The road defect condition is nan. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p2.pic1.2.7" class="ltx_p"><span id="S8.SS7.p2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Road Level]<span id="S8.SS7.p2.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> The trafficway is Not Divided Two-way. The functional class of the roadway is Minor Arterial. The roadway class is Rural 2 Lane Roads. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p2.pic1.2.8" class="ltx_p"><span id="S8.SS7.p2.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Driver Behavior]<span id="S8.SS7.p2.pic1.2.8.1.1" class="ltx_text ltx_font_medium"> The primary behavior is Driving On Wrong Side/Wrong Way, and the secondary behavior is Improper Lane Usage. The crash is not a hit-and-run incident. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p2.pic1.2.9" class="ltx_p"><span id="S8.SS7.p2.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Vehicle 1 Vehicle Information]<span id="S8.SS7.p2.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> The vehicle had a defect of None and was manufactured in 2004. 
<br class="ltx_break"></span>[Vehicle 2 Vehicle Information]<span id="S8.SS7.p2.pic1.2.9.1.2" class="ltx_text ltx_font_medium"> The vehicle had a defect of None and was manufactured in 2002. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p2.pic1.2.10" class="ltx_p"><span id="S8.SS7.p2.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Vehicle 1 Vehicle Status]<span id="S8.SS7.p2.pic1.2.10.1.1" class="ltx_text ltx_font_medium"> The unit locates at On Pavement (Roadway). The vehicle’s maneuver prior to the crash was Passing/Overtaking and it was traveling in the North direction. 
<br class="ltx_break"></span>[Vehicle 2 Vehicle Status]<span id="S8.SS7.p2.pic1.2.10.1.2" class="ltx_text ltx_font_medium"> The unit locates at On Pavement (Roadway). The vehicle’s maneuver prior to the crash was Straight Ahead and it was traveling in the South direction. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p2.pic1.2.11" class="ltx_p"><span id="S8.SS7.p2.pic1.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Person 1 Person Information]<span id="S8.SS7.p2.pic1.2.11.1.1" class="ltx_text ltx_font_medium"> This person was in Vehicle Unit 1. The person involved is a Driver, aged 39. Gender is Male. 
<br class="ltx_break"></span>[Person 2 Person Information]<span id="S8.SS7.p2.pic1.2.11.1.2" class="ltx_text ltx_font_medium"> This person was in Vehicle Unit 2. The person involved is a Driver, aged 70. Gender is Male. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p2.pic1.2.12" class="ltx_p"><span id="S8.SS7.p2.pic1.2.12.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Person 1 Person Status]<span id="S8.SS7.p2.pic1.2.12.1.1" class="ltx_text ltx_font_medium"> The driver’s blood alcohol content is .000. Distraction status: No. Safety equipment used: Shoulder and Lap Belt Used. 
<br class="ltx_break"></span>[Person 2 Person Status]<span id="S8.SS7.p2.pic1.2.12.1.2" class="ltx_text ltx_font_medium"> The driver’s blood alcohol content is Not Tested. Distraction status: No. Safety equipment used: Shoulder and Lap Belt Used. 
<br class="ltx_break"><span id="S8.SS7.p2.pic1.2.12.1.2.1" class="ltx_text ltx_font_typewriter">&lt;\Crash Description&gt;</span> 
<br class="ltx_break"></span></span></span><span class="ltx_rule" style="width:313.7pt;height:0.5pt;--ltx-bg-color:black;display:inline-block;"> </span>
<span id="S8.SS7.p2.pic1.2.13" class="ltx_p"><span id="S8.SS7.p2.pic1.2.13.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000080;">[Crash Severity (Ground Truth)]<span id="S8.SS7.p2.pic1.2.13.1.1" class="ltx_text ltx_font_medium"> <span id="S8.SS7.p2.pic1.2.13.1.1.1" class="ltx_text ltx_font_typewriter">&lt;fatal&gt;</span><span id="S8.SS7.p2.pic1.2.13.1.1.2" class="ltx_text"></span></span></span></span>
</span></span></span></foreignobject></g></g></svg>