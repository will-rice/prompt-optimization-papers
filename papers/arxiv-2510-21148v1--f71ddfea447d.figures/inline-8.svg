<span id="S8.SS7.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="S8.SS7.p3.pic1.1.1" class="ltx_p"><span id="S8.SS7.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt 8.4: Example of Organized Prompts for Swissmetro Dataset</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 30.92)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:62.95em;--ltx-fo-depth:1.24em;font-size:10pt;" height="888.2" overflow="visible" transform="matrix(1 0 0 -1 0 871.05)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S8.SS7.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S8.SS7.p3.pic1.2.1" class="ltx_p"><span id="S8.SS7.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[System Prompt]<span id="S8.SS7.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Predict the travel mode choice reasoning on the causal descriptions provided between <span id="S8.SS7.p3.pic1.2.1.1.1.1" class="ltx_text ltx_font_typewriter">&lt;Causal Description&gt;</span> and <span id="S8.SS7.p3.pic1.2.1.1.1.2" class="ltx_text ltx_font_typewriter">&lt;\Causal Description&gt;</span>, and the traveler details provided between <span id="S8.SS7.p3.pic1.2.1.1.1.3" class="ltx_text ltx_font_typewriter">&lt;Traveler Description&gt;</span> and <span id="S8.SS7.p3.pic1.2.1.1.1.4" class="ltx_text ltx_font_typewriter">&lt;\Traveler Description&gt;</span>. 
<br class="ltx_break">Provide a single prediction enclosed in <span id="S8.SS7.p3.pic1.2.1.1.1.5" class="ltx_text ltx_font_typewriter">&lt; &gt;</span> using one of the following labels: 
<br class="ltx_break"><span id="S8.SS7.p3.pic1.2.1.1.1.6" class="ltx_text ltx_font_typewriter">&lt;swissmetro&gt;</span>, <span id="S8.SS7.p3.pic1.2.1.1.1.7" class="ltx_text ltx_font_typewriter">&lt;car&gt;</span>, <span id="S8.SS7.p3.pic1.2.1.1.1.8" class="ltx_text ltx_font_typewriter">&lt;train&gt;</span>. 
<br class="ltx_break">The final line of your response must follow this format: <span id="S8.SS7.p3.pic1.2.1.1.1.9" class="ltx_text ltx_font_typewriter">&lt;VALUE&gt;</span>, where <span id="S8.SS7.p3.pic1.2.1.1.1.10" class="ltx_text ltx_font_typewriter">VALUE</span> is your prediction. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p3.pic1.2.2" class="ltx_p"><span id="S8.SS7.p3.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;Traveler Description&gt;<span id="S8.SS7.p3.pic1.2.2.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"><span id="S8.SS7.p3.pic1.2.2.1.1.1" class="ltx_text ltx_font_bold">[trip_purpose]</span> The purpose of the trip is business. 
<br class="ltx_break"><span id="S8.SS7.p3.pic1.2.2.1.1.2" class="ltx_text ltx_font_bold">[trip_paid_by]</span> Traveler trip is paid by oneself. 
<br class="ltx_break"><span id="S8.SS7.p3.pic1.2.2.1.1.3" class="ltx_text ltx_font_bold">[luggage]</span> Traveler has no luggage. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p3.pic1.2.3" class="ltx_p"><span id="S8.SS7.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[first_class]<span id="S8.SS7.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> The traveler earns 100,000 CHF and does not travel in first class. 
<br class="ltx_break"></span>[rail_pass]<span id="S8.SS7.p3.pic1.2.3.1.2" class="ltx_text ltx_font_medium"> Traveler does not have a rail-system annual season ticket. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p3.pic1.2.4" class="ltx_p"><span id="S8.SS7.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[origin_destination]<span id="S8.SS7.p3.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> This trip starts at VD and ends at ZH. 
<br class="ltx_break"></span>[options_count]<span id="S8.SS7.p3.pic1.2.4.1.2" class="ltx_text ltx_font_medium"> Traveler has two possible travel options. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p3.pic1.2.5" class="ltx_p"><span id="S8.SS7.p3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[swissmetro_time_cost]<span id="S8.SS7.p3.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> Swissmetro’s travel time is 63 minutes and it costs 57 CHF. 
<br class="ltx_break"></span>[swissmetro_headway]<span id="S8.SS7.p3.pic1.2.5.1.2" class="ltx_text ltx_font_medium"> The headway of Swissmetro is 10 minutes. 
<br class="ltx_break"></span>[train_time_cost]<span id="S8.SS7.p3.pic1.2.5.1.3" class="ltx_text ltx_font_medium"> Train’s travel time is 192 minutes and it costs 52 CHF. 
<br class="ltx_break"></span>[train_headway]<span id="S8.SS7.p3.pic1.2.5.1.4" class="ltx_text ltx_font_medium"> The headway of train is 30 minutes. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p3.pic1.2.6" class="ltx_p"><span id="S8.SS7.p3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[income]<span id="S8.SS7.p3.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> Traveler’s annual income is between 50,000 and 100,000 CHF. 
<br class="ltx_break"></span>[age_range]<span id="S8.SS7.p3.pic1.2.6.1.2" class="ltx_text ltx_font_medium"> The traveler is between 39 and 54 years old. 
<br class="ltx_break"></span>[gender]<span id="S8.SS7.p3.pic1.2.6.1.3" class="ltx_text ltx_font_medium"> The traveler is female. 
<br class="ltx_break"><span id="S8.SS7.p3.pic1.2.6.1.3.1" class="ltx_text ltx_font_typewriter">&lt;\Traveler Description&gt;</span> 
<br class="ltx_break"></span></span></span><span class="ltx_rule" style="width:313.7pt;height:0.5pt;--ltx-bg-color:black;display:inline-block;"> </span>
<span id="S8.SS7.p3.pic1.2.7" class="ltx_p"><span id="S8.SS7.p3.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000080;">[Travel Mode Choice (Ground Truth)]<span id="S8.SS7.p3.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> <span id="S8.SS7.p3.pic1.2.7.1.1.1" class="ltx_text ltx_font_typewriter">&lt;car&gt;</span><span id="S8.SS7.p3.pic1.2.7.1.1.2" class="ltx_text"></span></span></span></span>
</span></span></span></foreignobject></g></g></svg>