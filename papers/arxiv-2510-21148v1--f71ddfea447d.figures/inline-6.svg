<svg id="S8.SS7.p1.pic1" class="ltx_picture" height="1207.55" overflow="visible" version="1.1" viewbox="0 0 477.38 1207.55" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1207.55) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CCCCCC;" fill="#CCCCCC" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1201.64 C 0 1204.91 2.64 1207.55 5.91 1207.55 L 471.47 1207.55 C 474.73 1207.55 477.38 1204.91 477.38 1201.64 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1169.53 L 475.41 1169.53 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1175.43)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:1.89em;--ltx-fo-depth:0em;font-size:10pt;" height="26.21" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S8.SS7.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="S8.SS7.p1.pic1.1.1" class="ltx_p"><span id="S8.SS7.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt 8.2: Example of Organized Prompts for Pandemic Dataset</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 33.46)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:81.25em;--ltx-fo-depth:1.42em;font-size:10pt;" height="1143.95" overflow="visible" transform="matrix(1 0 0 -1 0 1124.27)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S8.SS7.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S8.SS7.p1.pic1.2.1" class="ltx_p"><span id="S8.SS7.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[System Prompt]<span id="S8.SS7.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Predict the trend of hospitalizations for the next week based on the pandemic details provided between <span id="S8.SS7.p1.pic1.2.1.1.1.1" class="ltx_text ltx_font_typewriter">&lt;Pandemic Description&gt;</span> and <span id="S8.SS7.p1.pic1.2.1.1.1.2" class="ltx_text ltx_font_typewriter">&lt;\Pandemic Description&gt;</span>. 
<br class="ltx_break">Provide a single prediction enclosed in <span id="S8.SS7.p1.pic1.2.1.1.1.3" class="ltx_text ltx_font_typewriter">&lt; &gt;</span> using one of the following labels: 
<br class="ltx_break"><span id="S8.SS7.p1.pic1.2.1.1.1.4" class="ltx_text ltx_font_typewriter">&lt;substantial decreasing&gt;</span>, <span id="S8.SS7.p1.pic1.2.1.1.1.5" class="ltx_text ltx_font_typewriter">&lt;moderate decreasing&gt;</span>, <span id="S8.SS7.p1.pic1.2.1.1.1.6" class="ltx_text ltx_font_typewriter">&lt;stable&gt;</span>, <span id="S8.SS7.p1.pic1.2.1.1.1.7" class="ltx_text ltx_font_typewriter">&lt;moderate increasing&gt;</span>, <span id="S8.SS7.p1.pic1.2.1.1.1.8" class="ltx_text ltx_font_typewriter">&lt;substantial increasing&gt;</span>. 
<br class="ltx_break">Definitions: 
<br class="ltx_break"> – <span id="S8.SS7.p1.pic1.2.1.1.1.9" class="ltx_text ltx_font_typewriter">&quot;Substantial&quot;</span> refers to changes greater than 3. 
<br class="ltx_break"> – <span id="S8.SS7.p1.pic1.2.1.1.1.10" class="ltx_text ltx_font_typewriter">&quot;Moderate&quot;</span> corresponds to changes between 1 and 3. 
<br class="ltx_break"> – <span id="S8.SS7.p1.pic1.2.1.1.1.11" class="ltx_text ltx_font_typewriter">&quot;Stable&quot;</span> is defined as changes between -1 and 1. 
<br class="ltx_break">The final line of your response must follow this format: <span id="S8.SS7.p1.pic1.2.1.1.1.12" class="ltx_text ltx_font_typewriter">&lt;VALUE&gt;</span>, where <span id="S8.SS7.p1.pic1.2.1.1.1.13" class="ltx_text ltx_font_typewriter">VALUE</span> is your prediction. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p1.pic1.2.2" class="ltx_p"><span id="S8.SS7.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;Pandemic Description&gt;<span id="S8.SS7.p1.pic1.2.2.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"><span id="S8.SS7.p1.pic1.2.2.1.1.1" class="ltx_text ltx_font_bold">[Demographic Information]</span> Vermont, with one of the smallest populations and one of the smallest Black demographic groups, voted Democratic in the recent Presidential election. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p1.pic1.2.3" class="ltx_p"><span id="S8.SS7.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Healthcare System Condition]<span id="S8.SS7.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> During the pandemic, Vermont’s healthcare systems performed among the best, with above-national-average Access and Affordability, excellent Prevention and Treatment, better-than-average population health conditions, and reduced Income Disparity. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p1.pic1.2.4" class="ltx_p"><span id="S8.SS7.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[ICU and Hospital Staffing Condition]<span id="S8.SS7.p1.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> Vermont had ICU stress levels near the national average, but hospital staffing shortages worse than the national average. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p1.pic1.2.5" class="ltx_p"><span id="S8.SS7.p1.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Vaccination Coverage]<span id="S8.SS7.p1.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> As of now, 81% of the population has received at least one vaccine dose (Rapid Increase trend), 71% are fully vaccinated (Moderate Increase trend), and 23% received boosters (Rapid Increase trend). 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p1.pic1.2.6" class="ltx_p"><span id="S8.SS7.p1.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Population Immunity]<span id="S8.SS7.p1.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> Around 28% of the population reported infections in the past three months, and population immunity is showing a Rapid Increase. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p1.pic1.2.7" class="ltx_p"><span id="S8.SS7.p1.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Restriction Policy Response]<span id="S8.SS7.p1.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> School closures were recommended, but there were no restrictions for workplaces or gatherings among elderly patients. Isolation was recommended, and visitor restrictions were in place. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p1.pic1.2.8" class="ltx_p"><span id="S8.SS7.p1.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Hospitalization per 100k]<span id="S8.SS7.p1.pic1.2.8.1.1" class="ltx_text ltx_font_medium"> The average number of COVID-19 hospitalizations per 100K over the past five weeks was 9.8. Hospitalizations remained relatively stable, mostly between 9.0 and 11.2. A slight increase was observed in the most recent week, with a rate of change of 1.2. Volatility in hospitalization numbers was minimal, indicating consistent trends. 
<br class="ltx_break"></span></span></span>
<span id="S8.SS7.p1.pic1.2.9" class="ltx_p"><span id="S8.SS7.p1.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Reported Cases per 100k]<span id="S8.SS7.p1.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> In the most recent five weeks, reported COVID-19 cases per 100K showed a fluctuating trend. The average was 292.6. Cases declined from 263.8 to 216.0 over the first three weeks, then sharply increased to 340.1 in the fourth week and 398.7 in the fifth. These changes indicate a significant uptick in recent weeks, with inconsistent weekly trends. 
<br class="ltx_break"><span id="S8.SS7.p1.pic1.2.9.1.1.1" class="ltx_text ltx_font_typewriter">&lt;\Pandemic Description&gt;</span> 
<br class="ltx_break"></span></span></span><span class="ltx_rule" style="width:313.7pt;height:0.5pt;--ltx-bg-color:black;display:inline-block;"> </span>
<span id="S8.SS7.p1.pic1.2.10" class="ltx_p"><span id="S8.SS7.p1.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000080;">[Trend of Hospitalization (Ground Truth)]<span id="S8.SS7.p1.pic1.2.10.1.1" class="ltx_text ltx_font_medium"> <span id="S8.SS7.p1.pic1.2.10.1.1.1" class="ltx_text ltx_font_typewriter">&lt;moderate increasing&gt;</span><span id="S8.SS7.p1.pic1.2.10.1.1.2" class="ltx_text"></span></span></span></span>
</span></span></span></foreignobject></g></g></svg>