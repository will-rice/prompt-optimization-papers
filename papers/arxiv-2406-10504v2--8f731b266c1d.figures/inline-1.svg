<span id="A1.F4.pic1.1.1" class="ltx_p"><span id="A1.F4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Human Prompt
<br class="ltx_break"><span id="A1.F4.pic1.1.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">Let’s differentiate using step by step reasoning like a medical expert.
<br class="ltx_break"></span>Our Prompt
<br class="ltx_break"><span id="A1.F4.pic1.1.1.1.2" class="ltx_text ltx_font_typewriter">Introduction<span id="A1.F4.pic1.1.1.1.2.1" class="ltx_text ltx_font_medium">: In this task, you are given a medical question. You have to solve the question.
<br class="ltx_break"></span>Description<span id="A1.F4.pic1.1.1.1.2.2" class="ltx_text ltx_font_medium">: To solve medical questions effectively, it is important to understand various medical conditions, their progression, and associated clinical features.

<br class="ltx_break"></span>Background Knowledge<span id="A1.F4.pic1.1.1.1.2.3" class="ltx_text ltx_font_medium">:
Differential Diagnosis of Subcutaneous Nodules:
<br class="ltx_break">When evaluating subcutaneous nodules, consider mobility, consistency, and skin adherence. Epidermoid cysts are firm, non-tender, and the skin cannot be pinched over them. Lipomas are soft, mobile, and have pinchable skin.
<br class="ltx_break"></span>Corner Cases<span id="A1.F4.pic1.1.1.1.2.4" class="ltx_text ltx_font_medium">:
Antiretroviral Therapy Complications:
<br class="ltx_break">Doctor should be aware of the common side effects of antiretroviral drugs, with specific attention to the association between didanosine and pancreatitis, and the recommended management strategies, such as replacing didanosine with lamivudine.<span id="A1.F4.pic1.1.1.1.2.4.1" class="ltx_text ltx_font_serif">
</span></span></span></span></span>
