<span id="A4.p5.pic1.2.12" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                    context = context</span></span>
<span id="A4.p5.pic1.2.13" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                )</span></span>
<span id="A4.p5.pic1.2.14" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p5.pic1.2.15" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">        processed_query ← process(query)</span></span>
<span id="A4.p5.pic1.2.16" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">        retrieved_messages ← retrieve(processed_query)</span></span>
<span id="A4.p5.pic1.2.17" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">        context.append(retrieved_messages)</span></span>
<span id="A4.p5.pic1.2.18" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p5.pic1.2.19" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    answer ← <span id="A4.p5.pic1.2.19.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">generate_answer</span>(</span></span>
<span id="A4.p5.pic1.2.20" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                 question = inputs.question,</span></span>
<span id="A4.p5.pic1.2.21" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                 context = context</span></span>
<span id="A4.p5.pic1.2.22" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">             )</span></span>
<span id="A4.p5.pic1.2.23" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.23.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
