<span id="A4.p5.pic1.2.3" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    initialize LLM step <span id="A4.p5.pic1.2.3.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">generate_answer</span></span></span>
<span id="A4.p5.pic1.2.4" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    initialize retriever with top_k = 3</span></span>
<span id="A4.p5.pic1.2.5" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p5.pic1.2.6" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">Function forward(inputs):</span></span>
<span id="A4.p5.pic1.2.7" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    context ← empty list</span></span>
<span id="A4.p5.pic1.2.8" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p5.pic1.2.9" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    repeat for N hops (N = 2):</span></span>
<span id="A4.p5.pic1.2.10" class="ltx_p" style="width:454.0pt;"><span id="A4.p5.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">        query ← <span id="A4.p5.pic1.2.10.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">generate_query</span>(</span></span>
