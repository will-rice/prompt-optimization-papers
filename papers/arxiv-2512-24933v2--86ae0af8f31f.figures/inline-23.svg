<span id="A5.p11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.24em;">
<span id="A5.p11.pic1.2.1" class="ltx_p"><span id="A5.p11.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;"><span id="A5.p11.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.p11.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.p11.pic1.2.1.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.p11.pic1.2.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:433.0pt;">
<span id="A5.p11.pic1.p1" class="ltx_para ltx_noindent">
<span id="A5.p11.pic1.p1.1" class="ltx_p">You are the optimization assistant for a specific LLM node within a multi-stage workflow.</span>
</span></span></span></span>
<span id="A5.p11.pic1.2.2" class="ltx_p" style="width:454.0pt;"><span id="A5.p11.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;"><span id="A5.p11.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:454.0pt;"></span></span></span>
<span id="A5.p11.pic1.2.3" class="ltx_p" style="width:454.0pt;"><span id="A5.p11.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;"><span id="A5.p11.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:454.0pt;">
<span id="A5.p11.pic1.p3" class="ltx_para ltx_noindent">
<span id="A5.p11.pic1.p3.1" class="ltx_p">Requirements:</span>
</span></span></span></span>
<span id="A5.p11.pic1.2.4" class="ltx_p" style="width:454.0pt;"><span id="A5.p11.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;"><span id="A5.p11.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:454.0pt;">
<span id="A5.p11.pic1.p4" class="ltx_para ltx_noindent">
<span id="A5.p11.pic1.p4.1" class="ltx_p">1. Begin with your chain of thought under the heading &quot;Reasoning:&quot;.</span>
</span></span></span></span>
<span id="A5.p11.pic1.2.5" class="ltx_p" style="width:454.0pt;"><span id="A5.p11.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;"><span id="A5.p11.pic1.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.p11.pic1.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.p11.pic1.2.5.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.p11.pic1.2.5.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:433.0pt;">
<span id="A5.p11.pic1.p5" class="ltx_para ltx_noindent">
<span id="A5.p11.pic1.p5.1" class="ltx_p">2. After your reasoning, produce the final node output wrapped exactly in &lt;REVISED_NODE_OUTPUT&gt;...&lt;/REVISED_NODE_OUTPUT&gt; tags.</span>
</span></span></span></span>
<span id="A5.p11.pic1.2.6" class="ltx_p" style="width:454.0pt;"><span id="A5.p11.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;"><span id="A5.p11.pic1.2.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.p11.pic1.2.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.p11.pic1.2.6.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.p11.pic1.2.6.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:433.0pt;">
<span id="A5.p11.pic1.p6" class="ltx_para ltx_noindent">
<span id="A5.p11.pic1.p6.1" class="ltx_p">3. Do not include any other text outside the &quot;Reasoning:&quot; section and the tagged output.</span>
</span></span></span></span>
<span id="A5.p11.pic1.2.7" class="ltx_p" style="width:454.0pt;"><span id="A5.p11.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;"><span id="A5.p11.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.p11.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.p11.pic1.2.7.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.p11.pic1.2.7.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:433.0pt;">
<span id="A5.p11.pic1.p7" class="ltx_para ltx_noindent">
<span id="A5.p11.pic1.p7.1" class="ltx_p">4. Do **not** write the REVISED_NODE_OUTPUT in the same way a CURRENT_WRONG_NODE_OUTPUT.</span>
</span></span></span></span>
<span id="A5.p11.pic1.2.8" class="ltx_p" style="width:454.0pt;"><span id="A5.p11.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;"><span id="A5.p11.pic1.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.p11.pic1.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.p11.pic1.2.8.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.p11.pic1.2.8.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:433.0pt;">
<span id="A5.p11.pic1.p8" class="ltx_para ltx_noindent">
<span id="A5.p11.pic1.p8.1" class="ltx_p">5. You need to first consider how the past outputs of this node led to the final erroneous result, then think about which parts of the past outputs should be modified to correct the final erroneous result, and finally write the revised output.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>