<span id="A4.p11.pic1.1.1" class="ltx_p"><span id="A4.p11.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Pseudocode of Pipeline for Harmful</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 8.57)"><foreignobject style="--ltx-fo-width:43.24em;--ltx-fo-height:73.81em;--ltx-fo-depth:0em;font-size:10pt;" height="1021.34" overflow="visible" transform="matrix(1 0 0 -1 0 1021.34)" width="598.32"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.24em;">
<span id="A4.p11.pic1.2.1" class="ltx_p"><span id="A4.p11.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">Initialize Workflow:</span></span>
<span id="A4.p11.pic1.2.2" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    initialize LLM step <span id="A4.p11.pic1.2.2.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">internet_user</span></span></span>
<span id="A4.p11.pic1.2.3" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    initialize LLM step <span id="A4.p11.pic1.2.3.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">internet_supervisor</span></span></span>
<span id="A4.p11.pic1.2.4" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    initialize LLM step <span id="A4.p11.pic1.2.4.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">check_info_sufficiency</span></span></span>
<span id="A4.p11.pic1.2.5" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    initialize LLM step <span id="A4.p11.pic1.2.5.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">summary</span></span></span>
<span id="A4.p11.pic1.2.6" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.7" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">Function forward(inputs):</span></span>
<span id="A4.p11.pic1.2.8" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    # Extract multimodal meme information</span></span>
<span id="A4.p11.pic1.2.9" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    meme_description ← describe_image(inputs.image_path)</span></span>
<span id="A4.p11.pic1.2.10" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    meme_text ← extract_text(inputs.image_path)</span></span>
<span id="A4.p11.pic1.2.11" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    celebrity_info ← recognize_celebrities(inputs.image_path)</span></span>
<span id="A4.p11.pic1.2.12" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.13" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    # Assemble structured meme description</span></span>
<span id="A4.p11.pic1.2.14" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    description ← (meme_description, meme_text, celebrity_info)</span></span>
<span id="A4.p11.pic1.2.15" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.16" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    # Initialize dialogue history</span></span>
<span id="A4.p11.pic1.2.17" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    history ← empty dictionary</span></span>
<span id="A4.p11.pic1.2.18" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.19" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    # Define participating LLM steps</span></span>
<span id="A4.p11.pic1.2.20" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    characters ← [&quot;Internet User&quot;, &quot;Internet Supervisor&quot;]</span></span>
<span id="A4.p11.pic1.2.21" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    LLM_steps ← {</span></span>
<span id="A4.p11.pic1.2.22" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">        &quot;Internet User&quot;: <span id="A4.p11.pic1.2.22.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">internet_user</span>,</span></span>
<span id="A4.p11.pic1.2.23" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.23.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">        &quot;Internet Supervisor&quot;: <span id="A4.p11.pic1.2.23.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">internet_supervisor</span></span></span>
<span id="A4.p11.pic1.2.24" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.24.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    }</span></span>
<span id="A4.p11.pic1.2.25" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.25.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    round ← 1</span></span>
<span id="A4.p11.pic1.2.26" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.26.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.27" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.27.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    # Multi-round, multi-characters discussion loop</span></span>
<span id="A4.p11.pic1.2.28" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.28.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    while round &lt;= 10:</span></span>
<span id="A4.p11.pic1.2.29" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.29.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">        for each character in characters:</span></span>
<span id="A4.p11.pic1.2.30" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.30.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">            # Construct dialogue context from history</span></span>
<span id="A4.p11.pic1.2.31" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.31.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">            dialogue_context ← format(history)</span></span>
<span id="A4.p11.pic1.2.32" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.32.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.33" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.33.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">            # Generate character-specific question</span></span>
<span id="A4.p11.pic1.2.34" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.34.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">            question ← LLM_steps[character](</span></span>
<span id="A4.p11.pic1.2.35" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.35.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                            description = description,</span></span>
<span id="A4.p11.pic1.2.36" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.36.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                            message = dialogue_context</span></span>
<span id="A4.p11.pic1.2.37" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.37.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                        )</span></span>
<span id="A4.p11.pic1.2.38" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.38.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.39" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.39.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">            # Answer the question using image-grounded VQA</span></span>
<span id="A4.p11.pic1.2.40" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.40.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">            answer ← get_answer_from_image(image_path, query = question)</span></span>
<span id="A4.p11.pic1.2.41" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.41.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.42" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.42.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">            # Record question–answer pair</span></span>
<span id="A4.p11.pic1.2.43" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.43.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">            history[&quot;Round &quot; + round] ←</span></span>
<span id="A4.p11.pic1.2.44" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.44.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                &quot;Question (&quot; + character + &quot;): &quot; + question + &quot; | Answer: &quot; + answer</span></span>
<span id="A4.p11.pic1.2.45" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.45.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.46" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.46.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">        round ← round + 1</span></span>
<span id="A4.p11.pic1.2.47" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.47.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.48" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.48.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">        # Check whether collected information is sufficient</span></span>
<span id="A4.p11.pic1.2.49" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.49.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">        is_sufficient ← <span id="A4.p11.pic1.2.49.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">check_info_sufficiency</span>(</span></span>
<span id="A4.p11.pic1.2.50" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.50.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                            history = history</span></span>
<span id="A4.p11.pic1.2.51" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.51.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                        )</span></span>
<span id="A4.p11.pic1.2.52" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.52.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.53" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.53.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">        if is_sufficient:</span></span>
<span id="A4.p11.pic1.2.54" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.54.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">            break</span></span>
<span id="A4.p11.pic1.2.55" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.55.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.56" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.56.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    # Generate final summary based on meme information and QA history</span></span>
<span id="A4.p11.pic1.2.57" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.57.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    result ← <span id="A4.p11.pic1.2.57.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">summary</span>(</span></span>
<span id="A4.p11.pic1.2.58" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.58.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                 description = description,</span></span>
<span id="A4.p11.pic1.2.59" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.59.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">                 qa_history = history</span></span>
<span id="A4.p11.pic1.2.60" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.60.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">             )</span></span>
<span id="A4.p11.pic1.2.61" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.61.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:454.0pt;"></span></span>
<span id="A4.p11.pic1.2.62" class="ltx_p" style="width:454.0pt;"><span id="A4.p11.pic1.2.62.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:454.0pt;--ltx-fg-color:#000000;">    return result</span></span>
</span></span></span></foreignobject></g></g></svg>