<br class="ltx_break">- <span id="S3.SS5.p2.pic2.2.1.1.1" class="ltx_text ltx_font_bold">Merge repeated evidence; suppress isolated outliers
<br class="ltx_break"></span>Treat features seen in only one tile as <span id="S3.SS5.p2.pic2.2.1.1.2" class="ltx_text ltx_font_bold">contextual noise</span> unless they repeat in <span id="S3.SS5.p2.pic2.2.1.1.3" class="ltx_text ltx_font_bold">2+ tiles</span>. 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
- <span id="S3.SS5.p2.pic2.2.1.1.4" class="ltx_text ltx_font_bold">Strong override for epithelial/glandular architecture
<br class="ltx_break"></span>If <span id="S3.SS5.p2.pic2.2.1.1.5" class="ltx_text ltx_font_bold">2 or more tiles</span> show tightly packed pink acini/tubules…describe a <span id="S3.SS5.p2.pic2.2.1.1.6" class="ltx_text ltx_font_bold">solid or gland-forming neoplastic epithelial field</span>. <span id="S3.SS5.p2.pic2.2.1.1.7" class="ltx_text ltx_font_bold">Neighbor epithelial architecture overrides a lymphoid-looking center</span>. 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
