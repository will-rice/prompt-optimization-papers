<br class="ltx_break"><span id="S3.SS1.p4.pic1.2.1.1.1" class="ltx_text ltx_font_bold">SEMANTIC REASONING POLICY
<br class="ltx_break"></span>1. <span id="S3.SS1.p4.pic1.2.1.1.2" class="ltx_text ltx_font_bold">THE HOMOGENEITY RULE:</span> If the center and the majority of neighbors share the same tissue type (e.g., all dense tumor), reinforce the center’s confidence and describe it as a ‘‘continuous solid region.’’ 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
2. <span id="S3.SS1.p4.pic1.2.1.1.3" class="ltx_text ltx_font_bold">THE OUTLIER RULE:</span> If the center contains a minor, ambiguous feature but all neighbors are definitively empty or benign, treat the center as likely noise/benign context…
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
…</span></span>
