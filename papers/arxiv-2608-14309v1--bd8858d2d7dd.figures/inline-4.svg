<br class="ltx_break"></span>If <span id="S3.SS5.p2.pic1.2.1.1.2" class="ltx_text ltx_font_bold">any neighbor</span> shows pleomorphic enlarged cells, eosinophilic or pink cytoplasm, increased nuclear-to-cytoplasmic ratio…then update toward a <span id="S3.SS5.p2.pic1.2.1.1.3" class="ltx_text ltx_font_bold">tumor-edge / infiltrative epithelial interface</span>. Do <span id="S3.SS5.p2.pic1.2.1.1.4" class="ltx_text ltx_font_bold">not</span> keep a bland lymphoid interpretation if these features are present…
