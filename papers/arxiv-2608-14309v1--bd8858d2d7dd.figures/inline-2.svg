<br class="ltx_break">- Interpret spindle cell morphology in neighbors as possibly
reflecting tumor heterogeneity or carcinoma variants with
spindle features, <span id="S3.SS4.p1.pic1.2.1.1.1" class="ltx_text ltx_font_bold">not exclusively sarcoma</span>. 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
- Biphasic or heterogeneous patterns, including transitions
in cellularity or matrix composition. 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
- Evaluate all tiles for epithelial, glandular, spindle cell,
stromal, inflammatory, and cytologic features, including
nuclear pleomorphism, hyperchromasia, mitotic activity,
architectural disruption, necrosis, and subtle stromal
changes. 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
