<span id="S3.SS4.p1.pic2.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:21.13em;">
<span id="S3.SS4.p1.pic2.2.1" class="ltx_p"><span id="S3.SS4.p1.pic2.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">…
<br class="ltx_break">- Use a <span id="S3.SS4.p1.pic2.2.1.1.1" class="ltx_text ltx_font_bold">diffuse lymphoid-appearing field</span> only when
most tiles show: <span id="S3.SS4.p1.pic2.2.1.1.2" class="ltx_text ltx_font_bold">uniform small dark round-to-oval
cells</span>, <span id="S3.SS4.p1.pic2.2.1.1.3" class="ltx_text ltx_font_bold">scant pale cytoplasm</span>, <span id="S3.SS4.p1.pic2.2.1.1.4" class="ltx_text ltx_font_bold">inconspicuous
nucleoli</span>, <span id="S3.SS4.p1.pic2.2.1.1.5" class="ltx_text ltx_font_bold">preserved diffuse spacing</span>. 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
- Do not let sparse atypia, collagen, adipose tissue, debris,
<span id="S3.SS4.p1.pic2.2.1.1.6" class="ltx_text ltx_font_bold">follicles</span>, or <span id="S3.SS4.p1.pic2.2.1.1.7" class="ltx_text ltx_font_bold">germinal centers</span> dominate
unless they are part of the repeated field-wide pattern. 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
- If 2 or more tiles show tightly packed pink acini/tubules,
cohesive nests/cords/sheets, crowded polygonal or
round-to-oval epithelial cells, hyperchromatic or pleomorphic
nuclei, visible nucleoli, scant cytoplasm, or loss of
gland/lumen organization, describe a <span id="S3.SS4.p1.pic2.2.1.1.8" class="ltx_text ltx_font_bold">solid or
gland-forming neoplastic epithelial field</span>. 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
…</span></span>
</span></span></span></foreignobject></g></g></svg>