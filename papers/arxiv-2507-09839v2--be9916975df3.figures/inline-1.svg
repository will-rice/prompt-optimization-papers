<span id="A1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.88em;">
<span id="A1.p3.pic1.1.1" class="ltx_p"><span id="A1.p3.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Joe was feeling quite dehydrated, so he stopped by the local smoothie shop to buy the largest sized drink available. Before ordering, the cashier told him that the Mega-Sized Smoothies were now one dollar more than they used to be. Joe replied, ‘‘I don’t care if I have to pay one dollar more, I just want the biggest smoothie you have.’’ Sure enough, Joe received the Mega-Sized Smoothie and paid one dollar more for it. Did Joe intentionally pay one dollar more?

<br class="ltx_break">Label: Yes
