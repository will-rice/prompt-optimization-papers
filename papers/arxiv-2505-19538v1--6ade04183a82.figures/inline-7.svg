<span id="A4.SS2.p11.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.SS2.p11.pic1.p1.1" class="ltx_p"><span id="A4.SS2.p11.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role Description:</span><span id="A4.SS2.p11.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
The LLM critiques a generated answer based on its relevance, appropriateness, and specificity to the original patient query. The &quot;Default&quot; system message is used.</span></span>
</span>
<span id="A4.SS2.p11.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.SS2.p11.pic1.p2.1" class="ltx_p"><span id="A4.SS2.p11.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt:</span></span>
<span id="A4.I4" class="ltx_itemize">
<span id="A4.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I4.i1.p1.1" class="ltx_p"><span id="A4.I4.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:</span></span>
<span id="A4.I4.i1.I1" class="ltx_itemize">
<span id="A4.I4.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I4.i1.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I4.i1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I4.i1.I1.i1.p1.1" class="ltx_p"><span id="A4.I4.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original Patient Query (q): {</span><span id="A4.I4.i1.I1.i1.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">query_q</span><span id="A4.I4.i1.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
<span id="A4.I4.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I4.i1.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I4.i1.I1.i2.p1" class="ltx_para">
<span id="A4.I4.i1.I1.i2.p1.1" class="ltx_p"><span id="A4.I4.i1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Generated Answer (A): {</span><span id="A4.I4.i1.I1.i2.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">answer_a</span><span id="A4.I4.i1.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
</span>
</span></span>
<span id="A4.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I4.i2.p1.1" class="ltx_p"><span id="A4.I4.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions to the LLM:</span><span id="A4.I4.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Given the original patient query (q):
{</span><span id="A4.I4.i2.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">query_q</span><span id="A4.I4.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I4.i2.p2" class="ltx_para ltx_noindent">
<span id="A4.I4.i2.p2.1" class="ltx_p"><span id="A4.I4.i2.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">And the following generated answer (A):
{</span><span id="A4.I4.i2.p2.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">answer_a</span><span id="A4.I4.i2.p2.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I4.i2.p3" class="ltx_para ltx_noindent">
<span id="A4.I4.i2.p3.1" class="ltx_p"><span id="A4.I4.i2.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Critique the answer (A) focusing ONLY on its relevance, appropriateness,
and specificity to the patient’s query (q). Provide specific, concise
points of criticism or confirmation. These are PATIENT-FOCUSED critiques.
Does the answer fully address the patient’s concerns as expressed in the
query? Output ONLY the critique.</span></span>
</span></span>
<span id="A4.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i3.p1" class="ltx_para">
<span id="A4.I4.i3.p1.1" class="ltx_p"><span id="A4.I4.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format:</span><span id="A4.I4.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Only the critique.</span></span>
</span></span>
</span>
