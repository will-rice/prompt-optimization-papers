</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 886.16)"><foreignobject style="--ltx-fo-width:31.56em;--ltx-fo-height:8.36em;--ltx-fo-depth:63.14em;font-size:10pt;" height="989.34" overflow="visible" transform="matrix(1 0 0 -1 0 115.67)" width="436.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.SS2.p21.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:31.56em;">
<span id="A4.SS2.p21.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.SS2.p21.pic1.p1.1" class="ltx_p"><span id="A4.SS2.p21.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role Description:</span><span id="A4.SS2.p21.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
The LLM acts as an AI assistant tasked with refining a medical consultation prompt based on aggregated feedback (gradients). The &quot;Answer Generation / Prompt Update&quot; system message is used.</span></span>
</span>
<span id="A4.SS2.p21.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.SS2.p21.pic1.p2.1" class="ltx_p"><span id="A4.SS2.p21.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt:</span></span>
<span id="A4.I9" class="ltx_itemize">
<span id="A4.I9.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I9.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I9.i1.p1.1" class="ltx_p"><span id="A4.I9.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:</span></span>
<span id="A4.I9.i1.I1" class="ltx_itemize">
