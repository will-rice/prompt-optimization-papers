<span id="A4.I9.i1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I9.i1.I1.i1.p1.1" class="ltx_p"><span id="A4.I9.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original Prompt (</span><math id="A4.I9.i1.I1.i1.p1.m1" class="ltx_Math" alttext="P_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">P_{t}</annotation></semantics></math><span id="A4.I9.i1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">): {</span><span id="A4.I9.i1.I1.i1.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">current_prompt_p</span><span id="A4.I9.i1.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
<span id="A4.I9.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I9.i1.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I9.i1.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I9.i1.I1.i2.p1.1" class="ltx_p"><span id="A4.I9.i1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original Answer (</span><math id="A4.I9.i1.I1.i2.p1.m1" class="ltx_Math" alttext="A_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">A_{t}</annotation></semantics></math><span id="A4.I9.i1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">) generated by </span><math id="A4.I9.i1.I1.i2.p1.m2" class="ltx_Math" alttext="P_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">P_{t}</annotation></semantics></math><span id="A4.I9.i1.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">: {</span><span id="A4.I9.i1.I1.i2.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">answer_a</span><span id="A4.I9.i1.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
<span id="A4.I9.i1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I9.i1.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I9.i1.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="A4.I9.i1.I1.i3.p1.1" class="ltx_p"><span id="A4.I9.i1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Feedback from Context Critiques (</span><math id="A4.I9.i1.I1.i3.p1.m1" class="ltx_Math" alttext="\nabla_{P}C_{\text{KC}}" display="inline" intent=":literal"><semantics><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∇</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi></msub><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">KC</mtext></msub></mrow><annotation encoding="application/x-tex">\nabla_{P}C_{\text{KC}}</annotation></semantics></math><span id="A4.I9.i1.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">): {</span><span id="A4.I9.i1.I1.i3.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">grad_prompt_kc</span><span id="A4.I9.i1.I1.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
<span id="A4.I9.i1.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I9.i1.I1.i4.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I9.i1.I1.i4.p1" class="ltx_para ltx_noindent">
<span id="A4.I9.i1.I1.i4.p1.1" class="ltx_p"><span id="A4.I9.i1.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Feedback from Patient Query Critiques (</span><math id="A4.I9.i1.I1.i4.p1.m1" class="ltx_Math" alttext="\nabla_{P}C_{\text{PC}}" display="inline" intent=":literal"><semantics><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∇</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi></msub><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">PC</mtext></msub></mrow><annotation encoding="application/x-tex">\nabla_{P}C_{\text{PC}}</annotation></semantics></math><span id="A4.I9.i1.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">): {</span><span id="A4.I9.i1.I1.i4.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">grad_prompt_pc</span><span id="A4.I9.i1.I1.i4.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
<span id="A4.I9.i1.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I9.i1.I1.i5.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I9.i1.I1.i5.p1" class="ltx_para ltx_noindent">
<span id="A4.I9.i1.I1.i5.p1.1" class="ltx_p"><span id="A4.I9.i1.I1.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original Patient Query (q): {</span><span id="A4.I9.i1.I1.i5.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">query_q</span><span id="A4.I9.i1.I1.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
<span id="A4.I9.i1.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I9.i1.I1.i6.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I9.i1.I1.i6.p1" class="ltx_para">
<span id="A4.I9.i1.I1.i6.p1.1" class="ltx_p"><span id="A4.I9.i1.I1.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example Answer that </span><math id="A4.I9.i1.I1.i6.p1.m1" class="ltx_Math" alttext="P_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">P_{t}</annotation></semantics></math><span id="A4.I9.i1.I1.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> was used to refine: {</span><span id="A4.I9.i1.I1.i6.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">initial_answer_example</span><span id="A4.I9.i1.I1.i6.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
</span>
</span></span>
<span id="A4.I9.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I9.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I9.i2.p1.1" class="ltx_p"><span id="A4.I9.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions to the LLM:</span><span id="A4.I9.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
You are an AI assistant tasked with refining a medical consultation prompt.</span></span>
</span>
<span id="A4.I9.i2.p2" class="ltx_para ltx_noindent">
<span id="A4.I9.i2.p2.1" class="ltx_p"><span id="A4.I9.i2.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The Original Prompt (P_t) to be improved is:
{</span><span id="A4.I9.i2.p2.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">current_prompt_p</span><span id="A4.I9.i2.p2.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I9.i2.p3" class="ltx_para ltx_noindent">
<span id="A4.I9.i2.p3.1" class="ltx_p"><span id="A4.I9.i2.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The Original Answer generated by P_t is:
{</span><span id="A4.I9.i2.p3.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">answer_a</span><span id="A4.I9.i2.p3.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I9.i2.p4" class="ltx_para ltx_noindent">
<span id="A4.I9.i2.p4.1" class="ltx_p"><span id="A4.I9.i2.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We need to create an Updated Prompt (P) based on the following feedback,
which aims to make P more effective for refining answers like A.
Feedback derived from Context critiques (grad_prompt_kc):
{</span><span id="A4.I9.i2.p4.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">grad_prompt_kc</span><span id="A4.I9.i2.p4.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I9.i2.p5" class="ltx_para ltx_noindent">
<span id="A4.I9.i2.p5.1" class="ltx_p"><span id="A4.I9.i2.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Feedback derived from PATIENT QUERY critiques (grad_prompt_pc):
{</span><span id="A4.I9.i2.p5.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">grad_prompt_pc</span><span id="A4.I9.i2.p5.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I9.i2.p6" class="ltx_para ltx_noindent">
<span id="A4.I9.i2.p6.1" class="ltx_p"><span id="A4.I9.i2.p6.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original Patient Query (q) for context: {</span><span id="A4.I9.i2.p6.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">query_q</span><span id="A4.I9.i2.p6.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}
Example of an answer (A) that P_t was used to refine: {</span><span id="A4.I9.i2.p6.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">initial_answer_example</span><span id="A4.I9.i2.p6.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I9.i2.p7" class="ltx_para ltx_noindent">
<span id="A4.I9.i2.p7.1" class="ltx_p"><span id="A4.I9.i2.p7.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task: Generate the Updated Prompt (P).
This P must be a complete set of instructions and context. When P is
later combined with a new ’current answer (A)’, the LLM receiving
(P + actual text of A) should be guided to:
1. Produce a refined version of that ’current answer (A)’.
2. Implicitly incorporate the improvements suggested by the feedback
(grad_prompt_kc, grad_prompt_pc) through your new instructions in P.
3. Ensure the refined answer directly addresses the patient’s query,
is factually sound, clear, and empathetic.
4. Output ONLY the refined medical answer itself, without any
conversational preamble, meta-commentary, self-correction notes,
or any text other than the refined answer.</span></span>
</span>
<span id="A4.I9.i2.p8" class="ltx_para ltx_noindent">
<span id="A4.I9.i2.p8.1" class="ltx_p"><span id="A4.I9.i2.p8.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Focus on making P a robust set of instructions for the refinement task.</span></span>
</span>
<span id="A4.I9.i2.p9" class="ltx_para ltx_noindent">
<span id="A4.I9.i2.p9.1" class="ltx_p"><span id="A4.I9.i2.p9.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output ONLY the Updated Prompt (P).</span></span>
</span></span>
<span id="A4.I9.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I9.i3.p1" class="ltx_para">
<span id="A4.I9.i3.p1.1" class="ltx_p"><span id="A4.I9.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format:</span><span id="A4.I9.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Only the Updated Prompt (P).</span></span>
</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>