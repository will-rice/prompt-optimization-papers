Given the following medical context (C):
</span><math id="A4.I3.i2.p1.m1" class="ltx_Math" alttext="{\{context_{c}}\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi></msub></mrow><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">{\{context_{c}}\}</annotation></semantics></math></span>
</span>
<span id="A4.I3.i2.p2" class="ltx_para ltx_noindent">
<span id="A4.I3.i2.p2.1" class="ltx_p"><span id="A4.I3.i2.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">And the following generated answer (A):
</span><math id="A4.I3.i2.p2.m1" class="ltx_Math" alttext="{\{answer_{a}}\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi></msub></mrow><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">{\{answer_{a}}\}</annotation></semantics></math></span>
</span>
<span id="A4.I3.i2.p3" class="ltx_para ltx_noindent">
<span id="A4.I3.i2.p3.1" class="ltx_p"><span id="A4.I3.i2.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Critique the answer (A) focusing ONLY on its factual alignment,
consistency, and completeness with respect to the provided medical
context (C). Provide specific, concise points of criticism or
confirmation. These are CONTEXT-FOCUSED critiques. Identify areas
where the answer might misrepresent or omit crucial information from
the context. Output ONLY the critique.</span></span>
</span></span>
