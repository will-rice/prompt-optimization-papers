<span id="A5.I2.i2.I1.i1.p2" class="ltx_para ltx_noindent">
<span id="A5.I2.i2.I1.i1.p2.1" class="ltx_p"><span id="A5.I2.i2.I1.i1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Patient: I’ve been experiencing this really intense itching all over my skin, doctor. It’s been bothering me quite a bit.</span></span>
</span>
<span id="A5.I2.i2.I1.i1.p3" class="ltx_para ltx_noindent">
<span id="A5.I2.i2.I1.i1.p3.1" class="ltx_p"><span id="A5.I2.i2.I1.i1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Doctor: Have you noticed any bumps on your skin recently?</span></span>
</span>
<span id="A5.I2.i2.I1.i1.p4" class="ltx_para ltx_noindent">
<span id="A5.I2.i2.I1.i1.p4.1" class="ltx_p"><span id="A5.I2.i2.I1.i1.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Patient: No, I haven’t noticed any bumps.</span></span>
</span></span>
