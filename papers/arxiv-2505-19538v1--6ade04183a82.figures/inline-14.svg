<span id="A5.I2.i2.I1" class="ltx_itemize">
<span id="A5.I2.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A5.I2.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
