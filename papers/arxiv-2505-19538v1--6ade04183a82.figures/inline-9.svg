<span id="A4.SS2.p15.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.SS2.p15.pic1.p1.1" class="ltx_p"><span id="A4.SS2.p15.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role Description:</span><span id="A4.SS2.p15.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
The LLM acts as an expert medical editor, providing actionable instructions to refine a medical answer based on patient-query-focused critiques. The &quot;Default&quot; system message is used.</span></span>
</span>
<span id="A4.SS2.p15.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.SS2.p15.pic1.p2.1" class="ltx_p"><span id="A4.SS2.p15.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt:</span></span>
<span id="A4.I6" class="ltx_itemize">
<span id="A4.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I6.i1.p1.1" class="ltx_p"><span id="A4.I6.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:</span></span>
<span id="A4.I6.i1.I1" class="ltx_itemize">
<span id="A4.I6.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I6.i1.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I6.i1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I6.i1.I1.i1.p1.1" class="ltx_p"><span id="A4.I6.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original Answer (A): {</span><span id="A4.I6.i1.I1.i1.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">answer_a</span><span id="A4.I6.i1.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
<span id="A4.I6.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I6.i1.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I6.i1.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I6.i1.I1.i2.p1.1" class="ltx_p"><span id="A4.I6.i1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original Patient Query (q): {</span><span id="A4.I6.i1.I1.i2.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">query_q</span><span id="A4.I6.i1.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
<span id="A4.I6.i1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I6.i1.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I6.i1.I1.i3.p1" class="ltx_para">
<span id="A4.I6.i1.I1.i3.p1.1" class="ltx_p"><span id="A4.I6.i1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Patient-Focused Critiques (</span><math id="A4.I6.i1.I1.i3.p1.m1" class="ltx_Math" alttext="C_{\text{PC}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">PC</mtext></msub><annotation encoding="application/x-tex">C_{\text{PC}}</annotation></semantics></math><span id="A4.I6.i1.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">): {</span><span id="A4.I6.i1.I1.i3.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">critiques_cpc</span><span id="A4.I6.i1.I1.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
</span>
</span></span>
<span id="A4.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I6.i2.p1.1" class="ltx_p"><span id="A4.I6.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions to the LLM:</span><span id="A4.I6.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
You are an expert medical editor. Your task is to provide actionable
instructions to refine a given medical answer based on specific
critiques related to the patient’s query.</span></span>
</span>
<span id="A4.I6.i2.p2" class="ltx_para ltx_noindent">
<span id="A4.I6.i2.p2.1" class="ltx_p"><span id="A4.I6.i2.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original Answer (A):
{</span><span id="A4.I6.i2.p2.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">answer_a</span><span id="A4.I6.i2.p2.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I6.i2.p3" class="ltx_para ltx_noindent">
<span id="A4.I6.i2.p3.1" class="ltx_p"><span id="A4.I6.i2.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original Patient Query (q):
{</span><span id="A4.I6.i2.p3.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">query_q</span><span id="A4.I6.i2.p3.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I6.i2.p4" class="ltx_para ltx_noindent">
<span id="A4.I6.i2.p4.1" class="ltx_p"><span id="A4.I6.i2.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">PATIENT-FOCUSED Critiques on the Original Answer:
{</span><span id="A4.I6.i2.p4.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">critiques_cpc</span><span id="A4.I6.i2.p4.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I6.i2.p5" class="ltx_para ltx_noindent">
<span id="A4.I6.i2.p5.1" class="ltx_p"><span id="A4.I6.i2.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based ONLY on the provided critiques and referring to the patient’s query,
explain step-by-step how to revise the Original Answer to address these
critiques. The explanation should focus on specific, targeted revisions
that address the critiques while maintaining the overall structure and
valid information in the original answer as much as possible.
Your output should be actionable instructions for improving the answer.
Do not write the revised answer itself. Output ONLY the instructions.</span></span>
</span></span>
<span id="A4.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i3.p1" class="ltx_para">
<span id="A4.I6.i3.p1.1" class="ltx_p"><span id="A4.I6.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format:</span><span id="A4.I6.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Only the actionable instructions.</span></span>
</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>