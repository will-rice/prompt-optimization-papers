<span id="A4.SS2.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.44em;">
<span id="A4.SS2.p7.pic1.1.1" class="ltx_p"><span id="A4.SS2.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt: Initial Refinement Prompt for Generator</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 669.53)"><foreignobject style="--ltx-fo-width:31.56em;--ltx-fo-height:12.02em;--ltx-fo-depth:47.48em;font-size:10pt;" height="823.29" overflow="visible" transform="matrix(1 0 0 -1 0 166.25)" width="436.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.SS2.p7.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:31.56em;">
<span id="A4.SS2.p7.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.SS2.p7.pic1.p1.1" class="ltx_p"><span id="A4.SS2.p7.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role Description:</span><span id="A4.SS2.p7.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
The LLM acts as a helpful medical consultation AI. Its task is to refine a given ’current answer (A)’ based on the patient’s query and supporting context. This prompt is combined with the ’current answer (A)’ to form the full input to the Generator. The &quot;Answer Generation / Prompt Update&quot; system message is used.</span></span>
</span>
<span id="A4.SS2.p7.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.SS2.p7.pic1.p2.1" class="ltx_p"><span id="A4.SS2.p7.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt Template Structure (combined with current answer <math id="A4.SS2.p7.pic1.p2.m1" class="ltx_Math" alttext="A" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><annotation encoding="application/x-tex">A</annotation></semantics></math>):</span></span>
<span id="A4.I2" class="ltx_itemize">
<span id="A4.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I2.i1.p1.1" class="ltx_p"><span id="A4.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:</span></span>
<span id="A4.I2.i1.I1" class="ltx_itemize">
<span id="A4.I2.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I2.i1.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I2.i1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I2.i1.I1.i1.p1.1" class="ltx_p"><span id="A4.I2.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Patient Query (q): {</span><span id="A4.I2.i1.I1.i1.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">query_q</span><span id="A4.I2.i1.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
<span id="A4.I2.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I2.i1.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I2.i1.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I2.i1.I1.i2.p1.1" class="ltx_p"><span id="A4.I2.i1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Supporting Context (C): {</span><span id="A4.I2.i1.I1.i2.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">context_c</span><span id="A4.I2.i1.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
<span id="A4.I2.i1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I2.i1.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I2.i1.I1.i3.p1" class="ltx_para">
<span id="A4.I2.i1.I1.i3.p1.1" class="ltx_p"><span id="A4.I2.i1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Current Answer (A) to Refine: {</span><span id="A4.I2.i1.I1.i3.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">answer_a</span><span id="A4.I2.i1.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
</span>
</span></span>
<span id="A4.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I2.i2.p1.1" class="ltx_p"><span id="A4.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions within the prompt to the LLM:</span><span id="A4.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
You are a helpful medical consultation AI. Your task is to REFINE the
’current answer (A)’ (which will be provided at the end of this prompt)
by critically evaluating it against the patient’s query and the
supporting context. The goal is to improve the ’current answer (A)’s
accuracy, completeness, and relevance to the patient’s query,
while preserving its valid core information and avoiding unnecessary
deviations from its original intent.</span></span>
</span>
<span id="A4.I2.i2.p2" class="ltx_para ltx_noindent">
<span id="A4.I2.i2.p2.1" class="ltx_p"><span id="A4.I2.i2.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Patient Query (q):
{</span><span id="A4.I2.i2.p2.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">query_q</span><span id="A4.I2.i2.p2.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I2.i2.p3" class="ltx_para ltx_noindent">
<span id="A4.I2.i2.p3.1" class="ltx_p"><span id="A4.I2.i2.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Supporting Context (C):
{</span><span id="A4.I2.i2.p3.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">context_c</span><span id="A4.I2.i2.p3.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A4.I2.i2.p4" class="ltx_para ltx_noindent">
<span id="A4.I2.i2.p4.1" class="ltx_p"><span id="A4.I2.i2.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Instructions for refinement:
1. Carefully read the ’Patient Query (q)’ and the ’Supporting Context (C)’.
2. Critically evaluate the ’current answer (A)’ (provided below) against
this information.
3. Generate an improved and refined version of the ’current answer (A)’.
4. Focus on addressing any shortcomings in the ’current answer (A)’
regarding accuracy, completeness, clarity, and direct relevance to
the patient’s query.
5. Ensure your refined answer is factually sound based on the context,
empathetic, and easy for a patient to understand.
6. IMPORTANT: Your output must be ONLY the refined medical answer itself.
Do not include any preamble, conversational phrases, meta-commentary,
or any text other than the refined answer.</span></span>
</span>
<span id="A4.I2.i2.p5" class="ltx_para ltx_noindent">
<span id="A4.I2.i2.p5.1" class="ltx_p"><span id="A4.I2.i2.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Current Answer (A) to Refine:
{</span><span id="A4.I2.i2.p5.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">answer_a</span><span id="A4.I2.i2.p5.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span>
<span id="A4.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i3.p1" class="ltx_para">
<span id="A4.I2.i3.p1.1" class="ltx_p"><span id="A4.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format:</span><span id="A4.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Only the refined medical answer.</span></span>
</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>