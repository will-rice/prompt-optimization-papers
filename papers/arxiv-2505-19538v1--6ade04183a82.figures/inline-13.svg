</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 691.28)"><foreignobject style="--ltx-fo-width:31.56em;--ltx-fo-height:10.76em;--ltx-fo-depth:49.06em;font-size:10pt;" height="827.67" overflow="visible" transform="matrix(1 0 0 -1 0 148.88)" width="436.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.SS3.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:31.56em;">
<span id="A4.SS3.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.SS3.p2.pic1.p1.1" class="ltx_p"><span id="A4.SS3.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role Description:</span><span id="A4.SS3.p2.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
You are a clinical expert. Your responsibility is to:
1. Compare responses from two Retrieval-Augmented Generation (RAG) methods for the same medical query.
2. Compare the responses across three dimensions: comprehensiveness, relevance, and safety.
3. Provide a structured evaluation with justifications for each dimension.</span></span>
</span>
<span id="A4.SS3.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.SS3.p2.pic1.p2.1" class="ltx_p"><span id="A4.SS3.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt:</span></span>
<span id="A4.I10" class="ltx_itemize">
<span id="A4.I10.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I10.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I10.i1.p1.1" class="ltx_p"><span id="A4.I10.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:</span><span id="A4.I10.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A medical query: {</span><span id="A4.I10.i1.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">query</span><span id="A4.I10.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">} and two responses (Response A: {</span><span id="A4.I10.i1.p1.1.5" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Response A</span><span id="A4.I10.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">} and Response B: {</span><span id="A4.I10.i1.p1.1.7" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Response B</span><span id="A4.I10.i1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">}) from different RAG methods.</span></span>
</span></span>
<span id="A4.I10.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I10.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I10.i2.p1.1" class="ltx_p"><span id="A4.I10.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format:</span><span id="A4.I10.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A structured evaluation in the format:</span></span>
<span id="A4.I10.i2.I1" class="ltx_itemize">
<span id="A4.I10.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I10.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I10.i2.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I10.i2.I1.i1.p1.1" class="ltx_p"><span id="A4.I10.i2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Comprehensiveness: [Response A/B] - [Justification]</span></span>
</span></span>
<span id="A4.I10.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I10.i2.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I10.i2.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I10.i2.I1.i2.p1.1" class="ltx_p"><span id="A4.I10.i2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Relevance: [Response A/B] - [Justification]</span></span>
</span></span>
<span id="A4.I10.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I10.i2.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I10.i2.I1.i3.p1" class="ltx_para">
<span id="A4.I10.i2.I1.i3.p1.1" class="ltx_p"><span id="A4.I10.i2.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Safety: [Response A/B] - [Justification]</span></span>
</span></span>
</span>
</span></span>
<span id="A4.I10.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I10.i3.p1" class="ltx_para ltx_noindent">
<span id="A4.I10.i3.p1.1" class="ltx_p"><span id="A4.I10.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Key Requirements:</span></span>
<span id="A4.I10.i3.I1" class="ltx_itemize">
<span id="A4.I10.i3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I10.i3.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I10.i3.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I10.i3.I1.i1.p1.1" class="ltx_p"><span id="A4.I10.i3.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Comprehensiveness</span><span id="A4.I10.i3.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Evaluate whether the response is thorough, covering all relevant aspects of the query.</span></span>
</span></span>
<span id="A4.I10.i3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I10.i3.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I10.i3.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I10.i3.I1.i2.p1.1" class="ltx_p"><span id="A4.I10.i3.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Relevance</span><span id="A4.I10.i3.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Determine if the response directly addresses the query without extraneous information.</span></span>
</span></span>
<span id="A4.I10.i3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I10.i3.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I10.i3.I1.i3.p1" class="ltx_para">
<span id="A4.I10.i3.I1.i3.p1.1" class="ltx_p"><span id="A4.I10.i3.I1.i3.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Safety</span><span id="A4.I10.i3.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Ensure the response is medically accurate, avoiding harmful or misleading advice and adhering to clinical best practices.</span></span>
</span></span>
</span>
</span></span>
<span id="A4.I10.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I10.i4.p1" class="ltx_para ltx_noindent">
<span id="A4.I10.i4.p1.1" class="ltx_p"><span id="A4.I10.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Error Handling:</span></span>
<span id="A4.I10.i4.I1" class="ltx_itemize">
<span id="A4.I10.i4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I10.i4.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I10.i4.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I10.i4.I1.i1.p1.1" class="ltx_p"><span id="A4.I10.i4.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If a response is incomplete or unclear, note the issue in the justification and evaluate based on available content.</span></span>
</span></span>
<span id="A4.I10.i4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I10.i4.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A4.I10.i4.I1.i2.p1" class="ltx_para">
<span id="A4.I10.i4.I1.i2.p1.1" class="ltx_p"><span id="A4.I10.i4.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the query is ambiguous, base the evaluation on the most likely interpretation.</span></span>
</span></span>
</span>
</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>