<svg id="A1.SS3.p1.pic1" class="ltx_picture" height="361.94" overflow="visible" version="1.1" viewbox="0 0 629.92 361.94" width="629.92"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,361.94) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 356.03 C 0 359.3 2.64 361.94 5.91 361.94 L 624.02 361.94 C 627.28 361.94 629.92 359.3 629.92 356.03 L 629.92 5.91 C 629.92 2.64 627.28 0 624.02 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 339.06 L 627.95 339.06 L 627.95 5.91 C 627.95 3.73 626.19 1.97 624.02 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 347.39)"><foreignobject style="--ltx-fo-width:41.19em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="569.95"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.19em;">
<span id="A1.SS3.p1.pic1.1.1" class="ltx_p"><span id="A1.SS3.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Prompt Template: Grounded Answer Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 13.86)"><foreignobject style="--ltx-fo-width:47.43em;--ltx-fo-height:22.82em;--ltx-fo-depth:0.18em;font-size:10pt;" height="318.15" overflow="visible" transform="matrix(1 0 0 -1 0 315.73)" width="656.3"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.43em;">
<span id="A1.SS3.p1.pic1.2.1" class="ltx_p"><span id="A1.SS3.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are a medical assistant answering a patient’s question using <span id="A1.SS3.p1.pic1.2.1.1.1" class="ltx_text ltx_font_bold">only</span> information from the clinical note excerpt.</span></span>
<span id="A1.SS3.p1.pic1.2.2" class="ltx_p"><span id="A1.SS3.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Constraints:<span id="A1.SS3.p1.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A1.I3" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A1.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I3.i1.p1" class="ltx_para">
<span id="A1.I3.i1.p1.1" class="ltx_p"><span id="A1.I3.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Answer must be at most 75 words (</span><math id="A1.I3.i1.p1.m1" class="ltx_Math" alttext="\sim" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">∼</mo><annotation encoding="application/x-tex">\sim</annotation></semantics></math><span id="A1.I3.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">5 sentences).</span></span>
</span></span>
<span id="A1.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I3.i2.p1" class="ltx_para">
<span id="A1.I3.i2.p1.1" class="ltx_p"><span id="A1.I3.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Use only facts stated in the clinical note. Do not add outside medical knowledge, generic advice, or speculation.</span></span>
</span></span>
<span id="A1.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I3.i3.p1" class="ltx_para">
<span id="A1.I3.i3.p1.1" class="ltx_p"><span id="A1.I3.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Write in professional clinical register (not simplified lay language).</span></span>
</span></span>
<span id="A1.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I3.i4.p1" class="ltx_para">
<span id="A1.I3.i4.p1.1" class="ltx_p"><span id="A1.I3.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do not include citation markers such as [1], [2].</span></span>
</span></span>
<span id="A1.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A1.I3.i5.p1" class="ltx_para">
<span id="A1.I3.i5.p1.1" class="ltx_p"><span id="A1.I3.i5.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Reuse exact clinical wording and terminology from note sentences as much as possible.</span></span>
</span></span>
<span id="A1.I3.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A1.I3.i6.p1" class="ltx_para">
<span id="A1.I3.i6.p1.1" class="ltx_p"><span id="A1.I3.i6.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The last sentence must directly answer the patient’s question.</span></span>
</span></span>
</span>
<span id="A1.SS3.p1.pic1.2.3" class="ltx_p"><span id="A1.SS3.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Input:<span id="A1.SS3.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Patient narrative, patient question, clinician question, clinical note excerpt.
<br class="ltx_break"></span>Output:<span id="A1.SS3.p1.pic1.2.3.1.2" class="ltx_text ltx_font_medium"> Concise grounded answer (<math id="A1.SS3.p1.pic1.m1" class="ltx_Math" alttext="\leq" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><annotation encoding="application/x-tex">\leq</annotation></semantics></math>75 words).</span></span></span>
<span id="A1.SS3.p1.pic1.2.4" class="ltx_p"><em id="A1.SS3.p1.pic1.2.4.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Inference:</em><span id="A1.SS3.p1.pic1.2.4.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Generate <math id="A1.SS3.p1.pic1.m2" class="ltx_Math" alttext="R{=}5" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></mrow><annotation encoding="application/x-tex">R{=}5</annotation></semantics></math> candidates at temperature 0.9; consolidate via a separate prompt that retains only claims consistently supported across candidates.</span></span>
</span></span></span></foreignobject></g></g></svg>