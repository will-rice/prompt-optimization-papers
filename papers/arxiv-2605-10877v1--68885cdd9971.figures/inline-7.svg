</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 13.86)"><foreignobject style="--ltx-fo-width:47.43em;--ltx-fo-height:15.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="218.63" overflow="visible" transform="matrix(1 0 0 -1 0 216.21)" width="656.3"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.43em;">
<span id="A1.SS4.p2.pic1.2.1" class="ltx_p"><span id="A1.SS4.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are a strict reviewer performing self-reflection on an evidence alignment task. Critically review the initial alignment and identify:</span></span>
<span id="A1.I6" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A1.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I6.i1.p1" class="ltx_para">
<span id="A1.I6.i1.p1.1" class="ltx_p"><span id="A1.I6.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">False positives</span><span id="A1.I6.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (primary focus): links where the answer does not directly use information from the linked note sentence. </span><span id="A1.I6.i1.p1.1.3" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Remove</span><span id="A1.I6.i1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> these.</span></span>
</span></span>
<span id="A1.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I6.i2.p1" class="ltx_para">
<span id="A1.I6.i2.p1.1" class="ltx_p"><span id="A1.I6.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">False negatives</span><span id="A1.I6.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (secondary focus): missing links where an answer sentence clearly paraphrases or references a note sentence. </span><span id="A1.I6.i2.p1.1.3" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Add</span><span id="A1.I6.i2.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> only when direct and explicit.</span></span>
</span></span>
</span>
<span id="A1.SS4.p2.pic1.2.2" class="ltx_p"><span id="A1.SS4.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Produce a corrected alignment with updated confidence scores.</span></span>
<span id="A1.SS4.p2.pic1.2.3" class="ltx_p"><span id="A1.SS4.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Additional input:<span id="A1.SS4.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Initial alignment from Stage A.</span></span></span>
