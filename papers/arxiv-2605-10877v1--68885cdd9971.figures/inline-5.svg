<span id="A1.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.19em;">
<span id="A1.SS3.p2.pic1.1.1" class="ltx_p"><span id="A1.SS3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Prompt Template: Answer Consolidation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 13.86)"><foreignobject style="--ltx-fo-width:47.43em;--ltx-fo-height:11.13em;--ltx-fo-depth:0.18em;font-size:10pt;" height="156.36" overflow="visible" transform="matrix(1 0 0 -1 0 153.94)" width="656.3"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.43em;">
<span id="A1.SS3.p2.pic1.2.1" class="ltx_p"><span id="A1.SS3.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are a clinical answer consolidation system. Given a patient question and 5 candidate answers generated from a clinical note:</span></span>
<span id="A1.I4" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A1.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I4.i1.p1" class="ltx_para">
<span id="A1.I4.i1.p1.1" class="ltx_p"><span id="A1.I4.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Retain only claims consistently supported across the candidate answers.</span></span>
</span></span>
<span id="A1.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I4.i2.p1" class="ltx_para">
<span id="A1.I4.i2.p1.1" class="ltx_p"><span id="A1.I4.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Ground strictly in clinical note content—do not add external knowledge or speculate.</span></span>
</span></span>
<span id="A1.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I4.i3.p1" class="ltx_para">
<span id="A1.I4.i3.p1.1" class="ltx_p"><span id="A1.I4.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Use professional medical register.</span></span>
</span></span>
<span id="A1.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I4.i4.p1" class="ltx_para">
<span id="A1.I4.i4.p1.1" class="ltx_p"><span id="A1.I4.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Limit to 75 words (</span><math id="A1.I4.i4.p1.m1" class="ltx_Math" alttext="\sim" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">∼</mo><annotation encoding="application/x-tex">\sim</annotation></semantics></math><span id="A1.I4.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">5 sentences).</span></span>
</span></span>
<span id="A1.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A1.I4.i5.p1" class="ltx_para">
<span id="A1.I4.i5.p1.1" class="ltx_p"><span id="A1.I4.i5.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do not include patient names or identifying information.</span></span>
</span></span>
</span>
<span id="A1.SS3.p2.pic1.2.2" class="ltx_p"><span id="A1.SS3.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Output only the final consolidated answer.</span></span>
</span></span></span></foreignobject></g></g></svg>