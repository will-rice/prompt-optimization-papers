<svg id="A1.SS1.p1.pic1" class="ltx_picture" height="407.19" overflow="visible" version="1.1" viewbox="0 0 629.92 407.19" width="629.92"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,407.19) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 401.28 C 0 404.54 2.64 407.19 5.91 407.19 L 624.02 407.19 C 627.28 407.19 629.92 404.54 629.92 401.28 L 629.92 5.91 C 629.92 2.64 627.28 0 624.02 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 384.31 L 627.95 384.31 L 627.95 5.91 C 627.95 3.73 626.19 1.97 624.02 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 392.63)"><foreignobject style="--ltx-fo-width:41.19em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="569.95"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.19em;">
<span id="A1.SS1.p1.pic1.1.1" class="ltx_p"><span id="A1.SS1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Prompt Template: Question Interpretation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 13.86)"><foreignobject style="--ltx-fo-width:47.43em;--ltx-fo-height:26.09em;--ltx-fo-depth:0.18em;font-size:10pt;" height="363.4" overflow="visible" transform="matrix(1 0 0 -1 0 360.98)" width="656.3"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.43em;">
<span id="A1.SS1.p1.pic1.2.1" class="ltx_p"><span id="A1.SS1.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Transform a patient’s narrative into a concise clinical question (<math id="A1.SS1.p1.pic1.m1" class="ltx_Math" alttext="\leq" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><annotation encoding="application/x-tex">\leq</annotation></semantics></math>15 words) that a clinician would need to answer by reviewing the patient’s medical record.</span></span>
<span id="A1.SS1.p1.pic1.2.2" class="ltx_p"><span id="A1.SS1.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Core Constraints:<span id="A1.SS1.p1.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A1.I1" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i1.p1.1" class="ltx_p"><math id="A1.I1.i1.p1.m1" class="ltx_Math" alttext="\leq" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">≤</mo><annotation encoding="application/x-tex">\leq</annotation></semantics></math><span id="A1.I1.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">15 words, strictly enforced.</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Patient-specific: use “him/her/the patient” — never generic.</span></span>
</span></span>
<span id="A1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I1.i3.p1" class="ltx_para">
<span id="A1.I1.i3.p1.1" class="ltx_p"><span id="A1.I1.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Preserve medical terms: use exact procedure/medication names from the narrative.</span></span>
</span></span>
<span id="A1.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I1.i4.p1" class="ltx_para">
<span id="A1.I1.i4.p1.1" class="ltx_p"><span id="A1.I1.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Must end with a question mark.</span></span>
</span></span>
</span>
<span id="A1.SS1.p1.pic1.2.3" class="ltx_p"><span id="A1.SS1.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">High-Scoring Patterns:
<br class="ltx_break" style="--ltx-break-space:2.0pt;"><span id="A1.SS1.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium">

<span id="A1.SS1.p1.pic1.2.3.1.1.1" class="ltx_tabular ltx_guessed_headers ltx_align_middle">
<span class="ltx_thead">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.1" class="ltx_tr">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.1.1" class="ltx_td ltx_align_left ltx_align_top ltx_th ltx_th_column ltx_border_tt">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.1.1.1" class="ltx_inline-block ltx_align_top" style="width:184.3pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.1.1.1.1" class="ltx_p">Patient’s concern</span>
</span></span>
<span id="A1.SS1.p1.pic1.2.3.1.1.1.1.2" class="ltx_td ltx_nopad_r ltx_align_left ltx_align_top ltx_th ltx_th_column ltx_border_tt">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.1.2.1" class="ltx_inline-block ltx_align_top" style="width:228.1pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.1.2.1.1" class="ltx_p">Target pattern</span>
</span></span></span>
</span>
<span class="ltx_tbody">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.2" class="ltx_tr">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.2.1" class="ltx_td ltx_align_left ltx_align_top ltx_border_t">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.2.1.1" class="ltx_inline-block ltx_align_top" style="width:184.3pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.2.1.1.1" class="ltx_p">“Why did they do X?”</span>
</span></span>
<span id="A1.SS1.p1.pic1.2.3.1.1.1.2.2" class="ltx_td ltx_nopad_r ltx_align_left ltx_align_top ltx_border_t">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.2.2.1" class="ltx_inline-block ltx_align_top" style="width:228.1pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.2.2.1.1" class="ltx_p">“Why was [X] recommended to him/her?”</span>
</span></span></span>
<span id="A1.SS1.p1.pic1.2.3.1.1.1.3" class="ltx_tr">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.3.1" class="ltx_td ltx_align_left ltx_align_top">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.3.1.1" class="ltx_inline-block ltx_align_top" style="width:184.3pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.3.1.1.1" class="ltx_p">“Will I recover?”</span>
</span></span>
<span id="A1.SS1.p1.pic1.2.3.1.1.1.3.2" class="ltx_td ltx_nopad_r ltx_align_left ltx_align_top">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.3.2.1" class="ltx_inline-block ltx_align_top" style="width:228.1pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.3.2.1.1" class="ltx_p">“What is the expected course of recovery for him/her?”</span>
</span></span></span>
<span id="A1.SS1.p1.pic1.2.3.1.1.1.4" class="ltx_tr">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.4.1" class="ltx_td ltx_align_left ltx_align_top">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.4.1.1" class="ltx_inline-block ltx_align_top" style="width:184.3pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.4.1.1.1" class="ltx_p">“Why X instead of Y?”</span>
</span></span>
<span id="A1.SS1.p1.pic1.2.3.1.1.1.4.2" class="ltx_td ltx_nopad_r ltx_align_left ltx_align_top">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.4.2.1" class="ltx_inline-block ltx_align_top" style="width:228.1pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.4.2.1.1" class="ltx_p">“Why was [X] recommended over [Y]?”</span>
</span></span></span>
<span id="A1.SS1.p1.pic1.2.3.1.1.1.5" class="ltx_tr">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.5.1" class="ltx_td ltx_align_left ltx_align_top">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.5.1.1" class="ltx_inline-block ltx_align_top" style="width:184.3pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.5.1.1.1" class="ltx_p">“Why was I given medication?”</span>
</span></span>
<span id="A1.SS1.p1.pic1.2.3.1.1.1.5.2" class="ltx_td ltx_nopad_r ltx_align_left ltx_align_top">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.5.2.1" class="ltx_inline-block ltx_align_top" style="width:228.1pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.5.2.1.1" class="ltx_p">“Why was he/she given [medication]?”</span>
</span></span></span>
<span id="A1.SS1.p1.pic1.2.3.1.1.1.6" class="ltx_tr">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.6.1" class="ltx_td ltx_align_left ltx_align_top ltx_border_bb">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.6.1.1" class="ltx_inline-block ltx_align_top" style="width:184.3pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.6.1.1.1" class="ltx_p">“Is this related to…?”</span>
</span></span>
<span id="A1.SS1.p1.pic1.2.3.1.1.1.6.2" class="ltx_td ltx_nopad_r ltx_align_left ltx_align_top ltx_border_bb">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.6.2.1" class="ltx_inline-block ltx_align_top" style="width:228.1pt;">
<span id="A1.SS1.p1.pic1.2.3.1.1.1.6.2.1.1" class="ltx_p">“Are his/her [symptoms] related to [condition]?”</span>
</span></span></span>
</span>
</span></span></span></span>
<span id="A1.SS1.p1.pic1.2.4" class="ltx_p"><span id="A1.SS1.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Input:<span id="A1.SS1.p1.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> Patient narrative.
<br class="ltx_break"></span>Output:<span id="A1.SS1.p1.pic1.2.4.1.2" class="ltx_text ltx_font_medium"> Concise clinician question (<math id="A1.SS1.p1.pic1.m2" class="ltx_Math" alttext="\leq" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><annotation encoding="application/x-tex">\leq</annotation></semantics></math>15 words).</span></span></span>
<span id="A1.SS1.p1.pic1.2.5" class="ltx_p"><em id="A1.SS1.p1.pic1.2.5.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Inference mode:</em><span id="A1.SS1.p1.pic1.2.5.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> <span id="A1.SS1.p1.pic1.2.5.2.1" class="ltx_text ltx_font_typewriter">ChainOfThought</span> prompting with post-processing to enforce the word limit.</span></span>
</span></span></span></foreignobject></g></g></svg>