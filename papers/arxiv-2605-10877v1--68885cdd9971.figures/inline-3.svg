<svg id="A1.SS2.p2.pic1" class="ltx_picture" height="389.72" overflow="visible" version="1.1" viewbox="0 0 629.92 389.72" width="629.92"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,389.72) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 383.81 C 0 387.07 2.64 389.72 5.91 389.72 L 624.02 389.72 C 627.28 389.72 629.92 387.07 629.92 383.81 L 629.92 5.91 C 629.92 2.64 627.28 0 624.02 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 366.84 L 627.95 366.84 L 627.95 5.91 C 627.95 3.73 626.19 1.97 624.02 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 375.16)"><foreignobject style="--ltx-fo-width:41.19em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="569.95"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.19em;">
<span id="A1.SS2.p2.pic1.1.1" class="ltx_p"><span id="A1.SS2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Prompt Template: Evidence Classifier</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 13.86)"><foreignobject style="--ltx-fo-width:47.43em;--ltx-fo-height:24.83em;--ltx-fo-depth:0.18em;font-size:10pt;" height="345.93" overflow="visible" transform="matrix(1 0 0 -1 0 343.51)" width="656.3"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.43em;">
<span id="A1.SS2.p2.pic1.2.1" class="ltx_p"><span id="A1.SS2.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are a medical assistant.</span></span>
<span id="A1.I2" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are provided with a patient narrative, patient question, and clinician question.</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are provided with the clinical notes related to the case.</span></span>
</span></span>
</span>
<span id="A1.SS2.p2.pic1.2.2" class="ltx_p"><span id="A1.SS2.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Classify each clinical note sentence as either <span id="A1.SS2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_bold">essential</span> or <span id="A1.SS2.p2.pic1.2.2.1.2" class="ltx_text ltx_font_bold">irrelevant</span> in addressing the patient question and clinician question. Provide a relevancy score (0–10) and reasoning for each.</span></span>
<span id="A1.SS2.p2.pic1.2.3" class="ltx_p"><span id="A1.SS2.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Be <span id="A1.SS2.p2.pic1.2.3.1.1" class="ltx_text ltx_font_bold">very critical</span> when assigning the essential tag. Only assign it if the note sentence is directly relevant to the specific question asked.</span></span>
<span id="A1.SS2.p2.pic1.2.4" class="ltx_p"><span id="A1.SS2.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">First-Order Relevance Only:<span id="A1.SS2.p2.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> A note is essential <em id="A1.SS2.p2.pic1.2.4.1.1.1" class="ltx_emph ltx_font_italic">only</em> if it directly answers or provides evidence for the question. Background context or treatment summaries are <em id="A1.SS2.p2.pic1.2.4.1.1.2" class="ltx_emph ltx_font_italic">not</em> essential.</span></span></span>
<span id="A1.SS2.p2.pic1.2.5" class="ltx_p"><span id="A1.SS2.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Input:<span id="A1.SS2.p2.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> Patient narrative, patient question, clinician question, clinical notes.
<br class="ltx_break"></span>Output per note:<span id="A1.SS2.p2.pic1.2.5.1.2" class="ltx_text ltx_font_medium"> <span id="A1.SS2.p2.pic1.2.5.1.2.1" class="ltx_text ltx_font_typewriter">&lt;id&gt;: &lt;sentence&gt; -&gt; essential|irrelevant -&gt; &lt;score&gt; -&gt; &lt;reasoning&gt;</span></span></span></span>
<span id="A1.SS2.p2.pic1.2.6" class="ltx_p"><em id="A1.SS2.p2.pic1.2.6.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Inference:</em><span id="A1.SS2.p2.pic1.2.6.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Run <math id="A1.SS2.p2.pic1.m1" class="ltx_Math" alttext="R{=}5" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></mrow><annotation encoding="application/x-tex">R{=}5</annotation></semantics></math> times at temperature 0.8; majority vote determines the final label.</span></span>
</span></span></span></foreignobject></g></g></svg>