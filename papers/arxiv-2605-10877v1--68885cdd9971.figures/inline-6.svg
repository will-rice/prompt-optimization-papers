<svg id="A1.SS4.p1.pic1" class="ltx_picture" height="310.12" overflow="visible" version="1.1" viewbox="0 0 629.92 310.12" width="629.92"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,310.12) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 304.21 C 0 307.48 2.64 310.12 5.91 310.12 L 624.02 310.12 C 627.28 310.12 629.92 307.48 629.92 304.21 L 629.92 5.91 C 629.92 2.64 627.28 0 624.02 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 287.24 L 627.95 287.24 L 627.95 5.91 C 627.95 3.73 626.19 1.97 624.02 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 295.57)"><foreignobject style="--ltx-fo-width:41.19em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="569.95"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.19em;">
<span id="A1.SS4.p1.pic1.1.1" class="ltx_p"><span id="A1.SS4.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Prompt Template: Stage A — Initial Alignment</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 13.93)"><foreignobject style="--ltx-fo-width:47.43em;--ltx-fo-height:19.07em;--ltx-fo-depth:0.18em;font-size:10pt;" height="266.33" overflow="visible" transform="matrix(1 0 0 -1 0 263.84)" width="656.3"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.43em;">
<span id="A1.SS4.p1.pic1.2.1" class="ltx_p"><span id="A1.SS4.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are a medical evidence alignment specialist. Align each answer sentence to the specific clinical note sentence(s) that <span id="A1.SS4.p1.pic1.2.1.1.1" class="ltx_text ltx_font_bold">directly</span> support it.</span></span>
<span id="A1.SS4.p1.pic1.2.2" class="ltx_p"><span id="A1.SS4.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Alignment Rules:<span id="A1.SS4.p1.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A1.I5" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A1.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I5.i1.p1" class="ltx_para">
<span id="A1.I5.i1.p1.1" class="ltx_p"><span id="A1.I5.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Align only when the answer sentence directly paraphrases, summarizes, or references information explicitly stated in the note sentence.</span></span>
</span></span>
<span id="A1.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I5.i2.p1" class="ltx_para">
<span id="A1.I5.i2.p1.1" class="ltx_p"><span id="A1.I5.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do not align based on indirect associations, background context, or inferential connections.</span></span>
</span></span>
<span id="A1.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I5.i3.p1" class="ltx_para">
<span id="A1.I5.i3.p1.1" class="ltx_p"><span id="A1.I5.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Over-citing (unnecessary links) and under-citing (missing links) are both penalized.</span></span>
</span></span>
<span id="A1.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I5.i4.p1" class="ltx_para">
<span id="A1.I5.i4.p1.1" class="ltx_p"><span id="A1.I5.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Each answer sentence must be attributed to at least one note sentence. If no direct support exists, choose the closest note sentence and assign a low confidence (0.10–0.30).</span></span>
</span></span>
</span>
<span id="A1.SS4.p1.pic1.2.3" class="ltx_p"><span id="A1.SS4.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Input:<span id="A1.SS4.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Patient narrative, patient question, clinician question, clinical note sentences, answer sentences.
<br class="ltx_break"></span>Output per answer sentence:
<br class="ltx_break"><span id="A1.SS4.p1.pic1.2.3.1.2" class="ltx_text ltx_font_typewriter ltx_font_medium">answer_sentence_k: [note_ids] (confidence=[scores])<span id="A1.SS4.p1.pic1.2.3.1.2.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>