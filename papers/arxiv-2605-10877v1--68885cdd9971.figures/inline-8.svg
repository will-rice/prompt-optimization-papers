<span id="A1.SS4.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.19em;">
<span id="A1.SS4.p3.pic1.1.1" class="ltx_p"><span id="A1.SS4.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Prompt Template: Stage C — Chain-of-Verification</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 13.34)"><foreignobject style="--ltx-fo-width:47.43em;--ltx-fo-height:16.33em;--ltx-fo-depth:0.14em;font-size:10pt;" height="227.79" overflow="visible" transform="matrix(1 0 0 -1 0 225.89)" width="656.3"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.43em;">
<span id="A1.SS4.p3.pic1.2.1" class="ltx_p"><span id="A1.SS4.p3.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are a verification specialist. For <span id="A1.SS4.p3.pic1.2.1.1.1" class="ltx_text ltx_font_bold">each</span> alignment link (answer sentence <math id="A1.SS4.p3.pic1.m1" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> <math id="A1.SS4.p3.pic1.m2" class="ltx_Math" alttext="\to" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\to</annotation></semantics></math> note sentence <math id="A1.SS4.p3.pic1.m3" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>), verify:</span></span>
<span id="A1.I7" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A1.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I7.i1.p1" class="ltx_para">
<span id="A1.I7.i1.p1.1" class="ltx_p"><span id="A1.I7.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Does answer sentence </span><math id="A1.I7.i1.p1.m1" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math><span id="A1.I7.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> directly paraphrase or reference specific information from note sentence </span><math id="A1.I7.i1.p1.m2" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math><span id="A1.I7.i1.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">?</span></span>
</span></span>
<span id="A1.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I7.i2.p1" class="ltx_para">
<span id="A1.I7.i2.p1.1" class="ltx_p"><span id="A1.I7.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">If note sentence </span><math id="A1.I7.i2.p1.m1" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math><span id="A1.I7.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> were removed, would answer sentence </span><math id="A1.I7.i2.p1.m2" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math><span id="A1.I7.i2.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> lose a specific piece of evidence it relies on?</span></span>
</span></span>
<span id="A1.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I7.i3.p1" class="ltx_para">
<span id="A1.I7.i3.p1.1" class="ltx_p"><span id="A1.I7.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Is the connection direct (not through inference or intermediate reasoning)?</span></span>
</span></span>
</span>
<span id="A1.SS4.p3.pic1.2.2" class="ltx_p"><span id="A1.SS4.p3.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">If <span id="A1.SS4.p3.pic1.2.2.1.1" class="ltx_text ltx_font_bold">any</span> check fails, remove the link. Return the final verified alignment.</span></span>
<span id="A1.SS4.p3.pic1.2.3" class="ltx_p"><span id="A1.SS4.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Additional input:<span id="A1.SS4.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Reflected alignment from Stage B.
<br class="ltx_break"><em id="A1.SS4.p3.pic1.2.3.1.1.1" class="ltx_emph ltx_font_italic">Post-hoc:</em> Run the full three-stage pipeline <math id="A1.SS4.p3.pic1.m4" class="ltx_Math" alttext="R" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><annotation encoding="application/x-tex">R</annotation></semantics></math> times; retain a link only if votes <math id="A1.SS4.p3.pic1.m5" class="ltx_Math" alttext="\geq\lceil R/2\rceil" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="1.110em" minsize="1.110em" stretchy="true">⌈</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="1.110em" minsize="1.110em" stretchy="true">⌉</mo></mrow></mrow><annotation encoding="application/x-tex">\geq\lceil R/2\rceil</annotation></semantics></math> and average confidence <math id="A1.SS4.p3.pic1.m6" class="ltx_Math" alttext="\geq 0.9" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.9</mn></mrow><annotation encoding="application/x-tex">\geq 0.9</annotation></semantics></math>.</span></span></span>
</span></span></span></foreignobject></g></g></svg>