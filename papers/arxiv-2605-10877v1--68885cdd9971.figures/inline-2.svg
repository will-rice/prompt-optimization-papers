<span id="A1.SS2.p1.pic1.2.1" class="ltx_p"><span id="A1.SS2.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Essential Reasoning:<span id="A1.SS2.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Given a patient narrative, patient question, clinician question, and a clinical note sentence, provide reasoning for why this note sentence <em id="A1.SS2.p1.pic1.2.1.1.1.1" class="ltx_emph ltx_font_italic">is essential</em> to address the question.</span></span></span>
<span id="A1.SS2.p1.pic1.2.2" class="ltx_p"><span id="A1.SS2.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Non-Essential Reasoning:<span id="A1.SS2.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Given the same inputs, provide reasoning for why this note sentence <em id="A1.SS2.p1.pic1.2.2.1.1.1" class="ltx_emph ltx_font_italic">is not essential</em> to address the question.</span></span></span>
<span id="A1.SS2.p1.pic1.2.3" class="ltx_p"><em id="A1.SS2.p1.pic1.2.3.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Purpose:</em><span id="A1.SS2.p1.pic1.2.3.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> These two prompts are used at training time to generate per-sentence reasoning traces, which serve as few-shot demonstrations for the classifier below.</span></span>
