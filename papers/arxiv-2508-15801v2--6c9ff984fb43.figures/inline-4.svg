<span id="A1.F6.pic1.1.1" class="ltx_p"><span id="A1.F6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Base Extraction Instructions used in DSPy optimization (ZIP Code)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.66 159.48)"><foreignobject style="--ltx-fo-width:45.95em;--ltx-fo-height:21.6em;--ltx-fo-depth:10.9em;font-size:10pt;" height="449.67" overflow="visible" transform="matrix(1 0 0 -1 0 298.84)" width="635.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.95em;">
<span id="A1.F6.pic1.2.1" class="ltx_p"><span id="A1.F6.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">General Extraction Instructions:<span id="A1.F6.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A1.I10" class="ltx_itemize">
<span id="A1.I10.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I10.i1.p1" class="ltx_para">
<span id="A1.I10.i1.p1.1" class="ltx_p"><span id="A1.I10.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Extract the value from the transcript using the given question, field type, and field description.</span></span>
</span></span>
<span id="A1.I10.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I10.i2.p1" class="ltx_para">
<span id="A1.I10.i2.p1.1" class="ltx_p"><span id="A1.I10.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question</span><span id="A1.I10.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: </span><span id="A1.I10.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{question}</span></span>
</span></span>
<span id="A1.I10.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I10.i3.p1" class="ltx_para">
<span id="A1.I10.i3.p1.1" class="ltx_p"><span id="A1.I10.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Field Type</span><span id="A1.I10.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: </span><span id="A1.I10.i3.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{output_type}</span></span>
</span></span>
<span id="A1.I10.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I10.i4.p1" class="ltx_para">
<span id="A1.I10.i4.p1.1" class="ltx_p"><span id="A1.I10.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Field Description</span><span id="A1.I10.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: </span><span id="A1.I10.i4.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{action_description}</span></span>
</span></span>
</span>
<span id="A1.F6.pic1.2.2" class="ltx_p"><span id="A1.F6.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Format:<span id="A1.F6.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A1.I11" class="ltx_itemize">
<span id="A1.I11.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I11.i1.p1" class="ltx_para">
<span id="A1.I11.i1.p1.1" class="ltx_p"><span id="A1.I11.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return only the extracted value</span></span>
</span></span>
<span id="A1.I11.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I11.i2.p1" class="ltx_para">
<span id="A1.I11.i2.p1.1" class="ltx_p"><span id="A1.I11.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not include any symbols, labels, or extra text</span></span>
</span></span>
</span>
<span id="A1.F6.pic1.2.3" class="ltx_p"><span id="A1.F6.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example:<span id="A1.F6.pic1.2.3.1.1" class="ltx_text"></span></span></span><pre id="A1.F6.pic1.2.4" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Input: transcript: &quot;...&quot;, Output: predicted: &quot;...&quot;
</pre>
<span id="A1.F6.pic1.2.5" class="ltx_p"><span id="A1.F6.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">ZIP Code Specific Guidelines:<span id="A1.F6.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A1.I12" class="ltx_itemize">
<span id="A1.I12.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I12.i1.p1" class="ltx_para">
<span id="A1.I12.i1.p1.1" class="ltx_p"><span id="A1.I12.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Extract exactly </span><span id="A1.I12.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">5 numeric digits</span></span>
</span></span>
<span id="A1.I12.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I12.i2.p1" class="ltx_para">
<span id="A1.I12.i2.p1.1" class="ltx_p"><span id="A1.I12.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not interpret ZIP codes as dates</span></span>
</span></span>
<span id="A1.I12.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I12.i3.p1" class="ltx_para">
<span id="A1.I12.i3.p1.1" class="ltx_p"><span id="A1.I12.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return the raw 5-digit number only</span></span>
</span></span>
<span id="A1.I12.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I12.i4.p1" class="ltx_para">
<span id="A1.I12.i4.p1.1" class="ltx_p"><span id="A1.I12.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example: </span><span id="A1.I12.i4.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;one two three four five&quot;</span><span id="A1.I12.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> → </span><span id="A1.I12.i4.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;12345&quot;</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>