</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.66 817.73)"><foreignobject style="--ltx-fo-width:45.95em;--ltx-fo-height:2.18em;--ltx-fo-depth:7.95em;font-size:10pt;" height="140.22" overflow="visible" transform="matrix(1 0 0 -1 0 30.21)" width="635.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.95em;">
<span id="A1.F5.pic1.2.1" class="ltx_p"><span id="A1.F5.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input Fields:<span id="A1.F5.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A1.I6" class="ltx_itemize">
<span id="A1.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i1.p1" class="ltx_para">
<span id="A1.I6.i1.p1.1" class="ltx_p"><span id="A1.I6.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Transcript</span><span id="A1.I6.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: </span><span id="A1.I6.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{transcript}</span></span>
</span></span>
<span id="A1.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i2.p1" class="ltx_para">
<span id="A1.I6.i2.p1.1" class="ltx_p"><span id="A1.I6.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Ground Truth</span><span id="A1.I6.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: </span><span id="A1.I6.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{ground_truth}</span></span>
</span></span>
<span id="A1.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i3.p1" class="ltx_para">
<span id="A1.I6.i3.p1.1" class="ltx_p"><span id="A1.I6.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Action Name</span><span id="A1.I6.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: </span><span id="A1.I6.i3.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{action_name}</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.66 8.66)"><foreignobject style="--ltx-fo-width:45.95em;--ltx-fo-height:48.81em;--ltx-fo-depth:0em;font-size:10pt;" height="675.45" overflow="visible" transform="matrix(1 0 0 -1 0 675.45)" width="635.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F5.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.95em;">
<span id="A1.F5.pic1.3.1" class="ltx_p"><span id="A1.F5.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:<span id="A1.F5.pic1.3.1.1.1" class="ltx_text ltx_font_medium"> Determine if the ground truth value can be extracted from the transcript.
<br class="ltx_break"></span>Rules:<span id="A1.F5.pic1.3.1.1.2" class="ltx_text"></span></span></span>
<span id="A1.I7" class="ltx_itemize">
<span id="A1.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i1.p1" class="ltx_para">
<span id="A1.I7.i1.p1.1" class="ltx_p"><span id="A1.I7.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the transcript contains the value (even with corrections) → </span><span id="A1.I7.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">true</span></span>
</span></span>
<span id="A1.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i2.p1" class="ltx_para">
<span id="A1.I7.i2.p1.1" class="ltx_p"><span id="A1.I7.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the transcript is vague or doesn’t contain the value → </span><span id="A1.I7.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">false</span></span>
</span></span>
<span id="A1.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i3.p1" class="ltx_para">
<span id="A1.I7.i3.p1.1" class="ltx_p"><span id="A1.I7.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the value is mentioned at any point → </span><span id="A1.I7.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">true</span></span>
</span></span>
</span>
<span id="A1.F5.pic1.3.2" class="ltx_p"><span id="A1.F5.pic1.3.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Examples:<span id="A1.F5.pic1.3.2.1.1" class="ltx_text"></span></span></span>
<span id="A1.I8" class="ltx_itemize">
<span id="A1.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I8.i1.p1" class="ltx_para">
<span id="A1.I8.i1.p1.1" class="ltx_p"><span id="A1.I8.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;My zip is one two three four five&quot;</span><span id="A1.I8.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I8.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">12345</span><span id="A1.I8.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> → </span><span id="A1.I8.i1.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">true</span></span>
</span></span>
<span id="A1.I8.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I8.i2.p1" class="ltx_para">
<span id="A1.I8.i2.p1.1" class="ltx_p"><span id="A1.I8.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;I don’t know&quot;</span><span id="A1.I8.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I8.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">12345</span><span id="A1.I8.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> → </span><span id="A1.I8.i2.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">false</span></span>
</span></span>
<span id="A1.I8.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I8.i3.p1" class="ltx_para">
<span id="A1.I8.i3.p1.1" class="ltx_p"><span id="A1.I8.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;seven oh ... no, nine oh two one oh&quot;</span><span id="A1.I8.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I8.i3.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">90210</span><span id="A1.I8.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> → </span><span id="A1.I8.i3.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">true</span></span>
</span></span>
</span>
<span id="A1.F5.pic1.3.3" class="ltx_p"><span id="A1.F5.pic1.3.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Date Format Considerations:<span id="A1.F5.pic1.3.3.1.1" class="ltx_text"></span></span></span>
<span id="A1.I9" class="ltx_itemize">
<span id="A1.I9.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I9.i1.p1" class="ltx_para">
<span id="A1.I9.i1.p1.1" class="ltx_p"><span id="A1.I9.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Accept continuous digit formats: </span>
<br class="ltx_break"><span id="A1.I9.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">e.g., </span><span id="A1.I9.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">01-15-2024</span><span id="A1.I9.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> → </span><span id="A1.I9.i1.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">01152024</span><span id="A1.I9.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I9.i1.p1.1.7" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">11524</span><span id="A1.I9.i1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">, etc.</span></span>
</span></span>
<span id="A1.I9.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I9.i2.p1" class="ltx_para">
<span id="A1.I9.i2.p1.1" class="ltx_p"><span id="A1.I9.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Spoken digit sequences: </span>
<br class="ltx_break"><span id="A1.I9.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">e.g., </span><span id="A1.I9.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;zero one one five two zero two four&quot;</span><span id="A1.I9.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> are valid</span></span>
</span></span>
</span>
<span id="A1.F5.pic1.3.4" class="ltx_p"><span id="A1.F5.pic1.3.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A1.F5.pic1.3.4.1.1" class="ltx_text ltx_font_medium"> <span id="A1.F5.pic1.3.4.1.1.1" class="ltx_text ltx_font_typewriter">true</span> or <span id="A1.F5.pic1.3.4.1.1.2" class="ltx_text ltx_font_typewriter">false</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>