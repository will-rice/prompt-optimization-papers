<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Target Value</span><span id="A1.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: </span><span id="A1.I2.i3.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{ground_truth}</span></span>
</span></span>
<span id="A1.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
