<span id="S2.SSx1.SSS0.Px3.pic1.2.1" class="ltx_p"><span id="S2.SSx1.SSS0.Px3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">to update the parameters, in this case, the <span id="S2.SSx1.SSS0.Px3.pic1.2.1.1.1" class="ltx_text ltx_markedasmath ltx_font_bold" style="--ltx-fg-color:#228B22;">Prompt</span>. In particular, given the current variable and the gradients (feedback) we collected for this variable, the optimizer seeks to update this variable.</span></span>
