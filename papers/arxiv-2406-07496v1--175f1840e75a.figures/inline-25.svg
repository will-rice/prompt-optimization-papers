<svg id="A7.SS1.pic1" class="ltx_picture" height="596.65" overflow="visible" version="1.1" viewbox="0 0 650 596.65" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,596.65) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 590.74 C 0 594 2.64 596.65 5.91 596.65 L 644.09 596.65 C 647.36 596.65 650 594 650 590.74 L 650 5.91 C 650 2.64 647.36 0 644.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F7F7F7;" fill="#F7F7F7" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 572.54 L 648.03 572.54 L 648.03 5.91 C 648.03 3.73 646.27 1.97 644.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 581.13)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A7.SS1.pic1.1.1" class="ltx_p"><span id="A7.SS1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Treatment Plan Loss Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:39.33em;--ltx-fo-depth:0.19em;font-size:10pt;" height="546.95" overflow="visible" transform="matrix(1 0 0 -1 0 544.26)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A7.SS1.pic1.2.1" class="ltx_p"><span id="A7.SS1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please act as an impartial and objective professional radiation oncologist. Your job is to evaluate the quality of radiation therapy treatment plans based on their dose volume histogram. You should consider the following protocols:</span></span>
<span id="A7.SS1.pic1.2.2" class="ltx_p"><span id="A7.SS1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;Clinical Protocols&gt;</span></span>
<span id="A7.SS1.pic1.2.3" class="ltx_p"><span id="A7.SS1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Note that the order above does not indicate priority; always prioritize the regions that have protocols that are more significantly violated.</span></span>
<span id="A7.SS1.pic1.2.4" class="ltx_p"><span id="A7.SS1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the dose-volume histograms of the candidate plans for evaluation; each entry in the dose-volume histograms (DVH) table indicates the percentage of volume receiving a dose higher than a certain Gy (specified in the first column).</span></span>
<span id="A7.SS1.pic1.2.5" class="ltx_p"><span id="A7.SS1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;DVH table&gt;</span></span>
<span id="A7.SS1.pic1.2.6" class="ltx_p"><span id="A7.SS1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">We also provide the statistics of the above DVH table for ease of evaluation.</span></span>
<span id="A7.SS1.pic1.2.7" class="ltx_p"><span id="A7.SS1.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;DVH statistics&gt;</span></span>
<span id="A7.SS1.pic1.2.8" class="ltx_p"><span id="A7.SS1.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now, based on the protocols, and the DVH, please evaluate the plans. Avoid any positional biases and ensure that the order in which the responses are presented does not influence your decision. Be as objective as possible. Your answer must:</span></span>
<span id="A7.I1" class="ltx_enumerate">
<span id="A7.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A7.I1.i1.p1" class="ltx_para">
<span id="A7.I1.i1.p1.1" class="ltx_p"><span id="A7.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(Evidence) Extract the corresponding entries from the DVH table based on the factors to consider.</span></span>
</span></span>
<span id="A7.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A7.I1.i2.p1" class="ltx_para">
<span id="A7.I1.i2.p1.1" class="ltx_p"><span id="A7.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(Interpretation) Based on the extracted entries from DVH table, interpret them as: </span><span id="A7.I1.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{percentage}%</span><span id="A7.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> of volume encompassing the dose more than </span><span id="A7.I1.i2.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{dose}</span><span id="A7.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> Gy for </span><span id="A7.I1.i2.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{organ}</span><span id="A7.I1.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A7.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A7.I1.i3.p1" class="ltx_para">
<span id="A7.I1.i3.p1.1" class="ltx_p"><span id="A7.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(Analysis) Combine the interpretation and the factors, analyze whether each of the numerical factors are met.</span></span>
</span></span>
</span>
<span id="A7.SS1.pic1.2.9" class="ltx_p"><span id="A7.SS1.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on the analysis on DVH tables, you need to produce a final evaluation. When all factors are satisfied, you should always answer no improvement is needed. If improvements are required, please provide suggestions on where to improve. Please ensure to follow the format below to return the evaluation results:
<br class="ltx_break">
<br class="ltx_break">&lt;FINAL&gt; Decision: [The plan does/doesn’t need to be improved.] Reasons: [list all factors that are not satisfied with detailed reasons, e.g. protocol X on (PTV/rectum/bladder/fh/body) is not satisfied because …] &lt;/FINAL&gt;
<br class="ltx_break">
<br class="ltx_break">The final answer in the end must strictly follow the format above.</span></span>
</span></span></span></foreignobject></g></g></svg>