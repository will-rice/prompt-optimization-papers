<span id="A6.SS2.p2.pic1.1.1" class="ltx_p"><span id="A6.SS2.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Molecule Optimization Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:25.89em;--ltx-fo-depth:0em;font-size:10pt;" height="358.31" overflow="visible" transform="matrix(1 0 0 -1 0 358.31)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A6.SS2.p2.pic1.2.1" class="ltx_p"><span id="A6.SS2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given a docking and a druglikeness score, and a molecule as a SMILES string provide a short criticism to improve the druglikeness of this molecule and its binding affinity with the protein {<span id="A6.SS2.p2.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">protein_name</span>}. For docking, lower is better (less than <math id="A6.SS2.p2.pic1.m1" class="ltx_Math" alttext="-10" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn></mrow><annotation encoding="application/x-tex">-10</annotation></semantics></math> is considered good) and for druglikeness, <math id="A6.SS2.p2.pic1.m2" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> is the best and <math id="A6.SS2.p2.pic1.m3" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math> is the worst (greater than <math id="A6.SS2.p2.pic1.m4" class="ltx_Math" alttext="0.8" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.8</mn><annotation encoding="application/x-tex">0.8</annotation></semantics></math> is considered good). In terms of prioritization, the docking score is {<span id="A6.SS2.p2.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">vina_qed_ratio</span>} times as important as the druglikeness score. Make sure your criticism is very succinct and to the point. 
<br class="ltx_break"></span></span>
<span id="A6.SS2.p2.pic1.2.2" class="ltx_p"><span id="A6.SS2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;"># <span id="A6.SS2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter">if smiles_string is valid</span> 
<br class="ltx_break">SMILES: {<span id="A6.SS2.p2.pic1.2.2.1.2" class="ltx_text ltx_font_typewriter">smiles_string</span>}, Docking: {<span id="A6.SS2.p2.pic1.2.2.1.3" class="ltx_text ltx_font_typewriter">Vina</span>}, Druglikeness: {<span id="A6.SS2.p2.pic1.2.2.1.4" class="ltx_text ltx_font_typewriter">QED</span>} 
<br class="ltx_break"></span></span>
<span id="A6.SS2.p2.pic1.2.3" class="ltx_p"><span id="A6.SS2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;"># <span id="A6.SS2.p2.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">if smiles_string is invalid</span> 
<br class="ltx_break">SMILES: {<span id="A6.SS2.p2.pic1.2.3.1.2" class="ltx_text ltx_font_typewriter">smiles_string</span>}, This molecule is invalid.</span></span>
</span></span></span></foreignobject></g></g></svg>