<svg id="S2.SSx1.SSS0.Px2.pic1" class="ltx_picture" height="211.24" overflow="visible" version="1.1" viewbox="0 0 650 211.24" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,211.24) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#140091;" fill="#140091" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 205.33 C 0 208.6 2.64 211.24 5.91 211.24 L 644.09 211.24 C 647.36 211.24 650 208.6 650 205.33 L 650 5.91 C 650 2.64 647.36 0 644.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F6F5FB;" fill="#F6F5FB" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 186.85 L 648.03 186.85 L 648.03 5.91 C 648.03 3.73 646.27 1.97 644.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 195.45)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:0.71em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.58" overflow="visible" transform="matrix(1 0 0 -1 0 9.89)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.SSx1.SSS0.Px2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="S2.SSx1.SSS0.Px2.pic1.1.1" class="ltx_p"><span id="S2.SSx1.SSS0.Px2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Gradient computation for the simple graph: <math id="S2.SSx1.SSS0.Px2.pic1.m1" class="ltx_Math" alttext="\textbf{{\color[rgb]{0.132,0.545,0.132}{\text{Prompt}}}}\xrightarrow{{\color[rgb]{1,1,1}\text{LLM}}}\text{Prediction}\xrightarrow{{\color[rgb]{1,1,1}\text{LLM}}}\text{Evaluation}" display="inline" intent=":literal"><semantics><mrow><mtext style="--ltx-fg-color:#228B22;" class="ltx_mathvariant_bold" mathcolor="#228B22">Prompt</mtext><mover accent="true"><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">→</mo><mtext style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" mathsize="0.700em">LLM</mtext></mover><mtext style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">Prediction</mtext><mover accent="true"><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">→</mo><mtext style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" mathsize="0.700em">LLM</mtext></mover><mtext style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">Evaluation</mtext></mrow><annotation encoding="application/x-tex">\textbf{{\color[rgb]{0.132,0.545,0.132}{\text{Prompt}}}}\xrightarrow{{\color[rgb]{1,1,1}\text{LLM}}}\text{Prediction}\xrightarrow{{\color[rgb]{1,1,1}\text{LLM}}}\text{Evaluation}</annotation></semantics></math></span></span>
