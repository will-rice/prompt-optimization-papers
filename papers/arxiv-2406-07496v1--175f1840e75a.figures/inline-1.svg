<span id="S2.SSx1.SSS0.Px2.pic1.p2" class="ltx_para">
<span id="S2.EGx2" class="ltx_equationgroup ltx_eqn_align ltx_eqn_table">

<span id="S2.E4"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="S2.E4.m1" class="ltx_Math" alttext="\displaystyle\frac{\partial\text{Evaluation}}{\partial\text{Prediction}}" display="inline" intent=":literal"><semantics><mstyle displaystyle="true"><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Evaluation</mtext></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Prediction</mtext></mrow></mfrac></mstyle><annotation encoding="application/x-tex">\displaystyle\frac{\partial\text{Evaluation}}{\partial\text{Prediction}}</annotation></semantics></math></span>
<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="S2.E4.m2" class="ltx_Math" alttext="\displaystyle={\color[rgb]{0.25,0.1,1}{\nabla}_{\text{\text{LLM}}}}(\text{Prediction},\text{Evaluation})," display="inline" intent=":literal"><semantics><mrow><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mo style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF" mathsize="1.200em">∇</mo><mtext style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF" mathsize="1.200em">LLM</mtext></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Prediction</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Evaluation</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\displaystyle={\color[rgb]{0.25,0.1,1}{\nabla}_{\text{\text{LLM}}}}(\text{Prediction},\text{Evaluation}),</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(4)</span></span></span></span>
<span id="S2.E5"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="S2.E5.m1" class="ltx_Math" alttext="\displaystyle\frac{\partial\text{Evaluation}}{\partial{\color[rgb]{0.132,0.545,0.132}\textbf{\text{Prompt}}}}=\frac{\partial\text{Evaluation}}{\partial\text{Prediction}}\circ\frac{\partial\text{Prediction}}{\partial{\color[rgb]{0.132,0.545,0.132}\textbf{\text{Prompt}}}}" display="inline" intent=":literal"><semantics><mrow><mstyle displaystyle="true"><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Evaluation</mtext></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mtext style="--ltx-fg-color:#228B22;" class="ltx_mathvariant_bold" mathcolor="#228B22">Prompt</mtext></mrow></mfrac></mstyle><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mstyle displaystyle="true"><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Evaluation</mtext></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Prediction</mtext></mrow></mfrac></mstyle><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">∘</mo><mstyle displaystyle="true"><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Prediction</mtext></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mtext style="--ltx-fg-color:#228B22;" class="ltx_mathvariant_bold" mathcolor="#228B22">Prompt</mtext></mrow></mfrac></mstyle></mrow></mrow><annotation encoding="application/x-tex">\displaystyle\frac{\partial\text{Evaluation}}{\partial{\color[rgb]{0.132,0.545,0.132}\textbf{\text{Prompt}}}}=\frac{\partial\text{Evaluation}}{\partial\text{Prediction}}\circ\frac{\partial\text{Prediction}}{\partial{\color[rgb]{0.132,0.545,0.132}\textbf{\text{Prompt}}}}</annotation></semantics></math></span>
<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="S2.E5.m2" class="ltx_Math" alttext="\displaystyle={\color[rgb]{0.25,0.1,1}{\nabla}_{\text{\text{LLM}}}}({\color[rgb]{0.132,0.545,0.132}\textbf{\text{Prompt}}},\text{Prediction},\frac{\partial\text{Evaluation}}{\partial\text{Prediction}})," display="inline" intent=":literal"><semantics><mrow><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mo style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF" mathsize="1.200em">∇</mo><mtext style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF" mathsize="1.200em">LLM</mtext></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mtext style="--ltx-fg-color:#228B22;" class="ltx_mathvariant_bold" mathcolor="#228B22">Prompt</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Prediction</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mstyle displaystyle="true"><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Evaluation</mtext></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Prediction</mtext></mrow></mfrac></mstyle><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\displaystyle={\color[rgb]{0.25,0.1,1}{\nabla}_{\text{\text{LLM}}}}({\color[rgb]{0.132,0.545,0.132}\textbf{\text{Prompt}}},\text{Prediction},\frac{\partial\text{Evaluation}}{\partial\text{Prediction}}),</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(5)</span></span></span></span>
</span>
</span>
<span id="S2.SSx1.SSS0.Px2.pic1.p1" class="ltx_para ltx_noindent">
<span id="S2.SSx1.SSS0.Px2.pic1.p1.1" class="ltx_p"><span id="S2.SSx1.SSS0.Px2.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">where we use </span><math id="S2.SSx1.SSS0.Px2.pic1.p1.m1" class="ltx_Math" alttext="{\color[rgb]{0.25,0.1,1}{\nabla}_{\text{\text{LLM}}}}" display="inline" intent=":literal"><semantics><msub><mo style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF" mathsize="1.200em">∇</mo><mtext style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF" mathsize="1.200em">LLM</mtext></msub><annotation encoding="application/x-tex">{\color[rgb]{0.25,0.1,1}{\nabla}_{\text{\text{LLM}}}}</annotation></semantics></math><span id="S2.SSx1.SSS0.Px2.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> for the gradient operator when the forward function is an LLM call.</span><span id="footnote1" class="ltx_note ltx_role_footnote"><sup class="ltx_note_mark">1</sup><span class="ltx_note_outer"><span class="ltx_note_content"><sup class="ltx_note_mark">1</sup>
                              <span class="ltx_tag ltx_tag_note">1</span>
                              
                              
                              
                            Note that we overload the notation to denote both for cases when the output variable does not have successors (e.g., <math id="footnote1.m1" class="ltx_Math" alttext="{\color[rgb]{0.25,0.1,1}{\nabla}_{\text{{\color[rgb]{0.25,0.1,1}\text{LLM}}}}}(\text{Prediction},\text{Evaluation})" display="inline" intent=":literal"><semantics><mrow><msub><mo style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF" mathsize="1.200em">∇</mo><mtext style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF" mathsize="1.200em">LLM</mtext></msub><mrow><mo stretchy="false">(</mo><mtext>Prediction</mtext><mo>,</mo><mtext>Evaluation</mtext><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">{\color[rgb]{0.25,0.1,1}{\nabla}_{\text{{\color[rgb]{0.25,0.1,1}\text{LLM}}}}}(\text{Prediction},\text{Evaluation})</annotation></semantics></math>) and when it has successors, and thus gradients (e.g., <math id="footnote1.m2" class="ltx_Math" alttext="{\color[rgb]{0.25,0.1,1}{\nabla}_{\text{\text{LLM}}}}({\color[rgb]{0.132,0.545,0.132}\textbf{\text{Prompt}}},\text{Prediction},\frac{\partial\text{Loss}}{\partial\text{Prediction}})" display="inline" intent=":literal"><semantics><mrow><msub><mo style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF" mathsize="1.200em">∇</mo><mtext style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF" mathsize="1.200em">LLM</mtext></msub><mrow><mo stretchy="false">(</mo><mtext style="--ltx-fg-color:#228B22;" class="ltx_mathvariant_bold" mathcolor="#228B22">Prompt</mtext><mo>,</mo><mtext>Prediction</mtext><mo>,</mo><mfrac><mrow><mo>∂</mo><mtext>Loss</mtext></mrow><mrow><mo>∂</mo><mtext>Prediction</mtext></mrow></mfrac><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">{\color[rgb]{0.25,0.1,1}{\nabla}_{\text{\text{LLM}}}}({\color[rgb]{0.132,0.545,0.132}\textbf{\text{Prompt}}},\text{Prediction},\frac{\partial\text{Loss}}{\partial\text{Prediction}})</annotation></semantics></math>).</span></span></span><span id="S2.SSx1.SSS0.Px2.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> In particular, this function returns natural language feedback such as ‘</span><span id="S2.SSx1.SSS0.Px2.pic1.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">This prediction can be improved by…</span><span id="S2.SSx1.SSS0.Px2.pic1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">’ where the feedback describes how to modify the variable to improve the downstream objective, analogous to gradients in optimization. We first collect feedback to the </span><span id="S2.SSx1.SSS0.Px2.pic1.p1.1.6" class="ltx_text ltx_markedasmath" style="--ltx-fg-color:#000000;">Prediction</span><span id="S2.SSx1.SSS0.Px2.pic1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> variable using the evaluation. Then, given this feedback and the (</span><math id="S2.SSx1.SSS0.Px2.pic1.p1.m3" class="ltx_Math" alttext="{\color[rgb]{0.132,0.545,0.132}\textbf{\text{Prompt}}}\xrightarrow{{\color[rgb]{0.25,0.1,1}\text{LLM}}}\text{Prediction}" display="inline" intent=":literal"><semantics><mrow><mtext style="--ltx-fg-color:#228B22;" class="ltx_mathvariant_bold" mathcolor="#228B22">Prompt</mtext><mover accent="true"><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">→</mo><mtext style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF" mathsize="0.700em">LLM</mtext></mover><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Prediction</mtext></mrow><annotation encoding="application/x-tex">{\color[rgb]{0.132,0.545,0.132}\textbf{\text{Prompt}}}\xrightarrow{{\color[rgb]{0.25,0.1,1}\text{LLM}}}\text{Prediction}</annotation></semantics></math><span id="S2.SSx1.SSS0.Px2.pic1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">) call, we collect the feedback on the </span><span id="S2.SSx1.SSS0.Px2.pic1.p1.1.9" class="ltx_text ltx_markedasmath ltx_font_bold" style="--ltx-fg-color:#228B22;">Prompt</span><span id="S2.SSx1.SSS0.Px2.pic1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span></span></span></foreignobject></g></g></svg>