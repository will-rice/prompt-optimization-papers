<span id="S2.E9"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="S2.E9.m1" class="ltx_Math" alttext="\displaystyle x_{\textrm{new}}={\color[rgb]{0.25,0.1,1}\text{TGD.step}}(x,\frac{\partial\mathcal{L}}{\partial x})\triangleq" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">new</mtext></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mtext style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF">TGD.step</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mstyle displaystyle="true"><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℒ</mi></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow></mfrac></mstyle><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≜</mo><mphantom></mphantom></mrow><annotation encoding="application/x-tex">\displaystyle x_{\textrm{new}}={\color[rgb]{0.25,0.1,1}\text{TGD.step}}(x,\frac{\partial\mathcal{L}}{\partial x})\triangleq</annotation></semantics></math></span>
<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="S2.E9.m2" class="ltx_math_unparsed" alttext="\displaystyle\ {\color[rgb]{0.25,0.1,1}\text{LLM}}(\texttt{Below are the criticisms on \lx@text@lbrace x\lx@text@rbrace:}" display="inline" intent=":literal"><semantics><mrow><mtext style="--ltx-fg-color:#401AFF;" mathcolor="#401AFF">LLM</mtext><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">Below are the criticisms on {x}:</mtext></mrow></mrow><annotation encoding="application/x-tex">\displaystyle\ {\color[rgb]{0.25,0.1,1}\text{LLM}}(\texttt{Below are the criticisms on \lx@text@lbrace x\lx@text@rbrace:}</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(9)</span></span></span></span>
<span id="S2.Ex6"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_eqn_cell"></span>
<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="S2.Ex6.m1" class="ltx_Math" alttext="\displaystyle\ \phantom{{\color[rgb]{0.25,0.1,1}\text{LLM}}(}\left\{\frac{\partial\mathcal{L}}{\partial x}\right\}" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">{</mo><mstyle displaystyle="true"><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℒ</mi></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow></mfrac></mstyle><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">}</mo></mrow><annotation encoding="application/x-tex">\displaystyle\ \phantom{{\color[rgb]{0.25,0.1,1}\text{LLM}}(}\left\{\frac{\partial\mathcal{L}}{\partial x}\right\}</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
<span id="S2.Ex7"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_eqn_cell"></span>
<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="S2.Ex7.m1" class="ltx_Math" alttext="\displaystyle\ \phantom{{\color[rgb]{0.25,0.1,1}\text{LLM}}(}\texttt{Incorporate the criticisms, and produce a new variable.})." display="inline" intent=":literal"><semantics><mrow><mrow><mo fence="true" rspace="3.060em">OPEN</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">Incorporate the criticisms, and produce a new variable.</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\displaystyle\ \phantom{{\color[rgb]{0.25,0.1,1}\text{LLM}}(}\texttt{Incorporate the criticisms, and produce a new variable.}).</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="S2.SSx1.SSS0.Px3.pic2.p1.1" class="ltx_p"><span id="S2.SSx1.SSS0.Px3.pic2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">where </span><math id="S2.SSx1.SSS0.Px3.pic2.p1.m1" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math><span id="S2.SSx1.SSS0.Px3.pic2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> is the variable we would like to improve, and </span><math id="S2.SSx1.SSS0.Px3.pic2.p1.m2" class="ltx_Math" alttext="\frac{\partial\mathcal{L}}{\partial x}" display="inline" intent=":literal"><semantics><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℒ</mi></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow></mfrac><annotation encoding="application/x-tex">\frac{\partial\mathcal{L}}{\partial x}</annotation></semantics></math><span id="S2.SSx1.SSS0.Px3.pic2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is the feedback we obtained for the variable during the backward pass</span><span id="footnote3" class="ltx_note ltx_role_footnote"><sup class="ltx_note_mark">3</sup><span class="ltx_note_outer"><span class="ltx_note_content"><sup class="ltx_note_mark">3</sup>
                              <span class="ltx_tag ltx_tag_note">3</span>
                              
                              
                              
                            The exact prompts we use are different to ensure generality and flexibility; we use these examples only for exposition.</span></span></span><span id="S2.SSx1.SSS0.Px3.pic2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">. Similar to the gradient operator, this function also does not depend on the domain of application, and TGD implementation is the same across all uses of the framework.</span></span>
</span></span></span></span></foreignobject></g></g></svg>