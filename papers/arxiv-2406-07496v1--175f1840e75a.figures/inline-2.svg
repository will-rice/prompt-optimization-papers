</span>
<span id="S2.SSx1.SSS0.Px2.pic2.2.1" class="ltx_p"><span id="S2.SSx1.SSS0.Px2.pic2.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">where the gradient object is a combination of the context in which the variable appears and the feedback obtained from an LLM<span id="footnote2" class="ltx_note ltx_role_footnote"><sup class="ltx_note_mark">2</sup><span class="ltx_note_outer"><span class="ltx_note_content"><sup class="ltx_note_mark">2</sup>
                              <span class="ltx_tag ltx_tag_note"><span id="footnote2.1" class="ltx_text" style="--ltx-fg-color:#000000;">2</span></span>
                              
                              
                              
                            <span id="footnote2.6" class="ltx_text" style="--ltx-fg-color:#000000;">The exact prompts we use are different to ensure generality and flexibility; we use these examples only for exposition.</span></span></span></span>, defined analogously to <cite class="ltx_cite ltx_citemacro_cite">[<a href="#bib.bibx25" title class="ltx_ref">25</a>]</cite>. Note that this operator does not depend on, e.g., the application domain. Once implemented, the gradient operator for LLM calls are fixed throughout the framework for all applications.</span></span>
