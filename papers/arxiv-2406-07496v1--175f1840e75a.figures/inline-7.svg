<span id="S3.SS3.p9.pic1.p1" class="ltx_para ltx_noindent">
<span id="S3.SS3.p9.pic1.p1.1" class="ltx_p"><span id="S3.SS3.p9.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#228B22;">Prompt</span><span id="S3.SS3.p9.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"> at initialization (GSM8k Accuracy<math id="S3.SS3.p9.pic1.p1.m1" class="ltx_Math" alttext="=72.9\%" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">72.9</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow></mrow><annotation encoding="application/x-tex">=72.9\%</annotation></semantics></math>):</span></span>
</span>
<span id="S3.SS3.p9.pic1.p2" class="ltx_para">
<span id="S3.SS3.p9.pic1.p2.1" class="ltx_p"><span id="S3.SS3.p9.pic1.p2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You will answer a mathematical reasoning question. Think step by step. Always conclude the last line of your response should be of the following format: ’Answer: $VALUE’ where VALUE is a numerical value.&quot;<span id="S3.SS3.p9.pic1.p2.1.1.1" class="ltx_text"></span></span></span>
<span id="S3.SS3.p9.pic1.p2.2" class="ltx_p"><span id="S3.SS3.p9.pic1.p2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#228B22;">Prompt</span><span id="S3.SS3.p9.pic1.p2.2.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"> after 12 iterations with batch size 3 (GSM8k Accuracy<math id="S3.SS3.p9.pic1.m1" class="ltx_Math" alttext="=81.1\%" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">81.1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow></mrow><annotation encoding="application/x-tex">=81.1\%</annotation></semantics></math>):<span id="S3.SS3.p9.pic1.p2.2.2.1" class="ltx_text"></span></span></span>
<span id="S3.SS3.p9.pic1.p2.3" class="ltx_p"><span id="S3.SS3.p9.pic1.p2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You will answer a mathematical reasoning question. Restate the problem in your own words to ensure understanding. Break down the problem into smaller steps, explaining each calculation in detail. Verify each step and re-check your calculations for accuracy. Use proper mathematical notation and maintain consistency with the context of the question. Always conclude with the final answer in the following format: ’Answer: $VALUE’ where VALUE is a numerical value.<span id="S3.SS3.p9.pic1.p2.3.1.1" class="ltx_text"></span></span></span>
</span></span></span></span></foreignobject></g></g></svg>