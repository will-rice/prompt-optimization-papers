<span id="S5.F3.pic2.2.1" class="ltx_p"><span id="S5.F3.pic2.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Noise can reverse the ordering of candidates with similar utility. With no backtracking, an early token-level decision can propagate through subsequent iterations. DP-ES does not eliminate noisy rankings; its population instead retains complete alternatives that can recover in later rounds.</span></span>
