<span id="S5.F3.pic3.2.1" class="ltx_p"><span id="S5.F3.pic3.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Final prompt on GSM8K (real log, <math id="S5.F3.pic3.m1" class="ltx_Math" alttext="\varepsilon{\leq}1.0" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ε</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.0</mn></mrow><annotation encoding="application/x-tex">\varepsilon{\leq}1.0</annotation></semantics></math>):<span id="S5.F3.pic3.2.1.1.1" class="ltx_text ltx_font_medium"> <span id="S5.F3.pic3.2.1.1.1.1" class="ltx_text ltx_font_italic">“You are a math tutor. Solve the question carefully and show reasoning: </span><span id="S5.F3.pic3.2.1.1.1.2" class="ltx_text" style="--ltx-fg-color:#008000;">{<span id="S5.F3.pic3.2.1.1.1.2.1" class="ltx_text ltx_font_italic">question</span>}</span><span id="S5.F3.pic3.2.1.1.1.3" class="ltx_text ltx_font_italic">  (Provide detailed reasoning and justification.) (Be concise and accurate.)”</span>  </span><span id="S5.F3.pic3.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#008000;">[{question} preserved]</span><span id="S5.F3.pic3.2.1.1.3" class="ltx_text ltx_font_medium"> 
<br class="ltx_break" style="--ltx-break-space:3.0pt;">
</span>Mechanism:<span id="S5.F3.pic3.2.1.1.4" class="ltx_text ltx_font_medium"> Prompt-level mutations operate on complete strings; population diversity (6 prompts/round) supplies alternatives after noise-induced rank inversions. </span>Result:<span id="S5.F3.pic3.2.1.1.5" class="ltx_text ltx_font_medium"> <math id="S5.F3.pic3.m2" class="ltx_Math" alttext="88.1{\pm}3.2\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">88.1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">±</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3.2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow></mrow><annotation encoding="application/x-tex">88.1{\pm}3.2\%</annotation></semantics></math> versus DP-OPT’s <math id="S5.F3.pic3.m3" class="ltx_Math" alttext="49.5{\pm}28.5\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">49.5</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">±</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">28.5</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow></mrow><annotation encoding="application/x-tex">49.5{\pm}28.5\%</annotation></semantics></math> across 30 runs.</span></span></span>
