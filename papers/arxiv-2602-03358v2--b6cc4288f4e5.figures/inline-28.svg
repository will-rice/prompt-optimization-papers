<span id="A7.SS6.p1.pic1.p2" class="ltx_para">
<span id="A7.SS6.p1.pic1.p2.1" class="ltx_p"><span id="A7.SS6.p1.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">When solving AIME problems, begin by carefully analyzing the given conditions and identifying key mathematical structures—such as symmetry, number theory properties, geometry configurations, or algebraic identities. Look for patterns or known formulas, and consider simplifying the problem through substitution, symmetry, or known theorems. Pay close attention to constraints like integer values, divisibility, or geometric relationships. For problems involving probability, use complementary counting or expected values; for number theory, factor numbers and use modular arithmetic. For geometry, look for right triangles, similar figures, or coordinate geometry applications. For algebraic expressions, simplify step-by-step, and watch for telescoping series or known identities. If the answer is a fraction, reduce it to lowest terms and compute the sum of numerator and denominator. Always verify that intermediate steps are consistent with the problem constraints, and check for integer solutions or specific conditions like coprimality or divisibility. Finally, double-check arithmetic and avoid careless errors in computation.</span></span>
</span>
