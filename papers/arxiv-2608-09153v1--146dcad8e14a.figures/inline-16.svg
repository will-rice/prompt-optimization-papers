</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 10.99)"><foreignobject style="--ltx-fo-width:35.96em;--ltx-fo-height:26.08em;--ltx-fo-depth:0.18em;font-size:10pt;" height="363.23" overflow="visible" transform="matrix(1 0 0 -1 0 360.8)" width="497.59"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A11.SS7.SSS2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.96em;">
<span id="A11.SS7.SSS2.p4.pic1.2.1" class="ltx_p"><span id="A11.SS7.SSS2.p4.pic1.2.1.1" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Policy Number: PROC-2024-008
<br class="ltx_break">Effective Date: October 1, 2024
<br class="ltx_break">Approved By: CFO, Chief Procurement Officer
<br class="ltx_break">Supersedes: PROC-2023-015<span id="A11.SS7.SSS2.p4.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A11.SS7.SSS2.p4.pic1.2.2" class="ltx_p"><span id="A11.SS7.SSS2.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Section 3.2: Professional Services Engagements<span id="A11.SS7.SSS2.p4.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A11.SS7.SSS2.p4.pic1.2.3" class="ltx_p"><span id="A11.SS7.SSS2.p4.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">All professional services engagements exceeding <span id="A11.SS7.SSS2.p4.pic1.2.3.1.1" class="ltx_text ltx_font_bold">$25,000</span> require:</span></span>
<span id="A11.I6" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A11.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(1)</span> 
<span id="A11.I6.i1.p1" class="ltx_para">
<span id="A11.I6.i1.p1.1" class="ltx_p"><span id="A11.I6.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Procurement Office review and approval</span></span>
</span></span>
<span id="A11.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(2)</span> 
<span id="A11.I6.i2.p1" class="ltx_para">
<span id="A11.I6.i2.p1.1" class="ltx_p"><span id="A11.I6.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Competitive bid documentation (minimum 3 quotes) OR approved sole source justification</span></span>
</span></span>
<span id="A11.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(3)</span> 
<span id="A11.I6.i3.p1" class="ltx_para">
<span id="A11.I6.i3.p1.1" class="ltx_p"><span id="A11.I6.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Legal review of contract terms</span></span>
</span></span>
<span id="A11.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(4)</span> 
<span id="A11.I6.i4.p1" class="ltx_para">
<span id="A11.I6.i4.p1.1" class="ltx_p"><span id="A11.I6.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Budget authority verification</span></span>
</span></span>
</span>
<span id="A11.SS7.SSS2.p4.pic1.2.4" class="ltx_p"><span id="A11.SS7.SSS2.p4.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">This threshold applies to: Consulting services, Contractor/staff augmentation, Advisory services, Implementation services.</span></span>
<span id="A11.SS7.SSS2.p4.pic1.2.5" class="ltx_p"><span id="A11.SS7.SSS2.p4.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">IMPORTANT:<span id="A11.SS7.SSS2.p4.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> Previous threshold of $50,000 is </span>SUPERSEDED<span id="A11.SS7.SSS2.p4.pic1.2.5.1.2" class="ltx_text ltx_font_medium">.
<br class="ltx_break"><span id="A11.SS7.SSS2.p4.pic1.2.5.1.2.1" class="ltx_text ltx_font_italic">Reference: Board Resolution BR-2024-Q3-017</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>