<svg id="S4.SS3.SSS0.Px2.p2.pic1" class="ltx_picture" height="76.77" overflow="visible" version="1.1" viewbox="0 0 484.51 76.77" width="484.51"><g transform="translate(0,76.77) matrix(1 0 0 -1 0 0) translate(242.26,0) translate(0,38.38)"><g style="--ltx-stroke-color:#1C6E8C;--ltx-fill-color:#E8F3FA;" fill="#E8F3FA" stroke="#1C6E8C" stroke-width="0.6pt"><path d="M 239.07 37.97 L -239.07 37.97 C -240.6 37.97 -241.84 36.73 -241.84 35.2 L -241.84 -35.2 C -241.84 -36.73 -240.6 -37.97 -239.07 -37.97 L 239.07 -37.97 C 240.6 -37.97 241.84 -36.73 241.84 -35.2 L 241.84 35.2 C 241.84 36.73 240.6 37.97 239.07 37.97 Z M -241.84 -37.97" /></g><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.6pt" transform="matrix(1.0 0.0 0.0 1.0 -236.3 -3.46)"><foreignobject style="--ltx-fo-width:34.16em;--ltx-fo-height:2.69em;--ltx-fo-depth:2.19em;font-size:10pt;" height="67.63" overflow="visible" transform="matrix(1 0 0 -1 0 37.28)" width="472.68"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS3.SSS0.Px2.p2.pic1.1" class="ltx_inline-sectional-block ltx_minipage">
                      
<section id="S4.SS3.SSS0.Px3" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph">Phase A: optimize roles while fixing aggregation prompts.</h4>

<span id="S4.SS3.SSS0.Px3.p1" class="ltx_para">
<span id="S4.SS3.SSS0.Px3.p1.1" class="ltx_p">We keep <math id="S4.SS3.SSS0.Px3.p1.m1" class="ltx_Math" alttext="\Psi^{(k)}" display="inline" intent=":literal"><semantics><msup><mi mathvariant="normal">Ψ</mi><mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo></mrow></msup><annotation encoding="application/x-tex">\Psi^{(k)}</annotation></semantics></math> fixed, roll out trajectories, compute <math id="S4.SS3.SSS0.Px3.p1.m2" class="ltx_Math" alttext="\{C^{\text{role}}_{i}\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><msubsup><mi>C</mi><mi>i</mi><mtext>role</mtext></msubsup><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{C^{\text{role}}_{i}\}</annotation></semantics></math>, select a subset of low-credit roles (e.g., bottom-<math id="S4.SS3.SSS0.Px3.p1.m3" class="ltx_Math" alttext="K" display="inline" intent=":literal"><semantics><mi>K</mi><annotation encoding="application/x-tex">K</annotation></semantics></math> or below a threshold), and update only their prompts using textual gradients (Eq. (<a href="#S3.E7" title="In Textual-Gradient Prompt Update. ‣ 3 Problem Formulation ‣ Unifying Temporal and Structural Credit Assignment in LLM-Based Multi-Agent Prompt Optimization" class="ltx_ref"><span class="ltx_text ltx_ref_tag">7</span></a>)):</span>
<span id="S4.E12" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="S4.E12.m1" class="ltx_Math" alttext="\Phi^{\text{role},(k+1)}\leftarrow\textsc{RoleOpt}\big(\Phi^{\text{role},(k)};\,\Psi^{(k)},\,\{C^{\text{role}}_{i}\}\big)." display="block" intent=":literal"><semantics><mrow><mrow><msup><mi mathvariant="normal">Φ</mi><mrow><mtext>role</mtext><mo>,</mo><mrow><mo stretchy="false">(</mo><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy="false">)</mo></mrow></mrow></msup><mo stretchy="false">←</mo><mrow><mtext class="ltx_font_smallcaps">RoleOpt</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo maxsize="1.200em" minsize="1.200em">(</mo><msup><mi mathvariant="normal">Φ</mi><mrow><mtext>role</mtext><mo>,</mo><mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo></mrow></mrow></msup><mo>,</mo><msup><mi mathvariant="normal">Ψ</mi><mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo></mrow></msup><mo>,</mo><mrow><mo stretchy="false">{</mo><msubsup><mi>C</mi><mi>i</mi><mtext>role</mtext></msubsup><mo stretchy="false">}</mo></mrow><mo maxsize="1.200em" minsize="1.200em">)</mo></mrow></mrow></mrow><mo lspace="0em">.</mo></mrow><annotation encoding="application/x-tex">\Phi^{\text{role},(k+1)}\leftarrow\textsc{RoleOpt}\big(\Phi^{\text{role},(k)};\,\Psi^{(k)},\,\{C^{\text{role}}_{i}\}\big).</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(12)</span></span></span></span>
</span>
</span>
</section>
