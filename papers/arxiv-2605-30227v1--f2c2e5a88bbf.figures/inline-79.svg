<span id="S5.SS4.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_middle" style="width:34.16em;">
<span id="S5.SS4.p5.pic1.1.1" class="ltx_p"><span id="S5.SS4.p5.pic1.1.1.1" class="ltx_text ltx_font_bold">RQ2 Answer.</span> The ablations show complementary effects: role-only (structural) updates yield larger gains on role-sensitive datasets such as MedMCQA, while aggregator-only (temporal) updates are more beneficial on consolidation-heavy tasks such as GPQA. Combining both consistently gives the best accuracy across MedMCQA and MMLU, outperforming either component alone.</span>
