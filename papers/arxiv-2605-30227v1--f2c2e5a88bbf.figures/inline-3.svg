<section id="S4.SS3.SSS0.Px4" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph">Phase B: optimize aggregation prompts while fixing roles.</h4>

<span id="S4.SS3.SSS0.Px4.p1" class="ltx_para">
<span id="S4.SS3.SSS0.Px4.p1.1" class="ltx_p">We then keep <math id="S4.SS3.SSS0.Px4.p1.m1" class="ltx_Math" alttext="\Phi^{\text{role},(k+1)}" display="inline" intent=":literal"><semantics><msup><mi mathvariant="normal">Φ</mi><mrow><mtext>role</mtext><mo>,</mo><mrow><mo stretchy="false">(</mo><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy="false">)</mo></mrow></mrow></msup><annotation encoding="application/x-tex">\Phi^{\text{role},(k+1)}</annotation></semantics></math> fixed, roll out trajectories again (or reuse logged trajectories when applicable), compute <math id="S4.SS3.SSS0.Px4.p1.m2" class="ltx_Math" alttext="\{C^{\text{time}}_{t}\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><msubsup><mi>C</mi><mi>t</mi><mtext>time</mtext></msubsup><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{C^{\text{time}}_{t}\}</annotation></semantics></math>, select low-credit rounds, and update only their aggregation prompts:</span>
<span id="S4.E13" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="S4.E13.m1" class="ltx_Math" alttext="\Psi^{(k+1)}\leftarrow\textsc{AggOpt}\big(\Psi^{(k)};\,\Phi^{\text{role},(k+1)},\,\{C^{\text{time}}_{t}\}\big)." display="block" intent=":literal"><semantics><mrow><mrow><msup><mi mathvariant="normal">Ψ</mi><mrow><mo stretchy="false">(</mo><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy="false">)</mo></mrow></msup><mo stretchy="false">←</mo><mrow><mtext class="ltx_font_smallcaps">AggOpt</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo maxsize="1.200em" minsize="1.200em">(</mo><msup><mi mathvariant="normal">Ψ</mi><mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo></mrow></msup><mo>,</mo><msup><mi mathvariant="normal">Φ</mi><mrow><mtext>role</mtext><mo>,</mo><mrow><mo stretchy="false">(</mo><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow><mo stretchy="false">)</mo></mrow></mrow></msup><mo>,</mo><mrow><mo stretchy="false">{</mo><msubsup><mi>C</mi><mi>t</mi><mtext>time</mtext></msubsup><mo stretchy="false">}</mo></mrow><mo maxsize="1.200em" minsize="1.200em">)</mo></mrow></mrow></mrow><mo lspace="0em">.</mo></mrow><annotation encoding="application/x-tex">\Psi^{(k+1)}\leftarrow\textsc{AggOpt}\big(\Psi^{(k)};\,\Phi^{\text{role},(k+1)},\,\{C^{\text{time}}_{t}\}\big).</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(13)</span></span></span></span>
</span>
</span>
</section>
