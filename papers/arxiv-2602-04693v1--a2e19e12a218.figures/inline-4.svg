<span id="A2.SS2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:52.73em;">
<span id="A2.SS2.p4.pic1.2.1" class="ltx_p"><span id="A2.SS2.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">STEP 1: Check Reference.<span id="A2.SS2.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Question: Does the text refer to another person’s statement or behavior? If NO <math id="A2.SS2.p4.pic1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math> go to STEP 4. If YES <math id="A2.SS2.p4.pic1.m2" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math> go to STEP 2.</span></span></span>
<span id="A2.SS2.p4.pic1.2.2" class="ltx_p"><span id="A2.SS2.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">STEP 2: Check Referenced Content.<span id="A2.SS2.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Question: Does the referenced statement or behavior contain explicit or implicit {{CATEGORY}}? If NO <math id="A2.SS2.p4.pic1.m3" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math> go to STEP 4. If YES <math id="A2.SS2.p4.pic1.m4" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math> go to STEP 3.</span></span></span>
<span id="A2.SS2.p4.pic1.2.3" class="ltx_p"><span id="A2.SS2.p4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">STEP 3: Stance Toward Referenced Content.<span id="A2.SS2.p4.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Question: How does the author respond to the referenced {{CATEGORY}}? Report (3): mentions without opinion. Intensify (4): agrees or amplifies. Counter (5): criticizes or disagrees. Escalate (6): responds to {{CATEGORY}} content with {{CATEGORY}}.</span></span></span>
<span id="A2.SS2.p4.pic1.2.4" class="ltx_p"><span id="A2.SS2.p4.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">STEP 4: Check Original Content.<span id="A2.SS2.p4.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> Question: Does the author’s own text contain explicit or implicit {{CATEGORY}}? If NO <math id="A2.SS2.p4.pic1.m5" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math> Label 0. If YES <math id="A2.SS2.p4.pic1.m6" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math> go to STEP 5.</span></span></span>
<span id="A2.SS2.p4.pic1.2.5" class="ltx_p"><span id="A2.SS2.p4.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">STEP 5: Type Classification.<span id="A2.SS2.p4.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> Question: Is the {{CATEGORY}} expressed directly or indirectly? Explicit (1): direct, overt {{CATEGORY}}. Implicit (2): indirect, veiled {{CATEGORY}}.</span></span></span>
