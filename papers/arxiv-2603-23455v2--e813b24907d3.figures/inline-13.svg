<span id="Pt0.A4.p22.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.21em;">
<span id="Pt0.A4.p22.pic1.1.1" class="ltx_p"><span id="Pt0.A4.p22.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Identify and localize all instances of ‘{class_name}’ in the image.
</span></span>
<span id="Pt0.A4.p22.pic1.1.2" class="ltx_p"><span id="Pt0.A4.p22.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Output Requirements:
- Return valid JSON only. Do not include explanations or extra text. 
<br class="ltx_break">- Output a ranked list of detections sorted by confidence (highest first). 
<br class="ltx_break">- Include at most 20 detections. 
<br class="ltx_break">- If no objects are detected, return an empty list [].
</span></span>
<span id="Pt0.A4.p22.pic1.1.3" class="ltx_p"><span id="Pt0.A4.p22.pic1.1.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">For each detection, provide: 
<br class="ltx_break">- &quot;bbox_2d&quot;: [x1, y1, x2, y2] 
<br class="ltx_break"> * Pixel coordinates. 
<br class="ltx_break"> * (x1, y1) = top-left corner. 
<br class="ltx_break"> * (x2, y2) = bottom-right corner. 
<br class="ltx_break">- &quot;label&quot;: &quot;{class_name}&quot; 
<br class="ltx_break">- &quot;score&quot;: float confidence score from 0.0 (lowest) to 1.0 (highest).
</span></span>
<span id="Pt0.A4.p22.pic1.1.4" class="ltx_p"><span id="Pt0.A4.p22.pic1.1.4.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Additional Constraints: 
<br class="ltx_break">- Only include detections that clearly correspond to {class_name}. 
<br class="ltx_break">- Avoid duplicate or highly overlapping boxes for the same object. 
<br class="ltx_break">- Follow these annotator instructions to improve detection accuracy:
</span></span>
<span id="Pt0.A4.p22.pic1.1.5" class="ltx_p"><span id="Pt0.A4.p22.pic1.1.5.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{dataset_instructions}
</span></span>
<span id="Pt0.A4.p22.pic1.1.6" class="ltx_p"><span id="Pt0.A4.p22.pic1.1.6.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Return a JSON list in the following format: 
<br class="ltx_break"></span></span>
<span id="Pt0.A4.p22.pic1.1.7" class="ltx_p"><span id="Pt0.A4.p22.pic1.1.7.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">[ 
<br class="ltx_break">{ 
<br class="ltx_break"> &quot;bbox_2d&quot;: [x1, y1, x2, y2], 
<br class="ltx_break"> &quot;label&quot;: &quot;{class_name}&quot;, 
<br class="ltx_break"> &quot;score&quot;: 0.95 
<br class="ltx_break">} 
<br class="ltx_break">]

</span></span>
</span></span></span></foreignobject></g></g></svg>