<span id="S4.p10.pic1.1.1" class="ltx_p"><span id="S4.p10.pic1.1.1.1" class="ltx_text ltx_underline" style="--ltx-fg-color:#000000;">DetPO Optimized Prompt:</span><span id="S4.p10.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> ‘Soft plastic’: Thin, flexible, and translucent plastic material that appears in crumpled, or folded forms, often as sheets, bags, or loose fragments. Characterized by a smooth, shiny surface that reflects light, with crinkled or wrinkled textures. <span id="S4.p10.pic1.1.1.2.1" class="ltx_text" style="--ltx-fg-color:#6666F2;">It may hold contents but lacks rigid structures, doesn’t maintain fixed shape, and conforms to surfaces.</span></span></span>
