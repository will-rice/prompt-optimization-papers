<span id="A1.SS5.pic4.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS5.pic4.1.1" class="ltx_p"><span id="A1.SS5.pic4.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Curated requirements for <span id="A1.SS5.pic4.1.1.1.1" class="ltx_text ltx_font_typewriter">health-consulting</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 778.89)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:1.19em;--ltx-fo-depth:55.3em;font-size:10pt;" height="781.65" overflow="visible" transform="matrix(1 0 0 -1 0 16.53)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.pic4.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.I6" class="ltx_itemize" style="--ltx-enum-leftmargin:1.5em;">
<span id="A1.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i1.p1" class="ltx_para">
<span id="A1.I6.i1.p1.1" class="ltx_p"><span id="A1.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should provide a concise summary of risk factors associated with health recommendations, if applicable.</span></span>
</span></span>
<span id="A1.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i2.p1" class="ltx_para">
<span id="A1.I6.i2.p1.1" class="ltx_p"><span id="A1.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should offer guidance on maintaining a healthy lifestyle, including diet and exercise recommendations, if applicable.</span></span>
</span></span>
<span id="A1.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i3.p1" class="ltx_para">
<span id="A1.I6.i3.p1.1" class="ltx_p"><span id="A1.I6.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should prioritize listing the most critical conditions to rule out first during diagnosis, if applicable..</span></span>
</span></span>
<span id="A1.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i4.p1" class="ltx_para">
<span id="A1.I6.i4.p1.1" class="ltx_p"><span id="A1.I6.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should provide basic first aid instructions for common injuries and illnesses, if applicable.</span></span>
</span></span>
<span id="A1.I6.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i5.p1" class="ltx_para">
<span id="A1.I6.i5.p1.1" class="ltx_p"><span id="A1.I6.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should encourage users to consult healthcare professionals for accurate medical assessments.</span></span>
</span></span>
<span id="A1.I6.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i6.p1" class="ltx_para">
<span id="A1.I6.i6.p1.1" class="ltx_p"><span id="A1.I6.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should provide action steps when experiencing severe symptoms such as difficulty breathing or swelling, if applicable..</span></span>
</span></span>
<span id="A1.I6.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i7.p1" class="ltx_para">
<span id="A1.I6.i7.p1.1" class="ltx_p"><span id="A1.I6.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should include important safety and handling tips for storing and managing medications, such as tracking usage duration for time-sensitive drugs, if applicable..</span></span>
</span></span>
<span id="A1.I6.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i8.p1" class="ltx_para">
<span id="A1.I6.i8.p1.1" class="ltx_p"><span id="A1.I6.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should recommend specific follow-up actions and time frames for reevaluation, if applicable.</span></span>
</span></span>
<span id="A1.I6.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i9.p1" class="ltx_para">
<span id="A1.I6.i9.p1.1" class="ltx_p"><span id="A1.I6.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should direct users to trusted medical resources and reputable websites.</span></span>
</span></span>
<span id="A1.I6.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i10.p1" class="ltx_para">
<span id="A1.I6.i10.p1.1" class="ltx_p"><span id="A1.I6.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should provide separate advice compartments for interventions feasible at home and those requiring professional medical environments, if applicable..</span></span>
</span></span>
<span id="A1.I6.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i11.p1" class="ltx_para">
<span id="A1.I6.i11.p1.1" class="ltx_p"><span id="A1.I6.i11.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should mention simple lifestyle adjustments or practices that may help alleviate symptoms until professional care is received, if applicable.</span></span>
</span></span>
<span id="A1.I6.i12" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i12.p1" class="ltx_para">
<span id="A1.I6.i12.p1.1" class="ltx_p"><span id="A1.I6.i12.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should respond to user inquiries in clear and informative language.</span></span>
</span></span>
<span id="A1.I6.i13" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i13.p1" class="ltx_para">
<span id="A1.I6.i13.p1.1" class="ltx_p"><span id="A1.I6.i13.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should emphasize that it is not a substitute for professional medical advice, diagnosis, or treatment.</span></span>
</span></span>
<span id="A1.I6.i14" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i14.p1" class="ltx_para">
<span id="A1.I6.i14.p1.1" class="ltx_p"><span id="A1.I6.i14.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should flag symptoms that typically warrant immediate professional medical intervention, if applicable..</span></span>
</span></span>
<span id="A1.I6.i15" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i15.p1" class="ltx_para">
<span id="A1.I6.i15.p1.1" class="ltx_p"><span id="A1.I6.i15.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should provide possible explanations and suggest potential conditions based on described symptoms.</span></span>
</span></span>
<span id="A1.I6.i16" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i16.p1" class="ltx_para">
<span id="A1.I6.i16.p1.1" class="ltx_p"><span id="A1.I6.i16.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should provide specific criteria for when to transition from home care to professional medical evaluation, if applicable.</span></span>
</span></span>
<span id="A1.I6.i17" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i17.p1" class="ltx_para">
<span id="A1.I6.i17.p1.1" class="ltx_p"><span id="A1.I6.i17.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should provide information on over-the-counter and prescription medications, including side effects and dosages, if applicable..</span></span>
</span></span>
<span id="A1.I6.i18" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i18.p1" class="ltx_para">
<span id="A1.I6.i18.p1.1" class="ltx_p"><span id="A1.I6.i18.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should provide step-by-step instructions for emergency response procedures like CPR and choking, if applicable..</span></span>
</span></span>
<span id="A1.I6.i19" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i19.p1" class="ltx_para">
<span id="A1.I6.i19.p1.1" class="ltx_p"><span id="A1.I6.i19.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should include a disclaimer stating it is not a licensed medical practitioner.</span></span>
</span></span>
<span id="A1.I6.i20" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i20.p1" class="ltx_para">
<span id="A1.I6.i20.p1.1" class="ltx_p"><span id="A1.I6.i20.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should offer easy-to-understand explanations of medical terms, procedures, and concepts.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>