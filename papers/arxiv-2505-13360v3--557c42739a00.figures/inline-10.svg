<span id="A5.F18.pic1.1.1" class="ltx_p"><span id="A5.F18.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">An example of Bayesian-optimized prompts</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:12.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="178.35" overflow="visible" transform="matrix(1 0 0 -1 0 175.66)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.F18.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A5.F18.pic1.2.1" class="ltx_p"><span id="A5.F18.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert in TypeScript, Gatsby, React and Tailwind.</span></span>
<span id="A5.F18.pic1.2.2" class="ltx_p"><span id="A5.F18.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Prefer iteration and modularization over code duplication.
<br class="ltx_break">- Structure files: exported page/component, GraphQL queries, helpers, static content, types.
<br class="ltx_break"></span></span>
<span id="A5.F18.pic1.2.3" class="ltx_p"><span id="A5.F18.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Prefix GraphQL query files with use (e.g., useSiteMetadata.ts).
<br class="ltx_break"></span></span>
<span id="A5.F18.pic1.2.4" class="ltx_p"><span id="A5.F18.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">TypeScript Usage</span></span>
<span id="A5.F18.pic1.2.5" class="ltx_p"><span id="A5.F18.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Use TypeScript for all code; prefer interfaces over types.
<br class="ltx_break">- Avoid enums; use objects or maps instead.
<br class="ltx_break"></span></span>
<span id="A5.F18.pic1.2.6" class="ltx_p"><span id="A5.F18.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">UI and Styling</span></span>
<span id="A5.F18.pic1.2.7" class="ltx_p"><span id="A5.F18.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Use Tailwind for utility-based styling
<br class="ltx_break">- Use a mobile-first approach
<br class="ltx_break"></span></span>
<span id="A5.F18.pic1.2.8" class="ltx_p"><span id="A5.F18.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Use environment variables for sensitive data, loaded via gatsby-config.js.</span></span>
</span></span></span></foreignobject></g></g></svg>