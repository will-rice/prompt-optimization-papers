<span id="A1.SS5.pic2.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS5.pic2.1.1" class="ltx_p"><span id="A1.SS5.pic2.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Curated requirements for <span id="A1.SS5.pic2.1.1.1.1" class="ltx_text ltx_font_typewriter">product-gen</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 579.64)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:1.19em;--ltx-fo-depth:40.89em;font-size:10pt;" height="582.39" overflow="visible" transform="matrix(1 0 0 -1 0 16.53)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.pic2.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.I4" class="ltx_itemize" style="--ltx-enum-leftmargin:1.5em;">
<span id="A1.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i1.p1" class="ltx_para">
<span id="A1.I4.i1.p1.1" class="ltx_p"><span id="A1.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must highlight the product’s features.</span></span>
</span></span>
<span id="A1.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i2.p1" class="ltx_para">
<span id="A1.I4.i2.p1.1" class="ltx_p"><span id="A1.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must be written in English.</span></span>
</span></span>
<span id="A1.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i3.p1" class="ltx_para">
<span id="A1.I4.i3.p1.1" class="ltx_p"><span id="A1.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must describe any features listed within the given Context in more detail.</span></span>
</span></span>
<span id="A1.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i4.p1" class="ltx_para">
<span id="A1.I4.i4.p1.1" class="ltx_p"><span id="A1.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must be at least 500 characters long.</span></span>
</span></span>
<span id="A1.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i5.p1" class="ltx_para">
<span id="A1.I4.i5.p1.1" class="ltx_p"><span id="A1.I4.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should preferably be at least 1000 characters long.</span></span>
</span></span>
<span id="A1.I4.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i6.p1" class="ltx_para">
<span id="A1.I4.i6.p1.1" class="ltx_p"><span id="A1.I4.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must not use Markdown syntax.</span></span>
</span></span>
<span id="A1.I4.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i7.p1" class="ltx_para">
<span id="A1.I4.i7.p1.1" class="ltx_p"><span id="A1.I4.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must avoid special characters as much as possible.</span></span>
</span></span>
<span id="A1.I4.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i8.p1" class="ltx_para">
<span id="A1.I4.i8.p1.1" class="ltx_p"><span id="A1.I4.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must avoid excessive use of technical jargon, ensuring that the description is understandable to a general audience.</span></span>
</span></span>
<span id="A1.I4.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i9.p1" class="ltx_para">
<span id="A1.I4.i9.p1.1" class="ltx_p"><span id="A1.I4.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must use engaging and vivid language to capture and retain the reader’s attention.</span></span>
</span></span>
<span id="A1.I4.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i10.p1" class="ltx_para">
<span id="A1.I4.i10.p1.1" class="ltx_p"><span id="A1.I4.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must include at least three benefits that the product provides to the user.</span></span>
</span></span>
<span id="A1.I4.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i11.p1" class="ltx_para">
<span id="A1.I4.i11.p1.1" class="ltx_p"><span id="A1.I4.i11.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must follow a coherent structure, ensuring logical flow from introduction to conclusion.</span></span>
</span></span>
<span id="A1.I4.i12" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i12.p1" class="ltx_para">
<span id="A1.I4.i12.p1.1" class="ltx_p"><span id="A1.I4.i12.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must avoid any explicit comparisons with products from brands unless specified in the context.</span></span>
</span></span>
<span id="A1.I4.i13" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i13.p1" class="ltx_para">
<span id="A1.I4.i13.p1.1" class="ltx_p"><span id="A1.I4.i13.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must ensure that any numerical values or ranges are accurately represented if mentioned at all.</span></span>
</span></span>
<span id="A1.I4.i14" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i14.p1" class="ltx_para">
<span id="A1.I4.i14.p1.1" class="ltx_p"><span id="A1.I4.i14.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must include a mention of the package content.</span></span>
</span></span>
<span id="A1.I4.i15" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i15.p1" class="ltx_para">
<span id="A1.I4.i15.p1.1" class="ltx_p"><span id="A1.I4.i15.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should clearly mention any customer support or warranty information included with the product.</span></span>
</span></span>
<span id="A1.I4.i16" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i16.p1" class="ltx_para">
<span id="A1.I4.i16.p1.1" class="ltx_p"><span id="A1.I4.i16.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The product description should mention any personalization options available, including any important limitations or specifications.</span></span>
</span></span>
<span id="A1.I4.i17" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i17.p1" class="ltx_para">
<span id="A1.I4.i17.p1.1" class="ltx_p"><span id="A1.I4.i17.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must paint a vivid picture of the customer experience with practical use cases.</span></span>
</span></span>
<span id="A1.I4.i18" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i18.p1" class="ltx_para">
<span id="A1.I4.i18.p1.1" class="ltx_p"><span id="A1.I4.i18.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output should break down complex information into clearer, more concise points.</span></span>
</span></span>
<span id="A1.I4.i19" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i19.p1" class="ltx_para">
<span id="A1.I4.i19.p1.1" class="ltx_p"><span id="A1.I4.i19.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must be free from any promotional prompts such as ’click add to cart’.</span></span>
</span></span>
<span id="A1.I4.i20" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i20.p1" class="ltx_para">
<span id="A1.I4.i20.p1.1" class="ltx_p"><span id="A1.I4.i20.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must ensure that key product information is easily skimmable.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>