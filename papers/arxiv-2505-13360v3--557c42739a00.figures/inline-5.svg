<span id="A1.SS5.pic5.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS5.pic5.1.1" class="ltx_p"><span id="A1.SS5.pic5.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Curated requirements for <span id="A1.SS5.pic5.1.1.1.1" class="ltx_text ltx_font_typewriter">lesson-planning</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 579.64)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:1.19em;--ltx-fo-depth:40.89em;font-size:10pt;" height="582.39" overflow="visible" transform="matrix(1 0 0 -1 0 16.53)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.pic5.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.I7" class="ltx_itemize" style="--ltx-enum-leftmargin:1.5em;">
<span id="A1.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i1.p1" class="ltx_para">
<span id="A1.I7.i1.p1.1" class="ltx_p"><span id="A1.I7.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should explicitly mention extension activities for further student engagement or enrichment.</span></span>
</span></span>
<span id="A1.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i2.p1" class="ltx_para">
<span id="A1.I7.i2.p1.1" class="ltx_p"><span id="A1.I7.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should include a detailed outline.</span></span>
</span></span>
<span id="A1.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i3.p1" class="ltx_para">
<span id="A1.I7.i3.p1.1" class="ltx_p"><span id="A1.I7.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should be easy to follow.</span></span>
</span></span>
<span id="A1.I7.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i4.p1" class="ltx_para">
<span id="A1.I7.i4.p1.1" class="ltx_p"><span id="A1.I7.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson objectives should be aligned with relevant educational standards.</span></span>
</span></span>
<span id="A1.I7.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i5.p1" class="ltx_para">
<span id="A1.I7.i5.p1.1" class="ltx_p"><span id="A1.I7.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each section should specify the resources used.</span></span>
</span></span>
<span id="A1.I7.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i6.p1" class="ltx_para">
<span id="A1.I7.i6.p1.1" class="ltx_p"><span id="A1.I7.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should be well-organized.</span></span>
</span></span>
<span id="A1.I7.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i7.p1" class="ltx_para">
<span id="A1.I7.i7.p1.1" class="ltx_p"><span id="A1.I7.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should identify prerequisites or prior knowledge that students need before the lesson begins.</span></span>
</span></span>
<span id="A1.I7.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i8.p1" class="ltx_para">
<span id="A1.I7.i8.p1.1" class="ltx_p"><span id="A1.I7.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should mention strategies for engaging students in a virtual or hybrid learning environment, if applicable.</span></span>
</span></span>
<span id="A1.I7.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i9.p1" class="ltx_para">
<span id="A1.I7.i9.p1.1" class="ltx_p"><span id="A1.I7.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The outline should be broken down into an introduction, main activities, and a conclusion.</span></span>
</span></span>
<span id="A1.I7.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i10.p1" class="ltx_para">
<span id="A1.I7.i10.p1.1" class="ltx_p"><span id="A1.I7.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should promote critical thinking.</span></span>
</span></span>
<span id="A1.I7.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i11.p1" class="ltx_para">
<span id="A1.I7.i11.p1.1" class="ltx_p"><span id="A1.I7.i11.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Differentiation strategies should be included and tailored to address varying student needs and abilities.</span></span>
</span></span>
<span id="A1.I7.i12" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i12.p1" class="ltx_para">
<span id="A1.I7.i12.p1.1" class="ltx_p"><span id="A1.I7.i12.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should include assessment methods to evaluate students’ understanding and mastery of lesson objectives.</span></span>
</span></span>
<span id="A1.I7.i13" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i13.p1" class="ltx_para">
<span id="A1.I7.i13.p1.1" class="ltx_p"><span id="A1.I7.i13.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should cater to a specific grade level or age group.</span></span>
</span></span>
<span id="A1.I7.i14" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i14.p1" class="ltx_para">
<span id="A1.I7.i14.p1.1" class="ltx_p"><span id="A1.I7.i14.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should promote active learning.</span></span>
</span></span>
<span id="A1.I7.i15" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i15.p1" class="ltx_para">
<span id="A1.I7.i15.p1.1" class="ltx_p"><span id="A1.I7.i15.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson objectives should be clearly stated.</span></span>
</span></span>
<span id="A1.I7.i16" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i16.p1" class="ltx_para">
<span id="A1.I7.i16.p1.1" class="ltx_p"><span id="A1.I7.i16.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should specify alternative plans if any technology used in the lesson malfunctions.</span></span>
</span></span>
<span id="A1.I7.i17" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i17.p1" class="ltx_para">
<span id="A1.I7.i17.p1.1" class="ltx_p"><span id="A1.I7.i17.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each section should describe the teaching methods used.</span></span>
</span></span>
<span id="A1.I7.i18" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i18.p1" class="ltx_para">
<span id="A1.I7.i18.p1.1" class="ltx_p"><span id="A1.I7.i18.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each section should describe the learning activities planned.</span></span>
</span></span>
<span id="A1.I7.i19" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i19.p1" class="ltx_para">
<span id="A1.I7.i19.p1.1" class="ltx_p"><span id="A1.I7.i19.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson plan should be designed for a 60-minute class session.</span></span>
</span></span>
<span id="A1.I7.i20" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i20.p1" class="ltx_para">
<span id="A1.I7.i20.p1.1" class="ltx_p"><span id="A1.I7.i20.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The lesson objectives should be measurable.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>