<span class="ltx_eqn_cell ltx_align_center"><math id="A1.Ex6.m1" class="ltx_Math" alttext="\text{Total bags of cans}=3+7" display="block" intent=":literal"><semantics><mrow><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Total bags of cans</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn></mrow></mrow><annotation encoding="application/x-tex">\text{Total bags of cans}=3+7</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A1.SS6.SSS1.p12.pic1.2.5" class="ltx_p"><span id="A1.SS6.SSS1.p12.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now, we perform the addition:
