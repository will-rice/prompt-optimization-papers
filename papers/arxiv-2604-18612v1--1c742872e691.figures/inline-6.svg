<br class="ltx_break" style="--ltx-break-space:2.0pt;">
To solve the problem, we need to focus only on the bags of cans, as the question specifically asks for the total number of bags of cans Tiffany had.
<br class="ltx_break">1. On Monday, Tiffany had 3 bags of cans.
<br class="ltx_break">2. On Tuesday, she found 7 more bags of cans.
<br class="ltx_break">Now, we can add the number of bags of cans she had on Monday to the number she found on Tuesday:
<br class="ltx_break"></span></span></span>
<span id="A1.Ex5" class="ltx_equationgroup ltx_eqn_table">

<span id="A1.Ex5X"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="A1.Ex5X.m2" class="ltx_Math" alttext="\displaystyle\text{Total bags of cans}=\text{Bags on Monday}" display="inline" intent=":literal"><semantics><mrow><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Total bags of cans</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Bags on Monday</mtext></mrow><annotation encoding="application/x-tex">\displaystyle\text{Total bags of cans}=\text{Bags on Monday}</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
<span id="A1.Ex5Xa"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="A1.Ex5Xa.m2" class="ltx_Math" alttext="\displaystyle+\text{Bags found on Tuesday}." display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Bags found on Tuesday</mtext></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\displaystyle+\text{Bags found on Tuesday}.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A1.SS6.SSS1.p12.pic1.2.4" class="ltx_p"><span id="A1.SS6.SSS1.p12.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Substituting the values:
