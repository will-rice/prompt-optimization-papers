<svg id="S3.SS2.SSS1.p2.pic1" class="ltx_picture" height="279.23" overflow="visible" version="1.1" viewbox="0 0 550 279.23" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,279.23) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 273.32 C 0 276.58 2.64 279.23 5.91 279.23 L 544.09 279.23 C 547.36 279.23 550 276.58 550 273.32 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFAF6;" fill="#FFFAF6" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 255.12 L 548.03 255.12 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 263.71)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS2.SSS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="S3.SS2.SSS1.p2.pic1.1.1" class="ltx_p"><span id="S3.SS2.SSS1.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Implementation 2: Parameter Update Function</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:16.34em;--ltx-fo-depth:0.25em;font-size:10pt;" height="229.53" overflow="visible" transform="matrix(1 0 0 -1 0 226.07)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS2.SSS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="S3.SS2.SSS1.p2.pic1.2.1" class="ltx_p"><span id="S3.SS2.SSS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given an optimizable parameter <math id="S3.SS2.SSS1.p2.pic1.m1" class="ltx_Math" alttext="\theta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><annotation encoding="application/x-tex">\theta</annotation></semantics></math> and a set of its semantic gradients <math id="S3.SS2.SSS1.p2.pic1.m2" class="ltx_Math" alttext="G_{\theta}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><annotation encoding="application/x-tex">G_{\theta}</annotation></semantics></math>,</span></span>
<span id="S3.Ex2" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="S3.Ex2.m1" class="ltx_Math" alttext="\phi(\theta,G_{\theta})=\text{PostProc}(\text{LLM}(s))," display="block" intent=":literal"><semantics><mrow><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">PostProc</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">LLM</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\phi(\theta,G_{\theta})=\text{PostProc}(\text{LLM}(s)),</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="S3.SS2.SSS1.p2.pic1.2.2" class="ltx_p"><span id="S3.SS2.SSS1.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">where s is the string</span></span>
<span id="S3.SS2.SSS1.p2.pic1.2.3" class="ltx_tabular ltx_centering ltx_align_middle">
<span class="ltx_tbody">
<span id="S3.SS2.SSS1.p2.pic1.2.3.1" class="ltx_tr">
<span id="S3.SS2.SSS1.p2.pic1.2.3.1.1" class="ltx_td ltx_align_left"><span id="S3.SS2.SSS1.p2.pic1.2.3.1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">I’m trying to write a task-specific question answering assistant.</span></span></span>
<span id="S3.SS2.SSS1.p2.pic1.2.3.2" class="ltx_tr">
<span id="S3.SS2.SSS1.p2.pic1.2.3.2.1" class="ltx_td ltx_align_left"><span id="S3.SS2.SSS1.p2.pic1.2.3.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">My current prompt is:</span></span></span>
<span id="S3.SS2.SSS1.p2.pic1.2.3.3" class="ltx_tr">
<span id="S3.SS2.SSS1.p2.pic1.2.3.3.1" class="ltx_td ltx_align_left"><math id="S3.SS2.SSS1.p2.pic1.m3" class="ltx_Math" alttext="\qquad\theta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><annotation encoding="application/x-tex">\qquad\theta</annotation></semantics></math></span></span>
<span id="S3.SS2.SSS1.p2.pic1.2.3.4" class="ltx_tr">
<span id="S3.SS2.SSS1.p2.pic1.2.3.4.1" class="ltx_td ltx_align_left"><span id="S3.SS2.SSS1.p2.pic1.2.3.4.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Here are some examples that it did not answer well:</span></span></span>
<span id="S3.SS2.SSS1.p2.pic1.2.3.5" class="ltx_tr">
<span id="S3.SS2.SSS1.p2.pic1.2.3.5.1" class="ltx_td ltx_align_left"><math id="S3.SS2.SSS1.p2.pic1.m4" class="ltx_Math" alttext="\qquad l(G_{\theta})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\qquad l(G_{\theta})</annotation></semantics></math></span></span>
<span id="S3.SS2.SSS1.p2.pic1.2.3.6" class="ltx_tr">
<span id="S3.SS2.SSS1.p2.pic1.2.3.6.1" class="ltx_td ltx_align_left"><span id="S3.SS2.SSS1.p2.pic1.2.3.6.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Based on the above examples, write an improved prompt.</span></span></span>
<span id="S3.SS2.SSS1.p2.pic1.2.3.7" class="ltx_tr">
<span id="S3.SS2.SSS1.p2.pic1.2.3.7.1" class="ltx_td ltx_align_left"><span id="S3.SS2.SSS1.p2.pic1.2.3.7.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Do not include the keyword “feedback” or any example-specific content in the prompt.</span></span></span>
<span id="S3.SS2.SSS1.p2.pic1.2.3.8" class="ltx_tr">
<span id="S3.SS2.SSS1.p2.pic1.2.3.8.1" class="ltx_td ltx_align_left"><span id="S3.SS2.SSS1.p2.pic1.2.3.8.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Finish with the improved prompt wrapped by <math id="S3.SS2.SSS1.p2.pic1.m5" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>prompt<math id="S3.SS2.SSS1.p2.pic1.m6" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> and <math id="S3.SS2.SSS1.p2.pic1.m7" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/prompt<math id="S3.SS2.SSS1.p2.pic1.m8" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math></span><span id="S3.SS2.SSS1.p2.pic1.2.3.8.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">,</span></span></span>
</span>
</span>
<span id="S3.SS2.SSS1.p2.pic1.2.4" class="ltx_p"><math id="S3.SS2.SSS1.p2.pic1.m9" class="ltx_Math" alttext="l" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><annotation encoding="application/x-tex">l</annotation></semantics></math><span id="S3.SS2.SSS1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;"> lists the semantic gradients with a prefix “<math id="S3.SS2.SSS1.p2.pic1.m10" class="ltx_Math" alttext="\#\#" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">#</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">#</mi></mrow><annotation encoding="application/x-tex">\#\#</annotation></semantics></math> Example k” attached to the <math id="S3.SS2.SSS1.p2.pic1.m11" class="ltx_Math" alttext="k^{th}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi></mrow></msup><annotation encoding="application/x-tex">k^{th}</annotation></semantics></math> gradient,
and PostProc is a post-processing function that extracts the improved prompt wrapped by <math id="S3.SS2.SSS1.p2.pic1.m12" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>prompt<math id="S3.SS2.SSS1.p2.pic1.m13" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> and <math id="S3.SS2.SSS1.p2.pic1.m14" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/prompt<math id="S3.SS2.SSS1.p2.pic1.m15" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> from the LLM response.</span></span>
</span></span></span></foreignobject></g></g></svg>