<svg id="S3.SS1.p3.pic1" class="ltx_picture" height="242.96" overflow="visible" version="1.1" viewbox="0 0 550 242.96" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,242.96) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 237.05 C 0 240.31 2.64 242.96 5.91 242.96 L 544.09 242.96 C 547.36 242.96 550 240.31 550 237.05 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F6FF;" fill="#F9F6FF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 218.85 L 548.03 218.85 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 227.44)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="S3.SS1.p3.pic1.1.1" class="ltx_p"><span id="S3.SS1.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Implementation 1: Feedback on Optimizable Parameters</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:13.77em;--ltx-fo-depth:0.19em;font-size:10pt;" height="193.26" overflow="visible" transform="matrix(1 0 0 -1 0 190.57)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="S3.SS1.p3.pic1.2.1" class="ltx_p"><span id="S3.SS1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For an <span id="S3.SS1.p3.pic1.2.1.1.1" class="ltx_text ltx_font_bold">optimizable parameter</span> <math id="S3.SS1.p3.pic1.m1" class="ltx_Math" alttext="\theta\in\Theta" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Θ</mi></mrow><annotation encoding="application/x-tex">\theta\in\Theta</annotation></semantics></math>, <math id="S3.SS1.p3.pic1.m2" class="ltx_Math" alttext="\nabla_{\theta}^{w}l_{Q}=\hat{h}_{w}^{\theta}(\Predecessors(w),w,\nabla_{w}l_{Q}" display="inline" intent=":literal"><semantics><mrow><mrow><msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∇</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi></msubsup><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msubsup><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msubsup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Predecessors</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">∇</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi></msub><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi></msub></mrow></mrow><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000">CLOSE</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\nabla_{\theta}^{w}l_{Q}=\hat{h}_{w}^{\theta}(\Predecessors(w),w,\nabla_{w}l_{Q}</annotation></semantics></math>), the direction of change of <math id="S3.SS1.p3.pic1.m3" class="ltx_Math" alttext="\theta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><annotation encoding="application/x-tex">\theta</annotation></semantics></math> that would move <math id="S3.SS1.p3.pic1.m4" class="ltx_Math" alttext="w" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><annotation encoding="application/x-tex">w</annotation></semantics></math> towards to the direction <math id="S3.SS1.p3.pic1.m5" class="ltx_Math" alttext="\nabla_{w}l_{Q}" display="inline" intent=":literal"><semantics><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∇</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi></msub><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi></msub></mrow><annotation encoding="application/x-tex">\nabla_{w}l_{Q}</annotation></semantics></math> for <math id="S3.SS1.p3.pic1.m6" class="ltx_Math" alttext="w\in\Successors(\theta)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Successors</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">w\in\Successors(\theta)</annotation></semantics></math> is set to be the string:</span></span>
<span id="S3.SS1.p3.pic1.2.2" class="ltx_tabular ltx_centering ltx_align_middle">
<span class="ltx_tbody">
<span id="S3.SS1.p3.pic1.2.2.1" class="ltx_tr">
<span id="S3.SS1.p3.pic1.2.2.1.1" class="ltx_td ltx_align_left"><span id="S3.SS1.p3.pic1.2.2.1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Input:</span></span></span>
<span id="S3.SS1.p3.pic1.2.2.2" class="ltx_tr">
<span id="S3.SS1.p3.pic1.2.2.2.1" class="ltx_td ltx_align_left"><math id="S3.SS1.p3.pic1.m7" class="ltx_Math" alttext="\qquad\Predecessors(w)\setminus\theta" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Predecessors</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∖</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></mrow><annotation encoding="application/x-tex">\qquad\Predecessors(w)\setminus\theta</annotation></semantics></math></span></span>
<span id="S3.SS1.p3.pic1.2.2.3" class="ltx_tr">
<span id="S3.SS1.p3.pic1.2.2.3.1" class="ltx_td ltx_align_left"><span id="S3.SS1.p3.pic1.2.2.3.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">My output:</span></span></span>
<span id="S3.SS1.p3.pic1.2.2.4" class="ltx_tr">
<span id="S3.SS1.p3.pic1.2.2.4.1" class="ltx_td ltx_align_left"><math id="S3.SS1.p3.pic1.m8" class="ltx_Math" alttext="\qquad w" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><annotation encoding="application/x-tex">\qquad w</annotation></semantics></math></span></span>
<span id="S3.SS1.p3.pic1.2.2.5" class="ltx_tr">
<span id="S3.SS1.p3.pic1.2.2.5.1" class="ltx_td ltx_align_left"><span id="S3.SS1.p3.pic1.2.2.5.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Feedback received on my output:</span></span></span>
<span id="S3.SS1.p3.pic1.2.2.6" class="ltx_tr">
<span id="S3.SS1.p3.pic1.2.2.6.1" class="ltx_td ltx_align_left"><math id="S3.SS1.p3.pic1.m9" class="ltx_Math" alttext="\qquad\nabla_{w}l_{Q}" display="inline" intent=":literal"><semantics><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∇</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi></msub><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi></msub></mrow><annotation encoding="application/x-tex">\qquad\nabla_{w}l_{Q}</annotation></semantics></math><span id="S3.SS1.p3.pic1.2.2.6.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span></span>
</span>
</span>
<span id="S3.SS1.p3.pic1.2.3" class="ltx_p"><span id="S3.SS1.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here, the aggregator <math id="S3.SS1.p3.pic1.m10" class="ltx_Math" alttext="\mathcal{A_{\theta}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒜</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><annotation encoding="application/x-tex">\mathcal{A_{\theta}}</annotation></semantics></math> is string concatenation.</span></span>
</span></span></span></foreignobject></g></g></svg>