<svg id="S1.p7.pic1" class="ltx_picture" height="329.97" overflow="visible" version="1.1" viewbox="0 0 477.38 329.97" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,329.97) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4594C1;" fill="#4594C1" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 329.97 L 477.38 329.97 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F0F6FA;" fill="#F0F6FA" fill-opacity="1.0"><path style="stroke:none" d="M 7.87 0 L 7.87 329.97 L 477.38 329.97 L 477.38 0 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 19.68 281.98)"><foreignobject style="--ltx-fo-width:32.29em;--ltx-fo-height:2.68em;--ltx-fo-depth:19.59em;font-size:10pt;" height="308.26" overflow="visible" transform="matrix(1 0 0 -1 0 37.13)" width="446.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.29em;">
<span id="S1.p7.pic1.1.1" class="ltx_p"><span id="S1.p7.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In sum, we make the following key contributions:</span></span>
<span id="S1.I1" class="ltx_enumerate ltx_leftmargin_flush">
<span id="S1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">①</span> 
<span id="S1.I1.i1.p1" class="ltx_para">
<span id="S1.I1.i1.p1.1" class="ltx_p"><span id="S1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We identify that existing training-free OVSS solutions grounded in CLIP suffer from intractable spatial bias.
In light of this, we shift our focus toward the spatially-aware dino.txt paradigm to circumvent the performance bottleneck in prior works.</span></span>
</span></span>
<span id="S1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">②</span> 
<span id="S1.I1.i2.p1" class="ltx_para">
<span id="S1.I1.i2.p1.1" class="ltx_p"><span id="S1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To alleviate the dense cross-modal mismatch in dino.txt, we propose </span><span id="S1.I1.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">VI</span><span id="S1.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">sual-guided </span><span id="S1.I1.i2.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">P</span><span id="S1.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">rompt evolution (</span><span id="S1.I1.i2.p1.1.6" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#4682B4;">VIP</span><span id="S1.I1.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">), which rectifies the semantic expressiveness of text queries and effectively unlocks model’s fine-grained object perception capability.</span></span>
</span></span>
<span id="S1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">③</span> 
<span id="S1.I1.i3.p1" class="ltx_para">
<span id="S1.I1.i3.p1.1" class="ltx_p"><span id="S1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Extensive evaluations demonstrate that our </span><span id="S1.I1.i3.p1.1.2" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#4682B4;">VIP</span><span id="S1.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> achieves SOTA performance in diverse domains with excellent computational efficiency.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>