</span>
                        
<span id="A11.SS4.SSS0.Px1.p3.pic1.p9" class="ltx_para ltx_noindent">
<span id="A11.SS4.SSS0.Px1.p3.pic1.p9.1" class="ltx_p"><math id="A11.SS4.SSS0.Px1.p3.pic1.p9.m1" class="ltx_Math" alttext="+6" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">+</mo><mn style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">6</mn></mrow><annotation encoding="application/x-tex">+6</annotation></semantics></math> Reports that roughly 30% of posterior sternoclavicular dislocations cause injury or compression of mediastinal or great-vessel structures.</span>
</span>
                        
