</span>
                        
<span id="A11.SS4.SSS0.Px1.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="A11.SS4.SSS0.Px1.p3.pic1.p5.1" class="ltx_p"><math id="A11.SS4.SSS0.Px1.p3.pic1.p5.m1" class="ltx_Math" alttext="\bm{\times}" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#A4522D;" class="ltx_mathvariant_bold" mathcolor="#A4522D" mathvariant="bold">×</mo><annotation encoding="application/x-tex">\bm{\times}</annotation></semantics></math> Names injury patterns and ossification ages but only restates that missed posterior displacement is significant.</span>
</span>
                        
<span id="A11.SS4.SSS0.Px1.p3.pic1.p7" class="ltx_para">
<span id="A11.SS4.SSS0.Px1.p3.pic1.p7.1" class="ltx_p"><span id="A11.SS4.SSS0.Px1.p3.pic1.p7.1.1" class="ltx_text ltx_font_bold">Original rubric scores</span></span>
