<span id="A11.SS4.SSS0.Px1.p3.pic1.p7.3" class="ltx_p">Better answer 0.47</span>
<span id="A11.SS4.SSS0.Px1.p3.pic1.p7.4" class="ltx_p">The better answer describes mediastinal consequences and their frequency.</span>
</span>
                      
