<span id="A11.SS2.SSS0.Px1.p3.pic1.p13" class="ltx_para">
<span id="A11.SS2.SSS0.Px1.p3.pic1.p13.1" class="ltx_p"><span id="A11.SS2.SSS0.Px1.p3.pic1.p13.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#2E7160;">Selected added criteria</span></span>
</span>
                        
<span id="A11.SS2.SSS0.Px1.p3.pic1.p9" class="ltx_para ltx_noindent">
<span id="A11.SS2.SSS0.Px1.p3.pic1.p9.1" class="ltx_p"><math id="A11.SS2.SSS0.Px1.p3.pic1.p9.m1" class="ltx_Math" alttext="-8" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#A4522D;" mathcolor="#A4522D">−</mo><mn style="--ltx-fg-color:#A4522D;" mathcolor="#A4522D">8</mn></mrow><annotation encoding="application/x-tex">-8</annotation></semantics></math> Presents severe renal impairment or dialysis as a lecanemab restriction.</span>
</span>
                        
<span id="A11.SS2.SSS0.Px1.p3.pic1.p10" class="ltx_para ltx_noindent">
<span id="A11.SS2.SSS0.Px1.p3.pic1.p10.1" class="ltx_p"><math id="A11.SS2.SSS0.Px1.p3.pic1.p10.m1" class="ltx_Math" alttext="+8" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">+</mo><mn style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">8</mn></mrow><annotation encoding="application/x-tex">+8</annotation></semantics></math> States an absolute CDR-SB effect of approximately 0.45 points at 18 months.</span>
</span>
                        
<span id="A11.SS2.SSS0.Px1.p3.pic1.p11" class="ltx_para ltx_noindent">
<span id="A11.SS2.SSS0.Px1.p3.pic1.p11.1" class="ltx_p"><math id="A11.SS2.SSS0.Px1.p3.pic1.p11.m1" class="ltx_Math" alttext="+8" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">+</mo><mn style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">8</mn></mrow><annotation encoding="application/x-tex">+8</annotation></semantics></math> Explains that subgroup interpretation should rely on treatment-by-APOE interaction testing rather than comparing point estimates.</span>
</span>
                        
<span id="A11.SS2.SSS0.Px1.p3.pic1.p12" class="ltx_para ltx_noindent">
<span id="A11.SS2.SSS0.Px1.p3.pic1.p12.1" class="ltx_p"><math id="A11.SS2.SSS0.Px1.p3.pic1.p12.m1" class="ltx_Math" alttext="+6" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">+</mo><mn style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">6</mn></mrow><annotation encoding="application/x-tex">+6</annotation></semantics></math> Distinguishes slowing of worsening from improvement in cognition.</span>
</span>
                      
