</span>
                        
<span id="A11.SS2.SSS0.Px1.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A11.SS2.SSS0.Px1.p3.pic1.p1.1" class="ltx_p"><math id="A11.SS2.SSS0.Px1.p3.pic1.p1.m1" class="ltx_Math" alttext="+9" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">+</mo><mn style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">9</mn></mrow><annotation encoding="application/x-tex">+9</annotation></semantics></math> Mentions a modest slowing of decline, approximately a 27% reduction on CDR-SB over 18 months in CLARITY-AD.</span>
</span>
                      
</span></span></span></span></foreignobject></g><g style="--ltx-stroke-color:#A4522D;--ltx-fill-color:#FAF5F2;" fill="#FAF5F2" stroke="#A4522D" stroke-width="0.6pt"><path d="M 62.09 0 L 51.02 0 C 48.73 0 46.87 -1.86 46.87 -4.15 L 46.87 -351.31 C 46.87 -353.6 48.73 -355.46 51.02 -355.46 L 62.09 -355.46 C 64.39 -355.46 66.24 -353.6 66.24 -351.31 L 66.24 -4.15 C 66.24 -1.86 64.39 0 62.09 0 Z M 46.87 -355.46" /></g><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.6pt" transform="matrix(1.0 0.0 0.0 1.0 56.56 -19.29)"><foreignobject style="--ltx-fo-width:0em;--ltx-fo-height:0.69em;--ltx-fo-depth:23.59em;font-size:10pt;" height="336.09" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="0"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A11.SS2.SSS0.Px1.p3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_top" style="width:0em;">
