</span>
                        
<span id="A11.SS2.SSS0.Px1.p3.pic1.p4" class="ltx_para ltx_noindent">
<span id="A11.SS2.SSS0.Px1.p3.pic1.p4.1" class="ltx_p"><math id="A11.SS2.SSS0.Px1.p3.pic1.p4.m1" class="ltx_Math" alttext="\bm{\times}" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#A4522D;" class="ltx_mathvariant_bold" mathcolor="#A4522D" mathvariant="bold">×</mo><annotation encoding="application/x-tex">\bm{\times}</annotation></semantics></math> Repeats the relative effect while inventing a restriction for severe renal impairment or dialysis.</span>
</span>
                        
<span id="A11.SS2.SSS0.Px1.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="A11.SS2.SSS0.Px1.p3.pic1.p5.1" class="ltx_p"><math id="A11.SS2.SSS0.Px1.p3.pic1.p5.m1" class="ltx_Math" alttext="\bm{\times}" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#A4522D;" class="ltx_mathvariant_bold" mathcolor="#A4522D" mathvariant="bold">×</mo><annotation encoding="application/x-tex">\bm{\times}</annotation></semantics></math> The original rubric does not assess the subgroup question.</span>
</span>
                        
<span id="A11.SS2.SSS0.Px1.p3.pic1.p7" class="ltx_para">
<span id="A11.SS2.SSS0.Px1.p3.pic1.p7.1" class="ltx_p"><span id="A11.SS2.SSS0.Px1.p3.pic1.p7.1.1" class="ltx_text ltx_font_bold">Original rubric scores</span></span>
<span id="A11.SS2.SSS0.Px1.p3.pic1.p7.2" class="ltx_p">Exploit 1.00</span>
<span id="A11.SS2.SSS0.Px1.p3.pic1.p7.3" class="ltx_p">Honest answer 0.00</span>
<span id="A11.SS2.SSS0.Px1.p3.pic1.p7.4" class="ltx_p">The honest answer describes the absolute CDR-SB effect and a result on ADCOMS.</span>
</span>
                      
</span></span></span></span></foreignobject></g><g style="--ltx-stroke-color:#2E7160;--ltx-fill-color:#F2F6F5;" fill="#F2F6F5" stroke="#2E7160" stroke-width="0.6pt"><path d="M 108.96 0 L 97.89 0 C 95.6 0 93.74 -1.86 93.74 -4.15 L 93.74 -444.63 C 93.74 -446.92 95.6 -448.78 97.89 -448.78 L 108.96 -448.78 C 111.26 -448.78 113.12 -446.92 113.12 -444.63 L 113.12 -4.15 C 113.12 -1.86 111.26 0 108.96 0 Z M 93.74 -448.78" /></g><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.6pt" transform="matrix(1.0 0.0 0.0 1.0 103.43 -19.29)"><foreignobject style="--ltx-fo-width:0em;--ltx-fo-height:0.69em;--ltx-fo-depth:30.34em;font-size:10pt;" height="429.41" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="0"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A11.SS2.SSS0.Px1.p3.pic1.3" class="ltx_inline-logical-block ltx_minipage ltx_align_top" style="width:0em;">
