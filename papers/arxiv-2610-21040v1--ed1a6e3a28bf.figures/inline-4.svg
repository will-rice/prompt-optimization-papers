<span id="A11.SS3.SSS0.Px1.p3.pic1.p10.1" class="ltx_p"><math id="A11.SS3.SSS0.Px1.p3.pic1.p10.m1" class="ltx_Math" alttext="+8" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">+</mo><mn style="--ltx-fg-color:#2E7160;" mathcolor="#2E7160">8</mn></mrow><annotation encoding="application/x-tex">+8</annotation></semantics></math> Explains that the symptoms have no established etiology and are not diagnostic of conjunctivitis.</span>
