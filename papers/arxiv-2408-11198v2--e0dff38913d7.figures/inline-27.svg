<span id="S5.SS2.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S5.SS2.p6.pic1.1.1" class="ltx_p"><span id="S5.SS2.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ2:<span id="S5.SS2.p6.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> <span id="S5.SS2.p6.pic1.1.1.1.1.1" class="ltx_text ltx_font_typewriter">EPiC</span> outperforms Reflexion, LATS, and LDB in terms of functional correctness (pass@1) across all benchmark datasets. It achieves higher accuracy while maintaining lower token usage compared to LATS and LDB, and comparable effectiveness to Reflexion. In terms of cost-effectiveness, measured by Incremental Token Usage per Solved Problem (ATSP), <span id="S5.SS2.p6.pic1.1.1.1.1.2" class="ltx_text ltx_font_typewriter">EPiC</span> is the most cost-effective across all datasets, requiring significantly fewer tokens to generate additional correct solutions. Reflexion ranks second, followed by LDB, with LATS being the least cost-effective.</span></span></span>
</span></span></span></foreignobject></g></g></svg>