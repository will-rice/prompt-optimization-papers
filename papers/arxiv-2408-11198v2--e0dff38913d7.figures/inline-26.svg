<span id="S5.SS1.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S5.SS1.p5.pic1.1.1" class="ltx_p"><span id="S5.SS1.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ1:<span id="S5.SS1.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> <span id="S5.SS1.p5.pic1.1.1.1.1.1" class="ltx_text ltx_font_typewriter">EPiC</span> improves pass@1 across all LLMs and datasets while increasing token usage. Gains range from 2% to 10%, with token usage rising 2.2<math id="S5.SS1.p5.pic1.m1" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math> to 8<math id="S5.SS1.p5.pic1.m2" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math>. o3-mini outperforms deepseek v3 but at higher costs, while Claude 3.7 is the least cost-effective. Despite increased token consumption, the accuracy gains justify the cost.</span></span></span>
</span></span></span></foreignobject></g></g></svg>