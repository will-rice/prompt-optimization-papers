<span id="S3.SS1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.06em;">
<span id="S3.SS1.p4.pic1.1.1" class="ltx_p"><span id="S3.SS1.p4.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Test Case Generation Prompt
<br class="ltx_break"><span id="S3.SS1.p4.pic1.1.1.1.1" class="ltx_text" style="font-size:80%;">You are an AI coding assistant who can write unique, diverse, and intuitive unit tests for functions, given the signature and docstring. Use step-by-step reasoning to validate each test case separately to ensure that all of them have the correct expected output. Write the final validated tests inside $$$$ tags.</span></span></span>
<span id="S3.SS1.p4.pic1.1.2" class="ltx_p"><span id="S3.SS1.p4.pic1.1.2.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Examples:
<br class="ltx_break">def add3Numbers(x, y, z):
<br class="ltx_break">&quot;&quot;&quot; Add three numbers together. This function takes three numbers as input and returns the sum of the three numbers.&quot;&quot;&quot;
<br class="ltx_break">$$$$
<br class="ltx_break">assert add3Numbers(1, 2, 3) == 6
<br class="ltx_break">assert add3Numbers(-1, 2, 3) == 4
<br class="ltx_break">assert add3Numbers(1, -2, 3) == 2
<br class="ltx_break">assert add3Numbers(1, 2, -3) == 0
<br class="ltx_break">assert add3Numbers(-3, -2, -1) == -6
<br class="ltx_break">assert add3Numbers(0, 0, 0) == 0
<br class="ltx_break">$$$$</span></span>
</span></span></span></foreignobject></g></g></svg>