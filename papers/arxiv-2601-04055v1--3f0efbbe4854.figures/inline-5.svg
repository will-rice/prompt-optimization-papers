<svg id="A1.p11.pic1" class="ltx_picture" height="346.3" overflow="visible" version="1.1" viewbox="0 0 676.77 346.3" width="676.77"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,346.3) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.32 L 0 342.98 C 0 344.81 1.49 346.3 3.32 346.3 L 673.45 346.3 C 675.28 346.3 676.77 344.81 676.77 342.98 L 676.77 3.32 C 676.77 1.49 675.28 0 673.45 0 L 3.32 0 C 1.49 0 0 1.49 0 3.32 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 3.32 L 0.55 342.98 C 0.55 344.5 1.79 345.74 3.32 345.74 L 673.45 345.74 C 674.98 345.74 676.22 344.5 676.22 342.98 L 676.22 3.32 C 676.22 1.79 674.98 0.55 673.45 0.55 L 3.32 0.55 C 1.79 0.55 0.55 1.79 0.55 3.32 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.03 12.49)"><foreignobject style="--ltx-fo-width:55.84em;--ltx-fo-height:23.4em;--ltx-fo-depth:0.18em;font-size:10pt;" height="326.25" overflow="visible" transform="matrix(1 0 0 -1 0 323.79)" width="772.67"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p11.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:55.84em;">
<span id="A1.p11.pic1.1.1" class="ltx_p"><span id="A1.p11.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">The general Taylor expansion of a function <math id="A1.p11.pic1.m1" class="ltx_Math" alttext="f(x)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">f(x)</annotation></semantics></math> about a point a is:
</span></span>
<span id="A1.Ex8" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A1.Ex8.m1" class="ltx_Math" alttext="f(x)=f(a)+f^{\prime}(a)(x-a)+(1/2)f^{\prime\prime}(a)(x-a)^{2}+..." display="block" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">=</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">+</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">f</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">′</mo></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">a</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">+</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em" stretchy="true" symmetric="true">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">2</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">f</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">′′</mo></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">a</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.800em" minsize="0.800em">)</mo></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">2</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em" mathvariant="normal">…</mi></mrow></mrow><annotation encoding="application/x-tex">f(x)=f(a)+f^{\prime}(a)(x-a)+(1/2)f^{\prime\prime}(a)(x-a)^{2}+...</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A1.p11.pic1.1.2" class="ltx_p"><span id="A1.p11.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">The cosmological constant is a term in the equation of state of the universe that represents the energy density of the vacuum. It is often denoted by the Greek letter lambda (<math id="A1.p11.pic1.m2" class="ltx_Math" alttext="\lambda" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">λ</mi><annotation encoding="application/x-tex">\lambda</annotation></semantics></math>) and is a measure of the resistance to the expansion of the universe.
</span></span>
<span id="A1.Ex9" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A1.Ex9.m1" class="ltx_Math" alttext="100!=100\texttimes 99\texttimes 98\texttimes...\texttimes 3\texttimes 2\texttimes 1=9.33262154\times 10^{157}" display="block" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">100</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">!</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">100</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">×</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">99</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">×</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">98</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">×</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em" mathvariant="normal">…</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">×</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">3</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">×</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">×</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">9.33262154</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" mathsize="0.800em" rspace="0.222em">×</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">157</mn></msup></mrow></mrow><annotation encoding="application/x-tex">100!=100\texttimes 99\texttimes 98\texttimes...\texttimes 3\texttimes 2\texttimes 1=9.33262154\times 10^{157}</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
