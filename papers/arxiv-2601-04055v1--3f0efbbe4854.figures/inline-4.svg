<span id="A1.p9.pic1.1.10" class="ltx_p"><span id="A1.p9.pic1.1.10.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">The table of 10 is a multiplication table that shows the product of 10 multiplied by each integer from 1 to 10:
</span></span>
<span id="A1.p9.pic1.1.11" class="ltx_p"><span id="A1.p9.pic1.1.11.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">10 × 1 = 10
10 × 2 = 20
