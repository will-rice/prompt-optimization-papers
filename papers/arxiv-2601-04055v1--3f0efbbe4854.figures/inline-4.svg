-a)^{2}+(1/6)f^{\prime\prime\prime}(a)(x-a)^{3}+...</annotation></semantics></math><span id="A1.p9.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">
