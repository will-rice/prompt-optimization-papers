<span id="A1.p9.pic1.1.3" class="ltx_p"><span id="A1.p9.pic1.1.3.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">The cosmological constant is a fundamental constant of the universe that represents the energy density of the vacuum. It is denoted by the Greek letter lambda (<math id="A1.p9.pic1.m2" class="ltx_Math" alttext="\lambda" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">λ</mi><annotation encoding="application/x-tex">\lambda</annotation></semantics></math>) and is a measure of the energy density of the vacuum. The cosmological constant is a key component of the Friedmann equations, which describe the evolution of the universe.
</span></span>
<span id="A1.p9.pic1.1.4" class="ltx_p"><span id="A1.p9.pic1.1.4.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">100! is equal to 100 factorial, which is the product of all positive integers from 1 to 100. This is a very large number, and its exact value is:
</span></span>
<span id="A1.Ex7" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A1.Ex7.m1" class="ltx_Math" alttext="100!=9.33262154\times 10^{157}" display="block" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">100</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">!</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">9.33262154</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" mathsize="0.800em" rspace="0.222em">×</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">157</mn></msup></mrow></mrow><annotation encoding="application/x-tex">100!=9.33262154\times 10^{157}</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A1.p9.pic1.1.5" class="ltx_p"><span id="A1.p9.pic1.1.5.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">2 + 2 is equal to 4.
</span></span>
<span id="A1.p9.pic1.1.6" class="ltx_p"><span id="A1.p9.pic1.1.6.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">The table of 2 is a multiplication table that shows the product of 2 multiplied by each integer from 1 to 10:
</span></span>
<span id="A1.p9.pic1.1.7" class="ltx_p"><span id="A1.p9.pic1.1.7.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">2 × 1 = 2
2 × 2 = 4
2 × 3 = 6
2 × 4 = 8
2 × 5 = 10
2 × 6 = 12
2 × 7 = 14
2 × 8 = 16
2 × 9 = 18
2 × 10 = 20
</span></span>
<span id="A1.p9.pic1.1.8" class="ltx_p"><span id="A1.p9.pic1.1.8.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">The table of 5 is a multiplication table that shows the product of 5 multiplied by each integer from 1 to 10:
</span></span>
