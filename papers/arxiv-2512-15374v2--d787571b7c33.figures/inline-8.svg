<svg id="A6.SS3.p2.pic1" class="ltx_picture" height="456.59" overflow="visible" version="1.1" viewbox="0 0 550 456.59" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,456.59) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 450.68 C 0 453.94 2.64 456.59 5.91 456.59 L 544.09 456.59 C 547.36 456.59 550 453.94 550 450.68 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 432.48 L 548.03 432.48 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 441.07)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A6.SS3.p2.pic1.1.1" class="ltx_p"><span id="A6.SS3.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Guideline Analyzer Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:29.16em;--ltx-fo-depth:0.25em;font-size:10pt;" height="406.89" overflow="visible" transform="matrix(1 0 0 -1 0 403.43)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A6.SS3.p2.pic1.2.1" class="ltx_p"><span id="A6.SS3.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a rule optimization analyzer. Analyze these {count} rules and identify optimization opportunities.<span id="A6.SS3.p2.pic1.2.1.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>{rules_text}<span id="A6.SS3.p2.pic1.2.1.1.2" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Your task is to identify three types of optimization opportunities:<span id="A6.SS3.p2.pic1.2.1.1.3" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>1. **CONFLICTS**: Pairs of rules that give contradictory guidance.<span id="A6.SS3.p2.pic1.2.1.1.4" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> - PRIORITY: Highest - conflicts must be resolved first<span id="A6.SS3.p2.pic1.2.1.1.5" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>2. **SUBSUMPTION**: Pairs where a specific rule is entirely covered by a more general rule.<span id="A6.SS3.p2.pic1.2.1.1.6" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> - Format: [general_rule_index, specific_rule_index]<span id="A6.SS3.p2.pic1.2.1.1.7" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> - PRIORITY: High - clear redundancy should be removed<span id="A6.SS3.p2.pic1.2.1.1.8" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>3. **CONSOLIDATION**: Groups of rules that express similar concepts and can be merged into a single, more comprehensive rule.<span id="A6.SS3.p2.pic1.2.1.1.9" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> - PRIORITY: Medium - merge rules that address the same concern from different angles<span id="A6.SS3.p2.pic1.2.1.1.10" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>IMPORTANT PRIORITY RULES:<span id="A6.SS3.p2.pic1.2.1.1.11" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>1. If two rules CONFLICT, do NOT also mark them for consolidation or subsumption<span id="A6.SS3.p2.pic1.2.1.1.12" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>2. If one rule SUBSUMES another, do NOT also mark them for consolidation<span id="A6.SS3.p2.pic1.2.1.1.13" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>3. A rule pair should appear in AT MOST ONE category<span id="A6.SS3.p2.pic1.2.1.1.14" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>You MUST respond with ONLY valid JSON in this exact format:<span id="A6.SS3.p2.pic1.2.1.1.15" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{{<span id="A6.SS3.p2.pic1.2.1.1.16" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;consolidation&quot;: [[idx1, idx2], [idx3, idx4]],<span id="A6.SS3.p2.pic1.2.1.1.17" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;subsumption&quot;: [[general_idx, specific_idx]],<span id="A6.SS3.p2.pic1.2.1.1.18" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;conflicts&quot;: [[idx1, idx2]]<span id="A6.SS3.p2.pic1.2.1.1.19" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>}}<span id="A6.SS3.p2.pic1.2.1.1.20" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>