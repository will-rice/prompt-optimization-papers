<span id="A6.SS1.p8.pic1.1.1" class="ltx_p"><span id="A6.SS1.p8.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Selector Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:35.48em;--ltx-fo-depth:0.25em;font-size:10pt;" height="494.37" overflow="visible" transform="matrix(1 0 0 -1 0 490.91)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A6.SS1.p8.pic1.2.1" class="ltx_p"><span id="A6.SS1.p8.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a prompt engineering expert evaluating multiple candidate prompt updates.<span id="A6.SS1.p8.pic1.2.1.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Your task: Select the BEST candidate update from the options below.<span id="A6.SS1.p8.pic1.2.1.1.2" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Context:<span id="A6.SS1.p8.pic1.2.1.1.3" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Agent Name: {agent_name}<span id="A6.SS1.p8.pic1.2.1.1.4" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Agent Role: {agent_role}<span id="A6.SS1.p8.pic1.2.1.1.5" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Task: {task}<span id="A6.SS1.p8.pic1.2.1.1.6" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Issue Type: {issue_type}<span id="A6.SS1.p8.pic1.2.1.1.7" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Issue Details:<span id="A6.SS1.p8.pic1.2.1.1.8" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{issue_details}<span id="A6.SS1.p8.pic1.2.1.1.9" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Current system prompt (for reference):<span id="A6.SS1.p8.pic1.2.1.1.10" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{current_system_prompt}<span id="A6.SS1.p8.pic1.2.1.1.11" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Candidate Updates:<span id="A6.SS1.p8.pic1.2.1.1.12" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{candidates}<span id="A6.SS1.p8.pic1.2.1.1.13" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Evaluation Criteria (in priority order):<span id="A6.SS1.p8.pic1.2.1.1.14" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>1. **Specificity &amp; Relevance**: Most directly addresses the actual issue/error<span id="A6.SS1.p8.pic1.2.1.1.15" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>2. **Actionability**: Clear, implementable instructions that the agent can follow<span id="A6.SS1.p8.pic1.2.1.1.16" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>3. **Generalizability**: Useful beyond just this instance, but not too vague<span id="A6.SS1.p8.pic1.2.1.1.17" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>4. **Brevity**: Concise and clear without unnecessary words<span id="A6.SS1.p8.pic1.2.1.1.18" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>5. **Non-duplication**: Doesn’t repeat what’s already in the system prompt<span id="A6.SS1.p8.pic1.2.1.1.19" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Select the candidate that best balances these criteria for the current situation.<span id="A6.SS1.p8.pic1.2.1.1.20" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Output ONLY valid JSON with this exact format:<span id="A6.SS1.p8.pic1.2.1.1.21" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{{<span id="A6.SS1.p8.pic1.2.1.1.22" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;selected_index&quot;: 0,<span id="A6.SS1.p8.pic1.2.1.1.23" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;rationale&quot;: &quot;Brief 1-2 sentence explanation of why this candidate is best&quot;<span id="A6.SS1.p8.pic1.2.1.1.24" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>}}<span id="A6.SS1.p8.pic1.2.1.1.25" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>