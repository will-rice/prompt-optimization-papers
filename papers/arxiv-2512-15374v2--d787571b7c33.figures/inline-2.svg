<span id="A4.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I6.i1.1" class="ltx_text ltx_font_bold">R1</span>:</span> 
<span id="A4.I6.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I6.i1.p1.1" class="ltx_p"><span id="A4.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use batch operations instead of sequential queries when fetching multiple items.</span></span>
</span></span>
<span id="A4.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I6.i2.1" class="ltx_text ltx_font_bold">R2</span>:</span> 
<span id="A4.I6.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I6.i2.p1.1" class="ltx_p"><span id="A4.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Cache intermediate results and API responses to avoid redundant computation and calls.</span></span>
</span></span>
<span id="A4.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I6.i3.1" class="ltx_text ltx_font_bold">R3</span>:</span> 
<span id="A4.I6.i3.p1" class="ltx_para ltx_noindent">
<span id="A4.I6.i3.p1.1" class="ltx_p"><span id="A4.I6.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prefer local computation over tool calls for simple operations.</span></span>
</span></span>
<span id="A4.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I6.i4.1" class="ltx_text ltx_font_bold">R4</span>:</span> 
<span id="A4.I6.i4.p1" class="ltx_para ltx_noindent">
<span id="A4.I6.i4.p1.1" class="ltx_p"><span id="A4.I6.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Keep final outputs concise (under 100 words); avoid unnecessary elaboration.</span></span>
</span></span>
<span id="A4.I6.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I6.i5.1" class="ltx_text ltx_font_bold">R5</span>:</span> 
