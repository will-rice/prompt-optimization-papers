</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:32.46em;--ltx-fo-depth:0.25em;font-size:10pt;" height="452.55" overflow="visible" transform="matrix(1 0 0 -1 0 449.09)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A6.SS1.p2.pic1.2.1" class="ltx_p"><span id="A6.SS1.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a prompt engineering expert analyzing agent execution errors.<span id="A6.SS1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Your task: Generate a SHORT, TARGETED system prompt addition (1-3 lines) that will help prevent this error in the future.<span id="A6.SS1.p2.pic1.2.1.1.2" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Context:<span id="A6.SS1.p2.pic1.2.1.1.3" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Agent Name: {agent_name}<span id="A6.SS1.p2.pic1.2.1.1.4" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Agent Role: {agent_role}<span id="A6.SS1.p2.pic1.2.1.1.5" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Task: {task}<span id="A6.SS1.p2.pic1.2.1.1.6" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Error Type: {error_type}<span id="A6.SS1.p2.pic1.2.1.1.7" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Error Message: {error_message}<span id="A6.SS1.p2.pic1.2.1.1.8" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Previous actions taken:<span id="A6.SS1.p2.pic1.2.1.1.9" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{last_step_summary}<span id="A6.SS1.p2.pic1.2.1.1.10" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Current system prompt (for reference, to avoid duplication):<span id="A6.SS1.p2.pic1.2.1.1.11" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{current_system_prompt}<span id="A6.SS1.p2.pic1.2.1.1.12" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Already applied rules (DO NOT duplicate these):<span id="A6.SS1.p2.pic1.2.1.1.13" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{applied_rules}<span id="A6.SS1.p2.pic1.2.1.1.14" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Guidelines:<span id="A6.SS1.p2.pic1.2.1.1.15" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>1. Be SPECIFIC and ACTIONABLE - target the exact error cause<span id="A6.SS1.p2.pic1.2.1.1.16" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>2. Be BRIEF - max 1-3 lines<span id="A6.SS1.p2.pic1.2.1.1.17" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>3. Use imperative language (&quot;Always...&quot;, &quot;Never...&quot;, &quot;When X, do Y...&quot;)<span id="A6.SS1.p2.pic1.2.1.1.18" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>4. Don’t repeat what’s already in the current system prompt<span id="A6.SS1.p2.pic1.2.1.1.19" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>5. Focus on formatting, structure, or procedure constraints<span id="A6.SS1.p2.pic1.2.1.1.20" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Output ONLY valid JSON with this exact format:<span id="A6.SS1.p2.pic1.2.1.1.21" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{{<span id="A6.SS1.p2.pic1.2.1.1.22" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;update_text&quot;: &quot;The actual prompt addition text here&quot;,<span id="A6.SS1.p2.pic1.2.1.1.23" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;rationale&quot;: &quot;Brief 1-sentence why this helps&quot;,<span id="A6.SS1.p2.pic1.2.1.1.24" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;confidence&quot;: &quot;low|medium|high&quot;<span id="A6.SS1.p2.pic1.2.1.1.25" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>}}<span id="A6.SS1.p2.pic1.2.1.1.26" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>