<span id="A4.SS3.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A4.I3" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A4.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i1.1" class="ltx_text ltx_font_bold">R1</span>:</span> 
<span id="A4.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i1.p1.1" class="ltx_p"><span id="A4.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use batch operations instead of sequential queries when fetching multiple items.</span></span>
</span></span>
<span id="A4.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i2.1" class="ltx_text ltx_font_bold">R2</span>:</span> 
<span id="A4.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i2.p1.1" class="ltx_p"><span id="A4.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">When searching for multiple entities, combine them into a single query.</span></span>
</span></span>
<span id="A4.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i3.1" class="ltx_text ltx_font_bold">R3</span>:</span> 
<span id="A4.I3.i3.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i3.p1.1" class="ltx_p"><span id="A4.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoid redundant API calls by caching results locally.</span></span>
</span></span>
<span id="A4.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i4.1" class="ltx_text ltx_font_bold">R4</span>:</span> 
<span id="A4.I3.i4.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i4.p1.1" class="ltx_p"><span id="A4.I3.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Cache intermediate results to avoid re-computation.</span></span>
</span></span>
<span id="A4.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i5.1" class="ltx_text ltx_font_bold">R5</span>:</span> 
<span id="A4.I3.i5.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i5.p1.1" class="ltx_p"><span id="A4.I3.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prefer local computation over tool calls for simple arithmetic.</span></span>
</span></span>
<span id="A4.I3.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i6.1" class="ltx_text ltx_font_bold">R6</span>:</span> 
<span id="A4.I3.i6.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i6.p1.1" class="ltx_p"><span id="A4.I3.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not invoke Python interpreter for basic math like addition or subtraction.</span></span>
</span></span>
<span id="A4.I3.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i7.1" class="ltx_text ltx_font_bold">R7</span>:</span> 
<span id="A4.I3.i7.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i7.p1.1" class="ltx_p"><span id="A4.I3.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Limit verbose explanations in final answers to under 100 words.</span></span>
</span></span>
<span id="A4.I3.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i8.1" class="ltx_text ltx_font_bold">R8</span>:</span> 
<span id="A4.I3.i8.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i8.p1.1" class="ltx_p"><span id="A4.I3.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Keep final outputs concise; avoid unnecessary elaboration.</span></span>
</span></span>
<span id="A4.I3.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i9.1" class="ltx_text ltx_font_bold">R9</span>:</span> 
<span id="A4.I3.i9.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i9.p1.1" class="ltx_p"><span id="A4.I3.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">When a search returns sufficient results, stop querying additional sources.</span></span>
</span></span>
<span id="A4.I3.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i10.1" class="ltx_text ltx_font_bold">R10</span>:</span> 
<span id="A4.I3.i10.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i10.p1.1" class="ltx_p"><span id="A4.I3.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use early termination when the answer is found; do not continue searching.</span></span>
</span></span>
<span id="A4.I3.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i11.1" class="ltx_text ltx_font_bold">R11</span>:</span> 
<span id="A4.I3.i11.p1" class="ltx_para">
<span id="A4.I3.i11.p1.1" class="ltx_p"><span id="A4.I3.i11.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">(new)</span><span id="A4.I3.i11.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Batch similar file reads into a single operation.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>