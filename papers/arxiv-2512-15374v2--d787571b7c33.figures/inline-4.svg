<span id="A6.SS1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A6.SS1.p4.pic1.1.1" class="ltx_p"><span id="A6.SS1.p4.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Enhancement Synthesis Prompt (Efficiency)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:43.11em;--ltx-fo-depth:0.25em;font-size:10pt;" height="599.92" overflow="visible" transform="matrix(1 0 0 -1 0 596.46)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A6.SS1.p4.pic1.2.1" class="ltx_p"><span id="A6.SS1.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a prompt engineering expert analyzing agent execution quality.<span id="A6.SS1.p4.pic1.2.1.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Your task: Analyze this successful step and determine if there are inefficiencies or areas for improvement. If found, generate a SHORT, TARGETED system prompt addition (1-3 lines).<span id="A6.SS1.p4.pic1.2.1.1.2" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Context:<span id="A6.SS1.p4.pic1.2.1.1.3" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Agent Name: {agent_name}<span id="A6.SS1.p4.pic1.2.1.1.4" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Agent Role: {agent_role}<span id="A6.SS1.p4.pic1.2.1.1.5" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Task: {task}<span id="A6.SS1.p4.pic1.2.1.1.6" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Step Number: {step_number}<span id="A6.SS1.p4.pic1.2.1.1.7" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Step details:<span id="A6.SS1.p4.pic1.2.1.1.8" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{last_step_summary}<span id="A6.SS1.p4.pic1.2.1.1.9" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Current system prompt (for reference):<span id="A6.SS1.p4.pic1.2.1.1.10" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{current_system_prompt}<span id="A6.SS1.p4.pic1.2.1.1.11" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Already applied rules (DO NOT duplicate these):<span id="A6.SS1.p4.pic1.2.1.1.12" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{applied_rules}<span id="A6.SS1.p4.pic1.2.1.1.13" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Analyze for:<span id="A6.SS1.p4.pic1.2.1.1.14" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>1. **Inefficient tool usage**: Multiple calls when one would suffice, redundant operations<span id="A6.SS1.p4.pic1.2.1.1.15" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>2. **Verbose outputs**: Unnecessarily long reasoning or outputs<span id="A6.SS1.p4.pic1.2.1.1.16" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>3. **Missing best practices**: Not following domain-specific best practices<span id="A6.SS1.p4.pic1.2.1.1.17" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>4. **Suboptimal approaches**: Using less efficient methods when better ones exist<span id="A6.SS1.p4.pic1.2.1.1.18" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Guidelines:<span id="A6.SS1.p4.pic1.2.1.1.19" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Only suggest an update if there’s a CLEAR, ACTIONABLE improvement<span id="A6.SS1.p4.pic1.2.1.1.20" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Be SPECIFIC about what to improve<span id="A6.SS1.p4.pic1.2.1.1.21" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Be BRIEF - max 1-3 lines<span id="A6.SS1.p4.pic1.2.1.1.22" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Use imperative language (&quot;Always...&quot;, &quot;Prefer...&quot;, &quot;When X, use Y instead of Z...&quot;)<span id="A6.SS1.p4.pic1.2.1.1.23" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Don’t repeat what’s already in the current system prompt<span id="A6.SS1.p4.pic1.2.1.1.24" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Output ONLY valid JSON with this exact format:<span id="A6.SS1.p4.pic1.2.1.1.25" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{{<span id="A6.SS1.p4.pic1.2.1.1.26" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;update_text&quot;: &quot;The actual prompt addition text here (or empty string if no improvement needed)&quot;,<span id="A6.SS1.p4.pic1.2.1.1.27" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;rationale&quot;: &quot;Brief 1-sentence why this helps (or ’No improvement needed’)&quot;,<span id="A6.SS1.p4.pic1.2.1.1.28" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;confidence&quot;: &quot;low|medium|high&quot;<span id="A6.SS1.p4.pic1.2.1.1.29" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>}}<span id="A6.SS1.p4.pic1.2.1.1.30" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>