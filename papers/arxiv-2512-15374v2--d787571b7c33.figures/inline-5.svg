<svg id="A6.SS1.p6.pic1" class="ltx_picture" height="630.78" overflow="visible" version="1.1" viewbox="0 0 550 630.78" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,630.78) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 624.87 C 0 628.13 2.64 630.78 5.91 630.78 L 544.09 630.78 C 547.36 630.78 550 628.13 550 624.87 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 605.13 L 548.03 605.13 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 614.49)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A6.SS1.p6.pic1.1.1" class="ltx_p"><span id="A6.SS1.p6.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Enhancement Synthesis Prompt (Thoroughness)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:41.63em;--ltx-fo-depth:0.25em;font-size:10pt;" height="579.55" overflow="visible" transform="matrix(1 0 0 -1 0 576.09)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A6.SS1.p6.pic1.2.1" class="ltx_p"><span id="A6.SS1.p6.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a prompt engineering expert analyzing agent execution quality.<span id="A6.SS1.p6.pic1.2.1.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Your task: Analyze this successful step and determine if there are inefficiencies or areas for improvement. If found, generate a SHORT, TARGETED system prompt addition (1-3 lines).<span id="A6.SS1.p6.pic1.2.1.1.2" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>[Context parameters same as above]<span id="A6.SS1.p6.pic1.2.1.1.3" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Analyze for improvements in these dimensions:<span id="A6.SS1.p6.pic1.2.1.1.4" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>1. **Correctness &amp; Logic**: Assumptions, edge cases, sound approach, validation checks.<span id="A6.SS1.p6.pic1.2.1.1.5" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>2. **Domain-Specific Strategies**: Terminology variants, authoritative sources, domain heuristics.<span id="A6.SS1.p6.pic1.2.1.1.6" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>3. **Strategic Planning &amp; Approach**: Problem decomposition, simpler methods first, batch operations.<span id="A6.SS1.p6.pic1.2.1.1.7" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>4. **Tool Usage Efficiency**: Consolidation, redundancy reduction, local computation.<span id="A6.SS1.p6.pic1.2.1.1.8" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>5. **Information Preservation**: Context tracking, evidence citation, intermediate results.<span id="A6.SS1.p6.pic1.2.1.1.9" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>6. **Robustness &amp; Error Recovery**: Fallback strategies, retry logic, error anticipation.<span id="A6.SS1.p6.pic1.2.1.1.10" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>7. **Output Quality**: Verbosity control, structure, parseability.<span id="A6.SS1.p6.pic1.2.1.1.11" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Guidelines:<span id="A6.SS1.p6.pic1.2.1.1.12" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- PRIORITIZE correctness over efficiency<span id="A6.SS1.p6.pic1.2.1.1.13" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Only suggest if there’s a CLEAR, ACTIONABLE, GENERALIZABLE improvement<span id="A6.SS1.p6.pic1.2.1.1.14" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- For domain rules: Include SPECIFIC terms/sources/values, not placeholders<span id="A6.SS1.p6.pic1.2.1.1.15" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Be BRIEF - max 1-3 lines<span id="A6.SS1.p6.pic1.2.1.1.16" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Use imperative language (&quot;Always...&quot;, &quot;Prefer...&quot;, &quot;When X, do Y...&quot;)<span id="A6.SS1.p6.pic1.2.1.1.17" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Don’t repeat what’s already in the current system prompt<span id="A6.SS1.p6.pic1.2.1.1.18" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>- Look for PATTERNS that generalize beyond this single instance<span id="A6.SS1.p6.pic1.2.1.1.19" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span>Output ONLY valid JSON with this exact format:<span id="A6.SS1.p6.pic1.2.1.1.20" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>{{<span id="A6.SS1.p6.pic1.2.1.1.21" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;update_text&quot;: &quot;The actual prompt addition text here (or empty string if no improvement needed)&quot;,<span id="A6.SS1.p6.pic1.2.1.1.22" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;rationale&quot;: &quot;Brief 1-sentence why this helps (or ’No improvement needed’)&quot;,<span id="A6.SS1.p6.pic1.2.1.1.23" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span> &quot;confidence&quot;: &quot;low|medium|high&quot;<span id="A6.SS1.p6.pic1.2.1.1.24" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>}}<span id="A6.SS1.p6.pic1.2.1.1.25" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>