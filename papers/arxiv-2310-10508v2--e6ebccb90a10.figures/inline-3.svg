<span id="S5.SS3.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.6em;">
<span id="S5.SS3.p5.pic1.1.1" class="ltx_p"><span id="S5.SS3.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ3:<span id="S5.SS3.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Different trends were observed in conversational prompts per task. “Requesting improvements with general keywords” was most common for code summarization, while “adding specific instructions” was most frequent for code generation and translation. Participants used conversational prompts to address known LLM limitations, such as verbosity, missing information, and hallucination.</span></span></span>
</span></span></span></foreignobject></g></g></svg>