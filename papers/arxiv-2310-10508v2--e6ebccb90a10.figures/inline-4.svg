<span id="S5.SS4.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.6em;">
<span id="S5.SS4.p4.pic1.1.1" class="ltx_p"><span id="S5.SS4.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ4:<span id="S5.SS4.p4.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Overall, conversational prompts can improve code tasks. “Requesting improvement” worked best for code summarization, “adding context” for code generation, and “asking questions” for code translation. The rank of trends and improvements showed similar patterns, indicating participants effectively guided the models. The best conversational prompts significantly outperformed automated prompts, improving by 15.8% points, 18.3% points, and 16.1% points for code summarization, generation, and translation, respectively.</span></span></span>
</span></span></span></foreignobject></g></g></svg>