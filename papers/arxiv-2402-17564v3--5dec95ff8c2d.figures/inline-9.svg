<span id="Sx13.SSx2.p4.pic1.2.1" class="ltx_p"><span id="Sx13.SSx2.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The meta-prompt for update:<span id="Sx13.SSx2.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">
<br class="ltx_break">Your task is to write a prompt to replace Prompt.
<br class="ltx_break">
<br class="ltx_break">Below are the previous prompts with their scores. The score ranges from 0 to 100, and higher scores indicate better quality.
<br class="ltx_break">
<br class="ltx_break">Prompt: {prompt1} 
<br class="ltx_break">Score: {score1} 
<br class="ltx_break">
<br class="ltx_break">Prompt: {prompt2} 
<br class="ltx_break">Score: {score2} 
<br class="ltx_break">
<br class="ltx_break">Prompt: {prompt3} 
<br class="ltx_break">Score: {score3} 
<br class="ltx_break">…
<br class="ltx_break">
<br class="ltx_break">The current prompt is:
<br class="ltx_break">{current prompt}
<br class="ltx_break">
<br class="ltx_break">The following exemplars show how to apply the prompt: you replace Prompt in each input with your new prompt, then read the input and give an output. We say your output is wrong if it is different from the given output, and we say your output is correct if they are the same.
<br class="ltx_break">
<br class="ltx_break">{task examples}
<br class="ltx_break">
<br class="ltx_break">Carefully analyze the previous prompts and their scores, and write a new improved prompt to replace Prompt {prompt position description} in the task examples.
<br class="ltx_break">Wrap the new prompt with START and END.</span></span></span>
