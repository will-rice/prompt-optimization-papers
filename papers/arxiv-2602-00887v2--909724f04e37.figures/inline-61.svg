<span id="A17.SS5.SSS0.Px1.p2.pic1.1.1" class="ltx_p"><span id="A17.SS5.SSS0.Px1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Error Object Schema</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:16.3em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="228.62" overflow="visible" transform="matrix(1 0 0 -1 0 225.55)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A17.SS5.SSS0.Px1.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">class EffGenError:
    error_type: str           # Error class name
    message: str              # Human-readable error message
    severity: str             # CRITICAL, HIGH, MEDIUM, LOW
    timestamp: float          # Error occurrence time
    recoverable: bool         # Can be automatically retried
    recovery_attempted: bool  # Was recovery attempted
    recovery_strategy: str    # Strategy used (retry, fallback, etc.)
    component: str            # Which component failed (model, tool, memory)
    stack_trace: str          # Full stack trace
    context: dict             # Additional diagnostic information
    suggested_action: str     # Recommendation for user
    retry_count: int          # Number of retry attempts
    related_errors: list      # Chain of errors if cascading
</pre></span></span></foreignobject></g></g></svg>