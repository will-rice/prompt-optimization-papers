<span id="A5.SS4.SSS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.2em;">
<span id="A5.SS4.SSS1.p1.pic1.2.1" class="ltx_p"><span id="A5.SS4.SSS1.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You are a task decomposition expert. Break down this complex task into independent subtasks that can be executed in parallel.
</span></span>
<span id="A5.SS4.SSS1.p1.pic1.2.2" class="ltx_p"><span id="A5.SS4.SSS1.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Task: {task}
</span></span>
<span id="A5.SS4.SSS1.p1.pic1.2.3" class="ltx_p"><span id="A5.SS4.SSS1.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Requirements:
</span></span>
<span id="A5.I2" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A5.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I2.i1.p1" class="ltx_para">
<span id="A5.I2.i1.p1.1" class="ltx_p"><span id="A5.I2.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Identify 2-5 independent subtasks
</span></span>
</span></span>
<span id="A5.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I2.i2.p1" class="ltx_para">
<span id="A5.I2.i2.p1.1" class="ltx_p"><span id="A5.I2.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Each subtask should be self-contained
</span></span>
</span></span>
<span id="A5.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I2.i3.p1" class="ltx_para">
<span id="A5.I2.i3.p1.1" class="ltx_p"><span id="A5.I2.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Subtasks should not depend on each other
</span></span>
</span></span>
<span id="A5.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A5.I2.i4.p1" class="ltx_para">
<span id="A5.I2.i4.p1.1" class="ltx_p"><span id="A5.I2.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Cover all aspects of the original task
</span></span>
</span></span>
<span id="A5.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A5.I2.i5.p1" class="ltx_para">
<span id="A5.I2.i5.p1.1" class="ltx_p"><span id="A5.I2.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Be specific about what each subtask should accomplish
</span></span>
</span></span>
</span>
<span id="A5.SS4.SSS1.p1.pic1.2.4" class="ltx_p"><span id="A5.SS4.SSS1.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Format your response as JSON:
{
&quot;subtasks&quot;: [
{
&quot;id&quot;: &quot;st_1&quot;,
&quot;description&quot;: &quot;Detailed description of what to do&quot;,
&quot;expected_output&quot;: &quot;What this subtask should produce&quot;,
&quot;estimated_complexity&quot;: 5.0,
&quot;required_specialization&quot;: &quot;research|coding|analysis|synthesis|data|creative|general&quot;,
&quot;priority&quot;: &quot;high|medium|low&quot;
}
],
&quot;reasoning&quot;: &quot;Brief explanation of decomposition strategy&quot;
}
</span></span>
<span id="A5.SS4.SSS1.p1.pic1.2.5" class="ltx_p"><span id="A5.SS4.SSS1.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Respond with ONLY the JSON, no additional text.
</span></span>
</span></span></span></foreignobject></g></g></svg>