<span id="A5.SS4.SSS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.2em;">
<span id="A5.SS4.SSS3.p1.pic1.2.1" class="ltx_p"><span id="A5.SS4.SSS3.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You are a task decomposition expert creating a hierarchical task structure. This task is very complex and requires coordination between a manager and specialized workers.
</span></span>
<span id="A5.SS4.SSS3.p1.pic1.2.2" class="ltx_p"><span id="A5.SS4.SSS3.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Task: {task}
</span></span>
<span id="A5.SS4.SSS3.p1.pic1.2.3" class="ltx_p"><span id="A5.SS4.SSS3.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Requirements:
</span></span>
<span id="A5.I4" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A5.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I4.i1.p1" class="ltx_para">
<span id="A5.I4.i1.p1.1" class="ltx_p"><span id="A5.I4.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Create a hierarchical structure with manager and worker subtasks
</span></span>
</span></span>
<span id="A5.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I4.i2.p1" class="ltx_para">
<span id="A5.I4.i2.p1.1" class="ltx_p"><span id="A5.I4.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">The manager subtask coordinates overall execution
</span></span>
</span></span>
<span id="A5.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I4.i3.p1" class="ltx_para">
<span id="A5.I4.i3.p1.1" class="ltx_p"><span id="A5.I4.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Worker subtasks handle specific aspects
</span></span>
</span></span>
<span id="A5.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A5.I4.i4.p1" class="ltx_para">
<span id="A5.I4.i4.p1.1" class="ltx_p"><span id="A5.I4.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Define clear communication points between levels
</span></span>
</span></span>
<span id="A5.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A5.I4.i5.p1" class="ltx_para">
<span id="A5.I4.i5.p1.1" class="ltx_p"><span id="A5.I4.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Aim to cover all major aspects of the original task
</span></span>
</span></span>
</span>
<span id="A5.SS4.SSS3.p1.pic1.2.4" class="ltx_p"><span id="A5.SS4.SSS3.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Format your response as JSON:
{
&quot;manager_task&quot;: {
&quot;description&quot;: &quot;Coordination and synthesis task&quot;,
&quot;responsibilities&quot;: [&quot;coordinate&quot;, &quot;synthesize&quot;, &quot;quality_check&quot;]
},
&quot;worker_subtasks&quot;: [
{
&quot;id&quot;: &quot;wk_1&quot;,
&quot;description&quot;: &quot;Detailed worker task&quot;,
&quot;reports_to&quot;: &quot;manager&quot;,
&quot;expected_output&quot;: &quot;What this worker produces&quot;,
&quot;estimated_complexity&quot;: 5.0,
&quot;required_specialization&quot;: &quot;research|coding|analysis|synthesis|data|creative|general&quot;
}
],
&quot;reasoning&quot;: &quot;Explanation of hierarchical structure&quot;
}
</span></span>
<span id="A5.SS4.SSS3.p1.pic1.2.5" class="ltx_p"><span id="A5.SS4.SSS3.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Respond with ONLY the JSON, no additional text.
</span></span>
</span></span></span></foreignobject></g></g></svg>