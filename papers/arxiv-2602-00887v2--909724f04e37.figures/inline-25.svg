<span id="A7.SS5.SSS0.Px3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<span id="A7.SS5.SSS0.Px3.p2.pic1.1.1" class="ltx_p"><span id="A7.SS5.SSS0.Px3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Collaborative Consensus Pattern</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.38)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:22.21em;--ltx-fo-depth:0.25em;font-size:10pt;" class="ltx_minipage" height="310.8" overflow="visible" transform="matrix(1 0 0 -1 0 307.34)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A7.SS5.SSS0.Px3.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;"># Create agents with different personas
optimist = Agent(config=AgentConfig(
    name=&quot;optimist&quot;, model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;,
    system_prompt=&quot;You are optimistic, focus on opportunities&quot;))
pessimist = Agent(config=AgentConfig(
    name=&quot;pessimist&quot;, model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;,
    system_prompt=&quot;You are cautious, focus on risks&quot;))
analyst = Agent(config=AgentConfig(
    name=&quot;analyst&quot;, model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;,
    system_prompt=&quot;You are analytical, focus on data&quot;))

orchestrator = MultiAgentOrchestrator()
team = orchestrator.create_team(
    &quot;product_review&quot;,
    [optimist, pessimist, analyst],
    pattern=OrchestrationPattern.COLLABORATIVE
)
result = orchestrator.assign_task(
    &quot;Evaluate feasibility of launching new AI product&quot;,
    team
)

print(f&quot;Consensus reached: {result.success}&quot;)
print(f&quot;Rounds: {result.rounds}&quot;)
print(f&quot;Consensus score: {result.consensus_score:.2f}&quot;)
print(f&quot;Final decision: {result.output}&quot;)
</pre></span></span></foreignobject></g></g></svg>