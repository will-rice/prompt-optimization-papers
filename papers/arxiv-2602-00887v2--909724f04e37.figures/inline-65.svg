config = {
    &quot;tools&quot;: [
        {
            &quot;name&quot;: &quot;web_search&quot;,
            &quot;circuit_breaker&quot;: {
                &quot;enabled&quot;: True,
¯                &quot;failure_threshold&quot;: 3,    # Open after 3 failures
                &quot;timeout&quot;: 60,              # Stay open for 60s
                &quot;half_open_requests&quot;: 1    # Test with 1 request
            }
        }
    ]
}
</pre></span></span></foreignobject></g></g></svg>