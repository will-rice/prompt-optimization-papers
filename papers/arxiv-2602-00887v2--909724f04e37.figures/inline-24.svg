<span id="A7.SS4.SSS0.Px3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<span id="A7.SS4.SSS0.Px3.p2.pic1.1.1" class="ltx_p"><span id="A7.SS4.SSS0.Px3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Hierarchical Orchestration</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.38)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:23.49em;--ltx-fo-depth:0.25em;font-size:10pt;" class="ltx_minipage" height="328.56" overflow="visible" transform="matrix(1 0 0 -1 0 325.1)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A7.SS4.SSS0.Px3.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;"># Manager agent (larger, more capable model)
manager = Agent(config=AgentConfig(
    name=&quot;project_manager&quot;,
    model=&quot;Qwen/Qwen2.5-14B-Instruct&quot;,
    system_prompt=(
        &quot;You are a project manager coordinating a team. &quot;
        &quot;Responsibilities: break down complex tasks, assign work to &quot;
        &quot;specialists, ensure quality, and synthesize results.&quot;),
))

# Specialized worker agents
workers = [
    Agent(config=AgentConfig(name=&quot;researcher&quot;,
        model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;, tools=[WebSearch()])),
    Agent(config=AgentConfig(name=&quot;analyst&quot;,
        model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;, tools=[PythonREPL()])),
    Agent(config=AgentConfig(name=&quot;writer&quot;,
        model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;)),
]

orchestrator = MultiAgentOrchestrator()
team = orchestrator.create_team(
    &quot;market_research_team&quot;,
    workers,
    pattern=OrchestrationPattern.HIERARCHICAL,
    manager_agent=manager,
)

result = orchestrator.assign_task(
    &quot;Conduct market analysis of AI agent platforms&quot;, team)

print(f&quot;Manager output: {result.output}&quot;)
print(f&quot;Stages: {result.metadata.get(’stages’, [])}&quot;)
</pre></span></span></foreignobject></g></g></svg>