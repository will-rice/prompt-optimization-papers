<span id="A22.SS6.p6.pic1.2.2" class="ltx_p"><span id="A22.SS6.p6.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Formula: <math id="A22.SS6.p6.pic1.m1" class="ltx_Math" alttext="A=P(1+r/n)^{nt}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mo lspace="0em" rspace="0em">​</mo><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></mrow></msup></mrow></mrow><annotation encoding="application/x-tex">A=P(1+r/n)^{nt}</annotation></semantics></math></span></span>
<span id="A22.SS6.p6.pic1.2.3" class="ltx_p"><span id="A22.SS6.p6.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Result:<span id="A22.SS6.p6.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Agent correctly identifies formula, calculates <math id="A22.SS6.p6.pic1.m2" class="ltx_Math" alttext="A=5000(1+0.06/4)^{4\times 3}=5000(1.015)^{12}=5978.09" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5000</mn><mo lspace="0em" rspace="0em">​</mo><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.06</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5000</mn><mo lspace="0em" rspace="0em">​</mo><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.015</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5978.09</mn></mrow><annotation encoding="application/x-tex">A=5000(1+0.06/4)^{4\times 3}=5000(1.015)^{12}=5978.09</annotation></semantics></math>, </span>succeeds<span id="A22.SS6.p6.pic1.2.3.1.2" class="ltx_text ltx_font_medium">.</span></span></span>
