</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:9.01em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="127.76" overflow="visible" transform="matrix(1 0 0 -1 0 124.69)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A17.SS7.SSS0.Px1.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">from effgen import Agent
from effgen.config import ConfigLoader
from effgen.core.agent import AgentConfig

# Validate configuration before constructing the agent
loader = ConfigLoader()
config = loader.load_config(&quot;config.yaml&quot;)   # raises on schema errors
loader.validate_config()                      # extra cross-section check

agent_section = config.get(&quot;agent&quot;) or {}
agent = Agent(config=AgentConfig(**agent_section))
</pre></span></span></foreignobject></g></g></svg>