<span id="A2.SS7.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<span id="A2.SS7.p2.pic1.1.1" class="ltx_p"><span id="A2.SS7.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example Chain Configuration: Research and Analysis</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:17.5em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="245.23" overflow="visible" transform="matrix(1 0 0 -1 0 242.15)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A2.SS7.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">name: research_and_analysis
description: Gather information and analyze findings
chain_type: sequential
max_iterations: 1
early_stopping_condition: null

steps:
  - name: gather_sources
    type: tool
    tool: web_search
    output_var: sources
    metadata:
      description: Find relevant sources on the topic

  - name: analyze_sources
    type: prompt
    prompt: |
      Analyze these sources on {topic}:
      {sources}

      Provide:
      1. Key findings
      2. Common themes
      3. Contradictions or gaps
    output_var: analysis
    dependencies: [gather_sources]

  - name: synthesize_report
    type: prompt
    prompt: |
      Create a report on {topic}.

      Analysis: {analysis}

      Structure:
      - Executive Summary
      - Detailed Findings
      - Recommendations
    output_var: final_report
    dependencies: [analyze_sources]
</pre></span></span></foreignobject></g></g></svg>