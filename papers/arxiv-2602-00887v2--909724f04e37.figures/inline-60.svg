</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:7.81em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="111.16" overflow="visible" transform="matrix(1 0 0 -1 0 108.08)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A17.SS3.SSS0.Px1.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">from effgen import Agent
from effgen.core.agent import AgentConfig
from effgen.tools.builtin import WebSearch

agent = Agent(config=AgentConfig(
    name=&quot;fallback_search&quot;,
    model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;,
    tools=[WebSearch()]
))
response = agent.run(&quot;Search for recent AI developments&quot;)
# Retry and fallback behavior is handled by the agent/router layer
