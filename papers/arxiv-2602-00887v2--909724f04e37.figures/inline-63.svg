</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.38)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:9.01em;--ltx-fo-depth:0.25em;font-size:10pt;" class="ltx_minipage" height="128.15" overflow="visible" transform="matrix(1 0 0 -1 0 124.69)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A17.SS7.SSS0.Px2.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">from effgen import Agent
from effgen.core.agent import AgentConfig

agent = Agent(config=AgentConfig(
    name=&quot;bounded_agent&quot;,
    model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;,
    max_iterations=10,            # bound reasoning iterations
    model_config={
        &quot;timeout&quot;: 120,           # model generation timeout (s)
    },
))
