<span id="A17.SS7.SSS0.Px3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<span id="A17.SS7.SSS0.Px3.p2.pic1.1.1" class="ltx_p"><span id="A17.SS7.SSS0.Px3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Best Practice: Error Monitoring</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.38)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:13.81em;--ltx-fo-depth:0.25em;font-size:10pt;" class="ltx_minipage" height="194.57" overflow="visible" transform="matrix(1 0 0 -1 0 191.11)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A17.SS7.SSS0.Px3.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">from effgen import Agent
from effgen.core.agent import AgentConfig
from effgen.core.execution_tracker import ExecutionTracker

agent = Agent(config=AgentConfig(
    name=&quot;tracked_agent&quot;,
    model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;,
))

# Inspect tracked execution events (including any errors).
tracker: ExecutionTracker = agent.execution_tracker
trace  = tracker.get_trace()
errors = [e for e in trace
          if e.type.name in {&quot;ERROR&quot;, &quot;TOOL_CALL_FAILED&quot;,
                              &quot;TASK_FAILED&quot;, &quot;SUB_AGENT_FAILED&quot;}]
from collections import Counter
by_type = Counter(e.type.name for e in errors)
print(f&quot;Total events: {len(trace)}&quot;)
print(f&quot;Error events: {len(errors)}&quot;)
print(f&quot;By type: {dict(by_type)}&quot;)
</pre></span></span></foreignobject></g></g></svg>