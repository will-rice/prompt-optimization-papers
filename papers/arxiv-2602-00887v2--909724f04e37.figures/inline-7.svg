<span id="A3.SS9.SSS0.Px2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<span id="A3.SS9.SSS0.Px2.p2.pic1.1.1" class="ltx_p"><span id="A3.SS9.SSS0.Px2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Custom Optimization Configuration</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:12.61em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="177.58" overflow="visible" transform="matrix(1 0 0 -1 0 174.5)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A3.SS9.SSS0.Px2.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;"># Fine-grained control over optimization
from effgen import PromptOptimizer
from effgen.prompts.optimizer import OptimizationConfig, ModelSize

cfg = OptimizationConfig(
    model_size=ModelSize.MEDIUM,
    max_prompt_tokens=1500,
    target_compression_ratio=0.75,
    use_bullet_points=True,
    simplify_language=True,
    remove_redundancy=True,
)
opt = PromptOptimizer(cfg)

# Add domain-specific replacement patterns
opt.COMPRESSION_REPLACEMENTS[r&quot;\bartificial intelligence\b&quot;] = &quot;AI&quot;
opt.COMPRESSION_REPLACEMENTS[r&quot;\bmachine learning\b&quot;]      = &quot;ML&quot;

optimized = opt.optimize(&quot;...your prompt...&quot;)
</pre></span></span></foreignobject></g></g></svg>