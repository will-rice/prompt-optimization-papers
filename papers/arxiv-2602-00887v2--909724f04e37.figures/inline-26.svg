</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.38)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:11.49em;--ltx-fo-depth:0.25em;font-size:10pt;" class="ltx_minipage" height="162.51" overflow="visible" transform="matrix(1 0 0 -1 0 159.05)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A7.SS6.SSS2.Px1.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">orchestrator = MultiAgentOrchestrator()
team = orchestrator.create_team(
    &quot;message_team&quot;,
    [agent1, agent2, agent3],
    pattern=OrchestrationPattern.COLLABORATIVE
)
result = orchestrator.assign_task(task, team)

# Inspect the inter-agent message log (the bus persists history)
from collections import Counter
messages = orchestrator.message_bus.get_history()
type_counts = Counter(m.type.value for m in messages)
print(f&quot;Total messages: {len(messages)}&quot;)
print(f&quot;Message types: {dict(type_counts)}&quot;)
