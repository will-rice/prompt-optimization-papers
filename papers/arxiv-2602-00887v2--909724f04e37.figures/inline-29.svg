<span id="A8.SS3.SSS0.Px3.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A8.SS3.SSS0.Px3.p6.pic1.1.1" class="ltx_p"><span id="A8.SS3.SSS0.Px3.p6.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">SQLite Memory Schema</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.85)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:10.29em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="145.52" overflow="visible" transform="matrix(1 0 0 -1 0 142.45)" width="29.88em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A8.SS3.SSS0.Px3.p6.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">CREATE TABLE memories (
    id TEXT PRIMARY KEY,
    content TEXT NOT NULL,
    memory_type TEXT NOT NULL,
    importance INTEGER NOT NULL,
    timestamp REAL NOT NULL,
    session_id TEXT,
    metadata TEXT,
    access_count INTEGER DEFAULT 0,
    last_accessed REAL,
    tags TEXT
);
CREATE INDEX idx_timestamp ON memories(timestamp);
CREATE INDEX idx_importance ON memories(importance);
CREATE INDEX idx_session ON memories(session_id);
CREATE INDEX idx_type ON memories(memory_type);
</pre></span></span></foreignobject></g></g></svg>