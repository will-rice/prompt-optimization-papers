<span id="A20.SS2.SSS1.Px3.p2.pic1.2.1" class="ltx_p"><span id="A20.SS2.SSS1.Px3.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question:<span id="A20.SS2.SSS1.Px3.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Find the number of positive integers <math id="A20.SS2.SSS1.Px3.p2.pic1.m1" class="ltx_Math" alttext="n\leq 1000" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1000</mn></mrow><annotation encoding="application/x-tex">n\leq 1000</annotation></semantics></math> such that <math id="A20.SS2.SSS1.Px3.p2.pic1.m2" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> is divisible by 7 but not by 14.</span></span></span>
<span id="A20.SS2.SSS1.Px3.p2.pic1.2.2" class="ltx_p"><span id="A20.SS2.SSS1.Px3.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Solution:<span id="A20.SS2.SSS1.Px3.p2.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A20.I3" class="ltx_enumerate">
<span id="A20.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A20.I3.i1.p1" class="ltx_para">
<span id="A20.I3.i1.p1.1" class="ltx_p"><span id="A20.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Numbers divisible by 7: </span><math id="A20.I3.i1.p1.m1" class="ltx_Math" alttext="\lfloor 1000/7\rfloor=142" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⌊</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1000</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⌋</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">142</mn></mrow><annotation encoding="application/x-tex">\lfloor 1000/7\rfloor=142</annotation></semantics></math></span>
</span></span>
<span id="A20.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A20.I3.i2.p1" class="ltx_para">
<span id="A20.I3.i2.p1.1" class="ltx_p"><span id="A20.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Numbers divisible by 14: </span><math id="A20.I3.i2.p1.m1" class="ltx_Math" alttext="\lfloor 1000/14\rfloor=71" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⌊</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1000</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">14</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⌋</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">71</mn></mrow><annotation encoding="application/x-tex">\lfloor 1000/14\rfloor=71</annotation></semantics></math></span>
</span></span>
<span id="A20.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A20.I3.i3.p1" class="ltx_para">
<span id="A20.I3.i3.p1.1" class="ltx_p"><span id="A20.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Numbers divisible by 7 but not 14: </span><math id="A20.I3.i3.p1.m1" class="ltx_Math" alttext="142-71=71" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">142</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">71</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">71</mn></mrow><annotation encoding="application/x-tex">142-71=71</annotation></semantics></math></span>
</span></span>
</span>
