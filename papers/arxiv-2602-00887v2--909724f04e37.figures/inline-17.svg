<span id="A6.SS5.SSS0.Px2.p2.pic1.1.1" class="ltx_p"><span id="A6.SS5.SSS0.Px2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Shared Memory Pattern</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:7.89em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="112.31" overflow="visible" transform="matrix(1 0 0 -1 0 109.24)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A6.SS5.SSS0.Px2.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;"># Configure shared memory
config = AgentConfig(
    name=&quot;parent&quot;,
    model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;,
    sub_agent_config={&quot;inherit_context&quot;: True}
)
parent = Agent(config=config)

# Sub-agents see each other’s memory entries
sub_1.run(&quot;Task 1&quot;)  # Writes to shared memory
sub_2.run(&quot;Use findings from Task 1&quot;)  # Reads from shared memory
</pre></span></span></foreignobject></g></g></svg>