<span id="A6.SS4.SSS1.Px1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<span id="A6.SS4.SSS1.Px1.p2.pic1.1.1" class="ltx_p"><span id="A6.SS4.SSS1.Px1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Parallel Sub-Agent Execution (Pseudocode)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:10.3em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="145.6" overflow="visible" transform="matrix(1 0 0 -1 0 142.52)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A6.SS4.SSS1.Px1.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">async def ParallelExecute(sub_agents, max_parallel):
    semaphore = asyncio.Semaphore(max_parallel)

    async def run_one(agent):
        async with semaphore:
            try:
                result = await ExecuteSubTask(agent)
                agent.state = COMPLETED
                return result
            except Exception as e:
                agent.state = FAILED
                return Error(e)

    return await asyncio.gather(
        *(run_one(agent) for agent in sub_agents)
    )
</pre></span></span></foreignobject></g></g></svg>