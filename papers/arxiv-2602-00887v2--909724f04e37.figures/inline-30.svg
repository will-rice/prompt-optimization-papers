<span id="A8.SS6.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<span id="A8.SS6.p2.pic1.1.1" class="ltx_p"><span id="A8.SS6.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Memory System Configuration Example</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:23.5em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="328.25" overflow="visible" transform="matrix(1 0 0 -1 0 325.17)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A8.SS6.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">memory:
  short_term:
    max_tokens: 4096              # Maximum tokens in short-term
    max_messages: 100             # Maximum message count
¯    summarization_threshold: 0.8  # Trigger at 80% of max_tokens
    summary_ratio: 0.3            # Target 30% of original length
    keep_recent: 10               # Always keep 10 most recent

  long_term:
    backend: sqlite               # json | sqlite
    path: ./memory/longterm.db    # Storage path
    retention_policy: importance  # all | importance | recency
    min_importance: MEDIUM        # Minimum to retain
    max_entries: 100000           # Cap at 100K entries
    consolidation_interval: 100   # Every 100 new memories

  vector_store:
    backend: faiss                # faiss | chromadb
    embedding_model: all-MiniLM-L6-v2
    embedding_dim: 384
    similarity_threshold: 0.7     # Min similarity for retrieval
    max_results: 10               # Top-k results
¯    index_type: flat              # FAISS currently uses IndexFlatIP
    persist_path: ./memory/vectors

  scoring:
    weights:
      recency: 0.30
      frequency: 0.20
      importance: 0.30
      similarity: 0.20
    decay_halflife_days: 7        # Recency decay parameter
</pre></span></span></foreignobject></g></g></svg>