<span id="A3.SS9.SSS0.Px1.p2.pic1.1.1" class="ltx_p"><span id="A3.SS9.SSS0.Px1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Automatic Prompt Optimization (Recommended)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:13.81em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="194.18" overflow="visible" transform="matrix(1 0 0 -1 0 191.11)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A3.SS9.SSS0.Px1.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">from effgen import Agent, PromptOptimizer
from effgen.core.agent import AgentConfig
from effgen.prompts.optimizer import OptimizationConfig, ModelSize

# Automatic optimization based on model size: pre-compress
# the system prompt before constructing the agent.
opt = PromptOptimizer(OptimizationConfig.for_model_size(ModelSize.SMALL))
sys_prompt = opt.optimize(
    &quot;Long, verbose system prompt with redundant phrasing...&quot;
).optimized_prompt

agent = Agent(config=AgentConfig(
    name=&quot;slm_agent&quot;,
    model=&quot;Qwen/Qwen2.5-3B-Instruct&quot;,
    system_prompt=sys_prompt,
))
</pre></span></span></foreignobject></g></g></svg>