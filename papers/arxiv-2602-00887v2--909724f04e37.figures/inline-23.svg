<span id="A7.SS3.SSS0.Px3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<span id="A7.SS3.SSS0.Px3.p2.pic1.1.1" class="ltx_p"><span id="A7.SS3.SSS0.Px3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Parallel Orchestration Example</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.38)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:23.5em;--ltx-fo-depth:0.25em;font-size:10pt;" class="ltx_minipage" height="328.63" overflow="visible" transform="matrix(1 0 0 -1 0 325.17)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A7.SS3.SSS0.Px3.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;"># Create specialized research agents
tech_researcher = Agent(config=AgentConfig(
    name=&quot;tech&quot;, model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;,
    system_prompt=&quot;Focus on technology&quot;))
business_researcher = Agent(config=AgentConfig(
    name=&quot;business&quot;, model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;,
    system_prompt=&quot;Focus on business&quot;))
academic_researcher = Agent(config=AgentConfig(
    name=&quot;academic&quot;, model=&quot;Qwen/Qwen2.5-7B-Instruct&quot;,
    system_prompt=&quot;Focus on research&quot;))

orchestrator = MultiAgentOrchestrator()
team = orchestrator.create_team(
    &quot;renewable_energy_team&quot;,
    [tech_researcher, business_researcher, academic_researcher],
    pattern=OrchestrationPattern.PARALLEL
)
result = orchestrator.assign_task(
    &quot;Research renewable energy from multiple perspectives&quot;,
    team
)

# Results combined automatically
print(f&quot;Execution time: {result.execution_time:.2f}s&quot;)
print(f&quot;Agents run in parallel: {len(result.agent_responses)}&quot;)
</pre></span></span></foreignobject></g></g></svg>