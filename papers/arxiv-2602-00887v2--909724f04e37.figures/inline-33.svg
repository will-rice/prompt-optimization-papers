<span id="A10.SS2.SSS0.Px3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<span id="A10.SS2.SSS0.Px3.p2.pic1.1.1" class="ltx_p"><span id="A10.SS2.SSS0.Px3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Agent Configuration Schema</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:25.9em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="361.46" overflow="visible" transform="matrix(1 0 0 -1 0 358.38)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A10.SS2.SSS0.Px3.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">agent:
  name: research_agent
  model:
    name: Qwen/Qwen2.5-7B-Instruct
    backend: vllm                   # vllm | transformers | api
    quantization: 8bit              # none | 8bit | 4bit
    max_tokens: 4096
    temperature: 0.0

  prompt_optimizer:
    model_size: medium              # tiny | small | medium | large
    max_prompt_tokens: 2048
    target_compression_ratio: 0.8
    use_bullet_points: true

  routing:
    complexity_threshold: 7.0       # Single vs multi-agent boundary
    hierarchical_threshold: 9.0     # Manager-worker threshold
    weights:                        # Five-factor weights
      task_length: 0.15
      num_requirements: 0.25
      domain_breadth: 0.20
      tool_requirements: 0.20
      reasoning_depth: 0.20

  memory:
    short_term:
      max_tokens: 4096
      max_messages: 100
      summarization_threshold: 0.8
    long_term:
      backend: sqlite               # json | sqlite
      path: ./memory.db
      retention_policy: importance  # all | importance | recency
    vector_store:
      backend: faiss                # faiss | chromadb
      embedding_model: all-MiniLM-L6-v2
      similarity_threshold: 0.7

  execution:
    sandbox: docker                 # none | local | docker
    max_execution_time: 60.0
    max_memory_mb: 512
    enable_tracking: true
</pre></span></span></foreignobject></g></g></svg>