nsform="matrix(1 0 0 -1 0 9.34)" width="397.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS1.p2.pic1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Policy Block — <span id="S4.SS1.p2.pic1.1.1" class="ltx_text ltx_font_typewriter">Sum_Type2</span> (Enterprise IT help desk Tickets)</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 13.35)"><foreignobject style="--ltx-fo-width:38.32em;--ltx-fo-height:74.81em;--ltx-fo-depth:0em;font-size:10pt;" height="1035.17" overflow="visible" transform="matrix(1 0 0 -1 0 1035.17)" width="530.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS1.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="S4.SS1.p2.pic1.p10" class="ltx_para">
<span id="S4.SS1.p2.pic1.p10.1" class="ltx_p"><span id="S4.SS1.p2.pic1.p10.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Policy block for <span id="S4.SS1.p2.pic1.p10.1.1.1" class="ltx_text ltx_font_typewriter">Summary Format 2</span> (enterprise IT help desk dataset), illustrating the
two-tier rule structure used in MIDAS.</span></span>
</span>
<span id="S4.SS1.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.SS1.p2.pic1.p1.1" class="ltx_p"><span id="S4.SS1.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#1E5AB4;">Static Rules</span></span>
</span>
<span id="S4.SS1.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="S4.SS1.p2.pic1.p2.1" class="ltx_p"><span id="S4.SS1.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#646464;">1.</span><span id="S4.SS1.p2.pic1.p2.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p2.1.3" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Output format.</span><span id="S4.SS1.p2.pic1.p2.1.4" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">
Every output must use the exact four-field one-line format with commas and spaces as shown:</span>
<br class="ltx_break"><span id="S4.SS1.p2.pic1.p2.1.5" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Type: X, Queue: Y, Priority: Z, Language: L</span></span>
</span>
<span id="S4.SS1.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="S4.SS1.p2.pic1.p3.1" class="ltx_p"><span id="S4.SS1.p2.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#646464;">2.</span><span id="S4.SS1.p2.pic1.p3.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p3.1.3" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Valid ticket types &amp; priority levels.</span><span id="S4.SS1.p2.pic1.p3.1.4" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">
</span><span id="S4.SS1.p2.pic1.p3.1.5" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Type</span><span id="S4.SS1.p2.pic1.p3.1.6" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> must be exactly one of:
</span><span id="S4.SS1.p2.pic1.p3.1.7" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Incident</span><span id="S4.SS1.p2.pic1.p3.1.8" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">, </span><span id="S4.SS1.p2.pic1.p3.1.9" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Request</span><span id="S4.SS1.p2.pic1.p3.1.10" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">, </span><span id="S4.SS1.p2.pic1.p3.1.11" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Change</span><span id="S4.SS1.p2.pic1.p3.1.12" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">, </span><span id="S4.SS1.p2.pic1.p3.1.13" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Problem</span><span id="S4.SS1.p2.pic1.p3.1.14" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">. </span><span id="S4.SS1.p2.pic1.p3.1.15" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Priority</span><span id="S4.SS1.p2.pic1.p3.1.16" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> must be exactly one of: </span><span id="S4.SS1.p2.pic1.p3.1.17" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">high</span><span id="S4.SS1.p2.pic1.p3.1.18" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">, </span><span id="S4.SS1.p2.pic1.p3.1.19" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">medium</span><span id="S4.SS1.p2.pic1.p3.1.20" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">, </span><span id="S4.SS1.p2.pic1.p3.1.21" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">low</span><span id="S4.SS1.p2.pic1.p3.1.22" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">.</span></span>
</span>
<span id="S4.SS1.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="S4.SS1.p2.pic1.p4.1" class="ltx_p"><span id="S4.SS1.p2.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#646464;">3.</span><span id="S4.SS1.p2.pic1.p4.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p4.1.3" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">No additional text.</span><span id="S4.SS1.p2.pic1.p4.1.4" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">
Output only the four fields with no explanation, preamble, or trailing content.</span></span>
</span>
<span id="S4.SS1.p2.pic1.p5" class="ltx_para ltx_noindent">
<span id="S4.SS1.p2.pic1.p5.1" class="ltx_p"><span id="S4.SS1.p2.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#1E8C3C;">Data-Learned Rules examples</span></span>
</span>
<span id="S4.SS1.p2.pic1.p6" class="ltx_para ltx_noindent">
<span id="S4.SS1.p2.pic1.p6.1" class="ltx_p"><span id="S4.SS1.p2.pic1.p6.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#646464;">4.</span><span id="S4.SS1.p2.pic1.p6.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p6.1.3" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Incident classification.</span><span id="S4.SS1.p2.pic1.p6.1.4" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">
When the ticket describes a system issue, malfunction, outage, crash, downtime, or
unauthorized access </span><math id="S4.SS1.p2.pic1.p6.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="S4.SS1.p2.pic1.p6.1.5" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p6.1.6" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Type: Incident</span><span id="S4.SS1.p2.pic1.p6.1.7" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">.</span>
<br class="ltx_break"><span id="S4.SS1.p2.pic1.p6.1.8" class="ltx_text ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Example</span><span id="S4.SS1.p2.pic1.p6.1.9" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">: </span><span id="S4.SS1.p2.pic1.p6.1.10" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">‘‘server overload and subsequent downtime’’</span><span id="S4.SS1.p2.pic1.p6.1.11" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><math id="S4.SS1.p2.pic1.p6.m2" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="S4.SS1.p2.pic1.p6.1.12" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p6.1.13" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Type: Incident</span></span>
</span>
<span id="S4.SS1.p2.pic1.p7" class="ltx_para ltx_noindent">
<span id="S4.SS1.p2.pic1.p7.1" class="ltx_p"><span id="S4.SS1.p2.pic1.p7.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#646464;">5.</span><span id="S4.SS1.p2.pic1.p7.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p7.1.3" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Queue routing — Billing.</span><span id="S4.SS1.p2.pic1.p7.1.4" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">
When billing, invoices, charges, or payment systems are the main topic
</span><math id="S4.SS1.p2.pic1.p7.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="S4.SS1.p2.pic1.p7.1.5" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p7.1.6" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Queue: Billing and Payments</span><span id="S4.SS1.p2.pic1.p7.1.7" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">.</span></span>
</span>
<span id="S4.SS1.p2.pic1.p8" class="ltx_para ltx_noindent">
<span id="S4.SS1.p2.pic1.p8.1" class="ltx_p"><span id="S4.SS1.p2.pic1.p8.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#646464;">6.</span><span id="S4.SS1.p2.pic1.p8.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p8.1.3" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Priority inference.</span><span id="S4.SS1.p2.pic1.p8.1.4" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">
When the ticket signals urgency or high impact via keywords such as
</span><span id="S4.SS1.p2.pic1.p8.1.5" class="ltx_text ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">“critical”</span><span id="S4.SS1.p2.pic1.p8.1.6" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">, </span><span id="S4.SS1.p2.pic1.p8.1.7" class="ltx_text ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">“breach”</span><span id="S4.SS1.p2.pic1.p8.1.8" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">, </span><span id="S4.SS1.p2.pic1.p8.1.9" class="ltx_text ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">“unauthorized access”</span><span id="S4.SS1.p2.pic1.p8.1.10" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">, or
</span><span id="S4.SS1.p2.pic1.p8.1.11" class="ltx_text ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">“significantly affecting productivity”</span><span id="S4.SS1.p2.pic1.p8.1.12" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><math id="S4.SS1.p2.pic1.p8.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="S4.SS1.p2.pic1.p8.1.13" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p8.1.14" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Priority: high</span><span id="S4.SS1.p2.pic1.p8.1.15" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">.</span>
<br class="ltx_break"><span id="S4.SS1.p2.pic1.p8.1.16" class="ltx_text ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Example</span><span id="S4.SS1.p2.pic1.p8.1.17" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">: </span><span id="S4.SS1.p2.pic1.p8.1.18" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">‘‘A critical outage has been reported…’’</span><span id="S4.SS1.p2.pic1.p8.1.19" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><math id="S4.SS1.p2.pic1.p8.m2" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="S4.SS1.p2.pic1.p8.1.20" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p8.1.21" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Priority: high</span></span>
</span>
<span id="S4.SS1.p2.pic1.p9" class="ltx_para ltx_noindent">
<span id="S4.SS1.p2.pic1.p9.1" class="ltx_p"><span id="S4.SS1.p2.pic1.p9.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#646464;">7.</span><span id="S4.SS1.p2.pic1.p9.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> </span><span id="S4.SS1.p2.pic1.p9.1.3" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Language detection.</span><span id="S4.SS1.p2.pic1.p9.1.4" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">
Detect the input language and set </span><span id="S4.SS1.p2.pic1.p9.1.5" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">Language</span><span id="S4.SS1.p2.pic1.p9.1.6" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> accordingly.</span></span>
</span></span></span></span></foreignobject></g></g></svg>