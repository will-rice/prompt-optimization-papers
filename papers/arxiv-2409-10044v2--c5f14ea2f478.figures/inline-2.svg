<br class="ltx_break">Q: If Goofy were a pet, would he need heartworm prevention?
<br class="ltx_break">A: Goofy is a dog, and dogs require regular heartworm prevention. Thus, if Goofy were a pet, he would need heartworm prevention. So the answer is yes.
