<svg id="A3.p2.pic1" class="ltx_picture" height="311.28" overflow="visible" version="1.1" viewbox="0 0 477.38 311.28" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,311.28) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#9F9F9F;" fill="#9F9F9F" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 311.28 L 477.38 311.28 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 310.59 L 476.68 310.59 L 476.68 0.69 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.19)"><foreignobject style="--ltx-fo-width:31.56em;--ltx-fo-height:20.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="286.28" overflow="visible" transform="matrix(1 0 0 -1 0 283.59)" width="436.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.56em;">
<span id="A3.p2.pic1.1.1" class="ltx_p"><span id="A3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#CCCCFF;">Prompt for Generating Candidate Prompts</span></span>
<span id="A3.p2.pic1.1.2" class="ltx_p"><span id="A3.p2.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">I’m trying to write a prompt about some different tasks. 
<br class="ltx_break"></span></span>
<span id="A3.p2.pic1.1.3" class="ltx_p"><span id="A3.p2.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">My current prompt is: 
<br class="ltx_break">{prompt} 
<br class="ltx_break"></span></span>
<span id="A3.p2.pic1.1.4" class="ltx_p"><span id="A3.p2.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">But it gets the some examples wrong. Based on these wrong examples, the problem with this prompt is that {new_constraint} 
<br class="ltx_break"></span></span>
<span id="A3.p2.pic1.1.5" class="ltx_p"><span id="A3.p2.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Note that new prompts should not focus excessively on or be limited to a single example of an error. Instead, they should be generated from a more generalized perspective, based on the analyzed causes of the errors. 
<br class="ltx_break"></span></span>
<span id="A3.p2.pic1.1.6" class="ltx_p"><span id="A3.p2.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please do not provide any examples (i.e. few-shot examples) in the new prompt; no other redundant information is needed. 
<br class="ltx_break"></span></span>
<span id="A3.p2.pic1.1.7" class="ltx_p"><span id="A3.p2.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on the above information, you should write Four different improved prompts. 
<br class="ltx_break"></span></span>
<span id="A3.p2.pic1.1.8" class="ltx_p"><span id="A3.p2.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each new prompt is wrapped with &lt;START&gt; and &lt;END&gt;. 
<br class="ltx_break"></span></span>
<span id="A3.p2.pic1.1.9" class="ltx_p"><span id="A3.p2.pic1.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">The Four new prompts are:</span></span>
</span></span></span></foreignobject></g></g></svg>