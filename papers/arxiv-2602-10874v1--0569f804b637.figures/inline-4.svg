<svg id="A2.SS1.p4.pic1" class="ltx_picture" height="312.82" overflow="visible" version="1.1" viewbox="0 0 477.38 312.82" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,312.82) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#9F9F9F;" fill="#9F9F9F" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 312.82 L 477.38 312.82 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 312.12 L 476.68 312.12 L 476.68 0.69 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.96)"><foreignobject style="--ltx-fo-width:31.56em;--ltx-fo-height:20.55em;--ltx-fo-depth:0.25em;font-size:10pt;" height="287.81" overflow="visible" transform="matrix(1 0 0 -1 0 284.35)" width="436.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.56em;">
<span id="A2.SS1.p4.pic1.1.1" class="ltx_p"><span id="A2.SS1.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#CCCCFF;">SPO (F1: 62.03)</span></span>
<span id="A2.SS1.p4.pic1.1.2" class="ltx_p"><span id="A2.SS1.p4.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Analyze the Statement to determine if it is a false factual claim (Yes) or not (No) by rigorously applying these steps:</span></span>
<span id="A2.SS1.p4.pic1.1.3" class="ltx_p"><span id="A2.SS1.p4.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">0. Determine if the statement is a factual claim (verifiable by evidence). If not (e.g., opinion, prediction, or value judgment), the statement cannot be a lie (Answer: No).</span></span>
<span id="A2.SS1.p4.pic1.1.4" class="ltx_p"><span id="A2.SS1.p4.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Clarify the time frame and scope (e.g., &quot;four years ago&quot; from when?).</span></span>
<span id="A2.SS1.p4.pic1.1.5" class="ltx_p"><span id="A2.SS1.p4.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Verify factual claims against authoritative sources (e.g., BLS, FEC, or peer-reviewed data).</span></span>
<span id="A2.SS1.p4.pic1.1.6" class="ltx_p"><span id="A2.SS1.p4.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Assess source bias using provided context (job title, state, party, media outlet).</span></span>
<span id="A2.SS1.p4.pic1.1.7" class="ltx_p"><span id="A2.SS1.p4.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. Scrutinize absolute language (e.g., &quot;never&quot;, &quot;always&quot;) for overstatement.</span></span>
<span id="A2.SS1.p4.pic1.1.8" class="ltx_p"><span id="A2.SS1.p4.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide a detailed, step-by-step reasoning process incorporating all elements. Conclude with &quot;Final Answer:&quot; followed by &lt;answer&gt;[Yes or No]&lt;/answer&gt;.</span></span>
</span></span></span></foreignobject></g></g></svg>