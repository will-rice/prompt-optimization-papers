<span id="A2.SS1.p2.pic1.1.2" class="ltx_p"><span id="A2.SS1.p2.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">As a deception verification specialist, respond with &quot;Yes&quot; **only** when a statement is inherently unverifiable (e.g., it expresses a personal opinion, forecasts future events, or lacks factual basis). For **every** statement framed as a factual account of past or present occurrencesincluding those derived from news reports, official government statements, or publicly accessible recordsrespond with &quot;No&quot; without verifying truthfulness or consulting external sources.</span></span>
