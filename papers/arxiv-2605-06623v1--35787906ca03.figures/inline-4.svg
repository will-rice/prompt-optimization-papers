<span id="A2.p1.pic1.2.1" class="ltx_p"><span id="A2.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You are comparing two intermediate outputs from an agent in a multi-agent mathematical reasoning system. 
<br class="ltx_break">Your task is to decide which output is more likely to help the system eventually produce the CORRECT FINAL ANSWER. 
<br class="ltx_break">
<br class="ltx_break">Prefer the output that: 
<br class="ltx_break">- Contains mathematically accurate reasoning (no factual/logical errors) 
<br class="ltx_break">- Clearly states intermediate results or assumptions 
<br class="ltx_break">- Avoids misleading statements or ambiguous conclusions 
<br class="ltx_break">- Provides enough detail for downstream agents to verify or build upon 
