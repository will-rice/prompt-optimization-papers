</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.92 15.69)"><foreignobject style="--ltx-fo-width:34.53em;--ltx-fo-height:29.35em;--ltx-fo-depth:0.2em;font-size:10pt;" height="408.89" overflow="visible" transform="matrix(1 0 0 -1 0 406.12)" width="477.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.53em;">
<span id="A1.p2.pic1.2.1" class="ltx_p"><span id="A1.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You are optimizing a prompt for a specific agent in a multi-agent problem-solving system. 
<br class="ltx_break">CRITICAL: The agent’s core role and responsibilities MUST be preserved in the optimized prompt. 
<br class="ltx_break">
<br class="ltx_break">Agent Type: {agent_type} 
<br class="ltx_break">Current System Role: {role_description} 
<br class="ltx_break">
<br class="ltx_break">Sample Execution Traces... 
<br class="ltx_break">{samples} 
<br class="ltx_break">Requirements... 
<br class="ltx_break">{requirements} 
<br class="ltx_break">Reference prompt... 
<br class="ltx_break">{prompt} 
<br class="ltx_break">
<br class="ltx_break">Optimization Principles: 
<br class="ltx_break">**DO:** 
<br class="ltx_break">- Give clear, actionable guidance in 2-3 sentences 
<br class="ltx_break">- Focus on WHAT to think about, not HOW to format 
<br class="ltx_break">- The prompt must be CONCISE (under 250 words) and DOMAIN-AGNOSTIC 
<br class="ltx_break">**DON’T:** 
<br class="ltx_break">- Create multi-section templates with headers 
<br class="ltx_break">- Require &quot;verify each step&quot; or &quot;solve independently first&quot; 
<br class="ltx_break">
<br class="ltx_break">Provide your analysis, optimization points, and the complete optimized prompt using the following XML format: 
<br class="ltx_break">&lt;analyse&gt;...&lt;/analyse&gt; 
<br class="ltx_break">&lt;modification&gt;...&lt;/modification&gt; 
<br class="ltx_break">&lt;prompt&gt;...&lt;/prompt&gt;
</span></span>
