<span id="A4.SS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.SS1.p2.pic1.1.1" class="ltx_p"><span id="A4.SS1.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Meta Prompt Optimizer</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:40.29em;--ltx-fo-depth:0em;font-size:10pt;" height="557.56" overflow="visible" transform="matrix(1 0 0 -1 0 557.56)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.SS1.p2.pic1.2.1" class="ltx_p"><span id="A4.SS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Task Requirement</span></span>
<span id="A4.SS1.p2.pic1.2.2" class="ltx_p"><span id="A4.SS1.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">A TextGrad optimizer optimizes a TextGrad pipeline so that the pipeline can generate better outputs based on inputs.</span></span>
<span id="A4.SS1.p2.pic1.2.3" class="ltx_p"><span id="A4.SS1.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">A TextGrad pipeline consists of several agents, each of which has a specific role in the optimization process, which is defined by different prompts.</span></span>
<span id="A4.SS1.p2.pic1.2.4" class="ltx_p"><span id="A4.SS1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given a general task description of an optimizer and the specific task the pipeline aims to solve.</span></span>
<span id="A4.SS1.p2.pic1.2.5" class="ltx_p"><span id="A4.SS1.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to propose an improved optimizer task description so that the optimizer can better optimize the pipeline for the given task.</span></span>
<span id="A4.SS1.p2.pic1.2.6" class="ltx_p"><span id="A4.SS1.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Optimizer Code</span></span>
<span id="A4.SS1.p2.pic1.2.7" class="ltx_p"><span id="A4.SS1.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the source code of the optimizer: (just for reference)</span></span>
<span id="A4.SS1.p2.pic1.2.8" class="ltx_p"><span id="A4.SS1.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">{optimizer_source_code}</span></span>
<span id="A4.SS1.p2.pic1.2.9" class="ltx_p"><span id="A4.SS1.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;"># The task of the optimizer</span></span>
<span id="A4.SS1.p2.pic1.2.10" class="ltx_p"><span id="A4.SS1.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Specifically, the pipeline aims to solve this kind of question: {example_set.get_question_type()}.</span></span>
<span id="A4.SS1.p2.pic1.2.11" class="ltx_p"><span id="A4.SS1.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">An example of the task is provided here:</span></span>
<span id="A4.SS1.p2.pic1.2.12" class="ltx_p"><span id="A4.SS1.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Question: {example_question}</span></span>
<span id="A4.SS1.p2.pic1.2.13" class="ltx_p"><span id="A4.SS1.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Answer: {example_answer}</span></span>
<span id="A4.SS1.p2.pic1.2.14" class="ltx_p"><span id="A4.SS1.p2.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">The LLM optimizer wants to improve a LLM pipeline to solve such kind of problems.</span></span>
<span id="A4.SS1.p2.pic1.2.15" class="ltx_p"><span id="A4.SS1.p2.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Current Task Description</span></span>
<span id="A4.SS1.p2.pic1.2.16" class="ltx_p"><span id="A4.SS1.p2.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the current task description of the optimizer, which you can improve:
{optimizer_prompt}</span></span>
<span id="A4.SS1.p2.pic1.2.17" class="ltx_p"><span id="A4.SS1.p2.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Your task</span></span>
<span id="A4.SS1.p2.pic1.2.18" class="ltx_p"><span id="A4.SS1.p2.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">You should identify what the optimizer should pay attention to in order to improve the {optimizer_type} of the pipeline for solving the given task.</span></span>
<span id="A4.SS1.p2.pic1.2.19" class="ltx_p"><span id="A4.SS1.p2.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">Conduct a detailed analysis of the given example, and respond in the following format:</span></span>
<span id="A4.SS1.p2.pic1.2.20" class="ltx_p"><span id="A4.SS1.p2.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">“‘json</span></span>
<span id="A4.SS1.p2.pic1.2.21" class="ltx_p"><span id="A4.SS1.p2.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;improved_task_description&quot;: &quot;…&quot;, # Your improved task description for the optimizer</span></span>
<span id="A4.SS1.p2.pic1.2.22" class="ltx_p"><span id="A4.SS1.p2.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">“‘</span></span>
</span></span></span></foreignobject></g></g></svg>