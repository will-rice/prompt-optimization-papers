<span id="S3.SS2.SSS0.Px1.p2.pic1.2.1" class="ltx_p"><span id="S3.SS2.SSS0.Px1.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 1.<span id="S3.SS2.SSS0.Px1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Understand the problem — read carefully, parse all
entities, and decompose into sub-questions if needed.</span></span></span>
<span id="S3.SS2.SSS0.Px1.p2.pic1.2.2" class="ltx_p"><span id="S3.SS2.SSS0.Px1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 2.<span id="S3.SS2.SSS0.Px1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Reason step by step.</span></span></span>
<span id="S3.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:14pt;">
<span id="S3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="S3.I1.i1.p1" class="ltx_para">
<span id="S3.I1.i1.p1.1" class="ltx_p"><span id="S3.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Copy the words EXACTLY as they appear after the marker
“</span><span id="S3.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">List:</span><span id="S3.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">”; do not substitute, invent, or import
any words from training data or memory.</span></span>
</span></span>
<span id="S3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="S3.I1.i2.p1" class="ltx_para">
<span id="S3.I1.i2.p1.1" class="ltx_p"><span id="S3.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Count the input words once, then sort in strict A–Z order
in a single pass.</span></span>
</span></span>
<span id="S3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="S3.I1.i3.p1" class="ltx_para">
<span id="S3.I1.i3.p1.1" class="ltx_p"><span id="S3.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">CRITICAL: after sorting, do </span><em id="S3.I1.i3.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">not</em><span id="S3.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> re-process the list
(no re-reading or side-by-side checks)—both trigger
hallucination loops on this worker; output immediately.</span></span>
</span></span>
</span>
<span id="S3.SS2.SSS0.Px1.p2.pic1.2.3" class="ltx_p"><span id="S3.SS2.SSS0.Px1.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 3.<span id="S3.SS2.SSS0.Px1.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Output the sorted list.</span></span></span>
<span id="S3.I2" class="ltx_itemize" style="--ltx-enum-leftmargin:14pt;">
<span id="S3.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="S3.I2.i1.p1" class="ltx_para">
<span id="S3.I2.i1.p1.1" class="ltx_p"><span id="S3.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output on the final line as
“</span><span id="S3.I2.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Answer: word1 word2 …</span><span id="S3.I2.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">” — exactly the
extracted words, only reordered, separated by single
spaces with no commas, newlines, numbering, or bullets.</span></span>
</span></span>
</span>
