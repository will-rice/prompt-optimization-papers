<span id="A5.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.93em;">
<span id="A5.SS1.p2.pic1.2.1" class="ltx_p"><span id="A5.SS1.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 1.<span id="A5.SS1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Understand the problem and extract constraints.</span></span></span>
<span id="A5.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:14pt;">
<span id="A5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the required function name from the problem
description or </span><span id="A5.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">assert</span><span id="A5.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> statement (e.g.,
</span><span id="A5.I1.i1.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">assert func_name(…)</span><span id="A5.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">) and ensure your solution
defines a function with this exact name.</span></span>
</span></span>
<span id="A5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Parse the input/output types and specific logic rules
(e.g., “remove characters at odd indices”, “sum of digits
equal to length”) before planning.</span></span>
</span></span>
<span id="A5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I1.i3.p1" class="ltx_para">
<span id="A5.I1.i3.p1.1" class="ltx_p"><span id="A5.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Explicitly map the problem’s specific logical constraints
to a concrete algorithm before coding (e.g., for a magic
square: verify all rows, columns, and diagonals sum to the
same value; for character replacement: iterate through the
string and swap specific target characters).</span></span>
</span></span>
</span>
<span id="A5.SS1.p2.pic1.2.2" class="ltx_p"><span id="A5.SS1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 2.<span id="A5.SS1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Plan and implement the solution in code.</span></span></span>
<span id="A5.I2" class="ltx_itemize" style="--ltx-enum-leftmargin:14pt;">
<span id="A5.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I2.i1.p1" class="ltx_para">
<span id="A5.I2.i1.p1.1" class="ltx_p"><span id="A5.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Write a complete Python function that implements the parsed
logic exactly as described, ignoring any unrelated patterns
from training data.</span></span>
</span></span>
<span id="A5.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I2.i2.p1" class="ltx_para">
<span id="A5.I2.i2.p1.1" class="ltx_p"><span id="A5.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Include the function definition, the logic body, and a test
call using the provided </span><span id="A5.I2.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">assert</span><span id="A5.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> statement to verify
correctness.</span></span>
</span></span>
</span>
<span id="A5.SS1.p2.pic1.2.3" class="ltx_p"><span id="A5.SS1.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 3.<span id="A5.SS1.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Output the final answer.</span></span></span>
<span id="A5.I3" class="ltx_itemize" style="--ltx-enum-leftmargin:14pt;">
<span id="A5.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I3.i1.p1" class="ltx_para">
<span id="A5.I3.i1.p1.1" class="ltx_p"><span id="A5.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the task asks for a function, output the full Python
code block containing the function and the test.</span></span>
</span></span>
<span id="A5.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I3.i2.p1" class="ltx_para">
<span id="A5.I3.i2.p1.1" class="ltx_p"><span id="A5.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output the final result on the last line as
