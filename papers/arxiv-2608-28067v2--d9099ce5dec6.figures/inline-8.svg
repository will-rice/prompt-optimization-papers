<span id="A5.SS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.93em;">
<span id="A5.SS1.p3.pic1.2.1" class="ltx_p"><span id="A5.SS1.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 1.<span id="A5.SS1.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Parse the question and locate the relevant context.</span></span></span>
<span id="A5.I4" class="ltx_itemize" style="--ltx-enum-leftmargin:14pt;">
<span id="A5.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I4.i1.p1" class="ltx_para">
<span id="A5.I4.i1.p1.1" class="ltx_p"><span id="A5.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the key entities and constraints in the question
(e.g., specific dates, titles, roles, locations), then scan
the provided passages for sentences mentioning those exact
entities.</span></span>
</span></span>
</span>
<span id="A5.SS1.p3.pic1.2.2" class="ltx_p"><span id="A5.SS1.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 2.<span id="A5.SS1.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Verify, link, and answer.</span></span></span>
<span id="A5.I5" class="ltx_itemize" style="--ltx-enum-leftmargin:14pt;">
<span id="A5.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i1.p1" class="ltx_para">
<span id="A5.I5.i1.p1.1" class="ltx_p"><span id="A5.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Strictly ground your answer in the provided text; do not use
outside knowledge or hallucinate details not present in the
context.</span></span>
</span></span>
<span id="A5.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i2.p1" class="ltx_para">
<span id="A5.I5.i2.p1.1" class="ltx_p"><span id="A5.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Verify entity matches before extracting attributes: if the
question asks about Entity A, do not extract facts about
Entity B even if they appear in the same passage or share a
category.</span></span>
</span></span>
<span id="A5.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i3.p1" class="ltx_para">
<span id="A5.I5.i3.p1.1" class="ltx_p"><span id="A5.I5.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For multi-hop questions, explicitly trace the chain across
passages (e.g., Entity A in passage 1 to Property B in
passage 2); once the answer is reached, stop reasoning
immediately and do not repeat the same logical loop.</span></span>
</span></span>
</span>
<span id="A5.SS1.p3.pic1.2.3" class="ltx_p"><span id="A5.SS1.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 3.<span id="A5.SS1.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Output the final answer.</span></span></span>
<span id="A5.I6" class="ltx_itemize" style="--ltx-enum-leftmargin:14pt;">
<span id="A5.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I6.i1.p1" class="ltx_para">
<span id="A5.I6.i1.p1.1" class="ltx_p"><span id="A5.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The final line must be exactly “</span><span id="A5.I6.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Answer: (X)</span><span id="A5.I6.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">”
where X is the concise value with no introductory phrases,
explanations, or repetitions of the question.</span></span>
</span></span>
</span>
