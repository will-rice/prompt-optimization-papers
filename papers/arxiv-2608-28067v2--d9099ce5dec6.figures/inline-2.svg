<span id="S4.SS4.SSS0.Px1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="S4.SS4.SSS0.Px1.p2.pic1.1.1" class="ltx_p"><span id="S4.SS4.SSS0.Px1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Audit packet for one <span id="S4.SS4.SSS0.Px1.p2.pic1.1.1.1.1" class="ltx_text ltx_font_smallcaps">Sepo</span> edit (BBH Word Sorting)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 10.09)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:62.92em;--ltx-fo-depth:0.19em;font-size:10pt;" height="873.3" overflow="visible" transform="matrix(1 0 0 -1 0 870.61)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS4.SSS0.Px1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="S4.SS4.SSS0.Px1.p2.pic1.2.1" class="ltx_p"><span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Local target:<span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> <math id="S4.SS4.SSS0.Px1.p2.pic1.m1" class="ltx_Math" alttext="\tau=\texttt{step\,3}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">step 3</mtext></mrow><annotation encoding="application/x-tex">\tau=\texttt{step\,3}</annotation></semantics></math>, the </span>output formatting rule<span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.2" class="ltx_text ltx_font_medium">.
<br class="ltx_break" style="--ltx-break-space:-1.0pt;">
</span>Parent breadcrumb <math id="S4.SS4.SSS0.Px1.p2.pic1.m2" class="ltx_Math" alttext="\ell" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">ℓ</mi><annotation encoding="application/x-tex">\ell</annotation></semantics></math>:<span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> previous edit added count/sort rules under step 2:
<span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.3.1" class="ltx_text">
<span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.3.1.1" class="ltx_inline-block ltx_parbox ltx_align_middle" style="width:400.7pt;--ltx-bg-color:#FFECEC;">
<span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.3.1.1.1" class="ltx_p"><span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.3.1.1.1.1" class="ltx_text ltx_font_bold">Count the input words once, then sort in strict A–Z order in a single pass.</span></span>
</span></span>
<br class="ltx_break">
</span><span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.4" class="ltx_text" style="--ltx-fg-color:#B00020;">Observed side effect:</span><span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.5" class="ltx_text ltx_font_medium"> <math id="S4.SS4.SSS0.Px1.p2.pic1.m3" class="ltx_Math" alttext="+15" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">15</mn></mrow><annotation encoding="application/x-tex">+15</annotation></semantics></math> newly fixed on sorting, but with sorting now reliable the worker </span><span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.6" class="ltx_text" style="--ltx-fg-color:#B00020;">renders output freely without format constraints</span><span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.7" class="ltx_text ltx_font_medium">, </span><span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.8" class="ltx_text" style="--ltx-fg-color:#B00020;">newly breaking 4</span><span id="S4.SS4.SSS0.Px1.p2.pic1.2.1.1.9" class="ltx_text ltx_font_medium"> correctly-sorted cases on format.</span></span></span>
<span id="S4.I5" class="ltx_itemize" style="--ltx-enum-leftmargin:11pt;">
<span id="S4.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="S4.I5.i1.p1" class="ltx_para">
<span id="S4.I5.i1.p1.1" class="ltx_p"><span id="S4.I5.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#B00020;">Newly broken (focus):</span><span id="S4.I5.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S4.I5.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Ex #13</span><span id="S4.I5.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> is </span><span id="S4.I5.i1.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#4A5568;">sorted correctly</span><span id="S4.I5.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> but renders with </span><span id="S4.I5.i1.p1.1.7" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#B00020;">commas</span><span id="S4.I5.i1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">; </span><span id="S4.I5.i1.p1.1.9" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Ex #16</span><span id="S4.I5.i1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> breaks a word onto a </span><span id="S4.I5.i1.p1.1.11" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#B00020;">new line</span><span id="S4.I5.i1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> — both fail the single-line answer.</span></span>
</span></span>
<span id="S4.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="S4.I5.i2.p1" class="ltx_para">
<span id="S4.I5.i2.p1.1" class="ltx_p"><span id="S4.I5.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#22863A;">Anchor kept:</span><span id="S4.I5.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S4.I5.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Ex #17</span><span id="S4.I5.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> — already </span><span id="S4.I5.i2.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#22863A;">correct sort and correct format</span><span id="S4.I5.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, preserved by adding rather than overwriting.</span></span>
</span></span>
<span id="S4.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="S4.I5.i3.p1" class="ltx_para">
<span id="S4.I5.i3.p1.1" class="ltx_p"><span id="S4.I5.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#22863A;">Train probe:</span><span id="S4.I5.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> an independent comma-joined case is </span><span id="S4.I5.i3.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#22863A;">likewise fixed</span><span id="S4.I5.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, so the rule is </span><span id="S4.I5.i3.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#22863A;">not confined</span><span id="S4.I5.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> to focus examples.</span></span>
</span></span>
</span>
<span id="S4.SS4.SSS0.Px1.p2.pic1.2.2" class="ltx_p"><span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Patch on Step 3:<span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> one operation per failure mode.
<br class="ltx_break">
<span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.1" class="ltx_text">
<span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.1.1" class="ltx_inline-block ltx_parbox ltx_align_middle" style="width:400.7pt;--ltx-bg-color:#C2D5F2;">
<span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.1.1.1" class="ltx_p"><math id="S4.SS4.SSS0.Px1.p2.pic1.m4" class="ltx_Math" alttext="\circlearrowright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#C2D5F2;" mathbackground="#C2D5F2" mathcolor="#000000">↻</mo><annotation encoding="application/x-tex">\circlearrowright</annotation></semantics></math> <span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.1.1.1.1" class="ltx_text ltx_font_smallcaps">RewriteStep</span>: rename step 3 to <span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.1.1.1.2" class="ltx_text ltx_font_bold">“Output the sorted list.”</span></span>
</span></span>
<br class="ltx_break">
<span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.2" class="ltx_text">
<span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.2.1" class="ltx_inline-block ltx_parbox ltx_align_middle" style="width:400.7pt;--ltx-bg-color:#E6FFED;">
<span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.2.1.1" class="ltx_p"><math id="S4.SS4.SSS0.Px1.p2.pic1.m5" class="ltx_Math" alttext="+" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6FFED;" mathbackground="#E6FFED" mathcolor="#000000">+</mo><annotation encoding="application/x-tex">+</annotation></semantics></math> <span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.2.1.1.1" class="ltx_text ltx_font_smallcaps">AddRule</span>: output on the final line as <span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.2.1.1.2" class="ltx_text ltx_font_bold">“Answer: word1 word2 …”</span> — exactly the extracted words, only reordered, <span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.2.1.1.3" class="ltx_text ltx_font_bold">separated by single spaces</span> with no commas, newlines, numbering, or bullets (closes <span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.2.1.1.4" class="ltx_text ltx_font_typewriter">Ex#13</span>/<span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.1.2.1.1.5" class="ltx_text ltx_font_typewriter">Ex#16</span>).</span>
</span></span>
<br class="ltx_break">
</span>Operator:<span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> <math id="S4.SS4.SSS0.Px1.p2.pic1.m6" class="ltx_Math" alttext="o(c){=}\{\textsc{RewriteStep},\textsc{AddRule}\}" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_font_smallcaps" mathcolor="#000000">RewriteStep</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_font_smallcaps" mathcolor="#000000">AddRule</mtext></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow></mrow><annotation encoding="application/x-tex">o(c){=}\{\textsc{RewriteStep},\textsc{AddRule}\}</annotation></semantics></math>  </span>Effect:<span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.3" class="ltx_text ltx_font_medium"> <math id="S4.SS4.SSS0.Px1.p2.pic1.m7" class="ltx_Math" alttext="+17" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#22863A;" mathcolor="#22863A">+</mo><mn style="--ltx-fg-color:#22863A;" mathcolor="#22863A">17</mn></mrow><annotation encoding="application/x-tex">+17</annotation></semantics></math></span><span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.4" class="ltx_text" style="--ltx-fg-color:#22863A;"> fixed, <math id="S4.SS4.SSS0.Px1.p2.pic1.m8" class="ltx_Math" alttext="-6" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#22863A;" mathcolor="#22863A">−</mo><mn style="--ltx-fg-color:#22863A;" mathcolor="#22863A">6</mn></mrow><annotation encoding="application/x-tex">-6</annotation></semantics></math> broken</span><span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.5" class="ltx_text ltx_font_medium">, <math id="S4.SS4.SSS0.Px1.p2.pic1.m9" class="ltx_Math" alttext="20{\to}31" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">31</mn></mrow><annotation encoding="application/x-tex">20{\to}31</annotation></semantics></math>, <span id="S4.SS4.SSS0.Px1.p2.pic1.2.2.1.5.1" class="ltx_text" style="--ltx-fg-color:#22863A;">kept</span>.</span></span></span>
</span></span></span></foreignobject></g></g></svg>