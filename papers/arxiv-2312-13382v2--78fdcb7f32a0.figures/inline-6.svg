<span id="A4.SS0.SSS0.Px1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.26em;">
<span id="A4.SS0.SSS0.Px1.p2.pic1.1.1" class="ltx_p"><span id="A4.SS0.SSS0.Px1.p2.pic1.1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Question<span id="A4.SS0.SSS0.Px1.p2.pic1.1.1.1.1" class="ltx_text ltx_font_upright">: What was the name of the treaty that made Hungary a landlocked state which contained the Kolozsvar Ghetto?</span></span></span>
<span id="A4.SS0.SSS0.Px1.p2.pic1.1.2" class="ltx_quote ltx_displayquote">
<span id="A4.SS0.SSS0.Px1.p2.pic1.1.2.1" class="ltx_p"><span id="A4.SS0.SSS0.Px1.p2.pic1.1.2.1.1" class="ltx_text ltx_inline-quote" style="--ltx-fg-color:#000000;"><math id="A4.SS0.SSS0.Px1.p2.pic1.m1" class="ltx_Math" alttext="\mathtt{Compile}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝙲𝚘𝚖𝚙𝚒𝚕𝚎</mi><annotation encoding="application/x-tex">\mathtt{Compile}</annotation></semantics></math> <math id="A4.SS0.SSS0.Px1.p2.pic1.m2" class="ltx_math_unparsed" alttext="\mathtt{w/}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝚠</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo></mrow><annotation encoding="application/x-tex">\mathtt{w/}</annotation></semantics></math> <math id="A4.SS0.SSS0.Px1.p2.pic1.m3" class="ltx_Math" alttext="\mathtt{Assert}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝙰𝚜𝚜𝚎𝚛𝚝</mi><annotation encoding="application/x-tex">\mathtt{Assert}</annotation></semantics></math>: The Treaty of Trianon made Hungary landlocked and led to the existence of the Kolozsvar Ghetto. This lesser-known ghetto was located in Kolozsvár, Kingdom of Hungary (now Cluj-Napoca, Romania).
<math id="A4.SS0.SSS0.Px1.p2.pic1.m4" class="ltx_Math" alttext="\mathtt{C\texttt{+}Infer}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝙲</mi><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">+</mtext><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝙸𝚗𝚏𝚎𝚛</mi></mrow><annotation encoding="application/x-tex">\mathtt{C\texttt{+}Infer}</annotation></semantics></math> <math id="A4.SS0.SSS0.Px1.p2.pic1.m5" class="ltx_math_unparsed" alttext="\mathtt{w/}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝚠</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo></mrow><annotation encoding="application/x-tex">\mathtt{w/}</annotation></semantics></math> <math id="A4.SS0.SSS0.Px1.p2.pic1.m6" class="ltx_Math" alttext="\mathtt{Assert}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝙰𝚜𝚜𝚎𝚛𝚝</mi><annotation encoding="application/x-tex">\mathtt{Assert}</annotation></semantics></math>: The Treaty of Trianon, signed in 1920, reshaped Hungaryś destiny, leading to its landlocked status and the emergence of the Kolozsvar Ghetto. Uncover the gripping tale of this pivotal moment in history and its lasting effects. #HistoryUnveiled</span></span>
</span>
<span id="A4.SS0.SSS0.Px1.p2.pic1.1.3" class="ltx_p"><span id="A4.SS0.SSS0.Px1.p2.pic1.1.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Answer<span id="A4.SS0.SSS0.Px1.p2.pic1.1.3.1.1" class="ltx_text ltx_font_upright">: Treaty of Trianon</span></span></span>
</span></span></span></foreignobject></g></g></svg>