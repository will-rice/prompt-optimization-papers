<span id="S6.F4.pic1.2.1.1.1.1" class="ltx_text ltx_font_italic">You are given a string S of length N consisting of digits from 1 through 9.
For each pair of integers (i,j) \ (1\leq i\leq j\leq N), define f(i, j) as the value obtained by interpreting the substring of S from the i-th through the j-th character as a decimal integer. Find \displaystyle \sum_</span>{<span id="S6.F4.pic1.2.1.1.1.2" class="ltx_text ltx_font_italic">i=1</span>}</span></span><span id="S6.F4.pic1.2.1.2" class="ltx_text">ˆ</span><span id="S6.F4.pic1.2.1.3" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">N \sum_<span id="S6.F4.pic1.2.1.3.1" class="ltx_text ltx_font_upright">{</span>j=i<span id="S6.F4.pic1.2.1.3.2" class="ltx_text ltx_font_upright">}</span></span><span id="S6.F4.pic1.2.1.4" class="ltx_text">ˆ</span><span id="S6.F4.pic1.2.1.5" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">N f(i, j).<span id="S6.F4.pic1.2.1.5.1" class="ltx_text"></span></span></span>
<span id="S6.F4.pic1.2.2" class="ltx_p"><span id="S6.F4.pic1.2.2.1" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Constraints: <span id="S6.F4.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter">1 \leq N \leq 2 \times 10</span></span><span id="S6.F4.pic1.2.2.2" class="ltx_text">ˆ</span><span id="S6.F4.pic1.2.2.3" class="ltx_text ltx_font_typewriter ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">5</span><span id="S6.F4.pic1.2.2.4" class="ltx_text"></span></span>
