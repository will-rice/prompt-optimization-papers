<svg id="A1.pic7" class="ltx_picture ltx_figure_panel" height="543.37" overflow="visible" version="1.1" viewbox="0 0 550 543.37" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,543.37) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 537.47 C 0 540.73 2.64 543.37 5.91 543.37 L 544.09 543.37 C 547.36 543.37 550 540.73 550 537.47 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF9F2;" fill="#FFF9F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 519.26 L 548.03 519.26 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 527.86)"><foreignobject style="--ltx-fo-width:31.84em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="440.58"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.pic7.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.84em;">
<span id="A1.pic7.1.1" class="ltx_p"><span id="A1.pic7.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for Execution-Grounded Evaluator</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:35.43em;--ltx-fo-depth:0.25em;font-size:10pt;" height="493.68" overflow="visible" transform="matrix(1 0 0 -1 0 490.22)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.pic7.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A1.pic7.2.1" class="ltx_p"><span id="A1.pic7.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a strict grader for optimization code. Return ONLY a single JSON object with keys:
score (float in [-1,10]), explanation (string), executed (bool),
<span id="A1.pic7.2.1.1.1" class="ltx_text">constraint_satisfied</span>  (<span id="A1.pic7.2.1.1.2" class="ltx_text">bool</span>), <span id="A1.pic7.2.1.1.3" class="ltx_text">matches_ground_truth</span>  (<span id="A1.pic7.2.1.1.4" class="ltx_text">bool</span>)</span></span>
<span id="A1.pic7.2.2" class="ltx_p"><span id="A1.pic7.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not add any text outside JSON.</span></span>
<span id="A1.pic7.2.3" class="ltx_p"><span id="A1.pic7.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Problem description:
{PROBLEM_DESCRIPTION}</span></span>
<span id="A1.pic7.2.4" class="ltx_p"><span id="A1.pic7.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Execution trace (stdout + stderr):
{EXEC_TRACE}</span></span>
<span id="A1.pic7.2.5" class="ltx_p"><span id="A1.pic7.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">(Optional) Ground-truth numeric answer (if applicable): {GROUND_TRUTH}
Numeric tolerance for matching (absolute): {TOLERANCE}
If a final numeric answer can be extracted from the execution trace, compute |pred - ground_truth|
and set matches_ground_truth = true if the difference is <math id="A1.pic7.m1" class="ltx_Math" alttext="\leq\{TOLERANCE\}" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">O</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">E</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">E</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow></mrow><annotation encoding="application/x-tex">\leq\{TOLERANCE\}</annotation></semantics></math>, else false.</span></span>
<span id="A1.pic7.2.6" class="ltx_p"><span id="A1.pic7.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Scoring rubric:</span></span>
<span id="A1.I4" class="ltx_itemize">
<span id="A1.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I4.i1.p1.1" class="ltx_p"><span id="A1.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the program did not execute (timeout, runtime error, syntax error), set score = -1 and executed=false.</span></span>
</span></span>
<span id="A1.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I4.i2.p1.1" class="ltx_p"><span id="A1.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Otherwise, start from a base score and increase for:
(i) executability and completeness of results,
(ii) constraint satisfaction (feasibility),
(iii) objective quality and plausibility,
(iv) (optional) closeness to ground-truth if provided.</span></span>
</span></span>
<span id="A1.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I4.i3.p1.1" class="ltx_p"><span id="A1.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Keep the final score in [-1, 10].</span></span>
</span></span>
<span id="A1.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i4.p1" class="ltx_para">
<span id="A1.I4.i4.p1.1" class="ltx_p"><span id="A1.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If no meaningful result can be extracted despite successful execution, you may assign a low nonnegative score.</span></span>
</span></span>
</span>
<span id="A1.pic7.2.7" class="ltx_p"><span id="A1.pic7.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return strictly JSON, e.g.:
<br class="ltx_break">{
&quot;score&quot;: 7.5,
<br class="ltx_break">&quot;explanation&quot;: &quot;why&quot;,
<br class="ltx_break">&quot;executed&quot;: true,
<br class="ltx_break"><span id="A1.pic7.2.7.1.1" class="ltx_text ltx_font_typewriter">constraint_satisfied: false,
<br class="ltx_break"><span id="A1.pic7.2.7.1.1.1" class="ltx_text ltx_font_serif">matches_ground_truth: false</span>
<br class="ltx_break"></span>}</span></span>
</span></span></span></foreignobject></g></g></svg>