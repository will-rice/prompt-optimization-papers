<svg id="A1.pic3" class="ltx_picture ltx_centering" height="511.01" overflow="visible" version="1.1" viewbox="0 0 550 511.01" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,511.01) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#009900;" fill="#009900" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 505.11 C 0 508.37 2.64 511.01 5.91 511.01 L 544.09 511.01 C 547.36 511.01 550 508.37 550 505.11 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF9F2;" fill="#FFF9F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 486.9 L 548.03 486.9 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 495.5)"><foreignobject style="--ltx-fo-width:31.84em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="440.58"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.pic3.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.84em;">
<span id="A1.pic3.1.1" class="ltx_p"><span id="A1.pic3.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for Generating a Plan-Step Instruction</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:33.14em;--ltx-fo-depth:0.2em;font-size:10pt;" height="461.32" overflow="visible" transform="matrix(1 0 0 -1 0 458.55)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.pic3.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A1.pic3.2.1" class="ltx_p"><span id="A1.pic3.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert assistant for Python optimization code generation.
Transform a single sentence from an optimization problem into a concise, precise instruction
that another LLM can use to generate Python code with an appropriate optimization library.</span></span>
<span id="A1.pic3.2.2" class="ltx_p"><span id="A1.pic3.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Library consistency:<span id="A1.pic3.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A1.I1" class="ltx_itemize">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If depth = 0: Choose any suitable optimization library (e.g., PuLP, Pyomo, OR-Tools, CVXPY, mip) and stick with it for subsequent steps.</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If depth </span><math id="A1.I1.i2.p1.m1" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math><span id="A1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 0: Reuse the same optimization library already used in prior steps and keep variable names/structure; do not switch libraries.</span></span>
</span></span>
</span>
<span id="A1.pic3.2.3" class="ltx_p"><span id="A1.pic3.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return only the instruction string (no explanations, code, or reasoning).</span></span>
<span id="A1.pic3.2.4" class="ltx_p"><span id="A1.pic3.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">The following is a sentence from an optimization problem:</span></span>
<span id="A1.pic3.2.5" class="ltx_p"><span id="A1.pic3.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;{SENTENCE}&quot;</span></span>
<span id="A1.pic3.2.6" class="ltx_p"><span id="A1.pic3.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">If Intermediate Step:<span id="A1.pic3.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A1.pic3.2.7" class="ltx_p"><span id="A1.pic3.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Write a single, high-quality instruction that directs an LLM to generate or modify Python code to reflect <em id="A1.pic3.2.7.1.1" class="ltx_emph ltx_font_italic">only</em> this sentence
(e.g., define variables, parameters, a constraint, or an objective) using the same optimization library as prior steps.
Do <span id="A1.pic3.2.7.1.2" class="ltx_text ltx_font_bold">not</span> solve the model or print results at this stage; produce only the incremental change for this sentence.
Return only the instruction string.</span></span>
<span id="A1.pic3.2.8" class="ltx_p"><span id="A1.pic3.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">If Final Step:<span id="A1.pic3.2.8.1.1" class="ltx_text"></span></span></span>
<span id="A1.pic3.2.9" class="ltx_p"><span id="A1.pic3.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Write a single, high-quality instruction that directs an LLM to produce a complete, runnable Python program that assembles the entire optimization model using the same optimization library as prior steps.
Import required libraries, define all parameters, variables, objective, and constraints, execute the optimization, and print the final decision variable values and the objective value.
If a single numeric result is requested, also print:
 FINAL_ANSWER: &lt;number&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>