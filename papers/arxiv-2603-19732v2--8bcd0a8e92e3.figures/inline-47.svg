<span id="A5.T55.pic1.1.1" class="ltx_p"><span id="A5.T55.pic1.1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">A car is being driven, in a straight line and at a uniform speed, towards the base of a vertical tower. The top of the tower is observed from the car and, in the process, it takes 10 minutes for the angle of elevation to change from 45° to 60°. After how much more time will this car reach the base of the tower?</span></span>
<span id="A5.T55.pic1.1.2" class="ltx_p"><span id="A5.T55.pic1.1.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Options:</span></span>
