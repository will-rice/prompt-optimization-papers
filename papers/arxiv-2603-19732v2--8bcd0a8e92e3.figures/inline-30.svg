<span id="A5.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I8.i1.p1" class="ltx_para">
<span id="A5.I8.i1.p1.1" class="ltx_p"><span id="A5.I8.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Primary:</span><span id="A5.I8.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Separate the question into distinct information blocks - given parameters in one section, the actual question in another section, and options clearly grouped.</span></span>
</span></span>
<span id="A5.I8.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
