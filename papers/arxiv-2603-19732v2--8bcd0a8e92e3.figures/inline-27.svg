<span id="A5.T35.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.2em;">
<span id="A5.T35.pic1.1.1" class="ltx_p"><span id="A5.T35.pic1.1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Based on the characteristic population curves that result from plotting population growth of a species, the most effective means of controlling the mosquito population is to</span></span>
<span id="A5.T35.pic1.1.2" class="ltx_p"><span id="A5.T35.pic1.1.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Options:</span></span>
<span id="A5.T35.pic1.1.3" class="ltx_p"><span id="A5.T35.pic1.1.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(A) maintain the population at a point corresponding to the midpoint of its logistic curve</span></span>
<span id="A5.T35.pic1.1.4" class="ltx_p"><span id="A5.T35.pic1.1.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(B) opt for zero population control once the K value of the curve has been reached</span></span>
<span id="A5.T35.pic1.1.5" class="ltx_p"><span id="A5.T35.pic1.1.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(C) reduce the carrying capacity of the environment to lower the K value</span></span>
<span id="A5.T35.pic1.1.6" class="ltx_p"><span id="A5.T35.pic1.1.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(D) increase the mortality rate</span></span>
</span></span></span></foreignobject></g></g></svg>