<span id="A5.T19.pic1.1.1" class="ltx_p"><span id="A5.T19.pic1.1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Here comes a perfectly valid argument: Sophie is an infrequent user of Nioxin shampoo. Every owner of a Nexxus shampoo and every infrequent user of Nioxin shampoo is a frequent consumer of Schwarzkopf shampoo. In consequence, Sophie is a frequent consumer of Schwarzkopf shampoo.</span></span>
<span id="A5.T19.pic1.1.2" class="ltx_p"><span id="A5.T19.pic1.1.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Is the argument, given the explicitly stated premises, deductively valid or invalid?</span></span>
<span id="A5.T19.pic1.1.3" class="ltx_p"><span id="A5.T19.pic1.1.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Options:</span></span>
