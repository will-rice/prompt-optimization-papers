<span id="A5.T30.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.2em;">
<span id="A5.T30.pic1.1.1" class="ltx_p"><span id="A5.T30.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Strategy Type:<span id="A5.T30.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Structuring</span></span></span>
<span id="A5.T30.pic1.1.2" class="ltx_p"><span id="A5.T30.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Rules:<span id="A5.T30.pic1.1.2.1.1" class="ltx_text"></span></span></span>
<span id="A5.I6" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A5.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I6.i1.p1" class="ltx_para">
<span id="A5.I6.i1.p1.1" class="ltx_p"><span id="A5.I6.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Primary rule:</span><span id="A5.I6.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Group constraints by type using category headers. Format as “</span><span id="A5.I6.i1.p1.1.3" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Fixed Assignments:</span><span id="A5.I6.i1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">” followed by constraints, then “</span><span id="A5.I6.i1.p1.1.5" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Prohibitions:</span><span id="A5.I6.i1.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">” followed by constraints, then “</span><span id="A5.I6.i1.p1.1.7" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Conditional Rules:</span><span id="A5.I6.i1.p1.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">” followed by constraints.</span></span>
</span></span>
<span id="A5.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I6.i2.p1" class="ltx_para">
<span id="A5.I6.i2.p1.1" class="ltx_p"><span id="A5.I6.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Secondary rule:</span><span id="A5.I6.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Fixed Assignments specify definite requirements (e.g., “Tuesday is the only day George can report”). Prohibitions forbid arrangements (e.g., “Neither Olivia nor Robert can give afternoon reports”). Conditional Rules have if-then structure (e.g., “If Nina gives a report, then Helen and Irving must both give reports the next day”).</span></span>
</span></span>
<span id="A5.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I6.i3.p1" class="ltx_para">
<span id="A5.I6.i3.p1.1" class="ltx_p"><span id="A5.I6.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Preservation rule:</span><span id="A5.I6.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Keep all constraint text verbatim. Do not paraphrase or modify context or options. Only add category headers.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>