<svg id="A5.T56.pic1" class="ltx_picture" height="278.28" overflow="visible" version="1.1" viewbox="0 0 477.38 278.28" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,278.28) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#606060;" fill="#606060" fill-opacity="1.0"><path style="stroke:none" d="M 0 9.95 L 0 268.33 C 0 273.83 4.45 278.28 9.95 278.28 L 467.43 278.28 C 472.92 278.28 477.38 273.83 477.38 268.33 L 477.38 9.95 C 477.38 4.45 472.92 0 467.43 0 L 9.95 0 C 4.45 0 0 4.45 0 9.95 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 2.08 9.95 L 2.08 268.33 C 2.08 272.68 5.6 276.21 9.95 276.21 L 467.43 276.21 C 471.78 276.21 475.3 272.68 475.3 268.33 L 475.3 9.95 C 475.3 5.6 471.78 2.08 467.43 2.08 L 9.95 2.08 C 5.6 2.08 2.08 5.6 2.08 9.95 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 19.85 20.2)"><foreignobject style="--ltx-fo-width:34.2em;--ltx-fo-height:17.42em;--ltx-fo-depth:0.23em;font-size:10pt;" height="244.12" overflow="visible" transform="matrix(1 0 0 -1 0 241.01)" width="473.23"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T56.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.2em;">
<span id="A5.T56.pic1.1.1" class="ltx_p"><span id="A5.T56.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Let:<span id="A5.T56.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> <math id="A5.T56.pic1.m1" class="ltx_Math" alttext="\theta_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">\theta_{1}</annotation></semantics></math> = 45° (initial angle of elevation), <math id="A5.T56.pic1.m2" class="ltx_Math" alttext="\theta_{2}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><annotation encoding="application/x-tex">\theta_{2}</annotation></semantics></math> = 60° (final angle of elevation), <math id="A5.T56.pic1.m3" class="ltx_Math" alttext="t_{12}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn></msub><annotation encoding="application/x-tex">t_{12}</annotation></semantics></math> = 10 minutes (time taken for angle change)</span></span></span>
<span id="A5.T56.pic1.1.2" class="ltx_p"><span id="A5.T56.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Find:<span id="A5.T56.pic1.1.2.1.1" class="ltx_text ltx_font_medium"> <math id="A5.T56.pic1.m4" class="ltx_Math" alttext="t_{b}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi></msub><annotation encoding="application/x-tex">t_{b}</annotation></semantics></math> (time remaining for the car to reach the base of the tower)</span></span></span>
<span id="A5.T56.pic1.1.3" class="ltx_p"><span id="A5.T56.pic1.1.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">A car is being driven, in a straight line and at a uniform speed, towards the base of a vertical tower. The top of the tower is observed from the car and, in the process, it takes 10 minutes for the angle of elevation to change from 45° to 60°. After how much more time will this car reach the base of the tower?</span></span>
<span id="A5.T56.pic1.1.4" class="ltx_p"><span id="A5.T56.pic1.1.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Options:</span></span>
<span id="A5.T56.pic1.1.5" class="ltx_p"><span id="A5.T56.pic1.1.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(A) 5(<math id="A5.T56.pic1.m5" class="ltx_Math" alttext="\sqrt{3}" display="inline" intent=":literal"><semantics><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msqrt><annotation encoding="application/x-tex">\sqrt{3}</annotation></semantics></math> + 1)</span></span>
<span id="A5.T56.pic1.1.6" class="ltx_p"><span id="A5.T56.pic1.1.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(B) 6(<math id="A5.T56.pic1.m6" class="ltx_Math" alttext="\sqrt{3}" display="inline" intent=":literal"><semantics><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msqrt><annotation encoding="application/x-tex">\sqrt{3}</annotation></semantics></math> + <math id="A5.T56.pic1.m7" class="ltx_Math" alttext="\sqrt{2}" display="inline" intent=":literal"><semantics><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msqrt><annotation encoding="application/x-tex">\sqrt{2}</annotation></semantics></math>)</span></span>
<span id="A5.T56.pic1.1.7" class="ltx_p"><span id="A5.T56.pic1.1.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(C) 7(<math id="A5.T56.pic1.m8" class="ltx_Math" alttext="\sqrt{3}" display="inline" intent=":literal"><semantics><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msqrt><annotation encoding="application/x-tex">\sqrt{3}</annotation></semantics></math> – 1)</span></span>
<span id="A5.T56.pic1.1.8" class="ltx_p"><span id="A5.T56.pic1.1.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(D) 8(<math id="A5.T56.pic1.m9" class="ltx_Math" alttext="\sqrt{3}" display="inline" intent=":literal"><semantics><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msqrt><annotation encoding="application/x-tex">\sqrt{3}</annotation></semantics></math> – 2)</span></span>
<span id="A5.T56.pic1.1.9" class="ltx_p"><span id="A5.T56.pic1.1.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(E) None of these</span></span>
</span></span></span></foreignobject></g></g></svg>