<span id="A5.T44.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.2em;">
<span id="A5.T44.pic1.1.1" class="ltx_p"><span id="A5.T44.pic1.1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">This is a hierarchy of effects or sequential model used to explain how advertising works: (Developed by E. St. Elmo Lewis, 1898)</span></span>
<span id="A5.T44.pic1.1.2" class="ltx_p"><span id="A5.T44.pic1.1.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Options:</span></span>
<span id="A5.T44.pic1.1.3" class="ltx_p"><span id="A5.T44.pic1.1.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(A) ADD (focuses on attention deficit)</span></span>
<span id="A5.T44.pic1.1.4" class="ltx_p"><span id="A5.T44.pic1.1.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(B) AIDA (focuses on sequential stages: Attention → Interest → Desire → Action)</span></span>
<span id="A5.T44.pic1.1.5" class="ltx_p"><span id="A5.T44.pic1.1.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">(C) PESTLE (environmental analysis framework)</span></span>
