<svg id="A5.T37.pic1" class="ltx_picture" height="377.32" overflow="visible" version="1.1" viewbox="0 0 477.38 377.32" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,377.32) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#0000BF;" fill="#0000BF" fill-opacity="1.0"><path style="stroke:none" d="M 0 9.95 L 0 367.37 C 0 372.87 4.45 377.32 9.95 377.32 L 467.43 377.32 C 472.92 377.32 477.38 372.87 477.38 367.37 L 477.38 9.95 C 477.38 4.45 472.92 0 467.43 0 L 9.95 0 C 4.45 0 0 4.45 0 9.95 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 2.08 9.95 L 2.08 367.37 C 2.08 371.72 5.6 375.25 9.95 375.25 L 467.43 375.25 C 471.78 375.25 475.3 371.72 475.3 367.37 L 475.3 9.95 C 475.3 5.6 471.78 2.08 467.43 2.08 L 9.95 2.08 C 5.6 2.08 2.08 5.6 2.08 9.95 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 19.85 19.5)"><foreignobject style="--ltx-fo-width:34.2em;--ltx-fo-height:24.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="343.16" overflow="visible" transform="matrix(1 0 0 -1 0 340.74)" width="473.23"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T37.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.2em;">
<span id="A5.T37.pic1.1.1" class="ltx_p"><span id="A5.T37.pic1.1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">To solve electrical engineering problems presented in structured format:</span></span>
<span id="A5.T37.pic1.1.2" class="ltx_p"><span id="A5.T37.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">1. Extract Information from Structure:<span id="A5.T37.pic1.1.2.1.1" class="ltx_text ltx_font_medium"> Given parameters are listed with labels and units (e.g., “Input voltage: 110 V”). Question is stated separately after parameters. Options are grouped clearly. For knowledge questions without parameters, structure remains simple.</span></span></span>
<span id="A5.T37.pic1.1.3" class="ltx_p"><span id="A5.T37.pic1.1.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">2. Identify Problem Type:<span id="A5.T37.pic1.1.3.1.1" class="ltx_text ltx_font_medium"> Knowledge-based (Definitions, properties, standard practices) or Calculation-based (Circuit analysis, formula application).</span></span></span>
<span id="A5.T37.pic1.1.4" class="ltx_p"><span id="A5.T37.pic1.1.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">3. For Knowledge Questions:<span id="A5.T37.pic1.1.4.1.1" class="ltx_text ltx_font_medium"> Focus on technical terms (often highlighted). Recall fundamental EE concepts. Use elimination for uncertain options.</span></span></span>
<span id="A5.T37.pic1.1.5" class="ltx_p"><span id="A5.T37.pic1.1.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">4. For Calculation Questions:<span id="A5.T37.pic1.1.5.1.1" class="ltx_text ltx_font_medium"> Identify circuit type from given parameters. Match to relevant formula. Substitute values (already organized with units). Convert if needed: mA<math id="A5.T37.pic1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math>A, k<math id="A5.T37.pic1.m2" class="ltx_Math" alttext="\Omega" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Ω</mi><annotation encoding="application/x-tex">\Omega</annotation></semantics></math><math id="A5.T37.pic1.m3" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><math id="A5.T37.pic1.m4" class="ltx_Math" alttext="\Omega" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Ω</mi><annotation encoding="application/x-tex">\Omega</annotation></semantics></math>, <math id="A5.T37.pic1.m5" class="ltx_Math" alttext="\mu" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">μ</mi><annotation encoding="application/x-tex">\mu</annotation></semantics></math>F<math id="A5.T37.pic1.m6" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math>F.</span></span></span>
<span id="A5.T37.pic1.1.6" class="ltx_p"><span id="A5.T37.pic1.1.6.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">5. Key Formulas:<span id="A5.T37.pic1.1.6.1.1" class="ltx_text ltx_font_medium"> Ohm’s Law (V = IR), Power (P = VI = I²R = V²/R), Duty cycle step-up (D = 1 - V_in/V_out), Reactance (X_C = 1/(2<math id="A5.T37.pic1.m7" class="ltx_Math" alttext="\pi" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><annotation encoding="application/x-tex">\pi</annotation></semantics></math>fC), X_L = 2<math id="A5.T37.pic1.m8" class="ltx_Math" alttext="\pi" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><annotation encoding="application/x-tex">\pi</annotation></semantics></math>fL), Time constant (<math id="A5.T37.pic1.m9" class="ltx_Math" alttext="\tau" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><annotation encoding="application/x-tex">\tau</annotation></semantics></math>_RC = RC, <math id="A5.T37.pic1.m10" class="ltx_Math" alttext="\tau" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><annotation encoding="application/x-tex">\tau</annotation></semantics></math>_RL = L/R).</span></span></span>
<span id="A5.T37.pic1.1.7" class="ltx_p"><span id="A5.T37.pic1.1.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Now solve step by step and give the correct answer.</span></span>
</span></span></span></foreignobject></g></g></svg>