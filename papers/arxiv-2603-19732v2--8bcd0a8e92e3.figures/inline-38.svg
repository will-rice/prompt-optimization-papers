<span id="A5.T46.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.2em;">
<span id="A5.T46.pic1.1.1" class="ltx_p"><span id="A5.T46.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Strategy Type:<span id="A5.T46.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Structuring</span></span></span>
<span id="A5.T46.pic1.1.2" class="ltx_p"><span id="A5.T46.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Rules:<span id="A5.T46.pic1.1.2.1.1" class="ltx_text"></span></span></span>
<span id="A5.I10" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A5.I10.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I10.i1.p1" class="ltx_para">
<span id="A5.I10.i1.p1.1" class="ltx_p"><span id="A5.I10.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Primary:</span><span id="A5.I10.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Extract and present document metadata (type, author, date, context) at the beginning, followed by key quoted evidence from the source, then the question with explicit type labeling.</span></span>
</span></span>
<span id="A5.I10.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I10.i2.p1" class="ltx_para">
<span id="A5.I10.i2.p1.1" class="ltx_p"><span id="A5.I10.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Secondary:</span><span id="A5.I10.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Organize long source documents into “</span><span id="A5.I10.i2.p1.1.3" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Document Overview</span><span id="A5.I10.i2.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">” (metadata) and “</span><span id="A5.I10.i2.p1.1.5" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Key Evidence</span><span id="A5.I10.i2.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">” (2-3 critical quotes) sections to reduce information overload.</span></span>
</span></span>
<span id="A5.I10.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I10.i3.p1" class="ltx_para">
<span id="A5.I10.i3.p1.1" class="ltx_p"><span id="A5.I10.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Preservation:</span><span id="A5.I10.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Maintain all original source text, questions, and options exactly as given; only reorganize structure without changing any wording.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>