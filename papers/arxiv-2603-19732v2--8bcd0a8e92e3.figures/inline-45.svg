<span id="A5.T53.pic1.1.1" class="ltx_p"><span id="A5.T53.pic1.1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are solving a math multiple-choice problem. Follow these steps systematically to maximize accuracy.</span></span>
<span id="A5.T53.pic1.1.2" class="ltx_p"><span id="A5.T53.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 1:<span id="A5.T53.pic1.1.2.1.1" class="ltx_text ltx_font_medium"> Extract Key Information - Identify all given numbers, variables, relationships, and constraints from the problem. List them explicitly.</span></span></span>
<span id="A5.T53.pic1.1.3" class="ltx_p"><span id="A5.T53.pic1.1.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 2:<span id="A5.T53.pic1.1.3.1.1" class="ltx_text ltx_font_medium"> Determine Problem Type - Classify the problem: arithmetic, algebra, geometry, probability, number theory, or word problem with rates/ratios.</span></span></span>
<span id="A5.T53.pic1.1.4" class="ltx_p"><span id="A5.T53.pic1.1.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 3:<span id="A5.T53.pic1.1.4.1.1" class="ltx_text ltx_font_medium"> Set Up the Solution Framework - Based on the problem type, establish the appropriate equation, formula, or logical approach before calculating.</span></span></span>
<span id="A5.T53.pic1.1.5" class="ltx_p"><span id="A5.T53.pic1.1.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 4:<span id="A5.T53.pic1.1.5.1.1" class="ltx_text ltx_font_medium"> Execute Calculations Carefully - Perform step-by-step calculations. Show intermediate results. Double-check arithmetic operations.</span></span></span>
<span id="A5.T53.pic1.1.6" class="ltx_p"><span id="A5.T53.pic1.1.6.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 5:<span id="A5.T53.pic1.1.6.1.1" class="ltx_text ltx_font_medium"> Verify Against Constraints - Confirm your answer satisfies all conditions stated in the problem. Check units and reasonableness.</span></span></span>
<span id="A5.T53.pic1.1.7" class="ltx_p"><span id="A5.T53.pic1.1.7.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 6:<span id="A5.T53.pic1.1.7.1.1" class="ltx_text ltx_font_medium"> Match with Options - Compare your calculated result with the given options (A-E). If no exact match, identify the closest or re-examine your work.</span></span></span>
<span id="A5.T53.pic1.1.8" class="ltx_p"><span id="A5.T53.pic1.1.8.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 7:<span id="A5.T53.pic1.1.8.1.1" class="ltx_text ltx_font_medium"> Eliminate and Confirm - Rule out options that violate constraints or produce impossible values. Verify your final choice is mathematically sound.</span></span></span>
