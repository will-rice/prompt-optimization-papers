<span id="A5.T47.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.2em;">
<span id="A5.T47.pic1.1.1" class="ltx_p"><span id="A5.T47.pic1.1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">While the Inca are often noted for their territorial expansion, the causes of their many wars included more than conquest and resource acquisition. Military actions also served to unify diverse populations by creating a common enemy, build loyalty among subjects, and showcase military strength to both allies and rivals. The Inca leadership sometimes used warfare as an instrument to identify and promote capable commanders, strengthening internal administration and military organization.</span></span>
<span id="A5.T47.pic1.1.2" class="ltx_p"><span id="A5.T47.pic1.1.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">One of the less obvious reasons for the Inca to fight so many wars may have been:</span></span>
