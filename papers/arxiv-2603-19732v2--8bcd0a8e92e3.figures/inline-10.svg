<svg id="A5.T18.pic1" class="ltx_picture" height="354.04" overflow="visible" version="1.1" viewbox="0 0 477.38 354.04" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,354.04) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#00BF00;" fill="#00BF00" fill-opacity="1.0"><path style="stroke:none" d="M 0 9.95 L 0 344.09 C 0 349.59 4.45 354.04 9.95 354.04 L 467.43 354.04 C 472.92 354.04 477.38 349.59 477.38 344.09 L 477.38 9.95 C 477.38 4.45 472.92 0 467.43 0 L 9.95 0 C 4.45 0 0 4.45 0 9.95 Z" /></g><g style="--ltx-fill-color:#F2FFF2;" fill="#F2FFF2" fill-opacity="1.0"><path style="stroke:none" d="M 2.08 9.95 L 2.08 344.09 C 2.08 348.44 5.6 351.97 9.95 351.97 L 467.43 351.97 C 471.78 351.97 475.3 348.44 475.3 344.09 L 475.3 9.95 C 475.3 5.6 471.78 2.08 467.43 2.08 L 9.95 2.08 C 5.6 2.08 2.08 5.6 2.08 9.95 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 19.85 271.34)"><foreignobject style="--ltx-fo-width:34.2em;--ltx-fo-height:4.74em;--ltx-fo-depth:18.38em;font-size:10pt;" height="319.88" overflow="visible" transform="matrix(1 0 0 -1 0 65.62)" width="473.23"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T18.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.2em;">
<span id="A5.T18.pic1.1.1" class="ltx_p"><span id="A5.T18.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Strategy Type:<span id="A5.T18.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Structuring</span></span></span>
<span id="A5.T18.pic1.1.2" class="ltx_p"><span id="A5.T18.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Rules:<span id="A5.T18.pic1.1.2.1.1" class="ltx_text"></span></span></span>
<span id="A5.I3" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A5.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I3.i1.p1" class="ltx_para">
<span id="A5.I3.i1.p1.1" class="ltx_p"><span id="A5.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Primary rule:</span><span id="A5.I3.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Remove all introductory preambles (e.g., “Here comes a perfectly valid argument”, “It is not always easy to…”) and restructure the argument with clear labels.</span></span>
</span></span>
<span id="A5.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I3.i2.p1" class="ltx_para">
<span id="A5.I3.i2.p1.1" class="ltx_p"><span id="A5.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Secondary rule:</span><span id="A5.I3.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Use “</span><span id="A5.I3.i2.p1.1.3" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Premises:</span><span id="A5.I3.i2.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">” and “</span><span id="A5.I3.i2.p1.1.5" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Conclusion:</span><span id="A5.I3.i2.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">” labels to explicitly separate logical components, with each premise on a new line.</span></span>
</span></span>
<span id="A5.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I3.i3.p1" class="ltx_para">
<span id="A5.I3.i3.p1.1" class="ltx_p"><span id="A5.I3.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Preservation rule:</span><span id="A5.I3.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Keep all original wording of premises and conclusion exactly as stated, only adding structural labels and line breaks.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>