<span id="A5.T36.pic1.1.2" class="ltx_p"><span id="A5.T36.pic1.1.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Based on the characteristic population curves that result from plotting population growth of a species, the most effective means of controlling the mosquito population is to</span></span>
