<span id="A5.T54.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.2em;">
<span id="A5.T54.pic1.1.1" class="ltx_p"><span id="A5.T54.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Strategy Type:<span id="A5.T54.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Structuring</span></span></span>
<span id="A5.T54.pic1.1.2" class="ltx_p"><span id="A5.T54.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Rules:<span id="A5.T54.pic1.1.2.1.1" class="ltx_text"></span></span></span>
<span id="A5.I12" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A5.I12.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I12.i1.p1" class="ltx_para">
<span id="A5.I12.i1.p1.1" class="ltx_p"><span id="A5.I12.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Primary rule:</span><span id="A5.I12.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Extract all numerical values from the question and assign them meaningful variable names at the start. Format: “Let: v = 60 km/hr, t = 9 sec, n = 5 items”. Use intuitive variable names (v for velocity, t for time, r for rate, p for price, n for count, etc.). Place this “Let:” line before the question text.</span></span>
</span></span>
<span id="A5.I12.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I12.i2.p1" class="ltx_para">
<span id="A5.I12.i2.p1.1" class="ltx_p"><span id="A5.I12.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Secondary rule:</span><span id="A5.I12.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Add a “Find:” line to explicitly state what needs to be calculated. Format: “Find: L (length of train)” or “Find: T (total time)”. Use a descriptive variable name with explanation in parentheses.</span></span>
</span></span>
<span id="A5.I12.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I12.i3.p1" class="ltx_para">
<span id="A5.I12.i3.p1.1" class="ltx_p"><span id="A5.I12.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Preservation rule:</span><span id="A5.I12.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Keep the original question text completely intact after the variable extraction. Do not modify any numbers, wording, or option values in the original content.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>