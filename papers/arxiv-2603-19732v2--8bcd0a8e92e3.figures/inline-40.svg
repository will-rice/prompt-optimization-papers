<span id="A5.T48.pic1.1.3" class="ltx_p"><span id="A5.T48.pic1.1.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">• Type: Historical summary</span></span>
<span id="A5.T48.pic1.1.4" class="ltx_p"><span id="A5.T48.pic1.1.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">• Author: Modern historian specializing in Inca Empire</span></span>
<span id="A5.T48.pic1.1.5" class="ltx_p"><span id="A5.T48.pic1.1.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">• Historical Context: The Inca Empire (c. 1438–1533 CE)</span></span>
<span id="A5.T48.pic1.1.6" class="ltx_p"><span id="A5.T48.pic1.1.6.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Key Evidence:<span id="A5.T48.pic1.1.6.1.1" class="ltx_text"></span></span></span>
<span id="A5.T48.pic1.1.7" class="ltx_p"><span id="A5.T48.pic1.1.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">“While the Inca are often noted for their territorial expansion, the causes of their many wars included more than conquest and resource acquisition. Military actions also served to unify diverse populations by creating a common enemy, build loyalty among subjects, and showcase military strength to both allies and rivals.”</span></span>
<span id="A5.T48.pic1.1.8" class="ltx_p"><span id="A5.T48.pic1.1.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">“The Inca leadership sometimes used warfare as an instrument to identify and promote capable commanders, strengthening internal administration and military organization.”</span></span>
<span id="A5.T48.pic1.1.9" class="ltx_p"><span id="A5.T48.pic1.1.9.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">=== QUESTION ===<span id="A5.T48.pic1.1.9.1.1" class="ltx_text"></span></span></span>
