<span id="A5.T48.pic1.1.11" class="ltx_p"><span id="A5.T48.pic1.1.11.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">One of the less obvious reasons for the Inca to fight so many wars may have been:</span></span>
