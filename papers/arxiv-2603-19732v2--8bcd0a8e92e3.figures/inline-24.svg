<span id="A5.T32.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.2em;">
<span id="A5.T32.pic1.1.1" class="ltx_p"><span id="A5.T32.pic1.1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Of the eight students—George, Helen, Irving, Kyle, Lenore, Nina, Olivia, and Robert—in a seminar, exactly six will give individual oral reports during three consecutive days—Monday, Tuesday, and Wednesday. Exactly two reports will be given each day—one in the morning and one in the afternoon—according to the following conditions:</span></span>
<span id="A5.T32.pic1.1.2" class="ltx_p"><span id="A5.T32.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Fixed Assignments:<span id="A5.T32.pic1.1.2.1.1" class="ltx_text"></span></span></span>
<span id="A5.T32.pic1.1.3" class="ltx_p"><span id="A5.T32.pic1.1.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">• Tuesday is the only day on which George can give a report.</span></span>
<span id="A5.T32.pic1.1.4" class="ltx_p"><span id="A5.T32.pic1.1.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Prohibitions:<span id="A5.T32.pic1.1.4.1.1" class="ltx_text"></span></span></span>
<span id="A5.T32.pic1.1.5" class="ltx_p"><span id="A5.T32.pic1.1.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">• Neither Olivia nor Robert can give an afternoon report.</span></span>
<span id="A5.T32.pic1.1.6" class="ltx_p"><span id="A5.T32.pic1.1.6.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Conditional Rules:<span id="A5.T32.pic1.1.6.1.1" class="ltx_text"></span></span></span>
<span id="A5.T32.pic1.1.7" class="ltx_p"><span id="A5.T32.pic1.1.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">• If Nina gives a report, then on the next day Helen and Irving must both give reports, unless Nina’s report is given on Wednesday.</span></span>
<span id="A5.T32.pic1.1.8" class="ltx_p"><span id="A5.T32.pic1.1.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Which one of the following is a pair of students who, if they give reports on the same day as each other, must give reports on Wednesday?</span></span>
<span id="A5.T32.pic1.1.9" class="ltx_p"><span id="A5.T32.pic1.1.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Options:
…</span></span>
