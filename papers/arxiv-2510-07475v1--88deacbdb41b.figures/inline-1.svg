</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:22.29em;--ltx-fo-depth:0em;font-size:10pt;" height="308.49" overflow="visible" transform="matrix(1 0 0 -1 0 308.49)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.F4.pic1.2.1" class="ltx_p"><span id="A4.F4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">node_header:
<br class="ltx_break"><span id="A4.F4.pic1.2.1.1.1" class="ltx_text ltx_font_medium">You are a *reward model* for evaluating the competence, clarity of candidate **role prompts**.
<br class="ltx_break">Based on the input, output and prefernece examples,
<br class="ltx_break">you should first rank the candidate prompts with the good and bad examples,
<br class="ltx_break">Then you will give each a distinct two-decimal quality score between (0.00, 1.00) based on the standard and alignment with the good examples.
<br class="ltx_break">You should be severely harsh and the score difference should be ranged from 0.4 - 0.8 and each differs more than 0.05 with each other.
<br class="ltx_break">Finally, return exactly a score each line corresponding to the **prompt’s original position**. (Not the sorted score)
<br class="ltx_break">Note that your output should contain only the numeric scores (e.g., 0.62). Nothing else.
<br class="ltx_break" style="--ltx-break-space:6.0pt;"></span></span></span>
<span id="A4.F4.pic1.2.2" class="ltx_p"><span id="A4.F4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">agent_reward_prefix:
<br class="ltx_break"><span id="A4.F4.pic1.2.2.1.1" class="ltx_text ltx_font_medium">You are an evaluation LLM. Given {input} and the agent’s response {output}, rate how well the response accomplishes the agent’s role on a scale 0–1 (higher is better).Use the preference demonstrations below as reference.Return ONLY the floating-point score.
<br class="ltx_break" style="--ltx-break-space:3.0pt;">
=== Preference Demonstrations ===
<br class="ltx_break">{demo}  
<br class="ltx_break">=== End Demonstrations ===</span></span></span>
</span></span></span></foreignobject></g></g></svg>