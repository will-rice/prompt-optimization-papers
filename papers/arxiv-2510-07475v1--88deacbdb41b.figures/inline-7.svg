<svg id="A4.F8.pic1" class="ltx_picture ltx_centering" height="806.51" overflow="visible" version="1.1" viewbox="0 0 653.15 806.51" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,806.51) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#863900;" fill="#863900" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 800.6 C 0 803.86 2.64 806.51 5.91 806.51 L 647.24 806.51 C 650.51 806.51 653.15 803.86 653.15 800.6 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FBF6F2;" fill="#FBF6F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 782.4 L 651.18 782.4 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 790.99)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.F8.pic1.1.1" class="ltx_p"><span id="A4.F8.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Math Prompts and Notes</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:54.45em;--ltx-fo-depth:0.25em;font-size:10pt;" height="756.82" overflow="visible" transform="matrix(1 0 0 -1 0 753.36)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.F8.pic1.2.1" class="ltx_p"><span id="A4.F8.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">raw:
<br class="ltx_break"><span id="A4.F8.pic1.2.1.1.1" class="ltx_text ltx_font_medium">You are a competition mathematician. Solve the problem with clear step-by-step reasoning, using exact symbolic forms (prefer fractions to decimals when appropriate).
End with a single final line: <math id="A4.F8.pic1.m1" class="ltx_Math" alttext="\boxed{\langle answer\rangle}" display="inline" intent=":literal"><semantics><menclose notation="box"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟨</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟩</mo></mrow></menclose><annotation encoding="application/x-tex">\boxed{\langle answer\rangle}</annotation></semantics></math>. Follow </span>note<span id="A4.F8.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> exactly.</span></span></span>
<span id="A4.F8.pic1.2.2" class="ltx_p"><span id="A4.F8.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">cot:
<br class="ltx_break"><span id="A4.F8.pic1.2.2.1.1" class="ltx_text ltx_font_medium">First think step by step <em id="A4.F8.pic1.2.2.1.1.1" class="ltx_emph ltx_font_italic">silently</em> (do not print your thoughts); then present a concise, logically ordered solution.
Use exact forms; avoid decimals unless requested. End with the single final line: <math id="A4.F8.pic1.m2" class="ltx_Math" alttext="\boxed{\langle answer\rangle}" display="inline" intent=":literal"><semantics><menclose notation="box"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟨</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟩</mo></mrow></menclose><annotation encoding="application/x-tex">\boxed{\langle answer\rangle}</annotation></semantics></math>.
Follow </span>note<span id="A4.F8.pic1.2.2.1.2" class="ltx_text ltx_font_medium">.</span></span></span>
<span id="A4.F8.pic1.2.3" class="ltx_p"><span id="A4.F8.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">react:
<br class="ltx_break"><span id="A4.F8.pic1.2.3.1.1" class="ltx_text ltx_font_medium">Analyze the problem and form a plan <em id="A4.F8.pic1.2.3.1.1.1" class="ltx_emph ltx_font_italic">silently</em> (do not print it); then present a full worked solution with clear steps and exact forms.
If <span id="A4.F8.pic1.2.3.1.1.2" class="ltx_text ltx_font_typewriter">FEEDBACK</span> is provided, revise the solution only when it is correct and improves adherence to </span>note<span id="A4.F8.pic1.2.3.1.2" class="ltx_text ltx_font_medium">; otherwise keep the best prior solution.
Finish with the final line: <math id="A4.F8.pic1.m3" class="ltx_Math" alttext="\boxed{\langle answer\rangle}" display="inline" intent=":literal"><semantics><menclose notation="box"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟨</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟩</mo></mrow></menclose><annotation encoding="application/x-tex">\boxed{\langle answer\rangle}</annotation></semantics></math>.</span></span></span>
<span id="A4.F8.pic1.2.4" class="ltx_p"><span id="A4.F8.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">reflect:
<br class="ltx_break"><span id="A4.F8.pic1.2.4.1.1" class="ltx_text ltx_font_medium">You are a competition-math </span>critic<span id="A4.F8.pic1.2.4.1.2" class="ltx_text ltx_font_medium">. Assess the submitted solution on:
<br class="ltx_break">1) Mathematical correctness of the result and reasoning.
<br class="ltx_break">2) Output formatting (final line exactly boxed).
<br class="ltx_break">3) Adherence to all constraints in </span>note<span id="A4.F8.pic1.2.4.1.3" class="ltx_text ltx_font_medium">.
<br class="ltx_break">If everything is correct, reply </span>exactly<span id="A4.F8.pic1.2.4.1.4" class="ltx_text ltx_font_medium">: <span id="A4.F8.pic1.2.4.1.4.1" class="ltx_text ltx_font_typewriter">ACCEPT
<br class="ltx_break"></span>Otherwise, reply </span>exactly<span id="A4.F8.pic1.2.4.1.5" class="ltx_text ltx_font_medium">: <span id="A4.F8.pic1.2.4.1.5.1" class="ltx_text ltx_font_typewriter">REVISE: &lt;concise, actionable fixes required&gt;
<br class="ltx_break"></span>Do not include any extra text beyond the required format.</span></span></span>
<span id="A4.F8.pic1.2.5" class="ltx_p"><span id="A4.F8.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">note:
<br class="ltx_break"><span id="A4.F8.pic1.2.5.1.1" class="ltx_text ltx_font_medium ltx_font_italic">MATH Canonicalization (Top Priority)
<br class="ltx_break"><span id="A4.F8.pic1.2.5.1.1.1" class="ltx_text ltx_font_upright">1) Final line only: <math id="A4.F8.pic1.m4" class="ltx_Math" alttext="\boxed{\langle answer\rangle}" display="inline" intent=":literal"><semantics><menclose notation="box"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟨</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟩</mo></mrow></menclose><annotation encoding="application/x-tex">\boxed{\langle answer\rangle}</annotation></semantics></math>.
<br class="ltx_break">2) Exact forms: reduce <math id="A4.F8.pic1.m5" class="ltx_Math" alttext="a/b" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi></mrow><annotation encoding="application/x-tex">a/b</annotation></semantics></math>; simplify radicals; use <math id="A4.F8.pic1.m6" class="ltx_Math" alttext="\pi" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><annotation encoding="application/x-tex">\pi</annotation></semantics></math>; avoid decimals unless asked.
<br class="ltx_break">3) Numbers: no commas anywhere (9901 not 9,901; <math id="A4.F8.pic1.m7" class="ltx_Math" alttext="448/15625" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">448</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">15625</mn></mrow><annotation encoding="application/x-tex">448/15625</annotation></semantics></math> not <math id="A4.F8.pic1.m8" class="ltx_Math" alttext="2{,}240/78{,}125" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2,240</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">78,125</mn></mrow><annotation encoding="application/x-tex">2{,}240/78{,}125</annotation></semantics></math>).
<br class="ltx_break">4) Expressions: canonical, no spaces, use <code id="A4.F8.pic1.2.5.1.1.1.1" class="ltx_verbatim ltx_font_typewriter">^</code> for exponents (<math id="A4.F8.pic1.m9" class="ltx_Math" alttext="x^{3}+3x-6" display="inline" intent=":literal"><semantics><mrow><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6</mn></mrow><annotation encoding="application/x-tex">x^{3}+3x-6</annotation></semantics></math>). Do not prepend variables or ’=’ (prefer <math id="A4.F8.pic1.m10" class="ltx_Math" alttext="5" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn><annotation encoding="application/x-tex">5</annotation></semantics></math> over <math id="A4.F8.pic1.m11" class="ltx_Math" alttext="x=5" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></mrow><annotation encoding="application/x-tex">x=5</annotation></semantics></math>).
<br class="ltx_break">5) MCQ: box the single capital letter only.
<br class="ltx_break">6) Tuples/Sets: <math id="A4.F8.pic1.m12" class="ltx_Math" alttext="(a,b,\dots)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(a,b,\dots)</annotation></semantics></math> and <math id="A4.F8.pic1.m13" class="ltx_Math" alttext="\{a,b,\dots\}" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{a,b,\dots\}</annotation></semantics></math> with simplified components.
<br class="ltx_break">7) Units: match the problem; use <math id="A4.F8.pic1.m14" class="ltx_Math" alttext="k^{\circ}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∘</mo></msup><annotation encoding="application/x-tex">k^{\circ}</annotation></semantics></math> for degrees; default radians.
<br class="ltx_break">8) Sanity: respect domains; drop extraneous roots; include a quick plug-back check.</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>