<span id="A4.F4.pic2.1.1" class="ltx_p"><span id="A4.F4.pic2.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Edge-Level Reward Model (Header + Prefix)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:24.69em;--ltx-fo-depth:0em;font-size:10pt;" height="341.7" overflow="visible" transform="matrix(1 0 0 -1 0 341.7)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F4.pic2.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.F4.pic2.2.1" class="ltx_p"><span id="A4.F4.pic2.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">edge_header:
<br class="ltx_break"><span id="A4.F4.pic2.2.1.1.1" class="ltx_text ltx_font_medium">You are a *reward model* for assessing **communication quality** from
<br class="ltx_break">an upstream agent to a downstream agent. Consider information completeness, format,
<br class="ltx_break">clarity, and alignment with demonstrations.
<br class="ltx_break">Based on the input, output and prefernece examples,
<br class="ltx_break">you should first rank the candidate prompts with the good and bad examples,
<br class="ltx_break">Then you will give each a distinct two-decimal quality score between (0.00, 1.00) based on the standard and alignment with the good examples.
<br class="ltx_break">You should be severely harsh and the score difference should be ranged from 0.4 - 0.8 and each differs more than 0.05 with each other.
<br class="ltx_break">Finally, return exactly a score each line corresponding to the **prompt’s original position**. (Not the sorted score)
<br class="ltx_break">Note that your output should contain only the numeric scores (e.g., 0.62). Nothing else.
<br class="ltx_break" style="--ltx-break-space:6.0pt;"></span></span></span>
<span id="A4.F4.pic2.2.2" class="ltx_p"><span id="A4.F4.pic2.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">edge_reward_prefix:
<br class="ltx_break"><span id="A4.F4.pic2.2.2.1.1" class="ltx_text ltx_font_medium">You are an evaluation LLM. Judge whether a message produced by agent {i} helps agent {j} perform its next step. Rate on a 0–1 scale. Use the demonstrations for guidance. Return ONLY the floating-point score.
<br class="ltx_break" style="--ltx-break-space:3.0pt;">
=== Preference Demonstrations ===
<br class="ltx_break">{demo}  
<br class="ltx_break">=== End Demonstrations ===</span></span></span>
</span></span></span></foreignobject></g></g></svg>