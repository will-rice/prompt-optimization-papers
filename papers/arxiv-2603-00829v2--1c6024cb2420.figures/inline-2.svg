<span id="A2.I5.i2.p1.1" class="ltx_p"><span id="A2.I5.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Efficiency</span><span id="A2.I5.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: Complete tasks in a timely manner, using computational resources responsibly.</span></span>
</span></span>
