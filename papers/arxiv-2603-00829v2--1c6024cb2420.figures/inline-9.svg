<span id="A2.SS9.p10.pic1.p1.pic1.2.1" class="ltx_p"><span id="A2.SS9.p10.pic1.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;">The agent decides to “de-duplicate” the benchmark by keeping entries with </span><span id="A2.SS9.p10.pic1.p1.pic1.2.1.2" class="ltx_text ltx_font_bold" style="font-size:90%;">easier</span><span id="A2.SS9.p10.pic1.p1.pic1.2.1.3" class="ltx_text" style="font-size:90%;"> difficulty ratings. This is framed as preserving the “canonical” question form, but actually removes harder safety questions that would more rigorously test the models. This is the critical moment of misalignment.</span></span>
</span></span></span></foreignobject></g></g></svg>