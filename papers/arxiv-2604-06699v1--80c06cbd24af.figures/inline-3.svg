<span id="A3.F9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.17em;">
<span id="A3.F9.pic1.2.1" class="ltx_p"><span id="A3.F9.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are optimizing a prompt for a {dataset_name} dataset ({task_type}).
</span></span>
<span id="A3.F9.pic1.2.2" class="ltx_p"><span id="A3.F9.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Current Performance</span></span>
<span id="A3.F9.pic1.2.3" class="ltx_p"><span id="A3.F9.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Accuracy: {accuracy}% ({correct_count}/{total_samples} correct)
<br class="ltx_break"> The current prompt already works for {correct_count} samples - DO NOT break what’s working!
</span></span>
<span id="A3.F9.pic1.2.4" class="ltx_p"><span id="A3.F9.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Context</span></span>
<span id="A3.F9.pic1.2.5" class="ltx_p"><span id="A3.F9.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Current Complete Prompt: {current_prompt}
<br class="ltx_break"> Target Factor Segment: ‘‘{current_factor_desc}’’ (This is the part to replace)
<br class="ltx_break"> Role/Goal of this factor: {target_factor}
</span></span>
<span id="A3.F9.pic1.2.6" class="ltx_p"><span id="A3.F9.pic1.2.6.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Error Analysis (for reference only)</span></span>
<span id="A3.F9.pic1.2.7" class="ltx_p"><span id="A3.F9.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> {error_summary}
</span></span>
<span id="A3.F9.pic1.2.8" class="ltx_p"><span id="A3.F9.pic1.2.8.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Task</span></span>
<span id="A3.F9.pic1.2.9" class="ltx_p"><span id="A3.F9.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Generate {num_candidates} improved versions of the ‘‘{target_factor}’’ segment.
</span></span>
<span id="A3.F9.pic1.2.10" class="ltx_p"><span id="A3.F9.pic1.2.10.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFD9D9;">CRITICAL CONSTRAINTS</span></span>
<span id="A3.F9.pic1.2.11" class="ltx_p"><span id="A3.F9.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> 1. Output ONLY the new text segment.
<br class="ltx_break"> 2. The new segment must be grammatically compatible with the surrounding text.
<br class="ltx_break"> 3. PRESERVE what makes the current prompt work for correct samples.
<br class="ltx_break"> 4. Keep improvements CONCISE and GENERAL-PURPOSE for this dataset type.
<br class="ltx_break"> 5. Do NOT overfit to the specific error examples - improve the general approach.
<br class="ltx_break"> 6. Consider the nature of {dataset_name} tasks when making improvements.
<br class="ltx_break"> 7. Do NOT include markdown blocks, just raw JSON.
</span></span>
<span id="A3.F9.pic1.2.12" class="ltx_p"><span id="A3.F9.pic1.2.12.1" class="ltx_text ltx_font_typewriter ltx_font_italic" style="--ltx-fg-color:#000000;">Output format: A valid JSON array of strings, e.g., [‘‘description 1’’, ‘‘description 2’’].<span id="A3.F9.pic1.2.12.1.1" class="ltx_text ltx_font_upright">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>