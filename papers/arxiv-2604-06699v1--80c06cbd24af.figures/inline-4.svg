.46 C 347.79 1.55 346.24 0 344.33 0 L 3.46 0 C 1.55 0 0 1.55 0 3.46 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 3.46 L 0.69 20.07 C 0.69 21.59 1.93 22.83 3.46 22.83 L 344.33 22.83 C 345.86 22.83 347.1 21.59 347.1 20.07 L 347.1 3.46 C 347.1 1.93 345.86 0.69 344.33 0.69 L 3.46 0.69 C 1.93 0.69 0.69 1.93 0.69 3.46 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 8.3)"><foreignobject style="--ltx-fo-width:23.3em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="322.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A3.F10.pic1.1" class="ltx_text ltx_font_sansserif ltx_font_bold ltx_font_smallcaps" style="--ltx-fg-color:#191970;">Meta-Prompt: Step 1 – Open-Ended Error Diagnosis</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 16.01)"><foreignobject style="--ltx-fo-width:43.17em;--ltx-fo-height:39.81em;--ltx-fo-depth:0.22em;font-size:10pt;" height="553.95" overflow="visible" transform="matrix(1 0 0 -1 0 550.87)" width="597.35"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.F10.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.17em;">
<span id="A3.F10.pic1.2.1" class="ltx_p"><span id="A3.F10.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a professional AI error analysis expert. Your task is to conduct a thorough and unbiased diagnosis of an observed error in an AI-generated response.
</span></span>
<span id="A3.F10.pic1.2.2" class="ltx_p"><span id="A3.F10.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Input Information</span></span>
<span id="A3.F10.pic1.2.3" class="ltx_p"><span id="A3.F10.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Question: {question}
<br class="ltx_break"> Correct Answer: {correct_answer}
<br class="ltx_break"> AI Predicted Answer: {predicted_answer}
<br class="ltx_break"> AI Reasoning Process: {reasoning}
</span></span>
<span id="A3.F10.pic1.2.4" class="ltx_p"><span id="A3.F10.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Diagnosis Objective</span></span>
<span id="A3.F10.pic1.2.5" class="ltx_p"><span id="A3.F10.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Perform an open-ended and comprehensive error analysis without being constrained
<br class="ltx_break"> by predefined categories. Focus on understanding the underlying causes and implications.
</span></span>
<span id="A3.F10.pic1.2.6" class="ltx_p"><span id="A3.F10.pic1.2.6.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Analysis Dimensions</span></span>
<span id="A3.F10.pic1.2.7" class="ltx_p"><span id="A3.F10.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> 1. <span id="A3.F10.pic1.2.7.1.1" class="ltx_text ltx_font_bold">Error Essence:</span> Identify the fundamental root cause of the error.
<br class="ltx_break"> 2. <span id="A3.F10.pic1.2.7.1.2" class="ltx_text ltx_font_bold">Error Type:</span> Assign a concise and descriptive label to characterize the error.
<br class="ltx_break"> 3. <span id="A3.F10.pic1.2.7.1.3" class="ltx_text ltx_font_bold">Error Mechanism:</span> Explain how and why the error occurred.
<br class="ltx_break"> 4. <span id="A3.F10.pic1.2.7.1.4" class="ltx_text ltx_font_bold">Error Impact:</span> Assess how this error affects the overall reasoning or outcome.
<br class="ltx_break"> 5. <span id="A3.F10.pic1.2.7.1.5" class="ltx_text ltx_font_bold">Improvement Direction:</span> Propose specific and actionable prompt-level improvements.
</span></span>
<span id="A3.F10.pic1.2.8" class="ltx_p"><span id="A3.F10.pic1.2.8.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFD9D9;">Response Format</span></span>
<span id="A3.F10.pic1.2.9" class="ltx_p"><span id="A3.F10.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Error Essence: [...]
<br class="ltx_break"> Error Type: [...]
<br class="ltx_break"> Error Mechanism: [...]
<br class="ltx_break"> Error Impact: [...]
<br class="ltx_break"> Improvement Suggestion: [...]
</span></span>
</span></span></span></foreignobject></g></g></svg>