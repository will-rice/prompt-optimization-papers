 258.54 1.55 257 0 255.08 0 L 3.46 0 C 1.55 0 0 1.55 0 3.46 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 3.46 L 0.69 20.07 C 0.69 21.59 1.93 22.83 3.46 22.83 L 255.08 22.83 C 256.61 22.83 257.85 21.59 257.85 20.07 L 257.85 3.46 C 257.85 1.93 256.61 0.69 255.08 0.69 L 3.46 0.69 C 1.93 0.69 0.69 1.93 0.69 3.46 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 8.3)"><foreignobject style="--ltx-fo-width:16.88em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="233.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A3.F8.pic1.1" class="ltx_text ltx_font_sansserif ltx_font_bold ltx_font_smallcaps" style="--ltx-fg-color:#191970;">Meta-Prompt: Initial-Prompt Analysis</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 15.62)"><foreignobject style="--ltx-fo-width:43.17em;--ltx-fo-height:26.35em;--ltx-fo-depth:0.19em;font-size:10pt;" height="367.3" overflow="visible" transform="matrix(1 0 0 -1 0 364.61)" width="597.35"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.F8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.17em;">
<span id="A3.F8.pic1.2.1" class="ltx_p"><span id="A3.F8.pic1.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">[INPUT]
<br class="ltx_break"><span id="A3.F8.pic1.2.1.1.1" class="ltx_text ltx_font_medium">Initial Prompt: {initial_prompt}
<br class="ltx_break">Task Description: {task_description}
<br class="ltx_break">Task Type: {task_type}
<br class="ltx_break">Expected Output: {output_format}; constraints: {constraints}
<br class="ltx_break">Example Data: {example_data}
</span></span></span>
<span id="A3.F8.pic1.2.2" class="ltx_p"><span id="A3.F8.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Based on the initial prompt and task examples, generate a complete, usable instruction and decompose it into factors. Return ONLY the four sections below:
</span></span>
<span id="A3.F8.pic1.2.3" class="ltx_p"><span id="A3.F8.pic1.2.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Section 1: Complexity Analysis</span></span>
<span id="A3.F8.pic1.2.4" class="ltx_p"><span id="A3.F8.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> [one sentence on why you chose K factors (prefer concise factorizations)]
</span></span>
<span id="A3.F8.pic1.2.5" class="ltx_p"><span id="A3.F8.pic1.2.5.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Section 2: Complete Instruction Template</span></span>
<span id="A3.F8.pic1.2.6" class="ltx_p"><span id="A3.F8.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> [concise, natural instruction; no numbering/bold/quotes]
</span></span>
<span id="A3.F8.pic1.2.7" class="ltx_p"><span id="A3.F8.pic1.2.7.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Section 3: Factor Decomposition</span></span>
<span id="A3.F8.pic1.2.8" class="ltx_p"><span id="A3.F8.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Factor1_[Name]: [one-line role]
<br class="ltx_break"> Factor2_[Name]: [one-line role]
<br class="ltx_break"> ... (use K factors; prefer fewer when possible)
</span></span>
<span id="A3.F8.pic1.2.9" class="ltx_p"><span id="A3.F8.pic1.2.9.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Section 4: Factor Boundary Mapping</span></span>
<span id="A3.F8.pic1.2.10" class="ltx_p"><span id="A3.F8.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Factor1_[Name]: ‘‘[verbatim substring from template]’’
<br class="ltx_break"> Factor2_[Name]: ‘‘[verbatim substring from template]’’
<br class="ltx_break"> ... (names must exactly match Factor Decomposition)
</span></span>
<span id="A3.F8.pic1.2.11" class="ltx_p"><span id="A3.F8.pic1.2.11.1" class="ltx_text ltx_font_typewriter ltx_font_italic" style="--ltx-fg-color:#000000;">Do not output anything beyond these four sections.<span id="A3.F8.pic1.2.11.1.1" class="ltx_text ltx_font_upright">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>