3.46 C 264.92 1.55 263.38 0 261.47 0 L 3.46 0 C 1.55 0 0 1.55 0 3.46 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 3.46 L 0.69 20.07 C 0.69 21.59 1.93 22.83 3.46 22.83 L 261.47 22.83 C 262.99 22.83 264.23 21.59 264.23 20.07 L 264.23 3.46 C 264.23 1.93 262.99 0.69 261.47 0.69 L 3.46 0.69 C 1.93 0.69 0.69 1.93 0.69 3.46 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 8.3)"><foreignobject style="--ltx-fo-width:17.42em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="241.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A3.F11.pic1.1" class="ltx_text ltx_font_sansserif ltx_font_bold ltx_font_smallcaps" style="--ltx-fg-color:#191970;">Meta-Prompt: Step 2 - Factor Selection</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 16.01)"><foreignobject style="--ltx-fo-width:43.17em;--ltx-fo-height:29.41em;--ltx-fo-depth:0.22em;font-size:10pt;" height="410.04" overflow="visible" transform="matrix(1 0 0 -1 0 406.97)" width="597.35"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.F11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.17em;">
<span id="A3.F11.pic1.2.1" class="ltx_p"><span id="A3.F11.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert in prompt optimization and error diagnosis. Your goal is to select the SINGLE most relevant factor to improve, based strictly on the given error analysis.
</span></span>
<span id="A3.F11.pic1.2.2" class="ltx_p"><span id="A3.F11.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Available Factors</span></span>
<span id="A3.F11.pic1.2.3" class="ltx_p"><span id="A3.F11.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> (choose exactly ONE from this list)
<br class="ltx_break"> {factor_list}
</span></span>
<span id="A3.F11.pic1.2.4" class="ltx_p"><span id="A3.F11.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Error Analysis Summary</span></span>
<span id="A3.F11.pic1.2.5" class="ltx_p"><span id="A3.F11.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Primary Error Type: {error_type}
<br class="ltx_break"> Total Wrong Examples: {num_errors}
</span></span>
<span id="A3.F11.pic1.2.6" class="ltx_p"><span id="A3.F11.pic1.2.6.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Representative Error Samples</span></span>
<span id="A3.F11.pic1.2.7" class="ltx_p"><span id="A3.F11.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> {error_samples}
</span></span>
<span id="A3.F11.pic1.2.8" class="ltx_p"><span id="A3.F11.pic1.2.8.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Selection Criteria</span></span>
<span id="A3.F11.pic1.2.9" class="ltx_p"><span id="A3.F11.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> 1. The factor whose improvement would most directly resolve the root cause.
<br class="ltx_break"> 2. The factor whose scope best aligns with the observed failure patterns.
<br class="ltx_break"> 3. The factor with the highest potential to prevent similar future errors.
</span></span>
<span id="A3.F11.pic1.2.10" class="ltx_p"><span id="A3.F11.pic1.2.10.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFFFBF;">Factor Selection History</span></span>
<span id="A3.F11.pic1.2.11" class="ltx_p"><span id="A3.F11.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Frequently selected: {overexplored_factors}
<br class="ltx_break"> Less explored: {underexplored_factors}
<br class="ltx_break"> <span id="A3.F11.pic1.2.11.1.1" class="ltx_text ltx_font_italic">Recommendation: If the less explored factors are also relevant to
<br class="ltx_break"></span> <span id="A3.F11.pic1.2.11.1.2" class="ltx_text ltx_font_italic">solving the current errors, consider giving them opportunities to
<br class="ltx_break"></span> <span id="A3.F11.pic1.2.11.1.3" class="ltx_text ltx_font_italic">ensure balanced exploration and avoid over-focusing on a single factor.</span>
</span></span>
<span id="A3.F11.pic1.2.12" class="ltx_p"><span id="A3.F11.pic1.2.12.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFD9D9;">Output Constraints</span></span>
<span id="A3.F11.pic1.2.13" class="ltx_p"><span id="A3.F11.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Output ONLY the factor name.
<br class="ltx_break"> The output must exactly match one item in the factor list.
<br class="ltx_break"> Do NOT include explanations or additional text.
</span></span>
</span></span></span></foreignobject></g></g></svg>