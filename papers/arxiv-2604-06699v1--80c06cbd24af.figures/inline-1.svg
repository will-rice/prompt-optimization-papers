<span id="A3.F7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.17em;">
<span id="A3.F7.pic1.2.1" class="ltx_p"><span id="A3.F7.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Based on the task description and examples, generate a complete, usable instruction and decompose it into factors.
</span></span>
<span id="A3.F7.pic1.2.2" class="ltx_p"><span id="A3.F7.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">[INPUT]
<br class="ltx_break" style="--ltx-break-space:2.0pt;"><span id="A3.F7.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
 Task Description: {task_description}
<br class="ltx_break"> Task Type: {task_type}
<br class="ltx_break"> Expected Output: {output_format}; constraints: {constraints}
<br class="ltx_break"> Example Data: {example_data}
</span></span></span>
<span id="A3.F7.pic1.2.3" class="ltx_p"><span id="A3.F7.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Return ONLY the four sections below, plain text, no extra commentary:
</span></span>
<span id="A3.F7.pic1.2.4" class="ltx_p"><span id="A3.F7.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Section 1: Complexity Analysis</span></span>
<span id="A3.F7.pic1.2.5" class="ltx_p"><span id="A3.F7.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> [one sentence on why you chose K factors (prefer concise factorizations)]
</span></span>
<span id="A3.F7.pic1.2.6" class="ltx_p"><span id="A3.F7.pic1.2.6.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Section 2: Complete Instruction Template</span></span>
<span id="A3.F7.pic1.2.7" class="ltx_p"><span id="A3.F7.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> [concise, natural instruction; no numbering/bold/quotes]
</span></span>
<span id="A3.F7.pic1.2.8" class="ltx_p"><span id="A3.F7.pic1.2.8.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Section 3: Factor Decomposition</span></span>
<span id="A3.F7.pic1.2.9" class="ltx_p"><span id="A3.F7.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Factor1_[Name]: [one-line role]
<br class="ltx_break"> Factor2_[Name]: [one-line role]
<br class="ltx_break"> ... (use K factors; prefer fewer when possible)
</span></span>
<span id="A3.F7.pic1.2.10" class="ltx_p"><span id="A3.F7.pic1.2.10.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;--ltx-bg-color:#EBEBFF;">Section 4: Factor Boundary Mapping</span></span>
<span id="A3.F7.pic1.2.11" class="ltx_p"><span id="A3.F7.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Factor1_[Name]: &quot;[verbatim substring from template]&quot;
<br class="ltx_break"> Factor2_[Name]: &quot;[verbatim substring from template]&quot;
<br class="ltx_break"> ... (names must exactly match Factor Decomposition)
</span></span>
<span id="A3.F7.pic1.2.12" class="ltx_p"><span id="A3.F7.pic1.2.12.1" class="ltx_text ltx_font_typewriter ltx_font_italic" style="--ltx-fg-color:#000000;">Do not output anything beyond these four sections.<span id="A3.F7.pic1.2.12.1.1" class="ltx_text ltx_font_upright">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>