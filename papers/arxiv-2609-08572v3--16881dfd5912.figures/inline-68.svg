<span id="A2.SS4.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.97em;">
<span id="A2.SS4.p1.pic1.1.1" class="ltx_p"><span id="A2.SS4.p1.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS4.p1.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS4.p1.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p1.1" class="ltx_p">You are an AI Optimization Engineer. Your goal is to refine the instructions for an AI assistant to fix specific error patterns without degrading general performance.</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.2" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
<span id="A2.SS4.p1.pic1.1.3" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p3.1" class="ltx_p">### 1. Original Prompt</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.4" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p4.1" class="ltx_p">&lt;curr_instructions&gt;</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.5" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
<span id="A2.SS4.p1.pic1.1.6" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p6" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p6.1" class="ltx_p">### 2. Generalized Update Direction</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.7" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p7.1" class="ltx_p">&lt;generalized_gradient&gt;</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.8" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
<span id="A2.SS4.p1.pic1.1.9" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p9" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p9.1" class="ltx_p">### 3. Error Correction Examples</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.10" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p10" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p10.1" class="ltx_p">&lt;inputs_outputs_feedback&gt;</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.11" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
<span id="A2.SS4.p1.pic1.1.12" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p12" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p12.1" class="ltx_p">### 4. Task</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.13" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS4.p1.pic1.1.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS4.p1.pic1.1.13.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p13" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p13.1" class="ltx_p">Rewrite the prompt so that the agent follows the Generalized Update Direction and, when given inputs similar to the examples above, produces outputs consistent with the Correct Output instead of the Wrong Output.</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.14" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
<span id="A2.SS4.p1.pic1.1.15" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p15" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p15.1" class="ltx_p">### 5. Constraints</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.16" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p16" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p16.1" class="ltx_p">- Preserve the original task of the agent.</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.17" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p17" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p17.1" class="ltx_p">- Do not change the required input or output fields.</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.18" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p18" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p18.1" class="ltx_p">- Modify the prompt only where necessary to incorporate the update direction.</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.19" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p19" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p19.1" class="ltx_p">- Keep the prompt concise and generalizable.</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.20" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p20" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p20.1" class="ltx_p">- Avoid writing rules that only solve the specific examples.</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.21" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p21" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p21.1" class="ltx_p">- The rewritten prompt must incorporate the Generalized Update Direction.</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.22" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.22.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p22" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p22.1" class="ltx_p">- The updated prompt should generalize beyond the provided examples.</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.23" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.23.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.23.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS4.p1.pic1.1.23.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS4.p1.pic1.1.23.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p23" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p23.1" class="ltx_p">- Output only the rewritten prompt under **New Instructions:** with no additional commentary.</span>
</span></span></span></span>
<span id="A2.SS4.p1.pic1.1.24" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.24.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.24.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
<span id="A2.SS4.p1.pic1.1.25" class="ltx_p" style="width:330.5pt;"><span id="A2.SS4.p1.pic1.1.25.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS4.p1.pic1.1.25.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS4.p1.pic1.p25" class="ltx_para ltx_noindent">
<span id="A2.SS4.p1.pic1.p25.1" class="ltx_p">**New Instructions:**</span>
