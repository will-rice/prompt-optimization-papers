<span id="A1.SS10.p5.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS10.p5.pic1.p2.1" class="ltx_p">Given a private user query, create a privacy-preserving request for a powerful external LLM. Systematically identify and redact all personally identifiable information (PII), including names, addresses, email addresses, company names, and specific locations, while also generalizing specific contextual identifiers (e.g., geographic locations, company names, institutional references, industry-specific terms) into neutral placeholders. Replace these elements with standardized placeholders (e.g., &quot;[Company Name],&quot; &quot;[Major European City]&quot;) to preserve the query’s functional intent, structural relationships, and non-sensitive content. Ensure the LLM can assist without learning private information about the user or exposing contextually sensitive details.</span>
