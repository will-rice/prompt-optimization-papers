<span id="A1.SS3.p10.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.97em;">
<span id="A1.SS3.p10.pic1.1.1" class="ltx_p"><span id="A1.SS3.p10.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p1.1" class="ltx_p">You are given two fields: claim and summary_1. Produce an output containing exactly three labeled blocks: [[ ## reasoning ## ]], [[ ## query ## ]], and [[ ## completed ## ]].</span>
</span></span></span></span>
<span id="A1.SS3.p10.pic1.1.2" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
<span id="A1.SS3.p10.pic1.1.3" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p3.1" class="ltx_p">Follow this procedure:</span>
</span></span></span></span>
<span id="A1.SS3.p10.pic1.1.4" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p4.1" class="ltx_p">1. Identify the claim’s subclaims and mark which subclaim is unsupported or which single missing fact is required to fully verify the claim. If summary_1 already supports all subclaims but lacks an authoritative primary page, treat the missing item as “authoritative primary page for [entity].”</span>
</span></span></span></span>
<span id="A1.SS3.p10.pic1.1.5" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p5.1" class="ltx_p">2. Select a single bridge entity that will most directly resolve that missing fact. Prefer an entity name that appears in summary_1; if none, derive a short anchor phrase from the claim (person name, film title, band name, institution, etc.). Use only one bridge entity.</span>
</span></span></span></span>
<span id="A1.SS3.p10.pic1.1.6" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p6.1" class="ltx_p">3. In one short sentence, state the single missing subclaim or missing fact to verify.</span>
</span></span></span></span>
<span id="A1.SS3.p10.pic1.1.7" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.7.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p7.1" class="ltx_p">4. In 1–2 sentences of reasoning, name the chosen bridge entity and explain why that entity’s primary page (person page, film page, band page, institution page, etc.) will resolve the missing fact.</span>
</span></span></span></span>
<span id="A1.SS3.p10.pic1.1.8" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.8.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p8" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p8.1" class="ltx_p">5. Produce exactly one concise query (one line, a short phrase or page-title-style query) that targets only that missing fact and is likely to return the bridge entity’s primary page. Do not emit multiple queries or multi-part requests.</span>
</span></span></span></span>
<span id="A1.SS3.p10.pic1.1.9" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
<span id="A1.SS3.p10.pic1.1.10" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p10.1" class="ltx_p">Formatting rules:</span>
</span></span></span></span>
<span id="A1.SS3.p10.pic1.1.11" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.11.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p11.1" class="ltx_p">- [[ ## reasoning ## ]] must contain the one-sentence missing-fact statement followed by the 1–2 sentence explanation naming the chosen bridge entity.</span>
</span></span></span></span>
<span id="A1.SS3.p10.pic1.1.12" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.12.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.12.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.12.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p12" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p12.1" class="ltx_p">- [[ ## query ## ]] must contain exactly one concise query phrase that targets the missing fact (e.g., &quot;Lit band formation&quot; or &quot;Little Children 2006 director&quot; or &quot;Swinburne University Centre for Astrophysics and Supercomputing&quot;).</span>
</span></span></span></span>
<span id="A1.SS3.p10.pic1.1.13" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p13.1" class="ltx_p">- [[ ## completed ## ]] simply closes the output.</span>
</span></span></span></span>
<span id="A1.SS3.p10.pic1.1.14" class="ltx_p" style="width:330.5pt;"><span id="A1.SS3.p10.pic1.1.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p10.pic1.1.14.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.14.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p10.pic1.1.14.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS3.p10.pic1.p14" class="ltx_para ltx_noindent">
<span id="A1.SS3.p10.pic1.p14.1" class="ltx_p">- Be concise and generalize across cases; do not list search strategies or multiple steps. Preserve the given input fields and produce only the three required blocks.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></g></svg>