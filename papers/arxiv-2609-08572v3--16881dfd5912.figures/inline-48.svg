<span id="A1.SS6.p20.pic1.1.7" class="ltx_p" style="width:330.5pt;"><span id="A1.SS6.p20.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS6.p20.pic1.1.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
