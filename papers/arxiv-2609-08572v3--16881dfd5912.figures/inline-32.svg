<span id="A1.SS4.p20.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS4.p20.pic1.p1.1" class="ltx_p">Given the fields `claim`, `summary_1`, `summary_2`, produce the fields `query`. Explicitly identify and prioritize entities directly mentioned or implied in the summaries that are relevant to the claim. Resolve ambiguities by explicitly naming disambiguated entities using standardized, canonical entity names (e.g., including disambiguators like year, publisher, or specific identifiers). Format the query as a list of these entities, ensuring no speculative assumptions or inferred information is included. The query should focus on these explicitly named, disambiguated entities as the foundation for further verification.</span>
