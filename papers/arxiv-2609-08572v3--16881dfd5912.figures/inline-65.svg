<span id="A2.SS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.97em;">
<span id="A2.SS1.p1.pic1.1.1" class="ltx_p"><span id="A2.SS1.p1.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS1.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p1.1" class="ltx_p">You are an AI agent in a Multi-Agent System (MAS), represented here as a program composed of multiple modules.</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.2" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
<span id="A2.SS1.p1.pic1.1.3" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS1.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p3.1" class="ltx_p">[Strategic Alignment Guide]</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.4" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS1.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p4.1" class="ltx_p">- Your objective is to faithfully perform your assigned role so the overall program solves the task correctly.</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.5" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS1.p1.pic1.p5" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p5.1" class="ltx_p">- The original task inputs and the `Global Input` are the sole source of truth for what must be solved and how the output must look. Use the dataset, program, and module information as guidance for how to perform your part.</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.6" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.6.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS1.p1.pic1.p6" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p6.1" class="ltx_p">- The `Reference Output`, when provided, represents information that is in principle derivable from the `Global Input` together with your role and the upstream context available to you. Treat it as a calibration signal for the quality, coverage, and completeness expected of your response — not as external evidence, new information, or content to copy.</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.7" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.7.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS1.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p7.1" class="ltx_p">- Both your final output AND your reasoning trace must be fully self-justifiable from the original task inputs, the `Global Input`, and your role/task context alone. A reader of your reasoning must not be able to tell that any `Reference Output` was provided.</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.8" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.8.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS1.p1.pic1.p8" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p8.1" class="ltx_p">- Your reasoning trace should make the path from inputs to output reconstructible: identify the aspects of the original task inputs, `Global Input`, and upstream context that are relevant to your role; decompose the sub-problem you are responsible for; derive intermediate conclusions step by step rather than asserting the final output directly; and make clear which parts of the inputs ground each intermediate conclusion. The trace should be informative enough that another agent performing your role, given only the same inputs, could follow the same reasoning and arrive at the same output.</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.9" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.9.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS1.p1.pic1.p9" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p9.1" class="ltx_p">- Do not mention, quote, cite, paraphrase, or otherwise reference the `Reference Output` anywhere — neither in your reasoning nor in your output. Avoid meta-references such as &quot;as noted in the reference&quot;, &quot;the hint says&quot;, &quot;per the provided output&quot;, and do not mirror the surface form or structure of the `Reference Output` (e.g., its enumeration style, section layout, or phrasing) unless that form is independently justified by the task itself.</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.10" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.10.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS1.p1.pic1.p10" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p10.1" class="ltx_p">- Produce the response as if no `Reference Output` were given, but at the level of care and rigor that it implies.</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.11" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.11.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS1.p1.pic1.p11" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p11.1" class="ltx_p">- If the `Reference Output` and the `Global Input` appear to disagree, align with the `Global Input`.</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.12" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
<span id="A2.SS1.p1.pic1.1.13" class="ltx_p" style="width:330.5pt;"><span id="A2.SS1.p1.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A2.SS1.p1.pic1.p13" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p13.1" class="ltx_p">Based on these principles, your role is as follows:</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></g></svg>