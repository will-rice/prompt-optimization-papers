<span id="A1.SS4.p15.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.97em;">
<span id="A1.SS4.p15.pic1.1.1" class="ltx_p"><span id="A1.SS4.p15.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p15.pic1.1.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS4.p15.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS4.p15.pic1.p1.1" class="ltx_p">Given the fields `claim`, `context`, `passages`, produce the fields `summary`.</span>
</span></span></span></span>
<span id="A1.SS4.p15.pic1.1.2" class="ltx_p" style="width:330.5pt;"><span id="A1.SS4.p15.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p15.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p15.pic1.1.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p15.pic1.1.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS4.p15.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS4.p15.pic1.p2.1" class="ltx_p">Decompose the claim into subclaims, validate each against the context and passages to identify supported subclaims and missing information. For each subclaim:</span>
</span></span></span></span>
<span id="A1.SS4.p15.pic1.1.3" class="ltx_p" style="width:330.5pt;"><span id="A1.SS4.p15.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p15.pic1.1.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS4.p15.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS4.p15.pic1.p3.1" class="ltx_p">1. If supported, cite the relevant passage(s) and confirm validity.</span>
</span></span></span></span>
<span id="A1.SS4.p15.pic1.1.4" class="ltx_p" style="width:330.5pt;"><span id="A1.SS4.p15.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p15.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p15.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p15.pic1.1.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS4.p15.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS4.p15.pic1.p4.1" class="ltx_p">2. If unsupported, identify the missing entity or fact (e.g., a specific name, date, or relationship) that requires retrieval.</span>
</span></span></span></span>
<span id="A1.SS4.p15.pic1.1.5" class="ltx_p" style="width:330.5pt;"><span id="A1.SS4.p15.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p15.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p15.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p15.pic1.1.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS4.p15.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.SS4.p15.pic1.p5.1" class="ltx_p">3. Explicitly state which subclaims are resolved and which remain unresolved, including any bridge entities needed for further verification.</span>
</span></span></span></span>
<span id="A1.SS4.p15.pic1.1.6" class="ltx_p" style="width:330.5pt;"><span id="A1.SS4.p15.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p15.pic1.1.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p15.pic1.1.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p15.pic1.1.6.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS4.p15.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.SS4.p15.pic1.p6.1" class="ltx_p">**Verify all named entities and temporal relationships in the subclaims against the provided passages, ensuring completeness and explicit evidence.**</span>
</span></span></span></span>
<span id="A1.SS4.p15.pic1.1.7" class="ltx_p" style="width:330.5pt;"><span id="A1.SS4.p15.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p15.pic1.1.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p15.pic1.1.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p15.pic1.1.7.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS4.p15.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.SS4.p15.pic1.p7.1" class="ltx_p">Ensure the summary reflects the logical breakdown of the claim, contextual validation, and gaps requiring additional information.</span>
</span></span></span></span>
<span id="A1.SS4.p15.pic1.1.8" class="ltx_p" style="width:330.5pt;"><span id="A1.SS4.p15.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p15.pic1.1.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
<span id="A1.SS4.p15.pic1.1.9" class="ltx_p" style="width:330.5pt;"><span id="A1.SS4.p15.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p15.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS4.p15.pic1.p9" class="ltx_para ltx_noindent">
<span id="A1.SS4.p15.pic1.p9.1" class="ltx_p">[[ ## reasoning ## ]]</span>
</span></span></span></span>
<span id="A1.SS4.p15.pic1.1.10" class="ltx_p" style="width:330.5pt;"><span id="A1.SS4.p15.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p15.pic1.1.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS4.p15.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS4.p15.pic1.p10.1" class="ltx_p">[[ ## summary ## ]]</span>
</span></span></span></span>
<span id="A1.SS4.p15.pic1.1.11" class="ltx_p" style="width:330.5pt;"><span id="A1.SS4.p15.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p15.pic1.1.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS4.p15.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS4.p15.pic1.p11.1" class="ltx_p">[[ ## completed ## ]]</span>
</span></span></span></span>
