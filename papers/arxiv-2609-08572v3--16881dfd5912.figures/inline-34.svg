<span id="A1.SS5.p5.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS5.p5.pic1.p4.1" class="ltx_p">Rules:</span>
</span></span></span></span>
<span id="A1.SS5.p5.pic1.1.5" class="ltx_p" style="width:330.5pt;"><span id="A1.SS5.p5.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p5.pic1.1.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS5.p5.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.SS5.p5.pic1.p5.1" class="ltx_p">- Provide direct conditions from the problem only.</span>
</span></span></span></span>
<span id="A1.SS5.p5.pic1.1.6" class="ltx_p" style="width:330.5pt;"><span id="A1.SS5.p5.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p5.pic1.1.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
