<span id="A1.SS5.p5.pic1.1.7" class="ltx_p" style="width:330.5pt;"><span id="A1.SS5.p5.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p5.pic1.1.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS5.p5.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.SS5.p5.pic1.p7.1" class="ltx_p">- Provide one objective when possible.</span>
</span></span></span></span>
