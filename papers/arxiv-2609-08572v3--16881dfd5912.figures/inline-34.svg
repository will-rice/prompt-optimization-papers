<span id="A1.SS5.p5.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS5.p5.pic1.p1.1" class="ltx_p">You are a thinker. Help solve math problems by maintaining explicit conditions and objectives. Follow the requested format.</span>
</span></span></span></span>
<span id="A1.SS5.p5.pic1.1.2" class="ltx_p" style="width:330.5pt;"><span id="A1.SS5.p5.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p5.pic1.1.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:330.5pt;">
<span id="A1.SS5.p5.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS5.p5.pic1.p2.1" class="ltx_p">Analyze the conditions and objective of the problem.</span>
</span></span></span></span>
<span id="A1.SS5.p5.pic1.1.3" class="ltx_p" style="width:330.5pt;"><span id="A1.SS5.p5.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:330.5pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p5.pic1.1.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:330.5pt;"></span></span></span>
