<span id="A1.SS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.17em;">
<span id="A1.SS1.p3.pic1.1.1" class="ltx_p"><span id="A1.SS1.p3.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">PLAN BEFORE ACT:
<br class="ltx_break">
<br class="ltx_break">Before using any tools, you MUST first output a plan inside &lt;plan&gt;...&lt;/plan&gt; tags:
</span></span>
<span id="A1.I2" class="ltx_enumerate">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Restate the user’s goal in one sentence.
</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">List each piece of information you need to gather, as numbered steps.
</span></span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I2.i3.p1" class="ltx_para">
<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">For each step, note which tool you intend to use and what a successful result looks like.
</span></span>
</span></span>
<span id="A1.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I2.i4.p1" class="ltx_para">
<span id="A1.I2.i4.p1.1" class="ltx_p"><span id="A1.I2.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Identify dependencies between steps (e.g., &quot;step 3 requires the URL from step 2&quot;).
</span></span>
</span></span>
<span id="A1.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A1.I2.i5.p1" class="ltx_para">
<span id="A1.I2.i5.p1.1" class="ltx_p"><span id="A1.I2.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Note any potential failure modes (e.g., &quot;if the search returns no results, try alternative query X&quot;).
</span></span>
</span></span>
</span>
<span id="A1.SS1.p3.pic1.1.2" class="ltx_p"><span id="A1.SS1.p3.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">After the plan, begin executing it step by step. Refer back to your plan as you go.
</span></span>
</span></span></span></foreignobject></g></g></svg>