<span id="A1.p3.pic1.2.1" class="ltx_p"><span id="A1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Glossary of tags that will be sent to you:
<br class="ltx_break">- &lt;LM_SYSTEM_PROMPT&gt;: The system prompt for the language model.
<br class="ltx_break">- &lt;LM_INPUT&gt;: The input to the language model.
<br class="ltx_break">- &lt;LM_OUTPUT&gt;: The output of the language model.
<br class="ltx_break">- &lt;FEEDBACK&gt;: The feedback to the variable.
<br class="ltx_break">- &lt;CONVERSATION&gt;: The conversation history.
<br class="ltx_break">- &lt;FOCUS&gt;: The focus of the optimization.
<br class="ltx_break">- &lt;ROLE&gt;: The role description of the variable.</span></span>
