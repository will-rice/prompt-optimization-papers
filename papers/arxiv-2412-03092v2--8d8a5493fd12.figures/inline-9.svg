<svg id="A4.p4.pic1" class="ltx_picture" height="625.23" overflow="visible" version="1.1" viewbox="0 0 650 625.23" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,625.23) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.15 L 0 618.08 C 0 622.02 3.2 625.23 7.15 625.23 L 642.85 625.23 C 646.8 625.23 650 622.02 650 618.08 L 650 7.15 C 650 3.2 646.8 0 642.85 0 L 7.15 0 C 3.2 0 0 3.2 0 7.15 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 7.15 L 1.25 602.56 L 648.75 602.56 L 648.75 7.15 C 648.75 3.89 646.11 1.25 642.85 1.25 L 7.15 1.25 C 3.89 1.25 1.25 3.89 1.25 7.15 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.93 610.43)"><foreignobject style="--ltx-fo-width:43.95em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="608.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.95em;">
<span id="A4.p4.pic1.1.1" class="ltx_p"><span id="A4.p4.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Example Query for LeetCode Hard</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.93 15.82)"><foreignobject style="--ltx-fo-width:43.95em;--ltx-fo-height:41.55em;--ltx-fo-depth:0.2em;font-size:10pt;" height="577.7" overflow="visible" transform="matrix(1 0 0 -1 0 574.93)" width="608.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.95em;">
<span id="A4.p4.pic1.2.1" class="ltx_p"><span id="A4.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">def minimumTime(grid: List[List[int]]) -&gt; int:</span></span>
<span id="A4.p4.pic1.2.2" class="ltx_p"><span id="A4.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;&quot;&quot;</span></span>
<span id="A4.p4.pic1.2.3" class="ltx_p"><span id="A4.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a ‘m x n’ matrix ‘grid’ consisting of non-negative integers where ‘grid[row][col]‘ represents the minimum time required to be able to visit the cell ‘(row, col)’, which means you can visit the cell ‘(row, col)’ only when the time you visit it is greater than or equal to ‘grid[row][col]’.</span></span>
<span id="A4.p4.pic1.2.4" class="ltx_p"><span id="A4.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are standing in the top-left cell of the matrix in the ‘0th’ second, and you must move to any adjacent cell in the four directions: up, down, left, and right. Each move you make takes 1 second.
Return the minimum time required in which you can visit the bottom-right cell of the matrix. If you cannot visit the bottom-right cell, then return ‘-1’.</span></span>
<span id="A4.p4.pic1.2.5" class="ltx_p"><span id="A4.p4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 1:</span></span>
<span id="A4.p4.pic1.2.6" class="ltx_p"><span id="A4.p4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Input: grid = [[0,1,3,2],[5,1,2,5],[4,3,8,6]]</span></span>
<span id="A4.p4.pic1.2.7" class="ltx_p"><span id="A4.p4.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output: 7</span></span>
<span id="A4.p4.pic1.2.8" class="ltx_p"><span id="A4.p4.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Explanation:</span></span>
<span id="A4.p4.pic1.2.9" class="ltx_p"><span id="A4.p4.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">One of the paths that we can take is the following:</span></span>
<span id="A4.p4.pic1.2.10" class="ltx_p"><span id="A4.p4.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">- at t = 0, we are on the cell (0,0).</span></span>
<span id="A4.p4.pic1.2.11" class="ltx_p"><span id="A4.p4.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">- at t = 1, we move to the cell (0,1). It is possible because grid[0][1] &lt;= 1.</span></span>
<span id="A4.p4.pic1.2.12" class="ltx_p"><span id="A4.p4.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">- at t = 2, we move to the cell (1,1). It is possible because grid[1][1] &lt;= 2.</span></span>
<span id="A4.p4.pic1.2.13" class="ltx_p"><span id="A4.p4.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- at t = 3, we move to the cell (1,2). It is possible because grid[1][2] &lt;= 3.</span></span>
<span id="A4.p4.pic1.2.14" class="ltx_p"><span id="A4.p4.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">- at t = 4, we move to the cell (1,1). It is possible because grid[1][1] &lt;= 4.</span></span>
<span id="A4.p4.pic1.2.15" class="ltx_p"><span id="A4.p4.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">- at t = 5, we move to the cell (1,2). It is possible because grid[1][2] &lt;= 5.</span></span>
<span id="A4.p4.pic1.2.16" class="ltx_p"><span id="A4.p4.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">- at t = 6, we move to the cell (1,3). It is possible because grid[1][3] &lt;= 6.</span></span>
<span id="A4.p4.pic1.2.17" class="ltx_p"><span id="A4.p4.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">- at t = 7, we move to the cell (2,3). It is possible because grid[2][3] &lt;= 7.</span></span>
<span id="A4.p4.pic1.2.18" class="ltx_p"><span id="A4.p4.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">The final time is 7. It can be shown that it is the minimum time possible.</span></span>
<span id="A4.p4.pic1.2.19" class="ltx_p"><span id="A4.p4.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 2:</span></span>
<span id="A4.p4.pic1.2.20" class="ltx_p"><span id="A4.p4.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">Input: grid = [[0,2,4],[3,2,1],[1,0,4]]</span></span>
<span id="A4.p4.pic1.2.21" class="ltx_p"><span id="A4.p4.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output: -1</span></span>
<span id="A4.p4.pic1.2.22" class="ltx_p"><span id="A4.p4.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">Explanation:</span></span>
<span id="A4.p4.pic1.2.23" class="ltx_p"><span id="A4.p4.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">There is no path from the top left to the bottom-right cell. Constraints:</span></span>
<span id="A4.p4.pic1.2.24" class="ltx_p"><span id="A4.p4.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">* ‘m == grid.length’</span></span>
<span id="A4.p4.pic1.2.25" class="ltx_p"><span id="A4.p4.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">* ‘n == grid[i].length’</span></span>
<span id="A4.p4.pic1.2.26" class="ltx_p"><span id="A4.p4.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">* ‘2 &lt;= m, n &lt;= 1000’</span></span>
<span id="A4.p4.pic1.2.27" class="ltx_p"><span id="A4.p4.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">* ‘4 &lt;= m * n &lt;= 105’</span></span>
<span id="A4.p4.pic1.2.28" class="ltx_p"><span id="A4.p4.pic1.2.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">* ‘0 &lt;= grid[i][j] &lt;= 105’</span></span>
<span id="A4.p4.pic1.2.29" class="ltx_p"><span id="A4.p4.pic1.2.29.1" class="ltx_text" style="--ltx-fg-color:#000000;">* ‘grid[0][0] == 0’</span></span>
<span id="A4.p4.pic1.2.30" class="ltx_p"><span id="A4.p4.pic1.2.30.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;&quot;&quot;</span></span>
</span></span></span></foreignobject></g></g></svg>