<svg id="A5.SS2.p2.pic1" class="ltx_picture" height="525.4" overflow="visible" version="1.1" viewbox="0 0 477.38 525.4" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,525.4) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.98 L 0 516.41 C 0 521.37 4.02 525.4 8.98 525.4 L 468.4 525.4 C 473.36 525.4 477.38 521.37 477.38 516.41 L 477.38 8.98 C 477.38 4.02 473.36 0 468.4 0 L 8.98 0 C 4.02 0 0 4.02 0 8.98 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 8.98 L 1.11 516.41 C 1.11 520.76 4.63 524.29 8.98 524.29 L 468.4 524.29 C 472.74 524.29 476.27 520.76 476.27 516.41 L 476.27 8.98 C 476.27 4.63 472.74 1.11 468.4 1.11 L 8.98 1.11 C 4.63 1.11 1.11 4.63 1.11 8.98 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.92 11.67)"><foreignobject style="--ltx-fo-width:32.63em;--ltx-fo-height:36.48em;--ltx-fo-depth:0.19em;font-size:10pt;" height="507.44" overflow="visible" transform="matrix(1 0 0 -1 0 504.75)" width="451.51"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.63em;">
<span id="A5.SS2.p2.pic1.1.1" class="ltx_p"><span id="A5.SS2.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a <math id="A5.SS2.p2.pic1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>language<math id="A5.SS2.p2.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> programming expert specializing in GPU kernel optimization. Your task is to optimize a given <math id="A5.SS2.p2.pic1.m3" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>language<math id="A5.SS2.p2.pic1.m4" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> kernel.</span></span>
<span id="A5.SS2.p2.pic1.1.2" class="ltx_p"><span id="A5.SS2.p2.pic1.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Given kernel:<span id="A5.SS2.p2.pic1.1.2.1.1" class="ltx_text"></span></span></span>
<span id="A5.SS2.p2.pic1.1.3" class="ltx_p"><span id="A5.SS2.p2.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the <math id="A5.SS2.p2.pic1.m5" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>language<math id="A5.SS2.p2.pic1.m6" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> kernel that we tested:</span></span>
<span id="A5.SS2.p2.pic1.1.4" class="ltx_p"><math id="A5.SS2.p2.pic1.m7" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math><span id="A5.SS2.p2.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Code of best generated kernel<math id="A5.SS2.p2.pic1.m8" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math></span></span>
<span id="A5.SS2.p2.pic1.1.5" class="ltx_p"><span id="A5.SS2.p2.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">To optimize this kernel for specific hardware, please propose a templated kernel with some template parameters that can be tuned. To do so, you need to write an extension for PyTorch that implements a templated <math id="A5.SS2.p2.pic1.m9" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>language<math id="A5.SS2.p2.pic1.m10" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> kernel and a forward function for dispatching. Select suitable parameter options by adding them as dispatch-options in the forward function.
<br class="ltx_break"></span></span>
<span id="A5.SS2.p2.pic1.1.6" class="ltx_p"><span id="A5.SS2.p2.pic1.1.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Requirements:<span id="A5.SS2.p2.pic1.1.6.1.1" class="ltx_text"></span></span></span>
<span id="A5.I4" class="ltx_itemize">
<span id="A5.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i1.p1" class="ltx_para">
<span id="A5.I4.i1.p1.1" class="ltx_p"><span id="A5.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The kernel should be templated on suitable parameters, e.g., block size, etc.</span></span>
</span></span>
<span id="A5.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i2.p1" class="ltx_para">
<span id="A5.I4.i2.p1.1" class="ltx_p"><span id="A5.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The </span><span id="A5.I4.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">forward_templated</span><span id="A5.I4.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> function should launch the kernel with the given parameter values.</span></span>
</span></span>
<span id="A5.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i3.p1" class="ltx_para">
<span id="A5.I4.i3.p1.1" class="ltx_p"><span id="A5.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The </span><span id="A5.I4.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">forward</span><span id="A5.I4.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> function should have standard arguments corresponding to the template parameters of </span><span id="A5.I4.i3.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">forward_templated</span><span id="A5.I4.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, and should select the correct instantiation based on the input values.</span></span>
</span></span>
<span id="A5.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i4.p1" class="ltx_para">
<span id="A5.I4.i4.p1.1" class="ltx_p"><span id="A5.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The code must match the given kernel in functionality.</span></span>
</span></span>
<span id="A5.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i5.p1" class="ltx_para">
<span id="A5.I4.i5.p1.1" class="ltx_p"><span id="A5.I4.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The code should include a Pybind11 interface exposing </span><span id="A5.I4.i5.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">forward</span><span id="A5.I4.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
