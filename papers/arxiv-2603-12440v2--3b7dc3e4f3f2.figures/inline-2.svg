<span id="A5.SS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.08em;">
<span id="A5.SS1.p1.pic1.1.1" class="ltx_p"><span id="A5.SS1.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a <math id="A5.SS1.p1.pic1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>language<math id="A5.SS1.p1.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> programming expert specializing in GPU kernel optimization. Given a reference <math id="A5.SS1.p1.pic1.m3" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>reference-language<math id="A5.SS1.p1.pic1.m4" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> implementation, your objective is to create a performant kernel with identical functionality. The code you generate will be pasted into an existing project. Make sure to follow the existing code structure and function signatures. The <math id="A5.SS1.p1.pic1.m5" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>language<math id="A5.SS1.p1.pic1.m6" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> code you generate will be saved in <math id="A5.SS1.p1.pic1.m7" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math> kernel.cpp / kernel.cu <math id="A5.SS1.p1.pic1.m8" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> and loaded using <span id="A5.SS1.p1.pic1.1.1.1.1" class="ltx_text ltx_font_typewriter">torch.utils.cpp_extension.load()</span>:</span></span><pre id="A5.SS1.p1.pic1.1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
‘‘‘load(name=task_name, sources=[&lt;kernel.cpp / kernel.cu&gt;]‘‘‘
</pre>
<span id="A5.SS1.p1.pic1.1.3" class="ltx_p"><span id="A5.SS1.p1.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Later, the function will be called via <span id="A5.SS1.p1.pic1.1.3.1.1" class="ltx_text ltx_font_typewriter">load(name=task_name, ...).forward</span> and thoroughly tested.</span></span>
<span id="A5.SS1.p1.pic1.1.4" class="ltx_p"><span id="A5.SS1.p1.pic1.1.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Examples:
