<br class="ltx_break"><span id="A5.SS1.p1.pic1.1.7.1.1" class="ltx_text ltx_font_medium">Here is the last kernel we tested (Runtime: <math id="A5.SS1.p1.pic1.m25" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>last-kernel-runtime<math id="A5.SS1.p1.pic1.m26" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>):
