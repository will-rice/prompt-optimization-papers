<svg id="A10.SS5.p2.pic1" class="ltx_picture" height="461.75" overflow="visible" version="1.1" viewbox="0 0 653.15 461.75" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,461.75) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#E0E0E0;" fill="#E0E0E0" fill-opacity="1.0"><path style="stroke:none" d="M 0 6.23 L 0 455.52 C 0 458.96 2.79 461.75 6.23 461.75 L 646.92 461.75 C 650.36 461.75 653.15 458.96 653.15 455.52 L 653.15 6.23 C 653.15 2.79 650.36 0 646.92 0 L 6.23 0 C 2.79 0 0 2.79 0 6.23 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 3.46 6.23 L 3.46 418.05 L 649.69 418.05 L 649.69 6.23 C 649.69 4.7 648.45 3.46 646.92 3.46 L 6.23 3.46 C 4.7 3.46 3.46 4.7 3.46 6.23 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.4 428.14)"><foreignobject style="--ltx-fo-width:46.13em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="638.31"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A10.SS5.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.13em;">
<span id="A10.SS5.p2.pic1.1.1" class="ltx_p"><span id="A10.SS5.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Training Example  |  <span id="A10.SS5.p2.pic1.1.1.1.1" class="ltx_text ltx_font_smallcaps">MedQA</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.4 207.29)"><foreignobject style="--ltx-fo-width:55.08em;--ltx-fo-height:14.95em;--ltx-fo-depth:14.45em;font-size:10pt;" class="ltx_minipage" height="406.72" overflow="visible" transform="matrix(1 0 0 -1 0 206.82)" width="46.13em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<table id="A10.SS5.p2.pic1.2" class="ltx_tabular ltx_align_middle">
<tr id="A10.SS5.p2.pic1.2.1" class="ltx_tr" style="--ltx-bg-color:#EAF7EA;">
<td id="A10.SS5.p2.pic1.2.1.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS5.p2.pic1.2.1.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#EAF7EA;">
<span id="A10.SS5.p2.pic1.2.1.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS5.p2.pic1.2.1.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Privacy Metric:</span></span>
</span></td>
<td id="A10.SS5.p2.pic1.2.1.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS5.p2.pic1.2.1.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#EAF7EA;">
<span id="A10.SS5.p2.pic1.2.1.2.1.1" class="ltx_p"><span id="A10.SS5.p2.pic1.2.1.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Stylometric distance: we compute LUAR embeddings </span><cite class="ltx_cite ltx_citemacro_cite"><a href="#bib.bib25" title class="ltx_ref">Rivera-Soto et al. (2021)</a></cite><span id="A10.SS5.p2.pic1.2.1.2.1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> for both original and anonymized case descriptions using the LUAR model, and define privacy as </span><math id="A10.SS5.p2.pic1.m1" class="ltx_Math" alttext="1-\text{cosine\_similarity}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;--ltx-bg-color:#EAF7EA;" mathbackground="#EAF7EA" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#EAF7EA;" mathbackground="#EAF7EA" mathcolor="#000000">−</mo><mtext style="--ltx-fg-color:#000000;--ltx-bg-color:#EAF7EA;" mathbackground="#EAF7EA" mathcolor="#000000">cosine_similarity</mtext></mrow><annotation encoding="application/x-tex">1-\text{cosine\_similarity}</annotation></semantics></math><span id="A10.SS5.p2.pic1.2.1.2.1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">. Higher distance indicates successful style obfuscation.</span></span>
</span></td></tr>
<tr id="A10.SS5.p2.pic1.2.2" class="ltx_tr" style="--ltx-bg-color:#F5F5F7;">
<td id="A10.SS5.p2.pic1.2.2.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS5.p2.pic1.2.2.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#F5F5F7;">
<span id="A10.SS5.p2.pic1.2.2.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS5.p2.pic1.2.2.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Utility Metric:</span></span>
</span></td>
<td id="A10.SS5.p2.pic1.2.2.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS5.p2.pic1.2.2.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#F5F5F7;">
<span id="A10.SS5.p2.pic1.2.2.2.1.1" class="ltx_p"><span id="A10.SS5.p2.pic1.2.2.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Binary question-answering accuracy: an LLM (Listing </span><a href="#LST7" title="Listing 7 ‣ J.5 MedQA ‣ Appendix J Task Details ‣ Adaptive Text Anonymization: Learning Privacy-Utility Trade-offs via Prompt Optimization" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">7</span></a><span id="A10.SS5.p2.pic1.2.2.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">) selects the correct diagnosis from multiple-choice options based on the anonymized case description.</span></span>
</span></td></tr>
<tr id="A10.SS5.p2.pic1.2.3" class="ltx_tr" style="--ltx-bg-color:#FDECF3;">
<td id="A10.SS5.p2.pic1.2.3.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS5.p2.pic1.2.3.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#FDECF3;">
<span id="A10.SS5.p2.pic1.2.3.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS5.p2.pic1.2.3.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Data Sample:</span></span>
</span></td>
<td id="A10.SS5.p2.pic1.2.3.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS5.p2.pic1.2.3.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#FDECF3;">
<span id="A10.SS5.p2.pic1.2.3.2.1.1" class="ltx_p"><span id="A10.SS5.p2.pic1.2.3.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A 3-month-old baby died suddenly at night while asleep. His mother noticed that he had died only after she awoke in the morning. No cause of death was determined based on the autopsy. Which of the following precautions could have prevented the death of the baby?</span></span>
<span id="A10.SS5.p2.pic1.2.3.2.1.2" class="ltx_p ltx_align_left"><math id="A10.SS5.p2.pic1.m2" class="ltx_Math" alttext="\bullet" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000">∙</mo><annotation encoding="application/x-tex">\bullet</annotation></semantics></math><span id="A10.SS5.p2.pic1.2.3.2.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;"> Placing the infant in a supine position on a firm mattress while sleeping</span></span>
<span id="A10.SS5.p2.pic1.2.3.2.1.3" class="ltx_p ltx_align_left"><math id="A10.SS5.p2.pic1.m3" class="ltx_Math" alttext="\bullet" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000">∙</mo><annotation encoding="application/x-tex">\bullet</annotation></semantics></math><span id="A10.SS5.p2.pic1.2.3.2.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;"> Keeping the infant covered and maintaining a high room temperature</span></span>
<span id="A10.SS5.p2.pic1.2.3.2.1.4" class="ltx_p ltx_align_left"><math id="A10.SS5.p2.pic1.m4" class="ltx_Math" alttext="\bullet" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000">∙</mo><annotation encoding="application/x-tex">\bullet</annotation></semantics></math><span id="A10.SS5.p2.pic1.2.3.2.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;"> Application of a device to maintain the sleeping position</span></span>
<span id="A10.SS5.p2.pic1.2.3.2.1.5" class="ltx_p ltx_align_left"><math id="A10.SS5.p2.pic1.m5" class="ltx_Math" alttext="\bullet" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000">∙</mo><annotation encoding="application/x-tex">\bullet</annotation></semantics></math><span id="A10.SS5.p2.pic1.2.3.2.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;"> Avoiding pacifier use during sleep</span></span>
</span></td></tr>
<tr id="A10.SS5.p2.pic1.2.4" class="ltx_tr" style="--ltx-bg-color:#E6F2FF;">
<td id="A10.SS5.p2.pic1.2.4.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS5.p2.pic1.2.4.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#E6F2FF;">
<span id="A10.SS5.p2.pic1.2.4.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS5.p2.pic1.2.4.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Optimized Prompt (Mistral-Small):</span></span>
</span></td>
<td id="A10.SS5.p2.pic1.2.4.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS5.p2.pic1.2.4.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#E6F2FF;">
<span id="A10.SS5.p2.pic1.2.4.2.1.1" class="ltx_p"><span id="A10.SS5.p2.pic1.2.4.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert medical text anonymizer. </span><math id="A10.SS5.p2.pic1.m6" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS5.p2.pic1.2.4.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The ultimate goal is to maximize the “Privacy Score” (a measure of writing style dissimilarity – higher is better) without sacrificing the ability to infer the original diagnosis or solution.</span><math id="A10.SS5.p2.pic1.m7" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS5.p2.pic1.2.4.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Preserve Diagnostic/Problem-Solving Information: This is the most important aspect. Do not remove details crucial for diagnosis or answering the question. This includes symptoms, lab values, imaging results, family history, incidence rates, and the context of the presentation. The goal is to make it harder to identify the individual, not harder to arrive at the correct medical conclusion. </span><math id="A10.SS5.p2.pic1.m8" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS5.p2.pic1.2.4.2.1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> For questions, ensure the question remains logical and solvable after anonymization. The correct answer should still be obtainable if it was obtainable prior to anonymization. </span><math id="A10.SS5.p2.pic1.m9" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS5.p2.pic1.2.4.2.1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> Consider, *cautiously* and *only if it doesn’t impact medical accuracy*, replacing a specific biological term with a more general category (e.g., &quot;peripheral artery&quot; -&gt; &quot;blood vessel,&quot; &quot;lymph node&quot; -&gt; &quot;gland&quot;). </span><math id="A10.SS5.p2.pic1.m10" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS5.p2.pic1.2.4.2.1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> Specifically, avoid simply replacing “a 14-year-old boy” with “a patient&quot;. Try paraphrasing sentences to achieve a higher “Privacy Score”. </span><math id="A10.SS5.p2.pic1.m11" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math></span>
</span></td></tr>
</table></span></span></foreignobject></g></g></svg>