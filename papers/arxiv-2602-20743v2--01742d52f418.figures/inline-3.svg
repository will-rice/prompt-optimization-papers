<span id="A10.SS2.p2.pic1.2.2.2.1.1" class="ltx_p"><span id="A10.SS2.p2.pic1.2.2.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">ROUGE-1 F-measure between original and anonymized text.</span></span>
</span></td></tr>
<tr id="A10.SS2.p2.pic1.2.3" class="ltx_tr" style="--ltx-bg-color:#FDECF3;">
<td id="A10.SS2.p2.pic1.2.3.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS2.p2.pic1.2.3.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#FDECF3;">
<span id="A10.SS2.p2.pic1.2.3.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS2.p2.pic1.2.3.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Data Sample (target attribute: Wellington, New Zealand):</span></span>
</span></td>
<td id="A10.SS2.p2.pic1.2.3.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS2.p2.pic1.2.3.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#FDECF3;">
<span id="A10.SS2.p2.pic1.2.3.2.1.1" class="ltx_p"><span id="A10.SS2.p2.pic1.2.3.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Heard rumors ’bout some cheeky taniwha messin’ with boaters out on oriental bay – old stories die hard i reckon.</span></span>
</span></td></tr>
<tr id="A10.SS2.p2.pic1.2.4" class="ltx_tr" style="--ltx-bg-color:#E6F2FF;">
<td id="A10.SS2.p2.pic1.2.4.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS2.p2.pic1.2.4.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#E6F2FF;">
<span id="A10.SS2.p2.pic1.2.4.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS2.p2.pic1.2.4.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Optimized Prompt (Gemma 3):</span></span>
</span></td>
<td id="A10.SS2.p2.pic1.2.4.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS2.p2.pic1.2.4.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#E6F2FF;">
<span id="A10.SS2.p2.pic1.2.4.2.1.1" class="ltx_p"><span id="A10.SS2.p2.pic1.2.4.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert at anonymizing text while preserving its meaning and utility. </span><math id="A10.SS2.p2.pic1.m1" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS2.p2.pic1.2.4.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The goal is to remove potentially identifying information about a person, while maintaining the core meaning and sentiment of the original text as much as possible. A high utility is crucial. Here’s how to approach the anonymization: 1. Identify potentially identifying information: Look for details that could reveal someone’s occupation, location (city, country), or other private attributes. This includes: Specific job titles or roles (e.g., &quot;editing suite&quot;) References to niche hobbies or cultural practices specific to a region (e.g., &quot;kabuki&quot;, &quot;kite battles&quot;) – prioritize these for generalization or removal. Details about frequented locations, especially local spots (e.g., &quot;local spots&quot;, references to specific festivals). References to financial hardship or specific income levels (e.g. &quot;barely make ends meet&quot;). 2. Anonymize by generalization or removal: Generalization: Replace specific details with broader categories. For example: &quot;kabuki&quot; -&gt; &quot;performance art&quot; &quot;editing suite&quot; -&gt; &quot;workplace&quot; or simply “a work environment” </span><math id="A10.SS2.p2.pic1.m2" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS2.p2.pic1.2.4.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Prioritize retaining the overall message. 3. Preserve Utility: Strive to maintain the original meaning and intent of the text as much as possible. Your goal is to reduce identifiability, not to rewrite the text. </span><math id="A10.SS2.p2.pic1.m3" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS2.p2.pic1.2.4.2.1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> 4. Avoid Over-Anonymization: </span><math id="A10.SS2.p2.pic1.m4" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS2.p2.pic1.2.4.2.1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> 5. Context Matters: Pay attention to the context. Combine seemingly innocuous details can become identifying if combined. Important Considerations: Retain conversational elements like &quot;lol&quot; and expressions of emotion unless a specific detail is too revealing. </span><math id="A10.SS2.p2.pic1.m5" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math></span>
</span></td></tr>
</table></span></span></foreignobject></g></g></svg>