</span></td>
<td id="A10.SS2.p2.pic1.2.1.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS2.p2.pic1.2.1.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#EAF7EA;">
<span id="A10.SS2.p2.pic1.2.1.2.1.1" class="ltx_p"><span id="A10.SS2.p2.pic1.2.1.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Binary re-identification metric: an attacker LLM attempts to infer the target demographic attribute from both original and anonymized text, and a verifier LLM (Listing </span><a href="#LST4" title="Listing 4 ‣ J.2 SynthPAI ‣ Appendix J Task Details ‣ Adaptive Text Anonymization: Learning Privacy-Utility Trade-offs via Prompt Optimization" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">4</span></a><span id="A10.SS2.p2.pic1.2.1.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">) checks if the inferences match. Privacy score is 1.0 if the inferences differ (successful anonymization), 0.0 otherwise.</span></span>
</span></td></tr>
