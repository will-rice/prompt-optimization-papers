<span id="A10.SS4.p2.pic1.2.1.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#EAF7EA;">
<span id="A10.SS4.p2.pic1.2.1.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS4.p2.pic1.2.1.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Privacy Metric:</span></span>
</span></td>
<td id="A10.SS4.p2.pic1.2.1.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS4.p2.pic1.2.1.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#EAF7EA;">
<span id="A10.SS4.p2.pic1.2.1.2.1.1" class="ltx_p"><span id="A10.SS4.p2.pic1.2.1.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">LLM judge (Listing </span><a href="#LST5" title="Listing 5 ‣ J.4 PUPA ‣ Appendix J Task Details ‣ Adaptive Text Anonymization: Learning Privacy-Utility Trade-offs via Prompt Optimization" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">5</span></a><span id="A10.SS4.p2.pic1.2.1.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">) that counts PII units remaining in the anonymized query. We rely on an LLM judge following original work </span><cite class="ltx_cite ltx_citemacro_cite"><a href="#bib.bib14" title class="ltx_ref">Li et al. (2025)</a></cite><span id="A10.SS4.p2.pic1.2.1.2.1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> because ground truth labels contains annotated PII which correspond to celebrity names (which in this task is not considered private information).</span></span>
</span></td></tr>
<tr id="A10.SS4.p2.pic1.2.2" class="ltx_tr" style="--ltx-bg-color:#F5F5F7;">
<td id="A10.SS4.p2.pic1.2.2.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS4.p2.pic1.2.2.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#F5F5F7;">
<span id="A10.SS4.p2.pic1.2.2.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS4.p2.pic1.2.2.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Utility Metric:</span></span>
</span></td>
<td id="A10.SS4.p2.pic1.2.2.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS4.p2.pic1.2.2.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#F5F5F7;">
<span id="A10.SS4.p2.pic1.2.2.2.1.1" class="ltx_p"><span id="A10.SS4.p2.pic1.2.2.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Generating responses to both original and anonymized queries using </span><img src="arxiv-2602-20743v2--01742d52f418.figures/figure-4.webp" id="A10.SS4.p2.pic1.g1" class="ltx_graphics ltx_img_square" style="aspect-ratio:13/13;" width="13" height="13" alt="[Uncaptioned image]"><span id="A10.SS4.p2.pic1.2.2.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Gemini-2.5-flash, then comparing response quality via an LLM judge (Listing </span><a href="#LST6" title="Listing 6 ‣ J.4 PUPA ‣ Appendix J Task Details ‣ Adaptive Text Anonymization: Learning Privacy-Utility Trade-offs via Prompt Optimization" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">6</span></a><span id="A10.SS4.p2.pic1.2.2.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></td></tr>
<tr id="A10.SS4.p2.pic1.2.3" class="ltx_tr" style="--ltx-bg-color:#FDECF3;">
<td id="A10.SS4.p2.pic1.2.3.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS4.p2.pic1.2.3.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#FDECF3;">
<span id="A10.SS4.p2.pic1.2.3.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS4.p2.pic1.2.3.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Data Sample:</span></span>
</span></td>
<td id="A10.SS4.p2.pic1.2.3.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS4.p2.pic1.2.3.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#FDECF3;">
<span id="A10.SS4.p2.pic1.2.3.2.1.1" class="ltx_p"><span id="A10.SS4.p2.pic1.2.3.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Hi Salar/ Waqas, Well noted. We will arrange for testing once receive the board samples you sent. Would you please also advise the demand and delivery location for measure jig (one free jig per factory location), so that we can send them to you as soon as possible. Thanks for your attention to this matter</span></span>
<span id="A10.SS4.p2.pic1.2.3.2.1.2" class="ltx_p"><span id="A10.SS4.p2.pic1.2.3.2.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">是什么意思</span></span>
</span></td></tr>
<tr id="A10.SS4.p2.pic1.2.4" class="ltx_tr" style="--ltx-bg-color:#E6F2FF;">
<td id="A10.SS4.p2.pic1.2.4.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS4.p2.pic1.2.4.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#E6F2FF;">
<span id="A10.SS4.p2.pic1.2.4.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS4.p2.pic1.2.4.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Optimized Prompt (Qwen3):</span></span>
</span></td>
<td id="A10.SS4.p2.pic1.2.4.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS4.p2.pic1.2.4.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#E6F2FF;">
<span id="A10.SS4.p2.pic1.2.4.2.1.1" class="ltx_p"><span id="A10.SS4.p2.pic1.2.4.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an assistant tasked with processing text and producing a modified version of it based on specific instructions. Task Description: Given a field called ‘text‘, your goal is to produce a new field called ‘anonymized_text‘. </span><math id="A10.SS4.p2.pic1.m1" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS4.p2.pic1.2.4.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The tasks can vary widely, from simple redaction to complex rephrasing, translation, or code modification. The type of modification needed is determined by the nature of the input text. </span><math id="A10.SS4.p2.pic1.m2" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS4.p2.pic1.2.4.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> PII Redaction/Generalization: Identify and protect PII. This may include, but is not limited to: Names of people and organizations (e.g., &quot;St. Maryś Church&quot;, &quot;Hermawan DataTables&quot;, &quot;Lille Université Club&quot;, &quot;Marcq-en-baroeul basketball club&quot;). Replace specific names with generic placeholders (e.g., &quot;Church&quot;, &quot;DataTables library&quot;, &quot;a university club&quot;, &quot;a town basketball club&quot;). </span><math id="A10.SS4.p2.pic1.m3" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS4.p2.pic1.2.4.2.1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> Consider generalization (e.g., &quot;aged 18 to 45&quot; can often remain unchanged, but specific birthdates should be removed). Code snippets containing sensitive information (API keys, specific URLs). Any other data that could be used to identify an individual. </span><math id="A10.SS4.p2.pic1.m4" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS4.p2.pic1.2.4.2.1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> When the input is code (e.g., CodeIgniter 4 code snippet), maintain the code’s functionality. Replace specific library names or project-specific details with generic equivalents. Do not alter the code’s behavior unless explicitly requested. </span><math id="A10.SS4.p2.pic1.m5" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS4.p2.pic1.2.4.2.1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> Focus on anonymizing project-specific names (e.g. controller/method names) </span><math id="A10.SS4.p2.pic1.m6" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS4.p2.pic1.2.4.2.1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> The responses will be evaluated on the level of PII leakage. Aim for a 0% leakage rate whenever possible. </span><math id="A10.SS4.p2.pic1.m7" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math></span>
</span></td></tr>
</table></span></span></foreignobject></g></g></svg>