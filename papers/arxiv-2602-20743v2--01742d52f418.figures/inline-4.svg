<span id="A10.SS3.p2.pic1.2.2.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#F5F5F7;">
<span id="A10.SS3.p2.pic1.2.2.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS3.p2.pic1.2.2.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Utility Metric:</span></span>
</span></td>
<td id="A10.SS3.p2.pic1.2.2.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS3.p2.pic1.2.2.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#F5F5F7;">
<span id="A10.SS3.p2.pic1.2.2.2.1.1" class="ltx_p"><span id="A10.SS3.p2.pic1.2.2.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Semantic similarity using a cross-encoder model (</span><span id="A10.SS3.p2.pic1.2.2.2.1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">cross-encoder/stsb-roberta-base</span><span id="A10.SS3.p2.pic1.2.2.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) that computes similarity scores between original and anonymized documents.</span></span>
</span></td></tr>
<tr id="A10.SS3.p2.pic1.2.3" class="ltx_tr" style="--ltx-bg-color:#FDECF3;">
<td id="A10.SS3.p2.pic1.2.3.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS3.p2.pic1.2.3.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#FDECF3;">
<span id="A10.SS3.p2.pic1.2.3.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS3.p2.pic1.2.3.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Data Sample:</span></span>
</span></td>
<td id="A10.SS3.p2.pic1.2.3.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS3.p2.pic1.2.3.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#FDECF3;">
<span id="A10.SS3.p2.pic1.2.3.2.1.1" class="ltx_p"><span id="A10.SS3.p2.pic1.2.3.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">PROCEDURE</span></span>
<span id="A10.SS3.p2.pic1.2.3.2.1.2" class="ltx_p"><span id="A10.SS3.p2.pic1.2.3.2.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The case originated in an application (no. 38007/02) against the Republic of Poland lodged with the Court under Article 34 of the Convention for the Protection of Human Rights and Fundamental Freedoms (“the Convention”) by a Polish national, Mr Artur Warsiński (“the applicant”), on 3 October 2002. The Polish Government (“the Government”) were represented by their Agent, Mr J. Wołąsiewicz of the Ministry of Foreign Affairs. </span><math id="A10.SS3.p2.pic1.m1" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math></span>
<span id="A10.SS3.p2.pic1.2.3.2.1.3" class="ltx_p"><span id="A10.SS3.p2.pic1.2.3.2.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">THE CIRCUMSTANCES OF THE CASE</span></span>
<span id="A10.SS3.p2.pic1.2.3.2.1.4" class="ltx_p"><span id="A10.SS3.p2.pic1.2.3.2.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">The criminal proceedings against the applicant. The applicant, Mr Artur Warsiński, is a Polish national who was born in 1976 and lives in Bytów. The applicant was charged with drug trafficking and detained on remand from 6 April 2002 to 21 May 2004. He was detained in the Słupsk Detention Centre. On 28 May 2003 the Słupsk Regional Court found the applicant guilty of drug trafficking and sentenced him to three years’ imprisonment. </span><math id="A10.SS3.p2.pic1.m2" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS3.p2.pic1.2.3.2.1.4.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The envelope also bears a stamp of the Słupsk Regional Court. On 4 December 2002 the applicant sent another letter to the European Court of Human Rights. It was received by the Court on 17 December 2002. It bears a stamp “censored on”, a handwritten date “4 December” and an illegible signature. The envelope also bears a stamp of the Słupsk Regional Court. </span><math id="A10.SS3.p2.pic1.m3" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS3.p2.pic1.2.3.2.1.4.3" class="ltx_text" style="--ltx-fg-color:#000000;"> On 30 June 2003 he received a letter from the President of the Słupsk Regional Court informing him that, according to the information obtained from the Criminal Department of the Słupsk Regional Court, the applicant’s correspondence had not been censored. He further stated that the applicant’s correspondence had been stamped “censored” by mistake.</span></span>
</span></td></tr>
<tr id="A10.SS3.p2.pic1.2.4" class="ltx_tr" style="--ltx-bg-color:#E6F2FF;">
<td id="A10.SS3.p2.pic1.2.4.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS3.p2.pic1.2.4.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#E6F2FF;">
<span id="A10.SS3.p2.pic1.2.4.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS3.p2.pic1.2.4.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Optimized Prompt (Qwen3):</span></span>
</span></td>
<td id="A10.SS3.p2.pic1.2.4.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS3.p2.pic1.2.4.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#E6F2FF;">
<span id="A10.SS3.p2.pic1.2.4.2.1.1" class="ltx_p"><span id="A10.SS3.p2.pic1.2.4.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are to perform a rigorous, context-aware, and deterministic anonymization of legal or judicial documents using a multi-layered strategy derived from verified best practices and iteratively refined through real-world feedback. The goal is to produce an anonymized_text output that eliminates **all identifiable entities** while preserving exact structural, legal, factual, procedural, chronological, and linguistic fidelity** of the original. </span><math id="A10.SS3.p2.pic1.m4" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS3.p2.pic1.2.4.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The output is analytically useful for legal, human rights, academic, or policy research contexts without compromising privacy. </span><math id="A10.SS3.p2.pic1.m5" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS3.p2.pic1.2.4.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> All replacements must be deterministic and consistent throughout the text: Individuals - Full names → Always ‘[REDACTED]‘ if gender unspecified. </span><math id="A10.SS3.p2.pic1.m6" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS3.p2.pic1.2.4.2.1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> Legal professionals → Replace with: - ‘a lawyer practising in [TOWN]‘ - ‘a representative of [INSTITUTION]‘ - ‘a judge at the [CITY] Court of Appeal‘ - Do **not** use abbreviations (e.g., “R.K.” → ‘[REDACTED]‘ only). </span><math id="A10.SS3.p2.pic1.m7" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS3.p2.pic1.2.4.2.1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> 1. Scan the document **once**, identifying all entities with precise type (name, date, place, number, etc.). 2. Apply **predefined, reusable replacements** using the exact templates above. </span><math id="A10.SS3.p2.pic1.m8" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS3.p2.pic1.2.4.2.1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> 7. **Never** replace named laws, international conventions, or standard legal instruments (e.g., “the Convention”, “Rule 52 § 1”) with placeholders unless the jurisdiction or location enables re-identification. </span><math id="A10.SS3.p2.pic1.m9" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS3.p2.pic1.2.4.2.1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> 10. Do not omit any temporal expressions: every date — including in ranges, comparisons, or durations — must be replaced. Output only the fully anonymized text in the ‘anonymized_text‘ field. No explanations.</span></span>
</span></td></tr>
</table></span></span></foreignobject></g></g></svg>