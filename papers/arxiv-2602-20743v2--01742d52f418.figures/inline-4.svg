</span></td>
<td id="A10.SS3.p2.pic1.2.1.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS3.p2.pic1.2.1.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#EAF7EA;">
<span id="A10.SS3.p2.pic1.2.1.2.1.1" class="ltx_p"><span id="A10.SS3.p2.pic1.2.1.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Entity masking recall: the fraction of gold-annotated sensitive spans that no longer appear in the anonymized text.</span></span>
</span></td></tr>
