</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.4 230.86)"><foreignobject style="--ltx-fo-width:55.08em;--ltx-fo-height:16.65em;--ltx-fo-depth:16.15em;font-size:10pt;" class="ltx_minipage" height="453.84" overflow="visible" transform="matrix(1 0 0 -1 0 230.38)" width="46.13em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<table id="A10.SS1.p2.pic1.2" class="ltx_tabular ltx_align_middle">
<tr id="A10.SS1.p2.pic1.2.1" class="ltx_tr" style="--ltx-bg-color:#EAF7EA;">
<td id="A10.SS1.p2.pic1.2.1.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS1.p2.pic1.2.1.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#EAF7EA;">
<span id="A10.SS1.p2.pic1.2.1.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS1.p2.pic1.2.1.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Privacy Metric:</span></span>
</span></td>
<td id="A10.SS1.p2.pic1.2.1.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS1.p2.pic1.2.1.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#EAF7EA;">
<span id="A10.SS1.p2.pic1.2.1.2.1.1" class="ltx_p"><span id="A10.SS1.p2.pic1.2.1.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Binary re-identification metric: an attacker LLM (Listing </span><a href="#LST2" title="Listing 2 ‣ J.1 DB-Bio ‣ Appendix J Task Details ‣ Adaptive Text Anonymization: Learning Privacy-Utility Trade-offs via Prompt Optimization" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">2</span></a><span id="A10.SS1.p2.pic1.2.1.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">) proposes the top-3 most likely celebrity names based on the anonymized biography. Privacy score is 1.0 if the true identity is not in the top-3, 0.0 otherwise.</span></span>
</span></td></tr>
<tr id="A10.SS1.p2.pic1.2.2" class="ltx_tr" style="--ltx-bg-color:#F5F5F7;">
<td id="A10.SS1.p2.pic1.2.2.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS1.p2.pic1.2.2.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#F5F5F7;">
<span id="A10.SS1.p2.pic1.2.2.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS1.p2.pic1.2.2.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Utility Metric:</span></span>
</span></td>
<td id="A10.SS1.p2.pic1.2.2.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS1.p2.pic1.2.2.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#F5F5F7;">
<span id="A10.SS1.p2.pic1.2.2.2.1.1" class="ltx_p"><span id="A10.SS1.p2.pic1.2.2.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Binary classification accuracy: a classifier LLM (Listing </span><a href="#LST3" title="Listing 3 ‣ J.1 DB-Bio ‣ Appendix J Task Details ‣ Adaptive Text Anonymization: Learning Privacy-Utility Trade-offs via Prompt Optimization" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">3</span></a><span id="A10.SS1.p2.pic1.2.2.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">) predicts the person’s occupation from the anonymized text.</span></span>
</span></td></tr>
<tr id="A10.SS1.p2.pic1.2.3" class="ltx_tr" style="--ltx-bg-color:#FDECF3;">
<td id="A10.SS1.p2.pic1.2.3.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS1.p2.pic1.2.3.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#FDECF3;">
<span id="A10.SS1.p2.pic1.2.3.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS1.p2.pic1.2.3.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Data Sample:</span></span>
</span></td>
<td id="A10.SS1.p2.pic1.2.3.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS1.p2.pic1.2.3.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#FDECF3;">
<span id="A10.SS1.p2.pic1.2.3.2.1.1" class="ltx_p"><span id="A10.SS1.p2.pic1.2.3.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Geoffrey Harber Diggle (6 December 1902 – 13 February 1993) was a British chess player and writer. Diggle contributed articles to the British Chess Magazine (BCM) from 1933 to 1981, Alexander called Diggle &quot;one of the best writers on chess that I know&quot;. In his A Book of Chess, Alexander reproduced in toto Diggle’s account, first published in the November and December 1943 BCM, of the de facto 1843 world championship match between Staunton and St. Amant. </span><math id="A10.SS1.p2.pic1.m1" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS1.p2.pic1.2.3.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Diggle later adopted the sobriquet as a pseudonym, writing a series of articles in Newsflash under that name between 1974 and 1986. Chess historian Edward Winter wrote the following in his remembrance of Diggle in CHESS magazine: Specializing in nineteenth-century chess history (particularly the Staunton period), he brought the old masters to life with rare wit and shrewdness. </span><math id="A10.SS1.p2.pic1.m2" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#FDECF3;" mathbackground="#FDECF3" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math></span>
</span></td></tr>
<tr id="A10.SS1.p2.pic1.2.4" class="ltx_tr" style="--ltx-bg-color:#E6F2FF;">
<td id="A10.SS1.p2.pic1.2.4.1" class="ltx_td ltx_align_left ltx_align_top" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS1.p2.pic1.2.4.1.1" class="ltx_inline-block ltx_align_top" style="width:65.4pt;--ltx-bg-color:#E6F2FF;">
<span id="A10.SS1.p2.pic1.2.4.1.1.1" class="ltx_p ltx_align_left"><span id="A10.SS1.p2.pic1.2.4.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Optimized Prompt (Mistral-Small):</span></span>
</span></td>
<td id="A10.SS1.p2.pic1.2.4.2" class="ltx_td ltx_align_left" style="padding-top:2pt;padding-bottom:2pt;">
<span id="A10.SS1.p2.pic1.2.4.2.1" class="ltx_inline-block ltx_align_top" style="--ltx-bg-color:#E6F2FF;">
<span id="A10.SS1.p2.pic1.2.4.2.1.1" class="ltx_p"><math id="A10.SS1.p2.pic1.m3" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS1.p2.pic1.2.4.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> Anonymize the given text by redacting all personally identifiable information (PII) while ensuring: 1. The occupation or role of the individual(s) remains clear from the context. 2. The text remains useful and coherent for its intended purpose. 3. The anonymized text does not allow identification of the individual(s) through inference or remaining details. </span><math id="A10.SS1.p2.pic1.m4" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS1.p2.pic1.2.4.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Guidelines 1. Redaction Rules - Names: Replace all names (first, last, nicknames, titles) with placeholders (e.g., ‘[Name]‘, ‘[Nickname]‘, ‘[Lastname]‘). - Dates: Replace specific dates, years, or ranges with placeholders. - Locations: Replace cities, states, countries, and specific addresses with placeholders. - Organizations: </span><math id="A10.SS1.p2.pic1.m5" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS1.p2.pic1.2.4.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> 2. Preservation Rules - Occupation/Role: Ensure the individual’s profession or role is still inferable (e.g., &quot;cyclist,&quot; &quot;diplomat,&quot; &quot;racing driver&quot;). </span><math id="A10.SS1.p2.pic1.m6" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS1.p2.pic1.2.4.2.1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> - Multiple Individuals: Redact all names and identifiers for all mentioned individuals. </span><math id="A10.SS1.p2.pic1.m7" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS1.p2.pic1.2.4.2.1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> - Unique Achievements: Redact specific achievements (e.g., &quot;gold medal in 2004 Olympics&quot;) to prevent identification. - Scandals/Controversies: Redact details of scandals or controversies that could uniquely identify the individual. </span><math id="A10.SS1.p2.pic1.m8" class="ltx_Math" alttext="[...]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;--ltx-bg-color:#E6F2FF;" mathbackground="#E6F2FF" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[...]</annotation></semantics></math><span id="A10.SS1.p2.pic1.2.4.2.1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> Strategy 1. Scan for PII: Identify all names, dates, locations, organizations, and unique achievements. 2. Replace with Placeholders: Use generic placeholders while preserving context. 3. Validate: Check for identifiability and utility.</span></span>
</span></td></tr>
</table></span></span></foreignobject></g></g></svg>