<span id="S5.SS4.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.62em;">
<span id="S5.SS4.p4.pic1.1.1" class="ltx_p"><span id="S5.SS4.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Takeaway 4:<span id="S5.SS4.p4.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Local improvement is not the same as search progress.
Failures-only has the lowest mean rounds for both targets, while No-examples
leads in parent-improvement rank but not best-improvement rank. Evaluate how
often reflection advances the best prompt, not just whether it beats its parent.</span></span></span>
