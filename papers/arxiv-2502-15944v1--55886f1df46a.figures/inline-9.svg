</span>
<span id="A4.p1.pic1.2.5" class="ltx_p"><span id="A4.p1.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">CoT:<span id="A4.p1.pic1.2.5.1.1" class="ltx_text"></span></span></span>
