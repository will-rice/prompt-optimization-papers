<span id="A4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.24em;">
<span id="A4.p2.pic1.1.1" class="ltx_p"><span id="A4.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Example of the SimpleQA dataset</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 96.8)"><foreignobject style="--ltx-fo-width:46.24em;--ltx-fo-height:9.06em;--ltx-fo-depth:6em;font-size:10pt;" height="208.4" overflow="visible" transform="matrix(1 0 0 -1 0 125.38)" width="639.83"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:46.24em;">
<span id="A4.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.p2.pic1.p1.1" class="ltx_p"><span id="A4.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt at initialization:</span></span>
</span>
<span id="A4.p2.pic1.p2" class="ltx_para">
<span id="A4.p2.pic1.p2.1" class="ltx_p"><span id="A4.p2.pic1.p2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You will answer a general-knowledge question on $topic topic. Always conclude the last line of your response should be of the following format: ’Answer: $VALUE’ where VALUE is a $answer_type value.”<span id="A4.p2.pic1.p2.1.1.1" class="ltx_text"></span></span></span>
<span id="A4.p2.pic1.p2.2" class="ltx_p"><span id="A4.p2.pic1.p2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt refined by PAPO:<span id="A4.p2.pic1.p2.2.1.1" class="ltx_text"></span></span></span>
<span id="A4.p2.pic1.p2.3" class="ltx_p"><span id="A4.p2.pic1.p2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You will answer a general-knowledge question. Restate the question in your own words to ensure understanding. Compare it with the examples provided above, note any shared entities and relations. Reason through the composition using evidence from both the question and demonstrations. Cross Check your conclusion, ensure it does not contradict any high confidence example. Always conclude the last line of your response should be of the following format: ’Answer: $VALUE’ where VALUE is a $answer_type value.”<span id="A4.p2.pic1.p2.3.1.1" class="ltx_text"></span></span></span>
</span></span></span></span></foreignobject></g></g></svg>