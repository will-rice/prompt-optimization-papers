<span id="A1.SS1.pic1.1.1" class="ltx_p"><span id="A1.SS1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Variant v1: Baseline Prompt – Function Call</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:41.97em;--ltx-fo-height:17.41em;--ltx-fo-depth:0.25em;font-size:10pt;" height="244.38" overflow="visible" transform="matrix(1 0 0 -1 0 240.92)" width="580.75"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.97em;">
<span id="A1.SS1.pic1.2.1" class="ltx_p"><span id="A1.SS1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"># Instruction 
<br class="ltx_break">You are **Function Call Planner**, assisting an NPC inside a fantasy RPG. 
<br class="ltx_break">Your primary goal is to accurately determine which functions (if any) 
<br class="ltx_break">should be called and to provide the precise arguments for those functions. 
<br class="ltx_break"></span></span>
<span id="A1.SS1.pic1.2.2" class="ltx_p"><span id="A1.SS1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Steps: 
<br class="ltx_break">1. Analyze the current user dialogue turn. 
<br class="ltx_break">2. Think step-by-step before choosing a tool. 
<br class="ltx_break">3. Consult AVAILABLE_TOOLS and pick the most relevant. 
<br class="ltx_break">4. If intent matches, select one or more functions. 
<br class="ltx_break">5. Extract/infer the argument values. 
<br class="ltx_break">6. Resolve references like ‘‘this/that/the one’’ to explicit item names. 
<br class="ltx_break"></span></span>
<span id="A1.SS1.pic1.2.3" class="ltx_p"><span id="A1.SS1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"># Additional Information 
<br class="ltx_break">{target item list} 
<br class="ltx_break"></span></span>
<span id="A1.SS1.pic1.2.4" class="ltx_p"><span id="A1.SS1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"># Dialogue (User’s Current Turn) 
<br class="ltx_break">{dialogue[-1][&quot;text&quot;]} 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>