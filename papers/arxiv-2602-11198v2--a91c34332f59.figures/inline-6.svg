idth="151"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A6.F9.pic1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#1FFAA3;">CLAUDE.md (Condensed)</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 10.72)"><foreignobject style="--ltx-fo-width:44.48em;--ltx-fo-height:31.63em;--ltx-fo-depth:0.16em;font-size:10pt;" height="439.79" overflow="visible" transform="matrix(1 0 0 -1 0 437.64)" width="615.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.48em;">
<span id="A6.F9.pic1.2.1" class="ltx_p"><span id="A6.F9.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;"># PropBank SQL Agent
<br class="ltx_break" style="--ltx-break-space:2.2pt;">
Maps database schemas to PropBank rolesets via multi-agent systems.
<br class="ltx_break" style="--ltx-break-space:2.9pt;">
## Dev Commands
<br class="ltx_break" style="--ltx-break-space:1.5pt;">
uv add &lt;package&gt; # add dependency
<br class="ltx_break">uv run python main.py --framework &lt;name&gt; # run agent
<br class="ltx_break">uv run pytest tests/ # run tests
<br class="ltx_break" style="--ltx-break-space:2.9pt;">
## Architecture: Agent-as-a-Tool
<br class="ltx_break" style="--ltx-break-space:1.5pt;">
Query -&gt; [Orchestrator] -&gt; [Coordinator/Mapper] x N -&gt; Results
<br class="ltx_break" style="--ltx-break-space:2.9pt;">
## Agent Hierarchy
<br class="ltx_break" style="--ltx-break-space:1.5pt;">
- <span id="A6.F9.pic1.2.1.1.1" class="ltx_text ltx_font_bold">Orchestrator</span>: workflow (tools: run_coordinator, run_mapper)
<br class="ltx_break">- <span id="A6.F9.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Coordinator</span>: analyzes DDL (tools: filesystem read-only)
<br class="ltx_break">- <span id="A6.F9.pic1.2.1.1.3" class="ltx_text ltx_font_bold">Mapper</span>: maps tables (tools: filesystem, PropBank MCP)
<br class="ltx_break" style="--ltx-break-space:2.9pt;">
## Critical Requirement
<br class="ltx_break" style="--ltx-break-space:1.5pt;">
<span id="A6.F9.pic1.2.1.1.4" class="ltx_text ltx_font_bold">Use LLM orchestration, NOT Python loops.
<br class="ltx_break"></span>Orchestrator must decide workflow via tool calls, not asyncio.gather().
<br class="ltx_break" style="--ltx-break-space:2.9pt;">
## MCP Servers
<br class="ltx_break" style="--ltx-break-space:1.5pt;">
PropBank: search_by_lemma(), search_by_sense_id()
<br class="ltx_break" style="--ltx-break-space:2.9pt;">
## Task
<br class="ltx_break" style="--ltx-break-space:1.5pt;">
Complete database_mapper.py. Do NOT edit main.py or prompts.py.

</span></span>
