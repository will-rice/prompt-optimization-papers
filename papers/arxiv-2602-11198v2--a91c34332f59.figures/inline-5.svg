" width="137.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A3.F8.pic1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#009900;">GetActionVerbs Prompt</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 10.72)"><foreignobject style="--ltx-fo-width:44.48em;--ltx-fo-height:22.03em;--ltx-fo-depth:0.16em;font-size:10pt;" height="306.95" overflow="visible" transform="matrix(1 0 0 -1 0 304.8)" width="615.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.F8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.48em;">
<span id="A3.F8.pic1.2.1" class="ltx_p"><span id="A3.F8.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">You are a database semantic analysis and PropBank expert. Generate a diverse, non-redundant set of verb candidates that describe the distinct real-world actions recorded by a given database table. …</span></span>
<span id="A3.F8.pic1.2.2" class="ltx_p"><span id="A3.F8.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">## Instructions<span id="A3.F8.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A3.F8.pic1.2.3" class="ltx_p"><span id="A3.F8.pic1.2.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">1. Core Action Identification
<br class="ltx_break"><span id="A3.F8.pic1.2.3.1.1" class="ltx_text ltx_font_medium">Ask: What real-world actions does this table RECORD or TRACK?
<br class="ltx_break">Example: Table orders → order, request, fulfill, cancel, return
</span></span></span>
<span id="A3.F8.pic1.2.4" class="ltx_p"><span id="A3.F8.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">2. Action Diversity (Avoid Synonyms)
<br class="ltx_break"><span id="A3.F8.pic1.2.4.1.1" class="ltx_text ltx_font_medium">Do NOT include lexical variants (e.g., buy/purchase/acquire).
<br class="ltx_break">Favor verbs differing along: intent vs execution, initiation vs completion
</span></span></span>
<span id="A3.F8.pic1.2.5" class="ltx_p"><span id="A3.F8.pic1.2.5.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">3. Temporal &amp; Causal Sequencing
<br class="ltx_break"><span id="A3.F8.pic1.2.5.1.1" class="ltx_text ltx_font_medium">Consider: initiation (submit, request) → modification (update) → resolution (complete, cancel)
</span></span></span>
<span id="A3.F8.pic1.2.6" class="ltx_p"><span id="A3.F8.pic1.2.6.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">4. Domain-Aware Reasoning
<br class="ltx_break"><span id="A3.F8.pic1.2.6.1.1" class="ltx_text ltx_font_medium">E-commerce → checkout, fulfill, refund | Healthcare → diagnose, prescribe
</span></span></span>
<span id="A3.F8.pic1.2.7" class="ltx_p"><span id="A3.F8.pic1.2.7.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">## Output<span id="A3.F8.pic1.2.7.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A3.F8.pic1.2.8" class="ltx_p"><span id="A3.F8.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Return requested number of verbs as a simple list (base-form, no explanations)

</span></span>
</span></span></span></foreignobject></g></g></svg>