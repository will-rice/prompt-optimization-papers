<span id="A1.F6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.46em;">
<span id="A1.F6.pic1.1.1" class="ltx_p"><span id="A1.F6.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Forward Propagation: Successor Instruction</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:47.46em;--ltx-fo-height:24.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="344.39" overflow="visible" transform="matrix(1 0 0 -1 0 341.7)" width="656.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.46em;">
<span id="A1.F6.pic1.2.1" class="ltx_p"><span id="A1.F6.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Objective:<span id="A1.F6.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Generate instructions for successor agent <math id="A1.F6.pic1.m1" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math> from agent <math id="A1.F6.pic1.m2" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>’s input and output, and <math id="A1.F6.pic1.m3" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math>’s system prompt. 
<br class="ltx_break"></span>Template:<span id="A1.F6.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are an instruction generator for multi-agent systems. Create clear, specific instructions. 
<br class="ltx_break"></span>User Prompt:<span id="A1.F6.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Generate an instruction for the successor agent: 
<br class="ltx_break">CURRENT AGENT INPUT: <span id="A1.F6.pic1.2.1.1.3.1" class="ltx_text ltx_font_typewriter">{input_instruction}</span> 
<br class="ltx_break">CURRENT AGENT TOOL RESULT: <span id="A1.F6.pic1.2.1.1.3.2" class="ltx_text ltx_font_typewriter">{tool_result}</span> 
<br class="ltx_break">SUCCESSOR AGENT SYSTEM PROMPT: <span id="A1.F6.pic1.2.1.1.3.3" class="ltx_text ltx_font_typewriter">{successor.system_prompt}</span> 
<br class="ltx_break">SUCCESSOR AGENT ID: <span id="A1.F6.pic1.2.1.1.3.4" class="ltx_text ltx_font_typewriter">{successor.agent_id}</span> 
<br class="ltx_break">Requirements: 1. Actionable instruction. 2. Align with the successor’s capabilities. 3. Transfer relevant context. 4. Be concise. 
<br class="ltx_break"></span>Example:<span id="A1.F6.pic1.2.1.1.4" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Input: “Population of Tesla’s headquarters city?” 
<br class="ltx_break">Tool Result: “Tesla Inc. headquarters: Austin, Texas.” 
<br class="ltx_break">Successor Prompt: “You are a data retrieval agent.” 
<br class="ltx_break">Output: “Retrieve Austin, Texas population.”</span></span></span>
</span></span></span></foreignobject></g></g></svg>