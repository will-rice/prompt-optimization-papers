<span id="A1.F9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.46em;">
<span id="A1.F9.pic1.2.1" class="ltx_p"><span id="A1.F9.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Objective:<span id="A1.F9.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Update system prompt and tool function based on feedback. 
<br class="ltx_break"></span>Template:<span id="A1.F9.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Generate an improved system prompt. 
<br class="ltx_break"></span>User Prompt:<span id="A1.F9.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Current variable: <span id="A1.F9.pic1.2.1.1.3.1" class="ltx_text ltx_font_typewriter">{system_prompt}</span> 
<br class="ltx_break">Role: <span id="A1.F9.pic1.2.1.1.3.2" class="ltx_text ltx_font_typewriter">AI agent system prompt</span> 
<br class="ltx_break">Gradients: <span id="A1.F9.pic1.2.1.1.3.3" class="ltx_text ltx_font_typewriter">{feedback[’system_prompt_feedback’]}</span> 
<br class="ltx_break">Output: <span id="A1.F9.pic1.2.1.1.3.4" class="ltx_text ltx_font_typewriter">&lt;IMPROVED_VARIABLE&gt;{prompt}&lt;/IMPROVED_VARIABLE&gt;</span> 
<br class="ltx_break"></span>Example:<span id="A1.F9.pic1.2.1.1.4" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Current Prompt: “You are a reasoning agent.” 
<br class="ltx_break">Feedback: “Specify entity extraction.” 
<br class="ltx_break">Output: <span id="A1.F9.pic1.2.1.1.4.1" class="ltx_text ltx_font_typewriter">&lt;IMPROVED_VARIABLE&gt;You are a reasoning agent specializing in extracting entities (<span id="A1.F9.pic1.2.1.1.4.1.1" class="ltx_text ltx_font_italic">e.g.</span>, locations).&lt;/IMPROVED_VARIABLE&gt;</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>