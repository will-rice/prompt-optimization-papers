</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.85)"><foreignobject style="--ltx-fo-width:47.46em;--ltx-fo-height:25.89em;--ltx-fo-depth:0.22em;font-size:10pt;" height="361.38" overflow="visible" transform="matrix(1 0 0 -1 0 358.31)" width="656.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F10.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.46em;">
<span id="A1.F10.pic1.2.1" class="ltx_p"><span id="A1.F10.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Objective:<span id="A1.F10.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Decide agent <math id="A1.F10.pic1.m1" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>’s local topology changes. 
<br class="ltx_break"></span>Template:<span id="A1.F10.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are a network topology optimizer. 
<br class="ltx_break"></span>User Prompt:<span id="A1.F10.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Current Agent Role: <span id="A1.F10.pic1.2.1.1.3.1" class="ltx_text ltx_font_typewriter">{system_prompt}...</span> 
<br class="ltx_break">Feedback: <span id="A1.F10.pic1.2.1.1.3.2" class="ltx_text ltx_font_typewriter">{feedback}</span> 
<br class="ltx_break">Successor Count: <span id="A1.F10.pic1.2.1.1.3.3" class="ltx_text ltx_font_typewriter">{len(successors)}</span> 
<br class="ltx_break">Task Parallelizability: <span id="A1.F10.pic1.2.1.1.3.4" class="ltx_text ltx_font_typewriter">{parallelizability}</span> 
<br class="ltx_break">Options: 
<br class="ltx_break">- ADD_PARALLEL: [New agent description] 
<br class="ltx_break">- ADD_SERIAL: [New agent description] 
<br class="ltx_break">- REMOVE_SUCCESSOR: [Successor to remove] 
<br class="ltx_break">- NO_CHANGE: [Reason] 
<br class="ltx_break"></span>Example:<span id="A1.F10.pic1.2.1.1.4" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Feedback: “Needs parallel subtasks.” 
<br class="ltx_break">Output: <span id="A1.F10.pic1.2.1.1.4.1" class="ltx_text ltx_font_typewriter">ADD_PARALLEL: Data retrieval agent</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>