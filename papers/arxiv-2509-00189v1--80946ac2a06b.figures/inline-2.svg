<span id="A1.F7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.46em;">
<span id="A1.F7.pic1.1.1" class="ltx_p"><span id="A1.F7.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Backward Propagation: System Feedback</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.85)"><foreignobject style="--ltx-fo-width:47.46em;--ltx-fo-height:24.69em;--ltx-fo-depth:0.22em;font-size:10pt;" height="344.78" overflow="visible" transform="matrix(1 0 0 -1 0 341.7)" width="656.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.46em;">
<span id="A1.F7.pic1.2.1" class="ltx_p"><span id="A1.F7.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Objective:<span id="A1.F7.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Generate system feedback from environmental feedback and agent outputs. 
<br class="ltx_break"></span>Template:<span id="A1.F7.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are an output aggregator generating feedback for predecessors based on environmental outcomes. 
<br class="ltx_break"></span>User Prompt:<span id="A1.F7.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Generate feedback for: 
<br class="ltx_break">PREDECESSOR: <span id="A1.F7.pic1.2.1.1.3.1" class="ltx_text ltx_font_typewriter">predecessor agents</span> 
<br class="ltx_break">SUCCESSOR: <span id="A1.F7.pic1.2.1.1.3.2" class="ltx_text ltx_font_typewriter">Aggregator {aggregator_id}</span> 
<br class="ltx_break">SUCCESSOR FEEDBACK: <span id="A1.F7.pic1.2.1.1.3.3" class="ltx_text ltx_font_typewriter">{loss_grad}</span> 
<br class="ltx_break">CONTEXT: <span id="A1.F7.pic1.2.1.1.3.4" class="ltx_text ltx_font_typewriter">Final result: {final_result[:200]}...</span> 
<br class="ltx_break">Output: <span id="A1.F7.pic1.2.1.1.3.5" class="ltx_text ltx_font_typewriter">&lt;FEEDBACK&gt;{feedback}&lt;/FEEDBACK&gt;</span> 
<br class="ltx_break"></span>Example:<span id="A1.F7.pic1.2.1.1.4" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Loss Gradient: “Inaccurate population.” 
<br class="ltx_break">Final Result: “Austin population: 950,000.” 
<br class="ltx_break">Output: <span id="A1.F7.pic1.2.1.1.4.1" class="ltx_text ltx_font_typewriter">&lt;FEEDBACK&gt;Use recent sources for Austin’s population.&lt;/FEEDBACK&gt;</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>