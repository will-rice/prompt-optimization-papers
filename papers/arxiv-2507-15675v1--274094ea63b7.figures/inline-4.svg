</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 70.42)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:12.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="179" overflow="visible" transform="matrix(1 0 0 -1 0 175.54)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S7.SS7.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="S7.SS7.p1.pic1.2.1" class="ltx_p"><span id="S7.SS7.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System<span id="S7.SS7.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium">: You are a proficient prompt engineer. Your task is to add a complementary instruction at the end of the user’s prompt to enhance the quality of responses from a large language model. 
<br class="ltx_break"></span></span></span>
<span id="S7.SS7.p1.pic1.2.2" class="ltx_p"><span id="S7.SS7.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Note: 
<br class="ltx_break">1. The instruction should serve as a guidance for the answer, providing feasible direction and thought process, but not revealing the answer itself. 
<br class="ltx_break">2. The complementary instruction should focus on general methodology. Try to keep it short and concise. 
<br class="ltx_break">3. The complementary instruction should be in the same language with the user prompt. 
<br class="ltx_break">4. When generating your response, the complementary instruction should be bracketed with &lt;INS&gt; and &lt;/INS&gt;.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="29.56" overflow="visible" transform="matrix(1 0 0 -1 0 26.1)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
