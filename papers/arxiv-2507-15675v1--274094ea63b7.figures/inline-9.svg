<span id="S7.SS7.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="S7.SS7.p6.pic1.1.1" class="ltx_p"><span id="S7.SS7.p6.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Meta Prompt for System Prompt Optimization</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:15.09em;--ltx-fo-depth:0.25em;font-size:10pt;" height="212.32" overflow="visible" transform="matrix(1 0 0 -1 0 208.86)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S7.SS7.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="S7.SS7.p6.pic1.2.1" class="ltx_p"><span id="S7.SS7.p6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a large language model prompt engineer responsible for completing prompt optimization tasks by using historical prompt optimization records to derive more effective prompts. 
<br class="ltx_break"></span></span>
<span id="S7.SS7.p6.pic1.2.2" class="ltx_p"><span id="S7.SS7.p6.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are some historically optimized prompts along with their scores. The score range is from 0 to 10, with higher scores indicating better quality. 
<br class="ltx_break">
<br class="ltx_break">{examplers} 
<br class="ltx_break"></span></span>
<span id="S7.SS7.p6.pic1.2.3" class="ltx_p"><span id="S7.SS7.p6.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Important Notes: 
<br class="ltx_break">1. Analyze the evolution patterns and score trends of historical prompts, and summarize the effective optimization rules. 
<br class="ltx_break">2. Based on the summarized optimization rules, generate a new prompt that is superior than all the previous ones. 
<br class="ltx_break">3. There is always a piece of complementary instruction in user queries, which provide hints to solve the queries. Make sure to make good use of this information. 
<br class="ltx_break">4. The newly generated prompt must be bracketed with &lt;INS&gt; and &lt;/INS&gt; tags.</span></span>
</span></span></span></foreignobject></g></g></svg>