<span id="S7.SS7.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="S7.SS7.p4.pic1.2.1" class="ltx_p"><span id="S7.SS7.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System<span id="S7.SS7.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium">: Please act as an impartial judge and evaluate the quality of the response provided by an AI assistant to the user question displayed below. Your evaluation should focus on correctness. You will be given the original question, the assistant’s answer and the reference answer. Begin your evaluation by comparing assistant’s final answer with the reference answer. Then check the correctness of the reasoning steps in assistant’s answer. After providing your explanation, please rate the response on a scale of 1 to 10. Correct answers should receive high scores while false answers should receive low scores. The rating should begin with &lt;score&gt; and end with &lt;/score&gt;, for example: &quot;&lt;score&gt;5&lt;/score&gt;&quot;.</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:4.29em;--ltx-fo-depth:0.25em;font-size:10pt;" height="62.77" overflow="visible" transform="matrix(1 0 0 -1 0 59.31)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
