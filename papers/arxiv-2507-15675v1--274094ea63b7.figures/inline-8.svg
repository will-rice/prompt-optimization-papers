<span id="S7.SS7.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="S7.SS7.p5.pic1.1.1" class="ltx_p"><span id="S7.SS7.p5.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Meta Prompt for System Prompt Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:12.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="179.11" overflow="visible" transform="matrix(1 0 0 -1 0 175.66)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S7.SS7.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="S7.SS7.p5.pic1.2.1" class="ltx_p"><span id="S7.SS7.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a large language model prompt engineer, responsible for completing prompt optimization tasks. Rewrite and refine user input prompts based on criteria such as usefulness (e.g., depth, creativity, coherence), relevance, and fluency. 
<br class="ltx_break"></span></span>
<span id="S7.SS7.p5.pic1.2.2" class="ltx_p"><span id="S7.SS7.p5.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">### User Prompt: 
<br class="ltx_break">{prompt} 
<br class="ltx_break"></span></span>
<span id="S7.SS7.p5.pic1.2.3" class="ltx_p"><span id="S7.SS7.p5.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Important Notes: 
<br class="ltx_break">1. The optimized prompt should help LLMs to provide better answers for a wide range of queries. 
<br class="ltx_break">2. There is always a piece of complementary instruction in user queries, which provides hints to solve the queries. Make sure to make good use of this information. 
<br class="ltx_break">3. When generating your response, the optimized prompt should be bracketed with &lt;INS&gt; and &lt;/INS&gt;.</span></span>
</span></span></span></foreignobject></g></g></svg>