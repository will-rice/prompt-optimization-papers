<span id="S7.SS7.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="S7.SS7.p2.pic1.1.1" class="ltx_p"><span id="S7.SS7.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Meta Prompt for Complement Optimization</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:12.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="179.11" overflow="visible" transform="matrix(1 0 0 -1 0 175.66)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S7.SS7.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="S7.SS7.p2.pic1.2.1" class="ltx_p"><span id="S7.SS7.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to generate an instruction as a complementary text for the user prompt. 
<br class="ltx_break"></span></span>
<span id="S7.SS7.p2.pic1.2.2" class="ltx_p"><span id="S7.SS7.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">### User prompt: 
<br class="ltx_break">{prompt} 
<br class="ltx_break"></span></span>
<span id="S7.SS7.p2.pic1.2.3" class="ltx_p"><span id="S7.SS7.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are some previous instructions with their scores. The score ranges from 0 to 10. Higher score indicates higher quality. 
<br class="ltx_break"></span></span>
<span id="S7.SS7.p2.pic1.2.4" class="ltx_p"><span id="S7.SS7.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Examples: 
<br class="ltx_break">{examplers} 
<br class="ltx_break"></span></span>
<span id="S7.SS7.p2.pic1.2.5" class="ltx_p"><span id="S7.SS7.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now generate a new complementary instruction that is superior than all the instructions above. The instruction should serve as a guidance for the answer, providing feasible direction and thought process, but not revealing the answer itself. Try to keep it short and concise. The complementary instruction should begin with &lt;INS&gt; and end with &lt;/INS&gt;.</span></span>
</span></span></span></foreignobject></g></g></svg>