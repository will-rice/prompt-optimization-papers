<span id="A2.F12.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_inline-block"><svg id="A2.F12.pic1.p1.pic1" class="ltx_picture" color="#000000" height="103.2" overflow="visible" version="1.1" viewbox="0 0 606.3 103.2" width="606.3"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,103.2) matrix(1 0 0 -1 0 0) translate(-19.69,0)"><g style="--ltx-fill-color:#ECD9EC;" fill="#ECD9EC" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 103.2 L 625.98 103.2 L 625.98 0 Z" /></g><g style="--ltx-fill-color:#ECD9EC;" fill="#ECD9EC" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 101.23 L 624.02 101.23 L 624.02 1.97 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 19.68 73.05)"><foreignobject style="--ltx-fo-width:42.4em;--ltx-fo-height:1.89em;--ltx-fo-depth:4.99em;font-size:10pt;" height="95.32" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="586.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F12.pic1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.4em;">
<span id="A2.F12.pic1.p1.pic1.1.1" class="ltx_p"><span id="A2.F12.pic1.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FF8000;">You are a bandit algorithm in a room with 5 buttons labeled blue, green, red, yellow, purple.</span>
<span id="A2.F12.pic1.p1.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#008080;">Each button is associated with a Bernoulli distribution with a fixed but unknown mean; the means for the buttons could be different. For each button, when you press it, you will get a reward that is sampled from the button’s associated distribution. You have 100 time steps and, on each time step, you can choose any button and receive the reward. Your goal is to maximize the total reward over the 100 time steps.</span></span>
</span></span></span></foreignobject></g></g></svg>