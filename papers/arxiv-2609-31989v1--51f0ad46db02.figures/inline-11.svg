<span id="A1.SS1.p2.pic1.1.2" class="ltx_p"><span id="A1.SS1.p2.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p2.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A1.SS1.p2.pic1.1.2.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
