<span id="S3.SS5.SSS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.43em;">
<span id="S3.SS5.SSS2.p2.pic1.1.1" class="ltx_p"><span id="S3.SS5.SSS2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#6E6E6E;">HARNESS (fixed text, never optimized) · Grace’s; <span id="S3.SS5.SSS2.p2.pic1.1.1.1.1" class="ltx_text ltx_font_smallcaps">PVGame</span></span></span>
<span id="S3.SS5.SSS2.p2.pic1.1.2" class="ltx_p"><span id="S3.SS5.SSS2.p2.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p2.pic1.1.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p2.pic1.p1.1" class="ltx_p">### spec/receiver.reason</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p2.pic1.1.3" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p2.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p2.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS2.p2.pic1.1.3.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p2.pic1.p2.1" class="ltx_p">Messages are exactly 8 characters long, and every character is one of these 2: rd. Objects are exactly 3 characters long, and every character is one of these 6: qzbvkj. You will also be shown a numbered list of 20 candidate objects, exactly one of which is the object the sender meant. Work out which of the 20 candidates the sender meant – the answer is always one of them, never an object outside the list (refer to it by its 3 object characters or its number). In your history, reward 1 means you picked the correct object, reward 0 means you did not. Each history row also lists the candidates you were shown that turn.</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p2.pic1.1.4" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p2.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p2.pic1.1.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="S3.SS5.SSS2.p2.pic1.1.5" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p2.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p2.pic1.1.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p2.pic1.p4.1" class="ltx_p">### spec/receiver.answer</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p2.pic1.1.6" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p2.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p2.pic1.1.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS2.p2.pic1.1.6.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p2.pic1.p5" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p2.pic1.p5.1" class="ltx_p">Messages are exactly 8 characters long, and every character is one of these 2: rd. Objects are exactly 3 characters long, and every character is one of these 6: qzbvkj. You will also be shown a numbered list of 20 candidate objects, exactly one of which is the object the sender meant. Your answer must be ONE of those candidates – choose it and put its 3 object characters in your guess field, with no spaces (you may instead give its number). Do not output an object that is not in the list. In your history, reward 1 means you picked the correct object, reward 0 means you did not. Each history row also lists the candidates you were shown that turn.</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p2.pic1.1.7" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p2.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p2.pic1.1.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="S3.SS5.SSS2.p2.pic1.1.8" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p2.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p2.pic1.1.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p2.pic1.p7" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p2.pic1.p7.1" class="ltx_p">### window/OUTCOME_LEGEND</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p2.pic1.1.9" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p2.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p2.pic1.1.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS2.p2.pic1.1.9.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
