<span id="S3.SS5.SSS1.p2.pic1.p5.1" class="ltx_p">Objects are exactly 3 characters long, and every character is one of these 6: jkqvbz. Messages are exactly 8 characters long, and every character is one of these 2: rd. Your message field must contain exactly 8 message characters and nothing else, with no spaces. A partner who sees only your message must reconstruct the object. In your history, reward 1 means the object was reconstructed correctly, reward 0 means it was not.</span>
