<span id="S3.SS5.SSS3.p2.pic1.p13" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS3.p2.pic1.p13.1" class="ltx_p">Read the inputs carefully and identify the input format and infer detailed task description about the task I wish to solve with the assistant.</span>
</span></span></span></span>
<span id="S3.SS5.SSS3.p2.pic1.1.15" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS3.p2.pic1.1.15.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS3.p2.pic1.1.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="S3.SS5.SSS3.p2.pic1.1.16" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS3.p2.pic1.1.16.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS3.p2.pic1.1.16.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS3.p2.pic1.1.16.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS3.p2.pic1.p15" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS3.p2.pic1.p15.1" class="ltx_p">Read all the assistant responses and the corresponding feedback. Identify all niche and domain specific factual information about the task and include it in the instruction, as a lot of it may not be available to the assistant in the future. The assistant may have utilized a generalizable strategy to solve the task, if so, include that in the instruction as well.</span>
</span></span></span></span>
<span id="S3.SS5.SSS3.p2.pic1.1.17" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS3.p2.pic1.1.17.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS3.p2.pic1.1.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
