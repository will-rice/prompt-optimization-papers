<span id="S3.SS5.SSS3.p2.pic1.p11.1" class="ltx_p">Your task is to write a new instruction for the assistant.</span>
</span></span></span></span>
<span id="S3.SS5.SSS3.p2.pic1.1.13" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS3.p2.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS3.p2.pic1.1.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
