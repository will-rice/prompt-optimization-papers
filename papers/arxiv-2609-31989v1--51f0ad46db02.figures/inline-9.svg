<span id="S4.F10.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:13.68em;">
<span id="S4.F10.p1.pic1.1.1" class="ltx_p"><span id="S4.F10.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#8A4B2F;">RECEIVER · REASON GENE (optimizable) · partial run, seed 16; excerpt</span></span>
<span id="S4.F10.p1.pic1.1.2" class="ltx_p"><span id="S4.F10.p1.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p1.pic1.1.2.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p1.1" class="ltx_p">## CRITICAL: The decoding rule (verified from history — use this, do NOT invent new theories)</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.3" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p1.pic1.1.3.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p2.1" class="ltx_p">Split the 8-char message into three groups by POSITION:</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.4" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p1.pic1.1.4.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p3.1" class="ltx_p">- Group A = chars 1-2-3  -&gt; object letter 1</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.5" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p1.pic1.1.5.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p4.1" class="ltx_p">- Group B = chars 4-5-6  -&gt; object letter 2</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.6" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p1.pic1.1.6.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p5" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p5.1" class="ltx_p">- Group C = chars 7-8    -&gt; object letter 3</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.7" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:136.8pt;"></span></span></span>
<span id="S4.F10.p1.pic1.1.8" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p1.pic1.1.8.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p7.1" class="ltx_p">Treat ’p’ = 0 and ’w’ = 1, reading each group as a binary number (leftmost char = most significant bit).</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.9" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:136.8pt;"></span></span></span>
<span id="S4.F10.p1.pic1.1.10" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p1.pic1.1.10.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p9" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p9.1" class="ltx_p">### Group A and Group B (3 bits, values 0-7) use this letter map (CONFIRMED from history):</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.11" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p10" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p10.1" class="ltx_p">000 (ppp) -&gt; x</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.12" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p11" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p11.1" class="ltx_p">001 (ppw) -&gt; z</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.13" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p12" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p12.1" class="ltx_p">010 (pwp) -&gt; j</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.14" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.14.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p13" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p13.1" class="ltx_p">011 (pww) -&gt; k</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.15" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.15.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p14" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p14.1" class="ltx_p">100 (wpp) -&gt; q</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.16" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.16.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p15" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p15.1" class="ltx_p">110 (wwp) -&gt; b</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.17" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.17.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p16" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p16.1" class="ltx_p">[…]</span>
</span></span></span></span>
<span id="S4.F10.p1.pic1.1.18" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p1.pic1.1.18.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p1.pic1.1.18.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p1.pic1.1.18.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p1.pic1.p17" class="ltx_para ltx_noindent">
<span id="S4.F10.p1.pic1.p17.1" class="ltx_p">Because Group C (only 2 bits) and ’www’ are ambiguous in history, DO NOT rely on a single fixed letter for them. Instead decode Groups A and B firmly (they are the most reliable), then use the candidate list to resolve Group C and any ambiguity.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>