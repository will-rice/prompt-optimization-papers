<span id="A2.SS3.p2.pic1.1.6" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A2.SS3.p2.pic1.1.6.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p5" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p5.1" class="ltx_p">This is a clean positional/base-N encoding. The recommended, easy-to-invert rule:</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.7" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="A2.SS3.p2.pic1.1.8" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A2.SS3.p2.pic1.1.8.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p7" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p7.1" class="ltx_p">- Assign each object character its index in the ALPHABET ORDER given by the spec:</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.9" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p8" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p8.1" class="ltx_p">x=0, z=1, j=2, k=3, q=4, b=5   (base-6 digits)</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.10" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A2.SS3.p2.pic1.1.10.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p9" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p9.1" class="ltx_p">- Treat the object as a base-6 number with the FIRST character as the MOST</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.11" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p10" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p10.1" class="ltx_p">significant digit.</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.12" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p11" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p11.1" class="ltx_p">- Convert to a decimal value (0..215).</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.13" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A2.SS3.p2.pic1.1.13.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p12" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p12.1" class="ltx_p">- Express that value as an 8-bit binary number, MOST significant bit first,</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.14" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.14.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p13" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p13.1" class="ltx_p">LEFT-padded with zeros to exactly 8 bits.</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.15" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.15.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p14" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p14.1" class="ltx_p">- Map bits to message chars: 0 -&gt; p, 1 -&gt; w.</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.16" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.16.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="A2.SS3.p2.pic1.1.17" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.17.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A2.SS3.p2.pic1.1.17.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p16" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p16.1" class="ltx_p">Decoder reverses: read 8 message chars as bits (p=0,w=1), interpret as an 8-bit</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.18" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.18.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.18.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A2.SS3.p2.pic1.1.18.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p17" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p17.1" class="ltx_p">binary number MSB-first, convert to decimal, then write it in base 6 as a</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.19" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.19.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.19.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A2.SS3.p2.pic1.1.19.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p18" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p18.1" class="ltx_p">3-digit number (left-pad with leading x’s / 0s), and map each digit back via</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.20" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.20.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p19" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p19.1" class="ltx_p">x=0,z=1,j=2,k=3,q=4,b=5.</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.21" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.21.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="A2.SS3.p2.pic1.1.22" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.22.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.22.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A2.SS3.p2.pic1.1.22.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p21" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p21.1" class="ltx_p">This IS one-to-one (each of the 216 objects gets a distinct value 0..215, hence a</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.23" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.23.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.23.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p22" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p22.1" class="ltx_p">distinct 8-bit pattern). Verify no collision by construction.</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.24" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.24.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.24.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
