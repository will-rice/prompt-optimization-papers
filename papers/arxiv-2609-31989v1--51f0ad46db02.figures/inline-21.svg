<span id="A2.SS3.p2.pic1.p24" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p24.1" class="ltx_p">Worked example (&quot;jzb&quot;): j=2, z=1, b=5 -&gt; 2*36 + 1*6 + 5 = 83 -&gt;</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.26" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.26.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.26.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A2.SS3.p2.pic1.1.26.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p25" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p25.1" class="ltx_p">83 = 01010011 binary -&gt; p w p w p p w w  (check: 64+16+2+1=83). This is a</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.27" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.27.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.27.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A2.SS3.p2.pic1.p26" class="ltx_para ltx_noindent">
<span id="A2.SS3.p2.pic1.p26.1" class="ltx_p">distinct code for a distinct object.</span>
</span></span></span></span>
<span id="A2.SS3.p2.pic1.1.28" class="ltx_p" style="width:314.3pt;"><span id="A2.SS3.p2.pic1.1.28.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A2.SS3.p2.pic1.1.28.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
