<span id="A1.SS1.p8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.43em;">
<span id="A1.SS1.p8.pic1.1.1" class="ltx_p"><span id="A1.SS1.p8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#B5836B;">RECEIVER · ANSWER GENE · seed</span></span>
<span id="A1.SS1.p8.pic1.1.2" class="ltx_p"><span id="A1.SS1.p8.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p8.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A1.SS1.p8.pic1.1.2.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A1.SS1.p8.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS1.p8.pic1.p1.1" class="ltx_p">You are the receiver in a communication game. Below is a numbered list of CANDIDATE</span>
</span></span></span></span>
<span id="A1.SS1.p8.pic1.1.3" class="ltx_p" style="width:314.3pt;"><span id="A1.SS1.p8.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p8.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A1.SS1.p8.pic1.1.3.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A1.SS1.p8.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS1.p8.pic1.p2.1" class="ltx_p">objects and an analysis of which one the sender meant. Your only job is to COMMIT to one</span>
</span></span></span></span>
<span id="A1.SS1.p8.pic1.1.4" class="ltx_p" style="width:314.3pt;"><span id="A1.SS1.p8.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p8.pic1.1.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A1.SS1.p8.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS1.p8.pic1.p3.1" class="ltx_p">of the listed candidates.</span>
</span></span></span></span>
<span id="A1.SS1.p8.pic1.1.5" class="ltx_p" style="width:314.3pt;"><span id="A1.SS1.p8.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p8.pic1.1.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="A1.SS1.p8.pic1.1.6" class="ltx_p" style="width:314.3pt;"><span id="A1.SS1.p8.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p8.pic1.1.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A1.SS1.p8.pic1.1.6.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A1.SS1.p8.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.SS1.p8.pic1.p5.1" class="ltx_p">Answer with the candidate’s NUMBER. Every reply must be one of those numbers – there is</span>
</span></span></span></span>
<span id="A1.SS1.p8.pic1.1.7" class="ltx_p" style="width:314.3pt;"><span id="A1.SS1.p8.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p8.pic1.1.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A1.SS1.p8.pic1.1.7.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A1.SS1.p8.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.SS1.p8.pic1.p6.1" class="ltx_p">always an answer, and refusing or leaving it blank scores the same as being wrong.</span>
</span></span></span></span>
<span id="A1.SS1.p8.pic1.1.8" class="ltx_p" style="width:314.3pt;"><span id="A1.SS1.p8.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p8.pic1.1.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="A1.SS1.p8.pic1.1.9" class="ltx_p" style="width:314.3pt;"><span id="A1.SS1.p8.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p8.pic1.1.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A1.SS1.p8.pic1.1.9.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A1.SS1.p8.pic1.p8" class="ltx_para ltx_noindent">
<span id="A1.SS1.p8.pic1.p8.1" class="ltx_p">The analysis is often cut off before it reaches a conclusion. That is expected and is not</span>
</span></span></span></span>
<span id="A1.SS1.p8.pic1.1.10" class="ltx_p" style="width:314.3pt;"><span id="A1.SS1.p8.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p8.pic1.1.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A1.SS1.p8.pic1.1.10.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A1.SS1.p8.pic1.p9" class="ltx_para ltx_noindent">
<span id="A1.SS1.p8.pic1.p9.1" class="ltx_p">a reason to withhold an answer: pick the candidate it leans towards. Objects mentioned in the</span>
</span></span></span></span>
<span id="A1.SS1.p8.pic1.1.11" class="ltx_p" style="width:314.3pt;"><span id="A1.SS1.p8.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p8.pic1.1.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="A1.SS1.p8.pic1.1.11.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A1.SS1.p8.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS1.p8.pic1.p10.1" class="ltx_p">analysis or in past rows are NOT answers unless they appear in this rollout’s candidate</span>
</span></span></span></span>
<span id="A1.SS1.p8.pic1.1.12" class="ltx_p" style="width:314.3pt;"><span id="A1.SS1.p8.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p8.pic1.1.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="A1.SS1.p8.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS1.p8.pic1.p11.1" class="ltx_p">list. Do not redo the working.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>