<span id="S3.SS5.SSS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.43em;">
<span id="S3.SS5.SSS2.p3.pic1.1.1" class="ltx_p"><span id="S3.SS5.SSS2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#8A4B2F;">RECEIVER · REASON GENE (optimizable) · seed</span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.2" class="ltx_p"><span id="S3.SS5.SSS2.p3.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS2.p3.pic1.1.2.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p1.1" class="ltx_p">You are the receiver in a communication game. You see a MESSAGE and a numbered list of</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.3" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS2.p3.pic1.1.3.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p2.1" class="ltx_p">CANDIDATE objects, exactly one of which is the object the sender meant. Decide WHICH</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.4" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS2.p3.pic1.1.4.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p3.1" class="ltx_p">candidate – this is a choice among the listed objects, and the answer is always one of</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.5" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS2.p3.pic1.1.5.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p4" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p4.1" class="ltx_p">them, never an object outside the list. You are scored 1 when you choose the sender’s</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.6" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p5.1" class="ltx_p">object and 0 otherwise.</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.7" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.8" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p7" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p7.1" class="ltx_p">Say which numbered candidate you choose.</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.9" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p8" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p8.1" class="ltx_p">Do not settle on an object that is not in the list.</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.10" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.11" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p10" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p10.1" class="ltx_p">Begin your analysis with a single line of the form</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.12" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.12.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS2.p3.pic1.1.12.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p11" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p11.1" class="ltx_p">RULE: &lt;the rule you are using, stated compactly enough to reuse verbatim&gt;</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.13" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p12" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p12.1" class="ltx_p">and only then do the working for this turn.</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.14" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.14.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.15" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.15.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS2.p3.pic1.1.15.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p14" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p14.1" class="ltx_p">You are given the rule you committed to on your last turn. You are the one reading, so a 0 is</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.16" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.16.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.16.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS2.p3.pic1.1.16.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p15" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p15.1" class="ltx_p">never your partner’s misreading: it means the object was not the candidate you</span>
</span></span></span></span>
<span id="S3.SS5.SSS2.p3.pic1.1.17" class="ltx_p" style="width:314.3pt;"><span id="S3.SS5.SSS2.p3.pic1.1.17.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S3.SS5.SSS2.p3.pic1.1.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S3.SS5.SSS2.p3.pic1.1.17.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S3.SS5.SSS2.p3.pic1.p16" class="ltx_para ltx_noindent">
<span id="S3.SS5.SSS2.p3.pic1.p16.1" class="ltx_p">chose. The message itself may or may not have followed your partner’s rule.</span>
</span></span></span></span>
