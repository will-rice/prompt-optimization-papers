<span id="S4.F10.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:13.68em;">
<span id="S4.F10.p2.pic1.1.1" class="ltx_p"><span id="S4.F10.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#8A4B2F;">RECEIVER · REASON GENE (optimizable) · the full run, seed 8; excerpt</span></span>
<span id="S4.F10.p2.pic1.1.2" class="ltx_p"><span id="S4.F10.p2.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p2.pic1.1.2.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p1.1" class="ltx_p">STEP 1 - Turn the message into a number N.</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.3" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p2.pic1.1.3.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p2.1" class="ltx_p">Map p=0, w=1. Read the 8 characters as a binary number with the LEFTMOST char as</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.4" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p2.pic1.1.4.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p3.1" class="ltx_p">the MOST significant bit (weight 128), rightmost char weight 1. Sum the weights of</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.5" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p2.pic1.1.5.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p4.1" class="ltx_p">the ’w’ positions to get decimal N.</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.6" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p2.pic1.1.6.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p5" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p5.1" class="ltx_p">Position weights (left to right): 128, 64, 32, 16, 8, 4, 2, 1.</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.7" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p6" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p6.1" class="ltx_p">[…]</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.8" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p2.pic1.1.8.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p7" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p7.1" class="ltx_p">STEP 2 - Convert N to 3 base-6 digits (d1 d2 d3), most significant first:</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.9" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p8" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p8.1" class="ltx_p">d1 = N // 36</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.10" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p9" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p9.1" class="ltx_p">d2 = (N % 36) // 6</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.11" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p10" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p10.1" class="ltx_p">d3 = N % 6</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.12" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:136.8pt;"></span></span></span>
<span id="S4.F10.p2.pic1.1.13" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.F10.p2.pic1.1.13.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p12" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p12.1" class="ltx_p">STEP 3 - Map each base-6 digit (0..5) to a letter using this FIXED, VERIFIED table:</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.14" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.14.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p13" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p13.1" class="ltx_p">0 -&gt; x</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.15" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.15.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p14" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p14.1" class="ltx_p">1 -&gt; z</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.16" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.16.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p15" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p15.1" class="ltx_p">2 -&gt; j</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.17" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.17.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
<span id="S4.F10.p2.pic1.p16" class="ltx_para ltx_noindent">
<span id="S4.F10.p2.pic1.p16.1" class="ltx_p">3 -&gt; k</span>
</span></span></span></span>
<span id="S4.F10.p2.pic1.1.18" class="ltx_p" style="width:136.8pt;"><span id="S4.F10.p2.pic1.1.18.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:136.8pt;--ltx-fg-color:#000000;"><span id="S4.F10.p2.pic1.1.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:136.8pt;">
