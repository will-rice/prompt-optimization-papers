<span id="S4.SS3.SSS1.p3.pic1.p1.1" class="ltx_p">======================================================================</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.3" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.SS3.SSS1.p3.pic1.1.3.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p2.1" class="ltx_p">RECOMMENDED RULE (clean base-6 -&gt; base-2 encoding; lossless and decodable)</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.4" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.SS3.SSS1.p3.pic1.1.4.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p3.1" class="ltx_p">======================================================================</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.5" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.SS3.SSS1.p3.pic1.1.5.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p4" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p4.1" class="ltx_p">Use a positional number encoding. This guarantees a unique 8-bit message per</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.6" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p5.1" class="ltx_p">object and is trivially invertible.</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.7" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.8" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p7" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p7.1" class="ltx_p">1. Fix a digit value for each object character (a base-6 digit):</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.9" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p8" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p8.1" class="ltx_p">j=0, k=1, q=2, v=3, b=4, z=5</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.10" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.SS3.SSS1.p3.pic1.1.10.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p9" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p9.1" class="ltx_p">2. Interpret the 3-character object as a base-6 number, most significant digit</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.11" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p10" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p10.1" class="ltx_p">first:</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.12" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p11" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p11.1" class="ltx_p">N = d1 * 36 + d2 * 6 + d3</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.13" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.SS3.SSS1.p3.pic1.1.13.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p12" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p12.1" class="ltx_p">where d1,d2,d3 are the digit values of the object’s characters left-to-right.</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.14" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.14.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p13" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p13.1" class="ltx_p">N ranges from 0 to 215.</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.15" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.15.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p14" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p14.1" class="ltx_p">3. Convert N to an 8-bit binary number (0..255 fits in 8 bits), most</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.16" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.16.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p15" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p15.1" class="ltx_p">significant bit first. Write bit 1 as ’d’ and bit 0 as ’r’ (fix this</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.17" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.17.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p16" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p16.1" class="ltx_p">convention and keep it constant).</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.18" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.18.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p17" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p17.1" class="ltx_p">4. The resulting 8-character r/d string is the message.</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.19" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.19.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.20" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.20.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p19" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p19.1" class="ltx_p">Decoding (what the receiver does, and how you verify): read the 8 r/d</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.21" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.21.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p20" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p20.1" class="ltx_p">characters as an 8-bit binary number (d=1, r=0), get N, then recover</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.22" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.22.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.22.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.SS3.SSS1.p3.pic1.1.22.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p21" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p21.1" class="ltx_p">d1 = N // 36, d2 = (N // 6) % 6, d3 = N % 6, and map digits back to characters.</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.23" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.23.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.23.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:314.3pt;"></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.24" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.24.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.24.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.SS3.SSS1.p3.pic1.1.24.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p23" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p23.1" class="ltx_p">This mapping is a bijection on all 216 objects, so distinct objects always get</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.25" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.25.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.25.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.SS3.SSS1.p3.pic1.1.25.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p24" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p24.1" class="ltx_p">distinct messages. Repeated object characters are handled automatically (they</span>
</span></span></span></span>
<span id="S4.SS3.SSS1.p3.pic1.1.26" class="ltx_p" style="width:314.3pt;"><span id="S4.SS3.SSS1.p3.pic1.1.26.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.26.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
<span id="S4.SS3.SSS1.p3.pic1.p25" class="ltx_para ltx_noindent">
<span id="S4.SS3.SSS1.p3.pic1.p25.1" class="ltx_p">just repeat their digit value).</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>