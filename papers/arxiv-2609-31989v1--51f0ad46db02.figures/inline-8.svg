<span id="S4.SS3.SSS1.p3.pic1.1.2" class="ltx_p"><span id="S4.SS3.SSS1.p3.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:314.3pt;--ltx-fg-color:#000000;"><span id="S4.SS3.SSS1.p3.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"></span><span id="S4.SS3.SSS1.p3.pic1.1.2.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:314.3pt;">
