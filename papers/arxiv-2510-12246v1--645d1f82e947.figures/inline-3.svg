<section id="Ax3" class="ltx_appendix">
<h2 class="ltx_title ltx_title_appendix" style="--ltx-fg-color:#000000;">Background</h2>

<div id="Ax3.p1" class="ltx_para">
<p id="Ax3.p1.1" class="ltx_p"><span id="Ax3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a natural language processing expert who is good at extracting key information from large amounts of text data and systematically summarizing it. You need to first extract common problems and root causes based on the existing bad case analysis results, and then improve the description of module in a targeted manner.The analysis results of the bad case you received are as follows:</span></p>
</div>
<div id="Ax3.p2" class="ltx_para">
<p id="Ax3.p2.1" class="ltx_p"><span id="Ax3.p2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{{Bad_Case_Reason_List}}</span></p>
</div>
</section>
<section id="Ax4" class="ltx_appendix">
<h2 class="ltx_title ltx_title_appendix" style="--ltx-fg-color:#000000;">Task Description</h2>

<div id="Ax4.p1" class="ltx_para">
<p id="Ax4.p1.1" class="ltx_p"><span id="Ax4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The current description of </span><span id="Ax4.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{{Module}}</span><span id="Ax4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is as follows:</span>
<br class="ltx_break"><span id="Ax4.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{{Module_Desc}}
<br class="ltx_break">
<br class="ltx_break"></span><span id="Ax4.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">Read the bad case analysis results and complete the following tasks for the description of </span><span id="Ax4.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{{Module}}</span><span id="Ax4.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">:</span>
<br class="ltx_break"><span id="Ax4.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">1. Common problem extraction: Classify bad cases and extract common problems. You need to highlight high-frequency or high-impact key issues to ensure that the classification dimensions are clear and logically consistent.</span>
<br class="ltx_break"><span id="Ax4.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;">2. Root cause analysis: For each type of problem, further analyze its root cause. You need to be brief and concise and get to the point without any vague nonsense.</span>
<br class="ltx_break"><span id="Ax4.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">3. Improvement of </span><span id="Ax4.p1.1.11" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{{Module}}</span><span id="Ax4.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> description: Optimize the description of </span><span id="Ax4.p1.1.13" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{{Module}}</span><span id="Ax4.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;"> based on the above summary. Expand and supplement </span><span id="Ax4.p1.1.15" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{{Module}}</span><span id="Ax4.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;"> when necessary, while avoiding redundancy to ensure that the key points are highlighted and the description is accurate.</span>
<br class="ltx_break"><span id="Ax4.p1.1.17" class="ltx_text" style="--ltx-fg-color:#000000;">You need to return the result directly in json format, and the json value must be in string format:</span>
<br class="ltx_break"><span id="Ax4.p1.1.18" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{</span><span id="Ax4.p1.1.19" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="Ax4.p1.1.20" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;Common problem extraction&quot;:&quot;&quot;,
<br class="ltx_break">&quot;Root cause analysis&quot;:&quot;&quot;,
<br class="ltx_break">&quot;Improved {{Module}} description&quot;:&quot;&quot;
</span><span id="Ax4.p1.1.21" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="Ax4.p1.1.22" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">}</span></p>
</div>
</section>
