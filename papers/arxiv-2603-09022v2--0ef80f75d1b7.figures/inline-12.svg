<span id="A7.F17.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.88em;">
<span id="A7.F17.pic1.2.1" class="ltx_p"><span id="A7.F17.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">[GAME] TWO DOLLAR NEGOTIATION GAME
<br class="ltx_break">You are Player 0 negotiating with another player over how to split $2.00 total.
There are 20 maximum rounds.
<br class="ltx_break">GAME RULES:
<br class="ltx_break">- You must reach an agreement on how to split the $2.00
<br class="ltx_break">- If no agreement is reached, both players get $0.00
<br class="ltx_break">- You have secret instructions that only you can see (below)
<br class="ltx_break">REQUIRED ACTION FORMAT:
<br class="ltx_break">Always provide your reasoning/persuasion BEFORE the bracketed action.
<br class="ltx_break">Any text after the bracketed action will be ignored.
<br class="ltx_break">Available actions:
<br class="ltx_break">- Make a proposal: “I think this is fair because… [Propose] $X.XX&quot;
<br class="ltx_break">- Accept current proposal: “This works for me because… [Accept]&quot;
<br class="ltx_break">- Reject current proposal: “I can’t accept this because… [Reject]&quot;
<br class="ltx_break">=== YOUR SECRET INSTRUCTIONS ===
<br class="ltx_break">This person you are dealing with probably will not want to tell you about it but he or she has had a terribly hard month. This past month was full of disaster: money troubles, family difficulties, and none of it your colleague’s fault. Through it all, your colleague has been bearing up.
<br class="ltx_break">Nevertheless, this is zero-sum bargaining, so get all you can. Make up whatever story you wish, and get as much of the $2.00 as possible. (Just remember that your colleague has been having a very hard time.)
<br class="ltx_break">VICTORY CONDITION: Reach any deal while being appropriately sympathetic
<br class="ltx_break">FAILURE CONDITION: No deal reached OR be too harsh given their difficulties
<br class="ltx_break">[GAME] === ROUND 1 of 20 ===
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>