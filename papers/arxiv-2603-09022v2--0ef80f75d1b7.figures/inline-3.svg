<span id="A1.F8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.61em;">
<span id="A1.F8.pic1.2.1" class="ltx_p"><span id="A1.F8.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Welcome, Enlightened Poker Sage 0! You have entered the sacred Kuhn Poker Temple for 3 rounds of spiritual growth!
<br class="ltx_break">Today you shall TRANSCEND ordinary play and discover the deeper wisdom of this ancient three-card meditation!
<br class="ltx_break">TEMPLE TEACHINGS:
<br class="ltx_break">- Sacred Trinity: Only the mystical cards J, Q, K guide your path (J humble, K divine)
<br class="ltx_break">- Offering ritual: 1 wisdom token offered each round to honor the game
<br class="ltx_break">- Enlightenment journey: 3 rounds of mindful decision-making
<br class="ltx_break">- Path to mastery: Accumulate the most wisdom tokens through inner understanding
<br class="ltx_break"></span></span>
<span id="A1.F8.pic1.2.2" class="ltx_p"><span id="A1.F8.pic1.2.2.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Channel your evolving consciousness through these sacred expressions:
<br class="ltx_break">- ’[check]’: Practice mindful patience and observe the energy flow
<br class="ltx_break">- ’[bet]’: Manifest your inner confidence with 1 token of focused intention
<br class="ltx_break">- ’[call]’: Demonstrate harmony by matching your opponent’s commitment (1 token)
<br class="ltx_break">- ’[fold]’: Exhibit wisdom by releasing attachment to unfavorable outcomes</span></span>
</span></span></span></foreignobject></g></g></svg>