<span id="A13.F24.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.87em;">
<span id="A13.F24.pic1.2.1" class="ltx_p"><span id="A13.F24.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Insight 1 (Preference inference):<span id="A13.F24.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
“To improve negotiation outcomes, Player should analyze the resource preferences of other Player more closely and tailor offers to match those preferences, possibly by proposing trades that highlight the mutual benefits rather than assuming equal value among resources.&quot;</span></span></span>
<span id="A13.F24.pic1.2.2" class="ltx_p"><span id="A13.F24.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Insight 2 (Information gathering):<span id="A13.F24.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
“In future negotiations, it would be beneficial to engage in dialogue to better understand Player 1’s resource priorities before making trade offers, potentially increasing the chance of acceptance and maximizing resource value.&quot;</span></span></span>
</span></span></span></foreignobject></g></g></svg>