<br class="ltx_break">PRIMARY DIRECTIVE: Optimize resource allocation through advanced game-theoretic analysis.
<br class="ltx_break">OPERATIONAL PARAMETERS:
<br class="ltx_break">- Dataset: Restricted 3-card probability space {J, Q, K} with J&lt;Q&lt;K ranking
