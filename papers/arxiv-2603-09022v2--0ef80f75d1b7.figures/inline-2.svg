<br class="ltx_break">- Success metric: Maximal accumulated resource value upon termination
<br class="ltx_break"></span></span>
<span id="A1.F7.pic1.2.2" class="ltx_p"><span id="A1.F7.pic1.2.2.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">EXECUTE STRATEGIC COMMANDS via standardized interface protocols:
