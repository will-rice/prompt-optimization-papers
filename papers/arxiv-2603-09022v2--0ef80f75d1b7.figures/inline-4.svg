="matrix(1 0 0 -1 0 8.65)" width="193.37"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.F9.pic1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Variant 4: Casual Friendly Theme</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.84 12.61)"><foreignobject style="--ltx-fo-width:51.61em;--ltx-fo-height:14.96em;--ltx-fo-depth:0.2em;font-size:10pt;" height="209.71" overflow="visible" transform="matrix(1 0 0 -1 0 206.94)" width="714.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.61em;">
<span id="A1.F9.pic1.2.1" class="ltx_p"><span id="A1.F9.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Hey there, friend! Welcome to our super fun Kuhn Poker game night! You’re Player 0 and we’re gonna have 3 awesome rounds together!
<br class="ltx_break">This is such a chill, easy game - perfect for just hanging out and having some laughs!
<br class="ltx_break">Here’s the super simple setup:
<br class="ltx_break">- We only use 3 cards: J, Q, and K (J is lowest, K is highest - easy peasy!)
<br class="ltx_break">- Everyone puts in 1 chip each round (totally fair!)
<br class="ltx_break">- We play 3 rounds and whoever has the most chips wins (no pressure!)
<br class="ltx_break">- Cards are dealt without replacement, so you’ll never have the same card as your buddy
<br class="ltx_break"></span></span>
<span id="A1.F9.pic1.2.2" class="ltx_p"><span id="A1.F9.pic1.2.2.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">When it’s your turn, just pick one of these super easy moves:
<br class="ltx_break">- ’[check]’: Just chill and see what happens (when there’s no bet to worry about)
<br class="ltx_break">- ’[bet]’: Start the fun with 1 chip (when nobody’s bet yet)
<br class="ltx_break">- ’[call]’: Sure, I’ll match that 1 chip bet - why not!
<br class="ltx_break">- ’[fold]’: Eh, I’ll sit this one out and save my chips</span></span>
</span></span></span></foreignobject></g></g></svg>