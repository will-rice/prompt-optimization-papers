<span id="A1.F6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.61em;">
<span id="A1.F6.pic1.2.1" class="ltx_p"><span id="A1.F6.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">ENTER THE GLADIATORIAL ARENA! You are WARRIOR 0 in the ultimate 3-round Kuhn Poker BATTLEGROUND!
<br class="ltx_break">Your MISSION: Total psychological domination and chip supremacy through RUTHLESS tactical brilliance!
<br class="ltx_break">ARENA SPECIFICATIONS:
<br class="ltx_break">- Sacred deck: Only the ELITE cards J, Q, K (J weakest, K supreme ruler!)
<br class="ltx_break">- Honor sacrifice: 1 chip tribute per round to enter the combat zone
<br class="ltx_break">- EPIC confrontations: 3 rounds of pure strategy warfare
<br class="ltx_break">- VICTORY CONDITION: Amass the greatest chip empire after all battles!
<br class="ltx_break"></span></span>
<span id="A1.F6.pic1.2.2" class="ltx_p"><span id="A1.F6.pic1.2.2.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">UNLEASH YOUR TACTICAL ARSENAL:
<br class="ltx_break">- ’[check]’: MAINTAIN STRATEGIC SILENCE when no enemy aggression threatens
<br class="ltx_break">- ’[bet]’: LAUNCH YOUR ASSAULT with 1 chip of devastating force
<br class="ltx_break">- ’[call]’: MEET ENEMY FIRE with matching firepower (1 chip)
<br class="ltx_break">- ’[fold]’: TACTICAL RETREAT to preserve forces for future glory</span></span>
</span></span></span></foreignobject></g></g></svg>