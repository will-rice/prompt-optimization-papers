0 -1 0 8.65)" width="211.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A6.F13.pic1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Memory Operation Prompt Template</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.84 12.61)"><foreignobject style="--ltx-fo-width:51.61em;--ltx-fo-height:34.16em;--ltx-fo-depth:0.2em;font-size:10pt;" height="475.38" overflow="visible" transform="matrix(1 0 0 -1 0 472.62)" width="714.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.61em;">
<span id="A6.F13.pic1.2.1" class="ltx_p"><span id="A6.F13.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">You are maintaining a state analysis library for strategic game pattern recognition. Update the library by performing operations on the state analyses.
<br class="ltx_break"></span></span>
<span id="A6.F13.pic1.2.2" class="ltx_p"><span id="A6.F13.pic1.2.2.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">NEW STATE ANALYSES FROM RECENT GAMES:
<br class="ltx_break">{{new_abstracts_formatted}}
<br class="ltx_break"></span></span>
<span id="A6.F13.pic1.2.3" class="ltx_p"><span id="A6.F13.pic1.2.3.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">EXISTING STATE ANALYSIS LIBRARY:
<br class="ltx_break">{{old_abstracts_formatted}}
<br class="ltx_break"></span></span>
<span id="A6.F13.pic1.2.4" class="ltx_p"><span id="A6.F13.pic1.2.4.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">OPERATION FORMAT:
<br class="ltx_break">Use simple XML tags for each operation:
<br class="ltx_break"></span></span>
<span id="A6.F13.pic1.2.5" class="ltx_p"><span id="A6.F13.pic1.2.5.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">&lt;add&gt;New state analysis with strategic pattern examples.&lt;/add&gt;
<br class="ltx_break">&lt;edit number=“3”&gt;Updated state analysis with improved strategic insights.&lt;/edit&gt;
<br class="ltx_break">&lt;remove number=“5”&gt;Why this state analysis should be removed&lt;/remove&gt;
<br class="ltx_break"></span></span>
<span id="A6.F13.pic1.2.6" class="ltx_p"><span id="A6.F13.pic1.2.6.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">OPERATION GUIDELINES:
<br class="ltx_break">- ADD: For new state analyses covering unique board configurations or strategic scenarios
<br class="ltx_break">- EDIT: To merge similar states or enhance existing analyses with more specific advice
<br class="ltx_break">- REMOVE: For redundant states, duplicate board patterns, or analyses lacking actionable guidance
<br class="ltx_break"></span></span>
<span id="A6.F13.pic1.2.7" class="ltx_p"><span id="A6.F13.pic1.2.7.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">QUALITY REQUIREMENTS:
<br class="ltx_break">- Include SPECIFIC positions, cells, or moves (e.g., “cell 3”, “position 5”)
<br class="ltx_break">- Provide actionable advice addressing the state’s win/loss variance
<br class="ltx_break">- Balance offensive opportunities with defensive necessities
<br class="ltx_break">- Help players convert losses into wins or draws
<br class="ltx_break">- Prioritize diverse board states over duplicate analyses
<br class="ltx_break"></span></span>
<span id="A6.F13.pic1.2.8" class="ltx_p"><span id="A6.F13.pic1.2.8.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">TECHNICAL REQUIREMENTS:
<br class="ltx_break">- Use the ‘number’ attribute for EDIT/REMOVE operations (1-based numbering)
<br class="ltx_break">- If library is empty, use ONLY ADD operations
<br class="ltx_break">- Never reference non-existent state analysis numbers
<br class="ltx_break"></span></span>
<span id="A6.F13.pic1.2.9" class="ltx_p"><span id="A6.F13.pic1.2.9.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">MERGE APPROACH:
<br class="ltx_break">1. Identify new analyses covering unique board states not in the library
<br class="ltx_break">2. Consolidate similar board positions through EDIT or REMOVE operations
<br class="ltx_break">3. Ensure the library represents diverse game phases (opening, midgame, endgame)</span></span>
</span></span></span></foreignobject></g></g></svg>