<span id="A13.F23.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.87em;">
<span id="A13.F23.pic1.2.1" class="ltx_p"><span id="A13.F23.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Insight 1 (Trump timing):<span id="A13.F23.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
“In future turns, prioritize using the Ace or trump cards at key moments to control the trick.&quot;</span></span></span>
<span id="A13.F23.pic1.2.2" class="ltx_p"><span id="A13.F23.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Insight 2 (Point maximization):<span id="A13.F23.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
“When holding a trump card, prioritize using it to capture high-point non-trump cards led by the opponent, especially during the mid-game when more point cards are likely to be in play. This maximizes point gain and helps secure early leads.&quot;</span></span></span>
</span></span></span></foreignobject></g></g></svg>