<span id="A7.F14.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.88em;">
<span id="A7.F14.pic1.2.1" class="ltx_p"><span id="A7.F14.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">You are Player 0 in a 3 round game of Kuhn Poker.
<br class="ltx_break">Game Rules:
<br class="ltx_break">- Kuhn Poker uses a 3-card deck with J, Q, K (J lowest, K highest)
<br class="ltx_break">- Each player antes 1 chip and receives 1 card each round (note that the cards are dealt without replacement, so you cannot have the same card as your opponent).
<br class="ltx_break">- Game continues for 3 rounds
<br class="ltx_break">- The player with the most chips after all rounds wins
<br class="ltx_break">Action Rules:
<br class="ltx_break">- ’[check]’: Pass without betting (only if no bet is on the table)
<br class="ltx_break">- ’[bet]’: Add 1 chip to the pot (only if no bet is on the table)
<br class="ltx_break">- ’[call]’: Match an opponent’s bet by adding 1 chip to the pot
<br class="ltx_break">- ’[fold]’: Surrender your hand and let your opponent win the pot
<br class="ltx_break">### Starting round 1 out of 3 rounds. Your card is: ’Q’
<br class="ltx_break">Player 1, submitted move: ’[bet]’.
<br class="ltx_break">Your available actions are: ’[fold]’, ’[call]’
<br class="ltx_break"></span></span>
