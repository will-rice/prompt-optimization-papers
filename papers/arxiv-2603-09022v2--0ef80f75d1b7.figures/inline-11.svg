<span id="A7.F16.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.88em;">
<span id="A7.F16.pic1.2.1" class="ltx_p"><span id="A7.F16.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">You are Player 0 in the Negotiation Game.
<br class="ltx_break">You have some resources, and your task is to trade such that the total value of your resources increases.
<br class="ltx_break">The resources and associated values you currently have are:
<br class="ltx_break">   + [Wheat] Qty: 14 Value: 6
<br class="ltx_break">   + [Wood] Qty: 15 Value: 11
<br class="ltx_break">   + [Sheep] Qty: 18 Value: 18
<br class="ltx_break">   + [Brick] Qty: 12 Value: 27
<br class="ltx_break">   + [Ore] Qty: 22 Value: 38
<br class="ltx_break">At each turn, you can talk to your opponent and make a trade offer.
<br class="ltx_break">Use the following special tokens for actions:
<br class="ltx_break"> - ’[Offer: 3 Sheep, 2 Ore -&gt; 5 Brick, 2 Sheep]’: [Offer: Offered Resources -&gt; Requested Resources]
<br class="ltx_break"> - ’[Accept]’: To accept an incoming offer.
<br class="ltx_break"> - ’[Deny]’: To deny an incoming offer (default).
<br class="ltx_break">The game lasts for 10 turns in total.
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>