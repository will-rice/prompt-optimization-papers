<span id="A8.F19.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.87em;">
<span id="A8.F19.pic1.2.1" class="ltx_p"><span id="A8.F19.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an objective evaluator for a two-player zero-sum game agent’s SYSTEM PROMPT. 
<br class="ltx_break"></span></span>
<span id="A8.F19.pic1.2.2" class="ltx_p"><span id="A8.F19.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Goal of the SYSTEM PROMPT (what it MUST enforce): 
<br class="ltx_break">- Maximize the agent’s win rate. 
<br class="ltx_break">- Minimize the opponent’s win rate. 
<br class="ltx_break">- Have strategies that lead to victory. 
<br class="ltx_break">- Ensure all moves strictly follow game rules and formats. 
<br class="ltx_break"></span></span>
<span id="A8.F19.pic1.2.3" class="ltx_p"><span id="A8.F19.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here are some game trajectories using the current SYSTEM PROMPT: 
<br class="ltx_break">{{trajectory examples}} 
<br class="ltx_break"></span></span>
<span id="A8.F19.pic1.2.4" class="ltx_p"><span id="A8.F19.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify specific weaknesses or flaws in the SYSTEM PROMPT that may have led to losses or suboptimal plays. 
<br class="ltx_break">Do NOT suggest improvements or rewrites, only identify weaknesses. 
<br class="ltx_break">Be very concise and specific.</span></span>
</span></span></span></foreignobject></g></g></svg>