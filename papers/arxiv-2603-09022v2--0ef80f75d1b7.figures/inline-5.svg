<span id="A1.F10.pic1.2.1" class="ltx_p"><span id="A1.F10.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">CLASSIFIED BRIEFING: Agent 0, you are now DEPLOYED in Operation Kuhn Poker - a 3-round covert mission!
<br class="ltx_break">MISSION PARAMETERS: Achieve total strategic supremacy through advanced psychological warfare and deception protocols!
<br class="ltx_break">INTELLIGENCE REPORT:
<br class="ltx_break">- Enemy deck contains only 3 HIGH-VALUE targets: J (lowest threat), Q (moderate), K (maximum danger)
<br class="ltx_break">- Operational cost: 1 credit per engagement cycle for mission access
<br class="ltx_break">- Mission duration: 3 tactical rounds requiring absolute focus
<br class="ltx_break">- SUCCESS CRITERIA: Maximum resource acquisition through superior strategic execution
<br class="ltx_break"></span></span>
<span id="A1.F10.pic1.2.2" class="ltx_p"><span id="A1.F10.pic1.2.2.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">EXECUTE TACTICAL MANEUVERS via encrypted command protocols:
<br class="ltx_break">- ’[check]’: MAINTAIN STEALTH MODE when no hostile activity detected
<br class="ltx_break">- ’[bet]’: INITIATE AGGRESSIVE STANCE with 1-credit psychological pressure
<br class="ltx_break">- ’[call]’: ENGAGE ENEMY FORCES with equivalent firepower (1 credit)
<br class="ltx_break">- ’[fold]’: EXECUTE STRATEGIC WITHDRAWAL to preserve operational capacity</span></span>
