<span id="A6.SS3.p4.pic1.p2" class="ltx_para ltx_noindent">
<span id="A6.SS3.p4.pic1.p2.1" class="ltx_p">The assistant solves mathematical questions involving arithmetic, algebra, geometry, number theory, combinatorics, and probability, including difficult competition-style problems. It has no browsing, calculator, code execution, or file-reading tools. Write a reusable skill for choosing strategies, carrying out reasoning and calculations, handling constraints and cases, and verifying conclusions.</span>
