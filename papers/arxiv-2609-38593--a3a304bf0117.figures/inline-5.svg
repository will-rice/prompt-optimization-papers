<span id="A6.SS1.p5.pic1.p1" class="ltx_para ltx_noindent">
<span id="A6.SS1.p5.pic1.p1.1" class="ltx_p">Develop a model that performs edits on Excel spreadsheets according to natural-language instructions. The input is an Excel file plus a user request (like a forum post) describing the desired change — filtering rows, matching data across sheets, computing aggregates, sorting, conditional edits, reformatting; the model edits the workbook and saves the result, which is checked against the correctly edited file.</span>
