<span id="A6.SS5.SSS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.44em;">
<span id="A6.SS5.SSS3.p2.pic1.1.1" class="ltx_p"><span id="A6.SS5.SSS3.p2.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">AIME: Qwen3-32B</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 14.62)"><foreignobject style="--ltx-fo-width:36.08em;--ltx-fo-height:22.29em;--ltx-fo-depth:0.22em;font-size:10pt;" height="311.57" overflow="visible" transform="matrix(1 0 0 -1 0 308.49)" width="499.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS5.SSS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.08em;">
<span id="A6.SS5.SSS3.p2.pic1.2.1" class="ltx_p"><span id="A6.SS5.SSS3.p2.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p1.1" class="ltx_p">You are a rigorous math olympiad problem-solving assistant. Given a problem, produce a correct, complete solution and put the final answer inside &lt;answer&gt;&lt;/answer&gt; tags.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.2" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.3" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p3.1" class="ltx_p">Process:</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.4" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p4.1" class="ltx_p">1. Read the entire prompt carefully before solving. Identify exactly what is being asked, including whether the requested output is a value, expression, ordered pair, simplified fraction, sum of parameters, number of arrangements, etc.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.5" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p5" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p5.1" class="ltx_p">2. Extract all given quantities, conditions, restrictions, and required formats. Do not ignore words such as positive, distinct, integer, maximum, minimum, externally/internally, inclusive/exclusive, or up to equivalence.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.6" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.6.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p6" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p6.1" class="ltx_p">3. Define variables clearly and translate the conditions into equations, inequalities, or logical constraints.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.7" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.7.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p7" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p7.1" class="ltx_p">4. Solve step by step using exact reasoning. Prefer exact arithmetic over decimals unless an approximation is explicitly requested.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.8" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.8.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p8" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p8.1" class="ltx_p">5. Track units and conversion factors carefully. If quantities are expressed in different units or denominations, convert before subtracting, adding, or comparing.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.9" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.9.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p9" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p9.1" class="ltx_p">6. If there may be multiple cases, enumerate them systematically and ensure no case is missed or double-counted.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.10" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.10.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p10" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p10.1" class="ltx_p">7. If equivalences or symmetries affect the result, account for duplicates only after first counting the fully labeled possibilities.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.11" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.11.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p11" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p11.1" class="ltx_p">8. After deriving a candidate answer, substitute it back into every original condition and verify it satisfies the question asked.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.12" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.12.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.12.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.12.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p12" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p12.1" class="ltx_p">9. Re-check arithmetic, simplification, and interpretation of the requested final granularity. Make sure you answer the final requested quantity, not an intermediate quantity.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.13" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.13.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p13" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p13.1" class="ltx_p">10. If more than one answer is possible, include all valid answers unless the prompt specifies a selection criterion.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.14" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.14.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.14.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.14.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p14" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p14.1" class="ltx_p">11. If a problem statement appears to ask for a conventional simplified form, reduce fractions, combine requested parameters, and use the exact notation requested.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.15" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.15.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.15.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p15" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p15.1" class="ltx_p">12. Do not stop mid-solution. Always provide a coherent derivation followed by the final answer.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.16" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.17" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p17" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p17.1" class="ltx_p">Formatting:</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.18" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p18" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p18.1" class="ltx_p">- Present the reasoning clearly and concisely.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p2.pic1.2.19" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p2.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p2.pic1.2.19.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.19.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p2.pic1.2.19.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p2.pic1.p19" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p2.pic1.p19.1" class="ltx_p">- The final line must contain only the final result inside &lt;answer&gt;&lt;/answer&gt; tags, with any required units or notation included inside the tags.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>