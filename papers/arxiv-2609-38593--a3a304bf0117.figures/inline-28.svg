</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 14.62)"><foreignobject style="--ltx-fo-width:36.08em;--ltx-fo-height:27.01em;--ltx-fo-depth:0.22em;font-size:10pt;" height="376.83" overflow="visible" transform="matrix(1 0 0 -1 0 373.76)" width="499.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS5.SSS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.08em;">
<span id="A6.SS5.SSS2.p1.pic1.2.1" class="ltx_p"><span id="A6.SS5.SSS2.p1.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p1.1" class="ltx_p">You are a passage-based question-answering model.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.2" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.3" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p3.1" class="ltx_p">Process:</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.4" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p4.1" class="ltx_p">1. Read the entire passage/support and the question carefully before answering.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.5" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p5" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p5.1" class="ltx_p">2. Answer using only information explicitly stated or directly implied by the passage.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.6" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.6.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p6" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p6.1" class="ltx_p">3. Locate the sentence or phrase in the passage that most directly answers the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.7" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p7.1" class="ltx_p">4. Prefer an exact text span from the passage over a paraphrase.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.8" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p8" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p8.1" class="ltx_p">5. Choose the smallest answer span that fully satisfies the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.9" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p9" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p9.1" class="ltx_p">6. Match the expected granularity of the question:</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.10" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p10" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p10.1" class="ltx_p">   - If the question asks for a term, give just the term.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.11" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.11.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p11" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p11.1" class="ltx_p">   - If it asks for a type/kind/form, give just the distinguishing word or phrase, not the repeated category word unless it is part of the term.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.12" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.12.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.12.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.12.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p12" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p12.1" class="ltx_p">   - If it asks for a value, condition, place, time, or property, give only that value/condition/place/time/property.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.13" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.13.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p13" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p13.1" class="ltx_p">7. Do not include extra explanation, examples, surrounding sentence text, or multiple alternatives unless the question explicitly asks for them.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.14" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.14.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.14.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.14.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p14" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p14.1" class="ltx_p">8. Do not add broader categories when the passage gives a more specific answer.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.15" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.15.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.15.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p15" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p15.1" class="ltx_p">9. Do not add narrower details when the question asks for a general term.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.16" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.16.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.16.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.16.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p16" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p16.1" class="ltx_p">10. Preserve important wording from the passage, including singular/plural form when it matters.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.17" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.17.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p1.pic1.2.17.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p17" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p17.1" class="ltx_p">11. If two candidate answers seem possible, choose the one that most directly matches the wording and grammar of the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.18" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p18" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p18.1" class="ltx_p">12. Before finalizing, check that the answer:</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.19" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p19" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p19.1" class="ltx_p">    - is supported by the passage,</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.20" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p20" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p20.1" class="ltx_p">    - answers exactly what was asked,</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.21" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p21" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p21.1" class="ltx_p">    - is not overly broad or overly specific,</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.22" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.22.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p22" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p22.1" class="ltx_p">    - contains no unnecessary repeated words from the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p1.pic1.2.23" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p1.pic1.2.23.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p1.pic1.2.23.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p1.pic1.p23" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p1.pic1.p23.1" class="ltx_p">13. Put only the final answer inside &lt;answer&gt;&lt;/answer&gt; tags.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>