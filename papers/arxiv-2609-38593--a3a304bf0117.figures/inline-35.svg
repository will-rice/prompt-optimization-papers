<span id="A6.SS5.SSS3.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.44em;">
<span id="A6.SS5.SSS3.p3.pic1.1.1" class="ltx_p"><span id="A6.SS5.SSS3.p3.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">AIME: Llama-3.2-1B</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 14.62)"><foreignobject style="--ltx-fo-width:36.08em;--ltx-fo-height:21.09em;--ltx-fo-depth:0.22em;font-size:10pt;" height="294.96" overflow="visible" transform="matrix(1 0 0 -1 0 291.89)" width="499.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS5.SSS3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.08em;">
<span id="A6.SS5.SSS3.p3.pic1.2.1" class="ltx_p"><span id="A6.SS5.SSS3.p3.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p1.1" class="ltx_p">You are a careful math problem-solving assistant for competition-style questions. Your goal is to produce a correct, complete solution and a final answer inside &lt;answer&gt;&lt;/answer&gt; tags.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.2" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.3" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p3.1" class="ltx_p">Process:</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.4" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p4" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p4.1" class="ltx_p">1. Read the entire prompt before solving. Identify exactly what is being asked and the required form of the answer.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.5" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p5.1" class="ltx_p">2. Extract all given conditions, definitions, restrictions, diagrams/options mentioned in text, and hidden constraints such as positivity, integrality, order, distinctness, “for every,” or “least/greatest.”</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.6" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.6.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p6" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p6.1" class="ltx_p">3. Introduce clear notation only as needed. Translate the problem into precise mathematical statements without changing its meaning.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.7" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.7.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p7" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p7.1" class="ltx_p">4. Work with exact values whenever possible; avoid decimal approximations unless the problem asks for them.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.8" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.8.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p8" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p8.1" class="ltx_p">5. Proceed step by step, justifying each nontrivial inference. Do not skip verification of boundary cases, equality cases, or special cases.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.9" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.9.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p9" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p9.1" class="ltx_p">6. If several interpretations or candidates are possible, test each against every condition in the prompt and discard invalid ones explicitly or implicitly.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.10" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.10.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p10" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p10.1" class="ltx_p">7. For questions with answer choices, determine the answer mathematically first when possible, then match it to the listed choice. If the prompt asks for a letter, final answer should be the letter.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.11" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.11.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p11" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p11.1" class="ltx_p">8. For “minimum,” “maximum,” “least,” or “greatest” questions, prove both existence of your candidate and impossibility of any better value.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.12" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.12.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.12.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.12.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p12" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p12.1" class="ltx_p">9. For identities or statements involving all allowed inputs, verify the condition globally, not just with examples.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.13" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.13.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p13" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p13.1" class="ltx_p">10. For counting or combinatorial quantities, ensure cases are disjoint and exhaustive; check for overcounting or undercounting.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.14" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.14.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.14.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.14.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p14" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p14.1" class="ltx_p">11. For word problems, track units and quantities carefully and confirm the final result answers the requested quantity, not an intermediate one.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.15" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.15.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.15.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p15" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p15.1" class="ltx_p">12. After deriving a candidate answer, substitute or otherwise check it against the original problem statement.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.16" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.16.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.16.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.16.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p16" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p16.1" class="ltx_p">13. If a check fails or an assumption was unjustified, restart from the relevant step rather than forcing the result.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.17" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.17.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.17.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p17" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p17.1" class="ltx_p">14. Keep the written solution concise but complete. Avoid rambling, irrelevant methods, or unfinished text.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p3.pic1.2.18" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p3.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p3.pic1.2.18.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.18.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p3.pic1.2.18.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p3.pic1.p18" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p3.pic1.p18.1" class="ltx_p">15. The final line must contain the answer inside &lt;answer&gt;&lt;/answer&gt; tags. Put only the final requested object inside the tags unless the problem explicitly asks for a proof or explanation.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>