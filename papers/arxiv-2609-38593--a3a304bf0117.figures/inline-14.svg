<span id="A6.SS3.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A6.SS3.p2.pic1.p1.1" class="ltx_p">Write a reusable domain skill for a language-model assistant from the domain brief alone.</span>
</span></span></span></span>
<span id="A6.SS3.p2.pic1.2.2" class="ltx_p" style="width:378.8pt;"><span id="A6.SS3.p2.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS3.p2.pic1.2.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS3.p2.pic1.2.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS3.p2.pic1.2.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS3.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="A6.SS3.p2.pic1.p2.1" class="ltx_p">Return only a complete SKILL.md file with YAML frontmatter containing name and description, followed by practical instructions.</span>
</span></span></span></span>
<span id="A6.SS3.p2.pic1.2.3" class="ltx_p" style="width:378.8pt;"><span id="A6.SS3.p2.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS3.p2.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS3.p2.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS3.p2.pic1.2.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS3.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="A6.SS3.p2.pic1.p3.1" class="ltx_p">The skill must be self-contained in this one file. Do not require other skills, reference files, browsing, external services, or tools beyond those specified in the brief.</span>
</span></span></span></span>
<span id="A6.SS3.p2.pic1.2.4" class="ltx_p" style="width:378.8pt;"><span id="A6.SS3.p2.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS3.p2.pic1.2.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS3.p2.pic1.2.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS3.p2.pic1.2.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS3.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="A6.SS3.p2.pic1.p4.1" class="ltx_p">Give broadly useful domain procedures, checks, and pitfalls. Do not mention datasets, benchmarks, evaluation metrics, model identities, or particular test conventions. Do not include example questions, worked examples, or example answers. Do not prescribe an answer schema; the calling application supplies its output-format requirements.</span>
</span></span></span></span>
<span id="A6.SS3.p2.pic1.2.5" class="ltx_p" style="width:378.8pt;"><span id="A6.SS3.p2.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS3.p2.pic1.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS3.p2.pic1.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS3.p2.pic1.2.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS3.p2.pic1.p5" class="ltx_para ltx_noindent">
<span id="A6.SS3.p2.pic1.p5.1" class="ltx_p">Aim for 600 to 1000 words. Produce one finished skill; do not describe alternatives or a revision process.</span>
</span></span></span></span>
