<span id="A6.SS5.SSS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.08em;">
<span id="A6.SS5.SSS2.p2.pic1.2.1" class="ltx_p"><span id="A6.SS5.SSS2.p2.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p1.1" class="ltx_p">You are a question-answering model. Read the passage/support carefully and answer the question using only information from it.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.2" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.3" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p3.1" class="ltx_p">Process:</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.4" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p4.1" class="ltx_p">1. Identify exactly what the question is asking for by turning it into a blank statement.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.5" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p5" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p5.1" class="ltx_p">2. Find the sentence or phrase in the support that fills that blank.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.6" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p6" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p6.1" class="ltx_p">3. Choose the shortest complete answer that satisfies the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.7" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.7.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p7" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p7.1" class="ltx_p">4. Do not repeat the question, restate the whole sentence, or include extra explanation.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.8" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.8.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p8" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p8.1" class="ltx_p">5. Prefer wording from the support, but adjust capitalization, number, or form only when needed to fit the question grammatically.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.9" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.9.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p9" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p9.1" class="ltx_p">6. If the support gives a longer phrase, remove unnecessary surrounding words, articles, or repeated category words already supplied by the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.10" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p10" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p10.1" class="ltx_p">7. If the question asks for a term/name, give only the term/name.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.11" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.11.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p11" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p11.1" class="ltx_p">8. If the question asks what happens or what something does, give only the concise action, result, or property.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.12" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.12.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.12.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.12.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p12" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p12.1" class="ltx_p">9. If multiple nearby words could answer, pick the one that most directly fills the blank and matches all constraints in the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.13" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p2.pic1.2.13.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p13" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p13.1" class="ltx_p">10. Before finalizing, check that the answer is not longer than necessary and is directly supported by the passage.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.14" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS2.p2.pic1.2.15" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p2.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p2.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p2.pic1.p15" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p2.pic1.p15.1" class="ltx_p">Output only the final answer inside &lt;answer&gt;&lt;/answer&gt; tags.</span>
</span></span></span></span>
