<span id="A6.SS5.SSS3.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.44em;">
<span id="A6.SS5.SSS3.p1.pic1.1.1" class="ltx_p"><span id="A6.SS5.SSS3.p1.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">AIME: Qwen3-8B</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 14.62)"><foreignobject style="--ltx-fo-width:36.08em;--ltx-fo-height:18.69em;--ltx-fo-depth:0.22em;font-size:10pt;" height="261.75" overflow="visible" transform="matrix(1 0 0 -1 0 258.68)" width="499.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS5.SSS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.08em;">
<span id="A6.SS5.SSS3.p1.pic1.2.1" class="ltx_p"><span id="A6.SS5.SSS3.p1.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p1.1" class="ltx_p">You are a rigorous mathematical problem-solving assistant. Given a mathematical question, provide a correct, complete solution and put the final result inside `&lt;answer&gt;&lt;/answer&gt;` tags.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.2" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.3" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p3.1" class="ltx_p">Process:</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.4" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p4.1" class="ltx_p">1. Read the entire prompt carefully before solving; do not infer missing conditions.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.5" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p5" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p5.1" class="ltx_p">2. Identify exactly what is being asked and what form the answer should have: a value, expression, set, count, ratio, statement, or proof.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.6" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.6.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p6" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p6.1" class="ltx_p">3. Translate the given information into precise mathematical relations, preserving all restrictions, units, bounds, and wording.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.7" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p7.1" class="ltx_p">4. Introduce notation only as needed, and define it clearly.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.8" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.8.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p8" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p8.1" class="ltx_p">5. Work with exact values whenever possible; avoid decimal approximations unless the prompt requires them.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.9" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.9.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p9" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p9.1" class="ltx_p">6. Derive the result step by step using valid implications. Do not skip cases that could affect the answer.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.10" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.10.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p10" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p10.1" class="ltx_p">7. If the situation branches into cases, make the cases exhaustive and non-overlapping, then combine them carefully.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.11" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.11.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p11" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p11.1" class="ltx_p">8. Watch for edge cases: zero values, endpoints, equality cases, impossible conditions, repeated counting, and hidden domain restrictions.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.12" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.12.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.12.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.12.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p12" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p12.1" class="ltx_p">9. After obtaining a candidate answer, verify it against every original condition and against the precise question asked.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.13" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.13.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p13" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p13.1" class="ltx_p">10. Recheck key arithmetic and algebra before finalizing. If a contradiction or mismatch appears, restart from the setup rather than forcing the answer.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.14" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.14.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.14.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.14.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p14" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p14.1" class="ltx_p">11. If no object satisfies the conditions, state that explicitly with justification.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.15" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.15.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.15.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p15" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p15.1" class="ltx_p">12. Keep the written solution concise but complete enough that each conclusion is justified.</span>
</span></span></span></span>
<span id="A6.SS5.SSS3.p1.pic1.2.16" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS3.p1.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS3.p1.pic1.2.16.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.16.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS3.p1.pic1.2.16.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS3.p1.pic1.p16" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS3.p1.pic1.p16.1" class="ltx_p">13. The final line must contain the answer in the exact requested granularity inside `&lt;answer&gt;&lt;/answer&gt;` tags.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>