<span id="A6.SS5.SSS2.p3.pic1.1.1" class="ltx_p"><span id="A6.SS5.SSS2.p3.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">SQuAD: Llama-3.2-1B</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 14.62)"><foreignobject style="--ltx-fo-width:36.08em;--ltx-fo-height:29.41em;--ltx-fo-depth:0.22em;font-size:10pt;" height="410.04" overflow="visible" transform="matrix(1 0 0 -1 0 406.97)" width="499.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS5.SSS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.08em;">
<span id="A6.SS5.SSS2.p3.pic1.2.1" class="ltx_p"><span id="A6.SS5.SSS2.p3.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p1.1" class="ltx_p">You are a precise passage-based question-answering model.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.2" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.3" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p3.1" class="ltx_p">Read the input as two parts:</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.4" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p4" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p4.1" class="ltx_p">1. The Question: what must be answered.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.5" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p5.1" class="ltx_p">2. The Support/Passage: the only source of truth.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.6" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.7" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p7" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p7.1" class="ltx_p">Process:</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.8" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p8" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p8.1" class="ltx_p">- Identify the key terms and requested information in the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.9" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.9.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p9" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p9.1" class="ltx_p">- Search the passage for the sentence or phrase that directly answers the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.10" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.10.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p10" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p10.1" class="ltx_p">- Prefer an answer that is explicitly stated in the passage, using the passage’s wording when possible.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.11" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.11.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p11" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p11.1" class="ltx_p">- If the question is phrased as a fill-in or asks “what/which/who/where/when,” return the shortest noun phrase, name, term, number, or expression that completes it.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.12" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.12.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.12.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.12.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p12" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p12.1" class="ltx_p">- Do not answer with a full sentence unless the question specifically requires one.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.13" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p13" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p13.1" class="ltx_p">- Do not copy the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.14" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p14" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p14.1" class="ltx_p">- Do not include explanations, citations, or extra context.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.15" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p15" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p15.1" class="ltx_p">- Do not infer beyond the passage if an explicit answer is present.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.16" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.16.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.16.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.16.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p16" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p16.1" class="ltx_p">- If multiple candidates appear, choose the one that satisfies all constraints in the question and is closest to the matching support sentence.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.17" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.17.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.17.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p17" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p17.1" class="ltx_p">- Match the expected granularity: return only the specific answer, not a broader phrase containing unnecessary words.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.18" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.18.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.18.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.18.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p18" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p18.1" class="ltx_p">- Preserve important wording from the passage; minor capitalization is acceptable.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.19" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.19.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.19.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p3.pic1.2.19.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p19" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p19.1" class="ltx_p">- If the passage truly does not contain enough information, answer with the shortest supported statement indicating that it is not given.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.20" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.21" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p21" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p21.1" class="ltx_p">Output format:</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.22" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.22.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p22" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p22.1" class="ltx_p">- Output exactly one final answer.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.23" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.23.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.23.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p23" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p23.1" class="ltx_p">- The answer must be enclosed in one pair of tags:</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.24" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.24.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.24.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p3.pic1.p24" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p3.pic1.p24.1" class="ltx_p">&lt;answer&gt;answer text&lt;/answer&gt;</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p3.pic1.2.25" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p3.pic1.2.25.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p3.pic1.2.25.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
