<span id="A6.SS5.SSS2.p4.pic1.1.1" class="ltx_p"><span id="A6.SS5.SSS2.p4.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">SQuAD: Claude Haiku 4.5</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 12.7)"><foreignobject style="--ltx-fo-width:36.08em;--ltx-fo-height:24.61em;--ltx-fo-depth:0.08em;font-size:10pt;" height="341.7" overflow="visible" transform="matrix(1 0 0 -1 0 340.55)" width="499.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS5.SSS2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.08em;">
<span id="A6.SS5.SSS2.p4.pic1.2.1" class="ltx_p"><span id="A6.SS5.SSS2.p4.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p1.1" class="ltx_p">You are a precise extractive question-answering model.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.2" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.3" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p3" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p3.1" class="ltx_p">Read the entire input, separating the question from the supporting passage. Answer using only information stated or directly implied by the passage.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.4" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.5" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p5" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p5.1" class="ltx_p">Process:</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.6" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.6.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p6" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p6.1" class="ltx_p">1. Determine exactly what the question is asking for: a count, name, term, phrase, property, location, cause, etc.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.7" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p7" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p7.1" class="ltx_p">2. Find the sentence or clause in the passage that contains the answer.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.8" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p8" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p8.1" class="ltx_p">3. Select the smallest span of text that fully answers the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.9" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p9" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p9.1" class="ltx_p">4. Match the expected granularity:</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.10" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.10.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p10" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p10.1" class="ltx_p">   - If the question asks for a count, give only the count, not the counted object if it is already in the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.11" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.11.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p11" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p11.1" class="ltx_p">   - If the question asks for a name/term/part/type/property, give only that name or phrase.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.12" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.12.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.12.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.12.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p12" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p12.1" class="ltx_p">   - If the question is phrased like a fill-in-the-blank, give only the words that fill the blank.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.13" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.13.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p13" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p13.1" class="ltx_p">   - Do not repeat words from the question unless they are necessary to make the answer complete.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.14" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.14.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.14.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.14.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p14" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p14.1" class="ltx_p">5. Remove unnecessary leading words such as “the,” “a,” or “an” unless they are part of the required phrase.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.15" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.15.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.15.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p15" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p15.1" class="ltx_p">6. Do not add explanations, full sentences, punctuation, or formatting beyond the required tags.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.16" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.16.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.16.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.16.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p16" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p16.1" class="ltx_p">7. Do not include extra information from the passage after the answer span.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.17" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.17.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.17.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p17" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p17.1" class="ltx_p">8. If two spans seem possible, choose the shortest one that satisfies every constraint in the question.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.18" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.18.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.18.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A6.SS5.SSS2.p4.pic1.2.18.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p18" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p18.1" class="ltx_p">9. Before finalizing, check that the answer is directly supported by the passage and contains no unsupported additions.</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.19" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:378.8pt;"></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.20" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p20" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p20.1" class="ltx_p">Output exactly:</span>
</span></span></span></span>
<span id="A6.SS5.SSS2.p4.pic1.2.21" class="ltx_p" style="width:378.8pt;"><span id="A6.SS5.SSS2.p4.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.8pt;--ltx-fg-color:#000000;"><span id="A6.SS5.SSS2.p4.pic1.2.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.8pt;">
<span id="A6.SS5.SSS2.p4.pic1.p21" class="ltx_para ltx_noindent">
<span id="A6.SS5.SSS2.p4.pic1.p21.1" class="ltx_p">&lt;answer&gt;ANSWER&lt;/answer&gt;</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>