<svg id="A1.SS1.p1.pic1" class="ltx_picture" height="1119.12" overflow="visible" version="1.1" viewbox="0 0 653.15 1119.12" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1119.12) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.87 L 0 1115.24 C 0 1117.38 1.73 1119.12 3.87 1119.12 L 649.28 1119.12 C 651.42 1119.12 653.15 1117.38 653.15 1115.24 L 653.15 3.87 C 653.15 1.73 651.42 0 649.28 0 L 3.87 0 C 1.73 0 0 1.73 0 3.87 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 3.87 L 1.11 1096.73 L 652.04 1096.73 L 652.04 3.87 C 652.04 2.35 650.8 1.11 649.28 1.11 L 3.87 1.11 C 2.35 1.11 1.11 2.35 1.11 3.87 Z" /></g><g style="--ltx-fill-color:#C6C6C6;" fill="#C6C6C6" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 1097.84 L 1.11 1115.24 C 1.11 1116.77 2.35 1118.01 3.87 1118.01 L 649.28 1118.01 C 650.8 1118.01 652.04 1116.77 652.04 1115.24 L 652.04 1097.84 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 1104.46)"><foreignobject style="--ltx-fo-width:39.37em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="544.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.37em;">
<span id="A1.SS1.p1.pic1.1.1" class="ltx_p"><span id="A1.SS1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Complete Base Prompt for Stance Detection</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 10.58)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:77.71em;--ltx-fo-depth:0em;font-size:10pt;" height="1075.31" overflow="visible" transform="matrix(1 0 0 -1 0 1075.31)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS1.p1.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A1.SS1.p1.pic1.p3" class="ltx_para">
<span id="A1.SS1.p1.pic1.p3.1" class="ltx_p"><span id="A1.SS1.p1.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1. Task Definition<span id="A1.SS1.p1.pic1.p3.1.1.1" class="ltx_text"></span></span></span>
</span>
<span id="A1.SS1.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS1.p1.pic1.p1.1" class="ltx_p"><span id="A1.SS1.p1.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Stance detection is a task of determining the attitude or position expressed by an author in a text regarding a particular topic or claim. Your task is to classify the stance of a tweet toward the target “</span><span id="A1.SS1.p1.pic1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{target}</span><span id="A1.SS1.p1.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">” as either Favor, Against, or Neutral.</span></span>
</span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A1.SS1.p1.pic1.p4" class="ltx_para">
<span id="A1.SS1.p1.pic1.p4.1" class="ltx_p"><span id="A1.SS1.p1.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">2. Guidelines<span id="A1.SS1.p1.pic1.p4.1.1.1" class="ltx_text"></span></span></span>
<span id="A1.I1" class="ltx_enumerate">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Stance Indicators:</span><span id="A1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Look for keywords, phrases, emoticons, and tone that indicate a favor, against, or neutral attitude toward </span><span id="A1.I1.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{target}</span><span id="A1.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Implicit vs. Explicit Stance:</span><span id="A1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Consider both implicit and explicit expressions of stance. If a tweet implies a stance without directly stating it, use the context and language to determine the intended stance.</span></span>
</span></span>
<span id="A1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I1.i3.p1" class="ltx_para">
<span id="A1.I1.i3.p1.1" class="ltx_p"><span id="A1.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sarcasm and Irony:</span><span id="A1.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Be aware of sarcasm and irony, which can be used to express an opposing stance. Look for inconsistencies between the literal meaning and the tone or language used.</span></span>
</span></span>
</span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A1.SS1.p1.pic1.p4.2" class="ltx_p"><span id="A1.SS1.p1.pic1.p4.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3. Favor Definition<span id="A1.SS1.p1.pic1.p4.2.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS1.p1.pic1.p4.3" class="ltx_p"><span id="A1.SS1.p1.pic1.p4.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Classify the tweet as favor if it:</span></span>
<span id="A1.I2" class="ltx_enumerate">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Shows an explicitly positive stance: openly supports </span><span id="A1.I2.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{target}</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Uses pro-</span><span id="A1.I2.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{target}</span><span id="A1.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> keywords: languages that frames </span><span id="A1.I2.i2.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{target}</span><span id="A1.I2.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> in positive light</span></span>
</span></span>
</span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A1.SS1.p1.pic1.p4.4" class="ltx_p"><span id="A1.SS1.p1.pic1.p4.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">4. Against Definition<span id="A1.SS1.p1.pic1.p4.4.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS1.p1.pic1.p4.5" class="ltx_p"><span id="A1.SS1.p1.pic1.p4.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Classify the tweet as against if it:</span></span>
<span id="A1.I3" class="ltx_enumerate">
<span id="A1.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I3.i1.p1" class="ltx_para">
<span id="A1.I3.i1.p1.1" class="ltx_p"><span id="A1.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Shows an explicitly negative stance: openly opposes </span><span id="A1.I3.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{target}</span></span>
</span></span>
<span id="A1.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I3.i2.p1" class="ltx_para">
<span id="A1.I3.i2.p1.1" class="ltx_p"><span id="A1.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Uses against </span><span id="A1.I3.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{target}</span><span id="A1.I3.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> keywords: languages that frames the target </span><span id="A1.I3.i2.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{target}</span><span id="A1.I3.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> in negative light</span></span>
</span></span>
</span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A1.SS1.p1.pic1.p4.6" class="ltx_p"><span id="A1.SS1.p1.pic1.p4.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">5. Neutral Definition<span id="A1.SS1.p1.pic1.p4.6.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS1.p1.pic1.p4.7" class="ltx_p"><span id="A1.SS1.p1.pic1.p4.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Classify the tweet as neutral if it:</span></span>
<span id="A1.I4" class="ltx_enumerate">
<span id="A1.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I4.i1.p1" class="ltx_para">
<span id="A1.I4.i1.p1.1" class="ltx_p"><span id="A1.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Shows no clear stance: it neither supports nor opposes </span><span id="A1.I4.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{target}</span></span>
</span></span>
<span id="A1.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I4.i2.p1" class="ltx_para">
<span id="A1.I4.i2.p1.1" class="ltx_p"><span id="A1.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Uses neutral or tentative language: e.g., simply asking a question or stating opinion that signals indifference/uncertainty</span></span>
</span></span>
</span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A1.SS1.p1.pic1.p4.8" class="ltx_p"><span id="A1.SS1.p1.pic1.p4.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">6. Output Format<span id="A1.SS1.p1.pic1.p4.8.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS1.p1.pic1.p4.9" class="ltx_p"><span id="A1.SS1.p1.pic1.p4.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Strictly follow the guidelines above and classify the tweet if it is Favor, Against, or Neutral to the target “<span id="A1.SS1.p1.pic1.p4.9.1.1" class="ltx_text ltx_font_typewriter">{target}</span>”. Reply with the classification label only, without any additional text or explanation.</span></span>
</span>
<span id="A1.SS1.p1.pic1.p2" class="ltx_para ltx_noindent"><span class="ltx_inline-block"><svg id="A1.SS1.p1.pic1.p2.pic1" class="ltx_picture" color="#000000" height="55.64" overflow="visible" version="1.1" viewbox="0 0 626.46 55.64" width="626.46"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,55.64) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#B3B3B3;" fill="#B3B3B3" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.63 L 0 53.01 C 0 54.47 1.18 55.64 2.63 55.64 L 623.83 55.64 C 625.28 55.64 626.46 54.47 626.46 53.01 L 626.46 2.63 C 626.46 1.18 625.28 0 623.83 0 L 2.63 0 C 1.18 0 0 1.18 0 2.63 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 2.63 L 0.55 53.01 C 0.55 54.16 1.48 55.09 2.63 55.09 L 623.83 55.09 C 624.97 55.09 625.9 54.16 625.9 53.01 L 625.9 2.63 C 625.9 1.48 624.97 0.55 623.83 0.55 L 2.63 0.55 C 1.48 0.55 0.55 1.48 0.55 2.63 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.03 13.1)"><foreignobject style="--ltx-fo-width:43.83em;--ltx-fo-height:2.35em;--ltx-fo-depth:0.22em;font-size:10pt;" height="35.59" overflow="visible" transform="matrix(1 0 0 -1 0 32.52)" width="606.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS1.p1.pic1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.83em;">
<span id="A1.SS1.p1.pic1.p2.pic1.1.1" class="ltx_p"><span id="A1.SS1.p1.pic1.p2.pic1.1.1.1" class="ltx_text ltx_font_typewriter">Tweet: {tweet}</span></span>
<span id="A1.SS1.p1.pic1.p2.pic1.1.2" class="ltx_p"><span id="A1.SS1.p1.pic1.p2.pic1.1.2.1" class="ltx_text ltx_font_typewriter">Stance: [Favor/Against/Neutral]</span></span>
</span></span></span></foreignobject></g></g></svg>