<span id="S4.F4.pic1.1.2" class="ltx_p ltx_align_left"><span id="S4.F4.pic1.1.2.1" class="ltx_text" style="font-size:70%;">Martha is planning her Christmas party. She invited 2 families with 6 people <span id="S4.F4.pic1.1.2.1.1" class="ltx_text ltx_font_bold">[each family has 6 people: 2x6=12 people]</span> and 3 families with 4 people <span id="S4.F4.pic1.1.2.1.2" class="ltx_text ltx_font_bold">[each family has 4 people: 3x4=12 people]</span>. <span id="S4.F4.pic1.1.2.1.3" class="ltx_text ltx_font_bold">[Total invited: 12+12=24 people]</span> 8 people couldn’t come due to illness, and 1/4 that number <span id="S4.F4.pic1.1.2.1.4" class="ltx_text ltx_font_bold">[1/4x8=2 people]</span> had previous commitments. How many people show up for Martha’s party?</span></span>
