<span id="A2.F15.pic1.2.1" class="ltx_p"><span id="A2.F15.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role.<span id="A2.F15.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
Insert a single sentence that steers the language model to predict
</span><span id="A2.F15.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#0000FF;">{desired_text}</span><span id="A2.F15.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> instead of </span><span id="A2.F15.pic1.2.1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#0000FF;">{undesired_text}</span><span id="A2.F15.pic1.2.1.1.5" class="ltx_text ltx_font_medium">.</span></span></span>
<span id="A2.F15.pic1.2.2" class="ltx_p"><span id="A2.F15.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Context.<span id="A2.F15.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
The story template below contains a placeholder <span id="A2.F15.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">{0}</span> indicating where your sentence will be inserted:</span></span></span>
<span id="A2.F15.pic1.2.3" class="ltx_quote">
<span id="A2.F15.pic1.2.3.1" class="ltx_p"><span id="A2.F15.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#0000FF;">{template}</span></span>
</span>
<span id="A2.F15.pic1.2.4" class="ltx_p"><span id="A2.F15.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output.<span id="A2.F15.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
Think aloud about what cues will bias the model toward the desired word.
Then write <span id="A2.F15.pic1.2.4.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#0000FF;">{num_sentences}</span> alternative sentences (one per line) that could fill the placeholder.</span></span></span>
<span id="A2.I4" class="ltx_itemize">
<span id="A2.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
