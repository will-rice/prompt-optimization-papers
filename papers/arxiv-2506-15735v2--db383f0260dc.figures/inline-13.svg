<span id="A2.I4.i1.p1.1" class="ltx_p"><span id="A2.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Preserve the story’s style, tense, and point of view.</span></span>
</span></span>
<span id="A2.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I4.i2.p1.1" class="ltx_p"><span id="A2.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Aim for fluency: each sentence must read naturally in context.</span></span>
</span></span>
<span id="A2.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i3.p1" class="ltx_para ltx_noindent">
<span id="A2.I4.i3.p1.1" class="ltx_p"><span id="A2.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Leverage semantic or lexical hints that raise the likelihood of </span><span id="A2.I4.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#0000FF;">{desired_text}</span><span id="A2.I4.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A2.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i4.p1" class="ltx_para ltx_noindent">
<span id="A2.I4.i4.p1.1" class="ltx_p"><span id="A2.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoid introducing new plot elements that conflict with the surrounding text.</span></span>
</span></span>
