<span id="S3.F2.pic1.2.1" class="ltx_p"><span id="S3.F2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Template:<span id="S3.F2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Max decided to try a new hiking trail in the mountains. </span>&lt;context&gt;<span id="S3.F2.pic1.2.1.1.2" class="ltx_text ltx_font_medium ltx_font_italic"> He checked the weather forecast and packed extra water </span>&lt;/context&gt;<span id="S3.F2.pic1.2.1.1.3" class="ltx_text ltx_font_medium">. The trail was steep with many rocks along the path. When Max reached the summit, he was <span id="S3.F2.pic1.2.1.1.3.1" class="ltx_text" style="--ltx-fg-color:#008000;">injured</span> / <span id="S3.F2.pic1.2.1.1.3.2" class="ltx_text" style="--ltx-fg-color:#B30000;">triumphant</span></span></span></span>
<span id="S3.F2.pic1.2.2" class="ltx_p"><span id="S3.F2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">EPO context modification:<span id="S3.F2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> <span id="S3.F2.pic1.2.2.1.1.1" class="ltx_text ltx_font_italic">He checked the weather meticulously yet chose unsuitable gear.</span></span></span></span>
