</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.67 159.8)"><foreignobject style="--ltx-fo-width:38.5em;--ltx-fo-height:17.78em;--ltx-fo-depth:10.92em;font-size:10pt;" height="397.2" overflow="visible" transform="matrix(1 0 0 -1 0 246.07)" width="532.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.5em;">
<span id="A2.F13.pic1.2.1" class="ltx_p"><span id="A2.F13.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role.<span id="A2.F13.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
You craft inputs that steer a language model to predict an unknown target word.</span></span></span>
<span id="A2.F13.pic1.2.2" class="ltx_p"><span id="A2.F13.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Context.<span id="A2.F13.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
Edit exactly <em id="A2.F13.pic1.2.2.1.1.1" class="ltx_emph ltx_font_italic">one</em> sentence—marked <span id="A2.F13.pic1.2.2.1.1.2" class="ltx_text ltx_font_smallcaps">INSERT TEXT HERE</span>—inside the template:</span></span></span>
<span id="A2.F13.pic1.2.3" class="ltx_quote">
<span id="A2.F13.pic1.2.3.1" class="ltx_p"><span id="A2.F13.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#0000FF;">{full_template}</span></span>
</span>
<span id="A2.F13.pic1.2.4" class="ltx_p"><span id="A2.F13.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Current candidates: <span id="A2.F13.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#0000FF;">{current_epo_str}</span></span></span>
<span id="A2.F13.pic1.2.5" class="ltx_p"><span id="A2.F13.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output.<span id="A2.F13.pic1.2.5.1.1" class="ltx_text ltx_font_medium">
Produce <span id="A2.F13.pic1.2.5.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#0000FF;">{num_sentences}</span> revised sentences that satisfy:</span></span></span>
<span id="A2.I2" class="ltx_itemize">
<span id="A2.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i1.p1.1" class="ltx_p"><span id="A2.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Fluency first: each sentence must read naturally.</span></span>
</span></span>
<span id="A2.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i2.p1.1" class="ltx_p"><em id="A2.I2.i2.p1.1.1" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Three variation levels:</em><span id="A2.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
(i) near-paraphrase with fluency fixes;
(ii) retain key trigger words but alter the rest;
(iii) free rewrite to maximise token logit gap.</span></span>
</span></span>
<span id="A2.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I2.i3.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i3.p1.1" class="ltx_p"><span id="A2.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Keep length comparable to the seed sentences.</span></span>
</span></span>
<span id="A2.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I2.i4.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i4.p1.1" class="ltx_p"><span id="A2.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use realistic-sounding language.</span></span>
</span></span>
<span id="A2.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I2.i5.p1" class="ltx_para">
<span id="A2.I2.i5.p1.1" class="ltx_p"><span id="A2.I2.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">After thinking aloud, list each candidate plus a truncation preference </span><span id="A2.I2.i5.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(left/right)</span><span id="A2.I2.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>