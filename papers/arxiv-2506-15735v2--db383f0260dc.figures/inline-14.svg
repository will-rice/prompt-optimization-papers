<span id="A2.I5.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i1.p1.1" class="ltx_p"><span id="A2.I5.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Content factors</span></span>
<span id="A2.I5.i1.I1" class="ltx_itemize">
<span id="A2.I5.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A2.I5.i1.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A2.I5.i1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i1.I1.i1.p1.1" class="ltx_p"><span id="A2.I5.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">References to post-July 2023 events, people, or topics</span></span>
</span></span>
<span id="A2.I5.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A2.I5.i1.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A2.I5.i1.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i1.I1.i2.p1.1" class="ltx_p"><span id="A2.I5.i1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Coverage of current affairs, politics, culture, technology, etc.</span></span>
</span></span>
<span id="A2.I5.i1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A2.I5.i1.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A2.I5.i1.I1.i3.p1" class="ltx_para">
<span id="A2.I5.i1.I1.i3.p1.1" class="ltx_p"><span id="A2.I5.i1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Newsworthiness and substantive content</span></span>
</span></span>
</span>
</span></span>
<span id="A2.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I5.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i2.p1.1" class="ltx_p"><span id="A2.I5.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Style factors</span></span>
<span id="A2.I5.i2.I1" class="ltx_itemize">
<span id="A2.I5.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A2.I5.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A2.I5.i2.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i2.I1.i1.p1.1" class="ltx_p"><span id="A2.I5.i2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Formal, concise headline diction</span></span>
</span></span>
<span id="A2.I5.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A2.I5.i2.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A2.I5.i2.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i2.I1.i2.p1.1" class="ltx_p"><span id="A2.I5.i2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Headline formatting (not a full sentence or paragraph)</span></span>
</span></span>
<span id="A2.I5.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A2.I5.i2.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A2.I5.i2.I1.i3.p1" class="ltx_para">
<span id="A2.I5.i2.I1.i3.p1.1" class="ltx_p"><span id="A2.I5.i2.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Absence of slang, excess punctuation, or overly casual language</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A2.F16.pic1.2.5" class="ltx_p"><span id="A2.F16.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Give partial credit if only some aspects match.</span></span>
<span id="A2.I6" class="ltx_itemize">
<span id="A2.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I6.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I6.i1.p1.1" class="ltx_p"><span id="A2.I6.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">0 - 3</span><span id="A2.I6.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: little or no similarity in content or style</span></span>
</span></span>
<span id="A2.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I6.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I6.i2.p1.1" class="ltx_p"><span id="A2.I6.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">4 - 6</span><span id="A2.I6.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: some elements resemble an NYT headline</span></span>
</span></span>
<span id="A2.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I6.i3.p1" class="ltx_para">
<span id="A2.I6.i3.p1.1" class="ltx_p"><span id="A2.I6.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">7 - 10</span><span id="A2.I6.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: strongly resembles a post-July 2023 NYT headline</span></span>
</span></span>
</span>
<span id="A2.F16.pic1.2.6" class="ltx_p"><span id="A2.F16.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Be generous — if the text contains any notable news-like content from recent events, award at least some points.</span></span>
<span id="A2.F16.pic1.2.7" class="ltx_p"><span id="A2.F16.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output.<span id="A2.F16.pic1.2.7.1.1" class="ltx_text ltx_font_medium">
Return a single integer score between 0 and 10.</span></span></span>
</span></span></span></foreignobject></g></g></svg>