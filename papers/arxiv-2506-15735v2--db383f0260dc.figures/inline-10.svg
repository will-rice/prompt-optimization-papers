<span id="A2.F12.pic1.1.1" class="ltx_p"><span id="A2.F12.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">GPT-4o Helper Prompt – SAE Activation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.67 11.36)"><foreignobject style="--ltx-fo-width:38.5em;--ltx-fo-height:32.47em;--ltx-fo-depth:0.19em;font-size:10pt;" height="452.01" overflow="visible" transform="matrix(1 0 0 -1 0 449.32)" width="532.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F12.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.5em;">
<span id="A2.F12.pic1.2.1" class="ltx_p"><span id="A2.F12.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role.<span id="A2.F12.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
You are a specialised text-generation assistant that creates inputs to </span>maximise<span id="A2.F12.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> activation of a target neural feature.</span></span></span>
<span id="A2.F12.pic1.2.2" class="ltx_p"><span id="A2.F12.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Context.<span id="A2.F12.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
Below are example texts ranked by activation score:</span></span></span>
<span id="A2.F12.pic1.2.3" class="ltx_quote">
<span id="A2.F12.pic1.2.3.1" class="ltx_p"><span id="A2.F12.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#0000FF;">{examples_str}</span></span>
</span>
<span id="A2.F12.pic1.2.4" class="ltx_p"><span id="A2.F12.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output.<span id="A2.F12.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
After thinking aloud, generate <span id="A2.F12.pic1.2.4.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#0000FF;">{num_sentences}</span> new examples that may strongly activate the feature.</span></span></span>
<span id="A2.I1" class="ltx_itemize">
<span id="A2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I1.i1.p1.1" class="ltx_p"><span id="A2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do </span><em id="A2.I1.i1.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">not</em><span id="A2.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> be distracted by low-ranked examples.</span></span>
</span></span>
<span id="A2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I1.i2.p1.1" class="ltx_p"><span id="A2.I1.i2.p1.1.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">must include</span><span id="A2.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> some purely grammatical paraphrases of high-ranked samples.</span></span>
</span></span>
<span id="A2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="A2.I1.i3.p1.1" class="ltx_p"><span id="A2.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Look for common patterns; make at least one candidate closely mirror the top example.</span></span>
</span></span>
<span id="A2.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i4.p1" class="ltx_para ltx_noindent">
<span id="A2.I1.i4.p1.1" class="ltx_p"><span id="A2.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Diversify: capture different hypotheses of what triggers the feature.</span></span>
</span></span>
<span id="A2.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i5.p1" class="ltx_para ltx_noindent">
<span id="A2.I1.i5.p1.1" class="ltx_p"><span id="A2.I1.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Match the length of the seed examples.</span></span>
</span></span>
<span id="A2.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i6.p1" class="ltx_para">
<span id="A2.I1.i6.p1.1" class="ltx_p"><span id="A2.I1.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use natural, grammatical language—even if the scenario is unrealistic.</span></span>
</span></span>
</span>
<span id="A2.F12.pic1.2.5" class="ltx_p"><span id="A2.F12.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each line should end with a truncation tag <span id="A2.F12.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">(left)</span> or <span id="A2.F12.pic1.2.5.1.2" class="ltx_text ltx_font_typewriter">(right)</span> indicating which side to trim if padding is required.</span></span>
</span></span></span></foreignobject></g></g></svg>