<span id="A3.SS1.p4.pic1.1.3" class="ltx_p"><span id="A3.SS1.p4.pic1.1.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. We have two probability functions <math id="A3.SS1.p4.pic1.m4" class="ltx_Math" alttext="P_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">P_{1}</annotation></semantics></math> and <math id="A3.SS1.p4.pic1.m5" class="ltx_Math" alttext="P_{2}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><annotation encoding="application/x-tex">P_{2}</annotation></semantics></math>.<span id="A3.SS1.p4.pic1.1.3.1.1" class="ltx_text ltx_font_serif">
</span>2. There exists at least one event <math id="A3.SS1.p4.pic1.m6" class="ltx_Math" alttext="X" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><annotation encoding="application/x-tex">X</annotation></semantics></math> such that <math id="A3.SS1.p4.pic1.m7" class="ltx_Math" alttext="P_{1}(X)\neq P_{2}(X)" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">P_{1}(X)\neq P_{2}(X)</annotation></semantics></math>.<span id="A3.SS1.p4.pic1.1.3.1.2" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS1.p4.pic1.1.4" class="ltx_p"><span id="A3.SS1.p4.pic1.1.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">We need to show that for any event <math id="A3.SS1.p4.pic1.m8" class="ltx_Math" alttext="D" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><annotation encoding="application/x-tex">D</annotation></semantics></math>, there exists at least one event <math id="A3.SS1.p4.pic1.m9" class="ltx_Math" alttext="X^{\prime}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">′</mo></msup><annotation encoding="application/x-tex">X^{\prime}</annotation></semantics></math> such that <math id="A3.SS1.p4.pic1.m10" class="ltx_Math" alttext="P_{1}(X^{\prime}|D)\neq P_{2}(X^{\prime}|D)" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">′</mo></msup><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">′</mo></msup><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">P_{1}(X^{\prime}|D)\neq P_{2}(X^{\prime}|D)</annotation></semantics></math>.<span id="A3.SS1.p4.pic1.1.4.1.1" class="ltx_text ltx_font_serif">
