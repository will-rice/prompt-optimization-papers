<span id="A3.SS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.26em;">
<span id="A3.SS1.p3.pic1.1.1" class="ltx_p"><span id="A3.SS1.p3.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Input: Given two probability functions <math id="A3.SS1.p3.pic1.m1" class="ltx_Math" alttext="P_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">P_{1}</annotation></semantics></math> and <math id="A3.SS1.p3.pic1.m2" class="ltx_Math" alttext="P_{2}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><annotation encoding="application/x-tex">P_{2}</annotation></semantics></math>. Suppose that there exists at least X such that <math id="A3.SS1.p3.pic1.m3" class="ltx_Math" alttext="P_{1}(X)\neq P_{2}(X)" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">P_{1}(X)\neq P_{2}(X)</annotation></semantics></math>. Prove that for any D, there exists at least X’ such that <math id="A3.SS1.p3.pic1.m4" class="ltx_Math" alttext="P_{1}(X^{\prime}|D)\neq P_{2}(X^{\prime})" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">′</mo></msup><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">′</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">P_{1}(X^{\prime}|D)\neq P_{2}(X^{\prime})</annotation></semantics></math>.<span id="A3.SS1.p3.pic1.1.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
