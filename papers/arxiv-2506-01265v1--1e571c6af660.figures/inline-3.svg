<span id="A7.SS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.26em;">
<span id="A7.SS1.p2.pic1.1.1" class="ltx_p"><span id="A7.SS1.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate how well an assistant’s answer aligns with the reference answer and the quality of the assistant’s answer. You will be given a user prompt, a reference answer and an assistant’s answer.
Your evaluation must consider the following criteria:</span></span>
<span id="A7.SS1.p2.pic1.1.2" class="ltx_p"><span id="A7.SS1.p2.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Format consistency: ensuring the generated response matches the length and structure of the reference.</span></span>
<span id="A7.SS1.p2.pic1.1.3" class="ltx_p"><span id="A7.SS1.p2.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Content completeness: evaluating whether all key points present in the reference are included in the assistant’s answer.</span></span>
<span id="A7.SS1.p2.pic1.1.4" class="ltx_p"><span id="A7.SS1.p2.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Factuality: checking for factual correctness of the assistant’s answer.</span></span>
<span id="A7.SS1.p2.pic1.1.5" class="ltx_p"><span id="A7.SS1.p2.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Style adherence: ensuring that the tone, style, and level of detail of the of the assistant’s answer match the reference.</span></span>
<span id="A7.SS1.p2.pic1.1.6" class="ltx_p"><span id="A7.SS1.p2.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Assistant’s answer quality: assessing how well the response satisfies the user’s requirements.</span></span>
<span id="A7.SS1.p2.pic1.1.7" class="ltx_p"><span id="A7.SS1.p2.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Begin your evaluation by providing a short explanation for each. Be as objective as possible. After providing your explanation, please rate the response on all the criterion on a scale of 1 to 10 by strictly following this format:</span></span>
<span id="A7.SS1.p2.pic1.1.8" class="ltx_p"><span id="A7.SS1.p2.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Explanation]</span></span>
<span id="A7.SS1.p2.pic1.1.9" class="ltx_p"><span id="A7.SS1.p2.pic1.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">…</span></span>
<span id="A7.SS1.p2.pic1.1.10" class="ltx_p"><span id="A7.SS1.p2.pic1.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Explanation]</span></span>
<span id="A7.SS1.p2.pic1.1.11" class="ltx_p"><span id="A7.SS1.p2.pic1.1.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Ratings]</span></span>
<span id="A7.SS1.p2.pic1.1.12" class="ltx_p"><span id="A7.SS1.p2.pic1.1.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">{</span></span>
<span id="A7.SS1.p2.pic1.1.13" class="ltx_p"><span id="A7.SS1.p2.pic1.1.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;Format&quot;: 1-10,</span></span>
<span id="A7.SS1.p2.pic1.1.14" class="ltx_p"><span id="A7.SS1.p2.pic1.1.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;Content&quot;: 1-10,</span></span>
<span id="A7.SS1.p2.pic1.1.15" class="ltx_p"><span id="A7.SS1.p2.pic1.1.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;Factuality&quot;: 1-10,</span></span>
<span id="A7.SS1.p2.pic1.1.16" class="ltx_p"><span id="A7.SS1.p2.pic1.1.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;Style&quot;: 1-10,</span></span>
<span id="A7.SS1.p2.pic1.1.17" class="ltx_p"><span id="A7.SS1.p2.pic1.1.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;Quality&quot;: 1-10,</span></span>
<span id="A7.SS1.p2.pic1.1.18" class="ltx_p"><span id="A7.SS1.p2.pic1.1.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
<span id="A7.SS1.p2.pic1.1.19" class="ltx_p"><span id="A7.SS1.p2.pic1.1.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Ratings]</span></span>
<span id="A7.SS1.p2.pic1.1.20" class="ltx_p"><span id="A7.SS1.p2.pic1.1.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">[User Prompt]</span></span>
