to the following systematic rules:

1. Names of people (full names or initials).
2. Locations (specific place names).
3. Addresses (full addresses).
4. Phone numbers.
5. Email addresses.
6. Dates (exact dates or ranges).
7. Medical records (such as diagnoses or treatments).
8. Financial information (such as bank account numbers, credit card details).
9. Any other information that, according to common sense, should not be
disclosed publicly.

Please apply these rules to the provided clinical texts and annotate any
