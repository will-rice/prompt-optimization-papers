clinical_text
TEXT TO ANALYZE HERE

output
private_phrases:

* phrase1
* phrase2
* phrase3

---

DOMAIN INFORMATION

PII and sensitive details in legal contexts include names,
birthdates, addresses, organization affiliations, specific legal
cases, and personal conditions or events.

Dates, locations, and organizations often hold significant
relevance and should be marked as private to protect individual
identities and confidentiality.

Ensure thorough identification of individuals involved in the
cases, including lawyers, defendants, victims, and officials.

Be cautious with medical details, financial amounts, and legal
statuses as these can also constitute sensitive personal
information.


