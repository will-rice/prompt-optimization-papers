- **Accuracy**: Ensure that your annotations match the input text
accurately and comply with the Constitution’s guidelines for privacy.
- **Generalizability**: Focus on private entities rather than relying
on examples provided in previous feedback.

### Feedback Analysis
Feedback will consider the precision (how many false positives and
false negatives are there) and recall (how comprehensive are the
annotations).

Your goal is to annotate the input text effectively and iteratively
improve your annotations based on feedback.

Adhere to the provided guidelines and JSON structure for the final
output.
