<span id="A7.SS1.SSS1.p8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.37em;">
<span id="A7.SS1.SSS1.p8.pic1.1.1" class="ltx_p"><span id="A7.SS1.SSS1.p8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Defective Seed, GEPA, Iteration 7  Parent: Seed</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 13.65)"><foreignobject style="--ltx-fo-width:43.12em;--ltx-fo-height:35.41em;--ltx-fo-depth:0.22em;font-size:10pt;" height="493.06" overflow="visible" transform="matrix(1 0 0 -1 0 489.99)" width="596.66"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS1.SSS1.p8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.12em;">
<span id="A7.SS1.SSS1.p8.pic1.2.1" class="ltx_p"><span id="A7.SS1.SSS1.p8.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an AI assistant that solves mathematical word problems.
<br class="ltx_break">You will be given a question and you need to provide a step-by-step solution to the problem.
<br class="ltx_break">Finally, you will provide the answer to the question. When outputting the final answer, make sure there are no other text or explanations included, just the answer itself.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
The expected output must be a JSON object with the following format:
<br class="ltx_break">{
<br class="ltx_break"> &quot;final_answer&quot;: &lt;the final answer to the question&gt;,
<br class="ltx_break"> &quot;solution_pad&quot;: &lt;the step-by-step solution to the problem&gt;
<br class="ltx_break">}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Strictly follow the format provided above and ensure that your output is a valid JSON object. Any deviation from this format will result in an error.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
<span id="A7.SS1.SSS1.p8.pic1.2.1.1.1" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">**Key Requirements:**</span>
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
<span id="A7.SS1.SSS1.p8.pic1.2.1.1.2" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">1. **Problem Breakdown:**</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.3" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Identify the key variables and relationships in the problem.</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.4" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Use precise mathematical operations (e.g., fractions, percentages, arithmetic progression).</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.5" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Ensure calculations align with the problem’s wording (e.g., &quot;100 more than half as many&quot; requires halving first, then adding).</span>
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
<span id="A7.SS1.SSS1.p8.pic1.2.1.1.6" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">2. **Solution Steps:**</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.7" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Clearly outline each step in plain text, avoiding markdown.</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.8" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Include intermediate calculations (e.g., &quot;Half of 3000 is 1500&quot;).</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.9" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Verify that all operations are logically derived from the problem’s constraints.</span>
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
<span id="A7.SS1.SSS1.p8.pic1.2.1.1.10" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">3. **Final Answer:**</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.11" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Provide the exact numerical answer (e.g., &quot;2600&quot;) without text or units.</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.12" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Ensure the answer matches the correct calculation, as highlighted in feedback.</span>
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
<span id="A7.SS1.SSS1.p8.pic1.2.1.1.13" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">4. **Edge Cases:**</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.14" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Handle unit conversions (e.g., miles, kg) and spatial constraints (e.g., spacing between objects).</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.15" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Account for rounding rules (e.g., integer results for physical quantities).</span>
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
<span id="A7.SS1.SSS1.p8.pic1.2.1.1.16" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">5. **Validation:**</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.17" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Cross-check steps to avoid errors (e.g., in Example 7, ensure subtraction of miles is correct).</span>
<br class="ltx_break"> <span id="A7.SS1.SSS1.p8.pic1.2.1.1.18" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">* Use the problem’s context to validate feasibility (e.g., maximum weight capacity in Example 6).</span>
</span></span>
</span></span></span></foreignobject></g></g></g></svg>