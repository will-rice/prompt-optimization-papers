<span id="A7.SS3.SSS2.p3.pic1.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#009900;">Selected: H1 [<span id="A7.SS3.SSS2.p3.pic1.2.1.1.3.1" class="ltx_text ltx_font_typewriter">format_and_syntax</span>] — Candidate Accepted
<br class="ltx_break" style="--ltx-break-space:2.0pt;"></span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A7.SS3.SSS2.p3.pic1.2.2" class="ltx_p"><span id="A7.SS3.SSS2.p3.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFFFB3;">Solve the mathematical problem and output a strictly formatted JSON object with the following structure:</span></span>
<span id="A7.SS3.SSS2.p3.pic1.2.3" class="ltx_p"><span id="A7.SS3.SSS2.p3.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFFFB3;">{</span></span>
<span id="A7.SS3.SSS2.p3.pic1.2.4" class="ltx_p"><span id="A7.SS3.SSS2.p3.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> <span id="A7.SS3.SSS2.p3.pic1.2.4.1.1" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">&quot;final_answer&quot;: &lt;numeric_value&gt;</span>
<br class="ltx_break"><span id="A7.SS3.SSS2.p3.pic1.2.4.1.2" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">}</span>
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
<span id="A7.SS3.SSS2.p3.pic1.2.4.1.3" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">**Rules**:</span>
<br class="ltx_break"><span id="A7.SS3.SSS2.p3.pic1.2.4.1.4" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">1. **Numeric Final Answer**: The value in the &quot;final_answer&quot; field must be a single numeric value (e.g., 42, 3.14, -5). Do not include expressions, calculations, or text (e.g., 5 + 3, 10 * 2).</span>
<br class="ltx_break"><span id="A7.SS3.SSS2.p3.pic1.2.4.1.5" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">2. **JSON Validation**: Ensure the output is valid JSON with proper syntax (e.g., commas, brackets).</span>
<br class="ltx_break"><span id="A7.SS3.SSS2.p3.pic1.2.4.1.6" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">3. **No Extra Fields**: Only include the &quot;final_answer&quot; key. Do not add additional fields, explanations, or formatting (e.g., markdown, code blocks).</span>
<br class="ltx_break"><span id="A7.SS3.SSS2.p3.pic1.2.4.1.7" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">4. **Accuracy**: Compute the exact numerical result of the problem, ensuring alignment with the problem’s context and mathematical principles.</span>
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
<span id="A7.SS3.SSS2.p3.pic1.2.4.1.8" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">**Example**:</span>
<br class="ltx_break"><span id="A7.SS3.SSS2.p3.pic1.2.4.1.9" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">For a problem like &quot;What is 10 + 20?&quot;, the correct output is:</span>
<br class="ltx_break"><span id="A7.SS3.SSS2.p3.pic1.2.4.1.10" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">{&quot;final_answer&quot;: 30}</span>

<br class="ltx_break"><span id="A7.SS3.SSS2.p3.pic1.2.4.1.11" class="ltx_text ltx_font_serif">
</span></span></span>
