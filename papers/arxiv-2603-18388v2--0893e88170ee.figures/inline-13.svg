<span id="A5.SS1.p1.pic1.1.1" class="ltx_p"><span id="A5.SS1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Hypothesis Agent Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 577.93)"><foreignobject style="--ltx-fo-width:45.31em;--ltx-fo-height:0.61em;--ltx-fo-depth:41.02em;font-size:10pt;" height="576.09" overflow="visible" transform="matrix(1 0 0 -1 0 8.46)" width="626.96"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.31em;">
<span id="A5.SS1.p1.pic1.2.1" class="ltx_p"><span id="A5.SS1.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert prompt engineer analyzing why a system prompt causes failures on certain inputs.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
CURRENT SYSTEM PROMPT:
<br class="ltx_break">{curr_instructions}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
ERROR TAXONOMY:
<br class="ltx_break">{error_taxonomy}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
FAILED SAMPLES:
<br class="ltx_break">{failed_samples}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
TASK: Analyze the failed samples and generate exactly {num_hypotheses} diverse root-cause hypotheses.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
For EACH hypothesis:
<br class="ltx_break">1. Select the most fitting category from the Error Taxonomy above (use the exact id field).
<br class="ltx_break">2. Provide a concise description of the specific root cause you identified.
<br class="ltx_break">3. Suggest a concrete fix direction for the prompt.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
IMPORTANT:
<br class="ltx_break">- Each hypothesis MUST address a DIFFERENT aspect of the failures.
<br class="ltx_break">- Try to cover as many different taxonomy categories as possible.
<br class="ltx_break">- Be specific about what exactly in the current prompt causes the failure.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
You MUST respond using EXACTLY the format below. Do NOT write any other text, analysis, or explanation outside of this format. Do NOT use markdown headers or bullet points. Just output exactly {num_hypotheses} blocks in this format:
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
[HYPOTHESIS 1]
<br class="ltx_break">TAG: {taxonomy_id}
<br class="ltx_break">DESCRIPTION: &lt;one or two sentences describing the specific root cause&gt;
<br class="ltx_break">FIX: &lt;one or two sentences describing how to fix the prompt&gt;
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
[HYPOTHESIS 2]
<br class="ltx_break">TAG: {taxonomy_id}
<br class="ltx_break">DESCRIPTION: &lt;one or two sentences describing the specific root cause&gt;
<br class="ltx_break">FIX: &lt;one or two sentences describing how to fix the prompt&gt;
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
[HYPOTHESIS 3]
<br class="ltx_break">TAG: {taxonomy_id}
<br class="ltx_break">DESCRIPTION: &lt;one or two sentences describing the specific root cause&gt;
<br class="ltx_break">FIX: &lt;one or two sentences describing how to fix the prompt&gt;
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Start your response immediately. Do not include any preamble.
<span id="A5.SS1.p1.pic1.2.1.1.1" class="ltx_text ltx_font_serif">
