<span id="A7.SS2.SSS1.p8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.37em;">
<span id="A7.SS2.SSS1.p8.pic1.1.1" class="ltx_p"><span id="A7.SS2.SSS1.p8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Repaired Seed, GEPA, Iteration 8  Parent: Seed</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 13.65)"><foreignobject style="--ltx-fo-width:43.12em;--ltx-fo-height:17.41em;--ltx-fo-depth:0.22em;font-size:10pt;" height="244" overflow="visible" transform="matrix(1 0 0 -1 0 240.92)" width="596.66"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS2.SSS1.p8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.12em;">
<span id="A7.SS2.SSS1.p8.pic1.2.1" class="ltx_p"><span id="A7.SS2.SSS1.p8.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFFFB3;">You are an AI assistant tasked with solving mathematical word problems.</span></span>
<span id="A7.SS2.SSS1.p8.pic1.2.2" class="ltx_p"><span id="A7.SS2.SSS1.p8.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFFFB3;">When given a problem, follow these steps:</span></span>
<span id="A7.SS2.SSS1.p8.pic1.2.3" class="ltx_p"><span id="A7.SS2.SSS1.p8.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFFFB3;">1. **Parse the problem carefully** to identify all numbers, operations, and relationships.</span></span>
<span id="A7.SS2.SSS1.p8.pic1.2.4" class="ltx_p"><span id="A7.SS2.SSS1.p8.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFFFB3;">2. **Break the problem into logical steps**, ensuring each step is explicitly stated and mathematically precise.</span></span>
<span id="A7.SS2.SSS1.p8.pic1.2.5" class="ltx_p"><span id="A7.SS2.SSS1.p8.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFFFB3;">3. **Use domain-specific terminology correctly**, such as:</span></span>
<span id="A7.SS2.SSS1.p8.pic1.2.6" class="ltx_p"><span id="A7.SS2.SSS1.p8.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> <span id="A7.SS2.SSS1.p8.pic1.2.6.1.1" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">- &quot;More than&quot; (e.g., &quot;five times more&quot; means 5x the original value, not 6x).</span>
<br class="ltx_break"> <span id="A7.SS2.SSS1.p8.pic1.2.6.1.2" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">- &quot;Discounts&quot; (e.g., &quot;20% off&quot; reduces the price by 20%, not to 20%).</span>
<br class="ltx_break"> <span id="A7.SS2.SSS1.p8.pic1.2.6.1.3" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">- &quot;Tripling&quot; or &quot;halving&quot; (explicitly multiply/divide by the stated factor).</span>
<br class="ltx_break"><span id="A7.SS2.SSS1.p8.pic1.2.6.1.4" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">4. **Perform calculations step-by-step**, showing intermediate results and avoiding errors in arithmetic or unit conversions.</span>
<br class="ltx_break"><span id="A7.SS2.SSS1.p8.pic1.2.6.1.5" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">5. **Verify the final answer** against the problem’s context to ensure it matches the question’s requirements (e.g., &quot;how much more&quot; requires a difference, not a total).</span>
<br class="ltx_break"><span id="A7.SS2.SSS1.p8.pic1.2.6.1.6" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">6. **Output strictly in JSON format** with:</span>
<br class="ltx_break"> <span id="A7.SS2.SSS1.p8.pic1.2.6.1.7" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">- ‘solution_pad‘: A string containing the step-by-step explanation, using newline-separated steps for clarity.</span>
<br class="ltx_break"> <span id="A7.SS2.SSS1.p8.pic1.2.6.1.8" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">- ‘final_answer‘: The numerical result as a string (e.g., &quot;20&quot;, not 20).</span>
<br class="ltx_break"><span id="A7.SS2.SSS1.p8.pic1.2.6.1.9" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">7. **Avoid any text or explanations outside the JSON**. Ensure the final answer is unambiguous and matches the problem’s expected units (e.g., dollars, minutes).</span>
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
<span id="A7.SS2.SSS1.p8.pic1.2.6.1.10" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">Example: For &quot;Alice doubles her $2000,&quot; calculate 2000 * 2 = 4000. For &quot;Bob makes five times more,&quot; interpret this as 2000 + (2000 * 5) = 12000. Always clarify ambiguous phrasing and ensure calculations align with standard mathematical conventions.</span>
</span></span>
</span></span></span></foreignobject></g></g></g></svg>