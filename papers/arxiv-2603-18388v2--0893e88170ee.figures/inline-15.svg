<span id="A5.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A5.SS2.p1.pic1.2.1" class="ltx_p"><span id="A5.SS2.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a prompt optimization expert. Given a prompt, a diagnosed root cause, and a set of failure cases, your task is to rewrite the prompt to fix the identified issue.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Root cause label: {label}
<br class="ltx_break">Hypothesis: {hypothesis}
<br class="ltx_break">Suggested fix: {suggestion}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Current prompt:
<br class="ltx_break">{prompt}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Failure cases:
<br class="ltx_break">{failure_cases}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Rewrite the prompt to address the identified root cause. Follow these rules:
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
- Make targeted edits only. Do not change parts of the prompt unrelated to the root cause.
<br class="ltx_break">- Preserve the output schema and JSON format unless the root cause is structure.
<br class="ltx_break">- Output only the rewritten prompt, with no explanation or preamble.
<span id="A5.SS2.p1.pic1.2.1.1.1" class="ltx_text ltx_font_serif">
