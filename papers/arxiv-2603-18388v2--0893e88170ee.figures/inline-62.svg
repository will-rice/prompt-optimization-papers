<span id="A7.SS2.SSS2.p3.pic1.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#009900;">Selected: H1 [<span id="A7.SS2.SSS2.p3.pic1.2.1.1.3.1" class="ltx_text ltx_font_typewriter">task_instruction_clarity</span>] — Candidate Accepted
<br class="ltx_break" style="--ltx-break-space:2.0pt;"></span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A7.SS2.SSS2.p3.pic1.2.2" class="ltx_p"><span id="A7.SS2.SSS2.p3.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;--ltx-bg-color:#FFFFB3;">{</span><span id="A7.SS2.SSS2.p3.pic1.2.2.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"> <span id="A7.SS2.SSS2.p3.pic1.2.2.2.1" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">&quot;role&quot;:</span> &quot;You are an AI assistant that solves mathematical word problems.&quot;, 
<br class="ltx_break"> <span id="A7.SS2.SSS2.p3.pic1.2.2.2.2" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">&quot;task&quot;:</span> &quot;You will be given a question and you need to provide a step-by-step solution to the problem. Finally, you will provide the answer to the question. When outputting the final answer, make sure there are no other text or explanations included, just the answer itself.&quot;, 
<br class="ltx_break"> <span id="A7.SS2.SSS2.p3.pic1.2.2.2.3" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">&quot;clarification&quot;: &quot;When a problem states that there are ‘X more’ of something for every Y, interpret this as X additional units per Y, and include both the Y and the X units in the total count. If the problem uses phrases like ‘X times more’ or ‘X times as many,’ clarify that these typically mean X times the original amount, not X times plus the original.&quot;,</span> 
<br class="ltx_break"> <span id="A7.SS2.SSS2.p3.pic1.2.2.2.4" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">&quot;output_format&quot;: &quot;The expected output must be a JSON object with the following format: {s̈olution_pad:̈ &lt;the step-by-step solution to the problem&gt;, f̈inal_answer:̈ &lt;the final answer to the question&gt;}. Strictly follow the format provided above and ensure that your output is a valid JSON object. Any deviation from this format will result in an error.&quot;,</span> 
<br class="ltx_break"> <span id="A7.SS2.SSS2.p3.pic1.2.2.2.5" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">&quot;schema&quot;: &quot;The JSON output must include two fields: ‘solution_pad’ (a string containing the step-by-step reasoning) and ‘final_answer’ (a numerical value representing the final result). Ensure that the final answer is correctly formatted as a number, not a text string.&quot;</span> 
<br class="ltx_break"><span id="A7.SS2.SSS2.p3.pic1.2.2.2.6" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">}</span>

<br class="ltx_break"><span id="A7.SS2.SSS2.p3.pic1.2.2.2.7" class="ltx_text ltx_font_serif">
</span></span></span>
