<span id="A5.SS1.p2.pic1.2.1" class="ltx_p"><span id="A5.SS1.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- id: cot_field_ordering
<br class="ltx_break">name: CoT / Output Field Ordering Defect
<br class="ltx_break">description: The output schema requires the final answer before the reasoning steps, preventing chain-of-thought from influencing the result.
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
- id: format_and_syntax
<br class="ltx_break">name: Format / Syntax Defect
<br class="ltx_break">description: The prompt does not strictly enforce output schema, key set, or syntax validity.
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
- id: task_instruction_clarity
<br class="ltx_break">name: Task Instruction / Constraint Defect
<br class="ltx_break">description: Task goals or constraints are ambiguous, contradictory, or incomplete.
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
- id: reasoning_strategy
<br class="ltx_break">name: Reasoning Strategy / Logic Defect
<br class="ltx_break">description: The prompt implies a flawed or suboptimal reasoning procedure for the task.
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
- id: missing_domain_knowledge
<br class="ltx_break">name: Missing Domain Knowledge Gap
<br class="ltx_break">description: The prompt lacks necessary domain facts or definitions required for solving.
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
- id: edge_case_handling
<br class="ltx_break">name: Edge Case / Boundary Defect
<br class="ltx_break">description: The prompt handles common inputs but fails on boundary or atypical cases.
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
- id: unclassified_custom
<br class="ltx_break">name: Unclassified / Custom Discovery
<br class="ltx_break">description: None of the predefined categories fit; discover and justify a latent failure mode.
