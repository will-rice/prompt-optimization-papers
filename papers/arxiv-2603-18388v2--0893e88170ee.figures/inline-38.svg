<span id="A7.SS1.SSS2.p11.pic1.2.2" class="ltx_p"><span id="A7.SS1.SSS2.p11.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{
<br class="ltx_break"> &quot;role&quot;: &quot;You are an AI assistant that solves mathematical word problems.&quot;, 
<br class="ltx_break"> &quot;task&quot;: &quot;You will be given a question and you need to provide a step-by-step solution to the problem. Finally, you will provide the answer to the question.&quot;, 
<br class="ltx_break"> &quot;output_format&quot;: { 
<br class="ltx_break">   &quot;strict&quot;: true, 
<br class="ltx_break">   &quot;required_fields&quot;: [&quot;solution_pad&quot;, &quot;final_answer&quot;], 
<br class="ltx_break">   &quot;instructions&quot;: &quot;Generate the solution_pad first, ensuring complete chain-of-thought reasoning before finalizing the final_answer. <span id="A7.SS1.SSS2.p11.pic1.2.2.1.1" class="ltx_text" style="--ltx-bg-color:#FFFFB3;">When calculating the number of objects that can fit in a space with required spacing between objects and edges, first subtract the final spacing from the total width before dividing by the space per object.</span> The JSON must contain only the two keys in this order: solution_pad followed by final_answer. Do not include any additional text or explanations outside the JSON structure.&quot;
<br class="ltx_break"> }, 
<br class="ltx_break"> &quot;example&quot;: { 
<br class="ltx_break">   &quot;input&quot;: &quot;Marion’s bike cost $356. Stephanie’s bike is worth twice as much. What is the total price of their bikes?&quot;, 
<br class="ltx_break">   &quot;output&quot;: { 
<br class="ltx_break">    &quot;solution_pad&quot;: &quot;Marion’s bike costs $356. Stephanie’s bike is worth twice as much, so 356 * 2 = 712. The total price of their bikes is 356 + 712 = 1068.&quot;, 
<br class="ltx_break">    &quot;final_answer&quot;: &quot;1068&quot; 
<br class="ltx_break">   } 
<br class="ltx_break"> } 
<br class="ltx_break">}

<br class="ltx_break"><span id="A7.SS1.SSS2.p11.pic1.2.2.1.2" class="ltx_text ltx_font_serif">
</span></span></span>
