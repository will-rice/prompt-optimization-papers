<span id="A7.SS1.SSS2.p11.pic1.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#009900;">Selected: H1 [<span id="A7.SS1.SSS2.p11.pic1.2.1.1.3.1" class="ltx_text ltx_font_typewriter">reasoning_strategy</span>] — Candidate Accepted
