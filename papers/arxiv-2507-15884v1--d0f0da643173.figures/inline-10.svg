&lt;/TASK&gt;</span></span>
<span id="A1.SS5.SSS3.p2.pic1.2.4" class="ltx_p"><span id="A1.SS5.SSS3.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;RULES&gt;
