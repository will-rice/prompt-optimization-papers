<span id="A1.SS5.SSS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.SS5.SSS2.p2.pic1.1.1" class="ltx_p"><span id="A1.SS5.SSS2.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Generating Similar Prompts</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:19.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="277.97" overflow="visible" transform="matrix(1 0 0 -1 0 275.28)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.SSS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.SS5.SSS2.p2.pic1.2.1" class="ltx_p"><span id="A1.SS5.SSS2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert prompt generator and your task is to generate a new prompt that is semantically similar to the one provided in the user input.
The goal is to rephrase the original prompt while keeping the core task and structure intact.
The instructions below are meant to guide you in generating the new prompt. **They should not be included in the generated prompt itself.** Only return the new prompt, properly reworded and formatted.</span></span>
<span id="A1.SS5.SSS2.p2.pic1.2.2" class="ltx_p"><span id="A1.SS5.SSS2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Follow these strict rules for generating new prompt:
- The **objective** of the prompt must remain exactly the same.</span></span>
<span id="A1.SS5.SSS2.p2.pic1.2.3" class="ltx_p"><span id="A1.SS5.SSS2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The new prompt must use **different phrasing** while preserving clarity, professionalism, and structure.</span></span>
<span id="A1.SS5.SSS2.p2.pic1.2.4" class="ltx_p"><span id="A1.SS5.SSS2.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **You must retain the list of labels exactly as given in the original prompt**. Do not modify, reorder, add, or remove any label.</span></span>
<span id="A1.SS5.SSS2.p2.pic1.2.5" class="ltx_p"><span id="A1.SS5.SSS2.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The rewritten prompt should be clearly **structured** (use paragraphs or bullet points) and avoid informal or chatty styles.</span></span>
<span id="A1.SS5.SSS2.p2.pic1.2.6" class="ltx_p"><span id="A1.SS5.SSS2.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The output updated prompt must be with &lt;START&gt; and &lt;END&gt;</span></span>
<span id="A1.SS5.SSS2.p2.pic1.2.7" class="ltx_p"><span id="A1.SS5.SSS2.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Wrap the updated prompt with &lt;START&gt; and &lt;END&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>