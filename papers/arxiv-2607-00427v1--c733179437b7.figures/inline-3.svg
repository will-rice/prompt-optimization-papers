<span id="S5.SS3.SSS0.Px5.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.5em;">
<span id="S5.SS3.SSS0.Px5.p2.pic1.1.1" class="ltx_p"><span id="S5.SS3.SSS0.Px5.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Key Findings for RQ2</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.96 377.18)"><foreignobject style="--ltx-fo-width:32.77em;--ltx-fo-height:1.75em;--ltx-fo-depth:26.39em;font-size:10pt;" height="389.44" overflow="visible" transform="matrix(1 0 0 -1 0 24.22)" width="453.44"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS3.SSS0.Px5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.77em;">
<span id="S5.I3" class="ltx_itemize">
<span id="S5.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I3.i1.p1" class="ltx_para">
<span id="S5.I3.i1.p1.1" class="ltx_p"><span id="S5.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Dataset choice has a large, robustly detected effect (Friedman
</span><math id="S5.I3.i1.p1.m1" class="ltx_Math" alttext="\chi^{2}(2)=10.0" display="inline" intent=":literal"><semantics><mrow><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">χ</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10.0</mn></mrow><annotation encoding="application/x-tex">\chi^{2}(2)=10.0</annotation></semantics></math><span id="S5.I3.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><math id="S5.I3.i1.p1.m2" class="ltx_Math" alttext="p=0.007" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.007</mn></mrow><annotation encoding="application/x-tex">p=0.007</annotation></semantics></math><span id="S5.I3.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">; Kendall’s </span><math id="S5.I3.i1.p1.m3" class="ltx_Math" alttext="W=1.00" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">W</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.00</mn></mrow><annotation encoding="application/x-tex">W=1.00</annotation></semantics></math><span id="S5.I3.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, power </span><math id="S5.I3.i1.p1.m4" class="ltx_Math" alttext="\approx 1.00" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≈</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.00</mn></mrow><annotation encoding="application/x-tex">\approx 1.00</annotation></semantics></math><span id="S5.I3.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">): </span><span id="S5.I3.i1.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">SecReq</span><span id="S5.I3.i1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> is easiest and </span><span id="S5.I3.i1.p1.1.8" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">PROMISE_Refined</span><span id="S5.I3.i1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> hardest,
with every LLM agreeing on this ordering.</span></span>
</span></span>
<span id="S5.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I3.i2.p1" class="ltx_para">
<span id="S5.I3.i2.p1.1" class="ltx_p"><span id="S5.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No statistically significant LLM effect was detected (Friedman
</span><math id="S5.I3.i2.p1.m1" class="ltx_Math" alttext="\chi^{2}(4)=2.92" display="inline" intent=":literal"><semantics><mrow><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">χ</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2.92</mn></mrow><annotation encoding="application/x-tex">\chi^{2}(4)=2.92</annotation></semantics></math><span id="S5.I3.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><math id="S5.I3.i2.p1.m2" class="ltx_Math" alttext="p=0.572" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.572</mn></mrow><annotation encoding="application/x-tex">p=0.572</annotation></semantics></math><span id="S5.I3.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">; Kendall’s </span><math id="S5.I3.i2.p1.m3" class="ltx_Math" alttext="W=0.24" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">W</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.24</mn></mrow><annotation encoding="application/x-tex">W=0.24</annotation></semantics></math><span id="S5.I3.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">), but this result is
inconclusive: with only </span><math id="S5.I3.i2.p1.m4" class="ltx_Math" alttext="b=3" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><annotation encoding="application/x-tex">b=3</annotation></semantics></math><span id="S5.I3.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> blocks, the test has </span><math id="S5.I3.i2.p1.m5" class="ltx_Math" alttext="\approx 16\%" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≈</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">16</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow></mrow><annotation encoding="application/x-tex">\approx 16\%</annotation></semantics></math><span id="S5.I3.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> power at
the observed effect size and cannot reliably distinguish absence of an effect
from a moderate effect.</span></span>
</span></span>
<span id="S5.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I3.i3.p1" class="ltx_para">
<span id="S5.I3.i3.p1.1" class="ltx_p"><span id="S5.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The Dataset </span><math id="S5.I3.i3.p1.m1" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math><span id="S5.I3.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> LLM interaction is not estimable with one
observation per cell; cell-level patterns—particularly the wider LLM spread
on </span><span id="S5.I3.i3.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">PROMISE_Refined</span><span id="S5.I3.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">—hint at task-dependent behaviour but require
replicated measurements to test.</span></span>
</span></span>
<span id="S5.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I3.i4.p1" class="ltx_para">
<span id="S5.I3.i4.p1.1" class="ltx_p"><span id="S5.I3.i4.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway:</span><span id="S5.I3.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Task difficulty is the dominant, well-supported driver
of BT-APE performance. Whether LLM selection matters under BT-APE remains an open
question that requires evaluation across a larger set of datasets before
practitioners can safely deprioritize model choice.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>