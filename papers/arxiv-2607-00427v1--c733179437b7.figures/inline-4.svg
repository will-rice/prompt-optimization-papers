<span id="S5.SS4.SSS0.Px5.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.5em;">
<span id="S5.SS4.SSS0.Px5.p3.pic1.1.1" class="ltx_p"><span id="S5.SS4.SSS0.Px5.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Key Findings for RQ3</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.96 411.16)"><foreignobject style="--ltx-fo-width:32.77em;--ltx-fo-height:1.69em;--ltx-fo-depth:28.85em;font-size:10pt;" height="422.65" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="453.44"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS4.SSS0.Px5.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.77em;">
<span id="S5.I4" class="ltx_itemize">
<span id="S5.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I4.i1.p1" class="ltx_para">
<span id="S5.I4.i1.p1.1" class="ltx_p"><span id="S5.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Under a linear mixed-effects model that controls for between-trajectory variance, higher verb count and increased punctuation markers were significantly associated with improved within-trajectory performance.</span></span>
</span></span>
<span id="S5.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I4.i2.p1" class="ltx_para">
<span id="S5.I4.i2.p1.1" class="ltx_p"><span id="S5.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prompts that were longer in sentence and word count, more lexically varied, or syntactically complex tended to perform worse on </span><math id="S5.I4.i2.p1.m1" class="ltx_Math" alttext="wF1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">wF1</annotation></semantics></math><span id="S5.I4.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S5.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I4.i3.p1" class="ltx_para">
<span id="S5.I4.i3.p1.1" class="ltx_p"><span id="S5.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ambiguity showed a consistent negative trend but did not reach statistical significance after correction.</span></span>
</span></span>
<span id="S5.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I4.i4.p1" class="ltx_para">
<span id="S5.I4.i4.p1.1" class="ltx_p"><span id="S5.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Semantic drift was a significant positive within-trajectory predictor, but is interpreted as a property of successful optimisation dynamics rather than as static-prompt design guidance.</span></span>
</span></span>
<span id="S5.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I4.i5.p1" class="ltx_para">
<span id="S5.I4.i5.p1.1" class="ltx_p"><span id="S5.I4.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The fixed-effect prompt features explained a marginal </span><math id="S5.I4.i5.p1.m1" class="ltx_Math" alttext="R^{2}_{m}=0.214" display="inline" intent=":literal"><semantics><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.214</mn></mrow><annotation encoding="application/x-tex">R^{2}_{m}=0.214</annotation></semantics></math><span id="S5.I4.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> of within-trajectory variance; an ICC of </span><math id="S5.I4.i5.p1.m2" class="ltx_Math" alttext="0.683" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.683</mn><annotation encoding="application/x-tex">0.683</annotation></semantics></math><span id="S5.I4.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> indicates that a substantial share of overall variation in </span><math id="S5.I4.i5.p1.m3" class="ltx_Math" alttext="wF1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">wF1</annotation></semantics></math><span id="S5.I4.i5.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> is driven by between-configuration differences absorbed by the random intercepts.</span></span>
</span></span>
<span id="S5.I4.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I4.i6.p1" class="ltx_para">
<span id="S5.I4.i6.p1.1" class="ltx_p"><span id="S5.I4.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">All state-feature signs were preserved under a terminal-prompt robustness check (</span><math id="S5.I4.i6.p1.m1" class="ltx_Math" alttext="n=15" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">15</mn></mrow><annotation encoding="application/x-tex">n=15</annotation></semantics></math><span id="S5.I4.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S5.I4.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I4.i7.p1" class="ltx_para">
<span id="S5.I4.i7.p1.1" class="ltx_p"><span id="S5.I4.i7.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway:</span><span id="S5.I4.i7.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Brief, action-oriented, and clearly structured prompts are robust correlates of strong outcomes; substantive semantic revision (rather than surface paraphrasing) characterises trajectories on which BT-APE makes progress.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>