<svg id="A6.SS3.p1.pic1" class="ltx_picture" height="1152.46" overflow="visible" version="1.1" viewbox="0 0 477.38 1152.46" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1152.46) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.32 L 0 1149.13 C 0 1150.97 1.49 1152.46 3.32 1152.46 L 474.06 1152.46 C 475.89 1152.46 477.38 1150.97 477.38 1149.13 L 477.38 3.32 C 477.38 1.49 475.89 0 474.06 0 L 3.32 0 C 1.49 0 0 1.49 0 3.32 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 3.32 L 0.55 1149.13 C 0.55 1150.66 1.79 1151.9 3.32 1151.9 L 474.06 1151.9 C 475.58 1151.9 476.82 1150.66 476.82 1149.13 L 476.82 3.32 C 476.82 1.79 475.58 0.55 474.06 0.55 L 3.32 0.55 C 1.79 0.55 0.55 1.79 0.55 3.32 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 13.48)"><foreignobject style="--ltx-fo-width:32.65em;--ltx-fo-height:81.59em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1132.42" overflow="visible" transform="matrix(1 0 0 -1 0 1128.96)" width="451.78"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.65em;">
<span id="A6.SS3.p1.pic1.1.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role:<span id="A6.SS3.p1.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> You are a highly capable, thoughtful, and precise prompt
engineer specializing in requirements classification.</span></span></span>
<span id="A6.SS3.p1.pic1.1.2" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Background:<span id="A6.SS3.p1.pic1.1.2.1.1" class="ltx_text ltx_font_medium"> A LLM has previously used a set of
{Definitions} to automatically classify requirements into the candidate
classes {classes}. Based on these definitions, it correctly classified some
requirements but misclassified other requirements.</span></span></span>
<span id="A6.SS3.p1.pic1.1.3" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.1.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:<span id="A6.SS3.p1.pic1.1.3.1.1" class="ltx_text ltx_font_medium"> Your task is to enhance the {Definitions} of the classes
{classes} to improve the classification accuracy of the large language
model. You are given example results in the form
[requirement text; true class; predicted class] to guide you in enhancing the
definitions.</span></span></span>
<span id="A6.I1" class="ltx_itemize ltx_align_left">
<span id="A6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I1.i1.p1" class="ltx_para">
<span id="A6.I1.i1.p1.1" class="ltx_p"><span id="A6.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A set of example requirements that were correctly classified based on
the definitions:</span>
<br class="ltx_break"><span id="A6.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">{correctly_classified}</span></span>
</span></span>
<span id="A6.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I1.i2.p1" class="ltx_para">
<span id="A6.I1.i2.p1.1" class="ltx_p"><span id="A6.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A set of example requirements that were incorrectly classified based
on the definitions:</span>
<br class="ltx_break"><span id="A6.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">{misclassified}</span></span>
</span></span>
</span>
<span id="A6.SS3.p1.pic1.1.4" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">You may add content, shorten, or rephrase the definitions to improve clarity
and accuracy.</span></span>
<span id="A6.SS3.p1.pic1.1.5" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.1.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Let’s think step by step:<span id="A6.SS3.p1.pic1.1.5.1.1" class="ltx_text"></span></span></span>
<span id="A6.I2" class="ltx_enumerate ltx_align_left">
<span id="A6.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(1)</span> 
<span id="A6.I2.i1.p1" class="ltx_para">
<span id="A6.I2.i1.p1.1" class="ltx_p"><span id="A6.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Study the Definitions:</span><span id="A6.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Understand the provided definitions of
the classes.</span></span>
</span></span>
<span id="A6.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(2)</span> 
<span id="A6.I2.i2.p1" class="ltx_para">
<span id="A6.I2.i2.p1.1" class="ltx_p"><span id="A6.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Analyse Examples:</span><span id="A6.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Analyze correctly classified and
misclassified examples.</span></span>
</span></span>
<span id="A6.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(3)</span> 
<span id="A6.I2.i3.p1" class="ltx_para">
<span id="A6.I2.i3.p1.1" class="ltx_p"><span id="A6.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Success analysis:</span><span id="A6.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> For each correctly classified example
identify why the original definitions were successful. Ask yourself:
Do certain words/phrases consistently lead to correct classification?
Which parts of the definitions are clear, complete, and unambiguous?</span></span>
</span></span>
<span id="A6.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(4)</span> 
<span id="A6.I2.i4.p1" class="ltx_para">
<span id="A6.I2.i4.p1.1" class="ltx_p"><span id="A6.I2.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Error analysis:</span><span id="A6.I2.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> For each misclassified example identify why
the original definitions failed. Ask yourself: Do certain words/phrases
consistently mislead? Are the definitions ambiguous, incomplete, or
overlapping?</span></span>
</span></span>
<span id="A6.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(5)</span> 
<span id="A6.I2.i5.p1" class="ltx_para">
<span id="A6.I2.i5.p1.1" class="ltx_p"><span id="A6.I2.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Enhance Definitions:</span><span id="A6.I2.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Enhance the definitions by adding,
reducing, or rephrasing content.</span></span>
</span></span>
<span id="A6.I2.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(6)</span> 
<span id="A6.I2.i6.p1" class="ltx_para">
<span id="A6.I2.i6.p1.1" class="ltx_p"><span id="A6.I2.i6.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Enhancement Procedure:</span><span id="A6.I2.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> For problematic classes:</span></span>
<span id="A6.I2.i6.I1" class="ltx_enumerate">
<span id="A6.I2.i6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(a)</span> 
<span id="A6.I2.i6.I1.i1.p1" class="ltx_para">
<span id="A6.I2.i6.I1.i1.p1.1" class="ltx_p"><em id="A6.I2.i6.I1.i1.p1.1.1" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Add discriminative features:</em><span id="A6.I2.i6.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Incorporate missing
characteristics from misclassified examples.</span></span>
</span></span>
<span id="A6.I2.i6.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(b)</span> 
<span id="A6.I2.i6.I1.i2.p1" class="ltx_para">
<span id="A6.I2.i6.I1.i2.p1.1" class="ltx_p"><em id="A6.I2.i6.I1.i2.p1.1.1" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Create exclusion clauses:</em><span id="A6.I2.i6.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Explicitly state what doesn’t
qualify (“This class excludes…”).</span></span>
</span></span>
<span id="A6.I2.i6.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(c)</span> 
<span id="A6.I2.i6.I1.i3.p1" class="ltx_para">
<span id="A6.I2.i6.I1.i3.p1.1" class="ltx_p"><em id="A6.I2.i6.I1.i3.p1.1.1" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Use comparative framing:</em><span id="A6.I2.i6.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Highlight differences between
easily confused classes.</span></span>
</span></span>
<span id="A6.I2.i6.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(d)</span> 
<span id="A6.I2.i6.I1.i4.p1" class="ltx_para">
<span id="A6.I2.i6.I1.i4.p1.1" class="ltx_p"><em id="A6.I2.i6.I1.i4.p1.1.1" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Simplify if needed:</em><span id="A6.I2.i6.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Simplify definitions when they
appear to be too complex.</span></span>
</span></span>
<span id="A6.I2.i6.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(e)</span> 
<span id="A6.I2.i6.I1.i5.p1" class="ltx_para">
<span id="A6.I2.i6.I1.i5.p1.1" class="ltx_p"><em id="A6.I2.i6.I1.i5.p1.1.1" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Rephrase if needed:</em><span id="A6.I2.i6.I1.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Rephrase definitions when the
phrasing or terminology is misleading.</span></span>
</span></span>
</span>
</span></span>
<span id="A6.I2.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(7)</span> 
<span id="A6.I2.i7.p1" class="ltx_para">
<span id="A6.I2.i7.p1.1" class="ltx_p"><span id="A6.I2.i7.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Validation Constraints:</span></span>
<span id="A6.I2.i7.I1" class="ltx_enumerate">
<span id="A6.I2.i7.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(a)</span> 
<span id="A6.I2.i7.I1.i1.p1" class="ltx_para">
<span id="A6.I2.i7.I1.i1.p1.1" class="ltx_p"><em id="A6.I2.i7.I1.i1.p1.1.1" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Ensure misclassification prevention:</em><span id="A6.I2.i7.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The revised
definitions must theoretically prevent the same errors from
recurring.</span></span>
</span></span>
<span id="A6.I2.i7.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(b)</span> 
<span id="A6.I2.i7.I1.i2.p1" class="ltx_para">
<span id="A6.I2.i7.I1.i2.p1.1" class="ltx_p"><em id="A6.I2.i7.I1.i2.p1.1.1" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Avoid overfitting:</em><span id="A6.I2.i7.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Definitions should maintain
generalizability through clear principles rather than
example-specific fixes.</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A6.SS3.p1.pic1.1.6" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output the enhanced {Definitions} only, with no additional text.</span></span>
</span></span></span></foreignobject></g></g></svg>