<span id="S5.SS2.SSS0.Px5.p2.pic1.1.1" class="ltx_p"><span id="S5.SS2.SSS0.Px5.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Key Findings for RQ1</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.96 288.63)"><foreignobject style="--ltx-fo-width:32.77em;--ltx-fo-height:1.69em;--ltx-fo-depth:19.99em;font-size:10pt;" height="300.11" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="453.44"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS2.SSS0.Px5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.77em;">
<span id="S5.I1" class="ltx_itemize">
<span id="S5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i1.p1" class="ltx_para">
<span id="S5.I1.i1.p1.1" class="ltx_p"><span id="S5.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">BT-APE significantly outperforms the four classical prompt-engineering
approaches (Zero-shot, Few-shot, CoT, and CoT + Few-shot) for
requirements classification.</span></span>
</span></span>
<span id="S5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i2.p1" class="ltx_para">
<span id="S5.I1.i2.p1.1" class="ltx_p"><span id="S5.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Across 15 comparisons spanning three datasets and five LLMs, BT-APE
achieves consistently higher </span><math id="S5.I1.i2.p1.m1" class="ltx_Math" alttext="wF1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">wF1</annotation></semantics></math><span id="S5.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> scores than the classical baselines.</span></span>
</span></span>
<span id="S5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i3.p1" class="ltx_para">
<span id="S5.I1.i3.p1.1" class="ltx_p"><span id="S5.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Improvements over the classical baselines show large effect sizes
and statistical significance at </span><math id="S5.I1.i3.p1.m1" class="ltx_Math" alttext="\alpha=0.05" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">α</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.05</mn></mrow><annotation encoding="application/x-tex">\alpha=0.05</annotation></semantics></math><span id="S5.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S5.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i4.p1" class="ltx_para">
<span id="S5.I1.i4.p1.1" class="ltx_p"><span id="S5.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">BT-APE performs on par with the optimization-based variant APE-PE2
(mean </span><math id="S5.I1.i4.p1.m1" class="ltx_Math" alttext="\Delta=+0.001" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.001</mn></mrow></mrow><annotation encoding="application/x-tex">\Delta=+0.001</annotation></semantics></math><span id="S5.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, negligible effect size, not statistically
significant), indicating that both automated prompt-engineering methods
reach a comparable performance ceiling.</span></span>
</span></span>
<span id="S5.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i5.p1" class="ltx_para">
<span id="S5.I1.i5.p1.1" class="ltx_p"><span id="S5.I1.i5.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway:</span><span id="S5.I1.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> BT-APE—together with APE-PE2—is a superior
alternative to conventional prompting methods for requirements
classification tasks.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>