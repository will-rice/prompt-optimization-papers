<span id="S5.SS5.SSS0.Px3.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.5em;">
<span id="S5.SS5.SSS0.Px3.p3.pic1.1.1" class="ltx_p"><span id="S5.SS5.SSS0.Px3.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Key Findings for RQ4</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.96 302.54)"><foreignobject style="--ltx-fo-width:32.77em;--ltx-fo-height:1.69em;--ltx-fo-depth:21em;font-size:10pt;" height="314.03" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="453.44"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS5.SSS0.Px3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.77em;">
<span id="S5.I5" class="ltx_itemize">
<span id="S5.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I5.i1.p1" class="ltx_para">
<span id="S5.I5.i1.p1.1" class="ltx_p"><span id="S5.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Providing fine-grained, domain-grounded class definitions (BT-APE-Informed) did not yield statistically significant improvement in final performance over minimal, uninformed descriptions (BT-APE-Uninformed).</span></span>
</span></span>
<span id="S5.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I5.i2.p1" class="ltx_para">
<span id="S5.I5.i2.p1.1" class="ltx_p"><span id="S5.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The mean final performance improvement of </span><math id="S5.I5.i2.p1.m1" class="ltx_Math" alttext="+0.015" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.015</mn></mrow><annotation encoding="application/x-tex">+0.015</annotation></semantics></math><span id="S5.I5.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> in </span><math id="S5.I5.i2.p1.m2" class="ltx_Math" alttext="wF1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">wF1</annotation></semantics></math><span id="S5.I5.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is negligible to small and not reliable across experimental conditions.</span></span>
</span></span>
<span id="S5.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I5.i3.p1" class="ltx_para">
<span id="S5.I5.i3.p1.1" class="ltx_p"><span id="S5.I5.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The relative improvement over baseline also showed no statistically significant difference between the two strategies (</span><math id="S5.I5.i3.p1.m1" class="ltx_Math" alttext="\delta_{\text{gain}}=+0.033" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">δ</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">gain</mtext></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.033</mn></mrow></mrow><annotation encoding="application/x-tex">\delta_{\text{gain}}=+0.033</annotation></semantics></math><span id="S5.I5.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><math id="S5.I5.i3.p1.m2" class="ltx_Math" alttext="p\approx 0.86" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≈</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.86</mn></mrow><annotation encoding="application/x-tex">p\approx 0.86</annotation></semantics></math><span id="S5.I5.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S5.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I5.i4.p1" class="ltx_para">
<span id="S5.I5.i4.p1.1" class="ltx_p"><span id="S5.I5.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">BT-APE’s iterative optimization process is sufficiently robust to discover effective class definitions autonomously, achieving comparable final performance regardless of initialization strategy.</span></span>
</span></span>
<span id="S5.I5.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I5.i5.p1" class="ltx_para">
<span id="S5.I5.i5.p1.1" class="ltx_p"><span id="S5.I5.i5.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway:</span><span id="S5.I5.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Domain knowledge in the initial seed is not necessary—BT-APE’s autonomous optimization compensates effectively, achieving comparable results whether initialized from informed or minimal class definitions.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>