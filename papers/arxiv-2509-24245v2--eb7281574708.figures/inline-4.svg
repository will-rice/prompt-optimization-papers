<span id="A4.SS2.pic3.2.1" class="ltx_p"><span id="A4.SS2.pic3.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given a query and an initial prompt, please add more detailed guidance to the initial prompt to help the model better respond to the question. The generated prompt will be concatenated in front of the query to assist the model in answering questions. During the rewriting process, ensure that the new prompt includes the information from the original prompt, such as the task description and the answer format requirements. The generated new prompt should not exceed 100 words.
<br class="ltx_break"></span></span>
<span id="A4.SS2.pic3.2.2" class="ltx_p"><span id="A4.SS2.pic3.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Query:</span></span>
<span id="A4.SS2.pic3.2.3" class="ltx_p"><span id="A4.SS2.pic3.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">{query} 
<br class="ltx_break"></span></span>
<span id="A4.SS2.pic3.2.4" class="ltx_p"><span id="A4.SS2.pic3.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Initial Prompt:</span></span>
<span id="A4.SS2.pic3.2.5" class="ltx_p"><span id="A4.SS2.pic3.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use the relevant information provided to answer the multi-hop reasoning question. Please provide the most accurate and concise answer to the question based on the information provided. The answer should be directly from the dataset, with no extra details or explanations. For yes-no questions, respond with either ’yes’ or ’no.’ Avoid long or complex sentences.
<br class="ltx_break"></span></span>
<span id="A4.SS2.pic3.2.6" class="ltx_p"><span id="A4.SS2.pic3.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">New Prompt:</span></span>
</span></span></span></foreignobject></g></g></svg>