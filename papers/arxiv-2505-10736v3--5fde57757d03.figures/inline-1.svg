<svg id="A1.SS8.p3.pic1" class="ltx_picture" height="1437.06" overflow="visible" version="1.1" viewbox="0 0 653.15 1437.06" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1437.06) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.33 L 0 1432.72 C 0 1435.12 1.94 1437.06 4.33 1437.06 L 648.82 1437.06 C 651.21 1437.06 653.15 1435.12 653.15 1432.72 L 653.15 4.33 C 653.15 1.94 651.21 0 648.82 0 L 4.33 0 C 1.94 0 0 1.94 0 4.33 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.39 4.33 L 0.39 1416.09 L 652.76 1416.09 L 652.76 4.33 C 652.76 2.16 650.99 0.39 648.82 0.39 L 4.33 0.39 C 2.16 0.39 0.39 2.16 0.39 4.33 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.08 1423.12)"><foreignobject style="--ltx-fo-width:44.3em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="612.99"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS8.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.3em;">
<span id="A1.SS8.p3.pic1.1.1" class="ltx_p ltx_align_center"><span id="A1.SS8.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Selected Examples by stage 1 of IPOMP</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.08 1387.76)"><foreignobject style="--ltx-fo-width:44.3em;--ltx-fo-height:1.19em;--ltx-fo-depth:99.41em;font-size:10pt;" height="1392.1" overflow="visible" transform="matrix(1 0 0 -1 0 16.53)" width="612.99"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS8.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.3em;">
<span id="A1.I2" class="ltx_itemize ltx_centering">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 1: Speaker 1: </span><span id="A1.I2.i1.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’This is a costume?’</span><span id="A1.I2.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i1.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Aaaiyyyy… worked on it all night long!’</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 2: Speaker 1: </span><span id="A1.I2.i2.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Do you love me?’</span><span id="A1.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i2.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’My love for you is as deep as the ocean.’</span></span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i3.p1" class="ltx_para">
<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 3: Speaker 1: </span><span id="A1.I2.i3.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Did you sleep well last night?’</span><span id="A1.I2.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i3.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Last night, I slept like a log.’</span></span>
</span></span>
<span id="A1.I2.i4" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i4.p1" class="ltx_para">
<span id="A1.I2.i4.p1.1" class="ltx_p"><span id="A1.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 4: Speaker 1: </span><span id="A1.I2.i4.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Do you think that Dr. Luby will organize a theatre trip to New York this year?’</span><span id="A1.I2.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i4.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’I have already signed up for it.’</span></span>
</span></span>
<span id="A1.I2.i5" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i5.p1" class="ltx_para">
<span id="A1.I2.i5.p1.1" class="ltx_p"><span id="A1.I2.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 5: Speaker 1: </span><span id="A1.I2.i5.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Did you report Private Barnes to your superiors?’</span><span id="A1.I2.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i5.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’I remember thinking very highly of Private Barnes, and not wanting to see his record tarnished by a formal charge.’</span></span>
</span></span>
<span id="A1.I2.i6" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i6.p1" class="ltx_para">
<span id="A1.I2.i6.p1.1" class="ltx_p"><span id="A1.I2.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 6: Speaker 1: </span><span id="A1.I2.i6.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’I bought the wrong math book. Here is the receipt. Can I get my money back?’</span><span id="A1.I2.i6.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i6.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Not after ten days. But you can exchange something for it.’</span></span>
</span></span>
<span id="A1.I2.i7" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i7.p1" class="ltx_para">
<span id="A1.I2.i7.p1.1" class="ltx_p"><span id="A1.I2.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 7: Speaker 1: </span><span id="A1.I2.i7.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Does it bother you that your husband goes away on long business trips?’</span><span id="A1.I2.i7.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i7.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Absence makes the heart grow fonder.’</span></span>
</span></span>
<span id="A1.I2.i8" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i8.p1" class="ltx_para">
<span id="A1.I2.i8.p1.1" class="ltx_p"><span id="A1.I2.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 8: Speaker 1: </span><span id="A1.I2.i8.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Did you order the code red?’</span><span id="A1.I2.i8.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i8.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’You’re goddamn right.’</span></span>
</span></span>
<span id="A1.I2.i9" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i9.p1" class="ltx_para">
<span id="A1.I2.i9.p1.1" class="ltx_p"><span id="A1.I2.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 9: Speaker 1: </span><span id="A1.I2.i9.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’My client is taking me to a really fancy restaurant tonight. So I am wearing this new cologne. I got a sample of it from a magazine. Can you smell it?’</span><span id="A1.I2.i9.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i9.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’From across the room. But it is not exactly subtle. Is it?’</span></span>
</span></span>
<span id="A1.I2.i10" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i10.p1" class="ltx_para">
<span id="A1.I2.i10.p1.1" class="ltx_p"><span id="A1.I2.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 10: Speaker 1: </span><span id="A1.I2.i10.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Are you a Dodgers fan?’</span><span id="A1.I2.i10.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i10.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’I don’t like baseball.’</span></span>
</span></span>
<span id="A1.I2.i11" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i11.p1" class="ltx_para">
<span id="A1.I2.i11.p1.1" class="ltx_p"><span id="A1.I2.i11.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 11: Speaker 1: </span><span id="A1.I2.i11.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Is everyone comfortable?’</span><span id="A1.I2.i11.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i11.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Everyone is on pins and needles.’</span></span>
</span></span>
<span id="A1.I2.i12" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i12.p1" class="ltx_para">
<span id="A1.I2.i12.p1.1" class="ltx_p"><span id="A1.I2.i12.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 12: Speaker 1: </span><span id="A1.I2.i12.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’I feel horrible. Debbie was furious that I lost her notes. Do you think I should apologize to her again?’</span><span id="A1.I2.i12.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i12.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’If I were you, I would cool off for some days before I talk to her again.’</span></span>
</span></span>
<span id="A1.I2.i13" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i13.p1" class="ltx_para">
<span id="A1.I2.i13.p1.1" class="ltx_p"><span id="A1.I2.i13.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 13: Speaker 1: </span><span id="A1.I2.i13.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Should I decide now?’</span><span id="A1.I2.i13.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i13.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Why don’t you go home and sleep on it?’</span></span>
</span></span>
<span id="A1.I2.i14" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i14.p1" class="ltx_para">
<span id="A1.I2.i14.p1.1" class="ltx_p"><span id="A1.I2.i14.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 14: Speaker 1: </span><span id="A1.I2.i14.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Did I do it well?’</span><span id="A1.I2.i14.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i14.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’You were as brave as a lion.’</span></span>
</span></span>
<span id="A1.I2.i15" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i15.p1" class="ltx_para">
<span id="A1.I2.i15.p1.1" class="ltx_p"><span id="A1.I2.i15.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 15: Speaker 1: </span><span id="A1.I2.i15.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Are you coming with me to the exhibition today?’</span><span id="A1.I2.i15.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i15.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’I made plans with Susan to go to the exhibition tomorrow afternoon.’</span></span>
</span></span>
<span id="A1.I2.i16" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i16.p1" class="ltx_para">
<span id="A1.I2.i16.p1.1" class="ltx_p"><span id="A1.I2.i16.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 16: Speaker 1: </span><span id="A1.I2.i16.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Does it rain here nowadays?’</span><span id="A1.I2.i16.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i16.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’It’s been raining for 40 days and 40 nights.’</span></span>
</span></span>
<span id="A1.I2.i17" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i17.p1" class="ltx_para">
<span id="A1.I2.i17.p1.1" class="ltx_p"><span id="A1.I2.i17.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 17: Speaker 1: </span><span id="A1.I2.i17.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Are you planning to buy a house?’</span><span id="A1.I2.i17.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i17.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’I really want a place to call my own.’</span></span>
</span></span>
<span id="A1.I2.i18" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i18.p1" class="ltx_para">
<span id="A1.I2.i18.p1.1" class="ltx_p"><span id="A1.I2.i18.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 18: Speaker 1: </span><span id="A1.I2.i18.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Is it a good product?’</span><span id="A1.I2.i18.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i18.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’They had put a lot of thought into making it.’</span></span>
</span></span>
<span id="A1.I2.i19" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i19.p1" class="ltx_para">
<span id="A1.I2.i19.p1.1" class="ltx_p"><span id="A1.I2.i19.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 19: Speaker 1: </span><span id="A1.I2.i19.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Is that book about lullabies?’</span><span id="A1.I2.i19.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i19.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’It is about symphonies.’</span></span>
</span></span>
<span id="A1.I2.i20" class="ltx_item" style="list-style-type:none;padding-top:0.5pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i20.p1" class="ltx_para">
<span id="A1.I2.i20.p1.1" class="ltx_p"><span id="A1.I2.i20.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example 20: Speaker 1: </span><span id="A1.I2.i20.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’But aren’t you afraid?’</span><span id="A1.I2.i20.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Speaker 2: </span><span id="A1.I2.i20.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Ma’am, sharks never attack anybody.’</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>