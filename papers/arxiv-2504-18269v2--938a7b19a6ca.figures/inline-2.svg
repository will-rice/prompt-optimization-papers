<span id="A4.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:55.1em;">
<span id="A4.SS1.p2.pic1.2.1" class="ltx_p"><span id="A4.SS1.p2.pic1.2.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">You must generate **ONLY ONE THING**: 
<br class="ltx_break">a single English prompt for an image-generation model. 
<br class="ltx_break">Do NOT output explanations, comments, apologies, thoughts, or any other text. 
<br class="ltx_break"></span></span>
<span id="A4.SS1.p2.pic1.2.2" class="ltx_p"><span id="A4.SS1.p2.pic1.2.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">### HARD OUTPUT FORMAT CONSTRAINT 
<br class="ltx_break">You MUST output **ONLY** the following block EXACTLY in this format: 
<br class="ltx_break"></span></span>
<span id="A4.SS1.p2.pic1.2.3" class="ltx_p"><span id="A4.SS1.p2.pic1.2.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">&lt;SummaryStart&gt; 
<br class="ltx_break">English prompt for the image generator, nothing else 
<br class="ltx_break">&lt;SummaryEnd&gt; 
<br class="ltx_break"></span></span>
<span id="A4.SS1.p2.pic1.2.4" class="ltx_p"><span id="A4.SS1.p2.pic1.2.4.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">- No additional text before or after the tags. 
<br class="ltx_break">- No reasoning steps. 
<br class="ltx_break">- No markdown. 
<br class="ltx_break">- No prefaces or suffixes. 
<br class="ltx_break">- No self-talk. 
<br class="ltx_break">- No comments. 
<br class="ltx_break">- No variable placeholders. 
<br class="ltx_break"></span></span>
<span id="A4.SS1.p2.pic1.2.5" class="ltx_p"><span id="A4.SS1.p2.pic1.2.5.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">### TASK (STRICT) 
<br class="ltx_break">Create the **optimal** English prompt for generating an iconic image of **<span id="A4.SS1.p2.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">{title}</span>**. 
<br class="ltx_break"></span></span>
<span id="A4.SS1.p2.pic1.2.6" class="ltx_p"><span id="A4.SS1.p2.pic1.2.6.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Use only information logically inferable from the summary below. 
<br class="ltx_break">Assume the image-generation model does NOT know what “<span id="A4.SS1.p2.pic1.2.6.1.1" class="ltx_text ltx_font_typewriter">{title}</span>” is. 
<br class="ltx_break"></span></span>
<span id="A4.SS1.p2.pic1.2.7" class="ltx_p"><span id="A4.SS1.p2.pic1.2.7.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">### REQUIREMENTS 
<br class="ltx_break">- Include **all concrete visual details** required for correct generation: 
<br class="ltx_break">- environment (sea, mountains, city, interior, etc.) 
<br class="ltx_break">- physical structure, shapes 
<br class="ltx_break">- materials, colors 
<br class="ltx_break">- atmosphere, lighting 
<br class="ltx_break">- perspective or composition 
<br class="ltx_break">- style (only if described or inferable) 
<br class="ltx_break">- measurements (height/width) if included in the summary 
<br class="ltx_break">- Do NOT include: 
<br class="ltx_break">- citations 
<br class="ltx_break">- mentions of “summary” or the instructions 
<br class="ltx_break">- analysis or meta text 
<br class="ltx_break">- any text outside &lt;SummaryStart&gt; <span id="A4.SS1.p2.pic1.2.7.1.1" class="ltx_ERROR undefined">\CJK@punctchar</span><span id="A4.SS1.p2.pic1.2.7.1.2" class="ltx_ERROR undefined">\CJK@uniPunct</span>0&quot;80&quot;A6 &lt;SummaryEnd&gt; 
<br class="ltx_break">- Generate 
<br class="ltx_break">- ONLY prompt 
<br class="ltx_break">- ONLY in English 
<br class="ltx_break"></span></span>
<span id="A4.SS1.p2.pic1.2.8" class="ltx_p"><span id="A4.SS1.p2.pic1.2.8.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">— SUMMARY BELOW — 
<br class="ltx_break"><span id="A4.SS1.p2.pic1.2.8.1.1" class="ltx_text ltx_font_typewriter">{abstract}</span> 
<br class="ltx_break">— END SUMMARY — 
<br class="ltx_break"></span></span>
<span id="A4.SS1.p2.pic1.2.9" class="ltx_p"><span id="A4.SS1.p2.pic1.2.9.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Now output ONLY the required block: 
<br class="ltx_break"></span></span>
