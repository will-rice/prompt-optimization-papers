<br class="ltx_break">Create the **optimal** English prompt for generating an iconic image of **<span id="A4.SS1.p1.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">{title}</span>**. 
<br class="ltx_break"></span></span>
