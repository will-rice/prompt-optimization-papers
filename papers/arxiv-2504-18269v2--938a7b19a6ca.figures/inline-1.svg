<span id="A4.SS1.p1.pic1.2.3" class="ltx_p"><span id="A4.SS1.p1.pic1.2.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">&lt;SummaryStart&gt; 
