<br class="ltx_break">- analysis or meta text 
<br class="ltx_break">- any text outside &lt;SummaryStart&gt; <span id="A4.SS1.p1.pic1.2.7.1.9" class="ltx_ERROR undefined">\CJK@punctchar</span><span id="A4.SS1.p1.pic1.2.7.1.10" class="ltx_ERROR undefined">\CJK@uniPunct</span>0&quot;80&quot;A6 &lt;SummaryEnd&gt; 
