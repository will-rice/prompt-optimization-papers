<span id="A5.SS4.p3.pic1.2.16" class="ltx_p"><span id="A5.SS4.p3.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">Breakfast: Nagaland’s Kitchen, Charlotte</span></span>
