<span id="A5.SS4.p3.pic1.2.34" class="ltx_p"><span id="A5.SS4.p3.pic1.2.34.1" class="ltx_text" style="--ltx-fg-color:#000000;">Lunch: Olive Tree Cafe, Charlotte</span></span>
