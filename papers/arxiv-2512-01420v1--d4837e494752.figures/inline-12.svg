<span id="A5.SS4.p3.pic1.2.32" class="ltx_p"><span id="A5.SS4.p3.pic1.2.32.1" class="ltx_text" style="--ltx-fg-color:#000000;">Breakfast: Subway, Charlotte</span></span>
