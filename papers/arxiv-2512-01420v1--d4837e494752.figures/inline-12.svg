<svg id="A5.SS4.p3.pic1" class="ltx_picture" height="884.18" overflow="visible" version="1.1" viewbox="0 0 676.77 884.18" width="676.77"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,884.18) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3232B4;" fill="#3232B4" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.77 L 0 861.54 C 0 863.07 1.24 864.31 2.77 864.31 L 674 864.31 C 675.53 864.31 676.77 863.07 676.77 861.54 L 676.77 2.77 C 676.77 1.24 675.53 0 674 0 L 2.77 0 C 1.24 0 0 1.24 0 2.77 Z" /></g><g style="--ltx-fill-color:#E6E6FF;" fill="#E6E6FF" fill-opacity="1.0"><path style="stroke:none" d="M 2.77 2.77 L 2.77 861.54 L 674 861.54 L 674 2.77 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 0 856.43)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#3232B4;" fill="#3232B4" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.53 L 0 23.22 C 0 25.72 2.03 27.75 4.53 27.75 L 423.71 27.75 C 426.21 27.75 428.24 25.72 428.24 23.22 L 428.24 4.53 C 428.24 2.03 426.21 0 423.71 0 L 4.53 0 C 2.03 0 0 2.03 0 4.53 Z" /></g><g style="--ltx-fill-color:#3232B4;" fill="#3232B4" fill-opacity="1.0"><path style="stroke:none" d="M 1.57 4.53 L 1.57 23.22 C 1.57 24.85 2.9 26.18 4.53 26.18 L 423.71 26.18 C 425.34 26.18 426.66 24.85 426.66 23.22 L 426.66 4.53 C 426.66 2.9 425.34 1.57 423.71 1.57 L 4.53 1.57 C 2.9 1.57 1.57 2.9 1.57 4.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.72)"><foreignobject style="--ltx-fo-width:21.49em;--ltx-fo-height:0.62em;--ltx-fo-depth:0.17em;font-size:13.5pt;" height="14.76" overflow="visible" transform="matrix(1 0 0 -1 0 11.53)" width="401.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A5.SS4.p3.pic1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#FFFFFF;">PromptBridge Optimized Planner Prompt for o3</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.54 20.54)"><foreignobject style="--ltx-fo-width:45.94em;--ltx-fo-height:59.5em;--ltx-fo-depth:0em;font-size:10pt;" height="823.23" overflow="visible" transform="matrix(1 0 0 -1 0 823.23)" width="635.68"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.94em;">
<span id="A5.SS4.p3.pic1.2.1" class="ltx_p"><span id="A5.SS4.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a proficient travel-planning agent. Using only the provided data and the query, produce a detailed, commonsense itinerary that strictly follows the template and example below. Output must be the Travel Plan only—no explanations or extra text. Do not invent any details. If a required item is missing or unnecessary, use &quot;-&quot;.</span></span>
<span id="A5.SS4.p3.pic1.2.2" class="ltx_p"><span id="A5.SS4.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Rules for formatting and selection:</span></span>
<span id="A5.SS4.p3.pic1.2.3" class="ltx_p"><span id="A5.SS4.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Use the exact field names and line order shown in the example.</span></span>
<span id="A5.SS4.p3.pic1.2.4" class="ltx_p"><span id="A5.SS4.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Include specifics (e.g., flight numbers, restaurant and accommodation names) only if present in the provided data.</span></span>
<span id="A5.SS4.p3.pic1.2.5" class="ltx_p"><span id="A5.SS4.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Keep times and activities in chronological order and ensure city consistency.</span></span>
<span id="A5.SS4.p3.pic1.2.6" class="ltx_p"><span id="A5.SS4.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- If traveling between two cities on the same day, set Current City to &quot;from A to B&quot;.</span></span>
<span id="A5.SS4.p3.pic1.2.7" class="ltx_p"><span id="A5.SS4.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- If multiple valid options exist, pick deterministically: earliest departure/arrival time; if tied, lowest price; if tied, lexicographically smallest name.</span></span>
<span id="A5.SS4.p3.pic1.2.8" class="ltx_p"><span id="A5.SS4.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Respect dates, group size, budget, and any constraints explicitly present in the data. Do not assume or fabricate prices, times, or availability.</span></span>
<span id="A5.SS4.p3.pic1.2.9" class="ltx_p"><span id="A5.SS4.p3.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- No external sources, randomness, or commentary. If constraints cannot be satisfied with the given data, use &quot;-&quot; for the affected fields.</span></span>
<span id="A5.SS4.p3.pic1.2.10" class="ltx_p"><span id="A5.SS4.p3.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">***** Example *****</span></span>
<span id="A5.SS4.p3.pic1.2.11" class="ltx_p"><span id="A5.SS4.p3.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Query: Could you create a travel plan for 7 people from Ithaca to Charlotte spanning 3 days, from March 8th to March 14th, 2022, with a budget of $30,200?</span></span>
<span id="A5.SS4.p3.pic1.2.12" class="ltx_p"><span id="A5.SS4.p3.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Travel Plan:</span></span>
