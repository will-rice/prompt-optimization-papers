<span id="A5.SS1.p3.pic1.2.5" class="ltx_p"><span id="A5.SS1.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Incorporate the transfer effects summary faithfully.</span></span>
<span id="A5.SS1.p3.pic1.2.6" class="ltx_p"><span id="A5.SS1.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Be adapted for the {target_model} model.</span></span>
<span id="A5.SS1.p3.pic1.2.7" class="ltx_p"><span id="A5.SS1.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Remain concise and preserve the original meaning.</span></span>
<span id="A5.SS1.p3.pic1.2.8" class="ltx_p"><span id="A5.SS1.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Improve suitability for eliciting high-quality responses on complex agent benchmarks such as SWE-Bench.</span></span>
<span id="A5.SS1.p3.pic1.2.9" class="ltx_p"><span id="A5.SS1.p3.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">## ====== Original Prompt ======</span></span>
