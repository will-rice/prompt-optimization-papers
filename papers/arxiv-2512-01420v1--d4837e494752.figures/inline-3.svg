<span id="A5.SS1.p3.pic1.2.2" class="ltx_p"><span id="A5.SS1.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">These transfer effects were derived from a standard coding dataset and must now be adapted for SWE-Bench.</span></span>
<span id="A5.SS1.p3.pic1.2.3" class="ltx_p"><span id="A5.SS1.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The new prompt should:</span></span>
