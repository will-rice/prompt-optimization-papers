2.45)" width="234.51"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A5.SS2.p1.pic1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#FFFFFF;">PromptBridge (GPT-4o <math id="A5.SS2.p1.pic1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math> o3)</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 19.85 22.54)"><foreignobject style="--ltx-fo-width:46.04em;--ltx-fo-height:53.8em;--ltx-fo-depth:0.19em;font-size:10pt;" height="747.05" overflow="visible" transform="matrix(1 0 0 -1 0 744.36)" width="637.06"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.04em;">
<span id="A5.SS2.p1.pic1.2.1" class="ltx_p"><span id="A5.SS2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are the o3 model. Read the programming problem below and produce a correct, efficient, and idiomatic Python solution.</span></span>
<span id="A5.SS2.p1.pic1.2.2" class="ltx_p"><span id="A5.SS2.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Problem:
{Input Coding Problem}</span></span>
<span id="A5.SS2.p1.pic1.2.3" class="ltx_p"><span id="A5.SS2.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Requirements:</span></span>
<span id="A5.SS2.p1.pic1.2.4" class="ltx_p"><span id="A5.SS2.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Implement exactly the API required by the problem:</span></span>
<span id="A5.SS2.p1.pic1.2.5" class="ltx_p"><span id="A5.SS2.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Use the exact function name(s) and signature(s) specified or implied by the problem/stub.</span></span>
<span id="A5.SS2.p1.pic1.2.6" class="ltx_p"><span id="A5.SS2.p1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do not rename functions, change parameter order/names, or alter return types.</span></span>
<span id="A5.SS2.p1.pic1.2.7" class="ltx_p"><span id="A5.SS2.p1.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Output format:</span></span>
<span id="A5.SS2.p1.pic1.2.8" class="ltx_p"><span id="A5.SS2.p1.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Return only the final Python source code with no explanations, prose, or markdown fences.</span></span>
<span id="A5.SS2.p1.pic1.2.9" class="ltx_p"><span id="A5.SS2.p1.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do not include any I/O (no print, input, file reads/writes), no main guard, and no demo/tests.</span></span>
<span id="A5.SS2.p1.pic1.2.10" class="ltx_p"><span id="A5.SS2.p1.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Code standards:</span></span>
<span id="A5.SS2.p1.pic1.2.11" class="ltx_p"><span id="A5.SS2.p1.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Python 3.8+ compatible. Use only the standard library.</span></span>
<span id="A5.SS2.p1.pic1.2.12" class="ltx_p"><span id="A5.SS2.p1.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Include precise type hints and a concise docstring for each public function:</span></span>
<span id="A5.SS2.p1.pic1.2.13" class="ltx_p"><span id="A5.SS2.p1.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Describe parameters, return value, key edge cases, and expected complexity.</span></span>
<span id="A5.SS2.p1.pic1.2.14" class="ltx_p"><span id="A5.SS2.p1.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Prefer iterative solutions unless recursion is clearly appropriate and safe for input sizes.</span></span>
<span id="A5.SS2.p1.pic1.2.15" class="ltx_p"><span id="A5.SS2.p1.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Avoid global state; write pure functions unless mutation is explicitly required.</span></span>
<span id="A5.SS2.p1.pic1.2.16" class="ltx_p"><span id="A5.SS2.p1.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do not modify inputs in place unless the problem explicitly asks for it; otherwise treat inputs as immutable.</span></span>
<span id="A5.SS2.p1.pic1.2.17" class="ltx_p"><span id="A5.SS2.p1.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Correctness and edge cases:</span></span>
<span id="A5.SS2.p1.pic1.2.18" class="ltx_p"><span id="A5.SS2.p1.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Handle typical edge cases that logically apply to the problem: empty inputs, single-element cases, duplicates, ties, negative values, zeros, large values, and unicode/whitespace handling for strings2̆014as relevant to the task.</span></span>
<span id="A5.SS2.p1.pic1.2.19" class="ltx_p"><span id="A5.SS2.p1.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Maintain determinism: avoid randomness and nondeterministic data structure iteration affecting outputs.</span></span>
<span id="A5.SS2.p1.pic1.2.20" class="ltx_p"><span id="A5.SS2.p1.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Be careful with integer overflow (use Python2̆019s big integers) and floating-point precision (prefer exact arithmetic or stable comparisons when required).</span></span>
<span id="A5.SS2.p1.pic1.2.21" class="ltx_p"><span id="A5.SS2.p1.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">- If multiple valid outputs exist, follow the canonical/most widely accepted choice (e.g., lexicographically smallest) if the problem implies it; otherwise document the chosen tie-break in the docstring and implement consistently.</span></span>
<span id="A5.SS2.p1.pic1.2.22" class="ltx_p"><span id="A5.SS2.p1.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Efficiency:</span></span>
<span id="A5.SS2.p1.pic1.2.23" class="ltx_p"><span id="A5.SS2.p1.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Choose data structures and algorithms to meet typical constraints for coding benchmarks (aim for optimal or near-optimal time/space).</span></span>
<span id="A5.SS2.p1.pic1.2.24" class="ltx_p"><span id="A5.SS2.p1.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Avoid unnecessary quadratic behavior on large inputs; justify any inherently superlinear steps by problem requirements.</span></span>
<span id="A5.SS2.p1.pic1.2.25" class="ltx_p"><span id="A5.SS2.p1.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Ambiguity handling:</span></span>
<span id="A5.SS2.p1.pic1.2.26" class="ltx_p"><span id="A5.SS2.p1.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">- If the problem is underspecified, adopt the most standard interpretation and note any minimal assumptions in the function2̆019s docstring (no extra commentary outside the code).</span></span>
<span id="A5.SS2.p1.pic1.2.27" class="ltx_p"><span id="A5.SS2.p1.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Validation:</span></span>
<span id="A5.SS2.p1.pic1.2.28" class="ltx_p"><span id="A5.SS2.p1.pic1.2.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Ensure the implementation would pass the examples implied by the problem statement.</span></span>
<span id="A5.SS2.p1.pic1.2.29" class="ltx_p"><span id="A5.SS2.p1.pic1.2.29.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do not raise exceptions unless explicitly required by the specification; prefer returning the specified sentinel/structure.</span></span>
<span id="A5.SS2.p1.pic1.2.30" class="ltx_p"><span id="A5.SS2.p1.pic1.2.30.1" class="ltx_text" style="--ltx-fg-color:#000000;">Deliverable:</span></span>
<span id="A5.SS2.p1.pic1.2.31" class="ltx_p"><span id="A5.SS2.p1.pic1.2.31.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Only the complete Python solution code, conforming to the above, with the required function(s) implemented. No extra text.</span></span>
</span></span></span></foreignobject></g></g></svg>