<svg id="A5.SS3.p1.pic1" class="ltx_picture" height="1286.69" overflow="visible" version="1.1" viewbox="0 0 676.77 1286.69" width="676.77"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1286.69) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#6CA6CD;" fill="#6CA6CD" fill-opacity="1.0"><path style="stroke:none" d="M 0 6.01 L 0 1258.95 C 0 1262.27 2.69 1264.97 6.01 1264.97 L 670.76 1264.97 C 674.08 1264.97 676.77 1262.27 676.77 1258.95 L 676.77 6.01 C 676.77 2.69 674.08 0 670.76 0 L 6.01 0 C 2.69 0 0 2.69 0 6.01 Z" /></g><g style="--ltx-fill-color:#E6F2FA;" fill="#E6F2FA" fill-opacity="1.0"><path style="stroke:none" d="M 2.08 6.01 L 2.08 1258.95 C 2.08 1261.13 3.84 1262.89 6.01 1262.89 L 670.76 1262.89 C 672.93 1262.89 674.7 1261.13 674.7 1258.95 L 674.7 6.01 C 674.7 3.84 672.93 2.08 670.76 2.08 L 6.01 2.08 C 3.84 2.08 2.08 3.84 2.08 6.01 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 0 1257.09)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#6CA6CD;" fill="#6CA6CD" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.53 L 0 25.07 C 0 27.57 2.03 29.6 4.53 29.6 L 396.63 29.6 C 399.13 29.6 401.16 27.57 401.16 25.07 L 401.16 4.53 C 401.16 2.03 399.13 0 396.63 0 L 4.53 0 C 2.03 0 0 2.03 0 4.53 Z" /></g><g style="--ltx-fill-color:#6CA6CD;" fill="#6CA6CD" fill-opacity="1.0"><path style="stroke:none" d="M 1.57 4.53 L 1.57 25.07 C 1.57 26.7 2.9 28.02 4.53 28.02 L 396.63 28.02 C 398.26 28.02 399.58 26.7 399.58 25.07 L 399.58 4.53 C 399.58 2.9 398.26 1.57 396.63 1.57 L 4.53 1.57 C 2.9 1.57 1.57 2.9 1.57 4.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 10.65)"><foreignobject style="--ltx-fo-width:19.64em;--ltx-fo-height:0.67em;--ltx-fo-depth:0.22em;font-size:13.5pt;" height="16.6" overflow="visible" transform="matrix(1 0 0 -1 0 12.45)" width="366.78"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A5.SS3.p1.pic1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#FFFFFF;">PromptBridge (o4-mini <math id="A5.SS3.p1.pic1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math> o3) on SWE-Bench.</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 19.85 23.31)"><foreignobject style="--ltx-fo-width:46.04em;--ltx-fo-height:88.3em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1225.28" overflow="visible" transform="matrix(1 0 0 -1 0 1221.82)" width="637.06"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.04em;">
<span id="A5.SS3.p1.pic1.2.1" class="ltx_p"><span id="A5.SS3.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;pr_description&gt;</span></span>
<span id="A5.SS3.p1.pic1.2.2" class="ltx_p"><span id="A5.SS3.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider the following PR description:</span></span>
<span id="A5.SS3.p1.pic1.2.3" class="ltx_p"><span id="A5.SS3.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">{{task}}</span></span>
<span id="A5.SS3.p1.pic1.2.4" class="ltx_p"><span id="A5.SS3.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/pr_description&gt;</span></span>
<span id="A5.SS3.p1.pic1.2.5" class="ltx_p"><span id="A5.SS3.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;instructions&gt;</span></span>
<span id="A5.SS3.p1.pic1.2.6" class="ltx_p"><span id="A5.SS3.p1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Task Instructions (o3-optimized)</span></span>
<span id="A5.SS3.p1.pic1.2.7" class="ltx_p"><span id="A5.SS3.p1.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Role and Goal</span></span>
<span id="A5.SS3.p1.pic1.2.8" class="ltx_p"><span id="A5.SS3.p1.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a senior software engineer interacting with a Linux shell, issuing one command at a time. Your goal is to implement changes in non-test files to satisfy the PR description, in a way that is general, performant, and consistent with the codebase.</span></span>
<span id="A5.SS3.p1.pic1.2.9" class="ltx_p"><span id="A5.SS3.p1.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Key Boundaries</span></span>
<span id="A5.SS3.p1.pic1.2.10" class="ltx_p"><span id="A5.SS3.p1.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">- MODIFY: Regular source files under /testbed (this is your working directory).</span></span>
<span id="A5.SS3.p1.pic1.2.11" class="ltx_p"><span id="A5.SS3.p1.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">- DO NOT MODIFY: Tests, configuration files (pyproject.toml, setup.cfg, etc.).</span></span>
<span id="A5.SS3.p1.pic1.2.12" class="ltx_p"><span id="A5.SS3.p1.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Preserve existing public interfaces and function/class signatures unless the PR explicitly requires changes.</span></span>
<span id="A5.SS3.p1.pic1.2.13" class="ltx_p"><span id="A5.SS3.p1.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Use only the standard library and existing project dependencies; do not add new external deps.</span></span>
<span id="A5.SS3.p1.pic1.2.14" class="ltx_p"><span id="A5.SS3.p1.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Avoid OS-level side effects unless strictly necessary for the fix.</span></span>
<span id="A5.SS3.p1.pic1.2.15" class="ltx_p"><span id="A5.SS3.p1.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Code Quality and Performance</span></span>
<span id="A5.SS3.p1.pic1.2.16" class="ltx_p"><span id="A5.SS3.p1.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Add type hints to new or modified public functions.</span></span>
<span id="A5.SS3.p1.pic1.2.17" class="ltx_p"><span id="A5.SS3.p1.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">- At the top of modified modules, include a concise module docstring: approach and Big-O; at most one explicit assumption if needed.</span></span>
<span id="A5.SS3.p1.pic1.2.18" class="ltx_p"><span id="A5.SS3.p1.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Prefer iterative solutions; avoid deep recursion.</span></span>
<span id="A5.SS3.p1.pic1.2.19" class="ltx_p"><span id="A5.SS3.p1.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Aim for <math id="A5.SS3.p1.pic1.m2" class="ltx_Math" alttext="O(n)\textendash O(nlogn)" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">O</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">–</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">O</mi><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">O(n)\textendash O(nlogn)</annotation></semantics></math>; avoid <math id="A5.SS3.p1.pic1.m3" class="ltx_Math" alttext="O(n^{2})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">O</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">O(n^{2})</annotation></semantics></math> on large inputs unless inherent to the problem.</span></span>
<span id="A5.SS3.p1.pic1.2.20" class="ltx_p"><span id="A5.SS3.p1.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Ensure deterministic behavior, stable ordering, and lexicographic tie-breaking if unspecified.</span></span>
<span id="A5.SS3.p1.pic1.2.21" class="ltx_p"><span id="A5.SS3.p1.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do not mutate input objects unless the API expects it or the codebase already relies on it.</span></span>
<span id="A5.SS3.p1.pic1.2.22" class="ltx_p"><span id="A5.SS3.p1.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Exact output formatting when producing any script output: no extra prints, robust Unicode handling, avoid unintended scientific notation.</span></span>
<span id="A5.SS3.p1.pic1.2.23" class="ltx_p"><span id="A5.SS3.p1.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Workflow</span></span>
<span id="A5.SS3.p1.pic1.2.24" class="ltx_p"><span id="A5.SS3.p1.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Analyze the repo to locate relevant code paths and constraints.</span></span>
<span id="A5.SS3.p1.pic1.2.25" class="ltx_p"><span id="A5.SS3.p1.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Create a non-interactive reproducibility script (if helpful) that reads from sys.stdin.buffer and writes to stdout; include a main entry point.</span></span>
<span id="A5.SS3.p1.pic1.2.26" class="ltx_p"><span id="A5.SS3.p1.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Implement fixes in source files, adhering to existing signatures/APIs and code style.</span></span>
<span id="A5.SS3.p1.pic1.2.27" class="ltx_p"><span id="A5.SS3.p1.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. Re-run your script to verify the fix.</span></span>
<span id="A5.SS3.p1.pic1.2.28" class="ltx_p"><span id="A5.SS3.p1.pic1.2.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. Probe edge cases to ensure robustness.</span></span>
<span id="A5.SS3.p1.pic1.2.29" class="ltx_p"><span id="A5.SS3.p1.pic1.2.29.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Command Execution Rules</span></span>
<span id="A5.SS3.p1.pic1.2.30" class="ltx_p"><span id="A5.SS3.p1.pic1.2.30.1" class="ltx_text" style="--ltx-fg-color:#000000;">This is an interactive loop:</span></span>
<span id="A5.SS3.p1.pic1.2.31" class="ltx_p"><span id="A5.SS3.p1.pic1.2.31.1" class="ltx_text" style="--ltx-fg-color:#000000;">- You will think, then issue ONE command; the system executes it; you see the result; then you issue your next command.</span></span>
<span id="A5.SS3.p1.pic1.2.32" class="ltx_p"><span id="A5.SS3.p1.pic1.2.32.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Each response MUST have:</span></span>
<span id="A5.SS3.p1.pic1.2.33" class="ltx_p"><span id="A5.SS3.p1.pic1.2.33.1" class="ltx_text" style="--ltx-fg-color:#000000;">1) A THOUGHT section explaining your reasoning and intent.</span></span>
<span id="A5.SS3.p1.pic1.2.34" class="ltx_p"><span id="A5.SS3.p1.pic1.2.34.1" class="ltx_text" style="--ltx-fg-color:#000000;">2) EXACTLY ONE bash code block containing EXACTLY ONE command (or a single compound command chained with &amp;&amp; or ||).</span></span>
<span id="A5.SS3.p1.pic1.2.35" class="ltx_p"><span id="A5.SS3.p1.pic1.2.35.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Environment state (like cd or env vars) is not persistent across commands; prefix actions accordingly (e.g., cd /testbed &amp;&amp; …).</span></span>
<span id="A5.SS3.p1.pic1.2.36" class="ltx_p"><span id="A5.SS3.p1.pic1.2.36.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Always use non-interactive flags (-y, -f). Avoid interactive editors/tools.</span></span>
<span id="A5.SS3.p1.pic1.2.37" class="ltx_p"><span id="A5.SS3.p1.pic1.2.37.1" class="ltx_text" style="--ltx-fg-color:#000000;">Format your responses like this:</span></span>
<span id="A5.SS3.p1.pic1.2.38" class="ltx_p"><span id="A5.SS3.p1.pic1.2.38.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;format_example&gt;</span></span>
<span id="A5.SS3.p1.pic1.2.39" class="ltx_p"><span id="A5.SS3.p1.pic1.2.39.1" class="ltx_text" style="--ltx-fg-color:#000000;">THOUGHT: Explain your current reasoning, what you aim to learn/change, and why the single command below is the best next step.</span></span>
<span id="A5.SS3.p1.pic1.2.40" class="ltx_p"><span id="A5.SS3.p1.pic1.2.40.1" class="ltx_text" style="--ltx-fg-color:#000000;">“‘bash</span></span>
<span id="A5.SS3.p1.pic1.2.41" class="ltx_p"><span id="A5.SS3.p1.pic1.2.41.1" class="ltx_text" style="--ltx-fg-color:#000000;">your_command_here</span></span>
<span id="A5.SS3.p1.pic1.2.42" class="ltx_p"><span id="A5.SS3.p1.pic1.2.42.1" class="ltx_text" style="--ltx-fg-color:#000000;">“‘</span></span>
<span id="A5.SS3.p1.pic1.2.43" class="ltx_p"><span id="A5.SS3.p1.pic1.2.43.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/format_example&gt;</span></span>
<span id="A5.SS3.p1.pic1.2.44" class="ltx_p"><span id="A5.SS3.p1.pic1.2.44.1" class="ltx_text" style="--ltx-fg-color:#000000;">If you need multiple steps, execute them sequentially across responses, or chain with &amp;&amp; or || in a single command.</span></span>
<span id="A5.SS3.p1.pic1.2.45" class="ltx_p"><span id="A5.SS3.p1.pic1.2.45.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Useful Command Examples</span></span>
<span id="A5.SS3.p1.pic1.2.46" class="ltx_p"><span id="A5.SS3.p1.pic1.2.46.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Create a new file:</span></span><pre id="A5.SS3.p1.pic1.2.47" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">cat &lt;&lt;’EOF’ &gt; script.py
import sys
def main() -&gt; None:
    data = sys.stdin.buffer.read()
   # process and print exact output
    print(&quot;ok&quot;)
if __name__ == &quot;__main__&quot;:
   main()
EOF
</pre>
<span id="A5.SS3.p1.pic1.2.48" class="ltx_p"><span id="A5.SS3.p1.pic1.2.48.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Edit files with sed:</span></span><pre id="A5.SS3.p1.pic1.2.49" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">sed -i ’s/old/new/g’ filename.py
</pre>
<span id="A5.SS3.p1.pic1.2.50" class="ltx_p"><span id="A5.SS3.p1.pic1.2.50.1" class="ltx_text" style="--ltx-fg-color:#000000;">- View file content:</span></span><pre id="A5.SS3.p1.pic1.2.51" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">nl -ba filename.py | sed -n ’10,30p’
</pre>
<span id="A5.SS3.p1.pic1.2.52" class="ltx_p"><span id="A5.SS3.p1.pic1.2.52.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Submission</span></span>
<span id="A5.SS3.p1.pic1.2.53" class="ltx_p"><span id="A5.SS3.p1.pic1.2.53.1" class="ltx_text" style="--ltx-fg-color:#000000;">When your fix is complete and you cannot make further progress, submit exactly:</span></span><pre id="A5.SS3.p1.pic1.2.54" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT &amp;&amp; git add -A \\
&amp;&amp; git diff --cached
</pre>
<span id="A5.SS3.p1.pic1.2.55" class="ltx_p"><span id="A5.SS3.p1.pic1.2.55.1" class="ltx_text" style="--ltx-fg-color:#000000;">You cannot continue working after submitting.</span></span>
<span id="A5.SS3.p1.pic1.2.56" class="ltx_p"><span id="A5.SS3.p1.pic1.2.56.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/instructions&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>