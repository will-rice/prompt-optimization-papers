<svg id="A5.SS2.p2.pic1" class="ltx_picture" height="726.21" overflow="visible" version="1.1" viewbox="0 0 676.77 726.21" width="676.77"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,726.21) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#E78BA2;" fill="#E78BA2" fill-opacity="1.0"><path style="stroke:none" d="M 0 6.01 L 0 698.48 C 0 701.8 2.69 704.49 6.01 704.49 L 670.76 704.49 C 674.08 704.49 676.77 701.8 676.77 698.48 L 676.77 6.01 C 676.77 2.69 674.08 0 670.76 0 L 6.01 0 C 2.69 0 0 2.69 0 6.01 Z" /></g><g style="--ltx-fill-color:#FDE6EB;" fill="#FDE6EB" fill-opacity="1.0"><path style="stroke:none" d="M 2.08 6.01 L 2.08 698.48 C 2.08 700.65 3.84 702.41 6.01 702.41 L 670.76 702.41 C 672.93 702.41 674.7 700.65 674.7 698.48 L 674.7 6.01 C 674.7 3.84 672.93 2.08 670.76 2.08 L 6.01 2.08 C 3.84 2.08 2.08 3.84 2.08 6.01 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 0 696.62)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#E78BA2;" fill="#E78BA2" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.53 L 0 25.07 C 0 27.57 2.03 29.6 4.53 29.6 L 557.59 29.6 C 560.09 29.6 562.12 27.57 562.12 25.07 L 562.12 4.53 C 562.12 2.03 560.09 0 557.59 0 L 4.53 0 C 2.03 0 0 2.03 0 4.53 Z" /></g><g style="--ltx-fill-color:#E78BA2;" fill="#E78BA2" fill-opacity="1.0"><path style="stroke:none" d="M 1.57 4.53 L 1.57 25.07 C 1.57 26.7 2.9 28.02 4.53 28.02 L 557.59 28.02 C 559.22 28.02 560.54 26.7 560.54 25.07 L 560.54 4.53 C 560.54 2.9 559.22 1.57 557.59 1.57 L 4.53 1.57 C 2.9 1.57 1.57 2.9 1.57 4.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 10.65)"><foreignobject style="--ltx-fo-width:28.22em;--ltx-fo-height:0.67em;--ltx-fo-depth:0.22em;font-size:13.5pt;" height="16.6" overflow="visible" transform="matrix(1 0 0 -1 0 12.45)" width="527.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A5.SS2.p2.pic1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#FFFFFF;">PromptBridge for Debugging Agent in MapCoder (GPT-4o <math id="A5.SS2.p2.pic1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math> o3)</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 19.85 23.31)"><foreignobject style="--ltx-fo-width:46.04em;--ltx-fo-height:47.79em;--ltx-fo-depth:0.25em;font-size:10pt;" height="664.8" overflow="visible" transform="matrix(1 0 0 -1 0 661.34)" width="637.06"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.04em;">
<span id="A5.SS2.p2.pic1.2.1" class="ltx_p"><span id="A5.SS2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Task: Assess whether the provided plan will correctly solve the given competitive programming problem under standard coding benchmark constraints (HumanEval, xCodeEval).</span></span>
<span id="A5.SS2.p2.pic1.2.2" class="ltx_p"><span id="A5.SS2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Inputs:</span></span>
<span id="A5.SS2.p2.pic1.2.3" class="ltx_p"><span id="A5.SS2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Problem: {Input Coding Problem}</span></span>
<span id="A5.SS2.p2.pic1.2.4" class="ltx_p"><span id="A5.SS2.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Plan: {Planning}</span></span>
<span id="A5.SS2.p2.pic1.2.5" class="ltx_p"><span id="A5.SS2.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Instructions:</span></span>
<span id="A5.SS2.p2.pic1.2.6" class="ltx_p"><span id="A5.SS2.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Assume Python 3.10, standard library only, deterministic logic (no randomness or external state), and robust handling of all edge cases.</span></span>
<span id="A5.SS2.p2.pic1.2.7" class="ltx_p"><span id="A5.SS2.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Evaluate the plan against typical grader expectations:</span></span>
<span id="A5.SS2.p2.pic1.2.8" class="ltx_p"><span id="A5.SS2.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- I/O policy: If the problem requires a specific function signature, the solution must implement exactly that signature with no stdin/stdout. If the problem is script-style, the solution must read from stdin and write to stdout precisely, with no extra output.</span></span>
<span id="A5.SS2.p2.pic1.2.9" class="ltx_p"><span id="A5.SS2.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Time and space complexity: Confirm the plan is near-optimal for worst-case constraints; flag potential TLE or memory issues.</span></span>
<span id="A5.SS2.p2.pic1.2.10" class="ltx_p"><span id="A5.SS2.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Correctness: Provide a proof sketch or invariant-based reasoning that the algorithm produces correct results for all cases, including corner cases (empty inputs, extremes, duplicates, negative values, large sizes).</span></span>
<span id="A5.SS2.p2.pic1.2.11" class="ltx_p"><span id="A5.SS2.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Determinism and stability: Verify tie-breaking rules (e.g., lexicographic/stable ordering) and output formatting are properly handled when unspecified.</span></span>
<span id="A5.SS2.p2.pic1.2.12" class="ltx_p"><span id="A5.SS2.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Numeric issues: Check integer overflow assumptions, floating-point precision/rounding, and formatting requirements.</span></span>
<span id="A5.SS2.p2.pic1.2.13" class="ltx_p"><span id="A5.SS2.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Recursion vs iteration: Prefer iterative approaches when recursion depth may exceed Python limits; note stack risks or the need for tail-call avoidance.</span></span>
<span id="A5.SS2.p2.pic1.2.14" class="ltx_p"><span id="A5.SS2.p2.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Data structures: Validate chosen structures and operations (sorting stability, hashing assumptions, boundary conditions).</span></span>
<span id="A5.SS2.p2.pic1.2.15" class="ltx_p"><span id="A5.SS2.p2.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">- I/O formatting: Ensure no extra whitespace/lines, exact printing requirements, and consistent encoding.</span></span>
<span id="A5.SS2.p2.pic1.2.16" class="ltx_p"><span id="A5.SS2.p2.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Be concise, precise, and deterministic. Do not include code, examples, or any text outside the required XML.</span></span>
<span id="A5.SS2.p2.pic1.2.17" class="ltx_p"><span id="A5.SS2.p2.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Output must be exactly the following XML with two tags. Do not add markdown or any additional text:</span></span>
<span id="A5.SS2.p2.pic1.2.18" class="ltx_p"><span id="A5.SS2.p2.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;root&gt;</span></span>
<span id="A5.SS2.p2.pic1.2.19" class="ltx_p"><span id="A5.SS2.p2.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;explanation&gt;Discuss whether the given competitive programming problem is solvable by using the above mentioned planning. Address algorithmic correctness, complexity, edge cases, I/O requirements, determinism, and any grader-aligned constraints. Clearly state if the plan is correct, partially correct, or incorrect, and why.&lt;/explanation&gt;</span></span>
<span id="A5.SS2.p2.pic1.2.20" class="ltx_p"><span id="A5.SS2.p2.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;confidence&gt;Confidence score regarding the solvability of the problem. Must be an integer between 0 and 100.&lt;/confidence&gt;</span></span>
<span id="A5.SS2.p2.pic1.2.21" class="ltx_p"><span id="A5.SS2.p2.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/root&gt;&quot;</span></span>
</span></span></span></foreignobject></g></g></svg>