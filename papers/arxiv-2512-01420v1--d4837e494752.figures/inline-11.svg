<svg id="A5.SS4.p2.pic1" class="ltx_picture" height="1066.14" overflow="visible" version="1.1" viewbox="0 0 676.77 1066.14" width="676.77"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1066.14) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3232B4;" fill="#3232B4" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.77 L 0 1043.5 C 0 1045.02 1.24 1046.26 2.77 1046.26 L 674 1046.26 C 675.53 1046.26 676.77 1045.02 676.77 1043.5 L 676.77 2.77 C 676.77 1.24 675.53 0 674 0 L 2.77 0 C 1.24 0 0 1.24 0 2.77 Z" /></g><g style="--ltx-fill-color:#E6E6FF;" fill="#E6E6FF" fill-opacity="1.0"><path style="stroke:none" d="M 2.77 2.77 L 2.77 1043.5 L 674 1043.5 L 674 2.77 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 0 1038.39)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#3232B4;" fill="#3232B4" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.53 L 0 23.22 C 0 25.72 2.03 27.75 4.53 27.75 L 349.19 27.75 C 351.69 27.75 353.72 25.72 353.72 23.22 L 353.72 4.53 C 353.72 2.03 351.69 0 349.19 0 L 4.53 0 C 2.03 0 0 2.03 0 4.53 Z" /></g><g style="--ltx-fill-color:#3232B4;" fill="#3232B4" fill-opacity="1.0"><path style="stroke:none" d="M 1.57 4.53 L 1.57 23.22 C 1.57 24.85 2.9 26.18 4.53 26.18 L 349.19 26.18 C 350.82 26.18 352.14 24.85 352.14 23.22 L 352.14 4.53 C 352.14 2.9 350.82 1.57 349.19 1.57 L 4.53 1.57 C 2.9 1.57 1.57 2.9 1.57 4.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.72)"><foreignobject style="--ltx-fo-width:17.53em;--ltx-fo-height:0.62em;--ltx-fo-depth:0.17em;font-size:13.5pt;" height="14.76" overflow="visible" transform="matrix(1 0 0 -1 0 11.53)" width="327.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A5.SS4.p2.pic1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#FFFFFF;">Optimized REACT Prompt for GPT-4o</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.54 24)"><foreignobject style="--ltx-fo-width:45.94em;--ltx-fo-height:72.4em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1005.19" overflow="visible" transform="matrix(1 0 0 -1 0 1001.73)" width="635.68"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.94em;">
<span id="A5.SS4.p2.pic1.2.1" class="ltx_p"><span id="A5.SS4.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Collect information for a query plan using interleaving ’Thought’, ’Action’, and ’Observation’ steps. Ensure you gather valid information related to transportation, dining, attractions, and accommodation. All information should be written in Notebook, which will then be input into the Planner tool. Note that the nested use of tools is prohibited. ’Thought’ can reason about the current situation, and ’Action’ can have 8 different types:</span></span>
<span id="A5.SS4.p2.pic1.2.2" class="ltx_p"><span id="A5.SS4.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">(1) FlightSearch[Departure City, Destination City, Date]:</span></span>
<span id="A5.SS4.p2.pic1.2.3" class="ltx_p"><span id="A5.SS4.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Description: A flight information retrieval tool.</span></span>
<span id="A5.SS4.p2.pic1.2.4" class="ltx_p"><span id="A5.SS4.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Parameters:</span></span>
<span id="A5.SS4.p2.pic1.2.5" class="ltx_p"><span id="A5.SS4.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Departure City: The city you’ll be flying out from.</span></span>
<span id="A5.SS4.p2.pic1.2.6" class="ltx_p"><span id="A5.SS4.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Destination City: The city you aim to reach.</span></span>
<span id="A5.SS4.p2.pic1.2.7" class="ltx_p"><span id="A5.SS4.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Date: The date of your travel in YYYY-MM-DD format.</span></span>
<span id="A5.SS4.p2.pic1.2.8" class="ltx_p"><span id="A5.SS4.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example: FlightSearch[New York, London, 2022-10-01] would fetch flights from New York to London on October 1, 2022.</span></span>
<span id="A5.SS4.p2.pic1.2.9" class="ltx_p"><span id="A5.SS4.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">(2) GoogleDistanceMatrix[Origin, Destination, Mode]:</span></span>
<span id="A5.SS4.p2.pic1.2.10" class="ltx_p"><span id="A5.SS4.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Description: Estimate the distance, time and cost between two cities.</span></span>
<span id="A5.SS4.p2.pic1.2.11" class="ltx_p"><span id="A5.SS4.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Parameters:</span></span>
<span id="A5.SS4.p2.pic1.2.12" class="ltx_p"><span id="A5.SS4.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Origin: The departure city of your journey.</span></span>
<span id="A5.SS4.p2.pic1.2.13" class="ltx_p"><span id="A5.SS4.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Destination: The destination city of your journey.</span></span>
<span id="A5.SS4.p2.pic1.2.14" class="ltx_p"><span id="A5.SS4.p2.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">Mode: The method of transportation. Choices include ’self-driving’ and ’taxi’.</span></span>
<span id="A5.SS4.p2.pic1.2.15" class="ltx_p"><span id="A5.SS4.p2.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example: GoogleDistanceMatrix[Paris, Lyon, self-driving] would provide driving distance, time and cost between Paris and Lyon.</span></span>
<span id="A5.SS4.p2.pic1.2.16" class="ltx_p"><span id="A5.SS4.p2.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">(3) AccommodationSearch[City]:</span></span>
<span id="A5.SS4.p2.pic1.2.17" class="ltx_p"><span id="A5.SS4.p2.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">Description: Discover accommodations in your desired city.</span></span>
<span id="A5.SS4.p2.pic1.2.18" class="ltx_p"><span id="A5.SS4.p2.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">Parameter: City - The name of the city where you’re seeking accommodation.</span></span>
<span id="A5.SS4.p2.pic1.2.19" class="ltx_p"><span id="A5.SS4.p2.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example: AccommodationSearch[Rome] would present a list of hotel rooms in Rome.</span></span>
<span id="A5.SS4.p2.pic1.2.20" class="ltx_p"><span id="A5.SS4.p2.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">(4) RestaurantSearch[City]:</span></span>
<span id="A5.SS4.p2.pic1.2.21" class="ltx_p"><span id="A5.SS4.p2.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">Description: Explore dining options in a city of your choice.</span></span>
<span id="A5.SS4.p2.pic1.2.22" class="ltx_p"><span id="A5.SS4.p2.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">Parameter: City – The name of the city where you’re seeking restaurants.</span></span>
<span id="A5.SS4.p2.pic1.2.23" class="ltx_p"><span id="A5.SS4.p2.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example: RestaurantSearch[Tokyo] would show a curated list of restaurants in Tokyo.</span></span>
<span id="A5.SS4.p2.pic1.2.24" class="ltx_p"><span id="A5.SS4.p2.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">(5) AttractionSearch[City]:</span></span>
<span id="A5.SS4.p2.pic1.2.25" class="ltx_p"><span id="A5.SS4.p2.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">Description: Find attractions in a city of your choice.</span></span>
<span id="A5.SS4.p2.pic1.2.26" class="ltx_p"><span id="A5.SS4.p2.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">Parameter: City – The name of the city where you’re seeking attractions.</span></span>
<span id="A5.SS4.p2.pic1.2.27" class="ltx_p"><span id="A5.SS4.p2.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example: AttractionSearch[London] would return attractions in London.</span></span>
<span id="A5.SS4.p2.pic1.2.28" class="ltx_p"><span id="A5.SS4.p2.pic1.2.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">(6) CitySearch[State]</span></span>
<span id="A5.SS4.p2.pic1.2.29" class="ltx_p"><span id="A5.SS4.p2.pic1.2.29.1" class="ltx_text" style="--ltx-fg-color:#000000;">Description: Find cities in a state of your choice.</span></span>
<span id="A5.SS4.p2.pic1.2.30" class="ltx_p"><span id="A5.SS4.p2.pic1.2.30.1" class="ltx_text" style="--ltx-fg-color:#000000;">Parameter: State – The name of the state where you’re seeking cities.</span></span>
<span id="A5.SS4.p2.pic1.2.31" class="ltx_p"><span id="A5.SS4.p2.pic1.2.31.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example: CitySearch[California] would return cities in California.</span></span>
<span id="A5.SS4.p2.pic1.2.32" class="ltx_p"><span id="A5.SS4.p2.pic1.2.32.1" class="ltx_text" style="--ltx-fg-color:#000000;">(7) NotebookWrite[Short Description]</span></span>
<span id="A5.SS4.p2.pic1.2.33" class="ltx_p"><span id="A5.SS4.p2.pic1.2.33.1" class="ltx_text" style="--ltx-fg-color:#000000;">Description: Writes a new data entry into the Notebook tool with a short description. This tool should be used immediately after FlightSearch, AccommodationSearch, AttractionSearch, RestaurantSearch or GoogleDistanceMatrix. Only the data stored in Notebook can be seen by Planner. So you should write all the information you need into Notebook.</span></span>
<span id="A5.SS4.p2.pic1.2.34" class="ltx_p"><span id="A5.SS4.p2.pic1.2.34.1" class="ltx_text" style="--ltx-fg-color:#000000;">Parameters: Short Description - A brief description or label for the stored data. You don’t need to write all the information in the description. The data you’ve searched for will be automatically stored in the Notebook.</span></span>
<span id="A5.SS4.p2.pic1.2.35" class="ltx_p"><span id="A5.SS4.p2.pic1.2.35.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example: NotebookWrite[Flights from Rome to Paris in 2022-02-01] would store the informatrion of flights from Rome to Paris in 2022-02-01 in the Notebook.</span></span>
<span id="A5.SS4.p2.pic1.2.36" class="ltx_p"><span id="A5.SS4.p2.pic1.2.36.1" class="ltx_text" style="--ltx-fg-color:#000000;">(8) Planner[Query]</span></span>
<span id="A5.SS4.p2.pic1.2.37" class="ltx_p"><span id="A5.SS4.p2.pic1.2.37.1" class="ltx_text" style="--ltx-fg-color:#000000;">Description: A smart planning tool that crafts detailed plans based on user input and the information stroed in Notebook.</span></span>
<span id="A5.SS4.p2.pic1.2.38" class="ltx_p"><span id="A5.SS4.p2.pic1.2.38.1" class="ltx_text" style="--ltx-fg-color:#000000;">Parameters:</span></span>
<span id="A5.SS4.p2.pic1.2.39" class="ltx_p"><span id="A5.SS4.p2.pic1.2.39.1" class="ltx_text" style="--ltx-fg-color:#000000;">Query: The query from user.</span></span>
<span id="A5.SS4.p2.pic1.2.40" class="ltx_p"><span id="A5.SS4.p2.pic1.2.40.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example: Planner[Give me a 3-day trip plan from Seattle to New York] would return a detailed 3-day trip plan.</span></span>
<span id="A5.SS4.p2.pic1.2.41" class="ltx_p"><span id="A5.SS4.p2.pic1.2.41.1" class="ltx_text" style="--ltx-fg-color:#000000;">You should use as many as possible steps to collect engough information to input to the Planner tool.</span></span>
<span id="A5.SS4.p2.pic1.2.42" class="ltx_p"><span id="A5.SS4.p2.pic1.2.42.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each action only calls one function once. Do not add any description in the action.</span></span>
<span id="A5.SS4.p2.pic1.2.43" class="ltx_p"><span id="A5.SS4.p2.pic1.2.43.1" class="ltx_text" style="--ltx-fg-color:#000000;">Query: {query}{scratchpad}</span></span>
</span></span></span></foreignobject></g></g></svg>