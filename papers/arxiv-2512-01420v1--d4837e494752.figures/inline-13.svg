<svg id="A5.SS4.p4.pic1" class="ltx_picture" height="804.01" overflow="visible" version="1.1" viewbox="0 0 676.77 804.01" width="676.77"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,804.01) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3232B4;" fill="#3232B4" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.77 L 0 781.36 C 0 782.89 1.24 784.13 2.77 784.13 L 674 784.13 C 675.53 784.13 676.77 782.89 676.77 781.36 L 676.77 2.77 C 676.77 1.24 675.53 0 674 0 L 2.77 0 C 1.24 0 0 1.24 0 2.77 Z" /></g><g style="--ltx-fill-color:#E6E6FF;" fill="#E6E6FF" fill-opacity="1.0"><path style="stroke:none" d="M 2.77 2.77 L 2.77 781.36 L 674 781.36 L 674 2.77 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 0 776.26)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#3232B4;" fill="#3232B4" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.53 L 0 23.22 C 0 25.72 2.03 27.75 4.53 27.75 L 426.03 27.75 C 428.54 27.75 430.56 25.72 430.56 23.22 L 430.56 4.53 C 430.56 2.03 428.54 0 426.03 0 L 4.53 0 C 2.03 0 0 2.03 0 4.53 Z" /></g><g style="--ltx-fill-color:#3232B4;" fill="#3232B4" fill-opacity="1.0"><path style="stroke:none" d="M 1.57 4.53 L 1.57 23.22 C 1.57 24.85 2.9 26.18 4.53 26.18 L 426.03 26.18 C 427.67 26.18 428.99 24.85 428.99 23.22 L 428.99 4.53 C 428.99 2.9 427.67 1.57 426.03 1.57 L 4.53 1.57 C 2.9 1.57 1.57 2.9 1.57 4.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.72)"><foreignobject style="--ltx-fo-width:21.64em;--ltx-fo-height:0.62em;--ltx-fo-depth:0.17em;font-size:13.5pt;" height="14.76" overflow="visible" transform="matrix(1 0 0 -1 0 11.53)" width="404.31"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A5.SS4.p4.pic1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#FFFFFF;">PromptBridge Optimized REACT Prompt for o3</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.54 24)"><foreignobject style="--ltx-fo-width:45.94em;--ltx-fo-height:53.45em;--ltx-fo-depth:0.25em;font-size:10pt;" height="743.06" overflow="visible" transform="matrix(1 0 0 -1 0 739.6)" width="635.68"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.94em;">
<span id="A5.SS4.p4.pic1.2.1" class="ltx_p"><span id="A5.SS4.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Strict agent protocol for TravelPlanner (o3)</span></span>
<span id="A5.SS4.p4.pic1.2.2" class="ltx_p"><span id="A5.SS4.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Goal: Collect high-quality, valid information for transportation, dining, attractions, and accommodation using interleaved Thought, Action, and Observation steps, then invoke Planner with only data stored in Notebook.</span></span>
<span id="A5.SS4.p4.pic1.2.3" class="ltx_p"><span id="A5.SS4.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output discipline:</span></span>
<span id="A5.SS4.p4.pic1.2.4" class="ltx_p"><span id="A5.SS4.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Emit only lines prefixed with Thought, Action, or Observation, plus a final Action calling Planner. No extra text.</span></span>
<span id="A5.SS4.p4.pic1.2.5" class="ltx_p"><span id="A5.SS4.p4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Each Action calls exactly one tool once; no nested tools. Observations must be the tool’s returned data (do not invent results).</span></span>
<span id="A5.SS4.p4.pic1.2.6" class="ltx_p"><span id="A5.SS4.p4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Step protocol:</span></span>
<span id="A5.SS4.p4.pic1.2.7" class="ltx_p"><span id="A5.SS4.p4.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Thought: Brief, explicit reasoning and assumptions; state approach, tie-break criteria, and why a tool call is needed. Keep it concise and deterministic.</span></span>
<span id="A5.SS4.p4.pic1.2.8" class="ltx_p"><span id="A5.SS4.p4.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Action: One tool call in the exact bracketed signature. No descriptions attached.</span></span>
<span id="A5.SS4.p4.pic1.2.9" class="ltx_p"><span id="A5.SS4.p4.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Observation: The tool’s response only. If a tool returns many results, capture top items deterministically (see tie-breaks).</span></span>
<span id="A5.SS4.p4.pic1.2.10" class="ltx_p"><span id="A5.SS4.p4.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Tools:</span></span>
<span id="A5.SS4.p4.pic1.2.11" class="ltx_p"><span id="A5.SS4.p4.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">(1) FlightSearch[Departure City, Destination City, Date]</span></span>
<span id="A5.SS4.p4.pic1.2.12" class="ltx_p"><span id="A5.SS4.p4.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">(2) GoogleDistanceMatrix[Origin, Destination, Mode] where Mode <math id="A5.SS4.p4.pic1.m1" class="ltx_Math" alttext="\in" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><annotation encoding="application/x-tex">\in</annotation></semantics></math> {{self-driving, taxi}}</span></span>
<span id="A5.SS4.p4.pic1.2.13" class="ltx_p"><span id="A5.SS4.p4.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">(3) AccommodationSearch[City]</span></span>
<span id="A5.SS4.p4.pic1.2.14" class="ltx_p"><span id="A5.SS4.p4.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">(4) RestaurantSearch[City]</span></span>
<span id="A5.SS4.p4.pic1.2.15" class="ltx_p"><span id="A5.SS4.p4.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">(5) AttractionSearch[City]</span></span>
<span id="A5.SS4.p4.pic1.2.16" class="ltx_p"><span id="A5.SS4.p4.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">(6) CitySearch[State]</span></span>
<span id="A5.SS4.p4.pic1.2.17" class="ltx_p"><span id="A5.SS4.p4.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">(7) NotebookWrite[Short Description] — must be used immediately after FlightSearch, GoogleDistanceMatrix, AccommodationSearch, RestaurantSearch, or AttractionSearch to persist results for Planner.</span></span>
<span id="A5.SS4.p4.pic1.2.18" class="ltx_p"><span id="A5.SS4.p4.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">(8) Planner[Query] — generates the plan using only Notebook data.</span></span>
<span id="A5.SS4.p4.pic1.2.19" class="ltx_p"><span id="A5.SS4.p4.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">Planning and performance guidelines:</span></span>
<span id="A5.SS4.p4.pic1.2.20" class="ltx_p"><span id="A5.SS4.p4.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Use as many steps as necessary to fully support Planner, but avoid redundant calls (do not query the same parameters twice).</span></span>
<span id="A5.SS4.p4.pic1.2.21" class="ltx_p"><span id="A5.SS4.p4.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Prefer minimal, comprehensive coverage over exhaustive enumeration; store only essential, high-signal results in Notebook.</span></span>
<span id="A5.SS4.p4.pic1.2.22" class="ltx_p"><span id="A5.SS4.p4.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Deterministic ranking and tie-breaks: prioritize lower total cost, shorter duration/travel time, higher ratings, central location, and better availability; when ties remain, choose alphabetically by name.</span></span>
<span id="A5.SS4.p4.pic1.2.23" class="ltx_p"><span id="A5.SS4.p4.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Handle edge cases explicitly in Thought: ambiguous cities/states (use CitySearch), date format must be YYYY-MM-DD, mode selection justified, large result sets trimmed, currencies and units kept consistent.</span></span>
<span id="A5.SS4.p4.pic1.2.24" class="ltx_p"><span id="A5.SS4.p4.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do not rely on external systems beyond the provided tools. Do not fabricate Observations. If a tool fails or returns no data, note it in Observation and adjust.</span></span>
<span id="A5.SS4.p4.pic1.2.25" class="ltx_p"><span id="A5.SS4.p4.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">Finalization:</span></span>
<span id="A5.SS4.p4.pic1.2.26" class="ltx_p"><span id="A5.SS4.p4.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Only call Planner after you have stored enough relevant data via NotebookWrite to answer the user’s query.</span></span>
<span id="A5.SS4.p4.pic1.2.27" class="ltx_p"><span id="A5.SS4.p4.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Maintain exact formatting and avoid any extraneous output.</span></span>
<span id="A5.SS4.p4.pic1.2.28" class="ltx_p"><span id="A5.SS4.p4.pic1.2.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">Query: {query}{scratchpad}</span></span>
</span></span></span></foreignobject></g></g></svg>