<span id="A5.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.04em;">
<span id="A5.SS1.p2.pic1.2.1" class="ltx_p"><span id="A5.SS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to apply the transfer effects from the source prompt to generate a new target prompt.</span></span>
<span id="A5.SS1.p2.pic1.2.2" class="ltx_p"><span id="A5.SS1.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The transfer effects were derived from the standard coding dataset.</span></span>
<span id="A5.SS1.p2.pic1.2.3" class="ltx_p"><span id="A5.SS1.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must now generate a prompt for the unseen dataset that incorporates these transfer effects.</span></span>
<span id="A5.SS1.p2.pic1.2.4" class="ltx_p"><span id="A5.SS1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Begin from the Original Prompt provided below.</span></span>
<span id="A5.SS1.p2.pic1.2.5" class="ltx_p"><span id="A5.SS1.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">## ====== Original Prompt Starts ========</span></span>
<span id="A5.SS1.p2.pic1.2.6" class="ltx_p"><span id="A5.SS1.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Original Prompt: {Source Prompt}</span></span>
<span id="A5.SS1.p2.pic1.2.7" class="ltx_p"><span id="A5.SS1.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">## ====== Original Prompt Ends ========</span></span>
<span id="A5.SS1.p2.pic1.2.8" class="ltx_p"><span id="A5.SS1.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Transfer Effects Summary:</span></span>
<span id="A5.SS1.p2.pic1.2.9" class="ltx_p"><span id="A5.SS1.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">{summary}</span></span>
<span id="A5.SS1.p2.pic1.2.10" class="ltx_p"><span id="A5.SS1.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Task:</span></span>
<span id="A5.SS1.p2.pic1.2.11" class="ltx_p"><span id="A5.SS1.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Apply the above transfer effects summary to the Original Prompt designed for {source_model}.</span></span>
<span id="A5.SS1.p2.pic1.2.12" class="ltx_p"><span id="A5.SS1.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Generate a new prompt that is:</span></span>
<span id="A5.SS1.p2.pic1.2.13" class="ltx_p"><span id="A5.SS1.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Adapted for the {target_model} model,</span></span>
<span id="A5.SS1.p2.pic1.2.14" class="ltx_p"><span id="A5.SS1.p2.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Grounded in the transfer effects summary,</span></span>
<span id="A5.SS1.p2.pic1.2.15" class="ltx_p"><span id="A5.SS1.p2.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Suitable for eliciting higher-quality responses on the coding datasets, such as HumanEval and xCodeEval.</span></span>
