<span id="S5.SS3.p1.pic1.p1.1" class="ltx_p"><span id="S5.SS3.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Finding 4.</span><span id="S5.SS3.p1.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> DA3PO is robust across different values of </span><math id="S5.SS3.p1.pic1.p1.m1" class="ltx_Math" alttext="\lambda" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">λ</mi><annotation encoding="application/x-tex">\lambda</annotation></semantics></math><span id="S5.SS3.p1.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, with </span><math id="S5.SS3.p1.pic1.p1.m2" class="ltx_Math" alttext="\lambda=2" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">λ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><annotation encoding="application/x-tex">\lambda=2</annotation></semantics></math><span id="S5.SS3.p1.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> yielding the best average accuracy on both model scales.</span></span>
