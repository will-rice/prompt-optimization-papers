<span id="S4.SS3.p3.pic1.p2" class="ltx_para">
<span id="S4.SS3.p3.pic1.p2.1" class="ltx_p"><span id="S4.SS3.p3.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Classify the input text as one of the following labels:1;0;2;3. 
<br class="ltx_break">The task is to determine whether the input text is a question or request for advice (label 0); a statement or opinion (label 1); a spam or promotional message (label 2); or an off-topic or unrelated message (label 3).
<br class="ltx_break">Useful clues for making the decision include:
<br class="ltx_break">- The presence of a question or request for help; which is often indicated by words or phrases such as ’I need’…
<br class="ltx_break">- The tone and language used; which may indicate a question or request for advice (e.g. polite language; uncertainty; or a sense of seeking guidance).
<br class="ltx_break">- The content of the text; which may be related to a specific topic or subject (e.g. computer hardware; medical careers; or cryptocurrency).
<br class="ltx_break">Respond with only the label name; without any explanation or additional text. Only return one of these options: 1; 0; 2; 3. Do not output ’Label:’ or any extra text.
<br class="ltx_break"></span></span>
</span>
