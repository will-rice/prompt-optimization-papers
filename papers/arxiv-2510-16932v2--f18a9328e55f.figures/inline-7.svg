<span id="A1.SS6.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS6.p1.pic1.2.1" class="ltx_p"><span id="A1.SS6.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are helping to create a prompt for a language model to classify text inputs. The model should choose one label from the following options: {label_names}. 
<br class="ltx_break">
<br class="ltx_break">Here are some example inputs and their correct labels: 
<br class="ltx_break">{examples} 
<br class="ltx_break">
<br class="ltx_break">Write an instruction that: 
<br class="ltx_break">- Describes the classification task in a way that generalizes to new inputs. 
<br class="ltx_break">- Points out any useful clues or strategies for making the decision. 
<br class="ltx_break">- Clearly tells the model to respond with only the label name, and not to include any explanation or additional text. 
<br class="ltx_break">
<br class="ltx_break">Provide only the instruction, not the examples or labels.</span></span>
