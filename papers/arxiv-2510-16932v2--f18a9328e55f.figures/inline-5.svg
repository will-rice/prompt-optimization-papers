<span id="S4.SS3.p4.pic1.p2.1" class="ltx_p"><span id="S4.SS3.p4.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Classify each input into one of the following categories based on its content and purpose:
<br class="ltx_break">- Label 0: This label is for inputs that are asking for advice; guidance; or recommendations on building or upgrading a computer; purchasing computer components; or troubleshooting computer-related issues…
<br class="ltx_break">- Label 3: This label is for inputs that are unrelated to computer hardware or software and are instead focused on other topics; such as business; finance; or cryptocurrency…
<br class="ltx_break">- Label 2: This label is for inputs that are asking for advice or guidance on non-computer related topics; such as education; career; or personal development…
<br class="ltx_break">- Label 1: This label is for inputs that do not fit into any of the above categories. If an input is unclear or does not…
<br class="ltx_break">Respond with the corresponding label (0; 1; 2; or 3) only…
<br class="ltx_break">Only return one of these options: 1; 0; 2; 3. Do not output ’Label:’ or any extra text.
