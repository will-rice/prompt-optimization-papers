<span id="S2.SS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="S2.SS2.p3.pic1.2.1" class="ltx_p"><span id="S2.SS2.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are designing a clear instruction for a data annotator to classify text inputs into one of these labels: {label_names}</span></span>
<span id="S2.SS2.p3.pic1.2.2" class="ltx_p"><span id="S2.SS2.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here are some example inputs and their correct labels:
{examples}</span></span>
<span id="S2.SS2.p3.pic1.2.3" class="ltx_p"><span id="S2.SS2.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to write a concise instruction that:</span></span>
<span id="S2.I1" class="ltx_itemize">
<span id="S2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S2.I1.i1.p1" class="ltx_para">
<span id="S2.I1.i1.p1.1" class="ltx_p"><span id="S2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Defines the classification task and clearly explains the meaning of each label.</span></span>
</span></span>
<span id="S2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S2.I1.i2.p1" class="ltx_para">
<span id="S2.I1.i2.p1.1" class="ltx_p"><span id="S2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provides general labeling strategies and decision rules so annotators can correctly handle unseen inputs.</span></span>
</span></span>
<span id="S2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S2.I1.i3.p1" class="ltx_para">
<span id="S2.I1.i3.p1.1" class="ltx_p"><span id="S2.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Highlights common pitfalls, tricky edge cases, and misconceptions to reduce labeling errors.</span></span>
</span></span>
<span id="S2.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
