<span id="A1.SS6.p6.pic1.p2" class="ltx_para">
<span id="A1.SS6.p6.pic1.p2.1" class="ltx_p"><span id="A1.SS6.p6.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Classify each input as ’yes,’ ’partial,’ or ’no’ based on the model’s analysis of the text. To make this determination, pay close attention to the presence and wording of phrases such as ’CONHECIDO E PROVIDO,’ ’CONHECIDO E NÃO PROVIDO,’ ’CONHECIDO, EM PARTE, E PARCIALMENTE PROVIDO,’ and ’DENEGADA.’ 
<br class="ltx_break">
<br class="ltx_break">- ’CONHECIDO E PROVIDO’ typically indicates a ’yes’ label, as it implies the request was fully granted.
<br class="ltx_break">- ’CONHECIDO E NÃO PROVIDO’ typically indicates a ’no’ label, as it implies the request was fully denied.
<br class="ltx_break">- ’CONHECIDO, EM PARTE, E PARCIALMENTE PROVIDO’ typically indicates a ’partial’ label, as it implies the request was granted but not fully.
<br class="ltx_break">- ’DENEGADA’ typically indicates a ’no’ label, as it directly translates to ’denied.’
<br class="ltx_break">- If the input does not contain any of these phrases, look for other indicators such as ’revisão criminal parcialmente procedente,’ which suggests a ’partial’ label.
<br class="ltx_break">
<br class="ltx_break">Respond with only the corresponding label (’yes,’ ’partial,’ or ’no’) for each input, without any explanation or additional text. Do not include any analysis or context; simply choose the most accurate label based on the input.
<br class="ltx_break">Only return one of these options: no, partial, yes. Do not output &quot;Label:&quot; or any extra text.
<br class="ltx_break"></span></span>
</span>
