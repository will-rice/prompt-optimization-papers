</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 11.2)"><foreignobject style="--ltx-fo-width:35.71em;--ltx-fo-height:11.43em;--ltx-fo-depth:0.18em;font-size:10pt;" height="160.51" overflow="visible" transform="matrix(1 0 0 -1 0 158.09)" width="494.13"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS4.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.71em;">
<span id="S3.SS4.p7.pic1.2.1" class="ltx_p"><span id="S3.SS4.p7.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">We use coverage annotations as the <span id="S3.SS4.p7.pic1.2.1.1.1" class="ltx_text ltx_font_bold">convergence signal</span>:
as the skill absorbs generalizable patterns, the
<span id="S3.SS4.p7.pic1.2.1.1.2" class="ltx_text ltx_font_bold">hard-to-soft gradients ratio</span> declines, and residual hard gradients
become statistically indistinguishable from noise. Our
signal-based detector selects a checkpoint with <span id="S3.SS4.p7.pic1.2.1.1.3" class="ltx_text ltx_font_bold">55%
test accuracy</span> (<span id="S3.SS4.p7.pic1.2.1.1.4" class="ltx_text ltx_font_bold">+4pp</span> over validation-based selection),
within 1.2pp of the oracle optimum, <span id="S3.SS4.p7.pic1.2.1.1.5" class="ltx_text ltx_font_italic">without
any additional forward passes or held-out evaluation</span>.</span></span>
</span></span></span></foreignobject></g></g></svg>