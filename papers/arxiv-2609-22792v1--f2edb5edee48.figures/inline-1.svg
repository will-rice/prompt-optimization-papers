<span id="S2.SS3.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.71em;">
<span id="S2.I2" class="ltx_enumerate ltx_leftmargin_flush">
<span id="S2.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S2.I2.i1.p1" class="ltx_para">
<span id="S2.I2.i1.p1.1" class="ltx_p"><span id="S2.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Self-Supervision:</span><span id="S2.I2.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> How to leverage vulnerability metadata </span><math id="S2.I2.i1.p1.m1" class="ltx_Math" alttext="\mu_{v}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">μ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">v</mi></msub><annotation encoding="application/x-tex">\mu_{v}</annotation></semantics></math><span id="S2.I2.i1.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> for self-assessment, without requiring a stronger optimizer model or canonical ground truth?</span></span>
</span></span>
<span id="S2.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S2.I2.i2.p1" class="ltx_para">
<span id="S2.I2.i2.p1.1" class="ltx_p"><span id="S2.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Gradient Computation:</span><span id="S2.I2.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> How to decompose the backward pass for multi-step agentic trajectories, separating behavioral analysis from context attribution?</span></span>
</span></span>
<span id="S2.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="S2.I2.i3.p1" class="ltx_para">
<span id="S2.I2.i3.p1.1" class="ltx_p"><span id="S2.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Gradient Accumulation:</span><span id="S2.I2.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> How to identify the most generalizable update direction from noisy per-task gradients, and calibrate how aggressively to apply each update?</span></span>
</span></span>
<span id="S2.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="S2.I2.i4.p1" class="ltx_para">
<span id="S2.I2.i4.p1.1" class="ltx_p"><span id="S2.I2.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Convergence Detection:</span><span id="S2.I2.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> How to detect that the optimization has extracted the generalizable signal available from the training data and what remains is noise?</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>