<span id="S3.SS2.p14.pic1.1.1" class="ltx_p"><span id="S3.SS2.p14.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">RQ1,2: Self-Supervision &amp; Gradient Computation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 11.2)"><foreignobject style="--ltx-fo-width:35.71em;--ltx-fo-height:10.23em;--ltx-fo-depth:0.18em;font-size:10pt;" height="143.91" overflow="visible" transform="matrix(1 0 0 -1 0 141.49)" width="494.13"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS2.p14.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.71em;">
<span id="S3.SS2.p14.pic1.2.1" class="ltx_p"><span id="S3.SS2.p14.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Three-stage chain-rule decomposition yields <math id="S3.SS2.p14.pic1.m1" class="ltx_math_unparsed" alttext="\mathbf{1.75\times}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" class="ltx_mathvariant_bold" mathcolor="#000000" mathvariant="bold">1.75</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000">×</mo></mrow><annotation encoding="application/x-tex">\mathbf{1.75\times}</annotation></semantics></math>
better sample efficiency than single-stage per-task analysis, further adding a <span id="S3.SS2.p14.pic1.2.1.1.1" class="ltx_text ltx_font_bold">7-point test accuracy gain</span>.
The key mechanism is the <span id="S3.SS2.p14.pic1.2.1.1.2" class="ltx_text ltx_font_bold">skill-blind</span> middle
stage: by reconstructing the structural invariant (<math id="S3.SS2.p14.pic1.m2" class="ltx_Math" alttext="\psi_{v}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ψ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi></msub><annotation encoding="application/x-tex">\psi_{v}</annotation></semantics></math>) from vulnerability
metadata (<math id="S3.SS2.p14.pic1.m3" class="ltx_Math" alttext="\mu_{v}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">μ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi></msub><annotation encoding="application/x-tex">\mu_{v}</annotation></semantics></math>) <em id="S3.SS2.p14.pic1.2.1.1.3" class="ltx_emph ltx_font_italic">before</em> seeing the skill, the optimizer produces
edits grounded in <span id="S3.SS2.p14.pic1.2.1.1.4" class="ltx_text ltx_font_bold">behavioral evidence</span> rather than
surface-level pattern matching.</span></span>
</span></span></span></foreignobject></g></g></svg>