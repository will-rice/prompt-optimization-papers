<span id="S4.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.72em;">
<span id="S4.p5.pic1.1.1" class="ltx_p"><span id="S4.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Additional Studies Takeaways</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 390.34)"><foreignobject style="--ltx-fo-width:35.71em;--ltx-fo-height:1.63em;--ltx-fo-depth:27.58em;font-size:10pt;" height="404.05" overflow="visible" transform="matrix(1 0 0 -1 0 22.49)" width="494.13"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.71em;">
<span id="S4.I1" class="ltx_enumerate ltx_leftmargin_flush">
<span id="S4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S4.I1.i1.p1" class="ltx_para">
<span id="S4.I1.i1.p1.1" class="ltx_p"><span id="S4.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Batch size:</span><span id="S4.I1.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Doubling to </span><math id="S4.I1.i1.p1.m1" class="ltx_Math" alttext="m{=}32" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">32</mn></mrow><annotation encoding="application/x-tex">m{=}32</annotation></semantics></math><span id="S4.I1.i1.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> drops test accuracy to 35%; larger batches spanning highly diverse vulnerability types dilute cross-task consensus to overly generic themes that lack the specificity needed for precise optimization.</span></span>
</span></span>
<span id="S4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S4.I1.i2.p1" class="ltx_para">
<span id="S4.I1.i2.p1.1" class="ltx_p"><span id="S4.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">No metadata:</span><span id="S4.I1.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> The pipeline still improves from 36% to 45% on binary signal alone, confirming that the algorithmic contributions are independently valuable, though metadata adds a further 11 points by enabling self-supervision (</span><math id="S4.I1.i2.p1.m1" class="ltx_Math" alttext="\hat{\phi}_{v}" display="inline" intent=":literal"><semantics><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">ϕ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">v</mi></msub><annotation encoding="application/x-tex">\hat{\phi}_{v}</annotation></semantics></math><span id="S4.I1.i2.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S4.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="S4.I1.i3.p1" class="ltx_para">
<span id="S4.I1.i3.p1.1" class="ltx_p"><span id="S4.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Frontier scaling:</span><span id="S4.I1.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="S4.I1.i3.p1.1.3" class="ltx_text ltx_font_smallcaps" style="font-size:90%;--ltx-fg-color:#000000;">SelfOp</span><span id="S4.I1.i3.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> improves GPT-5.4 from 49% to 67.5% (+18.5 points), demonstrating that context optimization is not saturated by weaker models and can substantially improve frontier performance.</span></span>
</span></span>
<span id="S4.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="S4.I1.i4.p1" class="ltx_para">
<span id="S4.I1.i4.p1.1" class="ltx_p"><span id="S4.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Transferability:</span><span id="S4.I1.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Skills transfer across models in both directions: GPT-5.4’s skill lifts GPT-5.4-mini to 65% (vs. 55% self-optimized), and GPT-5.4-mini’s skill lifts GPT-5.4 to 62% (vs. 49% baseline), indicating that </span><span id="S4.I1.i4.p1.1.3" class="ltx_text ltx_font_smallcaps" style="font-size:90%;--ltx-fg-color:#000000;">SelfOp</span><span id="S4.I1.i4.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">-optimized context encodes generalizable task knowledge rather than model-specific patterns.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>