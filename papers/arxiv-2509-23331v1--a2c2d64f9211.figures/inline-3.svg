<span id="A9.p3.pic1.1.1" class="ltx_p"><span id="A9.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">2. IFBench</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.42 10.65)"><foreignobject style="--ltx-fo-width:37.81em;--ltx-fo-height:50.55em;--ltx-fo-depth:0em;font-size:10pt;" height="699.47" overflow="visible" transform="matrix(1 0 0 -1 0 699.47)" width="523.18"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A9.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.81em;">
<span id="A9.p3.pic1.2.1" class="ltx_p"><span id="A9.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to optimize the system prompt for IFBench so that the large language model can more accurately follow the various requirements in the instructions during a two-step generation process.</span></span>
<span id="A9.p3.pic1.2.2" class="ltx_p"><span id="A9.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Goal:<span id="A9.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Given an instruction, first answer it directly, and then further calibrate the answer to produce a final response that best meets the instruction’s requirements.</span></span></span>
<span id="A9.p3.pic1.2.3" class="ltx_p"><span id="A9.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task Pipeline:<span id="A9.p3.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A9.I3" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A9.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A9.I3.i1.1" class="ltx_text ltx_font_bold">Step 1:</span></span> 
<span id="A9.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I3.i1.p1.1" class="ltx_p"><span id="A9.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Direct Answer Generation</span><span id="A9.I3.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (</span><span id="A9.I3.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;system_prompt_1&gt;&lt;/system_prompt_1&gt;</span><span id="A9.I3.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></span>
<span id="A9.I3.i1.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:12pt;">
<span id="A9.I3.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I3.i1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I3.i1.I1.i1.p1.1" class="ltx_p"><span id="A9.I3.i1.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Input:</span><span id="A9.I3.i1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> User’s instruction + </span><span id="A9.I3.i1.I1.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">system_prompt_1</span></span>
</span></span>
<span id="A9.I3.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I3.i1.I1.i2.p1" class="ltx_para">
<span id="A9.I3.i1.I1.i2.p1.1" class="ltx_p"><span id="A9.I3.i1.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Output:</span><span id="A9.I3.i1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A direct response to the instruction</span></span>
</span></span>
</span>
</span></span>
<span id="A9.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A9.I3.i2.1" class="ltx_text ltx_font_bold">Step 2:</span></span> 
<span id="A9.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="A9.I3.i2.p1.1" class="ltx_p"><span id="A9.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer Calibration</span><span id="A9.I3.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (</span><span id="A9.I3.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;system_prompt_2&gt;&lt;/system_prompt_2&gt;</span><span id="A9.I3.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></span>
<span id="A9.I3.i2.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:12pt;">
<span id="A9.I3.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I3.i2.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I3.i2.I1.i1.p1.1" class="ltx_p"><span id="A9.I3.i2.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Input:</span><span id="A9.I3.i2.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> User’s instruction + Step 1 answer + </span><span id="A9.I3.i2.I1.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">system_prompt_2</span></span>
</span></span>
<span id="A9.I3.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I3.i2.I1.i2.p1" class="ltx_para">
<span id="A9.I3.i2.I1.i2.p1.1" class="ltx_p"><span id="A9.I3.i2.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Output:</span><span id="A9.I3.i2.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Final calibrated answer</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A9.p3.pic1.2.4" class="ltx_p"><span id="A9.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Your Task:<span id="A9.p3.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
Refine system prompt 1 and system prompt 2 so that each one provides clearer and more effective guidance for its corresponding step in the pipeline. The ultimate goal is to maximize the model’s ability to follow instructions, ensuring its responses meet all requirements in the user’s instructions.</span></span></span>
<span id="A9.p3.pic1.2.5" class="ltx_p"><span id="A9.p3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Constraints:<span id="A9.p3.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A9.I4" class="ltx_itemize ltx_leftmargin_flush">
<span id="A9.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I4.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I4.i1.p1.1" class="ltx_p"><span id="A9.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You may perform multiple modifications</span></span>
</span></span>
<span id="A9.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I4.i2.p1" class="ltx_para ltx_noindent">
<span id="A9.I4.i2.p1.1" class="ltx_p"><span id="A9.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Cannot modify content inside angle brackets (e.g., </span><span id="A9.I4.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;system_prompt_1&gt;</span><span id="A9.I4.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></span>
</span></span>
<span id="A9.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I4.i3.p1" class="ltx_para ltx_noindent">
<span id="A9.I4.i3.p1.1" class="ltx_p"><span id="A9.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Final output must contain exactly two system prompts</span></span>
</span></span>
<span id="A9.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I4.i4.p1" class="ltx_para">
<span id="A9.I4.i4.p1.1" class="ltx_p"><span id="A9.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each prompt must be presented in the format: </span><span id="A9.I4.i4.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;system_prompt_x&gt; ... &lt;/system_prompt_x&gt;</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>