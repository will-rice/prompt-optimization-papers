<svg id="A9.p3.pic1" class="ltx_picture" height="739.43" overflow="visible" version="1.1" viewbox="0 0 550 739.43" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,739.43) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737D73;" fill="#737D73" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 739.43 L 550 739.43 L 550 0 Z" /></g><g style="--ltx-fill-color:#E6FAE6;" fill="#E6FAE6" fill-opacity="1.0"><path style="stroke:none" d="M 1.18 1.18 L 1.18 719.58 L 548.82 719.58 L 548.82 1.18 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.42 724.7)"><foreignobject style="--ltx-fo-width:37.81em;--ltx-fo-height:0.69em;--ltx-fo-depth:0em;font-size:10pt;" height="9.61" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="523.18"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
