<span id="A9.I5.i7.I1.i1.p1.1" class="ltx_p"><span id="A9.I5.i7.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Input:</span><span id="A9.I5.i7.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Query from Step 6</span></span>
