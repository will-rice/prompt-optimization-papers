<span id="A9.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.81em;">
<span id="A9.p4.pic1.2.1" class="ltx_p"><span id="A9.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to optimize four system prompts for a seven-step retrieval-and-answer pipeline.</span></span>
<span id="A9.p4.pic1.2.2" class="ltx_p"><span id="A9.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Goal:<span id="A9.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Given an input claim, perform two rounds of summarization and query generation, followed by three rounds of retrieval, to determine whether the claim can be SUPPORTED or NOT_SUPPORTED by the final passages. The evaluation criterion is whether the true passages are fully contained within the union of the three retrieval outputs (first, second, and final retrieval).</span></span></span>
<span id="A9.p4.pic1.2.3" class="ltx_p"><span id="A9.p4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task Pipeline:<span id="A9.p4.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A9.I5" class="ltx_enumerate ltx_leftmargin_flush">
