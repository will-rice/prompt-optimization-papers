<span id="A9.I5.i6.I1.i2.p1.1" class="ltx_p"><span id="A9.I5.i6.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Output:</span><span id="A9.I5.i6.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Query capturing core claim semantics for final retrieval</span></span>
