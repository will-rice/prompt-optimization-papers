<span id="A9.I5.i6.I1.i1.p1.1" class="ltx_p"><span id="A9.I5.i6.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Input:</span><span id="A9.I5.i6.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> claim, summary_1, summary_2, </span><span id="A9.I5.i6.I1.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">system_prompt_4</span></span>
