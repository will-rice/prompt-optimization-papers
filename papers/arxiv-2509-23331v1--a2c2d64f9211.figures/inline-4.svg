<span id="A9.I6.i2.p1.1" class="ltx_p"><span id="A9.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Cannot modify content inside angle brackets (e.g., </span><span id="A9.I6.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;system_prompt_1&gt;</span><span id="A9.I6.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></span>
</span></span>
