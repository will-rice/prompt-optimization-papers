</span>
</span></span>
</span>
<span id="A9.p4.pic1.2.4" class="ltx_p"><span id="A9.p4.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Your Task:<span id="A9.p4.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
Optimize system prompt 1, system prompt 2, system prompt 3, and system prompt 4 to provide clearer, more effective guidance for their corresponding steps. Ensure overall accuracy is maximized, so that all true passages are contained in the final three retrieval results.</span></span></span>
<span id="A9.p4.pic1.2.5" class="ltx_p"><span id="A9.p4.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Constraints:<span id="A9.p4.pic1.2.5.1.1" class="ltx_text"></span></span></span>
