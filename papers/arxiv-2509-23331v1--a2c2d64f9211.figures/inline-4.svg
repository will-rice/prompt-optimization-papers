</span></span>
<span id="A9.I5.i3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I5.i3.I1.i2.p1" class="ltx_para">
<span id="A9.I5.i3.I1.i2.p1.1" class="ltx_p"><span id="A9.I5.i3.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Output:</span><span id="A9.I5.i3.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Query capturing core claim semantics for second retrieval</span></span>
