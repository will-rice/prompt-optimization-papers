<span id="A9.I6.i4.p1.1" class="ltx_p"><span id="A9.I6.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each prompt must be presented in the format: </span><span id="A9.I6.i4.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;system_prompt_x&gt; ... &lt;/system_prompt_x&gt;</span></span>
