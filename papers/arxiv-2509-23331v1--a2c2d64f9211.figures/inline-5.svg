<span id="A9.p5.pic1.2.1" class="ltx_p"><span id="A9.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to optimize a system prompt for mathematical problems.</span></span>
<span id="A9.p5.pic1.2.2" class="ltx_p"><span id="A9.p5.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Goal:<span id="A9.p5.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Given an input math problem, answer this problem to get the final answer.</span></span></span>
<span id="A9.p5.pic1.2.3" class="ltx_p"><span id="A9.p5.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task Pipeline:<span id="A9.p5.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A9.I7" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A9.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A9.I7.i1.1" class="ltx_text ltx_font_bold">Step 1:</span></span> 
<span id="A9.I7.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I7.i1.p1.1" class="ltx_p"><span id="A9.I7.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer</span></span>
<span id="A9.I7.i1.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:12pt;">
<span id="A9.I7.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I7.i1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I7.i1.I1.i1.p1.1" class="ltx_p"><span id="A9.I7.i1.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Input:</span><span id="A9.I7.i1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> problem</span></span>
</span></span>
<span id="A9.I7.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I7.i1.I1.i2.p1" class="ltx_para">
<span id="A9.I7.i1.I1.i2.p1.1" class="ltx_p"><span id="A9.I7.i1.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Output:</span><span id="A9.I7.i1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> the answer, and put the final answer in </span><code id="A9.I7.i1.I1.i2.p1.1.3" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">\boxed{}</code><span id="A9.I7.i1.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> tag, i.e. $</span><code id="A9.I7.i1.I1.i2.p1.1.5" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">\boxed{}</code><span id="A9.I7.i1.I1.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">{answer here}.</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A9.p5.pic1.2.4" class="ltx_p"><span id="A9.p5.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Your Task:<span id="A9.p5.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
Optimize system prompt 1 to provide clearer, more effective guidance for their corresponding steps. Ensure overall accuracy is maximized, so that the predicted answer can exactly match the true answer.</span></span></span>
<span id="A9.p5.pic1.2.5" class="ltx_p"><span id="A9.p5.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Constraints:<span id="A9.p5.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A9.I8" class="ltx_itemize ltx_leftmargin_flush">
<span id="A9.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I8.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I8.i1.p1.1" class="ltx_p"><span id="A9.I8.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You may perform multiple modifications</span></span>
</span></span>
<span id="A9.I8.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I8.i2.p1" class="ltx_para ltx_noindent">
<span id="A9.I8.i2.p1.1" class="ltx_p"><span id="A9.I8.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Cannot modify content inside angle brackets (e.g., </span><span id="A9.I8.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;system_prompt_1&gt;</span><span id="A9.I8.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></span>
</span></span>
<span id="A9.I8.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I8.i3.p1" class="ltx_para ltx_noindent">
<span id="A9.I8.i3.p1.1" class="ltx_p"><span id="A9.I8.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Final output must contain exactly one system prompt</span></span>
</span></span>
<span id="A9.I8.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I8.i4.p1" class="ltx_para">
<span id="A9.I8.i4.p1.1" class="ltx_p"><span id="A9.I8.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each prompt must be presented in the format: </span><span id="A9.I8.i4.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;system_prompt_x&gt; ... &lt;/system_prompt_x&gt;</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>