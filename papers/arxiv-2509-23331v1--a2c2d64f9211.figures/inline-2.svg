<span id="A9.I2.i1.p1.1" class="ltx_p"><span id="A9.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You may perform multiple modifications</span></span>
</span></span>
<span id="A9.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A9.I2.i2.p1.1" class="ltx_p"><span id="A9.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Cannot modify content inside angle brackets (e.g., </span><span id="A9.I2.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;system_prompt_1&gt;</span><span id="A9.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></span>
</span></span>
<span id="A9.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i3.p1" class="ltx_para ltx_noindent">
<span id="A9.I2.i3.p1.1" class="ltx_p"><span id="A9.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Final output must contain exactly four system prompts</span></span>
</span></span>
<span id="A9.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i4.p1" class="ltx_para">
<span id="A9.I2.i4.p1.1" class="ltx_p"><span id="A9.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each prompt must be presented in the format: </span><span id="A9.I2.i4.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;system_prompt_x&gt; ... &lt;/system_prompt_x&gt;</span></span>
</span></span>
</span>
