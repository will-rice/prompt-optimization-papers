<span id="A9.I1.i6.I1.i2.p1.1" class="ltx_p"><span id="A9.I1.i6.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Output:</span><span id="A9.I1.i6.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The final answer to the question</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A9.p2.pic1.2.4" class="ltx_p"><span id="A9.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Your Task:<span id="A9.p2.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> Optimize ’system prompt 1’, ’system prompt 2’, ’system prompt 3’, and ’system prompt 4’ to provide clearer and more effective guidance for each corresponding step. Maximize the pipeline’s overall accuracy, ensuring the final answer </span>strictly matches<span id="A9.p2.pic1.2.4.1.2" class="ltx_text ltx_font_medium"> the true answer.</span></span></span>
<span id="A9.p2.pic1.2.5" class="ltx_p"><span id="A9.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Constraints:<span id="A9.p2.pic1.2.5.1.1" class="ltx_text"></span></span></span>
