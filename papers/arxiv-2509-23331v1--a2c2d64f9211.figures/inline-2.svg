<span id="A9.I1.i1.I1.i2.p1.1" class="ltx_p"><span id="A9.I1.i1.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Output:</span><span id="A9.I1.i1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A batch of related passages retrieved from the database (first retrieval passages)</span></span>
</span></span>
</span>
</span></span>
