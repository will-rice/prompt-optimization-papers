<span id="A9.I1.i1.p1.1" class="ltx_p"><span id="A9.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">First Retrieval</span></span>
<span id="A9.I1.i1.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:12pt;">
<span id="A9.I1.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I1.i1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I1.i1.I1.i1.p1.1" class="ltx_p"><span id="A9.I1.i1.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Input:</span><span id="A9.I1.i1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> ’question’</span></span>
</span></span>
<span id="A9.I1.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
