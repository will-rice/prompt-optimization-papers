<span id="A9.I1.i6.I1.i1.p1.1" class="ltx_p"><span id="A9.I1.i6.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Input:</span><span id="A9.I1.i6.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> ’question’, ’summary_1’, ’summary_2’, ’system prompt 4’</span></span>
</span></span>
<span id="A9.I1.i6.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
