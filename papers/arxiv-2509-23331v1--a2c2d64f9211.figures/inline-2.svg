<span id="A9.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.81em;">
<span id="A9.p2.pic1.2.1" class="ltx_p"><span id="A9.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your current task is to optimize the system prompt so that it can guide the large language model to produce more accurate, stable, and controllable output in a six-step process.</span></span>
<span id="A9.p2.pic1.2.2" class="ltx_p"><span id="A9.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Goal:<span id="A9.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Given an input question, perform two rounds of retrieval and summary, such that the final generated answer must </span>exactly match<span id="A9.p2.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> the true answer.</span></span></span>
<span id="A9.p2.pic1.2.3" class="ltx_p"><span id="A9.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task Pipeline:<span id="A9.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A9.I1" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A9.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A9.I1.i1.1" class="ltx_text ltx_font_bold">Step 1:</span></span> 
