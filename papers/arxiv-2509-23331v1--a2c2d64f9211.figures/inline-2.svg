<span id="A9.I1.i2.I1.i2.p1.1" class="ltx_p"><span id="A9.I1.i2.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Output:</span><span id="A9.I1.i2.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A concise, coherent summary of the first retrieval passages (summary_1)</span></span>
</span></span>
</span>
