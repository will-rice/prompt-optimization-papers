<span id="A9.I1.i5.I1.i1.p1.1" class="ltx_p"><span id="A9.I1.i5.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Input:</span><span id="A9.I1.i5.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> ’question’, first summary ’context’, second retrieval ’passages’, ’system prompt 3’</span></span>
</span></span>
<span id="A9.I1.i5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I1.i5.I1.i2.p1" class="ltx_para">
<span id="A9.I1.i5.I1.i2.p1.1" class="ltx_p"><span id="A9.I1.i5.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Output:</span><span id="A9.I1.i5.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A concise, coherent summary of the second retrieval passages (summary_2)</span></span>
</span></span>
</span>
</span></span>
<span id="A9.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A9.I1.i6.1" class="ltx_text ltx_font_bold">Step 6:</span></span> 
<span id="A9.I1.i6.p1" class="ltx_para ltx_noindent">
<span id="A9.I1.i6.p1.1" class="ltx_p"><span id="A9.I1.i6.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer Generation</span><span id="A9.I1.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (</span><span id="A9.I1.i6.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;system_prompt_4&gt;&lt;/system_prompt_4&gt;</span><span id="A9.I1.i6.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></span>
