<span id="A9.I1.i4.I1.i2.p1.1" class="ltx_p"><span id="A9.I1.i4.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Output:</span><span id="A9.I1.i4.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Another batch of related passages (second retrieval passages)</span></span>
</span></span>
</span>
</span></span>
<span id="A9.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A9.I1.i5.1" class="ltx_text ltx_font_bold">Step 5:</span></span> 
