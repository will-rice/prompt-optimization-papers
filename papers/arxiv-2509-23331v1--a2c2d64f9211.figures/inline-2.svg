<span id="A9.I1.i3.I1.i1.p1.1" class="ltx_p"><span id="A9.I1.i3.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Input:</span><span id="A9.I1.i3.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> ’question’, ’summary_1’, ’system prompt 2’</span></span>
</span></span>
<span id="A9.I1.i3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I1.i3.I1.i2.p1" class="ltx_para">
<span id="A9.I1.i3.I1.i2.p1.1" class="ltx_p"><span id="A9.I1.i3.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Output:</span><span id="A9.I1.i3.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A query that covers the core semantics of the question for second retrieval</span></span>
</span></span>
</span>
</span></span>
<span id="A9.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A9.I1.i4.1" class="ltx_text ltx_font_bold">Step 4:</span></span> 
<span id="A9.I1.i4.p1" class="ltx_para ltx_noindent">
<span id="A9.I1.i4.p1.1" class="ltx_p"><span id="A9.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Second Retrieval</span></span>
<span id="A9.I1.i4.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:12pt;">
<span id="A9.I1.i4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I1.i4.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I1.i4.I1.i1.p1.1" class="ltx_p"><span id="A9.I1.i4.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Input:</span><span id="A9.I1.i4.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The query from Step 3</span></span>
</span></span>
<span id="A9.I1.i4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
