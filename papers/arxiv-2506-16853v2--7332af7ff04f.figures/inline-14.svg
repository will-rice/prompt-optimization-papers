<span id="A9.F22.pic1.1.10" class="ltx_p"><span id="A9.F22.pic1.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Realistic rendering of <span id="A9.F22.pic1.1.10.1.1" class="ltx_text" style="--ltx-bg-color:#E6E6FF;">forlorn</span> alien snails sharing a sparse meal in a sprawling <span id="A9.F22.pic1.1.10.1.2" class="ltx_text" style="--ltx-bg-color:#E6E6FF;">garbage dump</span>, highly detailed textures, dramatic rim lighting, <span id="A9.F22.pic1.1.10.1.3" class="ltx_text" style="--ltx-bg-color:#E6E6FF;">melancholic</span> mood.  (76.13)</span></span>
