<span id="A9.F22.pic1.1.2" class="ltx_p"><span id="A9.F22.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Painting of group of hungry alien snails homeless at dinner in a garbage dump.  (53.00)</span></span>
