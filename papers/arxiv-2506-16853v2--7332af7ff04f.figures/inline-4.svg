<svg id="A2.F7.pic1" class="ltx_picture ltx_centering" height="491.58" overflow="visible" version="1.1" viewbox="0 0 550 491.58" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,491.58) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#808080;" fill="#808080" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.49 L 0 487.09 C 0 489.57 2.01 491.58 4.49 491.58 L 545.51 491.58 C 547.99 491.58 550 489.57 550 487.09 L 550 4.49 C 550 2.01 547.99 0 545.51 0 L 4.49 0 C 2.01 0 0 2.01 0 4.49 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 4.49 L 0.55 487.09 C 0.55 489.27 2.32 491.03 4.49 491.03 L 545.51 491.03 C 547.68 491.03 549.45 489.27 549.45 487.09 L 549.45 4.49 C 549.45 2.32 547.68 0.55 545.51 0.55 L 4.49 0.55 C 2.32 0.55 0.55 2.32 0.55 4.49 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 13.48)"><foreignobject style="--ltx-fo-width:37.9em;--ltx-fo-height:33.83em;--ltx-fo-depth:0.25em;font-size:10pt;" height="471.54" overflow="visible" transform="matrix(1 0 0 -1 0 468.08)" width="524.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.9em;">
<span id="A2.F7.pic1.1.1" class="ltx_p"><span id="A2.F7.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">As an expert prompt engineer for text-to-image generation, rewrite the original prompt in 8 distinct ways to improve the visual quality of the resulting images.</span></span>
<span id="A2.F7.pic1.1.2" class="ltx_p"><span id="A2.F7.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">To aid you in this task, you will be also given 8 history prompts that are already tried before. For each history prompt, its score is given as number. Higher score indicates that the prompt is better.<span id="A2.F7.pic1.1.2.1.1" class="ltx_text"></span></span></span>
<span id="A2.F7.pic1.1.3" class="ltx_p"><span id="A2.F7.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#CC5400;">(Hint: {<span id="A2.F7.pic1.1.3.1.1" class="ltx_text ltx_font_typewriter">hint</span>})
<span id="A2.F7.pic1.1.3.1.2" class="ltx_text"></span></span></span>
<span id="A2.F7.pic1.1.4" class="ltx_p"><span id="A2.F7.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">You can use the scores to guide your rewriting process and thus improve the visual quality of the generated image, but your response should be different from histories.
<br class="ltx_break">Histories: 
<br class="ltx_break">1. Prompt: {<span id="A2.F7.pic1.1.4.1.1" class="ltx_text ltx_font_typewriter">prompt_1</span>} (Score: {<span id="A2.F7.pic1.1.4.1.2" class="ltx_text ltx_font_typewriter">score_1</span>}) 
<br class="ltx_break">2. Prompt: {<span id="A2.F7.pic1.1.4.1.3" class="ltx_text ltx_font_typewriter">prompt_2</span>} (Score: {<span id="A2.F7.pic1.1.4.1.4" class="ltx_text ltx_font_typewriter">score_2</span>}) 
<br class="ltx_break">(…) 
<br class="ltx_break">8. Prompt: {<span id="A2.F7.pic1.1.4.1.5" class="ltx_text ltx_font_typewriter">prompt_8</span>} (Score: {<span id="A2.F7.pic1.1.4.1.6" class="ltx_text ltx_font_typewriter">score_8</span>})<span id="A2.F7.pic1.1.4.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break">Return exactly 8 variations, numbered 1 through 8, each on its own line and ordered from shortest to longest.</span></span></span>
<span id="A2.F7.pic1.1.5" class="ltx_p"><span id="A2.F7.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Preserve the meaning of the original prompt and keep each variation under 70 words. Start your output immediately with the numbered variations.</span></span>
<span id="A2.F7.pic1.1.6" class="ltx_p"><span id="A2.F7.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original Prompt: {<span id="A2.F7.pic1.1.6.1.1" class="ltx_text ltx_font_typewriter">initial_prompt</span>}</span></span>
</span></span></span></foreignobject></g></g></svg>