<svg id="A1.F6.pic1" class="ltx_picture ltx_centering" height="846.73" overflow="visible" version="1.1" viewbox="0 0 550 846.73" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,846.73) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#808080;" fill="#808080" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.49 L 0 842.24 C 0 844.72 2.01 846.73 4.49 846.73 L 545.51 846.73 C 547.99 846.73 550 844.72 550 842.24 L 550 4.49 C 550 2.01 547.99 0 545.51 0 L 4.49 0 C 2.01 0 0 2.01 0 4.49 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 4.49 L 0.55 842.24 C 0.55 844.42 2.32 846.18 4.49 846.18 L 545.51 846.18 C 547.68 846.18 549.45 844.42 549.45 842.24 L 549.45 4.49 C 549.45 2.32 547.68 0.55 545.51 0.55 L 4.49 0.55 C 2.32 0.55 0.55 2.32 0.55 4.49 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 13.48)"><foreignobject style="--ltx-fo-width:37.9em;--ltx-fo-height:59.5em;--ltx-fo-depth:0.25em;font-size:10pt;" height="826.69" overflow="visible" transform="matrix(1 0 0 -1 0 823.23)" width="524.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.9em;">
<span id="A1.F6.pic1.1.1" class="ltx_p"><span id="A1.F6.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a multimodal large-language model tasked with evaluating images generated by a text-to-image model.</span></span>
<span id="A1.F6.pic1.1.2" class="ltx_p"><span id="A1.F6.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your goal is to assess each generated image based on specific aspects and provide a detailed critique, along with a scoring system.</span></span>
<span id="A1.F6.pic1.1.3" class="ltx_p"><span id="A1.F6.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The final output should be formatted as a JSON object containing individual scores for each aspect and an overall score.</span></span>
<span id="A1.F6.pic1.1.4" class="ltx_p"><span id="A1.F6.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below is a comprehensive guide to follow in your evaluation process:</span></span>
<span id="A1.F6.pic1.1.5" class="ltx_p"><span id="A1.F6.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Key Evaluation Aspects and Scoring Criteria:</span></span>
<span id="A1.F6.pic1.1.6" class="ltx_p"><span id="A1.F6.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each aspect, provide a score from 0 to 100, where 0 represents poor performance and 100 represents excellent performance.</span></span>
<span id="A1.F6.pic1.1.7" class="ltx_p"><span id="A1.F6.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each score, include a short explanation or justification (1-2 sentences) explaining why that score was given.</span></span>
<span id="A1.F6.pic1.1.8" class="ltx_p"><span id="A1.F6.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">The aspects to evaluate are as follows:</span></span>
<span id="A1.F6.pic1.1.9" class="ltx_p"><span id="A1.F6.pic1.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">a) Accuracy to Prompt</span></span>
<span id="A1.F6.pic1.1.10" class="ltx_p"><span id="A1.F6.pic1.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Assess how well the image matches the description given in the prompt.</span></span>
<span id="A1.F6.pic1.1.11" class="ltx_p"><span id="A1.F6.pic1.1.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider whether all requested elements are present and if the scene, objects, and setting align accurately with the text.</span></span>
<span id="A1.F6.pic1.1.12" class="ltx_p"><span id="A1.F6.pic1.1.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score: 0 (no alignment) to 100 (perfect match to prompt).</span></span>
<span id="A1.F6.pic1.1.13" class="ltx_p"><span id="A1.F6.pic1.1.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Creativity and Originality</span></span>
<span id="A1.F6.pic1.1.14" class="ltx_p"><span id="A1.F6.pic1.1.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluate the uniqueness and creativity of the generated image.</span></span>
<span id="A1.F6.pic1.1.15" class="ltx_p"><span id="A1.F6.pic1.1.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the model present an imaginative or aesthetically engaging interpretation of the prompt?</span></span>
<span id="A1.F6.pic1.1.16" class="ltx_p"><span id="A1.F6.pic1.1.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">Is there any evidence of creativity beyond a literal interpretation?</span></span>
<span id="A1.F6.pic1.1.17" class="ltx_p"><span id="A1.F6.pic1.1.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score: 0 (lacks creativity) to 100 (highly creative and original).</span></span>
<span id="A1.F6.pic1.1.18" class="ltx_p"><span id="A1.F6.pic1.1.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">c) Visual Quality and Realism</span></span>
<span id="A1.F6.pic1.1.19" class="ltx_p"><span id="A1.F6.pic1.1.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">Assess the overall visual quality, including resolution, detail, and realism.</span></span>
<span id="A1.F6.pic1.1.20" class="ltx_p"><span id="A1.F6.pic1.1.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">Look for coherence in lighting, shading, and perspective.</span></span>
<span id="A1.F6.pic1.1.21" class="ltx_p"><span id="A1.F6.pic1.1.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">Even if the image is stylized or abstract, judge whether the visual elements are well-rendered and visually appealing.</span></span>
<span id="A1.F6.pic1.1.22" class="ltx_p"><span id="A1.F6.pic1.1.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score: 0 (poor quality) to 100 (high-quality and realistic).</span></span>
<span id="A1.F6.pic1.1.23" class="ltx_p"><span id="A1.F6.pic1.1.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">d) Consistency and Cohesion</span></span>
<span id="A1.F6.pic1.1.24" class="ltx_p"><span id="A1.F6.pic1.1.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">Check for internal consistency within the image.</span></span>
<span id="A1.F6.pic1.1.25" class="ltx_p"><span id="A1.F6.pic1.1.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">Are all elements cohesive and aligned with the prompt?</span></span>
<span id="A1.F6.pic1.1.26" class="ltx_p"><span id="A1.F6.pic1.1.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">For instance, does the perspective make sense, and do objects fit naturally within the scene without visual anomalies?</span></span>
<span id="A1.F6.pic1.1.27" class="ltx_p"><span id="A1.F6.pic1.1.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score: 0 (inconsistent) to 100 (fully cohesive and consistent).</span></span>
<span id="A1.F6.pic1.1.28" class="ltx_p"><span id="A1.F6.pic1.1.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">e) Emotional or Thematic Resonance</span></span>
<span id="A1.F6.pic1.1.29" class="ltx_p"><span id="A1.F6.pic1.1.29.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluate how well the image evokes the intended emotional or thematic tone of the prompt.</span></span>
<span id="A1.F6.pic1.1.30" class="ltx_p"><span id="A1.F6.pic1.1.30.1" class="ltx_text" style="--ltx-fg-color:#000000;">For example, if the prompt is meant to be serene, does the image convey calmness?</span></span>
<span id="A1.F6.pic1.1.31" class="ltx_p"><span id="A1.F6.pic1.1.31.1" class="ltx_text" style="--ltx-fg-color:#000000;">If it’s adventurous, does it evoke excitement?</span></span>
<span id="A1.F6.pic1.1.32" class="ltx_p"><span id="A1.F6.pic1.1.32.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score: 0 (no resonance) to 100 (strong resonance with the prompt’s theme).</span></span>
<span id="A1.F6.pic1.1.33" class="ltx_p"><span id="A1.F6.pic1.1.33.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Overall Score</span></span>
<span id="A1.F6.pic1.1.34" class="ltx_p"><span id="A1.F6.pic1.1.34.1" class="ltx_text" style="--ltx-fg-color:#000000;">After scoring each aspect individually, provide an overall score, representing the model’s general performance on this image.</span></span>
<span id="A1.F6.pic1.1.35" class="ltx_p"><span id="A1.F6.pic1.1.35.1" class="ltx_text" style="--ltx-fg-color:#000000;">This should be a weighted average based on the importance of each aspect to the prompt or an average of all aspects.Now grade the image based on the above criteria.</span></span>
<span id="A1.F6.pic1.1.36" class="ltx_p"><span id="A1.F6.pic1.1.36.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below is the prompt:</span></span>
<span id="A1.F6.pic1.1.37" class="ltx_p"><span id="A1.F6.pic1.1.37.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prompt: {<span id="A1.F6.pic1.1.37.1.1" class="ltx_text ltx_font_typewriter">prompt</span>}</span></span>
</span></span></span></foreignobject></g></g></svg>