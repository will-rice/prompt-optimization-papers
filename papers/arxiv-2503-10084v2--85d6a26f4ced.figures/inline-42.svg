<span id="lstnumberx18" class="ltx_listingline"><span id="lstnumberx18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">‘‘‘</span><span id="lstnumberx18.2" class="ltx_text ltx_lst_identifier ltx_font_typewriter" style="--ltx-fg-color:#000000;">json</span>
</span>
<span id="lstnumberx19" class="ltx_listingline"><span id="lstnumberx19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{’</span><span id="lstnumberx19.2" class="ltx_text ltx_lst_identifier ltx_font_typewriter" style="--ltx-fg-color:#000000;">Result</span><span id="lstnumberx19.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">’:</span><span id="lstnumberx19.4" class="ltx_text ltx_lst_space ltx_font_typewriter" style="--ltx-fg-color:#000000;"> </span><span id="lstnumberx19.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">9}</span>
