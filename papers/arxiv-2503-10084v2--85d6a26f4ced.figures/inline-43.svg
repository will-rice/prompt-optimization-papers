<span id="A5.T9.pic1.1.6.1.1.1.8" class="ltx_p"><span id="A5.T9.pic1.1.6.1.1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Finally, we will format this into a dictionary with the key ‘Result’.</span></span>
