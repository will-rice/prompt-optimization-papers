</span>
<span id="lstnumberx28" class="ltx_listingline"><span id="lstnumberx28.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{’</span><span id="lstnumberx28.2" class="ltx_text ltx_lst_identifier ltx_font_typewriter" style="--ltx-fg-color:#000000;">Result</span><span id="lstnumberx28.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">’:</span><span id="lstnumberx28.4" class="ltx_text ltx_lst_space ltx_font_typewriter" style="--ltx-fg-color:#000000;"> </span><span id="lstnumberx28.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">’</span><span id="lstnumberx28.6" class="ltx_text ltx_lst_identifier ltx_font_typewriter" style="--ltx-fg-color:#000000;">evxdkhmivkbgfo</span><span id="lstnumberx28.7" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">’}</span>
