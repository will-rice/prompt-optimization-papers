<span id="A5.F12.p3.pic1.2.1" class="ltx_p"><span id="A5.F12.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reverse the list following the steps below:</span></span>
<span id="A5.I7" class="ltx_enumerate">
<span id="A5.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
