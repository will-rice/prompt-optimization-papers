<span id="A5.I7.i2.I1.i2.p1.1" class="ltx_p"><span id="A5.I7.i2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Add this letter to the beginning of ‘reversed’</span></span>
</span></span>
<span id="A5.I7.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
