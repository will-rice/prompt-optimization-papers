<span id="A5.I7.i1.p1.1" class="ltx_p"><span id="A5.I7.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Create an empty string ‘reversed’</span></span>
</span></span>
<span id="A5.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
