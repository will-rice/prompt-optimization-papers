<span id="A5.I7.i2.I1.i1.p1.1" class="ltx_p"><span id="A5.I7.i2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Remove the first (leftmost) letter</span></span>
