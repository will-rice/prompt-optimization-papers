<span id="S7.SS3.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.66em;">
<span id="S7.SS3.p7.pic1.1.1" class="ltx_p"><span id="S7.SS3.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ3.<span id="S7.SS3.p7.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
Prompt evolution improves PoC exploit generation but introduces additional monetary and runtime overhead.
In our proposed setting, <span id="S7.SS3.p7.pic1.1.1.1.1.1" class="ltx_text ltx_font_smallcaps">PoCEvolve</span> (LLM) achieves success rates of 28.4% and 85.3% with GPT-4o-mini and Qwen3.7-Plus, at average costs of $0.0292 and $0.1214 and runtimes of 5 minutes and 52 seconds and 44 minutes and 40 seconds per evaluated vulnerability, respectively.
The full <span id="S7.SS3.p7.pic1.1.1.1.1.2" class="ltx_text ltx_font_smallcaps">PoCEvolve</span> achieves success rates of 58.4% and 79.5%, at average costs of $0.0895 and $0.2492 and runtimes of 26 minutes and 19 seconds and 52 minutes and 54 seconds, respectively.
When provided with detailed vulnerability reports, the full <span id="S7.SS3.p7.pic1.1.1.1.1.3" class="ltx_text ltx_font_smallcaps">PoCEvolve</span> improves over <span id="S7.SS3.p7.pic1.1.1.1.1.4" class="ltx_text ltx_font_smallcaps">PoCGen</span> by 11.1%, at $0.0830 and 21 minutes and 43 seconds per evaluated vulnerability.</span></span></span>
</span></span></span></foreignobject></g></g></svg>