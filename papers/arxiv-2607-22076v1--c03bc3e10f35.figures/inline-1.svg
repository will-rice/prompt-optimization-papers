<span id="S7.SS1.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.66em;">
<span id="S7.SS1.p7.pic1.1.1" class="ltx_p"><span id="S7.SS1.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ1.<span id="S7.SS1.p7.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
<span id="S7.SS1.p7.pic1.1.1.1.1.1" class="ltx_text ltx_font_smallcaps">PoCEvolve</span> successfully generates PoC exploits from vulnerability-fixing commits and improves both evaluated Exploit Generators.
With GPT-4o-mini, <span id="S7.SS1.p7.pic1.1.1.1.1.2" class="ltx_text ltx_font_smallcaps">PoCEvolve</span> (LLM) improves over direct LLM prompting by 45.9%, while the full <span id="S7.SS1.p7.pic1.1.1.1.1.3" class="ltx_text ltx_font_smallcaps">PoCEvolve</span> improves over <span id="S7.SS1.p7.pic1.1.1.1.1.4" class="ltx_text ltx_font_smallcaps">PoCGen</span> by 20.7%.
With Qwen3.7-Plus, <span id="S7.SS1.p7.pic1.1.1.1.1.5" class="ltx_text ltx_font_smallcaps">PoCEvolve</span> (LLM) improves over direct LLM prompting by 9.5%, while the full <span id="S7.SS1.p7.pic1.1.1.1.1.6" class="ltx_text ltx_font_smallcaps">PoCEvolve</span> improves over <span id="S7.SS1.p7.pic1.1.1.1.1.7" class="ltx_text ltx_font_smallcaps">PoCGen</span> by 23.8%.
These findings establish patch-only exploit generation as a feasible and practically important evaluation setting and demonstrate that the benefits of prompt evolution generalize across different underlying LLMs and Exploit Generators.</span></span></span>
</span></span></span></foreignobject></g></g></svg>