<span id="S7.SS2.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.66em;">
<span id="S7.SS2.p5.pic1.1.1" class="ltx_p"><span id="S7.SS2.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ2.<span id="S7.SS2.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
When vulnerability reports are available,
<span id="S7.SS2.p5.pic1.1.1.1.1.1" class="ltx_text ltx_font_smallcaps">PoCEvolve</span> increases the PoC exploit generation success rate from 64.6% to 71.7%, which is an improvement of 11.1% over <span id="S7.SS2.p5.pic1.1.1.1.1.2" class="ltx_text ltx_font_smallcaps">PoCGen</span>.
These results demonstrate that prompt evolution improves PoC exploit generation beyond the proposed setting.</span></span></span>
</span></span></span></foreignobject></g></g></svg>