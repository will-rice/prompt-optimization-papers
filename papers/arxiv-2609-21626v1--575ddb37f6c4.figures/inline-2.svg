<span id="A4.F5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.57em;">
<span id="A4.F5.pic1.1.1" class="ltx_p"><span id="A4.F5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Initial extraction prompt (abridged)
<br class="ltx_break"></span></span>
<span id="A4.F5.pic1.1.2" class="ltx_p"><span id="A4.F5.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert analyst tasked with extracting the current user’s project names and tasks. Read the provided enterprise artifacts and output exactly one valid JSON object that matches the schema below. Output JSON only.
<br class="ltx_break">
<br class="ltx_break">## Objectives
<br class="ltx_break">- Identify projects the user actively works on and extract relevant tasks.
<br class="ltx_break">- Preserve exact project names from the artifacts.
<br class="ltx_break">- Rank projects by relevance based on ownership, urgency, recency, and leadership signals.
<br class="ltx_break">
<br class="ltx_break">## Citing Sources
<br class="ltx_break">- Cite evidence using <span id="A4.F5.pic1.1.2.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{cursor}<math id="A4.F5.pic1.m1" class="ltx_Math" alttext="\dagger" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#0000FF;" mathcolor="#0000FF">†</mo><annotation encoding="application/x-tex">\dagger</annotation></semantics></math>L{line_start}(-L{line_end})?</span>.
<br class="ltx_break">- Include at least one citation for every project and task.
<br class="ltx_break">
<br class="ltx_break">## Project Identity Gate
<br class="ltx_break">Tier-A: user involvement plus stable identity in <math id="A4.F5.pic1.m2" class="ltx_Math" alttext="\geq" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><annotation encoding="application/x-tex">\geq</annotation></semantics></math>2 artifacts within 30 days.
<br class="ltx_break">Tier-B: one strong anchor authored/owned by the user within 14 days plus one weak corroborator.
<br class="ltx_break">
<br class="ltx_break">## JSON Output Contract
<br class="ltx_break">- Return exactly one JSON object; double-quoted keys/values; no trailing commas; no markdown.
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>