<span id="A1.F4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.57em;">
<span id="A1.F4.pic1.1.1" class="ltx_p"><span id="A1.F4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Persona expansion prompt
<br class="ltx_break"></span></span>
<span id="A1.F4.pic1.1.2" class="ltx_p"><span id="A1.F4.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a senior HR analyst. Given an O*NET role descriptor below, expand it into a concrete enterprise persona JSON with the following keys: role, seniority, primary_objectives (list), document_distribution (list of {type, share}), and preferences (3-6 declarative statements about which extracted artifacts the persona considers useful or noisy). Keep preferences <em id="A1.F4.pic1.1.2.1.1" class="ltx_emph ltx_font_italic">actionable and falsifiable</em>; avoid generic statements.
<br class="ltx_break"></span></span>
<span id="A1.F4.pic1.1.3" class="ltx_p"><span id="A1.F4.pic1.1.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">O*NET descriptor:
<br class="ltx_break"><span id="A1.F4.pic1.1.3.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">{onet_role_json}
<br class="ltx_break"></span></span></span>
<span id="A1.F4.pic1.1.4" class="ltx_p"><span id="A1.F4.pic1.1.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Return one JSON object only.
</span></span>
</span></span></span></foreignobject></g></g></svg>