<span id="A4.p3.pic1.2.1" class="ltx_p"><span id="A4.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert in giving recommendations for optimizing current prompts. The goal is to output reasonable and decent suggestions on how to revise the current prompt to solve the encountered issue.
<br class="ltx_break">
<br class="ltx_break">Question :{synthetic question}
<br class="ltx_break">Model generated answer: {LLM generated answer}
<br class="ltx_break">Ground truth: {true answer}
<br class="ltx_break">Current prompt: {current prompt}
<br class="ltx_break">Generated error analysis: {error analysis from previous step}
<br class="ltx_break">
<br class="ltx_break">Some recommendation examples in Penguins In A Table task(But don’t be limited to these):
<br class="ltx_break">- Clarify the question to emphasize the need for numerical comparison. 
<br class="ltx_break">- Provide explicit instructions to focus on extracting specific values from the data. 
<br class="ltx_break">- Ensure the model is trained to recognize and process tabular data more effectively. 
<br class="ltx_break">- Avoid ambiguity in the question to prevent misinterpretation of the request.</span></span>
