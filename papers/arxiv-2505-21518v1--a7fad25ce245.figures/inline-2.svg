<span id="S3.F6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.91em;">
<span id="S3.F6.pic1.1.1" class="ltx_p"><math id="S3.F6.pic1.m1" class="ltx_Math" alttext="\#" display="inline" intent=":literal"><semantics><mi>#</mi><annotation encoding="application/x-tex">\#</annotation></semantics></math><span id="S3.F6.pic1.1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> <span id="S3.F6.pic1.1.1.1.1" class="ltx_text ltx_font_bold">Previous instruction</span> <math id="S3.F6.pic1.m2" class="ltx_Math" alttext="\left(\phi_{m}\right)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><annotation encoding="application/x-tex">\left(\phi_{m}\right)</annotation></semantics></math>
<br class="ltx_break">Base Station (BS): Controls user equipment (UE) communications. 
<br class="ltx_break">UEs: Choose one of these actions: Action 0 (wait), 1 (transmit), or 2 (delete). 
<br class="ltx_break">Prevent collision, packet loss.
Please provide answers in the format ‘UE <math id="S3.F6.pic1.m3" class="ltx_Math" alttext="\#" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="1.250em">#</mi><annotation encoding="application/x-tex">\#</annotation></semantics></math>: Action <math id="S3.F6.pic1.m4" class="ltx_Math" alttext="\#" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="1.250em">#</mi><annotation encoding="application/x-tex">\#</annotation></semantics></math>’. 
<br class="ltx_break"></span></span>
<span id="S3.F6.pic1.1.2" class="ltx_p"><math id="S3.F6.pic1.m5" class="ltx_Math" alttext="\#" display="inline" intent=":literal"><semantics><mi>#</mi><annotation encoding="application/x-tex">\#</annotation></semantics></math><span id="S3.F6.pic1.1.2.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> <span id="S3.F6.pic1.1.2.1.1" class="ltx_text ltx_font_bold">Feedback</span>
<math id="S3.F6.pic1.m6" class="ltx_Math" alttext="\left(\frac{\partial\mathcal{L}^{\text{TG}}}{\partial\phi_{m}}\right)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><msup><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℒ</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">TG</mtext></msup></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∂</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></msub></mrow></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><annotation encoding="application/x-tex">\left(\frac{\partial\mathcal{L}^{\text{TG}}}{\partial\phi_{m}}\right)</annotation></semantics></math>
<br class="ltx_break">The system prompt should explicitly state the following key rules to align with the objective function: 
<br class="ltx_break">1. Only one UE should transmit at a time to avoid collisions. 
<br class="ltx_break">2. UEs must delete packets that have already been successfully decoded by the BS. 
<br class="ltx_break">3. UEs should not delete packets that have not been decoded. 
<br class="ltx_break">4. Avoid waiting or transmitting packets that have already been decoded, as this wastes time.
<br class="ltx_break">Adding these constraints will help the language model consistently optimize for successful, efficient packet transmissions while avoiding unnecessary actions.
<br class="ltx_break"></span></span>
<span id="S3.F6.pic1.1.3" class="ltx_p"><math id="S3.F6.pic1.m7" class="ltx_Math" alttext="\#" display="inline" intent=":literal"><semantics><mi>#</mi><annotation encoding="application/x-tex">\#</annotation></semantics></math><span id="S3.F6.pic1.1.3.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> <span id="S3.F6.pic1.1.3.1.1" class="ltx_text ltx_font_bold">Updated instruction</span> <math id="S3.F6.pic1.m8" class="ltx_Math" alttext="\left(\phi_{m+1}\right)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><annotation encoding="application/x-tex">\left(\phi_{m+1}\right)</annotation></semantics></math>
<br class="ltx_break">Updated instruction is <math id="S3.F6.pic1.m9" class="ltx_Math" alttext="\mathbf{\#}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="1.250em">#</mi><annotation encoding="application/x-tex">\mathbf{\#}</annotation></semantics></math><span id="S3.F6.pic1.1.3.1.2" class="ltx_text ltx_font_bold"> Instruction</span> (<math id="S3.F6.pic1.m10" class="ltx_Math" alttext="\phi" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><annotation encoding="application/x-tex">\phi</annotation></semantics></math>) in Fig. <a href="#S3.F5" title="Fig. 5 ‣ III-A TPM Construction and Operation ‣ III TPM: Token-based Protocol Model ‣ Resilient LLM-Empowered Semantic MAC Protocols via Zero-Shot Adaptation and Knowledge Distillation" class="ltx_ref"><span class="ltx_text ltx_ref_tag">5</span></a>.</span></span>
</span></span></span></foreignobject></g></g></svg>