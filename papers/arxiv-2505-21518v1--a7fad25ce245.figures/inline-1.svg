<span id="S3.F5.pic1.1.1" class="ltx_p"><math id="S3.F5.pic1.m1" class="ltx_Math" alttext="\mathbf{\#}" display="inline" intent=":literal"><semantics><mi>#</mi><annotation encoding="application/x-tex">\mathbf{\#}</annotation></semantics></math><span id="S3.F5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;"> Instruction<span id="S3.F5.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> (<math id="S3.F5.pic1.m2" class="ltx_Math" alttext="\phi" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><annotation encoding="application/x-tex">\phi</annotation></semantics></math>)
<br class="ltx_break">Base Station (BS): Controls user equipment (UE) communications.
<br class="ltx_break">UEs: Choose one of the following actions: Action 0 (wait), Action 1 (transmit), or Action 2 (delete).
<br class="ltx_break">Rules:
<br class="ltx_break">- Only one UE should transmit at a time to avoid collisions.
<br class="ltx_break">- UEs must delete packets that have already been successfully decoded by the BS.
<br class="ltx_break">- UEs should not delete packets that have not been decoded.
<br class="ltx_break">- Avoid transmitting or waiting on packets that have already been decoded, as this wastes time.
<br class="ltx_break">- Prevent collisions and packet loss by following these rules.
<br class="ltx_break">Provide answers in the format: ‘UE <math id="S3.F5.pic1.m3" class="ltx_Math" alttext="\#" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="1.250em" mathvariant="normal">#</mi><annotation encoding="application/x-tex">\#</annotation></semantics></math>: Action <math id="S3.F5.pic1.m4" class="ltx_Math" alttext="\#" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="1.250em" mathvariant="normal">#</mi><annotation encoding="application/x-tex">\#</annotation></semantics></math>’.
<br class="ltx_break"></span></span></span>
<span id="S3.F5.pic1.1.2" class="ltx_p"><math id="S3.F5.pic1.m5" class="ltx_Math" alttext="\mathbf{\#}" display="inline" intent=":literal"><semantics><mi>#</mi><annotation encoding="application/x-tex">\mathbf{\#}</annotation></semantics></math><span id="S3.F5.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;"> Query<span id="S3.F5.pic1.1.2.1.1" class="ltx_text ltx_font_medium"> (<math id="S3.F5.pic1.m6" class="ltx_Math" alttext="u_{n,1}^{t},u_{n,2}^{t}" display="inline" intent=":literal"><semantics><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msubsup></mrow><annotation encoding="application/x-tex">u_{n,1}^{t},u_{n,2}^{t}</annotation></semantics></math>,<math id="S3.F5.pic1.m7" class="ltx_Math" alttext="u_{n,3}^{t}" display="inline" intent=":literal"><semantics><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msubsup><annotation encoding="application/x-tex">u_{n,3}^{t}</annotation></semantics></math>,<math id="S3.F5.pic1.m8" class="ltx_Math" alttext="u_{n,0}^{t}" display="inline" intent=":literal"><semantics><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msubsup><annotation encoding="application/x-tex">u_{n,0}^{t}</annotation></semantics></math>)
<br class="ltx_break">UE 1 has 2 packets in the buffer.
<br class="ltx_break">UE 2 has 1 packet in the buffer.
<br class="ltx_break">UE 3 has 1 packet in the buffer.
<br class="ltx_break">BS successfully decoded Agent 2’s packet. 
<br class="ltx_break">Which action should each UE choose right now? 
<br class="ltx_break"></span></span></span>
<span id="S3.F5.pic1.1.3" class="ltx_p"><math id="S3.F5.pic1.m9" class="ltx_Math" alttext="\mathbf{\#}" display="inline" intent=":literal"><semantics><mi>#</mi><annotation encoding="application/x-tex">\mathbf{\#}</annotation></semantics></math><span id="S3.F5.pic1.1.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;"> Answer<span id="S3.F5.pic1.1.3.1.1" class="ltx_text ltx_font_medium"> (<math id="S3.F5.pic1.m10" class="ltx_Math" alttext="d_{n,1}^{t},d_{n,2}^{t}" display="inline" intent=":literal"><semantics><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msubsup></mrow><annotation encoding="application/x-tex">d_{n,1}^{t},d_{n,2}^{t}</annotation></semantics></math>,<math id="S3.F5.pic1.m11" class="ltx_Math" alttext="d_{n,3}^{t}" display="inline" intent=":literal"><semantics><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msubsup><annotation encoding="application/x-tex">d_{n,3}^{t}</annotation></semantics></math>) 
<br class="ltx_break">UE 1: Action 1
