<span id="A3.SS2.SSS4.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.26em;">
<span id="A3.SS2.SSS4.p3.pic1.1.1" class="ltx_p"><span id="A3.SS2.SSS4.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Guidance generation prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.21 14.9)"><foreignobject style="--ltx-fo-width:43em;--ltx-fo-height:33.01em;--ltx-fo-depth:0.25em;font-size:10pt;" height="460.24" overflow="visible" transform="matrix(1 0 0 -1 0 456.78)" width="595"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS2.SSS4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43em;">
<span id="A3.SS2.SSS4.p3.pic1.2.1" class="ltx_p"><span id="A3.SS2.SSS4.p3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert at improving language model performance on relation extraction with binary yes/no inference. 
<br class="ltx_break">
<br class="ltx_break">I have identified the following recurring error categories from model failures. Use them to revise the current instruction prompt so the model can avoid these mistakes. 
<br class="ltx_break">
<br class="ltx_break">## Current Instruction Prompt 
<br class="ltx_break">
<br class="ltx_break"><code id="A3.SS2.SSS4.p3.pic1.2.1.1.1" class="ltx_verbatim">```</code>text 
<br class="ltx_break">#CURRENT_INSTRUCTION_PROMPT# 
<br class="ltx_break"><code id="A3.SS2.SSS4.p3.pic1.2.1.1.2" class="ltx_verbatim">```</code> 
<br class="ltx_break">
<br class="ltx_break">## Error Categories 
<br class="ltx_break">
<br class="ltx_break"><code id="A3.SS2.SSS4.p3.pic1.2.1.1.3" class="ltx_verbatim">```</code>text 
<br class="ltx_break">#ERROR_CATEGORIES_TEXT# 
<br class="ltx_break"><code id="A3.SS2.SSS4.p3.pic1.2.1.1.4" class="ltx_verbatim">```</code> 
<br class="ltx_break">
<br class="ltx_break">## Your Task 
<br class="ltx_break">
<br class="ltx_break">Generate a revised instruction prompt that: 
<br class="ltx_break">1. Addresses each failure category with specific, actionable advice 
<br class="ltx_break">2. Improves and generalizes binary relation extraction decisions 
<br class="ltx_break">
<br class="ltx_break">## Critical Constraints 
<br class="ltx_break">
<br class="ltx_break">- Do not revise the instruction in a way that requires step-by-step reasoning or explanatory output; the task should remain direct binary yes/no inference. 
<br class="ltx_break">- Preserve compatibility with the existing prompt structure where the answer instruction and input template are appended separately. 
<br class="ltx_break">- The goal is ACCURACY, not caution. Never generate guidance that encourages the model to refuse, abstain, or say ‘‘not specified’’ when an answer can be provided. 
<br class="ltx_break">
<br class="ltx_break">## Output Format 
<br class="ltx_break">
<br class="ltx_break">Return a JSON object with: 
<br class="ltx_break">{ 
<br class="ltx_break">‘‘revised_instruction_prompt’’: ‘‘the revised instruction prompt text’’ 
<br class="ltx_break">} 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>