<span id="A3.SS3.SSS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43em;">
<span id="A3.SS3.SSS4.p2.pic1.2.1" class="ltx_p"><span id="A3.SS3.SSS4.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are given a relation name, its description, an example sentence, and a query. Analyze the relation and query for consistency and check whether the relation is clearly instantiated between the labeled Subject and Object. Analyze the relation definition, semantic roles and types of entities, and the direction of the relation. Determine whether the evidence is strongly mentioned or clearly implied. Use the support sentence only as a template for the relation. Do not consider external or unrelated information. Ensure the relation direction is strictly from Subject to Object, that the entities correctly match the required semantic roles, and that the evidence is strongly mentioned or strongly expressed. Answer ’yes’ only if the relation is explicitly mentioned or strongly expressed between the Subject and Object in the query; otherwise, answer ’no’. 
