<span id="A3.SS2.SSS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.26em;">
<span id="A3.SS2.SSS1.p1.pic1.1.1" class="ltx_p"><span id="A3.SS2.SSS1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Replacement generation prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.21 11.44)"><foreignobject style="--ltx-fo-width:43em;--ltx-fo-height:45.01em;--ltx-fo-depth:0em;font-size:10pt;" height="622.83" overflow="visible" transform="matrix(1 0 0 -1 0 622.83)" width="595"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS2.SSS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43em;">
<span id="A3.SS2.SSS1.p1.pic1.2.1" class="ltx_p"><span id="A3.SS2.SSS1.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert on suggesting replacements for targeted spans in a prompt. 
<br class="ltx_break">
<br class="ltx_break">The editable spans are marked using tags such as &lt;span_1&gt;...&lt;/span_1&gt;, &lt;span_2&gt;...&lt;/span_2&gt;, and so on. 
<br class="ltx_break">
<br class="ltx_break">Input Prompt with editable spans: 
<br class="ltx_break"><code id="A3.SS2.SSS1.p1.pic1.2.1.1.1" class="ltx_verbatim">```</code> 
<br class="ltx_break">#MARKED_PROMPT# 
<br class="ltx_break"><code id="A3.SS2.SSS1.p1.pic1.2.1.1.2" class="ltx_verbatim">```</code> 
<br class="ltx_break">
<br class="ltx_break">Editable spans: 
<br class="ltx_break">#REGION_CANDIDATE_REQUEST_BLOCKS# 
<br class="ltx_break">
<br class="ltx_break">Task: 
<br class="ltx_break">Suggest #NUM_CANDIDATES# replacements for each editable span so that every replacement fits naturally in context. 
<br class="ltx_break">
<br class="ltx_break">Rules: 
<br class="ltx_break">- Preserve the meaning and role of each editable span 
<br class="ltx_break">- Treat each tagged span as a single unit 
<br class="ltx_break">- Return replacements only for the editable spans 
<br class="ltx_break">- A candidate may be identical to the original span text if keeping it unchanged is the best option 
<br class="ltx_break">
<br class="ltx_break">Please reason through the problem, but output the replacements in JSON: 
<br class="ltx_break"><code id="A3.SS2.SSS1.p1.pic1.2.1.1.3" class="ltx_verbatim">```</code>json 
<br class="ltx_break">{ 
<br class="ltx_break">‘‘span_1’’: { 
<br class="ltx_break">‘‘candidates’’: [ 
<br class="ltx_break">‘‘replacement 1’’, 
<br class="ltx_break">‘‘...’’, 
<br class="ltx_break">‘‘replacement #NUM_CANDIDATES#’’ 
<br class="ltx_break">] 
<br class="ltx_break">}, 
<br class="ltx_break">... 
<br class="ltx_break">‘‘span_#NUM_REGIONS#’’: { 
<br class="ltx_break">‘‘candidates’’: [ 
<br class="ltx_break">‘‘replacement 1’’, 
<br class="ltx_break">‘‘...’’, 
<br class="ltx_break">‘‘replacement #NUM_CANDIDATES#’’ 
<br class="ltx_break">] 
<br class="ltx_break">} 
<br class="ltx_break">} 
<br class="ltx_break"><code id="A3.SS2.SSS1.p1.pic1.2.1.1.4" class="ltx_verbatim">```</code> 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>