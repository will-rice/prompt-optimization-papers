<span id="A3.SS2.SSS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43em;">
<span id="A3.SS2.SSS2.p1.pic1.2.1" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">A relation extraction prompt helps an LLM decide whether a query sentence expresses a target relation between the subject and object entities, using a support sentence for that relation. The classifier must answer with exactly one token: ‘‘yes’’ or ‘‘no’’. 
<br class="ltx_break">
<br class="ltx_break">Current prompt: 
<br class="ltx_break"><code id="A3.SS2.SSS2.p1.pic1.2.1.1.1" class="ltx_verbatim">```</code> 
<br class="ltx_break">#INFERENCE_PROMPT# 
<br class="ltx_break"><code id="A3.SS2.SSS2.p1.pic1.2.1.1.2" class="ltx_verbatim">```</code> 
<br class="ltx_break">
<br class="ltx_break">Feedback examples from the current prompt: 
<br class="ltx_break">#FEEDBACK_EXAMPLES# 
<br class="ltx_break">
<br class="ltx_break">First, think about the issues with the prompt. 
<br class="ltx_break">Identify the scope of tokens within the prompt where edits should take place. 
<br class="ltx_break">Prompt edits include adding, deleting or modifying tokens. 
<br class="ltx_break">Mark the scope of the prompt that needs editing by putting &lt;edit&gt;, &lt;/edit&gt; tags. 
<br class="ltx_break">You can have multiple &lt;edit&gt; tags and each &lt;edit&gt; tag should not entail more than #MAX_WORDS_PER_EDIT_TAG# words. 
<br class="ltx_break">Use at most #MAX_EDIT_TAGS# &lt;edit&gt; tags. 
<br class="ltx_break">Do not cover the whole sentence with multiple &lt;edit&gt; tags. 
<br class="ltx_break">
<br class="ltx_break">Reply with the full prompt enclosed within &lt;p&gt; and &lt;/p&gt; tags, with the edit locations marked using &lt;edit&gt; and &lt;/edit&gt; tags. 
<br class="ltx_break">Do not include any other text. 
<br class="ltx_break"></span></span>
