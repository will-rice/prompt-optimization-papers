<span id="A3.SS2.SSS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43em;">
<span id="A3.SS2.SSS3.p1.pic1.2.1" class="ltx_p"><span id="A3.SS2.SSS3.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are optimizing an instruction prompt for a binary relation extraction classifier. 
<br class="ltx_break">
<br class="ltx_break">The instruction prompt will appear before the classifier input. 
<br class="ltx_break">Later, the classifier will receive an input similar to the following example and must decide whether the target relation is expressed between the Subject and Object entities in the query sentence. 
<br class="ltx_break">
<br class="ltx_break">The classifier must answer with exactly one token: ‘‘yes’’ or ‘‘no’’. 
<br class="ltx_break">
<br class="ltx_break">Example classifier input: 
<br class="ltx_break">
<br class="ltx_break">Relation name: #RELATION# (#RELATION_DESCRIPTION#) 
<br class="ltx_break">Support Sentence: #SUPPORT_SENTENCE# 
<br class="ltx_break">Query Sentence: #QUERY_SENTENCE# 
<br class="ltx_break">
<br class="ltx_break">Write a instruction prompt that should appear before this type of input and help the classifier solve the relation extraction problem. 
<br class="ltx_break">
<br class="ltx_break">Instruction: 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>