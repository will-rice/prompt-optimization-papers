</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.21 14.52)"><foreignobject style="--ltx-fo-width:45.15em;--ltx-fo-height:9.01em;--ltx-fo-depth:0.22em;font-size:10pt;" height="127.76" overflow="visible" transform="matrix(1 0 0 -1 0 124.69)" width="624.75"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.15em;">
<span id="A3.SS1.p1.pic1.2.1" class="ltx_p"><span id="A3.SS1.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are given a relation name, a description of the relation in brackets, a support sentence exemplifying the relation, and a query sentence.
<br class="ltx_break"></span></span>
<span id="A3.SS1.p1.pic1.2.2" class="ltx_p"><span id="A3.SS1.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">A relation connects the Subject and the Object entities. The Subject and the Object entities are indicated with the subject and object tags, respectively.
</span></span>
<span id="A3.SS1.p1.pic1.2.3" class="ltx_p"><span id="A3.SS1.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You need to decide whether the relation holds between the Subject and the Object entities in the query sentence.
<br class="ltx_break"></span></span>
<span id="A3.SS1.p1.pic1.2.4" class="ltx_p"><span id="A3.SS1.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">If the relation holds between the Subject and the Object entities in the query sentence, answer &quot;yes&quot;; otherwise, answer &quot;no&quot;.
</span></span>
</span></span></span></foreignobject></g></g></svg>