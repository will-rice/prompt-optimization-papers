<span id="A3.SS3.SSS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43em;">
<span id="A3.SS3.SSS3.p1.pic1.2.1" class="ltx_p"><span id="A3.SS3.SSS3.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are given a relation name, its description, a support sentence that exemplifies the relation, and a query sentence. Analyze the relation description and the query sentence. The Subject and Object are labeled in the query sentence. Determine if the relation is expressed between the marked entities. Check the relation definition, the semantic type of each entity, the direction from Subject to Object, and whether the evidence is explicit or strongly implied. Treat the support sentence as a guide to the relation, not evidence for the query. Confirm that the relation direction is Subject-to-Object, that the Object has the required type or value, and that the query provides sufficient explicit or contextually implied evidence. Ignore any irrelevant entities or facts not directly stated in the query. If the relation holds in the query sentence, answer &quot;yes&quot;; otherwise answer &quot;no&quot;. 
