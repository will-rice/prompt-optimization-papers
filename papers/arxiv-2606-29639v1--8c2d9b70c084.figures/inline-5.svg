<span id="A3.SS2.SSS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43em;">
<span id="A3.SS2.SSS1.p2.pic1.2.1" class="ltx_p"><span id="A3.SS2.SSS1.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert prompt generator for a relation extraction inference task. 
<br class="ltx_break">
<br class="ltx_break">A relation captures the connection between two entities in a sentence by describing their relationship. We will refer to these entities as the subject and object entities. 
<br class="ltx_break">The task requires inferring a binary (yes/no) answer based on whether the query sentence expresses this relation between the subject and the object entities. 
<br class="ltx_break">
<br class="ltx_break">You are given the current instruction prompt with targeted spans below: 
<br class="ltx_break"><code id="A3.SS2.SSS1.p2.pic1.2.1.1.1" class="ltx_verbatim">```</code> 
<br class="ltx_break">#ALL_MARKED_PROMPT# 
<br class="ltx_break"><code id="A3.SS2.SSS1.p2.pic1.2.1.1.2" class="ltx_verbatim">```</code> 
<br class="ltx_break">Each editable span is marked with tags such as &lt;span_1&gt;...&lt;/span_1&gt;, &lt;span_2&gt;...&lt;/span_2&gt;, and so on. 
<br class="ltx_break">
<br class="ltx_break">Replacements for each spans are given below: 
<br class="ltx_break">#SELECTED_REPLACEMENTS# 
<br class="ltx_break">
<br class="ltx_break">Your task is to generate a revised instruction prompt by applying the given replacements to the corresponding spans. 
<br class="ltx_break">Use the replacements exactly as provided, except for minimal local adjustments if necessary for spelling and grammatical correctness or coherence. 
<br class="ltx_break">Do not modify any other parts of the prompt (but remove the span tags). 
<br class="ltx_break">
<br class="ltx_break">Output only the revised prompt. 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>