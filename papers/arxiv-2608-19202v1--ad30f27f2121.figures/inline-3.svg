<span id="A1.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:48.75em;">
<span id="A1.p5.pic1.2.1" class="ltx_p"><span id="A1.p5.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">System.<span id="A1.p5.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are a careful planner.</span></span></span>
<span id="A1.p5.pic1.2.2" class="ltx_p"><span id="A1.p5.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">User.<span id="A1.p5.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> This is a <span id="A1.p5.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">PLACES</span> attributes dataset. I have a hidden place in mind.
Ask only yes/no questions about one attribute at a time from the provided list.</span></span></span>
<span id="A1.p5.pic1.2.3" class="ltx_p"><span id="A1.p5.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Assistant (Turn 1).<span id="A1.p5.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> <em id="A1.p5.pic1.2.3.1.1.1" class="ltx_emph ltx_font_italic">Question:</em> Is it coastal?</span></span></span>
<span id="A1.p5.pic1.2.4" class="ltx_p"><em id="A1.p5.pic1.2.4.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Belief (before the answer):</em><span id="A1.p5.pic1.2.4.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> uniform over all 25 places.</span></span>
<span id="A1.p5.pic1.2.5" class="ltx_p"><em id="A1.p5.pic1.2.5.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Uncertainty:</em><span id="A1.p5.pic1.2.5.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> <math id="A1.p5.pic1.m1" class="ltx_Math" alttext="H_{0}=\log_{2}25\approx 4.64" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo lspace="0.167em">⁡</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">25</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≈</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4.64</mn></mrow><annotation encoding="application/x-tex">H_{0}=\log_{2}25\approx 4.64</annotation></semantics></math> bits. <em id="A1.p5.pic1.2.5.2.1" class="ltx_emph ltx_font_italic">Stop:</em> no.</span></span>
<span id="A1.p5.pic1.2.6" class="ltx_p"><span id="A1.p5.pic1.2.6.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">User.<span id="A1.p5.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> No.</span></span></span>
<span id="A1.p5.pic1.2.7" class="ltx_p"><span id="A1.p5.pic1.2.7.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Assistant (Turn 2).<span id="A1.p5.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> <em id="A1.p5.pic1.2.7.1.1.1" class="ltx_emph ltx_font_italic">Update:</em> filter to candidates with <span id="A1.p5.pic1.2.7.1.1.2" class="ltx_text ltx_font_typewriter">coastal = false</span>.</span></span></span>
<span id="A1.p5.pic1.2.8" class="ltx_p"><em id="A1.p5.pic1.2.8.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Remaining candidates:</em><span id="A1.p5.pic1.2.8.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> 9 places (uniform over the remaining set).</span></span>
<span id="A1.p5.pic1.2.9" class="ltx_p"><em id="A1.p5.pic1.2.9.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Uncertainty:</em><span id="A1.p5.pic1.2.9.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> <math id="A1.p5.pic1.m2" class="ltx_Math" alttext="H_{1}=\log_{2}9\approx 3.17" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo lspace="0.167em">⁡</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≈</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3.17</mn></mrow><annotation encoding="application/x-tex">H_{1}=\log_{2}9\approx 3.17</annotation></semantics></math> bits.</span></span>
<span id="A1.p5.pic1.2.10" class="ltx_p"><em id="A1.p5.pic1.2.10.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Next question:</em><span id="A1.p5.pic1.2.10.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Is it mountainous?</span></span>
