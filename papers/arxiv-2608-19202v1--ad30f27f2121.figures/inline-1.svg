<svg id="S4.p3.pic1" class="ltx_picture" height="215.71" overflow="visible" version="1.1" viewbox="0 0 650 215.71" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,215.71) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000099;" fill="#000099" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.6 L 0 212.11 C 0 214.1 1.61 215.71 3.6 215.71 L 646.4 215.71 C 648.39 215.71 650 214.1 650 212.11 L 650 3.6 C 650 1.61 648.39 0 646.4 0 L 3.6 0 C 1.61 0 0 1.61 0 3.6 Z" /></g><g style="--ltx-fill-color:#F5F5FF;" fill="#F5F5FF" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 3.6 L 0.83 193.88 L 649.17 193.88 L 649.17 3.6 C 649.17 2.07 647.93 0.83 646.4 0.83 L 3.6 0.83 C 2.07 0.83 0.83 2.07 0.83 3.6 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 201.33)"><foreignobject style="--ltx-fo-width:39.21em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="542.56"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.21em;">
<span id="S4.p3.pic1.1.1" class="ltx_p"><span id="S4.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Algorithm 1: AIF-Context at inference time</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 143.6)"><foreignobject style="--ltx-fo-width:45.09em;--ltx-fo-height:2.95em;--ltx-fo-depth:9.63em;font-size:10pt;" height="174.1" overflow="visible" transform="matrix(1 0 0 -1 0 40.81)" width="623.92"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.09em;">
<span id="S4.p3.pic1.2.1" class="ltx_p"><span id="S4.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">At turn <math id="S4.p3.pic1.m1" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math>, maintain a belief <math id="S4.p3.pic1.m2" class="ltx_Math" alttext="q_{t}(x)" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">q_{t}(x)</annotation></semantics></math> over latent task state.</span></span>
<span id="S4.I1" class="ltx_enumerate">
<span id="S4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S4.I1.i1.p1" class="ltx_para">
<span id="S4.I1.i1.p1.1" class="ltx_p"><span id="S4.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Propose a small action set </span><math id="S4.I1.i1.p1.m1" class="ltx_Math" alttext="\mathcal{A}_{t}^{\mathrm{ctx}}" display="inline" intent=":literal"><semantics><msubsup><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒜</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ctx</mi></msubsup><annotation encoding="application/x-tex">\mathcal{A}_{t}^{\mathrm{ctx}}</annotation></semantics></math><span id="S4.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> of context actions and a set </span><math id="S4.I1.i1.p1.m2" class="ltx_Math" alttext="\mathcal{A}_{t}^{\mathrm{task}}" display="inline" intent=":literal"><semantics><msubsup><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒜</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">task</mi></msubsup><annotation encoding="application/x-tex">\mathcal{A}_{t}^{\mathrm{task}}</annotation></semantics></math><span id="S4.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> of terminal task actions.</span></span>
</span></span>
<span id="S4.I1.i2" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S4.I1.i2.p1" class="ltx_para">
<span id="S4.I1.i2.p1.1" class="ltx_p"><span id="S4.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each </span><math id="S4.I1.i2.p1.m1" class="ltx_Math" alttext="a\in\mathcal{A}_{t}^{\mathrm{ctx}}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><msubsup><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒜</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ctx</mi></msubsup></mrow><annotation encoding="application/x-tex">a\in\mathcal{A}_{t}^{\mathrm{ctx}}</annotation></semantics></math><span id="S4.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, predict possible observations with </span><math id="S4.I1.i2.p1.m2" class="ltx_Math" alttext="q_{t}(o\mid a)" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">q_{t}(o\mid a)</annotation></semantics></math><span id="S4.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> and compute the posterior </span><math id="S4.I1.i2.p1.m3" class="ltx_Math" alttext="q_{t}(x\mid o,a)" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">q_{t}(x\mid o,a)</annotation></semantics></math><span id="S4.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> that would follow each observation.</span></span>
</span></span>
<span id="S4.I1.i3" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="S4.I1.i3.p1" class="ltx_para">
<span id="S4.I1.i3.p1.1" class="ltx_p"><span id="S4.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score </span><math id="S4.I1.i3.p1.m1" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math><span id="S4.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> by expected free energy, or by the Bayes-risk value of context in </span><a href="#S3.Thmtheorem4" title="Theorem 3.4 (Bayes-risk value of context). ‣ 3 One-Step Active Inference as Bilevel Optimization ‣ Active Inference as Context Acquisition for AI Agents" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">Theorem</span> <span class="ltx_text ltx_ref_tag">3.4</span></a><span id="S4.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> when a terminal loss is available.</span></span>
</span></span>
<span id="S4.I1.i4" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="S4.I1.i4.p1" class="ltx_para">
<span id="S4.I1.i4.p1.1" class="ltx_p"><span id="S4.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If no context action beats acting now after cost, choose the best task action. Otherwise execute the best context action, observe </span><math id="S4.I1.i4.p1.m1" class="ltx_Math" alttext="o_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">o_{t}</annotation></semantics></math><span id="S4.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, update </span><math id="S4.I1.i4.p1.m2" class="ltx_Math" alttext="q_{t+1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><annotation encoding="application/x-tex">q_{t+1}</annotation></semantics></math><span id="S4.I1.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, and repeat.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>