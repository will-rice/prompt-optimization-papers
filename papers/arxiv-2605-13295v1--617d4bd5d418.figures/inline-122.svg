<span id="A4.SS4.SSS2.p2.pic1.p7" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS2.p2.pic1.p7.1" class="ltx_p">1. Read the `{query}` carefully.</span>
</span></span></span></span>
<span id="A4.SS4.SSS2.p2.pic1.2.8" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS2.p2.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS2.p2.pic1.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS2.p2.pic1.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS2.p2.pic1.2.8.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS4.SSS2.p2.pic1.2.8.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS4.SSS2.p2.pic1.p8" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS2.p2.pic1.p8.1" class="ltx_p">2. If a `` block is supplied, examine its contents inside the `&lt;few_shots_section&gt;` block.</span>
</span></span></span></span>
<span id="A4.SS4.SSS2.p2.pic1.2.9" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS2.p2.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS2.p2.pic1.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS2.p2.pic1.2.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS2.p2.pic1.2.9.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS4.SSS2.p2.pic1.2.9.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS4.SSS2.p2.pic1.p9" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS2.p2.pic1.p9.1" class="ltx_p">3. Perform a complete, manual, step<span id="A4.SS4.SSS2.p2.pic1.p9.1.1" class="ltx_text">-</span>by<span id="A4.SS4.SSS2.p2.pic1.p9.1.2" class="ltx_text">-</span>step calculation, making every piece of reasoning explicit.</span>
</span></span></span></span>
<span id="A4.SS4.SSS2.p2.pic1.2.10" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS2.p2.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS2.p2.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS4.SSS2.p2.pic1.p10" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS2.p2.pic1.p10.1" class="ltx_p">4. Do **not** employ any external tools.</span>
</span></span></span></span>
<span id="A4.SS4.SSS2.p2.pic1.2.11" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS2.p2.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS2.p2.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
