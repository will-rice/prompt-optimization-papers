<span id="A4.SS4.SSS2.p2.pic1.p19" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS2.p2.pic1.p19.1" class="ltx_p">The `&lt;proposal_1&gt;` element must contain **only** the number—no units, symbols, or additional text. The `&lt;justification_1&gt;` element should contain the full step<span id="A4.SS4.SSS2.p2.pic1.p19.1.1" class="ltx_text">-</span>by<span id="A4.SS4.SSS2.p2.pic1.p19.1.2" class="ltx_text">-</span>step reasoning that leads to that number.</span>
