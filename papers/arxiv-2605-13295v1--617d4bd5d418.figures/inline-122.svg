<span id="A4.SS4.SSS2.p2.pic1.2.18" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS2.p2.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS2.p2.pic1.2.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:326.3pt;"></span></span></span>
