<span id="A4.SS3.p8.pic1.p4" class="ltx_para ltx_noindent">
<span id="A4.SS3.p8.pic1.p4.1" class="ltx_p">1. Read the query: `{query}`.</span>
</span></span></span></span>
<span id="A4.SS3.p8.pic1.2.5" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p8.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p8.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS3.p8.pic1.p5" class="ltx_para ltx_noindent">
<span id="A4.SS3.p8.pic1.p5.1" class="ltx_p">2. Perform a clear, logical derivation.</span>
</span></span></span></span>
<span id="A4.SS3.p8.pic1.2.6" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p8.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p8.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS3.p8.pic1.p6" class="ltx_para ltx_noindent">
<span id="A4.SS3.p8.pic1.p6.1" class="ltx_p">3. Produce **exactly** two XML elements:</span>
</span></span></span></span>
<span id="A4.SS3.p8.pic1.2.7" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p8.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p8.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p8.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p8.pic1.2.7.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS3.p8.pic1.2.7.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS3.p8.pic1.p7" class="ltx_para ltx_noindent">
<span id="A4.SS3.p8.pic1.p7.1" class="ltx_p">   - `&lt;proposal_2&gt;` - the numeric answer, plain integer/float, no extra text.</span>
</span></span></span></span>
<span id="A4.SS3.p8.pic1.2.8" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p8.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p8.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS3.p8.pic1.p8" class="ltx_para ltx_noindent">
<span id="A4.SS3.p8.pic1.p8.1" class="ltx_p">   - `&lt;justification_2&gt;` - the reasoning that led to the answer.</span>
</span></span></span></span>
<span id="A4.SS3.p8.pic1.2.9" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p8.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p8.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:326.3pt;"></span></span></span>
