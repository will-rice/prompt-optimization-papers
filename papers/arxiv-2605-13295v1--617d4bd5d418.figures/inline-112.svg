<span id="A4.SS3.p8.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.SS3.p8.pic1.p1.1" class="ltx_p">### Task</span>
</span></span></span></span>
<span id="A4.SS3.p8.pic1.2.2" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p8.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p8.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS3.p8.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.SS3.p8.pic1.p2.1" class="ltx_p">Given the mathematical expression below, compute its value.</span>
</span></span></span></span>
<span id="A4.SS3.p8.pic1.2.3" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p8.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p8.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:326.3pt;"></span></span></span>
