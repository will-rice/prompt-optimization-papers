<span id="A4.SS4.SSS3.p4.pic1.2.11" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:326.3pt;"></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.12" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS4.SSS3.p4.pic1.p12" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS3.p4.pic1.p12.1" class="ltx_p">**Objective**</span>
</span></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.13" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.13.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.13.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS4.SSS3.p4.pic1.p13" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS3.p4.pic1.p13.1" class="ltx_p">Ensure that every claim made in the synthesizer’s answer is completely supported by the retrieved passages, using the list of supporting facts supplied.</span>
</span></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.14" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:326.3pt;"></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.15" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS4.SSS3.p4.pic1.p15" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS3.p4.pic1.p15.1" class="ltx_p">**Steps**</span>
</span></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.16" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS4.SSS3.p4.pic1.p16" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS3.p4.pic1.p16.1" class="ltx_p">1. Examine each entry in the &lt;supporting_facts&gt; list.</span>
</span></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.17" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.17.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.17.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.17.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS4.SSS3.p4.pic1.p17" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS3.p4.pic1.p17.1" class="ltx_p">2. For each fact, locate a passage in &lt;retrieved_passages&gt; that contains the same information (either word<span id="A4.SS4.SSS3.p4.pic1.p17.1.1" class="ltx_text">-</span>for<span id="A4.SS4.SSS3.p4.pic1.p17.1.2" class="ltx_text">-</span>word or in equivalent meaning).</span>
</span></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.18" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.18.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.18.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.18.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.18.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS4.SSS3.p4.pic1.p18" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS3.p4.pic1.p18.1" class="ltx_p">3. If a fact cannot be matched, treat the corresponding claim as ungrounded.</span>
</span></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.19" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:326.3pt;"></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.20" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS4.SSS3.p4.pic1.p20" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS3.p4.pic1.p20.1" class="ltx_p">**Required output**</span>
</span></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.21" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS4.SSS3.p4.pic1.p21" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS3.p4.pic1.p21.1" class="ltx_p">- When at least one claim is ungrounded, output exactly:</span>
</span></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.22" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.22.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS4.SSS3.p4.pic1.p22" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS3.p4.pic1.p22.1" class="ltx_p">  &lt;hallucination_detected&gt;true&lt;/hallucination_detected&gt;</span>
</span></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.23" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.23.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.23.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.23.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.23.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS4.SSS3.p4.pic1.2.23.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS4.SSS3.p4.pic1.p23" class="ltx_para ltx_noindent">
<span id="A4.SS4.SSS3.p4.pic1.p23.1" class="ltx_p">  &lt;hallucination_feedback&gt;Identify the ungrounded claim and indicate which passage should have been consulted.&lt;/hallucination_feedback&gt;</span>
</span></span></span></span>
<span id="A4.SS4.SSS3.p4.pic1.2.24" class="ltx_p" style="width:326.3pt;"><span id="A4.SS4.SSS3.p4.pic1.2.24.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS4.SSS3.p4.pic1.2.24.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS4.SSS3.p4.pic1.p24" class="ltx_para ltx_noindent">
