<span id="A4.SS3.p13.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.SS3.p13.pic1.p1.1" class="ltx_p">### Facts Extraction Prompt</span>
</span></span></span></span>
<span id="A4.SS3.p13.pic1.2.2" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p13.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p13.pic1.2.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p13.pic1.2.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p13.pic1.2.2.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS3.p13.pic1.2.2.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS3.p13.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.SS3.p13.pic1.p2.1" class="ltx_p">**Purpose**: Isolate verifiable statements from each retrieved document that address the user’s {query}. These statements will later feed the answer-generation agent.</span>
</span></span></span></span>
<span id="A4.SS3.p13.pic1.2.3" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p13.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p13.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:326.3pt;"></span></span></span>
