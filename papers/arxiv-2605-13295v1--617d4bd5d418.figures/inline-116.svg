<span id="A4.SS3.p13.pic1.2.11" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p13.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p13.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS3.p13.pic1.p11" class="ltx_para ltx_noindent">
<span id="A4.SS3.p13.pic1.p11.1" class="ltx_p">**Instructions**</span>
</span></span></span></span>
<span id="A4.SS3.p13.pic1.2.12" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p13.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p13.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS3.p13.pic1.p12" class="ltx_para ltx_noindent">
<span id="A4.SS3.p13.pic1.p12.1" class="ltx_p">- Scan each passage independently.</span>
</span></span></span></span>
<span id="A4.SS3.p13.pic1.2.13" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p13.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p13.pic1.2.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p13.pic1.2.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p13.pic1.2.13.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS3.p13.pic1.2.13.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS3.p13.pic1.p13" class="ltx_para ltx_noindent">
<span id="A4.SS3.p13.pic1.p13.1" class="ltx_p">- Pull out any sentence or clause that is a *fact* answering the query.</span>
</span></span></span></span>
<span id="A4.SS3.p13.pic1.2.14" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p13.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p13.pic1.2.14.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p13.pic1.2.14.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p13.pic1.2.14.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS3.p13.pic1.2.14.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS3.p13.pic1.p14" class="ltx_para ltx_noindent">
<span id="A4.SS3.p13.pic1.p14.1" class="ltx_p">- Quote the text exactly and prepend the passage number in brackets, e.g., `[3] &quot;...&quot;`.</span>
</span></span></span></span>
<span id="A4.SS3.p13.pic1.2.15" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p13.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p13.pic1.2.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p13.pic1.2.15.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p13.pic1.2.15.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS3.p13.pic1.2.15.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS3.p13.pic1.p15" class="ltx_para ltx_noindent">
<span id="A4.SS3.p13.pic1.p15.1" class="ltx_p">- Discard any claim listed in {hallucination_feedback} as hallucinated.</span>
</span></span></span></span>
<span id="A4.SS3.p13.pic1.2.16" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p13.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p13.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:326.3pt;"></span></span></span>
<span id="A4.SS3.p13.pic1.2.17" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p13.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p13.pic1.2.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS3.p13.pic1.p17" class="ltx_para ltx_noindent">
<span id="A4.SS3.p13.pic1.p17.1" class="ltx_p">**Output**</span>
</span></span></span></span>
<span id="A4.SS3.p13.pic1.2.18" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p13.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p13.pic1.2.18.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p13.pic1.2.18.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p13.pic1.2.18.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS3.p13.pic1.2.18.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS3.p13.pic1.p18" class="ltx_para ltx_noindent">
<span id="A4.SS3.p13.pic1.p18.1" class="ltx_p">Provide a single XML element named `&lt;passage_analysis&gt;` containing one fact per line, formatted as shown above. No additional prose is allowed.</span>
</span></span></span></span>
<span id="A4.SS3.p13.pic1.2.19" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p13.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p13.pic1.2.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:326.3pt;"></span></span></span>
