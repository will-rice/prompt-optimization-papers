<span id="A4.SS3.p14.pic1.2.1" class="ltx_p"><span id="A4.SS3.p14.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p14.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p14.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p14.pic1.2.1.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS3.p14.pic1.2.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS3.p14.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.SS3.p14.pic1.p1.1" class="ltx_p">**Goal**: Confirm that every statement in the synthesizer’s `answer` is backed by the `retrieved_passages` using the provided `supporting_facts`.</span>
</span></span></span></span>
<span id="A4.SS3.p14.pic1.2.2" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p14.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p14.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:326.3pt;"></span></span></span>
<span id="A4.SS3.p14.pic1.2.3" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p14.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p14.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS3.p14.pic1.p3" class="ltx_para ltx_noindent">
<span id="A4.SS3.p14.pic1.p3.1" class="ltx_p">**Procedure**</span>
</span></span></span></span>
<span id="A4.SS3.p14.pic1.2.4" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p14.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p14.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS3.p14.pic1.p4" class="ltx_para ltx_noindent">
<span id="A4.SS3.p14.pic1.p4.1" class="ltx_p">- Scan the `supporting_facts` list.</span>
</span></span></span></span>
<span id="A4.SS3.p14.pic1.2.5" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p14.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p14.pic1.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p14.pic1.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p14.pic1.2.5.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS3.p14.pic1.2.5.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS3.p14.pic1.p5" class="ltx_para ltx_noindent">
<span id="A4.SS3.p14.pic1.p5.1" class="ltx_p">- For each fact, search the `retrieved_passages` for a matching passage (verbatim or semantically equivalent).</span>
</span></span></span></span>
<span id="A4.SS3.p14.pic1.2.6" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p14.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p14.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A4.SS3.p14.pic1.p6" class="ltx_para ltx_noindent">
<span id="A4.SS3.p14.pic1.p6.1" class="ltx_p">- Flag any fact that cannot be found.</span>
</span></span></span></span>
<span id="A4.SS3.p14.pic1.2.7" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p14.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p14.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p14.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS3.p14.pic1.2.7.1.3" class="ltx_text ltx_inline-block" style="width:18.9pt;"> </span><span id="A4.SS3.p14.pic1.2.7.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:307.4pt;">
<span id="A4.SS3.p14.pic1.p7" class="ltx_para ltx_noindent">
<span id="A4.SS3.p14.pic1.p7.1" class="ltx_p">- If any flag appears, output hallucination details; otherwise output the verified answer.</span>
</span></span></span></span>
<span id="A4.SS3.p14.pic1.2.8" class="ltx_p" style="width:326.3pt;"><span id="A4.SS3.p14.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A4.SS3.p14.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:326.3pt;"></span></span></span>
