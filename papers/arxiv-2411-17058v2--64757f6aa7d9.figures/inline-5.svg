<span id="Sx3.p6.pic1.p1" class="ltx_para ltx_noindent">
<span id="Sx3.p6.pic1.p1.1" class="ltx_p"><span id="Sx3.p6.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Takeaway 3</span><span id="Sx3.p6.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Our analysis shows that ThreatModeling-GPT significantly outperforms all baseline models, including Cyber Sentinel, STRIDEGPT, and Raw LLM (ChatGPT). The integrated approach of prompt engineering with fine-tuning shows the greatest improvement, elevating precision from 0.49 to 0.73 and accuracy from 0.36 to 0.69.</span></span>
