<span id="S5.SS2.SSS0.Px7.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.35em;">
<span id="S5.SS2.SSS0.Px7.p2.pic1.2.1" class="ltx_p"><span id="S5.SS2.SSS0.Px7.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Varying only candidate pool size <math id="S5.SS2.SSS0.Px7.p2.pic1.m2" class="ltx_Math" alttext="n{=}3{\to}5" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></mrow><annotation encoding="application/x-tex">n{=}3{\to}5</annotation></semantics></math> raises mean by
<span id="S5.SS2.SSS0.Px7.p2.pic1.2.1.1.1" class="ltx_text ltx_font_bold">+21.6%</span> while tripling variance (<math id="S5.SS2.SSS0.Px7.p2.pic1.m3" class="ltx_math_unparsed" alttext="3.7\times" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3.7</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000">×</mo></mrow><annotation encoding="application/x-tex">3.7\times</annotation></semantics></math>).
Both <span id="S5.SS2.SSS0.Px7.p2.pic1.2.1.1.2" class="ltx_text ltx_font_smallcaps">Mage</span> (full) (<math id="S5.SS2.SSS0.Px7.p2.pic1.m4" class="ltx_Math" alttext="p{=}0.998" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.998</mn></mrow><annotation encoding="application/x-tex">p{=}0.998</annotation></semantics></math>) and <span id="S5.SS2.SSS0.Px7.p2.pic1.2.1.1.3" class="ltx_text ltx_font_smallcaps">Mage</span>-M (<math id="S5.SS2.SSS0.Px7.p2.pic1.m5" class="ltx_Math" alttext="p{=}0.990" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.990</mn></mrow><annotation encoding="application/x-tex">p{=}0.990</annotation></semantics></math>) show
strong evidence of outperforming <span id="S5.SS2.SSS0.Px7.p2.pic1.2.1.1.4" class="ltx_text ltx_font_smallcaps">Gepa</span>.
<span id="S5.SS2.SSS0.Px7.p2.pic1.2.1.1.5" class="ltx_text ltx_font_bold">Variance must be reported alongside mean as a first-class
metric.</span></span></span>
</span></span></span></foreignobject></g></g></svg>