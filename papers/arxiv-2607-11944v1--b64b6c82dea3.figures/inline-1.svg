<span id="S5.SS2.SSS0.Px7.p2.pic1.1.1" class="ltx_p"><span id="S5.SS2.SSS0.Px7.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#36160C;">Key finding: POCE (5 seeds, <math id="S5.SS2.SSS0.Px7.p2.pic1.m1" class="ltx_Math" alttext="N_{\text{test}}{=}50" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#36160C;" mathcolor="#36160C">N</mi><mtext style="--ltx-fg-color:#36160C;" class="ltx_mathvariant_bold" mathcolor="#36160C">test</mtext></msub><mo style="--ltx-fg-color:#36160C;" mathcolor="#36160C">=</mo><mn style="--ltx-fg-color:#36160C;" mathcolor="#36160C">50</mn></mrow><annotation encoding="application/x-tex">N_{\text{test}}{=}50</annotation></semantics></math>)</span></span>
