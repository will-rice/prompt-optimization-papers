<span id="S5.I1.i3.p1.1" class="ltx_p"><span id="S5.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Value increase = 150% of original → $80,000 × 2.5 = $200,000</span></span>
