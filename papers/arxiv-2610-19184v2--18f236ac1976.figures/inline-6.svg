<svg id="A7.SS1.p3.pic1" class="ltx_picture" height="868.26" overflow="visible" version="1.1" viewbox="0 0 653.15 868.26" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,868.26) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 868.26 L 653.15 868.26 L 653.15 0 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 0.55 L 0.55 867.71 L 652.6 867.71 L 652.6 0.55 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.62 12.78)"><foreignobject style="--ltx-fo-width:43.35em;--ltx-fo-height:60.99em;--ltx-fo-depth:0.08em;font-size:10pt;" height="845.03" overflow="visible" transform="matrix(1 0 0 -1 0 843.87)" width="599.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS1.p3.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.35em;">
<span id="A7.SS1.p3.pic1.p25" class="ltx_para">
<span id="A7.SS1.p3.pic1.p25.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p25.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">ACE</span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
</span>
<span id="A7.SS1.p3.pic1.p1" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p1.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Think step by step. Use the provided database schema. Return exactly ONE SQLite query in a ‘‘‘sql code block, selecting exactly the columns the question asks for, in the order asked. Check the query before returning it.</span></span>
</span>
<span id="A7.SS1.p3.pic1.p2" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p2.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">## PLAYBOOK</span></span>
</span>
<span id="A7.SS1.p3.pic1.p3" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p3.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p3.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">The playbook below contains strategies and insights accumulated from previous attempts at similar text-to-SQL questions. Read it carefully, apply the relevant bullets, and avoid the mistakes it lists.</span></span>
</span>
<span id="A7.SS1.p3.pic1.p4" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p4.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p4.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">#### STRATEGIES &amp; INSIGHTS</span></span>
</span>
<span id="A7.SS1.p3.pic1.p5" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p5.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p5.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[str-00001] helpful=606 harmful=22 :: Use the minimal set of predicates needed to answer the question; avoid adding redundant filters that can undercount or overconstrain results.</span></span>
</span>
<span id="A7.SS1.p3.pic1.p6" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p6.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p6.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[str-00002] helpful=233 harmful=16 :: Aggregate at the source of truth for the metric (the table that records the event) to avoid join-induced row multiplication; only join after pre-aggregating or deduplicating if needed.</span></span>
</span>
<span id="A7.SS1.p3.pic1.p7" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p7.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p7.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[... 68 more bullets omitted ...]</span></span>
</span>
<span id="A7.SS1.p3.pic1.p8" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p8.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p8.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">#### FORMULAS &amp; CALCULATIONS</span></span>
</span>
<span id="A7.SS1.p3.pic1.p9" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p9.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p9.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[calc-00006] helpful=34 harmful=0 :: BETWEEN is inclusive of both endpoints (e.g., age BETWEEN 13 AND 19 is equivalent to age &gt;= 13 AND age &lt;= 19).</span></span>
</span>
<span id="A7.SS1.p3.pic1.p10" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p10.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p10.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[calc-00007] helpful=221 harmful=9 :: COUNT(*) counts rows; COUNT(column) ignores NULLs. Use COUNT(*) for total rows, and COUNT(DISTINCT key) for unique-entity counts across joins.</span></span>
</span>
<span id="A7.SS1.p3.pic1.p11" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p11.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p11.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[... 38 more bullets omitted ...]</span></span>
</span>
<span id="A7.SS1.p3.pic1.p12" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p12.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p12.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">#### CODE SNIPPETS &amp; TEMPLATES</span></span>
</span>
<span id="A7.SS1.p3.pic1.p13" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p13.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p13.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[code-00123] helpful=27 harmful=0 :: Two percentage patterns -- choose based on intended grain: event-weighted share (occurrence-based) versus entity-weighted share (per-parent existence). Ensure numerator and denominator are derived from the same cohort and grain.</span></span>
</span>
<span id="A7.SS1.p3.pic1.p14" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p14.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p14.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[... 50 more bullets omitted ...]</span></span>
</span>
<span id="A7.SS1.p3.pic1.p15" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p15.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p15.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">#### COMMON MISTAKES TO AVOID</span></span>
</span>
<span id="A7.SS1.p3.pic1.p16" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p16.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p16.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[err-00013] helpful=25 harmful=93 :: Overfiltering by adding constraints not required by the question (e.g., adding city/title when zip alone determines the answer).</span></span>
</span>
<span id="A7.SS1.p3.pic1.p17" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p17.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p17.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[err-00014] helpful=7 harmful=4 :: Joining on incomplete keys (e.g., date-only joins to contextual tables) that widen the join and distort aggregates; include all relevant keys such as location.</span></span>
</span>
<span id="A7.SS1.p3.pic1.p18" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p18.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p18.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[... 172 more bullets omitted ...]</span></span>
</span>
<span id="A7.SS1.p3.pic1.p19" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p19.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p19.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">#### PROBLEM-SOLVING HEURISTICS</span></span>
</span>
<span id="A7.SS1.p3.pic1.p20" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p20.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p20.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[ph-00009] helpful=775 harmful=7 :: Determine the intended grain before writing the query (row-level, per-group list, or single scalar) and ensure SELECT, GROUP BY, and HAVING reflect that grain.</span></span>
</span>
<span id="A7.SS1.p3.pic1.p21" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p21.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p21.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[... 32 more bullets omitted ...]</span></span>
</span>
<span id="A7.SS1.p3.pic1.p22" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p22.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p22.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">#### CONTEXT CLUES &amp; INDICATORS</span></span>
</span>
<span id="A7.SS1.p3.pic1.p23" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p23.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p23.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[ctx-00031] helpful=68 harmful=2 :: Language cues: words like ’total’, ’sum’, ’per’, ’by’, ’each’ imply aggregation; phrases like ’highest/lowest [column]’ without ’total’ suggest row-level ordering rather than grouping.</span></span>
</span>
<span id="A7.SS1.p3.pic1.p24" class="ltx_para ltx_align_left ltx_noindent">
<span id="A7.SS1.p3.pic1.p24.1" class="ltx_p"><span id="A7.SS1.p3.pic1.p24.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[... 79 more bullets omitted ...]</span></span>
</span></span></span></span></foreignobject></g></g></svg>