<span id="A5.SS3.p3.pic1.p10.1" class="ltx_p">{{</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.11" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p11" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p11.1" class="ltx_p">  &quot;reasoning&quot;: &quot;Brief explanation of the query strategy&quot;,</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.12" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p12" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p12.1" class="ltx_p">  &quot;queries&quot;: [</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.13" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p13" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p13.1" class="ltx_p">    &quot;targeted query 1&quot;,</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.14" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p14" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p14.1" class="ltx_p">    &quot;targeted query 2&quot;,</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.15" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p15" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p15.1" class="ltx_p">    ...</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.16" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p16" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p16.1" class="ltx_p">  ]</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.17" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p17" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p17.1" class="ltx_p">}}</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.18" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p18" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p18.1" class="ltx_p">```</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.19" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:313.7pt;"></span></span></span>
