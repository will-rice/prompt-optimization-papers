<span id="A5.SS3.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:29.88em;">
<span id="A5.SS3.p3.pic1.1.1" class="ltx_p"><span id="A5.SS3.p3.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p1.1" class="ltx_p">Guidelines:</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.2" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p2.1" class="ltx_p">1. Always include the original query as one option</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.3" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS3.p3.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS3.p3.pic1.1.3.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS3.p3.pic1.1.3.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS3.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p3.1" class="ltx_p">2. Generate only the minimal necessary queries (usually 1-3)</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.4" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS3.p3.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS3.p3.pic1.1.4.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS3.p3.pic1.1.4.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS3.p3.pic1.p4" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p4.1" class="ltx_p">3. Each query should target a specific information requirement</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.5" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p5.1" class="ltx_p">4. Avoid redundant or overlapping queries</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.6" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS3.p3.pic1.1.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS3.p3.pic1.1.6.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS3.p3.pic1.1.6.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS3.p3.pic1.p6" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p6.1" class="ltx_p">5. Focus on efficiency - fewer, more targeted queries are better</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.7" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:313.7pt;"></span></span></span>
<span id="A5.SS3.p3.pic1.1.8" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p8" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p8.1" class="ltx_p">Return your response in JSON format:</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.9" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS3.p3.pic1.p9" class="ltx_para ltx_noindent">
<span id="A5.SS3.p3.pic1.p9.1" class="ltx_p">```json</span>
</span></span></span></span>
<span id="A5.SS3.p3.pic1.1.10" class="ltx_p" style="width:313.7pt;"><span id="A5.SS3.p3.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS3.p3.pic1.1.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
