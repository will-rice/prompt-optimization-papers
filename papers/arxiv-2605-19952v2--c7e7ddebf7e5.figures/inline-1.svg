<svg id="A5.SS1.p1.pic1" class="ltx_picture" height="387.78" overflow="visible" version="1.1" viewbox="0 0 477.38 387.78" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,387.78) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#00FFFF;" fill="#00FFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 381.88 C 0 385.14 2.64 387.78 5.91 387.78 L 471.47 387.78 C 474.73 387.78 477.38 385.14 477.38 381.88 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 381.88 C 1.97 384.05 3.73 385.81 5.91 385.81 L 471.47 385.81 C 473.65 385.81 475.41 384.05 475.41 381.88 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.85)"><foreignobject style="--ltx-fo-width:29.88em;--ltx-fo-height:25.81em;--ltx-fo-depth:0.22em;font-size:10pt;" height="360.23" overflow="visible" transform="matrix(1 0 0 -1 0 357.15)" width="413.46"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:29.88em;">
<span id="A5.SS1.p1.pic1.1.1" class="ltx_p"><span id="A5.SS1.p1.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.1.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p1.1" class="ltx_p">Your task is to extract all valuable FACTUAL information from the following dialogues and convert them into structured memory entries.</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.2" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS1.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p2.1" class="ltx_p">{context}</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.3" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS1.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p3.1" class="ltx_p">[Current Window Dialogues]</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.4" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS1.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p4.1" class="ltx_p">{dialogue_text}</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.5" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:313.7pt;"></span></span></span>
<span id="A5.SS1.p1.pic1.1.6" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS1.p1.pic1.p6" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p6.1" class="ltx_p">[Requirements]</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.7" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.7.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.7.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p7.1" class="ltx_p">1. **Extract Facts, Not Social Gestures**: SKIP greetings, thank-yous, compliments, and generic praise. Only extract entries that contain novel factual information (events, activities, plans, preferences, relationships, specific details like names/titles/numbers).</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.8" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.8.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.8.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p8" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p8.1" class="ltx_p">2. **Source Dialogue IDs**: Each dialogue line starts with an ID in brackets like [ID:42]. For each memory entry, list the dialogue IDs that the entry was derived from in the &quot;source_dialogue_ids&quot; field. This is CRITICAL for tracing back to original context.</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.9" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.9.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.9.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p9" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p9.1" class="ltx_p">3. **Force Disambiguation**: Absolutely PROHIBIT using pronouns (he, she, it, they, this, that). Always use the person’s actual name. Every memory MUST explicitly state WHO did/said/experienced the thing.</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.10" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.10.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.10.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p10" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p10.1" class="ltx_p">4. **Resolve Temporal References**: Convert ALL relative time expressions to absolute dates based on the dialogue timestamp:</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.11" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS1.p1.pic1.p11" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p11.1" class="ltx_p">   - &quot;yesterday&quot; on May 8 -&gt; May 7</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.12" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS1.p1.pic1.p12" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p12.1" class="ltx_p">   - &quot;last year&quot; in 2023 -&gt; 2022</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.13" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS1.p1.pic1.p13" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p13.1" class="ltx_p">   - &quot;last week&quot; -&gt; compute the actual date</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.14" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:313.7pt;">
<span id="A5.SS1.p1.pic1.p14" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p14.1" class="ltx_p">   - &quot;next month&quot; -&gt; compute the actual month</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.15" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.15.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.15.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.15.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p15" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p15.1" class="ltx_p">   The &quot;timestamp&quot; field should be the EVENT time, NOT the conversation time.</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.16" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.16.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.16.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.16.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.16.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p16" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p16.1" class="ltx_p">5. **Atomic Facts**: Extract individual facts as SEPARATE entries. If one dialogue mentions 3 activities, create 3 entries. Do not merge unrelated facts into one summary.</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.17" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.17.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.17.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.17.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p17" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p17.1" class="ltx_p">6. **Preserve Specific Details**: Always capture exact names (people, pets, books, songs), exact numbers (durations, counts, ages), and specific entities.</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.18" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.18.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.18.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.18.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.18.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p18" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p18.1" class="ltx_p">7. **Identify Described-But-Unnamed Things Using World Knowledge**: When the dialogue describes something without naming it, IDENTIFY it by name in the memory entry. This is CRITICAL — future queries will search by name, not by description.</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.19" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.19.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.19.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.19.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.19.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p19" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p19.1" class="ltx_p">   - A study method like &quot;25 minutes on, 5 minutes off&quot; → identify as &quot;Pomodoro technique&quot;</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.20" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.20.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.20.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.20.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.20.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p20" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p20.1" class="ltx_p">   - A composer whose music is in a named movie → identify the composer (e.g. Harry Potter soundtrack → John Williams)</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.21" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.21.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.21.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.21.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.21.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p21" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p21.1" class="ltx_p">   - A game described by its mechanics → identify the game (e.g. &quot;card game where you find the imposter&quot; → Mafia, &quot;game with colored cards you match&quot; → UNO)</span>
</span></span></span></span>
<span id="A5.SS1.p1.pic1.1.22" class="ltx_p" style="width:313.7pt;"><span id="A5.SS1.p1.pic1.1.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:313.7pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p1.pic1.1.22.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.22.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A5.SS1.p1.pic1.1.22.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A5.SS1.p1.pic1.1.22.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:292.7pt;">
<span id="A5.SS1.p1.pic1.p22" class="ltx_para ltx_noindent">
<span id="A5.SS1.p1.pic1.p22.1" class="ltx_p">   - A location described by its features → identify it (e.g. &quot;national park in northern Minnesota with lakes&quot; → Voyageurs National Park)</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>