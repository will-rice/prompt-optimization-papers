<svg id="A4.p2.pic1" class="ltx_picture" height="781.75" overflow="visible" version="1.1" viewbox="0 0 550 781.75" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,781.75) matrix(1 0 0 -1 0 0)"><clippath id="pgfcp13"><path d="M -22670.54 -22670.54 L 22670.54 -22670.54 L 22670.54 22670.54 L -22670.54 22670.54 Z M 0 4.49 L 0 777.26 C 0 779.74 2.01 781.75 4.49 781.75 L 545.51 781.75 C 547.99 781.75 550 779.74 550 777.26 L 550 4.49 C 550 2.01 547.99 0 545.51 0 L 4.49 0 C 2.01 0 0 2.01 0 4.49 Z" /></clippath><g fill-rule="evenodd"><g style="--ltx-fill-color:#8C0000;" fill="#8C0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.49 L 0 777.26 C 0 779.74 2.01 781.75 4.49 781.75 L 545.51 781.75 C 547.99 781.75 550 779.74 550 777.26 L 550 4.49 C 550 2.01 547.99 0 545.51 0 L 4.49 0 C 2.01 0 0 2.01 0 4.49 Z M 0.55 4.49 L 0.55 745.79 L 549.45 745.79 L 549.45 4.49 C 549.45 2.32 547.68 0.55 545.51 0.55 L 4.49 0.55 C 2.32 0.55 0.55 2.32 0.55 4.49 Z" /></g><g style="--ltx-fill-color:#FFF5F5;" fill="#FFF5F5" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 4.49 L 0.55 745.79 L 549.45 745.79 L 549.45 4.49 C 549.45 2.32 547.68 0.55 545.51 0.55 L 4.49 0.55 C 2.32 0.55 0.55 2.32 0.55 4.49 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.03 766.88)"><foreignobject style="--ltx-fo-width:33.3em;--ltx-fo-height:0.75em;--ltx-fo-depth:1.2em;font-size:10pt;" height="26.98" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="460.78"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.3em;">
<span id="A4.p2.pic1.1.1" class="ltx_p"><span id="A4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Accuracy-PE optimized prompt (Accuracy-PE, baseline): val AUROC 0.6835</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.03 12.1)"><foreignobject style="--ltx-fo-width:38.3em;--ltx-fo-height:52.44em;--ltx-fo-depth:0.25em;font-size:10pt;" height="729.06" overflow="visible" transform="matrix(1 0 0 -1 0 725.61)" width="529.96"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.3em;">
<span id="A4.p2.pic1.2.1" class="ltx_p"><span id="A4.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">When evaluating whether the target finding (e.g., “Cardiomegaly”) exists in a chest X-ray, follow this structured process:</span></span>
<span id="A4.p2.pic1.2.2" class="ltx_p"><span id="A4.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1. Analyze the image visually:<span id="A4.p2.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A4.I1" class="ltx_itemize">
<span id="A4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i1.p1.1" class="ltx_p"><span id="A4.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the view (AP, PA, or Portable) — this affects how you interpret cardiac size.</span></span>
</span></span>
<span id="A4.I1.i2" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i2.p1.1" class="ltx_p"><span id="A4.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Look for an enlarged cardiac silhouette — specifically, assess the cardiothoracic ratio (CTR). In AP views, a CTR </span><math id="A4.I1.i2.p1.m1" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math><span id="A4.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 0.5 suggests cardiomegaly. In PA views, a CTR </span><math id="A4.I1.i2.p1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math><span id="A4.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> 0.5 is also diagnostic, but in portable views (often AP), the heart may appear larger due to positioning — use this as a clue, not a definitive rule.</span></span>
</span></span>
<span id="A4.I1.i3" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i3.p1.1" class="ltx_p"><span id="A4.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Note any artifacts or equipment (e.g., ECG leads, tubes) that might obscure the cardiac borders — if the heart is partially obscured, it may be harder to assess, but if the silhouette is clearly enlarged, it still counts.</span></span>
</span></span>
<span id="A4.I1.i4" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i4.p1" class="ltx_para">
<span id="A4.I1.i4.p1.1" class="ltx_p"><span id="A4.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Pay attention to the mediastinum — widening may suggest cardiomegaly or other pathology, but in AP views, mediastinal widening can also be due to lung collapse or positioning.</span></span>
</span></span>
</span>
<span id="A4.p2.pic1.2.3" class="ltx_p"><span id="A4.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">2. Integrate with clinical context:<span id="A4.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I2" class="ltx_itemize">
<span id="A4.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I2.i1.p1.1" class="ltx_p"><span id="A4.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider the patient’s age, gender, and clinical profile (e.g., urgent admission, chronic conditions, lab values like BUN/Cr, electrolytes, glucose, lactate, or liver enzymes).</span></span>
</span></span>
<span id="A4.I2.i2" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I2.i2.p1.1" class="ltx_p"><span id="A4.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Note if the patient is elderly or has known heart disease — these can predispose to cardiomegaly even if the X-ray is subtle.</span></span>
</span></span>
<span id="A4.I2.i3" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i3.p1" class="ltx_para">
<span id="A4.I2.i3.p1.1" class="ltx_p"><span id="A4.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the lab context shows signs of heart failure (e.g., elevated BUN/Cr, low albumin, elevated lactate, or elevated AST/ALT), this supports the finding even if the X-ray is borderline.</span></span>
</span></span>
</span>
<span id="A4.p2.pic1.2.4" class="ltx_p"><span id="A4.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3. Avoid common mistakes:<span id="A4.p2.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A4.I3" class="ltx_itemize">
<span id="A4.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i1.p1.1" class="ltx_p"><span id="A4.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not assume normal cardiac size based on a PA view — in AP views, the heart appears larger, so cardiomegaly is more likely if the silhouette is large.</span></span>
</span></span>
<span id="A4.I3.i2" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i2.p1.1" class="ltx_p"><span id="A4.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not dismiss cardiomegaly because the image is portable — portable AP views are common in emergencies and may not be ideal for precise measurement, but an enlarged silhouette is still diagnostic.</span></span>
</span></span>
<span id="A4.I3.i3" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i3.p1" class="ltx_para">
<span id="A4.I3.i3.p1.1" class="ltx_p"><span id="A4.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not ignore artifacts — if the heart is partially obscured, assess whether the visible portion is enlarged — if yes, it still counts as cardiomegaly.</span></span>
</span></span>
</span>
<span id="A4.p2.pic1.2.5" class="ltx_p"><span id="A4.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">4. Final output:<span id="A4.p2.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A4.I4" class="ltx_itemize">
<span id="A4.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I4.i1.p1.1" class="ltx_p"><span id="A4.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Answer “Yes” if the cardiac silhouette is enlarged (CTR </span><math id="A4.I4.i1.p1.m1" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math><span id="A4.I4.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 0.5 in AP/PA views) or if the silhouette is disproportionately large despite view or artifacts.</span></span>
</span></span>
<span id="A4.I4.i2" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i2.p1" class="ltx_para">
<span id="A4.I4.i2.p1.1" class="ltx_p"><span id="A4.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Answer “No” only if the silhouette is clearly within normal limits and no enlargement is visible — this requires clear visualization of the heart borders and a CTR </span><math id="A4.I4.i2.p1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math><span id="A4.I4.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 0.5.</span></span>
</span></span>
</span>
<span id="A4.p2.pic1.2.6" class="ltx_p"><span id="A4.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Always support your answer with a brief explanation of the visual evidence and how it aligns (or doesn’t align) with the clinical context.</span></span>
</span></span></span></foreignobject></g></g></g></svg>