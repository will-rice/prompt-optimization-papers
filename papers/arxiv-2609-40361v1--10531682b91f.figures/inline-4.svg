<span id="A4.F4.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.1em;">
<span id="A4.F4.p3.pic1.1.1" class="ltx_p"><math id="A4.F4.p3.pic1.m1" class="ltx_Math" alttext="\boldsymbol{\times}" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#C85050;" class="ltx_mathvariant_bold" mathcolor="#C85050" mathvariant="bold">×</mo><annotation encoding="application/x-tex">\boldsymbol{\times}</annotation></semantics></math><span id="A4.F4.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#C85050;"> Asymmetric “Yes”-bias</span></span>
<span id="A4.F4.p3.pic1.1.2" class="ltx_p"><span id="A4.F4.p3.pic1.1.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#4B4B4B;">“Do not dismiss cardiomegaly because the image is portable
… an enlarged silhouette is still diagnostic.
<br class="ltx_break">Do not ignore artifacts — if the heart is partially obscured,
assess whether the visible portion is enlarged — if yes, it still
counts as cardiomegaly.”</span></span>
<span id="A4.F4.p3.pic1.1.3" class="ltx_p"><span id="A4.F4.p3.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Every “Avoid common mistakes” clause pushes toward “Yes”; there is no
symmetric guardrail against over-calling, so false-positives are
silently licensed.</span></span>
</span></span></span></foreignobject></g></g></svg>