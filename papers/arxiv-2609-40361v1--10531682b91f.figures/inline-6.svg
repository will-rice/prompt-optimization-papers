<span id="A4.F4.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.1em;">
<span id="A4.F4.p5.pic1.1.1" class="ltx_p"><math id="A4.F4.p5.pic1.m1" class="ltx_Math" alttext="\boldsymbol{\times}" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#C85050;" class="ltx_mathvariant_bold" mathcolor="#C85050" mathvariant="bold">×</mo><annotation encoding="application/x-tex">\boldsymbol{\times}</annotation></semantics></math><span id="A4.F4.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#C85050;"> Labs override imaging</span></span>
<span id="A4.F4.p5.pic1.1.2" class="ltx_p"><span id="A4.F4.p5.pic1.1.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#4B4B4B;">“If the lab context shows signs of heart failure
(e.g., elevated BUN/Cr, low albumin, elevated lactate, or elevated
AST/ALT), <em id="A4.F4.p5.pic1.1.2.1.1" class="ltx_emph ltx_font_upright">this supports the finding even if the X-ray is
borderline</em>.”</span></span>
<span id="A4.F4.p5.pic1.1.3" class="ltx_p"><span id="A4.F4.p5.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Treats labs as a switch that flips the binary decision. Once the
decision flips, the score ordering on borderline pairs is destroyed,
precisely on the pairs that drive AUROC differences.</span></span>
</span></span></span></foreignobject></g></g></svg>