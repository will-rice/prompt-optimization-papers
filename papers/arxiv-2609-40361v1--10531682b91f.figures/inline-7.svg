<span id="A4.F4.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.1em;">
<span id="A4.F4.p6.pic1.1.1" class="ltx_p"><math id="A4.F4.p6.pic1.m1" class="ltx_Math" alttext="\boldsymbol{\checkmark}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#3C8C50;" class="ltx_mathvariant_bold" mathcolor="#3C8C50" mathvariant="bold">✓</mi><annotation encoding="application/x-tex">\boldsymbol{\checkmark}</annotation></semantics></math><span id="A4.F4.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#3C8C50;"> Labs calibrate the score</span></span>
<span id="A4.F4.p6.pic1.1.2" class="ltx_p"><span id="A4.F4.p6.pic1.1.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#4B4B4B;">“Use lab context to support or refute the finding … lab values are <em id="A4.F4.p6.pic1.1.2.1.1" class="ltx_emph ltx_font_upright">not definitive</em> for cardiac size.
<br class="ltx_break">Do not rely on lab values alone: Use them to support or
contextualize the visual finding, <em id="A4.F4.p6.pic1.1.2.1.2" class="ltx_emph ltx_font_upright">not to replace it</em>.”</span></span>
<span id="A4.F4.p6.pic1.1.3" class="ltx_p"><span id="A4.F4.p6.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Labs refine the visual confidence rather than override it; the
imaging-driven score ordering is preserved.</span></span>
