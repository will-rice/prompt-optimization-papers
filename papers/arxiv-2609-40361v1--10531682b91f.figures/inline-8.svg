<span id="A4.F4.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.1em;">
<span id="A4.F4.p7.pic1.1.1" class="ltx_p"><math id="A4.F4.p7.pic1.m1" class="ltx_Math" alttext="\boldsymbol{\times}" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#C85050;" class="ltx_mathvariant_bold" mathcolor="#C85050" mathvariant="bold">×</mo><annotation encoding="application/x-tex">\boldsymbol{\times}</annotation></semantics></math><span id="A4.F4.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#C85050;"> Permits “No” on unclear images</span></span>
<span id="A4.F4.p7.pic1.1.2" class="ltx_p"><span id="A4.F4.p7.pic1.1.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#4B4B4B;">“Answer “No” only if the silhouette is clearly within
normal limits and no enlargement is visible — this requires
<em id="A4.F4.p7.pic1.1.2.1.1" class="ltx_emph ltx_font_upright">clear visualization</em> of the heart borders and a CTR <math id="A4.F4.p7.pic1.m2" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#4B4B4B;" mathcolor="#4B4B4B">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math> 0.5.”</span></span>
<span id="A4.F4.p7.pic1.1.3" class="ltx_p"><span id="A4.F4.p7.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">A confident “No” is licensed whenever the image is degraded,
structurally biasing portable and AP views toward false
negatives, the largest cohort in MIMIC-IV.</span></span>
</span></span></span></foreignobject></g></g></svg>