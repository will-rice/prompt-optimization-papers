<span id="A4.SS2.p3.pic1.1.2" class="ltx_p"><span id="A4.SS2.p3.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Provide a concise numerical answer to the reasoning question through these steps:</span></span>
<span id="A4.SS2.p3.pic1.1.3" class="ltx_p"><span id="A4.SS2.p3.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Analyze the query to identify essential data points directly relevant to the answer.</span></span>
<span id="A4.SS2.p3.pic1.1.4" class="ltx_p"><span id="A4.SS2.p3.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Use a step-by-step logical computation approach, clearly linking each step to the query’s context.</span></span>
<span id="A4.SS2.p3.pic1.1.5" class="ltx_p"><span id="A4.SS2.p3.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Consistently use terminology from the input data to prevent ambiguity.
- Verify calculations with provided data, providing brief justifications for each key operation.</span></span>
<span id="A4.SS2.p3.pic1.1.6" class="ltx_p"><span id="A4.SS2.p3.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Maintain a consistent numerical format to prevent parsing errors and adhere to local and cultural conventions if specified.</span></span>
<span id="A4.SS2.p3.pic1.1.7" class="ltx_p"><span id="A4.SS2.p3.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Tailor your explanation to the user’s expertise: Offer detailed steps for beginners and concise steps for advanced users.</span></span>
<span id="A4.SS2.p3.pic1.1.8" class="ltx_p"><span id="A4.SS2.p3.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Present the final numerical answer in square brackets, e.g., [42], in its simplest form, ensuring consistent units unless additional formatting is specified.</span></span>
<span id="A4.SS2.p3.pic1.1.9" class="ltx_p"><span id="A4.SS2.p3.pic1.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Guarantee the output is a single, precise numerical value, fulfilling evaluation metrics and ensuring logical coherence.</span></span>
