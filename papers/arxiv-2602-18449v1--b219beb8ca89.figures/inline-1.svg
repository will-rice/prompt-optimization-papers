<span id="p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.09em;">
<span id="p1.pic1.1.1" class="ltx_p"><span id="p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Abstract.<span id="p1.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
We propose a diffusion-based framework for prompt optimization that leverages Diffusion Language Models (DLMs) to iteratively refine system prompts through masked denoising. By conditioning on interaction traces, including user queries, model responses, and optional feedback, our method enables flexible, span-level prompt updates without requiring gradient access or modifying the downstream language model. Across diverse benchmarks (e.g., <math id="p1.pic1.m1" class="ltx_Math" alttext="\tau" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><annotation encoding="application/x-tex">\tau</annotation></semantics></math>-bench, SST-2, SST-5), DLM-optimized prompts consistently improve the performance of a frozen target LLM (e.g., GPT-4o-mini). We further show that moderate diffusion step counts provide the best balance between refinement quality and stability. These results highlight diffusion-based prompt optimization as a general, model-agnostic, and scalable approach for enhancing LLM performance through iterative prompt refinement.
