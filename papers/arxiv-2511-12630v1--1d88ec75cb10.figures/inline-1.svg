<svg id="A1.SS4.p3.pic1" class="ltx_picture" height="1432" overflow="visible" version="1.1" viewbox="0 0 233.92 1432" width="233.92"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1432) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.98 L 0 1406.61 C 0 1411.01 3.57 1414.59 7.98 1414.59 L 225.94 1414.59 C 230.34 1414.59 233.92 1411.01 233.92 1406.61 L 233.92 7.98 C 233.92 3.57 230.34 0 225.94 0 L 7.98 0 C 3.57 0 0 3.57 0 7.98 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 2.08 7.98 L 2.08 1406.61 C 2.08 1409.87 4.72 1412.51 7.98 1412.51 L 225.94 1412.51 C 229.2 1412.51 231.84 1409.87 231.84 1406.61 L 231.84 7.98 C 231.84 4.72 229.2 2.08 225.94 2.08 L 7.98 2.08 C 4.72 2.08 2.08 4.72 2.08 7.98 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 11.81 1406.71)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.48 L 0 17.81 C 0 21.94 3.35 25.29 7.48 25.29 L 319.76 25.29 C 323.89 25.29 327.24 21.94 327.24 17.81 L 327.24 7.48 C 327.24 3.35 323.89 0 319.76 0 L 7.48 0 C 3.35 0 0 3.35 0 7.48 Z" /></g><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 1.57 7.48 L 1.57 17.81 C 1.57 21.07 4.22 23.72 7.48 23.72 L 319.76 23.72 C 323.02 23.72 325.66 21.07 325.66 17.81 L 325.66 7.48 C 325.66 4.22 323.02 1.57 319.76 1.57 L 7.48 1.57 C 4.22 1.57 1.57 4.22 1.57 7.48 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.19)"><foreignobject style="--ltx-fo-width:19.08em;--ltx-fo-height:0.6em;--ltx-fo-depth:0.17em;font-size:11.5pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="303.56"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.p3.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">NOTAM Runway Lighting parsing Prompt</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.76 17.35)"><foreignobject style="--ltx-fo-width:13.76em;--ltx-fo-height:99.98em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1386.83" overflow="visible" transform="matrix(1 0 0 -1 0 1383.37)" width="190.4"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:13.76em;">
<span id="A1.SS4.p3.pic1.2.1" class="ltx_p"><span id="A1.SS4.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">As an AI assistant specialized in processing NOTAM runway lighting information, extract unavailable/degraded lighting systems according to the following rules:</span></span>
<span id="A1.SS4.p3.pic1.2.2" class="ltx_p"><span id="A1.SS4.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scope:<span id="A1.SS4.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Focus only on runway lighting anomalies (RCL/REDL/RTZL/ALS). Ignore non-runway lighting (e.g., taxiway lights).</span></span></span>
<span id="A1.SS4.p3.pic1.2.3" class="ltx_p"><span id="A1.SS4.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Lighting Type Mapping:<span id="A1.SS4.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">{&quot;REDL&quot;: [&quot;EDGE&quot;, &quot;REDL&quot;, &quot;EDGE LGT&quot;], &quot;ALS&quot;: [&quot;APCH&quot;, &quot;APPROACH&quot;, &quot;ALS&quot;, &quot;PALS&quot;], &quot;RCL&quot;: [&quot;CENTERLINE&quot;, &quot;RCL&quot;, &quot;CL&quot;], &quot;RTZL&quot;: [&quot;TOUCHDOWN&quot;, &quot;TDZ&quot;, &quot;RTZL&quot;]}</span></span></span>
<span id="A1.SS4.p3.pic1.2.4" class="ltx_p"><span id="A1.SS4.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">If multiple systems are affected simultaneously, split into separate records.</span></span>
<span id="A1.SS4.p3.pic1.2.5" class="ltx_p"><span id="A1.SS4.p3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Status Determination:<span id="A1.SS4.p3.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A1.I1" class="ltx_itemize">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">RCL/REDL/RTZL: Partial unavailability = Full unavailability (unavailable/downgrade = &quot;unavailable&quot;)</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">ALS Grading:</span></span>
<span id="A1.I1.i2.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A1.I1.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A1.I1.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A1.I1.i2.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i2.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If status contains U/S or UNSERVICEABLE: unavailable/downgrade = &quot;unavailable&quot;</span></span>
</span></span>
<span id="A1.I1.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A1.I1.i2.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A1.I1.i2.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Else: unavailable/downgrade = &quot;downgrade&quot;</span></span>
</span></span>
</span>
</span></span>
<span id="A1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i3.p1" class="ltx_para">
<span id="A1.I1.i3.p1.1" class="ltx_p"><span id="A1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">als_downgrade = {&quot;distance </span><math id="A1.I1.i3.p1.m1" class="ltx_Math" alttext="\geq" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><annotation encoding="application/x-tex">\geq</annotation></semantics></math><span id="A1.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 720m&quot;: &quot;FALS&quot;, &quot;420-719m&quot;: &quot;IALS&quot;, &quot;210-419m&quot;: &quot;BALS&quot;, &quot;</span><math id="A1.I1.i3.p1.m2" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math><span id="A1.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">210m&quot;: &quot;NALS&quot;, &quot;percentage/partial damage&quot;: &quot;BALS&quot;}</span></span>
</span></span>
</span>
<span id="A1.SS4.p3.pic1.2.6" class="ltx_p"><span id="A1.SS4.p3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">ILS Category Downgrade:<span id="A1.SS4.p3.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> If &quot;DOWNGRADED TO CAT X&quot; appears, mark canceled ILS categories in ilscategory field (CAT-I/CAT-II/CAT-III).</span></span></span>
<span id="A1.SS4.p3.pic1.2.7" class="ltx_p"><span id="A1.SS4.p3.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Format:<span id="A1.SS4.p3.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"><span id="A1.SS4.p3.pic1.2.7.1.1.1" class="ltx_text ltx_font_typewriter">airport</span>: ICAO code 
<br class="ltx_break"><span id="A1.SS4.p3.pic1.2.7.1.1.2" class="ltx_text ltx_font_typewriter">runway</span>: runway number 
<br class="ltx_break"><span id="A1.SS4.p3.pic1.2.7.1.1.3" class="ltx_text ltx_font_typewriter">lightcategory</span>: REDL / ALS / RCL / RTZL 
<br class="ltx_break"><span id="A1.SS4.p3.pic1.2.7.1.1.4" class="ltx_text ltx_font_typewriter">ilscategory</span>: CAT-I | CAT-II | CAT-III | null 
<br class="ltx_break"><span id="A1.SS4.p3.pic1.2.7.1.1.5" class="ltx_text ltx_font_typewriter">unavailable/downgrade</span>: unavailable | downgrade 
<br class="ltx_break"><span id="A1.SS4.p3.pic1.2.7.1.1.6" class="ltx_text ltx_font_typewriter">als</span>: FALS | IALS | BALS | NALS | null 
<br class="ltx_break"><span id="A1.SS4.p3.pic1.2.7.1.1.7" class="ltx_text ltx_font_typewriter">distance</span>: distance value or null 
<br class="ltx_break"><span id="A1.SS4.p3.pic1.2.7.1.1.8" class="ltx_text ltx_font_typewriter">percentage</span>: percentage value or null</span></span></span>
<span id="A1.SS4.p3.pic1.2.8" class="ltx_p"><span id="A1.SS4.p3.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Priority:<span id="A1.SS4.p3.pic1.2.8.1.1" class="ltx_text ltx_font_medium"> Explicit distance <math id="A1.SS4.p3.pic1.m1" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> Percentage description <math id="A1.SS4.p3.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> Conservative estimation.</span></span></span>
<span id="A1.SS4.p3.pic1.2.9" class="ltx_p"><span id="A1.SS4.p3.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now, based on above requirements, extract relevant information from the given NOTAM text and output in JSON.
Input:{NOTAM}</span></span>
</span></span></span></foreignobject></g></g></svg>