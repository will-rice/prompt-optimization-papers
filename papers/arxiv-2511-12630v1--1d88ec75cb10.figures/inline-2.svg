(1 0 0 -1 0 9.61)" width="147.62"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.p5.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Consolidator Prompt</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.76 15.04)"><foreignobject style="--ltx-fo-width:13.76em;--ltx-fo-height:61.85em;--ltx-fo-depth:0.08em;font-size:10pt;" height="856.98" overflow="visible" transform="matrix(1 0 0 -1 0 855.83)" width="190.4"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:13.76em;">
<span id="A1.SS4.p5.pic1.2.1" class="ltx_p"><span id="A1.SS4.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a specialized NOTAM field merging expert. Your task is to analyze NOTAM field definitions to identify semantically duplicate or inclusive fields.</span></span>
<span id="A1.SS4.p5.pic1.2.2" class="ltx_p"><span id="A1.SS4.p5.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Focus on:<span id="A1.SS4.p5.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A1.I2" class="ltx_itemize">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Semantic overlap of field names</span><span id="A1.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: e.g., </span><span id="A1.I2.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">runway_closure</span><span id="A1.I2.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> vs </span><span id="A1.I2.i1.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">runway_closed</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Duplicate content in descriptions</span><span id="A1.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: e.g., </span><span id="A1.I2.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">ice</span><span id="A1.I2.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> vs </span><span id="A1.I2.i2.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">ice_condition</span></span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i3.p1" class="ltx_para">
<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">High overlap in source content</span><span id="A1.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: same NOTAM patterns or identical meanings</span></span>
</span></span>
</span>
<span id="A1.SS4.p5.pic1.2.3" class="ltx_p"><span id="A1.SS4.p5.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Requirements:<span id="A1.SS4.p5.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A1.I3" class="ltx_itemize">
<span id="A1.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I3.i1.p1" class="ltx_para">
<span id="A1.I3.i1.p1.1" class="ltx_p"><span id="A1.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output only a JSON array</span></span>
</span></span>
<span id="A1.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I3.i2.p1" class="ltx_para">
<span id="A1.I3.i2.p1.1" class="ltx_p"><span id="A1.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each object must contain: </span><span id="A1.I3.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;action&quot;</span><span id="A1.I3.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I3.i2.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;fields_to_merge&quot;</span><span id="A1.I3.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I3.i2.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;new_field_name&quot;</span><span id="A1.I3.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I3.i2.p1.1.8" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;reason&quot;</span><span id="A1.I3.i2.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I3.i2.p1.1.10" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;confidence&quot;</span></span>
</span></span>
<span id="A1.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I3.i3.p1" class="ltx_para">
<span id="A1.I3.i3.p1.1" class="ltx_p"><span id="A1.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Confidence is a float value from 0.0 to 1.0</span></span>
</span></span>
</span>
<span id="A1.SS4.p5.pic1.2.4" class="ltx_p"><span id="A1.SS4.p5.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example:<span id="A1.SS4.p5.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"><span id="A1.SS4.p5.pic1.2.4.1.1.1" class="ltx_text ltx_font_typewriter">[ { &quot;action&quot;: &quot;merge&quot;, &quot;fields_to_merge&quot;: [&quot;runway_closure&quot;, &quot;runway_closed&quot;], &quot;new_field_name&quot;: &quot;runway_closure&quot;, &quot;reason&quot;: &quot;Both fields indicate ’RWY CLSD’ and share identical semantics.&quot;, &quot;confidence&quot;: 0.95 } ]</span> 
<br class="ltx_break" style="--ltx-break-space:4.3pt;"></span></span></span>
<span id="A1.SS4.p5.pic1.2.5" class="ltx_p"><span id="A1.SS4.p5.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">If no fields require merging, return: <span id="A1.SS4.p5.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">[]</span></span></span>
</span></span></span></foreignobject></g></g></svg>