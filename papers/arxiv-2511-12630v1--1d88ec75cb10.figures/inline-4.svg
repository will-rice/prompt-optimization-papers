 0 -1 0 9.61)" width="99.13"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.p9.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Critic Prompt</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.76 15.04)"><foreignobject style="--ltx-fo-width:13.76em;--ltx-fo-height:55.62em;--ltx-fo-depth:0.08em;font-size:10pt;" height="770.73" overflow="visible" transform="matrix(1 0 0 -1 0 769.58)" width="190.4"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.p9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:13.76em;">
<span id="A1.SS4.p9.pic1.2.1" class="ltx_p"><span id="A1.SS4.p9.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a critical analysis expert. Review previous merging and renaming proposals and identify potential issues.</span></span>
<span id="A1.SS4.p9.pic1.2.2" class="ltx_p"><span id="A1.SS4.p9.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Focus on:<span id="A1.SS4.p9.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A1.I6" class="ltx_itemize">
<span id="A1.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i1.p1" class="ltx_para">
<span id="A1.I6.i1.p1.1" class="ltx_p"><span id="A1.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Check if merge proposals are too aggressive and could cause information loss</span></span>
</span></span>
<span id="A1.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i2.p1" class="ltx_para">
<span id="A1.I6.i2.p1.1" class="ltx_p"><span id="A1.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Verify that renaming proposals are accurate and retain important context</span></span>
</span></span>
<span id="A1.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i3.p1" class="ltx_para">
<span id="A1.I6.i3.p1.1" class="ltx_p"><span id="A1.I6.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify any duplicate fields that were missed</span></span>
</span></span>
</span>
<span id="A1.SS4.p9.pic1.2.3" class="ltx_p"><span id="A1.SS4.p9.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Requirements:<span id="A1.SS4.p9.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A1.I7" class="ltx_itemize">
<span id="A1.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i1.p1" class="ltx_para">
<span id="A1.I7.i1.p1.1" class="ltx_p"><span id="A1.I7.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output only a JSON array</span></span>
</span></span>
<span id="A1.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i2.p1" class="ltx_para">
<span id="A1.I7.i2.p1.1" class="ltx_p"><span id="A1.I7.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each object must contain: </span><span id="A1.I7.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;action&quot;</span><span id="A1.I7.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I7.i2.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;target_proposal&quot;</span><span id="A1.I7.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I7.i2.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;reason&quot;</span><span id="A1.I7.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I7.i2.p1.1.8" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;confidence&quot;</span></span>
</span></span>
<span id="A1.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i3.p1" class="ltx_para">
<span id="A1.I7.i3.p1.1" class="ltx_p"><span id="A1.I7.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;action&quot;</span><span id="A1.I7.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> is either </span><span id="A1.I7.i3.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;challenge&quot;</span><span id="A1.I7.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> or </span><span id="A1.I7.i3.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;approve&quot;</span></span>
</span></span>
<span id="A1.I7.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i4.p1" class="ltx_para">
<span id="A1.I7.i4.p1.1" class="ltx_p"><span id="A1.I7.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Confidence is a float value from 0.0 to 1.0</span></span>
</span></span>
</span>
<span id="A1.SS4.p9.pic1.2.4" class="ltx_p"><span id="A1.SS4.p9.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example:<span id="A1.SS4.p9.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"><span id="A1.SS4.p9.pic1.2.4.1.1.1" class="ltx_text ltx_font_typewriter">[ { &quot;action&quot;: &quot;challenge&quot;, &quot;target_proposal&quot;: 0, &quot;reason&quot;: &quot;Although ’hazard’ and ’hazard_area’ are similar, ’hazard_area’ emphasizes spatial scope and should not be merged.&quot;, &quot;confidence&quot;: 0.8 } ]</span> 
<br class="ltx_break" style="--ltx-break-space:4.3pt;"></span></span></span>
<span id="A1.SS4.p9.pic1.2.5" class="ltx_p"><span id="A1.SS4.p9.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">If all proposals are fine, return: <span id="A1.SS4.p9.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">[]</span></span></span>
</span></span></span></foreignobject></g></g></svg>