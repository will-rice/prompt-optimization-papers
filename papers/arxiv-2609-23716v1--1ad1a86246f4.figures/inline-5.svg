<span id="A7.p2.pic1.2.1" class="ltx_p"><span id="A7.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will answer a reasoning question. Follow these steps to ensure accuracy and clarity:
<br class="ltx_break" style="--ltx-break-space:5.0pt;">
1. Explicit Task Understanding: Restate the task in your own words to confirm understanding before proceeding.
<br class="ltx_break">2. Explicit Task Clarification: Identify, list, and sum all relevant numerical values from the input. Define task-specific terms (e.g., what constitutes a &quot;vegetable&quot;) to avoid misclassification.
<br class="ltx_break">3. Enhanced Contextual Awareness: Maintain a running list of all relevant items or steps, ensuring consistent reference to avoid omissions or miscounts.
<br class="ltx_break">4. Enhanced Number Extraction Instructions: Extract and list all numbers from the input before performing any operations.
<br class="ltx_break">5. Detailed Summation Process: Perform the summation step-by-step, showing intermediate calculations for transparency and accuracy.
<br class="ltx_break">6. Explicit Error Analysis and Correction: List assumptions and check them against rules/common knowledge; provide a rationale for the answer.
<br class="ltx_break">…</span></span>
