</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:11.55em;--ltx-fo-depth:0.19em;font-size:10pt;" height="162.51" overflow="visible" transform="matrix(1 0 0 -1 0 159.82)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A5.SS2.p3.pic1.2.1" class="ltx_p"><span id="A5.SS2.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">“Here is the role of the variable you will improve: &lt;ROLE&gt;{variable_desc}&lt;/ROLE&gt;.”</span></span>
<span id="A5.SS2.p3.pic1.2.2" class="ltx_p"><span id="A5.SS2.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">“The variable is the text within the following span: &lt;VARIABLE&gt;{variable_short} &lt;/VARIABLE&gt;”</span></span>
<span id="A5.SS2.p3.pic1.2.3" class="ltx_p"><span id="A5.SS2.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">“Here is the context and feedback we got for the variable:”</span></span>
<span id="A5.SS2.p3.pic1.2.4" class="ltx_p"><span id="A5.SS2.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;CONTEXT&gt;{variable_grad}&lt;/CONTEXT&gt;</span></span>
<span id="A5.SS2.p3.pic1.2.5" class="ltx_p"><span id="A5.SS2.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">“Improve the variable ({variable_desc}) using the feedback provided in &lt;FEEDBACK&gt;tags.”</span></span>
<span id="A5.SS2.p3.pic1.2.6" class="ltx_p"><span id="A5.SS2.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">“Send the improved variable ” 
<br class="ltx_break">“in the following format:”</span></span>
<span id="A5.SS2.p3.pic1.2.7" class="ltx_p"><span id="A5.SS2.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">{new_variable_start_tag}{{the improved variable}}{new_variable_end_tag}</span></span>
<span id="A5.SS2.p3.pic1.2.8" class="ltx_p"><span id="A5.SS2.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">“Send ONLY the improved variable between the &lt;IMPROVABLE&gt;tags, and nothing else.”</span></span>
</span></span></span></foreignobject></g></g></svg>