<span id="S4.F6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.98em;">
<span id="S4.F6.pic1.1.1" class="ltx_p"><span id="S4.F6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompts for Analyzing Stance towards Kavanaugh</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.83 118.05)"><foreignobject style="--ltx-fo-width:43.68em;--ltx-fo-height:25.65em;--ltx-fo-depth:7.45em;font-size:10pt;" height="458.01" overflow="visible" transform="matrix(1 0 0 -1 0 354.92)" width="604.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.F6.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.68em;">
<span id="S4.F6.pic1.p2" class="ltx_para">
<span id="S4.F6.pic1.p2.1" class="ltx_p ltx_align_center"><span id="S4.F6.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#000000;">Simple Heuristic Prompt:
<br class="ltx_break"></span></span>
<span id="S4.F6.pic1.p2.2" class="ltx_p"><span id="S4.F6.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">In your judgment, whether the specific stance the author expresses toward the confirmation of Brett Kavanaugh is approving or opposing? Please choose your answer only from the 2 options – ”approve” and ”oppose”. Complete the task very succinctly using only one word written between ’&lt;’ and ’&gt;’.
<br class="ltx_break"></span></span>
</span>
<span id="S4.F6.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_rule" style="width:436.8pt;height:1.0pt;--ltx-bg-color:black;display:inline-block;"> </span>
<span id="S4.F6.pic1.p1.1" class="ltx_p ltx_align_center"><span id="S4.F6.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#000000;">Enhanced Prompt:
<br class="ltx_break"></span></span>
<span id="S4.F6.pic1.p1.2" class="ltx_p"><span id="S4.F6.pic1.p1.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You are a stance analyzer.</span><span id="S4.F6.pic1.p1.2.2" class="ltx_text" style="--ltx-fg-color:#000000;"> In your judgment, whether the specific stance the tweet text expresses toward the confirmation of Brett Kavanaugh is approving or opposing? </span><span id="S4.F6.pic1.p1.2.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Note: Focus on the stance expressed regarding Kavanaugh’s confirmation. <span id="S4.F6.pic1.p1.2.3.1" class="ltx_text ltx_font_bold">Emotional tone</span> (e.g., anger, happiness) should be considered only if it directly influences the stance.</span><span id="S4.F6.pic1.p1.2.4" class="ltx_text" style="--ltx-fg-color:#000000;"> Please choose your answer only from the 2 options – ”approve” and ”oppose”. Complete the task very succinctly using only one word written between ’&lt;’ and ’&gt;’.</span></span>
</span>
<span id="S4.F6.pic1.p3" class="ltx_para">
<span id="S4.F6.pic1.p3.1" class="ltx_p"><span id="S4.F6.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Oppose Stance:
<br class="ltx_break"></span><span id="S4.F6.pic1.p3.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">
- Lending credibility to allegations or accusations against Kavanaugh
<br class="ltx_break">- Highlighting potential disqualifying factors or controversies about Kavanaugh
<br class="ltx_break">- Expressing criticism, concerns, or questions about Kavanaugh’s suitability
<br class="ltx_break">- Suggesting credible misconduct allegations should disqualify Kavanaugh as a nominee<span id="S4.F6.pic1.p3.1.2.1" class="ltx_text"></span></span></span>
<span id="S4.F6.pic1.p3.2" class="ltx_p"><span id="S4.F6.pic1.p3.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Approve Stance:
<br class="ltx_break"></span><span id="S4.F6.pic1.p3.2.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">
- Discrediting or undermining accusations against Kavanaugh
<br class="ltx_break">- Presenting evidence that weakens the case against Kavanaugh
<br class="ltx_break">- Defending or rationalizing Kavanaugh’s nomination despite allegations
<br class="ltx_break">- Expressing frustration towards actions obstructing/delaying Kavanaugh’s confirmation
<br class="ltx_break">- <span id="S4.F6.pic1.p3.2.2.1" class="ltx_text ltx_font_bold">Mocking</span>, dismissing, or discrediting Kavanaugh’s accusers/opponents<span id="S4.F6.pic1.p3.2.2.2" class="ltx_text"></span></span></span>
</span></span></span></span></foreignobject></g></g></svg>