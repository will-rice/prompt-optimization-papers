<span id="S4.F4.pic1.1.1" class="ltx_p"><span id="S4.F4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompts for Sentiment Analysis towards Brett Kavanaugh</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.83 67.46)"><foreignobject style="--ltx-fo-width:43.68em;--ltx-fo-height:23.13em;--ltx-fo-depth:3.79em;font-size:10pt;" height="372.59" overflow="visible" transform="matrix(1 0 0 -1 0 320.08)" width="604.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.F4.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.68em;">
<span id="S4.F4.pic1.p2" class="ltx_para">
<span id="S4.F4.pic1.p2.1" class="ltx_p ltx_align_center"><span id="S4.F4.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#000000;">Unoptimized Heuristic Prompt:
<br class="ltx_break"></span></span>
<span id="S4.F4.pic1.p2.2" class="ltx_p"><span id="S4.F4.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">In your judgment, whether the specific sentiment is positive or negative? Please choose your answer only from the 2 options – ”positive” and ”negative”. Complete the task very succinctly using only one word written between ’&lt;’ and ’&gt;’.
<br class="ltx_break"></span></span>
</span>
<span id="S4.F4.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_rule" style="width:436.8pt;height:1.0pt;--ltx-bg-color:black;display:inline-block;"> </span>
<span id="S4.F4.pic1.p1.1" class="ltx_p ltx_align_center"><span id="S4.F4.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#000000;">Enhanced Prompt:
<br class="ltx_break"></span></span>
<span id="S4.F4.pic1.p1.2" class="ltx_p"><span id="S4.F4.pic1.p1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">In your judgment, whether the specific sentiment is positive or negative? Please choose your answer only from the 2 options – ”positive” and ”negative”. Complete the task very succinctly using only one word written between ’&lt;’ and ’&gt;’. </span><span id="S4.F4.pic1.p1.2.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Evaluate the overall <span id="S4.F4.pic1.p1.2.2.1" class="ltx_text ltx_font_bold">emotional tone</span>, context, and specific language to determine if the sentiment is positive or negative.
<br class="ltx_break"></span></span>
</span>
<span id="S4.F4.pic1.p3" class="ltx_para">
<span id="S4.F4.pic1.p3.1" class="ltx_p"><span id="S4.F4.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">negative:
<br class="ltx_break"></span><span id="S4.F4.pic1.p3.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">
Choose ¡negative¿ when the text expresses <span id="S4.F4.pic1.p3.1.2.1" class="ltx_text" style="--ltx-fg-color:#FF0000;text-decoration:line-through;;">opposition</span> <span id="S4.F4.pic1.p3.1.2.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000FF;">condemnation</span>, criticism, dissatisfaction, frustration, anger, or uses negative language such as expletives, derogatory terms, or focuses on conflict, harm, or unethical behavior.<span id="S4.F4.pic1.p3.1.2.3" class="ltx_text"></span></span></span>
<span id="S4.F4.pic1.p3.2" class="ltx_p"><span id="S4.F4.pic1.p3.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">positive:
<br class="ltx_break"></span><span id="S4.F4.pic1.p3.2.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">
Choose ¡positive¿ when the text shows <span id="S4.F4.pic1.p3.2.2.1" class="ltx_text" style="--ltx-fg-color:#FF0000;text-decoration:line-through;;">approval</span> <span id="S4.F4.pic1.p3.2.2.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000FF;">affirmation</span>, support, or uses favorable adjectives.<span id="S4.F4.pic1.p3.2.2.3" class="ltx_text"></span></span></span>
</span></span></span></span></foreignobject></g></g></svg>