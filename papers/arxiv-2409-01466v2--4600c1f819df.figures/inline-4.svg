<svg id="A5.F1.pic1" class="ltx_picture ltx_centering" height="465.44" overflow="visible" version="1.1" viewbox="0 0 650 465.44" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,465.44) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#0000BF;" fill="#0000BF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 459.54 C 0 462.8 2.64 465.44 5.91 465.44 L 644.09 465.44 C 647.36 465.44 650 462.8 650 459.54 L 650 5.91 C 650 2.64 647.36 0 644.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 441.33 L 648.03 441.33 L 648.03 5.91 C 648.03 3.73 646.27 1.97 644.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 449.93)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.F1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A5.F1.pic1.1.1" class="ltx_p"><span id="A5.F1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompts for Classifying Topics of BBC News Report</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:29.85em;--ltx-fo-depth:0.19em;font-size:10pt;" height="415.75" overflow="visible" transform="matrix(1 0 0 -1 0 413.05)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A5.F1.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A5.F1.pic1.p2" class="ltx_para">
<span id="A5.F1.pic1.p2.1" class="ltx_p ltx_align_center"><span id="A5.F1.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#000000;">Simple Heuristic Prompt:
<br class="ltx_break"></span></span>
<span id="A5.F1.pic1.p2.2" class="ltx_p"><span id="A5.F1.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">In your judgment, what is the major topic of the given news report Text? Please choose only one answer from the following options: ”politics”, ”business”, ”sport”, ”technology”, or ”entertainment”. Complete the task very succinctly using only one word written between ’&lt;’ and ’&gt;’.</span></span>
<span id="A5.F1.pic1.p2.3" class="ltx_p ltx_align_center"><span id="A5.F1.pic1.p2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">[Enhanced Prompt][BBC News Text (lengthy text in the Appendix <a href="#A5.F3" title="Figure B3 ‣ Appendix E Topic Classification Experiment: Classifying BBC News Reports Topics ‣ Enhancing LLM-Based Text Classification in Political Science: Automatic Prompt Optimization and Dynamic Exemplar Selection for Few-Shot Learning" class="ltx_ref"><span class="ltx_text ltx_ref_tag">B3</span></a>)]</span></span>
<span id="A5.F1.pic1.p2.4" class="ltx_tabular ltx_align_middle">
<span class="ltx_tbody">
<span id="A5.F1.pic1.p2.4.1" class="ltx_tr">
<span id="A5.F1.pic1.p2.4.1.1" class="ltx_td ltx_align_left ltx_border_r">
<span id="A5.F1.pic1.p2.4.1.1.1" class="ltx_inline-block ltx_align_top">
<span id="A5.F1.pic1.p2.4.1.1.1.1" class="ltx_p"><span id="A5.F1.pic1.p2.4.1.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Weak Chat Model1:</span><span id="A5.F1.pic1.p2.4.1.1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The news report discusses the history and future of Yahoo, including its competition with Google and MSN, its acquisitions, and its plans for the future. It also mentions the importance of search technology and the potential expansion into rich media. Based on this, the major topic of the news report is ”technology.” Therefore, the correct answer is ¡technology¿.</span></span>
</span></span>
<span id="A5.F1.pic1.p2.4.1.2" class="ltx_td ltx_align_left">
<span id="A5.F1.pic1.p2.4.1.2.1" class="ltx_inline-block ltx_align_top">
<span id="A5.F1.pic1.p2.4.1.2.1.1" class="ltx_p"><span id="A5.F1.pic1.p2.4.1.2.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Weak Chat Model2:</span><span id="A5.F1.pic1.p2.4.1.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The text discusses the future prospects of Yahoo, a major internet company, focusing on its competition with Google and MSN, its business strategies, and its potential dominance in the next decade. Therefore, the correct answer is ¡business¿.</span></span>
</span></span></span>
</span>
</span>
<span id="A5.F1.pic1.p2.5" class="ltx_p ltx_align_center"><span id="A5.F1.pic1.p2.5.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#000000;">Judge Prompt:
<br class="ltx_break"></span></span>
<span id="A5.F1.pic1.p2.6" class="ltx_p"><span id="A5.F1.pic1.p2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given 2 responses (”Response 1” and ”Response 2”) to the following task about the ”Text”, which can be correct or wrong. 
<br class="ltx_break">Please judge which response (or neither) to the following content is correct step by step and provide your reasoning succinctly (Do not exceed 100 words). Finally, based on the reasoning, choose the correct answer and repeat the response’s (or your) choice once in ’&lt;’ and ’&gt;’.
<br class="ltx_break"></span></span>
<span id="A5.F1.pic1.p2.7" class="ltx_p ltx_align_center"><span id="A5.F1.pic1.p2.7.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">[Response 1][Response 2]</span></span>
</span>
<span id="A5.F1.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_rule" style="width:438.5pt;height:1.0pt;--ltx-bg-color:black;display:inline-block;"> </span>
<span id="A5.F1.pic1.p1.1" class="ltx_p"><span id="A5.F1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Judge Chat Model:</span><span id="A5.F1.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Let’s </span><span id="A5.F1.pic1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">think step-by-step</span><span id="A5.F1.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">. Response 1 focuses on the technological aspects of Yahoo’s history and future, such as search technology and expansion into rich media. However, the text primarily discusses Yahoo’s business strategies, competition, and market position, rather than technological innovations. Response 2 correctly identifies the text’s focus on Yahoo’s business aspects, such as competition with Google and MSN, acquisitions, and future prospects. Therefore, the correct answer is ¡business¿.</span>
<br class="ltx_break"></span>
</span></span></span></span></foreignobject></g></g></svg>