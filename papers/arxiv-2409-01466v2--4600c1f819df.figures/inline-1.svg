<svg id="S4.F3.pic1" class="ltx_picture ltx_centering ltx_figure_panel" height="1566.79" overflow="visible" version="1.1" viewbox="0 0 650 1566.79" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1566.79) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#0000BF;" fill="#0000BF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 1566.79 L 650 1566.79 L 650 0 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 3.15 3.15 L 3.15 1540.31 L 646.85 1540.31 L 646.85 3.15 Z" /></g><g style="--ltx-fill-color:#E6E6FF;" fill="#E6E6FF" fill-opacity="1.0"><path style="stroke:none" d="M 3.15 1543.46 L 3.15 1563.64 L 646.85 1563.64 L 646.85 1543.46 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.83 1550.09)"><foreignobject style="--ltx-fo-width:37.98em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="525.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.F3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.98em;">
<span id="S4.F3.pic1.1.1" class="ltx_p"><span id="S4.F3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Comparison of Simple Heuristic and Enhanced Prompts</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.83 180.93)"><foreignobject style="--ltx-fo-width:43.68em;--ltx-fo-height:97.39em;--ltx-fo-depth:11.99em;font-size:10pt;" height="1513.56" overflow="visible" transform="matrix(1 0 0 -1 0 1347.59)" width="604.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.F3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.68em;">
<span id="S4.F3.pic1.p2" class="ltx_para">
<span id="S4.F3.pic1.p2.1" class="ltx_p ltx_align_center"><span id="S4.F3.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#000000;">Simple Heuristic Prompt</span></span>
<span id="S4.F3.pic1.p2.2" class="ltx_p"><span id="S4.F3.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Determine the <span id="S4.F3.pic1.p2.2.1.1" class="ltx_text ltx_font_bold">sentiment</span> and <span id="S4.F3.pic1.p2.2.1.2" class="ltx_text ltx_font_bold">stance</span> of the Twitter text related to Brett Kavanaugh’s Supreme Court confirmation.</span></span>
<span id="S4.F3.pic1.p2.3" class="ltx_p"><span id="S4.F3.pic1.p2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure your evaluation clearly differentiates between the <span id="S4.F3.pic1.p2.3.1.1" class="ltx_text ltx_font_bold">emotional sentiment</span> and the <span id="S4.F3.pic1.p2.3.1.2" class="ltx_text ltx_font_bold">political stance</span>.</span></span>
</span>
<span id="S4.F3.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_rule" style="width:436.8pt;height:1.0pt;--ltx-bg-color:black;display:inline-block;"> </span>
</span>
<span id="S4.F3.pic1.p3" class="ltx_para">
<span id="S4.F3.pic1.p3.1" class="ltx_p ltx_align_center"><span id="S4.F3.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#000000;">Enhanced Prompt</span></span>
<span id="S4.F3.pic1.p3.2" class="ltx_p"><span id="S4.F3.pic1.p3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given Twitter text about Brett Kavanaugh’s confirmation. Your task is to determine both the <span id="S4.F3.pic1.p3.2.1.1" class="ltx_text ltx_font_bold">sentiment</span> (positive or negative) and the <span id="S4.F3.pic1.p3.2.1.2" class="ltx_text ltx_font_bold">stance</span> (support or oppose).</span></span>
<span id="S4.F3.pic1.p3.3" class="ltx_p"><span id="S4.F3.pic1.p3.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Guidelines:<span id="S4.F3.pic1.p3.3.1.1" class="ltx_text"></span></span></span>
<span id="S4.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i1.p1" class="ltx_para">
<span id="S4.I1.i1.p1.1" class="ltx_p"><span id="S4.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sentiment</span><span id="S4.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Assess the emotional tone, either </span><span id="S4.I1.i1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#BF0040;">positive</span><span id="S4.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> (e.g., </span><span id="S4.I1.i1.p1.1.5" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#BF0040;">approval</span><span id="S4.I1.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">) or </span><span id="S4.I1.i1.p1.1.7" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#BF0040;">negative</span><span id="S4.I1.i1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> (e.g., </span><span id="S4.I1.i1.p1.1.9" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#BF0040;">condemnation</span><span id="S4.I1.i1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">), based on the language used.</span></span>
</span></span>
<span id="S4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i2.p1" class="ltx_para">
<span id="S4.I1.i2.p1.1" class="ltx_p"><span id="S4.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Stance</span><span id="S4.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Identify the political position regarding Kavanaugh’s confirmation, either </span><span id="S4.I1.i2.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#008080;">support</span><span id="S4.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> (e.g., advocating for or defending the confirmation) or </span><span id="S4.I1.i2.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#008080;">oppose</span><span id="S4.I1.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> (e.g., arguing against or resisting the confirmation).</span></span>
</span></span>
<span id="S4.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i3.p1" class="ltx_para">
<span id="S4.I1.i3.p1.1" class="ltx_p"><span id="S4.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Note</span><span id="S4.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Sentiment and stance may not always align. For example, a </span><span id="S4.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#BF0040;">positive emotional tone</span><span id="S4.I1.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> may still reflect an </span><span id="S4.I1.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#008080;">opposing stance</span><span id="S4.I1.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, while a </span><span id="S4.I1.i3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#BF0040;">negative tone</span><span id="S4.I1.i3.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> could </span><span id="S4.I1.i3.p1.1.9" class="ltx_text" style="--ltx-fg-color:#008080;">support</span><span id="S4.I1.i3.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> confirmation.</span></span>
</span></span>
</span>
<span id="S4.F3.pic1.p3.4" class="ltx_p"><span id="S4.F3.pic1.p3.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Key Indicators:<span id="S4.F3.pic1.p3.4.1.1" class="ltx_text"></span></span></span>
<span id="S4.I2" class="ltx_itemize ltx_leftmargin_flush">
<span id="S4.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I2.i1.p1" class="ltx_para">
<span id="S4.I2.i1.p1.1" class="ltx_p"><span id="S4.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#BF0040;">Positive Sentiment</span><span id="S4.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Words indicating </span><span id="S4.I2.i1.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#BF0040;">happiness</span><span id="S4.I2.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> or </span><span id="S4.I2.i1.p1.1.5" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#BF0040;">affirmation</span><span id="S4.I2.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S4.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I2.i2.p1" class="ltx_para">
<span id="S4.I2.i2.p1.1" class="ltx_p"><span id="S4.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#BF0040;">Negative Sentiment</span><span id="S4.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Words indicating </span><span id="S4.I2.i2.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#BF0040;">condemnation</span><span id="S4.I2.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> or </span><span id="S4.I2.i2.p1.1.5" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#BF0040;">anger</span><span id="S4.I2.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S4.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I2.i3.p1" class="ltx_para">
<span id="S4.I2.i3.p1.1" class="ltx_p"><span id="S4.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#008080;">Support Stance</span><span id="S4.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Text that defends, advocates for, or agrees with Kavanaugh’s confirmation.</span></span>
</span></span>
<span id="S4.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I2.i4.p1" class="ltx_para">
<span id="S4.I2.i4.p1.1" class="ltx_p"><span id="S4.I2.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#008080;">Oppose Stance</span><span id="S4.I2.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Text that criticizes, argues against, or resists Kavanaugh’s confirmation.</span></span>
</span></span>
</span>
<span id="S4.F3.pic1.p3.5" class="ltx_p"><span id="S4.F3.pic1.p3.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Special Cases:<span id="S4.F3.pic1.p3.5.1.1" class="ltx_text"></span></span></span>
<span id="S4.I3" class="ltx_itemize ltx_leftmargin_flush">
<span id="S4.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I3.i1.p1" class="ltx_para">
<span id="S4.I3.i1.p1.1" class="ltx_p"><span id="S4.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Humor or lighthearted criticism of the confirmation process itself, rather than the nominee, may indicate a </span><span id="S4.I3.i1.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#BF0040;">positive sentiment</span><span id="S4.I3.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> but an </span><span id="S4.I3.i1.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#008080;">opposing stance</span><span id="S4.I3.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S4.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I3.i2.p1" class="ltx_para">
<span id="S4.I3.i2.p1.1" class="ltx_p"><span id="S4.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Criticism of Kavanaugh’s opponents or the process, rather than Kavanaugh himself, may suggest </span><span id="S4.I3.i2.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#BF0040;">negative sentiment</span><span id="S4.I3.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> but a </span><span id="S4.I3.i2.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#008080;">supportive stance</span><span id="S4.I3.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span id="S4.F3.pic1.p3.6" class="ltx_p"><span id="S4.F3.pic1.p3.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Examples:<span id="S4.F3.pic1.p3.6.1.1" class="ltx_text"></span></span></span>
<span id="S4.I4" class="ltx_itemize ltx_leftmargin_flush">
<span id="S4.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I4.i1.p1" class="ltx_para">
<span id="S4.I4.i1.p1.1" class="ltx_p"><span id="S4.I4.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Positive, Support</span><span id="S4.I4.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: ”Kavanaugh is a great choice, he should be confirmed.”</span></span>
</span></span>
<span id="S4.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I4.i2.p1" class="ltx_para">
<span id="S4.I4.i2.p1.1" class="ltx_p"><span id="S4.I4.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Positive, Oppose</span><span id="S4.I4.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: ”Glad to see the protests against Kavanaugh.”</span></span>
</span></span>
<span id="S4.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I4.i3.p1" class="ltx_para">
<span id="S4.I4.i3.p1.1" class="ltx_p"><span id="S4.I4.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Negative, Support</span><span id="S4.I4.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: ”This investigation is unfair, but Kavanaugh will be confirmed.”</span></span>
</span></span>
<span id="S4.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I4.i4.p1" class="ltx_para">
<span id="S4.I4.i4.p1.1" class="ltx_p"><span id="S4.I4.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Negative, Oppose</span><span id="S4.I4.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: ”Kavanaugh’s actions are disqualifying, he should not be confirmed.”</span></span>
</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>