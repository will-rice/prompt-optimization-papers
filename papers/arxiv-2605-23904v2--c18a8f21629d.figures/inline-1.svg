<svg id="p4.pic1" class="ltx_picture" height="486.18" overflow="visible" version="1.1" viewbox="0 0 661.02 486.18" width="661.02"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,486.18) matrix(1 0 0 -1 0 0)"><g fill-opacity="0.06" stroke-opacity="0.06"><path style="stroke:none" d="M 3.54 9.99 L 3.54 469.1 C 3.54 476.58 9.6 482.64 17.08 482.64 L 651.03 482.64 C 658.51 482.64 664.57 476.58 664.57 469.1 L 664.57 9.99 C 664.57 2.52 658.51 -3.54 651.03 -3.54 L 17.08 -3.54 C 9.6 -3.54 3.54 2.52 3.54 9.99 Z" /></g><g style="--ltx-fill-color:#F1F5F9;" fill="#F1F5F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 11.76 L 0.69 474.42 C 0.69 480.53 5.65 485.49 11.76 485.49 L 649.26 485.49 C 655.38 485.49 660.33 480.53 660.33 474.42 L 660.33 11.76 C 660.33 5.65 655.38 0.69 649.26 0.69 L 11.76 0.69 C 5.65 0.69 0.69 5.65 0.69 11.76 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 28.25 30.4)"><foreignobject style="--ltx-fo-width:43.69em;--ltx-fo-height:30.9em;--ltx-fo-depth:0.16em;font-size:10pt;" height="429.68" overflow="visible" transform="matrix(1 0 0 -1 0 427.53)" width="604.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.69em;">
<span id="p4.pic1.1.1" class="ltx_p ltx_align_left"><span id="p4.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Agent skills today are hand-crafted, generated one-shot, or evolved through loosely controlled self-revision—none of which behaves like a deep-learning optimizer for the skill, and none of which reliably improves over its starting point under feedback. We argue the skill should instead be <em id="p4.pic1.1.1.1.1" class="ltx_emph ltx_font_italic">trained</em> as the external state of a frozen agent, with the same discipline that makes weight-space optimization reproducible. <span id="p4.pic1.1.1.1.2" class="ltx_text ltx_font_smallcaps">SkillOpt</span> is, to our knowledge, the first systematic <em id="p4.pic1.1.1.1.3" class="ltx_emph ltx_font_italic">controllable</em> text-space optimizer for agent skills: a separate optimizer model turns scored rollouts into bounded add/delete/replace edits on a single skill document, and an edit is accepted only when it strictly improves a held-out validation score. A textual learning-rate budget, rejected-edit buffer, and epoch-wise slow/meta update make skill training stable while adding zero inference-time model calls at deployment. Across six benchmarks, seven target models, and three execution harnesses (direct chat, Codex, Claude Code), <span id="p4.pic1.1.1.1.4" class="ltx_text ltx_font_smallcaps">SkillOpt</span> is best or tied on <span id="p4.pic1.1.1.1.5" class="ltx_text ltx_font_bold">all 52 evaluated (model, benchmark, harness) cells</span> and beats every per-cell competitor among human, one-shot LLM, Trace2Skill, TextGrad, GEPA, and EvoSkill skills. On GPT–5.5 it lifts the average no-skill accuracy by <math id="p4.pic1.m1" class="ltx_Math" alttext="\mathbf{+23.5}" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" class="ltx_mathvariant_bold" mathcolor="#000000" mathvariant="bold">23.5</mn></mrow><annotation encoding="application/x-tex">\mathbf{+23.5}</annotation></semantics></math> points in direct chat, by <math id="p4.pic1.m2" class="ltx_Math" alttext="+24.8" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">24.8</mn></mrow><annotation encoding="application/x-tex">+24.8</annotation></semantics></math> inside the Codex agentic loop, and by <math id="p4.pic1.m3" class="ltx_Math" alttext="+19.1" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">19.1</mn></mrow><annotation encoding="application/x-tex">+19.1</annotation></semantics></math> inside Claude Code. Transfer experiments further show that optimized skill artifacts retain value when moved across model scales, between Codex and Claude Code execution environments, and to a nearby math benchmark without further optimization.</span></span>
<span id="p4.pic1.1.2" class="ltx_p ltx_align_left"><span id="p4.pic1.1.2.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:90%;--ltx-fg-color:#2563EB;">Code:</span><span id="p4.pic1.1.2.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> <a href="https://aka.ms/SkillOpt" title class="ltx_ref ltx_href">https://aka.ms/SkillOpt</a></span></span>
