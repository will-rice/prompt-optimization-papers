<span id="A3.p2.p3.pic1.p1" class="ltx_para ltx_align_left ltx_noindent">
<span id="A3.p2.p3.pic1.p1.1" class="ltx_p"><span id="A3.p2.p3.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">System directive</span><span id="A3.p2.p3.pic1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A3.p2.p3.pic1.p1.1.3" class="ltx_text ltx_font_smallcaps" style="font-size:80%;--ltx-fg-color:#B23A3A;">learnable</span><span id="A3.p2.p3.pic1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> 
You are a structured critic for a prompt optimization system. You will be given the task input, the composed prompt, the executor response, and the reference answer. Emit a structured natural-language verdict identifying ALL behavioral failures in the response.</span></span>
</span>
<span id="A3.p2.p3.pic1.p2" class="ltx_para ltx_align_left ltx_noindent">
<span id="A3.p2.p3.pic1.p2.1" class="ltx_p"><span id="A3.p2.p3.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Evaluation criteria</span><span id="A3.p2.p3.pic1.p2.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A3.p2.p3.pic1.p2.1.3" class="ltx_text ltx_font_smallcaps" style="font-size:80%;--ltx-fg-color:#B23A3A;">learnable</span><span id="A3.p2.p3.pic1.p2.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> 
Evaluation Priorities: 1. Task Completion: Does the prompt lead to correct task completion? 2. Clarity: Is the prompt clear and unambiguous? 3. Efficiency: Is the prompt concise without losing effectiveness? 4. Robustness: Would the prompt work for variations of the task? 5. Reasoning Quality: Does the prompt elicit good reasoning?</span></span>
</span>
<span id="A3.p2.p3.pic1.p3" class="ltx_para ltx_align_left ltx_noindent">
<span id="A3.p2.p3.pic1.p3.1" class="ltx_p"><span id="A3.p2.p3.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">User template</span><span id="A3.p2.p3.pic1.p3.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A3.p2.p3.pic1.p3.1.3" class="ltx_text ltx_font_smallcaps" style="font-size:80%;--ltx-fg-color:#737373;">fixed</span><span id="A3.p2.p3.pic1.p3.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> 
Task: </span><span id="A3.p2.p3.pic1.p3.1.5" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{task}</span><span id="A3.p2.p3.pic1.p3.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Prompt: </span><span id="A3.p2.p3.pic1.p3.1.7" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{prompt}</span><span id="A3.p2.p3.pic1.p3.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Response: </span><span id="A3.p2.p3.pic1.p3.1.9" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{response}</span><span id="A3.p2.p3.pic1.p3.1.10" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A3.p2.p3.pic1.p3.1.11" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{ground_truth_section}</span><span id="A3.p2.p3.pic1.p3.1.12" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Rate this prompt’s effectiveness. Output ONLY this JSON schema:</span></span>
</span>
