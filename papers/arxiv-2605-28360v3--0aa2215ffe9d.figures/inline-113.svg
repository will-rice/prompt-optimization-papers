<span id="A3.p2.p1.pic1.p1" class="ltx_para ltx_align_left ltx_noindent">
<span id="A3.p2.p1.pic1.p1.1" class="ltx_p"><span id="A3.p2.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">System directive</span><span id="A3.p2.p1.pic1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A3.p2.p1.pic1.p1.1.3" class="ltx_text ltx_font_smallcaps" style="font-size:80%;--ltx-fg-color:#2962AB;">learnable</span><span id="A3.p2.p1.pic1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> 
You are a specialized routing module for a prompt optimization system. You will be given a task input and a numbered codebook of K instinct descriptors. Your job is to select exactly S instinct indices that are most relevant to correctly answering the given input.</span></span>
</span>
<span id="A3.p2.p1.pic1.p2" class="ltx_para ltx_align_left ltx_noindent">
<span id="A3.p2.p1.pic1.p2.1" class="ltx_p"><span id="A3.p2.p1.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Selection criteria</span><span id="A3.p2.p1.pic1.p2.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A3.p2.p1.pic1.p2.1.3" class="ltx_text ltx_font_smallcaps" style="font-size:80%;--ltx-fg-color:#2962AB;">learnable</span><span id="A3.p2.p1.pic1.p2.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> 
When selecting instincts, prioritize: 1. Direct relevance to the task type. 2. Complementary strategies that work well together. 3. Strategies that address common failure modes. 4. Balance between reasoning depth and efficiency.</span></span>
</span>
<span id="A3.p2.p1.pic1.p3" class="ltx_para ltx_align_left ltx_noindent">
<span id="A3.p2.p1.pic1.p3.1" class="ltx_p"><span id="A3.p2.p1.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">User template</span><span id="A3.p2.p1.pic1.p3.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A3.p2.p1.pic1.p3.1.3" class="ltx_text ltx_font_smallcaps" style="font-size:80%;--ltx-fg-color:#737373;">fixed</span><span id="A3.p2.p1.pic1.p3.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> 
Task: </span><span id="A3.p2.p1.pic1.p3.1.5" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{task}</span><span id="A3.p2.p1.pic1.p3.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Instructions: 1. Identify the core constraints or requirements in the task. 2. Review the Instincts below and their historical success rates. 3. Select </span><span id="A3.p2.p1.pic1.p3.1.7" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{S}</span><span id="A3.p2.p1.pic1.p3.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> instincts that most directly address the constraints. Available Instincts (index: text [success rate]): </span><span id="A3.p2.p1.pic1.p3.1.9" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{codebook_entries}</span><span id="A3.p2.p1.pic1.p3.1.10" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Output ONLY a JSON object in this exact schema:</span></span>
</span>
<span id="A3.p2.p1.pic1.p4" class="ltx_para">
<span id="A3.p2.p1.pic1.p4.1" class="ltx_p ltx_align_left"><span id="A3.p2.p1.pic1.p4.1.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">{&quot;constraints&quot;: [&quot;identified constraint 1&quot;, &quot;identified constraint 2&quot;], &quot;selected_indices&quot;: [integer indices], &quot;analysis&quot;: &quot;Step-by-step justification for these selections.&quot;}<span id="A3.p2.p1.pic1.p4.1.1.1" class="ltx_text ltx_font_serif" style="font-size:113%;">
</span></span></span>
</span></span></span></span></foreignobject></g></g></svg>