<span id="A5.SS1.p2.p1.pic1.p1.1" class="ltx_p"><span id="A5.SS1.p2.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Input Task.</span><span id="A5.SS1.p2.p1.pic1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">  </span><span id="A5.SS1.p2.p1.pic1.p1.1.3" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">“Find the number of real roots of <math id="A5.SS1.p2.p1.pic1.p1.m1" class="ltx_Math" alttext="P(x)=x^{4}-4x^{3}+12x^{2}+x-1" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mrow><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><mo lspace="0em" rspace="0em">​</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msup></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn><mo lspace="0em" rspace="0em">​</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></