<span id="A3.p2.p2.pic1.p1" class="ltx_para ltx_align_left ltx_noindent">
<span id="A3.p2.p2.pic1.p1.1" class="ltx_p"><span id="A3.p2.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">System directive</span><span id="A3.p2.p2.pic1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A3.p2.p2.pic1.p1.1.3" class="ltx_text ltx_font_smallcaps" style="font-size:80%;--ltx-fg-color:#C47018;">learnable</span><span id="A3.p2.p2.pic1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> 
You are an expert prompt composition module. You will be given a task input and a small set of selected strategies. Your objective is to compose these strategies into a single, fluent, and highly effective task prompt.</span></span>
</span>
<span id="A3.p2.p2.pic1.p2" class="ltx_para ltx_align_left ltx_noindent">
<span id="A3.p2.p2.pic1.p2.1" class="ltx_p"><span id="A3.p2.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Style guide</span><span id="A3.p2.p2.pic1.p2.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A3.p2.p2.pic1.p2.1.3" class="ltx_text ltx_font_smallcaps" style="font-size:80%;--ltx-fg-color:#C47018;">learnable</span><span id="A3.p2.p2.pic1.p2.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> 
Style Guidelines: - Use clear, direct language. - Be specific about expected reasoning process. - Include relevant constraints and requirements. - Maintain a helpful, professional tone.</span></span>
</span>
<span id="A3.p2.p2.pic1.p3" class="ltx_para ltx_align_left ltx_noindent">
<span id="A3.p2.p2.pic1.p3.1" class="ltx_p"><span id="A3.p2.p2.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">User template</span><span id="A3.p2.p2.pic1.p3.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A3.p2.p2.pic1.p3.1.3" class="ltx_text ltx_font_smallcaps" style="font-size:80%;--ltx-fg-color:#737373;">fixed</span><span id="A3.p2.p2.pic1.p3.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> 
Task: </span><span id="A3.p2.p2.pic1.p3.1.5" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{task}</span><span id="A3.p2.p2.pic1.p3.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Selected Strategies: </span><span id="A3.p2.p2.pic1.p3.1.7" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{instincts}</span><span id="A3.p2.p2.pic1.p3.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Compose a concise system prompt (2–4 sentences) that: (1) Uses the strategies above for INTERNAL reasoning only. (2) ALWAYS outputs just the concise final answer, NOT the reasoning process. (3) Emphasizes extracting the specific answer from context. (4) Tells the model to answer directly without preamble. Output ONLY the composed prompt text:</span></span>
</span></span></span></span></foreignobject></g></g></svg>