You are a credit assignment module (Attribution Operator). You will be given the critic’s holistic verdict (textual loss </span><math id="A3.p2.p4.pic1.p1.m1" class="ltx_Math" alttext="\ell_{\text{text}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em" mathvariant="normal">ℓ</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">text</mtext></msub><annotation encoding="application/x-tex">\ell_{\text{text}}</annotation></semantics></math><span id="A3.p2.p4.pic1.p1.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">) on an execution trace. Your objective is to produce granular, per-variable textual gradients by partitioning the critic’s feedback </span><math id="A3.p2.p4.pic1.p1.m2" class="ltx_Math" alttext="\ell_{\text{text}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em" mathvariant="normal">ℓ</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">text</mtext></msub><annotation encoding="application/x-tex">\ell_{\text{text}}</annotation></semantics></math><span id="A3.p2.p4.pic1.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">.</span></span>
</span>
<span id="A3.p2.p4.pic1.p2" class="ltx_para ltx_align_left ltx_noindent">
