Critic’s Verdict (</span><math id="A3.p2.p4.pic1.p2.m1" class="ltx_Math" alttext="\ell_{\text{text}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em" mathvariant="normal">ℓ</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">text</mtext></msub><annotation encoding="application/x-tex">\ell_{\text{text}}</annotation></semantics></math><span id="A3.p2.p4.pic1.p2.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">) on the execution trace: &quot;</span><span id="A3.p2.p4.pic1.p2.1.6" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{critic_feedback}</span><span id="A3.p2.p4.pic1.p2.1.7" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">&quot; Analyze this verdict and partition the errors into three distinct modes. If a mode is not responsible for any error, leave its field as an empty string.</span></span>
