<span id="A5.SS1.p2.p4.pic1.p4" class="ltx_para ltx_noindent">
<span id="A5.SS1.p2.p4.pic1.p4.1" class="ltx_p"><span id="A5.SS1.p2.p4.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Generator-Composed Prompt</span><span id="A5.SS1.p2.p4.pic1.p4.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> 
Prioritise privacy preservation during processing. Detect and redact all personally identifiable information before summarisation, disclose only information necessary for the task, and annotate sensitive content categories to support downstream auditing.</span></span>
