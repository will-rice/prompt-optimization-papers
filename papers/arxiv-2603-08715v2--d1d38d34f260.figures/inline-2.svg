<span id="Ax1.p3.pic1.2.1" class="ltx_p"><span id="Ax1.p3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">You are an expert Verilog hardware engineer. Your task is to refine and clarify a given Verilog module specification to ensure it is complete, unambiguous, and suitable for implementation. The specification will be given to an Intern, who will implement the Verilog module based on your refined version. The refined specification should address any potential ambiguities, fill in missing details, and enhance clarity while preserving the original intent.
