<span id="A4.F7.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:15.04em;">
<span id="A4.F7.p1.pic1.2.1" class="ltx_p"><span id="A4.F7.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Role:<span id="A4.F7.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are an expert at extracting reusable procedural strategies from task solutions.</span></span></span>
<span id="A4.F7.p1.pic1.2.2" class="ltx_p"><span id="A4.F7.p1.pic1.2.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Given a task instruction and its solution code, extract a SKILL that describes the procedure pattern—the structural “how-to” that is NOT obvious from the instruction alone.</span></span>
<span id="A4.F7.p1.pic1.2.3" class="ltx_p"><span id="A4.F7.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Rules for a good skill:<span id="A4.F7.p1.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I1" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I1.i1.p1" class="ltx_para">
<span id="A4.I1.i1.p1.1" class="ltx_p"><span id="A4.I1.i1.p1.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Describe ONLY solving strategy and structural patterns: authentication flow, pagination/iteration, multi-step data retrieval, data transformation, output construction.</span></span>
</span></span>
<span id="A4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I1.i2.p1" class="ltx_para">
<span id="A4.I1.i2.p1.1" class="ltx_p"><span id="A4.I1.i2.p1.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Do NOT include task-specific info: no specific API names, field names, entity names, thresholds. </span><span id="A4.I1.i2.p1.1.2" class="ltx_text ltx_font_italic" style="font-size:70%;--ltx-fg-color:#000000;">Test: if someone can guess the original task from your skill alone, it is too specific.</span></span>
</span></span>
<span id="A4.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I1.i3.p1" class="ltx_para">
<span id="A4.I1.i3.p1.1" class="ltx_p"><span id="A4.I1.i3.p1.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Focus on NON-OBVIOUS structural knowledge.</span></span>
</span></span>
</span>
<span id="A4.F7.p1.pic1.2.4" class="ltx_p"><span id="A4.F7.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Output:<span id="A4.F7.p1.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> Valid SKILL.md with YAML frontmatter, followed by sections: Overview, When to Apply, Procedure, Key Patterns, Common Pitfalls.
<span id="A4.F7.p1.pic1.2.4.1.1.1" class="ltx_text"></span></span></span></span>
</span></span></span></foreignobject></g></g></svg>