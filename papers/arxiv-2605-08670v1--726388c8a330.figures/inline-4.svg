<span id="A3.F5.p6.pic1.1.3.6" class="ltx_p"><span id="A3.F5.p6.pic1.1.3.6.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">   for rest.</span></span>
<span id="A3.F5.p6.pic1.1.3.7" class="ltx_p"><span id="A3.F5.p6.pic1.1.3.7.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">- State Verification: post-update re-fetch to validate.</span></span>
<span id="A3.F5.p6.pic1.1.3.8" class="ltx_p"><span id="A3.F5.p6.pic1.1.3.8.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">
## Common Pitfalls</span></span>
<span id="A3.F5.p6.pic1.1.3.9" class="ltx_p"><span id="A3.F5.p6.pic1.1.3.9.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">- Failing to loop through all</span></span>
<span id="A3.F5.p6.pic1.1.3.10" class="ltx_p"><span id="A3.F5.p6.pic1.1.3.10.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">   pages, missing items.</span></span>
<span id="A3.F5.p6.pic1.1.3.11" class="ltx_p"><span id="A3.F5.p6.pic1.1.3.11.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">- Updating target incorrectly</span></span>
<span id="A3.F5.p6.pic1.1.3.12" class="ltx_p"><span id="A3.F5.p6.pic1.1.3.12.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">   or failing to exclude it</span></span>
