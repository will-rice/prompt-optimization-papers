<span id="A3.F5.p6.pic1.1.1.9" class="ltx_p"><span id="A3.F5.p6.pic1.1.1.9.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">   </span><span id="A3.F5.p6.pic1.1.1.9.2" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;--ltx-bg-color:#DCF5DC;">remaining items</span><span id="A3.F5.p6.pic1.1.1.9.3" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">.
</span></span>
</span>
<span id="A3.F5.p6.pic1.1.2" class="ltx_block ltx_minipage ltx_align_top" style="width:98.7pt;">
<span id="A3.F5.p6.pic1.1.2.1" class="ltx_p"><span id="A3.F5.p6.pic1.1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">## Procedure</span></span>
<span id="A3.F5.p6.pic1.1.2.2" class="ltx_p"><span id="A3.F5.p6.pic1.1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">1. Authenticate: Retrieve token.</span></span>
<span id="A3.F5.p6.pic1.1.2.3" class="ltx_p"><span id="A3.F5.p6.pic1.1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">2. Paginate and Collect: Loop until empty to collect all.</span></span>
<span id="A3.F5.p6.pic1.1.2.4" class="ltx_p"><span id="A3.F5.p6.pic1.1.2.4.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">3. Identify Target: Find item by </span><span id="A3.F5.p6.pic1.1.2.4.2" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;--ltx-bg-color:#DCF5DC;">specific label</span><span id="A3.F5.p6.pic1.1.2.4.3" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">.</span></span>
<span id="A3.F5.p6.pic1.1.2.5" class="ltx_p"><span id="A3.F5.p6.pic1.1.2.5.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">4. Apply Specific Update:</span></span>
<span id="A3.F5.p6.pic1.1.2.6" class="ltx_p"><span id="A3.F5.p6.pic1.1.2.6.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">   Modify target (e.g., </span><span id="A3.F5.p6.pic1.1.2.6.2" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;--ltx-bg-color:#DCF5DC;">time shift</span><span id="A3.F5.p6.pic1.1.2.6.3" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">).</span></span>
<span id="A3.F5.p6.pic1.1.2.7" class="ltx_p"><span id="A3.F5.p6.pic1.1.2.7.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">5. Apply Bulk Update:</span></span>
<span id="A3.F5.p6.pic1.1.2.8" class="ltx_p"><span id="A3.F5.p6.pic1.1.2.8.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">   </span><span id="A3.F5.p6.pic1.1.2.8.2" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;--ltx-bg-color:#DCF5DC;">Disable</span><span id="A3.F5.p6.pic1.1.2.8.3" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;"> the rest.</span></span>
<span id="A3.F5.p6.pic1.1.2.9" class="ltx_p"><span id="A3.F5.p6.pic1.1.2.9.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">6. Verify: Re-fetch and confirm.
</span></span>
</span>
<span id="A3.F5.p6.pic1.1.3" class="ltx_block ltx_minipage ltx_align_top" style="width:98.7pt;">
<span id="A3.F5.p6.pic1.1.3.1" class="ltx_p"><span id="A3.F5.p6.pic1.1.3.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">## Key Patterns</span></span>
<span id="A3.F5.p6.pic1.1.3.2" class="ltx_p"><span id="A3.F5.p6.pic1.1.3.2.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">- Pagination Loop: while-loop,</span></span>
