<span id="A3.F5.p6.pic1.1.1.5" class="ltx_p"><span id="A3.F5.p6.pic1.1.1.5.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">- Task involves identifying one</span></span>
<span id="A3.F5.p6.pic1.1.1.6" class="ltx_p"><span id="A3.F5.p6.pic1.1.1.6.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">   item by a </span><span id="A3.F5.p6.pic1.1.1.6.2" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;--ltx-bg-color:#DCF5DC;">label or attribute</span><span id="A3.F5.p6.pic1.1.1.6.3" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">,</span></span>
