<span id="A3.F5.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:15.66em;">
<span id="A3.F5.p2.pic1.1.1" class="ltx_p"><span id="A3.F5.p2.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#B3B3B3;"># Section: STRATEGIES AND HARD RULES
<br class="ltx_break" style="--ltx-break-space:1.0pt;"><span id="A3.F5.p2.pic1.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">
Venmo Refund Workflow: When a task requires
<br class="ltx_break">refunding an accidental ‘payment request’
<br class="ltx_break">that was approved:
<br class="ltx_break"><span id="A3.F5.p2.pic1.1.1.1.1.1" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">(1) use show_sent_payment_requests</span>
<br class="ltx_break"><span id="A3.F5.p2.pic1.1.1.1.1.2" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">   with status=‘approved’</span>
<br class="ltx_break"><span id="A3.F5.p2.pic1.1.1.1.1.3" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">(2) filter by receiver’s email</span>
<br class="ltx_break"><span id="A3.F5.p2.pic1.1.1.1.1.4" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">(3) sort by created_at descending</span>
<br class="ltx_break"><span id="A3.F5.p2.pic1.1.1.1.1.5" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">(4) take the most recent request</span>
<br class="ltx_break"><span id="A3.F5.p2.pic1.1.1.1.1.6" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">(5) refund via create_transaction</span>
</span></span><span id="A3.F5.p2.pic1.1.1.2" class="ltx_text"></span></span>
</span></span></span></foreignobject></g></g></svg>