<span id="A4.F11.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.31em;">
<span id="A4.F11.pic1.1.1" class="ltx_p"><span id="A4.F11.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Gradient LLM System Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.52 452.26)"><foreignobject style="--ltx-fo-width:32.98em;--ltx-fo-height:0.63em;--ltx-fo-depth:32.03em;font-size:10pt;" height="451.78" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="456.35"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.98em;">
<span id="A4.F11.pic1.2.1" class="ltx_p"><span id="A4.F11.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Role:<span id="A4.F11.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are part of an optimization system that improves an induction agent prompt. The induction agent extracts procedural skills from task solutions. A deduction agent then uses these skills to reconstruct the solution.</span></span></span>
<span id="A4.F11.pic1.2.2" class="ltx_p"><span id="A4.F11.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Your job:<span id="A4.F11.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Analyze cases where quality was low, and give feedback on how to improve the induction agent prompt so it produces better skills.</span></span></span>
<span id="A4.F11.pic1.2.3" class="ltx_p"><span id="A4.F11.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Each case may include:<span id="A4.F11.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I6" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A4.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I6.i1.p1" class="ltx_para">
<span id="A4.I6.i1.p1.1" class="ltx_p"><span id="A4.I6.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Rubric scores</span><span id="A4.I6.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (0–10): GT-independence, actionability, transferability, conciseness, plus specific leaked claims flagged by the judge.</span></span>
</span></span>
<span id="A4.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I6.i2.p1" class="ltx_para">
<span id="A4.I6.i2.p1.1" class="ltx_p"><span id="A4.I6.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Reconstruction score/issues</span><span id="A4.I6.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: deduction agent’s trajectory vs. reference—shows what the deduction agent got wrong.</span></span>
</span></span>
<span id="A4.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I6.i3.p1" class="ltx_para">
<span id="A4.I6.i3.p1.1" class="ltx_p"><span id="A4.I6.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Execution result</span><span id="A4.I6.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: pass/fail with error messages.</span></span>
</span></span>
</span>
<span id="A4.F11.pic1.2.4" class="ltx_p"><span id="A4.F11.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Critical tradeoff:<span id="A4.F11.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> When execution fails because the deduction agent guessed the wrong field name, the naive fix is to write the correct name into the skill. </span>Do NOT endorse this.<span id="A4.F11.pic1.2.4.1.2" class="ltx_text ltx_font_medium"> It makes execution pass but destroys GT-independence. Better fix: improve the procedure wording so it guides the deduction agent to inspect API docs for the correct field, rather than hard-coding the field path.</span></span></span>
<span id="A4.F11.pic1.2.5" class="ltx_p"><span id="A4.F11.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output:<span id="A4.F11.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> Describe what to change in the induction agent prompt and why. Do NOT propose a new prompt.
<span id="A4.F11.pic1.2.5.1.1.1" class="ltx_text"></span></span></span></span>
</span></span></span></foreignobject></g></g></svg>