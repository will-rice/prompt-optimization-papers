<span id="A4.F9.pic1.1.1" class="ltx_p"><span id="A4.F9.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Skill Quality Rubric Prompt (<span id="A4.F9.pic1.1.1.1.1" class="ltx_text ltx_font_typewriter">RUBRIC_SYSTEM</span>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.52 568.49)"><foreignobject style="--ltx-fo-width:32.98em;--ltx-fo-height:0.63em;--ltx-fo-depth:40.43em;font-size:10pt;" height="568.02" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="456.35"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.98em;">
<span id="A4.F9.pic1.2.1" class="ltx_p"><span id="A4.F9.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Role:<span id="A4.F9.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You judge the quality of a procedural skill that will later be used by a coder who has NOT seen the reference solution.</span></span></span>
<span id="A4.F9.pic1.2.2" class="ltx_p"><span id="A4.F9.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">You are given:<span id="A4.F9.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A4.I2" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A4.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(1)</span> 
<span id="A4.I2.i1.p1" class="ltx_para">
<span id="A4.I2.i1.p1.1" class="ltx_p"><span id="A4.I2.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The task instruction (the same one the coder will see)</span></span>
</span></span>
<span id="A4.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(2)</span> 
<span id="A4.I2.i2.p1" class="ltx_para">
<span id="A4.I2.i2.p1.1" class="ltx_p"><span id="A4.I2.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The skill that was extracted from the (hidden) reference solution</span></span>
</span></span>
</span>
<span id="A4.F9.pic1.2.3" class="ltx_p"><span id="A4.F9.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">The Central Question:<span id="A4.F9.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> How much of this skill is useful procedural knowledge vs. leaked solution details?</span></span></span>
<span id="A4.F9.pic1.2.4" class="ltx_p"><span id="A4.F9.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">For each claim in the skill, classify it:<span id="A4.F9.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A4.I3" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A4.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(A)</span> 
<span id="A4.I3.i1.p1" class="ltx_para">
<span id="A4.I3.i1.p1.1" class="ltx_p"><span id="A4.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Standard convention</span><span id="A4.I3.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> — a general software pattern the coder can assume without context.</span></span>
</span></span>
<span id="A4.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(B)</span> 
<span id="A4.I3.i2.p1" class="ltx_para">
<span id="A4.I3.i2.p1.1" class="ltx_p"><span id="A4.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Inferable from instruction</span><span id="A4.I3.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> — derivable from the task text alone.</span></span>
</span></span>
<span id="A4.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(C)</span> 
<span id="A4.I3.i3.p1" class="ltx_para">
<span id="A4.I3.i3.p1.1" class="ltx_p"><span id="A4.I3.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Leaked from ground truth</span><span id="A4.I3.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> — unknowable without seeing the reference solution (exact API paths, specific algorithm choices, library decisions, hard-coded thresholds).</span></span>
</span></span>
</span>
<span id="A4.F9.pic1.2.5" class="ltx_p"><span id="A4.F9.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Score each dimension (0–10):<span id="A4.F9.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A4.I4" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A4.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I4.i1.p1" class="ltx_para">
<span id="A4.I4.i1.p1.1" class="ltx_p"><span id="A4.I4.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">GT-Independence</span><span id="A4.I4.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: fraction of content a developer could write from instruction alone.</span></span>
</span></span>
<span id="A4.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I4.i2.p1" class="ltx_para">
<span id="A4.I4.i2.p1.1" class="ltx_p"><span id="A4.I4.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Actionability</span><span id="A4.I4.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: can a coder use this + API docs to write working code?</span></span>
</span></span>
<span id="A4.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I4.i3.p1" class="ltx_para">
<span id="A4.I4.i3.p1.1" class="ltx_p"><span id="A4.I4.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Transferability</span><span id="A4.I4.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: would this apply to a structurally similar task in a different domain?</span></span>
</span></span>
<span id="A4.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A4.I4.i4.p1" class="ltx_para">
<span id="A4.I4.i4.p1.1" class="ltx_p"><span id="A4.I4.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Completeness</span><span id="A4.I4.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: full procedure chain covered?</span></span>
</span></span>
<span id="A4.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A4.I4.i5.p1" class="ltx_para">
<span id="A4.I4.i5.p1.1" class="ltx_p"><span id="A4.I4.i5.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Conciseness</span><span id="A4.I4.i5.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: information-dense, no redundant boilerplate?</span></span>
</span></span>
</span>
<span id="A4.F9.pic1.2.6" class="ltx_p"><span id="A4.F9.pic1.2.6.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output:<span id="A4.F9.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> JSON with per-dimension scores, leaked claims, and issue summary.
<span id="A4.F9.pic1.2.6.1.1.1" class="ltx_text"></span></span></span></span>
</span></span></span></foreignobject></g></g></svg>