<span id="A3.F6.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:15.66em;">
<span id="A3.F6.p3.pic1.1.1" class="ltx_p"><span id="A3.F6.p3.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">## Procedure
<br class="ltx_break">1. Inspect API docs for endpoints.
<br class="ltx_break">2. Authenticate and store token.
<br class="ltx_break">3. Read listing endpoint docs.
<br class="ltx_break">4. Paginate until empty, collect all.
<br class="ltx_break">5. Identify target by attribute.
<br class="ltx_break">6. Read update endpoint docs.
<br class="ltx_break">7. Update target with modification.
<br class="ltx_break">8. Bulk-update all non-target items.
<br class="ltx_break">9. Re-fetch and verify both conditions.
<br class="ltx_break">10. Mark task complete.
<br class="ltx_break" style="--ltx-break-space:3.0pt;">
## Key Patterns
<br class="ltx_break"><span id="A3.F6.p3.pic1.1.1.1.1" class="ltx_text" style="--ltx-bg-color:#FFE6C8;">- Doc-first execution</span>
<br class="ltx_break"><span id="A3.F6.p3.pic1.1.1.1.2" class="ltx_text" style="--ltx-bg-color:#FFE6C8;">- Credential bootstrap</span>
<br class="ltx_break"><span id="A3.F6.p3.pic1.1.1.1.3" class="ltx_text" style="--ltx-bg-color:#FFE6C8;">- Paginate-until-empty</span>
<br class="ltx_break"><span id="A3.F6.p3.pic1.1.1.1.4" class="ltx_text" style="--ltx-bg-color:#FFE6C8;">- Target-then-bulk</span>
<br class="ltx_break"><span id="A3.F6.p3.pic1.1.1.1.5" class="ltx_text" style="--ltx-bg-color:#FFE6C8;">- Verify-by-refetch</span>
</span><span id="A3.F6.p3.pic1.1.1.2" class="ltx_text"></span></span>
</span></span></span></foreignobject></g></g></svg>