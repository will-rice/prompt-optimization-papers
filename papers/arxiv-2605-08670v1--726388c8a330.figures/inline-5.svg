<span id="A3.F6.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:15.66em;">
<span id="A3.F6.p1.pic1.1.1" class="ltx_p"><span id="A3.F6.p1.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">## Procedure
<br class="ltx_break">1. Authenticate: Obtain access token.
<br class="ltx_break">2. Paginate and Collect: Loop pages
<br class="ltx_break">   until empty to collect all items.
<br class="ltx_break">3. Identify Target: Find item by label.
<br class="ltx_break">4. Apply Specific Update: Modify target.
<br class="ltx_break">5. Apply Bulk Update: Disable the rest.
<br class="ltx_break">6. Verify: Re-fetch and confirm.
<br class="ltx_break" style="--ltx-break-space:3.0pt;">
## Key Patterns
<br class="ltx_break"><span id="A3.F6.p1.pic1.1.1.1.1" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">- Pagination Loop: while-loop, break</span>
<br class="ltx_break"><span id="A3.F6.p1.pic1.1.1.1.2" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">   on empty page.</span>
<br class="ltx_break"><span id="A3.F6.p1.pic1.1.1.1.3" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">- Selective Mutation: unique update</span>
<br class="ltx_break"><span id="A3.F6.p1.pic1.1.1.1.4" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">   for target, uniform for rest.</span>
<br class="ltx_break"><span id="A3.F6.p1.pic1.1.1.1.5" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">- State Verification: post-update</span>
<br class="ltx_break"><span id="A3.F6.p1.pic1.1.1.1.6" class="ltx_text" style="--ltx-bg-color:#DCEBFC;">   re-fetch to validate.</span>
</span><span id="A3.F6.p1.pic1.1.1.2" class="ltx_text"></span></span>
</span></span></span></foreignobject></g></g></svg>