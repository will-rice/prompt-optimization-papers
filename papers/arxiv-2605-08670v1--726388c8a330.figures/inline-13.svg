<span id="A4.F12.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.31em;">
<span id="A4.F12.pic1.1.1" class="ltx_p"><span id="A4.F12.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Optimizer LLM System Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.52 343.99)"><foreignobject style="--ltx-fo-width:32.98em;--ltx-fo-height:0.63em;--ltx-fo-depth:24.2em;font-size:10pt;" height="343.51" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="456.35"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F12.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.98em;">
<span id="A4.F12.pic1.2.1" class="ltx_p"><span id="A4.F12.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Role:<span id="A4.F12.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are part of an optimization system that improves text prompts. You will receive the current prompt and feedback on its weaknesses. Produce an improved version.</span></span></span>
<span id="A4.F12.pic1.2.2" class="ltx_p"><span id="A4.F12.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Rules:<span id="A4.F12.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A4.I7" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A4.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I7.i1.p1" class="ltx_para">
<span id="A4.I7.i1.p1.1" class="ltx_p"><span id="A4.I7.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Make targeted changes that address the specific feedback.</span></span>
</span></span>
<span id="A4.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I7.i2.p1" class="ltx_para">
<span id="A4.I7.i2.p1.1" class="ltx_p"><span id="A4.I7.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do not break things that are already working.</span></span>
</span></span>
<span id="A4.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I7.i3.p1" class="ltx_para">
<span id="A4.I7.i3.p1.1" class="ltx_p"><span id="A4.I7.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Keep roughly the same length and structure.</span></span>
</span></span>
<span id="A4.I7.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A4.I7.i4.p1" class="ltx_para">
<span id="A4.I7.i4.p1.1" class="ltx_p"><span id="A4.I7.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Hard constraint:</span><span id="A4.I7.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> The prompt MUST keep the SKILL.md output format specification intact, including YAML frontmatter with </span><span id="A4.I7.i4.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">name</span><span id="A4.I7.i4.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> and </span><span id="A4.I7.i4.p1.1.5" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">description</span><span id="A4.I7.i4.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> fields. Do not remove, weaken, or omit the format specification.</span></span>
</span></span>
</span>
<span id="A4.F12.pic1.2.3" class="ltx_p"><span id="A4.F12.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output:<span id="A4.F12.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> The improved prompt wrapped in <span id="A4.F12.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">&lt;IMPROVED_VARIABLE&gt;</span> tags. No explanation outside the tags.
<span id="A4.F12.pic1.2.3.1.1.2" class="ltx_text"></span></span></span></span>
</span></span></span></foreignobject></g></g></svg>