<span id="A4.F7.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:15.04em;">
<span id="A4.F7.p2.pic1.2.1" class="ltx_p"><span id="A4.F7.p2.pic1.2.1.1" class="ltx_text ltx_font_italic" style="font-size:70%;--ltx-fg-color:#000000;">[Role and Rule 1 prefix unchanged]<span id="A4.F7.p2.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A4.F7.p2.pic1.2.2" class="ltx_p"><span id="A4.F7.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;--ltx-bg-color:#DCEBFC;">+ Identifier &amp; Scope Resolution:</span></span>
<span id="A4.F7.p2.pic1.2.3" class="ltx_p"><span id="A4.F7.p2.pic1.2.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Discover the correct data source via parent-container endpoint; inspect schema for the unique key field.</span></span>
<span id="A4.F7.p2.pic1.2.4" class="ltx_p"><span id="A4.F7.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;--ltx-bg-color:#DCEBFC;">+ Constraint-Based Data Filtering:</span></span>
<span id="A4.F7.p2.pic1.2.5" class="ltx_p"><span id="A4.F7.p2.pic1.2.5.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Construct subsets by hierarchy traversal; warn that a global “list all” may exceed the task scope.</span></span>
<span id="A4.F7.p2.pic1.2.6" class="ltx_p"><span id="A4.F7.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;--ltx-bg-color:#DCEBFC;">+ Output Construction &amp; Completion Signals:</span></span>
<span id="A4.F7.p2.pic1.2.7" class="ltx_p"><span id="A4.F7.p2.pic1.2.7.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Silent completion when no report is requested; describe structural schema (not values) when a report IS requested.</span></span>
<span id="A4.F7.p2.pic1.2.8" class="ltx_p"><span id="A4.F7.p2.pic1.2.8.1" class="ltx_text ltx_font_italic" style="font-size:70%;--ltx-fg-color:#000000;">[Rule 2 expanded with:]<span id="A4.F7.p2.pic1.2.8.1.1" class="ltx_text"></span></span></span>
<span id="A4.F7.p2.pic1.2.9" class="ltx_p"><span id="A4.F7.p2.pic1.2.9.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;--ltx-bg-color:#DCEBFC;">+ STRICT ABSTRACTION RULE:</span></span>
<span id="A4.F7.p2.pic1.2.10" class="ltx_p"><span id="A4.F7.p2.pic1.2.10.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Never include specific endpoints, field names, or boolean values.
<br class="ltx_break"><span id="A4.F7.p2.pic1.2.10.1.1" class="ltx_text ltx_font_bold">Bad:</span> “Call <span id="A4.F7.p2.pic1.2.10.1.2" class="ltx_text ltx_font_typewriter">show_song_privates</span> to check if <span id="A4.F7.p2.pic1.2.10.1.3" class="ltx_text ltx_font_typewriter">liked</span> is true.”
<br class="ltx_break"><span id="A4.F7.p2.pic1.2.10.1.4" class="ltx_text ltx_font_bold">Good:</span> “Call the endpoint that exposes user-specific state flags.”</span></span>
<span id="A4.F7.p2.pic1.2.11" class="ltx_p"><span id="A4.F7.p2.pic1.2.11.1" class="ltx_text ltx_font_italic" style="font-size:70%;--ltx-fg-color:#000000;">[+ Common Pitfalls scaffold with solution rules for: hallucinating endpoints, assuming global lists match constraints, parameter consistency.]<span id="A4.F7.p2.pic1.2.11.1.1" class="ltx_text ltx_font_upright">
