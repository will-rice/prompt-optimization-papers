<span id="A1.SS4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.17em;">
<span id="A1.SS4.p3.pic1.2.1" class="ltx_p"><span id="A1.SS4.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will answer a logical reasoning question.</span></span>
<span id="A1.SS4.p3.pic1.2.2" class="ltx_p"><span id="A1.SS4.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Be concise and direct in your reasoning. Avoid unnecessary introductions, restatements of the problem, or verbose explanations. Briefly explain why the correct answer is right and succinctly state why the incorrect options are wrong.</span></span>
<span id="A1.SS4.p3.pic1.2.3" class="ltx_p"><span id="A1.SS4.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The very last line of your response MUST be exactly of the following format: ’Answer: VALUE’ where VALUE is the zero-based numerical index of the correct answer. Do not add any extra spaces or characters to this final line.</span></span>
</span></span></span></foreignobject></g></g></svg>