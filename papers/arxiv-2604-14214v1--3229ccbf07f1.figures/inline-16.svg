<span id="A1.SS5.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.17em;">
<span id="A1.SS5.p1.pic1.2.1" class="ltx_p"><span id="A1.SS5.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert Prompt Engineer. 
<br class="ltx_break">
<br class="ltx_break">You will give feedback to a variable with the following role: <math id="A1.SS5.p1.pic1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>ROLE<math id="A1.SS5.p1.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> response from the language model <math id="A1.SS5.p1.pic1.m3" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/ROLE<math id="A1.SS5.p1.pic1.m4" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>. 
<br class="ltx_break">Here is an evaluation of the variable using a string-based function: 
<br class="ltx_break">
<br class="ltx_break">Function purpose: The runtime of string-based function that checks if the prediction is correct, where the answer is followed by &quot;Answer :&quot; 
<br class="ltx_break">
<br class="ltx_break"><math id="A1.SS5.p1.pic1.m5" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>INPUTS_TO_FUNCTION<math id="A1.SS5.p1.pic1.m6" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> {} 
<br class="ltx_break">
<br class="ltx_break"><span id="A1.SS5.p1.pic1.2.1.1.1" class="ltx_text ltx_font_bold">Ground truth answer(role: correct answer for the query)</span>: {} <math id="A1.SS5.p1.pic1.m7" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/INPUTS_TO_FUNCTION<math id="A1.SS5.p1.pic1.m8" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break"><math id="A1.SS5.p1.pic1.m9" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>OUTPUT_OF_FUNCTION<math id="A1.SS5.p1.pic1.m10" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> {} <math id="A1.SS5.p1.pic1.m11" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/OUTPUT_OF_FUNCTION<math id="A1.SS5.p1.pic1.m12" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break">Objective: Your goal is to give feedback and criticism to the variable given the above evaluation output. Our only goal is to improve the above metric, and nothing else. <math id="A1.SS5.p1.pic1.m13" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/OBJECTIVE_FUNCTION<math id="A1.SS5.p1.pic1.m14" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break">We are interested in giving feedback to the response from the language model for this conversation. Specifically, give feedback to the following span of text: 
<br class="ltx_break">
<br class="ltx_break"><math id="A1.SS5.p1.pic1.m15" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>VARIABLE<math id="A1.SS5.p1.pic1.m16" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> {} <math id="A1.SS5.p1.pic1.m17" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/VARIABLE<math id="A1.SS5.p1.pic1.m18" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break">Given the above history, describe how the response from the language model could be improved to improve the Objective. Be very creative, critical, and intelligent.</span></span>
