9.61)" width="230.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS6.p1.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">System Prompt Update Strategy</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:42.17em;--ltx-fo-height:37.89em;--ltx-fo-depth:0em;font-size:10pt;" height="524.35" overflow="visible" transform="matrix(1 0 0 -1 0 524.35)" width="583.51"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS6.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.17em;">
<span id="A1.SS6.p1.pic1.2.1" class="ltx_p"><span id="A1.SS6.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the role of the variable you will improve: 
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>ROLE<math id="A1.SS6.p1.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>structured system prompt to a somewhat capable language model that specifies the behavior and strategies for the QA task<math id="A1.SS6.p1.pic1.m3" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/ROLE<math id="A1.SS6.p1.pic1.m4" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">The variable is the text within the following span: 
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m5" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>VARIABLE<math id="A1.SS6.p1.pic1.m6" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> {current_system_prompt} <math id="A1.SS6.p1.pic1.m7" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/VARIABLE<math id="A1.SS6.p1.pic1.m8" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break">Here is the context and feedback we got for the variable: 
<br class="ltx_break">
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m9" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>CONTEXT<math id="A1.SS6.p1.pic1.m10" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break"><span id="A1.SS6.p1.pic1.2.1.1.1" class="ltx_text ltx_font_italic">(The following block repeats for each conversation in the dataset:)</span> 
<br class="ltx_break">
<br class="ltx_break">Here is a conversation: 
<br class="ltx_break">
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m11" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>CONVERSATION<math id="A1.SS6.p1.pic1.m12" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m13" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>LM_SYSTEM_PROMPT<math id="A1.SS6.p1.pic1.m14" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> {current_system_prompt} <math id="A1.SS6.p1.pic1.m15" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/LM_SYSTEM_PROMPT<math id="A1.SS6.p1.pic1.m16" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m17" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>LM_INPUT<math id="A1.SS6.p1.pic1.m18" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> {questions[i]} <math id="A1.SS6.p1.pic1.m19" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/LM_INPUT<math id="A1.SS6.p1.pic1.m20" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m21" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>LM_OUTPUT<math id="A1.SS6.p1.pic1.m22" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> {forward_response[i]} <math id="A1.SS6.p1.pic1.m23" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/LM_OUTPUT<math id="A1.SS6.p1.pic1.m24" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m25" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/CONVERSATION<math id="A1.SS6.p1.pic1.m26" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break">This conversation is potentially part of a larger system. The output is used as response from the language model 
<br class="ltx_break">
<br class="ltx_break">Here is the feedback we got for structured system prompt to a somewhat capable language model that specifies the behavior and strategies for the QA task in the conversation: 
<br class="ltx_break">
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m27" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>FEEDBACK<math id="A1.SS6.p1.pic1.m28" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">{feedback_response[i]} 
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m29" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/FEEDBACK<math id="A1.SS6.p1.pic1.m30" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m31" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>REGULARIZATION_FEEDBACK<math id="A1.SS6.p1.pic1.m32" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">{regularization_responses[i]} 
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m33" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/REGULARIZATION_FEEDBACK<math id="A1.SS6.p1.pic1.m34" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m35" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/CONTEXT<math id="A1.SS6.p1.pic1.m36" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break">Improve the variable (structured system prompt to a somewhat capable language model that specifies the behavior and strategies for the QA task) using the feedback provided in <math id="A1.SS6.p1.pic1.m37" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>FEEDBACK<math id="A1.SS6.p1.pic1.m38" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> and <math id="A1.SS6.p1.pic1.m39" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>REGULARIZATION_FEEDBACK<math id="A1.SS6.p1.pic1.m40" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> tags. 
<br class="ltx_break">Send the improved variable in the following format: 
<br class="ltx_break">
<br class="ltx_break"><math id="A1.SS6.p1.pic1.m41" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>IMPROVED_VARIABLE<math id="A1.SS6.p1.pic1.m42" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>{the improved variable}<math id="A1.SS6.p1.pic1.m43" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>/IMPROVED_VARIABLE<math id="A1.SS6.p1.pic1.m44" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break">
<br class="ltx_break">Send ONLY the improved variable between the <math id="A1.SS6.p1.pic1.m45" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>IMPROVED_VARIABLE<math id="A1.SS6.p1.pic1.m46" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> tags, and nothing else.</span></span>
