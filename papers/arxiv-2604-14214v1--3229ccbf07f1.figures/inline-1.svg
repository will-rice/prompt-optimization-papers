<span id="S4.T2.pic1.1.1" class="ltx_p"><span id="S4.T2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Qualitative comparison of generated reasoning traces on the GSM8K dataset.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 13.62)"><foreignobject style="--ltx-fo-width:43.83em;--ltx-fo-height:22em;--ltx-fo-depth:0.25em;font-size:10pt;" height="307.9" overflow="visible" transform="matrix(1 0 0 -1 0 304.44)" width="606.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.T2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.83em;">
<span id="S4.T2.pic1.2.1" class="ltx_p"><span id="S4.T2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input Query:<span id="S4.T2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Kylar went to the store to buy glasses for his new apartment. One glass costs $5, but every second glass costs only 60% of the price. Kylar wants to buy 16 glasses. How much does he need to pay for them?
<br class="ltx_break"></span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="S4.T2.pic1.2.2" class="ltx_p"><span id="S4.T2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1. Direct Prompting (No Reasoning)<span id="S4.T2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">68 
<br class="ltx_break"></span></span></span>
<span id="S4.T2.pic1.2.3" class="ltx_p ltx_align_right"><span id="S4.T2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FF0000;">✗Incorrect</span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="S4.T2.pic1.2.4" class="ltx_p"><span id="S4.T2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">2. Chain-of-Thought (Standard Verbosity)<span id="S4.T2.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Let the cost of one glass be $5. Every second glass costs 60% of the price, which is 0.6 * $5 = $3. Kylar wants to buy 16 glasses. We can group the glasses into pairs. There will be 16 / 2 = 8 pairs. Each pair consists of one glass at $5 and another at $3. The cost of each pair is $5 + $3 = $8. The total cost for 8 pairs is 8 * $8 = $64.
<br class="ltx_break"></span></span></span>
<span id="S4.T2.pic1.2.5" class="ltx_p ltx_align_right"><span id="S4.T2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#00B300;">✓Correct (128 tokens)</span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="S4.T2.pic1.2.6" class="ltx_p"><span id="S4.T2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3. CROP (Ours Compressed Reasoning)<span id="S4.T2.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">8 * 5 + 8 * (5 * 0.6) = 40 + 8 * 3 = 40 + 24 = 64 
<br class="ltx_break"></span></span></span>
<span id="S4.T2.pic1.2.7" class="ltx_p ltx_align_right"><span id="S4.T2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#00B300;">✓Correct (44 tokens)</span></span>
</span></span></span></foreignobject></g></g></svg>