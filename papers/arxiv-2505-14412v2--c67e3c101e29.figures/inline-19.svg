<span id="A9.F13.pic1.2.1" class="ltx_p"><span id="A9.F13.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In this task, you will be given a news article and asked to classify it into one of the four predefined categories: ’World’, ’Sports’,
’Business’, or ’Tech’. 
<br class="ltx_break">Follow these detailed instructions to ensure accurate classification
<br class="ltx_break">1. Read the article thoroughly to understand its main subject matter.
<br class="ltx_break">2. Determine which of the following categories the article’s main topic most closely aligns with:
<br class="ltx_break">- ’World’: articles covering global news, politics, international affairs, etc.
<br class="ltx_break">- ’Sports’: articles discussing various sports, competitions, athletes, etc.
<br class="ltx_break">- ’Business’: articles focusing on financial news, corporate activities, markets, etc.
<br class="ltx_break">- ’Tech’: articles about technology, innovations, companies, gadgets, etc.
<br class="ltx_break">3. If the article’s content is not clearly related to any of these categories, choose the closest option based on the predominant
subject matter.
<br class="ltx_break">4. Return the label of the chosen category as a single word without any additional text or explanations, e.g., ’World’, ’Sports’,
’Business’, or ’Tech’.
<br class="ltx_break">Example: 
<br class="ltx_break">Article: &quot;Apple Launches New iPhone Model with Improved Camera Features&quot; Label: Tech
<br class="ltx_break">Article: &quot;China and the US Reach a New Trade Agreement&quot; Label: World
<br class="ltx_break">Article: &quot;Local Soccer Team Qualifies for the World Cup&quot; Label: Sports
<br class="ltx_break">Article: &quot;Oil Prices Drop as OPEC Decides to Cut Production&quot; Label: Business</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.89 17.19)"><foreignobject style="--ltx-fo-width:45.92em;--ltx-fo-height:0em;--ltx-fo-depth:0em;font-size:10pt;" height="0" overflow="visible" transform="matrix(1 0 0 -1 0 0)" width="635.4"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
