<span id="A9.F14.pic1.2.1" class="ltx_p"><span id="A9.F14.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please perform a Question Classification task. Given a question, classify it into one of the following categories:
<br class="ltx_break">- **Description**: Questions asking for descriptions or explanations.
<br class="ltx_break">- **Entity**: Questions asking about specific things, objects, or entities.
<br class="ltx_break">- **Expression**: Questions asking about how something is expressed or phrased.
<br class="ltx_break">- **Human**: Questions asking about people, their characteristics, or roles.
<br class="ltx_break">- **Location**: Questions asking about places or geographical locations.
<br class="ltx_break">- **Number**: Questions asking for numerical information or quantities.
<br class="ltx_break">Return the label ’Description’, ’Entity’, ’Expression’, ’Human’, ’Location’, or ’Number’ only without any additional text.
Example: 
<br class="ltx_break">Question: &quot;What is the capital of France?&quot; Label: Location
<br class="ltx_break">Question: &quot;How do you say ’hello’ in Spanish?&quot; Label: Expression
<br class="ltx_break">Question: &quot;Who is the CEO of Apple?&quot; Label: Human</span></span>
