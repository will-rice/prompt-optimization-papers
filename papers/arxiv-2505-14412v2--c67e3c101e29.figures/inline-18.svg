<span id="A9.F12.pic1.2.1" class="ltx_p"><span id="A9.F12.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In this task, you are given sentences from movie reviews. Your goal is to classify the sentiment of each
sentence as ’terrible’, ’bad’, ’okay’, ’good’, or ’great’.
Be as accurate as possible. Here are the guidelines for each category:
<br class="ltx_break">- ’terrible’: The sentence expresses extreme dissatisfaction or negative feelings.
<br class="ltx_break">- ’bad’: The sentence conveys negative feelings but not as strongly as ’terrible’.
<br class="ltx_break">- ’okay’: The sentence is neutral or has mixed feelings with no strong positive or negative sentiment.
<br class="ltx_break">- ’good’: The sentence conveys positive feelings but not as strongly as ’great’.
<br class="ltx_break">- ’great’: The sentence expresses strong positive feelings or high satisfaction.
<br class="ltx_break">Consider the overall tone and specific positive or negative words in the sentence to determine the closest
sentiment.
<br class="ltx_break">If you are not sure, choose the closest option.
<br class="ltx_break">Return the label ’terrible’, ’bad’, ’okay’, ’good’, or ’great’ only without any additional text.</span></span>
