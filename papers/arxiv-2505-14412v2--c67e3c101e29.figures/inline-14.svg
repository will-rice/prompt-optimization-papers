<span id="A9.F8.pic1.2.1" class="ltx_p"><span id="A9.F8.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In this task, you are to classify the opinion in a given sentence from a review as either subjective or objective.
<br class="ltx_break">- A subjective sentence expresses personal feelings, opinions, or attitudes. 
<br class="ltx_break">- An objective sentence presents facts that can be verified and are not influenced by personal feelings. 
<br class="ltx_break">Examples: 
<br class="ltx_break">- Subjective: &quot;This movie is the best I’ve ever seen.&quot; (Opinion expressed) 
<br class="ltx_break">- Objective: &quot;The movie won five awards this year.&quot; (Fact stated) 
<br class="ltx_break">When classifying, focus only on the opinion, not the facts. Return the label ’subjective’ or ’objective’ only, without any additional text. Example: 
<br class="ltx_break">Input: &quot;The food was delicious.&quot; Output: subjective</span></span>
