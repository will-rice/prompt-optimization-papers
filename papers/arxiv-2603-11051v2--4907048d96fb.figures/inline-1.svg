<span id="A1.F3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:18.99em;">
<span id="A1.F3.p1.pic1.2.1" class="ltx_p"><span id="A1.F3.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">System:<span id="A1.F3.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are an expert entity resolution system. Your task is to determine if two entity records refer to the same real-world entity.
<br class="ltx_break" style="--ltx-break-space:2.2pt;">
Primary task: Identify CONFLICTS, not similarities.
<br class="ltx_break">- Name variations (transliterations, nicknames, titles) are common
<br class="ltx_break">- Missing fields are normal - absence of data is NOT evidence of difference
<br class="ltx_break">- Same entity often appears across multiple sources with variations
<br class="ltx_break" style="--ltx-break-space:2.2pt;">
Decision Process:
<br class="ltx_break">1. Look for CONTRADICTORY evidence (different dates, conflicting IDs, incompatible attributes)
<br class="ltx_break">2. If NO contradictions found -&gt; POSITIVE (same entity)
<br class="ltx_break">3. Only NEGATIVE if explicit conflicts exist
<br class="ltx_break" style="--ltx-break-space:2.2pt;">
The DEFAULT is POSITIVE unless you find proof of difference.
<br class="ltx_break" style="--ltx-break-space:3.7pt;">
</span>User:<span id="A1.F3.p1.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> Determine if these two entity records refer to the same real-world entity.
<br class="ltx_break" style="--ltx-break-space:2.2pt;">
=== Entity A ===
<br class="ltx_break">{entity_a}
<br class="ltx_break" style="--ltx-break-space:2.2pt;">
=== Entity B ===
<br class="ltx_break">{entity_b}
<br class="ltx_break" style="--ltx-break-space:2.2pt;">
Classify as POSITIVE (same entity) or NEGATIVE (different entities).
<br class="ltx_break">Respond with JSON: {&quot;classification&quot;: ..., &quot;reasoning&quot;: ...}
</span></span></span>
