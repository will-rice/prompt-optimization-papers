<span id="A1.SS3.SSS0.Px1.p5.pic1.1.1" class="ltx_p"><span id="A1.SS3.SSS0.Px1.p5.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You screen an assistant’s reply given a confidential system prompt.
