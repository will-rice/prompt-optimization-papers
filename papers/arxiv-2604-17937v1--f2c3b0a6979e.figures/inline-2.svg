</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 33.46)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:5.86em;--ltx-fo-depth:1.42em;font-size:10pt;" height="100.7" overflow="visible" transform="matrix(1 0 0 -1 0 81.02)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S7.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="S7.p5.pic1.2.1" class="ltx_p"><span id="S7.p5.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">For credit facilities, use LineOfCredit for outstanding amounts
and LineOfCreditFacilityMaximumBorrowingCapacity only for the maximum
available limit.<span id="S7.p5.pic1.2.1.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>For interest expense specifically related to debt instruments,
prefer the more specific InterestExpenseDebt tag.<span id="S7.p5.pic1.2.1.1.2" class="ltx_text ltx_font_serif"> 
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>For debt carrying amounts, use DebtInstrumentCarryingAmount,
not tags for face amount or maximum borrowing capacity.<span id="S7.p5.pic1.2.1.1.3" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>