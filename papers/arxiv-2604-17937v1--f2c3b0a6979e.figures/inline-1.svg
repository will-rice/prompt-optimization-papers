<br class="ltx_break"> </span>&lt;rule&gt;Output only the exact answer span without prefixes such as
‘‘The answer is’’, because token F1 scoring penalizes every extra token.&lt;/rule&gt;<span id="S4.SS5.p3.pic1.2.1.1.2" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"> </span>&lt;rule&gt;Match the specificity level the question implies (species vs
genus, specific chemical vs category).&lt;/rule&gt;<span id="S4.SS5.p3.pic1.2.1.1.3" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>&lt;/always&gt;<span id="S4.SS5.p3.pic1.2.1.1.4" class="ltx_text ltx_font_serif"> 
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>&lt;branch condition=&quot;Question asks yes/no structure&quot;&gt;<span id="S4.SS5.p3.pic1.2.1.1.5" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"> </span>&lt;rule&gt;Return only ‘‘yes’’ or ‘‘no’’ with no additional text.&lt;/rule&gt;<span id="S4.SS5.p3.pic1.2.1.1.6" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span>&lt;/branch&gt;<span id="S4.SS5.p3.pic1.2.1.1.7" class="ltx_text ltx_font_serif"> 
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>&lt;branch condition=&quot;Question asks chronological comparison&quot;&gt;<span id="S4.SS5.p3.pic1.2.1.1.8" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"> </span>&lt;rule&gt;Return only the entity name without dates or temporal
