<svg id="A2.p3.pic1" class="ltx_picture" height="748.4" overflow="visible" version="1.1" viewbox="0 0 550 748.4" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,748.4) matrix(1 0 0 -1 0 0)"><g style="--ltx-stroke-color:#808080;--ltx-fill-color:#808080;--ltx-fg-color:#808080;" color="#808080" fill="#808080" fill-opacity="0.5" stroke="#808080" stroke-opacity="0.5"><path style="stroke:none" d="M 3.54 -3.54 L 3.54 738.16 C 3.54 741.86 6.54 744.86 10.24 744.86 L 546.85 744.86 C 550.55 744.86 553.54 741.86 553.54 738.16 L 553.54 -3.54 Z" /></g><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 743.48 C 0 746.2 2.2 748.4 4.92 748.4 L 545.08 748.4 C 547.8 748.4 550 746.2 550 743.48 L 550 0 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 0.98 0.98 L 0.98 724.72 L 549.02 724.72 L 549.02 0.98 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.67 733.1)"><foreignobject style="--ltx-fo-width:31.97em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="442.37"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.97em;">
<span id="A2.p3.pic1.1.1" class="ltx_p"><span id="A2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Experience Library Operations)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.67 16.25)"><foreignobject style="--ltx-fo-width:35.01em;--ltx-fo-height:50.35em;--ltx-fo-depth:0.25em;font-size:10pt;" height="700.12" overflow="visible" transform="matrix(1 0 0 -1 0 696.66)" width="484.44"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.01em;">
<span id="A2.p3.pic1.2.1" class="ltx_p"><span id="A2.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are managing an experience library for a multi-agent question answering system.
The library stores insights as structured entries of the form:</span></span>
<span id="A2.Ex15" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A2.Ex15.m1" class="ltx_Math" alttext="(\text{query\_profile }c,\ \text{insight }z,\ \text{utility }u)" display="block" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">query_profile </mtext><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">insight </mtext><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">z</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">utility </mtext><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(\text{query\_profile }c,\ \text{insight }z,\ \text{utility }u)</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A2.p3.pic1.2.2" class="ltx_p"><span id="A2.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">where utility <math id="A2.p3.pic1.m1" class="ltx_Math" alttext="u" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><annotation encoding="application/x-tex">u</annotation></semantics></math> reflects how often insight <math id="A2.p3.pic1.m2" class="ltx_Math" alttext="z" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">z</mi><annotation encoding="application/x-tex">z</annotation></semantics></math> has led to successful agent orchestration.</span></span>
<span id="A2.p3.pic1.2.3" class="ltx_p"><span id="A2.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Current experience library:<span id="A2.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">{current_library}</span></span></span>
<span id="A2.p3.pic1.2.4" class="ltx_p"><span id="A2.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">New insights extracted from the latest execution group:<span id="A2.p3.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">{new_insights}</span></span></span>
<span id="A2.p3.pic1.2.5" class="ltx_p"><span id="A2.p3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">For each new insight, decide the appropriate consolidation operation:<span id="A2.p3.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A2.I5" class="ltx_itemize">
<span id="A2.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I5.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i1.p1.1" class="ltx_p"><span id="A2.I5.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">ADD</span><span id="A2.I5.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Insert a distinct insight not covered by existing entries.</span></span>
</span></span>
<span id="A2.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I5.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i2.p1.1" class="ltx_p"><span id="A2.I5.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">MERGE</span><span id="A2.I5.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Combine semantically similar or complementary insights into a single, more complete entry.</span></span>
</span></span>
<span id="A2.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I5.i3.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i3.p1.1" class="ltx_p"><span id="A2.I5.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">PRUNE</span><span id="A2.I5.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Remove a lower-utility entry that conflicts with a higher-utility one.</span></span>
</span></span>
<span id="A2.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I5.i4.p1" class="ltx_para">
<span id="A2.I5.i4.p1.1" class="ltx_p"><span id="A2.I5.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">KEEP</span><span id="A2.I5.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Retain the current library without modification.</span></span>
</span></span>
</span>
<span id="A2.p3.pic1.2.6" class="ltx_p"><span id="A2.p3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Guidelines:<span id="A2.p3.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A2.I6" class="ltx_itemize">
<span id="A2.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I6.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I6.i1.p1.1" class="ltx_p"><span id="A2.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prefer </span><span id="A2.I6.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">MERGE</span><span id="A2.I6.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> over </span><span id="A2.I6.i1.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">ADD</span><span id="A2.I6.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> when insights share the same query type and recommend compatible strategies.</span></span>
</span></span>
<span id="A2.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I6.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I6.i2.p1.1" class="ltx_p"><span id="A2.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prefer </span><span id="A2.I6.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">PRUNE</span><span id="A2.I6.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> when entries provide contradictory guidance for the same query type and differ substantially in utility.</span></span>
</span></span>
<span id="A2.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I6.i3.p1" class="ltx_para">
<span id="A2.I6.i3.p1.1" class="ltx_p"><span id="A2.I6.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoid unbounded growth—consolidate aggressively to maintain generalizability.</span></span>
</span></span>
</span>
<span id="A2.p3.pic1.2.7" class="ltx_p"><span id="A2.p3.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Respond in the following JSON format:<span id="A2.p3.pic1.2.7.1.1" class="ltx_text"></span></span></span><pre id="A2.p3.pic1.2.8" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;operations&quot;: [
    {
      &quot;operation&quot;: &quot;ADD|MERGE|PRUNE|KEEP&quot;,
      &quot;new_insight&quot;: &quot;&lt;text of new insight&gt;&quot;,
      &quot;target_entry_ids&quot;: [&quot;&lt;id of existing entry if MERGE or PRUNE&gt;&quot;],
      &quot;merged_insight&quot;: &quot;&lt;combined insight text if MERGE, else null&gt;&quot;,
      &quot;rationale&quot;: &quot;&lt;one sentence explaining the decision&gt;&quot;
    },
    ...
  ]
}
</pre>
</span></span></span></foreignobject></g></g></svg>