<span id="A2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.01em;">
<span id="A2.p1.pic1.2.1" class="ltx_p"><span id="A2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an orchestrator managing a team of specialized agents for multi-hop
question answering. Your goal is to design an effective multi-agent execution topology
to answer the given query correctly. 
<br class="ltx_break" style="--ltx-break-space:5.7pt;">
<span id="A2.p1.pic1.2.1.1.1" class="ltx_text ltx_font_bold">You have access to the following agents:</span> 
<br class="ltx_break">{agent_descriptions}</span></span>
<span id="A2.p1.pic1.2.2" class="ltx_p"><span id="A2.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">You have retrieved the following relevant experiences from past executions:<span id="A2.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">{retrieved_experiences}</span></span></span>
<span id="A2.p1.pic1.2.3" class="ltx_p"><span id="A2.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Each experience entry has the format:<span id="A2.p1.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A2.I1" class="ltx_itemize">
<span id="A2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I1.i1.p1.1" class="ltx_p"><span id="A2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Query Type: {query_type}</span></span>
</span></span>
<span id="A2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I1.i2.p1.1" class="ltx_p"><span id="A2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Insight: {insight}</span></span>
</span></span>
<span id="A2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i3.p1" class="ltx_para">
<span id="A2.I1.i3.p1.1" class="ltx_p"><span id="A2.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Utility score: {utility}</span></span>
</span></span>
</span>
<span id="A2.p1.pic1.2.4" class="ltx_p"><span id="A2.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Given the query below, design a coordination topology by:<span id="A2.p1.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A2.I2" class="ltx_enumerate">
<span id="A2.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A2.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i1.p1.1" class="ltx_p"><span id="A2.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Selecting the subset of agents best suited to this query type.</span></span>
</span></span>
<span id="A2.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A2.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i2.p1.1" class="ltx_p"><span id="A2.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Specifying their execution order (sequential or parallel where appropriate).</span></span>
</span></span>
<span id="A2.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A2.I2.i3.p1" class="ltx_para">
<span id="A2.I2.i3.p1.1" class="ltx_p"><span id="A2.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Defining dependency relationships (which agent’s output feeds into which).</span></span>
</span></span>
</span>
<span id="A2.p1.pic1.2.5" class="ltx_p"><span id="A2.p1.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Query:<span id="A2.p1.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> {query}</span></span></span>
<span id="A2.p1.pic1.2.6" class="ltx_p"><span id="A2.p1.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Respond in the following JSON format:<span id="A2.p1.pic1.2.6.1.1" class="ltx_text"></span></span></span><pre id="A2.p1.pic1.2.7" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;query_profile&quot;: &quot;&lt;one-sentence characterization of query type&gt;&quot;,
  &quot;selected_agents&quot;: [&quot;&lt;agent_name&gt;&quot;, ...],
  &quot;execution_order&quot;: [
    {&quot;step&quot;: 1, &quot;agent&quot;: &quot;&lt;agent_name&gt;&quot;, &quot;depends_on&quot;: [],

    &quot;mode&quot;: &quot;sequential|parallel&quot;},
    ...
  ]
}
</pre>
