</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.67 15.49)"><foreignobject style="--ltx-fo-width:36.76em;--ltx-fo-height:36.47em;--ltx-fo-depth:0.19em;font-size:10pt;" height="507.32" overflow="visible" transform="matrix(1 0 0 -1 0 504.63)" width="508.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.76em;">
<span id="A2.p4.pic1.2.1" class="ltx_p"><span id="A2.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System Prompt:<span id="A2.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are responsible for managing and evolving the prompt of a single agent under strict length and structural constraints. Your task is to refine, optimize, and consolidate the agent’s prompt to ensure clarity, consistency, and adherence to operational and behavioral requirements. 
<br class="ltx_break" style="--ltx-break-space:5.7pt;"></span></span></span>
<span id="A2.p4.pic1.2.2" class="ltx_p"><span id="A2.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Prompt:<span id="A2.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"></span></span></span>
<span id="A2.p4.pic1.2.3" class="ltx_p"><span id="A2.p4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Current Agent Prompt:<span id="A2.p4.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"></span></span></span><pre id="A2.p4.pic1.2.4" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{CURRENT_PROMPT}
</pre>
<span id="A2.p4.pic1.2.5" class="ltx_p"><span id="A2.p4.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Proposed Operational Rules:<span id="A2.p4.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"></span></span></span><pre id="A2.p4.pic1.2.6" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{operational_rules}
</pre>
<span id="A2.p4.pic1.2.7" class="ltx_p"><span id="A2.p4.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Proposed Behavioral Principles:<span id="A2.p4.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"></span></span></span><pre id="A2.p4.pic1.2.8" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{behavioral_principles}
</pre>
<span id="A2.p4.pic1.2.9" class="ltx_p"><span id="A2.p4.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Constraints:<span id="A2.p4.pic1.2.9.1.1" class="ltx_text"></span></span></span>
<span id="A2.I7" class="ltx_enumerate">
<span id="A2.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A2.I7.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I7.i1.p1.1" class="ltx_p"><span id="A2.I7.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Limit the number of tactical rules to a maximum of </span><span id="A2.I7.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">K</span><span id="A2.I7.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A2.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A2.I7.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I7.i2.p1.1" class="ltx_p"><span id="A2.I7.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">All instructions must be internally consistent — no contradictions.</span></span>
</span></span>
<span id="A2.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A2.I7.i3.p1" class="ltx_para ltx_noindent">
<span id="A2.I7.i3.p1.1" class="ltx_p"><span id="A2.I7.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Preserve the agent’s core role definition and tool usage instructions</span></span>
</span></span>
<span id="A2.I7.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A2.I7.i4.p1" class="ltx_para ltx_noindent">
<span id="A2.I7.i4.p1.1" class="ltx_p"><span id="A2.I7.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Remove redundant, contradictory, or ambiguous instructions.</span></span>
</span></span>
<span id="A2.I7.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A2.I7.i5.p1" class="ltx_para ltx_noindent">
<span id="A2.I7.i5.p1.1" class="ltx_p"><span id="A2.I7.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Preserve essential operational and behavioral requirements.</span></span>
</span></span>
<span id="A2.I7.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A2.I7.i6.p1" class="ltx_para">
<span id="A2.I7.i6.p1.1" class="ltx_p"><span id="A2.I7.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure the updated prompt is concise, coherent, and actionable.</span></span>
</span></span>
</span>
<span id="A2.p4.pic1.2.10" class="ltx_p"><span id="A2.p4.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:<span id="A2.p4.pic1.2.10.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Produce a </span>prompt diff<span id="A2.p4.pic1.2.10.1.2" class="ltx_text ltx_font_medium"> that clearly indicates the modifications required to integrate the proposed rules and principles into the current agent prompt while satisfying the constraints above. Highlight additions, deletions, and replacements in a structured format.</span></span></span>
</span></span></span></foreignobject></g></g></svg>