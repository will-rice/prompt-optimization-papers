<span id="A2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.88em;">
<span id="A2.p2.pic1.2.1" class="ltx_p"><span id="A2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an orchestrator evaluating a group of multi-agent execution trajectories
for the same query. Your goal is to identify why some trajectories succeeded and
others failed, and extract generalizable insights to guide future orchestration.</span></span>
<span id="A2.p2.pic1.2.2" class="ltx_p"><span id="A2.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Query:<span id="A2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> {query} 
<br class="ltx_break"></span>Query type:<span id="A2.p2.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> {query_type}</span></span></span>
<span id="A2.p2.pic1.2.3" class="ltx_p"><span id="A2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The following {G} trajectories were executed, ranked by task performance (F1)
and then by efficiency (total tokens consumed):</span></span>
<span id="A2.p2.pic1.2.4" class="ltx_p"><span id="A2.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">{trajectory_group}</span></span>
<span id="A2.p2.pic1.2.5" class="ltx_p"><span id="A2.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Each trajectory entry includes:<span id="A2.p2.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A2.I3" class="ltx_itemize">
<span id="A2.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I3.i1.p1.1" class="ltx_p"><span id="A2.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Topology used (agents selected, execution order)</span></span>
</span></span>
<span id="A2.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I3.i2.p1.1" class="ltx_p"><span id="A2.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Per-agent actions, inputs and outputs</span></span>
</span></span>
<span id="A2.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i3.p1" class="ltx_para ltx_noindent">
<span id="A2.I3.i3.p1.1" class="ltx_p"><span id="A2.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Final answer produced</span></span>
</span></span>
<span id="A2.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i4.p1" class="ltx_para ltx_noindent">
<span id="A2.I3.i4.p1.1" class="ltx_p"><span id="A2.I3.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">F1 score: {f1}</span></span>
</span></span>
<span id="A2.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i5.p1" class="ltx_para">
<span id="A2.I3.i5.p1.1" class="ltx_p"><span id="A2.I3.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Total tokens consumed: {tokens}</span></span>
</span></span>
</span>
<span id="A2.p2.pic1.2.6" class="ltx_p"><span id="A2.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Perform a comparative analysis across the group:<span id="A2.p2.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A2.I4" class="ltx_enumerate">
<span id="A2.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A2.I4.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I4.i1.p1.1" class="ltx_p"><span id="A2.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify what the successful trajectories did differently from the failed ones.</span></span>
</span></span>
<span id="A2.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A2.I4.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I4.i2.p1.1" class="ltx_p"><span id="A2.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify which agents, orderings, or dependencies contributed to success or failure.</span></span>
</span></span>
<span id="A2.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A2.I4.i3.p1" class="ltx_para ltx_noindent">
<span id="A2.I4.i3.p1.1" class="ltx_p"><span id="A2.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify recurring failure patterns (e.g., incorrect agent selection, redundant steps, missing retrieval before reasoning).</span></span>
</span></span>
<span id="A2.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A2.I4.i4.p1" class="ltx_para">
<span id="A2.I4.i4.p1.1" class="ltx_p"><span id="A2.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Distill findings into concise, actionable insights applicable to future queries of the same type.</span></span>
</span></span>
</span>
<span id="A2.p2.pic1.2.7" class="ltx_p"><span id="A2.p2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Respond in the following JSON format:<span id="A2.p2.pic1.2.7.1.1" class="ltx_text"></span></span></span><pre id="A2.p2.pic1.2.8" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;success_factors&quot;: [&quot;&lt;factor&gt;&quot;, ...],
