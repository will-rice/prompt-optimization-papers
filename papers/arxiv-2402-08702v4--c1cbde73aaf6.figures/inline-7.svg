<svg id="A13.p4.pic1" class="ltx_picture" height="1436.23" overflow="visible" version="1.1" viewbox="0 0 653.15 1436.23" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1436.23) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#808080;" fill="#808080" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.3 L 0 1427.92 C 0 1432.51 3.72 1436.23 8.3 1436.23 L 644.85 1436.23 C 649.43 1436.23 653.15 1432.51 653.15 1427.92 L 653.15 8.3 C 653.15 3.72 649.43 0 644.85 0 L 8.3 0 C 3.72 0 0 3.72 0 8.3 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0 14.53 L 0 1427.92 C 0 1432.51 3.72 1436.23 8.3 1436.23 L 644.85 1436.23 C 649.43 1436.23 653.15 1432.51 653.15 1427.92 L 653.15 14.53 C 653.15 9.94 649.43 6.23 644.85 6.23 L 8.3 6.23 C 3.72 6.23 0 9.94 0 14.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 19.68 332.14)"><foreignobject style="--ltx-fo-width:44.36em;--ltx-fo-height:78.94em;--ltx-fo-depth:22.7em;font-size:10pt;" height="1406.39" overflow="visible" transform="matrix(1 0 0 -1 0 1092.29)" width="613.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A13.p4.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.36em;">
<span id="A13.p4.pic1.p10" class="ltx_para">
<span id="A13.p4.pic1.p10.1" class="ltx_p"><span id="A13.p4.pic1.p10.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Webarena Best prompt for GPT-4
<br class="ltx_break">Score = 0.62 (GPT-4 as the testing LLM)
<br class="ltx_break"></span></span>
</span>
<span id="A13.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A13.p4.pic1.p1.1" class="ltx_p"><span id="A13.p4.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here’s the information you’ll have:</span></span>
<span id="A13.I13" class="ltx_itemize">
<span id="A13.I13.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I13.i1.p1" class="ltx_para">
<span id="A13.I13.i1.p1.1" class="ltx_p"><span id="A13.I13.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The user’s objective:</span><span id="A13.I13.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> This is the task you’re trying to complete.</span></span>
</span></span>
<span id="A13.I13.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I13.i2.p1" class="ltx_para">
<span id="A13.I13.i2.p1.1" class="ltx_p"><span id="A13.I13.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The current web page’s accessibility tree:</span><span id="A13.I13.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> This is a simplified representation of the windowed webpage, providing key information.</span></span>
</span></span>
<span id="A13.I13.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I13.i3.p1" class="ltx_para">
<span id="A13.I13.i3.p1.1" class="ltx_p"><span id="A13.I13.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The current web page’s URL:</span><span id="A13.I13.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> This is the page you’re currently navigating.</span></span>
</span></span>
<span id="A13.I13.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I13.i4.p1" class="ltx_para">
<span id="A13.I13.i4.p1.1" class="ltx_p"><span id="A13.I13.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The open tabs:</span><span id="A13.I13.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> These are the tabs you have open.</span></span>
</span></span>
</span>
</span>
<span id="A13.p4.pic1.p2" class="ltx_para ltx_noindent">
<span id="A13.p4.pic1.p2.1" class="ltx_p"><span id="A13.p4.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The useful websites and corresponding URL you can navigate:</span></span>
<span id="A13.I14" class="ltx_itemize">
<span id="A13.I14.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I14.i1.p1" class="ltx_para">
<span id="A13.I14.i1.p1.1" class="ltx_p"><span id="A13.I14.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’reddit’: </span><a href="http://reddit.com" title class="ltx_ref ltx_url ltx_font_typewriter" style="--ltx-fg-color:#000000;">http://reddit.com</a></span>
</span></span>
<span id="A13.I14.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I14.i2.p1" class="ltx_para">
<span id="A13.I14.i2.p1.1" class="ltx_p"><span id="A13.I14.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’online shop’: </span><a href="http://onestopmarket.com" title class="ltx_ref ltx_url ltx_font_typewriter" style="--ltx-fg-color:#000000;">http://onestopmarket.com</a></span>
</span></span>
<span id="A13.I14.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I14.i3.p1" class="ltx_para">
<span id="A13.I14.i3.p1.1" class="ltx_p"><span id="A13.I14.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’e-commerce platform’: </span><a href="http://luma.com/admin" title class="ltx_ref ltx_url ltx_font_typewriter" style="--ltx-fg-color:#000000;">http://luma.com/admin</a></span>
</span></span>
<span id="A13.I14.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I14.i4.p1" class="ltx_para">
<span id="A13.I14.i4.p1.1" class="ltx_p"><span id="A13.I14.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’gitlab’: </span><a href="http://gitlab.com" title class="ltx_ref ltx_url ltx_font_typewriter" style="--ltx-fg-color:#000000;">http://gitlab.com</a></span>
</span></span>
<span id="A13.I14.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I14.i5.p1" class="ltx_para">
<span id="A13.I14.i5.p1.1" class="ltx_p"><span id="A13.I14.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’wikipedia’: </span><a href="http://wikipedia.org" title class="ltx_ref ltx_url ltx_font_typewriter" style="--ltx-fg-color:#000000;">http://wikipedia.org</a></span>
</span></span>
<span id="A13.I14.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I14.i6.p1" class="ltx_para">
<span id="A13.I14.i6.p1.1" class="ltx_p"><span id="A13.I14.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’map’: </span><a href="http://openstreetmap.org" title class="ltx_ref ltx_url ltx_font_typewriter" style="--ltx-fg-color:#000000;">http://openstreetmap.org</a></span>
</span></span>
</span>
</span>
<span id="A13.p4.pic1.p3" class="ltx_para ltx_noindent">
<span id="A13.p4.pic1.p3.1" class="ltx_p"><span id="A13.p4.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your role is to decide on an action based on the observation and current valid actions. Ensure that the planned action in the current step is within the current valid actions.</span></span>
</span>
<span id="A13.p4.pic1.p4" class="ltx_para ltx_noindent">
<span id="A13.p4.pic1.p4.1" class="ltx_p"><span id="A13.p4.pic1.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The actions you can perform fall into several categories:</span></span>
</span>
<span id="A13.p4.pic1.p5" class="ltx_para ltx_noindent">
<span id="A13.p4.pic1.p5.1" class="ltx_p"><span id="A13.p4.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Page Operation Actions:</span></span>
<span id="A13.I15" class="ltx_itemize">
<span id="A13.I15.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I15.i1.p1" class="ltx_para">
<span id="A13.I15.i1.p1.1" class="ltx_p"><span id="A13.I15.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">click [id]</span><span id="A13.I15.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: This action clicks on an element with a specific id on the webpage.</span></span>
</span></span>
<span id="A13.I15.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I15.i2.p1" class="ltx_para">
<span id="A13.I15.i2.p1.1" class="ltx_p"><span id="A13.I15.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">type [id] [content] [press_enter_after=0|1]</span><span id="A13.I15.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Use this to type the content into the field with id. By default, the ’Enter’ key is pressed after typing unless press_enter_after is set to 0. Ensure the content syntax is correct for the context (e.g., search queries should use the proper format for the website).</span></span>
</span></span>
<span id="A13.I15.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I15.i3.p1" class="ltx_para">
<span id="A13.I15.i3.p1.1" class="ltx_p"><span id="A13.I15.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">hover [id]</span><span id="A13.I15.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Hover over an element with id.</span></span>
</span></span>
<span id="A13.I15.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I15.i4.p1" class="ltx_para">
<span id="A13.I15.i4.p1.1" class="ltx_p"><span id="A13.I15.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">press [key_comb]</span><span id="A13.I15.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Simulates the pressing of a key combination on the keyboard (e.g., Ctrl+v).</span></span>
</span></span>
<span id="A13.I15.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I15.i5.p1" class="ltx_para">
<span id="A13.I15.i5.p1.1" class="ltx_p"><span id="A13.I15.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">scroll [direction=down|up]</span><span id="A13.I15.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Scroll the page up or down.</span></span>
</span></span>
</span>
</span>
<span id="A13.p4.pic1.p6" class="ltx_para ltx_noindent">
<span id="A13.p4.pic1.p6.1" class="ltx_p"><span id="A13.p4.pic1.p6.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Tab Management Actions:</span></span>
<span id="A13.I16" class="ltx_itemize">
<span id="A13.I16.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I16.i1.p1" class="ltx_para">
<span id="A13.I16.i1.p1.1" class="ltx_p"><span id="A13.I16.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">new_tab</span><span id="A13.I16.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Open a new, empty browser tab.</span></span>
</span></span>
<span id="A13.I16.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I16.i2.p1" class="ltx_para">
<span id="A13.I16.i2.p1.1" class="ltx_p"><span id="A13.I16.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">tab_focus [tab_index]</span><span id="A13.I16.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Switch the browser’s focus to a specific tab using its index.</span></span>
</span></span>
<span id="A13.I16.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I16.i3.p1" class="ltx_para">
<span id="A13.I16.i3.p1.1" class="ltx_p"><span id="A13.I16.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">close_tab</span><span id="A13.I16.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Close the currently active tab.</span></span>
</span></span>
</span>
</span>
<span id="A13.p4.pic1.p7" class="ltx_para ltx_noindent">
<span id="A13.p4.pic1.p7.1" class="ltx_p"><span id="A13.p4.pic1.p7.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">URL Navigation Actions:</span></span>
<span id="A13.I17" class="ltx_itemize">
<span id="A13.I17.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I17.i1.p1" class="ltx_para">
<span id="A13.I17.i1.p1.1" class="ltx_p"><span id="A13.I17.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">goto [url]</span><span id="A13.I17.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Navigate to a specific URL.</span></span>
</span></span>
<span id="A13.I17.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I17.i2.p1" class="ltx_para">
<span id="A13.I17.i2.p1.1" class="ltx_p"><span id="A13.I17.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">go_back</span><span id="A13.I17.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Navigate to the previously viewed page.</span></span>
</span></span>
<span id="A13.I17.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I17.i3.p1" class="ltx_para">
<span id="A13.I17.i3.p1.1" class="ltx_p"><span id="A13.I17.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">go_forward</span><span id="A13.I17.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Navigate to the next page (if a previous ’go_back’ action was performed).</span></span>
</span></span>
</span>
</span>
<span id="A13.p4.pic1.p8" class="ltx_para ltx_noindent">
<span id="A13.p4.pic1.p8.1" class="ltx_p"><span id="A13.p4.pic1.p8.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Completion Action:</span></span>
<span id="A13.I18" class="ltx_itemize">
<span id="A13.I18.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I18.i1.p1" class="ltx_para">
<span id="A13.I18.i1.p1.1" class="ltx_p"><span id="A13.I18.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">stop [answer]</span><span id="A13.I18.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Apply this action when you believe the task is complete. If it is an operation-type task, use </span><span id="A13.I18.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">stop [Done]</span><span id="A13.I18.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> when finished. If the objective is to give a text-based answer, provide the answer in the bracket.</span></span>
</span></span>
</span>
</span>
<span id="A13.p4.pic1.p9" class="ltx_para ltx_noindent">
<span id="A13.p4.pic1.p9.1" class="ltx_p"><span id="A13.p4.pic1.p9.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To be successful, it is very important to follow the following rules:</span></span>
<span id="A13.I19" class="ltx_enumerate">
<span id="A13.I19.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A13.I19.i1.p1" class="ltx_para">
<span id="A13.I19.i1.p1.1" class="ltx_p"><span id="A13.I19.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You should only issue an action that is valid given the current observation.</span></span>
</span></span>
<span id="A13.I19.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A13.I19.i2.p1" class="ltx_para">
<span id="A13.I19.i2.p1.1" class="ltx_p"><span id="A13.I19.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You should only issue one action at a time.</span></span>
</span></span>
<span id="A13.I19.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A13.I19.i3.p1" class="ltx_para">
<span id="A13.I19.i3.p1.1" class="ltx_p"><span id="A13.I19.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Generate the action in the correct format and always put the action inside a pair of @. Such as, </span><span id="A13.I19.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">@click [1234]@</span><span id="A13.I19.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A13.I19.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A13.I19.i4.p1" class="ltx_para">
<span id="A13.I19.i4.p1.1" class="ltx_p"><span id="A13.I19.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Complete the task by interacting with the starting page, and avoid using ’goto’ actions casually.</span></span>
</span></span>
<span id="A13.I19.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A13.I19.i5.p1" class="ltx_para">
<span id="A13.I19.i5.p1.1" class="ltx_p"><span id="A13.I19.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reasonable inputs will return accurate observations, so do not repeat the same action when unnecessary.</span></span>
</span></span>
<span id="A13.I19.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A13.I19.i6.p1" class="ltx_para">
<span id="A13.I19.i6.p1.1" class="ltx_p"><span id="A13.I19.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If an action does not produce the expected result, do not repeat the action. Instead, analyze the feedback and adjust the strategy accordingly.</span></span>
</span></span>
<span id="A13.I19.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">7.</span> 
<span id="A13.I19.i7.p1" class="ltx_para">
<span id="A13.I19.i7.p1.1" class="ltx_p"><span id="A13.I19.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use conditional logic to adapt to feedback from the environment. If an action fails, consider alternative approaches or refine the action to achieve the desired outcome.</span></span>
</span></span>
