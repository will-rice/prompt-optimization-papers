<span id="A3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.36em;">
<span id="A3.p2.pic1.1.1" class="ltx_p"><span id="A3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Meta-prompt of <math id="A3.p2.pic1.m1" class="ltx_Math" alttext="GenLLM" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi></mrow><annotation encoding="application/x-tex">GenLLM</annotation></semantics></math>
<br class="ltx_break"><span id="A3.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium">Imagine you are a prompt optimizer based on the feedback from the human and task execution feedback. Here is the prompt of task description: {prompt_task_explain}
<br class="ltx_break"></span></span></span>
<span id="A3.p2.pic1.1.2" class="ltx_p"><span id="A3.p2.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">However, the response generated from the initial task description prompt owns some errors. Here are the error feedback from humans: {error_feedback}
<br class="ltx_break"></span></span>
<span id="A3.p2.pic1.1.3" class="ltx_p"><span id="A3.p2.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">There is a list of former prompts including the current prompt, and each prompt is modified from its former prompts:{trajectory_prompts}
<br class="ltx_break"></span></span>
<span id="A3.p2.pic1.1.4" class="ltx_p"><span id="A3.p2.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on the feedback, think about why the task planning LLM agent makes the error and try to optimize the prompt of task description to avoid this error.
<br class="ltx_break"></span></span>
<span id="A3.p2.pic1.1.5" class="ltx_p"><span id="A3.p2.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">The new prompts should follow these guidelines: 1. The new prompts should solve the current prompt’s problems. 2. The new prompts should consider the list of prompts and evolve based on the current prompt.
<br class="ltx_break"></span></span>
<span id="A3.p2.pic1.1.6" class="ltx_p"><span id="A3.p2.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output the optimized prompt of task description without other texts:</span></span>
</span></span></span></foreignobject></g></g></svg>