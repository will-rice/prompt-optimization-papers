<span id="A13.I30.i1.p1.1" class="ltx_p"><span id="A13.I30.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">task</span><span id="A13.I30.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Recap your current objective.</span></span>
