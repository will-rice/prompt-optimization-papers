<svg id="A13.p8.pic1" class="ltx_picture" height="1295.59" overflow="visible" version="1.1" viewbox="0 0 653.15 1295.59" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1295.59) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#808080;" fill="#808080" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.3 L 0 1287.29 C 0 1291.87 3.72 1295.59 8.3 1295.59 L 644.85 1295.59 C 649.43 1295.59 653.15 1291.87 653.15 1287.29 L 653.15 8.3 C 653.15 3.72 649.43 0 644.85 0 L 8.3 0 C 3.72 0 0 3.72 0 8.3 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0 14.53 L 0 1287.29 C 0 1291.87 3.72 1295.59 8.3 1295.59 L 644.85 1295.59 C 649.43 1295.59 653.15 1291.87 653.15 1287.29 L 653.15 14.53 C 653.15 9.94 649.43 6.23 644.85 6.23 L 8.3 6.23 C 3.72 6.23 0 9.94 0 14.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 19.68 127.27)"><foreignobject style="--ltx-fo-width:44.36em;--ltx-fo-height:83.58em;--ltx-fo-depth:7.89em;font-size:10pt;" height="1265.75" overflow="visible" transform="matrix(1 0 0 -1 0 1156.52)" width="613.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A13.p8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.36em;">
<span id="A13.p8.pic1.1.1" class="ltx_p"><span id="A13.p8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scienceworld Human prompt
<br class="ltx_break">Score = 0.18 (GPT-3.5-turbo-16k-0613 as the testing LLM)
<br class="ltx_break">Score = 0.70 (GPT-4 as the testing LLM)
<br class="ltx_break"></span></span>
<span id="A13.p8.pic1.1.2" class="ltx_p"><span id="A13.p8.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an agent in a virtual science school environment, tasked to interact with various elements.</span></span>
<span id="A13.p8.pic1.1.3" class="ltx_p"><span id="A13.p8.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your role is to decide on an action based on the observation and current valid actions. Please ensure that any objects (‘{OBJ}‘) and locations (‘{LOC}‘) you mention in your response are present in the observation provided. Ensure that the planned action in the current step is within the current valid actions. Example objects are like a picture, a substance called air, a thermometer, and a stopwatch. Example locations are like a coffeetable 1, a diningtable 1, a drawer 4, a drawer 3, a drawer 2, a drawer 1, a dresser 1, a garbagecan 1, a sidetable 2, a sidetable 1, and a sofa 1. Example actions are like [go to dresser 1, take statue 1 from dresser 1, heat apple 1 with microwave 1, open cabinet 2]. Do not repeat the actions all the time! Learn from the previous action/observation history.
<br class="ltx_break"></span></span>
<span id="A13.p8.pic1.1.4" class="ltx_p"><span id="A13.p8.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here are the commands you can use:
<br class="ltx_break"></span></span>
<span id="A13.p8.pic1.1.5" class="ltx_p"><span id="A13.p8.pic1.1.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Manipulation:<span id="A13.p8.pic1.1.5.1.1" class="ltx_text"></span></span></span>
<span id="A13.I25" class="ltx_itemize">
<span id="A13.I25.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I25.i1.p1" class="ltx_para">
<span id="A13.I25.i1.p1.1" class="ltx_p"><span id="A13.I25.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">open {OBJ} / close {OBJ}</span><span id="A13.I25.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Interact with a container.</span></span>
</span></span>
<span id="A13.I25.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I25.i2.p1" class="ltx_para">
<span id="A13.I25.i2.p1.1" class="ltx_p"><span id="A13.I25.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">pick up {OBJ}</span><span id="A13.I25.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Add an object to your inventory.</span></span>
</span></span>
<span id="A13.I25.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I25.i3.p1" class="ltx_para">
<span id="A13.I25.i3.p1.1" class="ltx_p"><span id="A13.I25.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">put down {OBJ}</span><span id="A13.I25.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Remove an object from your inventory.</span></span>
</span></span>
<span id="A13.I25.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I25.i4.p1" class="ltx_para">
<span id="A13.I25.i4.p1.1" class="ltx_p"><span id="A13.I25.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">move {OBJ} to {OBJ}</span><span id="A13.I25.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Transfer an object.</span></span>
</span></span>
<span id="A13.I25.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I25.i5.p1" class="ltx_para">
<span id="A13.I25.i5.p1.1" class="ltx_p"><span id="A13.I25.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">pour {OBJ} into {OBJ}</span><span id="A13.I25.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Pour a substance.</span></span>
</span></span>
<span id="A13.I25.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I25.i6.p1" class="ltx_para">
<span id="A13.I25.i6.p1.1" class="ltx_p"><span id="A13.I25.i6.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">dunk {OBJ} into {OBJ}</span><span id="A13.I25.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Immerse a container in a liquid.</span></span>
</span></span>
<span id="A13.I25.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I25.i7.p1" class="ltx_para">
<span id="A13.I25.i7.p1.1" class="ltx_p"><span id="A13.I25.i7.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">mix {OBJ}</span><span id="A13.I25.i7.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Chemically combine contents.</span></span>
</span></span>
</span>
<span id="A13.p8.pic1.1.6" class="ltx_p"><span id="A13.p8.pic1.1.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Inspection:<span id="A13.p8.pic1.1.6.1.1" class="ltx_text"></span></span></span>
<span id="A13.I26" class="ltx_itemize">
<span id="A13.I26.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I26.i1.p1" class="ltx_para">
<span id="A13.I26.i1.p1.1" class="ltx_p"><span id="A13.I26.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">look around</span><span id="A13.I26.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Survey your surroundings.</span></span>
</span></span>
<span id="A13.I26.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I26.i2.p1" class="ltx_para">
<span id="A13.I26.i2.p1.1" class="ltx_p"><span id="A13.I26.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">look at {OBJ}</span><span id="A13.I26.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Examine an object closely.</span></span>
</span></span>
<span id="A13.I26.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I26.i3.p1" class="ltx_para">
<span id="A13.I26.i3.p1.1" class="ltx_p"><span id="A13.I26.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">look in {OBJ}</span><span id="A13.I26.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Peek inside a container.</span></span>
</span></span>
<span id="A13.I26.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I26.i4.p1" class="ltx_para">
<span id="A13.I26.i4.p1.1" class="ltx_p"><span id="A13.I26.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">read {OBJ}</span><span id="A13.I26.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Review written content.</span></span>
</span></span>
</span>
<span id="A13.p8.pic1.1.7" class="ltx_p"><span id="A13.p8.pic1.1.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Device Operations:<span id="A13.p8.pic1.1.7.1.1" class="ltx_text"></span></span></span>
<span id="A13.I27" class="ltx_itemize">
<span id="A13.I27.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I27.i1.p1" class="ltx_para">
<span id="A13.I27.i1.p1.1" class="ltx_p"><span id="A13.I27.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">activate {OBJ} / deactivate {OBJ}</span><span id="A13.I27.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Toggle a device.</span></span>
</span></span>
<span id="A13.I27.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I27.i2.p1" class="ltx_para">
<span id="A13.I27.i2.p1.1" class="ltx_p"><span id="A13.I27.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">use {OBJ} [on {OBJ}]</span><span id="A13.I27.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Utilize a device or item.</span></span>
</span></span>
</span>
<span id="A13.p8.pic1.1.8" class="ltx_p"><span id="A13.p8.pic1.1.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Movement:<span id="A13.p8.pic1.1.8.1.1" class="ltx_text"></span></span></span>
<span id="A13.I28" class="ltx_itemize">
<span id="A13.I28.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I28.i1.p1" class="ltx_para">
<span id="A13.I28.i1.p1.1" class="ltx_p"><span id="A13.I28.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">go to {LOC}</span><span id="A13.I28.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Relocate.</span></span>
</span></span>
</span>
<span id="A13.p8.pic1.1.9" class="ltx_p"><span id="A13.p8.pic1.1.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Miscellaneous:<span id="A13.p8.pic1.1.9.1.1" class="ltx_text"></span></span></span>
<span id="A13.I29" class="ltx_itemize">
<span id="A13.I29.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I29.i1.p1" class="ltx_para">
<span id="A13.I29.i1.p1.1" class="ltx_p"><span id="A13.I29.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">eat {OBJ}</span><span id="A13.I29.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Consume an edible item.</span></span>
</span></span>
<span id="A13.I29.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I29.i2.p1" class="ltx_para">
<span id="A13.I29.i2.p1.1" class="ltx_p"><span id="A13.I29.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">flush {OBJ}</span><span id="A13.I29.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Activate a flushing mechanism.</span></span>
</span></span>
<span id="A13.I29.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I29.i3.p1" class="ltx_para">
<span id="A13.I29.i3.p1.1" class="ltx_p"><span id="A13.I29.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">focus on {OBJ}</span><span id="A13.I29.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Direct attention to a particular object.</span></span>
</span></span>
<span id="A13.I29.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I29.i4.p1" class="ltx_para">
<span id="A13.I29.i4.p1.1" class="ltx_p"><span id="A13.I29.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">wait [DURATION]</span><span id="A13.I29.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Pause for a specified period.</span></span>
</span></span>
</span>
<span id="A13.p8.pic1.1.10" class="ltx_p"><span id="A13.p8.pic1.1.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Information:<span id="A13.p8.pic1.1.10.1.1" class="ltx_text"></span></span></span>
