<span id="A13.p10.pic1.1.5" class="ltx_p"><span id="A13.p10.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Before suggesting an action, confirm it is listed as a valid action. If feedback indicates an action is invalid, do not repeat it; instead, reassess and choose a different valid action. Regularly use the ’<span id="A13.p10.pic1.1.5.1.1" class="ltx_text ltx_font_typewriter">inventory</span>’ command to manage items you’re carrying and the ’<span id="A13.p10.pic1.1.5.1.2" class="ltx_text ltx_font_typewriter">task</span>’ command to keep the objective in focus. If you encounter an error, recognize it, and correct your approach. Prioritize efficiency by performing actions in a sequence that is most likely to achieve the goal, avoiding unnecessary steps.
<br class="ltx_break"></span></span>
<span id="A13.p10.pic1.1.6" class="ltx_p"><span id="A13.p10.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Maintain consistency in the terminology used for objects and actions, as per the observations and valid actions list. If the environment feedback suggests a misunderstanding of the environment or the structure, take time to ’<span id="A13.p10.pic1.1.6.1.1" class="ltx_text ltx_font_typewriter">look around</span>’ and reassess your strategy.
