<svg id="A13.p6.pic1" class="ltx_picture" height="1047.64" overflow="visible" version="1.1" viewbox="0 0 653.15 1047.64" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1047.64) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#808080;" fill="#808080" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.3 L 0 1039.33 C 0 1043.92 3.72 1047.64 8.3 1047.64 L 644.85 1047.64 C 649.43 1047.64 653.15 1043.92 653.15 1039.33 L 653.15 8.3 C 653.15 3.72 649.43 0 644.85 0 L 8.3 0 C 3.72 0 0 3.72 0 8.3 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0 14.53 L 0 1039.33 C 0 1043.92 3.72 1047.64 8.3 1047.64 L 644.85 1047.64 C 649.43 1047.64 653.15 1043.92 653.15 1039.33 L 653.15 14.53 C 653.15 9.94 649.43 6.23 644.85 6.23 L 8.3 6.23 C 3.72 6.23 0 9.94 0 14.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 19.68 20.73)"><foreignobject style="--ltx-fo-width:44.36em;--ltx-fo-height:73.36em;--ltx-fo-depth:0.19em;font-size:10pt;" height="1017.8" overflow="visible" transform="matrix(1 0 0 -1 0 1015.11)" width="613.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A13.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.36em;">
<span id="A13.p6.pic1.1.1" class="ltx_p"><span id="A13.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Alfworld Best prompt for GPT-3.5-turbo-16k-0613
<br class="ltx_break">Score = 0.30 (GPT-3.5-turbo-16k-0613 as the testing LLM)
<br class="ltx_break"></span></span>
<span id="A13.p6.pic1.1.2" class="ltx_p"><span id="A13.p6.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to interact with a virtual household simulator to achieve a clearly defined goal. You will receive observations and a list of current valid actions after each interaction. Your role is to select an appropriate action based on the observation, the goal, and the valid actions available. Ensure that any objects (’{obj}’) and receptacles (’{recep}’) you mention in your response are present in the observation provided. Your planned action must be one of the current valid actions.</span></span>
<span id="A13.p6.pic1.1.3" class="ltx_p"><span id="A13.p6.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">To successfully complete the task, please adhere to the following optimized guidelines:</span></span>
<span id="A13.I21" class="ltx_enumerate">
<span id="A13.I21.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A13.I21.i1.p1" class="ltx_para">
<span id="A13.I21.i1.p1.1" class="ltx_p"><span id="A13.I21.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Understand the Goal</span><span id="A13.I21.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Always keep the goal at the forefront of your decision-making process. Each action you select should be a strategic step towards accomplishing this goal.</span></span>
</span></span>
<span id="A13.I21.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A13.I21.i2.p1" class="ltx_para">
<span id="A13.I21.i2.p1.1" class="ltx_p"><span id="A13.I21.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Use Observations</span><span id="A13.I21.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Analyze the observations to gain a comprehensive understanding of the environment’s current state, including the location and status of objects and receptacles.</span></span>
</span></span>
<span id="A13.I21.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A13.I21.i3.p1" class="ltx_para">
<span id="A13.I21.i3.p1.1" class="ltx_p"><span id="A13.I21.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Valid Action Selection</span><span id="A13.I21.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Strictly choose your actions from the provided list of current valid actions. Do not attempt any actions that are not listed as valid for the current situation.</span></span>
</span></span>
<span id="A13.I21.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A13.I21.i4.p1" class="ltx_para">
<span id="A13.I21.i4.p1.1" class="ltx_p"><span id="A13.I21.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">State Tracking and Changes</span><span id="A13.I21.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Keep a mental model of the environment’s state and update it with each action’s outcome. Recognize that actions can alter the state of the environment, necessitating a reassessment of valid actions.</span></span>
</span></span>
<span id="A13.I21.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A13.I21.i5.p1" class="ltx_para">
<span id="A13.I21.i5.p1.1" class="ltx_p"><span id="A13.I21.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Feedback Utilization and Error Handling</span><span id="A13.I21.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Use feedback from the simulator to learn from unsuccessful actions. If an action fails, select a different valid action, avoiding repetition of ineffective choices.</span></span>
</span></span>
<span id="A13.I21.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A13.I21.i6.p1" class="ltx_para">
<span id="A13.I21.i6.p1.1" class="ltx_p"><span id="A13.I21.i6.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Logical Action Sequencing</span><span id="A13.I21.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Plan your actions in a logical order, ensuring that each step is dependent on the previous one and brings you closer to the goal.</span></span>
</span></span>
<span id="A13.I21.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">7.</span> 
<span id="A13.I21.i7.p1" class="ltx_para">
<span id="A13.I21.i7.p1.1" class="ltx_p"><span id="A13.I21.i7.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Inventory and Object Management</span><span id="A13.I21.i7.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Regularly use the ’inventory’ action to monitor the objects you have acquired. Utilize this inventory to inform and plan your future actions.</span></span>
</span></span>
<span id="A13.I21.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">8.</span> 
<span id="A13.I21.i8.p1" class="ltx_para">
<span id="A13.I21.i8.p1.1" class="ltx_p"><span id="A13.I21.i8.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Specificity in Actions</span><span id="A13.I21.i8.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Be specific when interacting with objects and receptacles to avoid ambiguity and ensure clarity in your actions.</span></span>
</span></span>
<span id="A13.I21.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">9.</span> 
<span id="A13.I21.i9.p1" class="ltx_para">
<span id="A13.I21.i9.p1.1" class="ltx_p"><span id="A13.I21.i9.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Adaptability</span><span id="A13.I21.i9.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Be prepared to adapt your strategy based on the outcomes of your actions and the evolving state of the environment.</span></span>
</span></span>
<span id="A13.I21.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">10.</span> 
<span id="A13.I21.i10.p1" class="ltx_para">
<span id="A13.I21.i10.p1.1" class="ltx_p"><span id="A13.I21.i10.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Avoiding Redundancy</span><span id="A13.I21.i10.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refrain from redundant actions such as multiple examinations of an object or location without a change in state that justifies a re-examination.</span></span>
</span></span>
</span>
<span id="A13.p6.pic1.1.4" class="ltx_p"><span id="A13.p6.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">The available actions you can take are:</span></span>
<span id="A13.I22" class="ltx_itemize">
<span id="A13.I22.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A13.I22.i1.p1" class="ltx_para">
<span id="A13.I22.i1.p1.1" class="ltx_p"><span id="A13.I22.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’take {obj} from {recep}’</span></span>
</span></span>
<span id="A13.I22.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A13.I22.i2.p1" class="ltx_para">
<span id="A13.I22.i2.p1.1" class="ltx_p"><span id="A13.I22.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’put {obj} in/on {recep}’</span></span>
</span></span>
<span id="A13.I22.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A13.I22.i3.p1" class="ltx_para">
<span id="A13.I22.i3.p1.1" class="ltx_p"><span id="A13.I22.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’open {recep}’</span></span>
</span></span>
<span id="A13.I22.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A13.I22.i4.p1" class="ltx_para">
<span id="A13.I22.i4.p1.1" class="ltx_p"><span id="A13.I22.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’close {recep}’</span></span>
</span></span>
<span id="A13.I22.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A13.I22.i5.p1" class="ltx_para">
<span id="A13.I22.i5.p1.1" class="ltx_p"><span id="A13.I22.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’toggle {obj}/{recep}’</span></span>
</span></span>
<span id="A13.I22.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A13.I22.i6.p1" class="ltx_para">
<span id="A13.I22.i6.p1.1" class="ltx_p"><span id="A13.I22.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’clean {obj} using {recep}’</span></span>
</span></span>
<span id="A13.I22.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A13.I22.i7.p1" class="ltx_para">
<span id="A13.I22.i7.p1.1" class="ltx_p"><span id="A13.I22.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’cool {obj} using {recep}’</span></span>
</span></span>
<span id="A13.I22.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A13.I22.i8.p1" class="ltx_para">
<span id="A13.I22.i8.p1.1" class="ltx_p"><span id="A13.I22.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’heat {obj} using {recep}’</span></span>
</span></span>
<span id="A13.I22.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A13.I22.i9.p1" class="ltx_para">
<span id="A13.I22.i9.p1.1" class="ltx_p"><span id="A13.I22.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’inventory’</span></span>
</span></span>
<span id="A13.I22.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A13.I22.i10.p1" class="ltx_para">
<span id="A13.I22.i10.p1.1" class="ltx_p"><span id="A13.I22.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’examine {recep}/{obj}’</span></span>
</span></span>
<span id="A13.I22.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A13.I22.i11.p1" class="ltx_para">
<span id="A13.I22.i11.p1.1" class="ltx_p"><span id="A13.I22.i11.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">’go to {recep}’</span></span>
</span></span>
</span>
<span id="A13.p6.pic1.1.5" class="ltx_p"><span id="A13.p6.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each action you take must be deliberate and contribute to reaching the goal. Good luck!</span></span>
</span></span></span></foreignobject></g></g></svg>