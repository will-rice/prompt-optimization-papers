<svg id="A2.SS2.p3.pic1" class="ltx_picture" height="591.49" overflow="visible" version="1.1" viewbox="0 0 550 591.49" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,591.49) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#14233F;" fill="#14233F" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 589.41 C 0 590.56 0.93 591.49 2.08 591.49 L 547.92 591.49 C 549.07 591.49 550 590.56 550 589.41 L 550 2.08 C 550 0.93 549.07 0 547.92 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#F7F9FC;" fill="#F7F9FC" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 2.63 L 0.55 552.07 L 549.45 552.07 L 549.45 2.63 C 549.45 1.48 548.52 0.55 547.37 0.55 L 2.63 0.55 C 1.48 0.55 0.55 1.48 0.55 2.63 Z" /></g><g style="--ltx-fill-color:#E8EEF5;" fill="#E8EEF5" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 552.62 L 0.55 588.86 C 0.55 590.01 1.48 590.94 2.63 590.94 L 547.37 590.94 C 548.52 590.94 549.45 590.01 549.45 588.86 L 549.45 552.62 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.18 560.02)"><foreignobject style="--ltx-fo-width:32.78em;--ltx-fo-height:1.95em;--ltx-fo-depth:0.25em;font-size:10pt;" height="30.44" overflow="visible" transform="matrix(1 0 0 -1 0 26.98)" width="453.58"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.78em;">
<span id="A2.SS2.p3.pic1.1.1" class="ltx_p"><span id="A2.SS2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#14233F;">Success-Selection Instructions (Appended in the Full GEPA-Curator Method)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.18 15.48)"><foreignobject style="--ltx-fo-width:37.7em;--ltx-fo-height:37.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="527.04" overflow="visible" transform="matrix(1 0 0 -1 0 524.35)" width="521.66"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A2.SS2.p3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:37.7em;">
<span id="A2.SS2.p3.pic1.p2" class="ltx_para">
<span id="A2.SS2.p3.pic1.p2.1" class="ltx_p"><span id="A2.SS2.p3.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You may also select one trusted historical success to show the reflector if this task is run and fails now. Select an anchor only when its behavior is genuinely correct and represents a reproducible success mode, rather than an outcome caused by evaluator variance, evaluator leniency, or infrastructure variance. At least one other independent clean success must support that judgment. Use only IDs listed below and only for this task. If no success is trustworthy, use <span id="A2.SS2.p3.pic1.p2.1.1.1" class="ltx_text ltx_font_typewriter">null</span> and an empty list. A skip decision must not select an anchor.</span></span>
<span id="A2.SS2.p3.pic1.p2.2" class="ltx_p"><span id="A2.SS2.p3.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Always provide a separate, non-empty <span id="A2.SS2.p3.pic1.p2.2.1.1" class="ltx_text ltx_font_typewriter">anchor_reason</span>. When selecting an anchor, <span id="A2.SS2.p3.pic1.p2.2.1.2" class="ltx_text ltx_font_typewriter">anchor_reason</span> must explain why the selected behavior is genuinely correct and reproducible, and how the listed supporting successes corroborate it. When not selecting an anchor, <span id="A2.SS2.p3.pic1.p2.2.1.3" class="ltx_text ltx_font_typewriter">anchor_reason</span> must explain why the available successes are insufficient or unsuitable. First reason about each decision, then commit to it: emit <span id="A2.SS2.p3.pic1.p2.2.1.4" class="ltx_text ltx_font_typewriter">reason</span> before <span id="A2.SS2.p3.pic1.p2.2.1.5" class="ltx_text ltx_font_typewriter">decision</span> and <span id="A2.SS2.p3.pic1.p2.2.1.6" class="ltx_text ltx_font_typewriter">anchor_reason</span> before <span id="A2.SS2.p3.pic1.p2.2.1.7" class="ltx_text ltx_font_typewriter">anchor_success_state_id</span> in the exact field order shown.</span></span>
<span id="A2.SS2.p3.pic1.p2.3" class="ltx_p"><span id="A2.SS2.p3.pic1.p2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Return only JSON with this exact shape:<span id="A2.SS2.p3.pic1.p2.3.1.1" class="ltx_text"></span></span></span>
</span>
<span id="A2.SS2.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.SS2.p3.pic1.p1.1" class="ltx_p"><span id="A2.SS2.p3.pic1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{‘‘reason’’:‘‘...’’,’’decision’’:‘‘run|skip’’,
<br class="ltx_break"><span id="A2.SS2.p3.pic1.p1.1.1.1" class="ltx_text ltx_phantom"><span style="visibility:hidden">{</span></span>‘‘anchor_reason’’:‘‘...’’,’’anchor_success_state_id’’:null|‘‘...’’,
<br class="ltx_break"><span id="A2.SS2.p3.pic1.p1.1.1.2" class="ltx_text ltx_phantom"><span style="visibility:hidden">{</span></span>‘‘supporting_success_ids’’:[]}.</span></span>
</span>
<span id="A2.SS2.p3.pic1.p3" class="ltx_para">
<span id="A2.SS2.p3.pic1.p3.1" class="ltx_p"><span id="A2.SS2.p3.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Runtime fields appended:<span id="A2.SS2.p3.pic1.p3.1.1.1" class="ltx_text ltx_font_medium"> Task ID; task; this task’s history; and available clean success states, whose details appear in history rows with matching IDs.</span></span></span>
</span></span></span></span></foreignobject></g></g></svg>