</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.18 15.48)"><foreignobject style="--ltx-fo-width:37.7em;--ltx-fo-height:18.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="261.37" overflow="visible" transform="matrix(1 0 0 -1 0 258.68)" width="521.66"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS3.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.7em;">
<span id="A2.SS3.p7.pic1.2.1" class="ltx_p"><span id="A2.SS3.p7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Generate executable Python for the AppWorld shell. The <span id="A2.SS3.p7.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">apis</span> object exists only inside that shell: do not emit Harmony recipient or tool-call syntax such as <span id="A2.SS3.p7.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">to=apis...</span>. Return exactly one fenced Python code block in the assistant final channel, and call <span id="A2.SS3.p7.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">apis</span> only from that code. Print useful intermediate results when exploring. After completing the task, always call the <span id="A2.SS3.p7.pic1.2.1.1.4" class="ltx_text ltx_font_typewriter">apis.supervisor.complete_task</span> API. If the task asks for information or an answer, pass only the concise requested value as <span id="A2.SS3.p7.pic1.2.1.1.5" class="ltx_text ltx_font_typewriter">answer=&lt;answer&gt;</span>. If the task requests an action and no answer is needed, call <span id="A2.SS3.p7.pic1.2.1.1.6" class="ltx_text ltx_font_typewriter">apis.supervisor.complete_task()</span> without an answer. Never use a status report or explanation as the answer.</span></span>
</span></span></span></foreignobject></g></g></svg>