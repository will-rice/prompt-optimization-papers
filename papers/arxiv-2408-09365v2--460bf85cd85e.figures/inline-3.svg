<span id="A1.SS3.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.87em;">
<span id="A1.SS3.p5.pic1.1.1" class="ltx_p"><span id="A1.SS3.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Deduction Phase: Refine and Filter Concepts <math id="A1.SS3.p5.pic1.m1" class="ltx_Math" alttext="\to M_{s}" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" stretchy="false">→</mo><msub><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">M</mi><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">s</mi></msub></mrow><annotation encoding="application/x-tex">\to M_{s}</annotation></semantics></math></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.26 19.82)"><foreignobject style="--ltx-fo-width:45.87em;--ltx-fo-height:24.12em;--ltx-fo-depth:0.19em;font-size:10pt;" height="336.5" overflow="visible" transform="matrix(1 0 0 -1 0 333.81)" width="634.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.87em;">
<span id="A1.SS3.p5.pic1.2.1" class="ltx_p ltx_align_left"><span id="A1.SS3.p5.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;system&gt;<span id="A1.SS3.p5.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are an intelligent assistant that processes a list of high-level, generalizable concepts for a given task. Your task is twofold: 
<br class="ltx_break">1. Analyze the list of concepts and remove semantically similar duplicates, ensuring that each remaining concept is unique and distinct. 
<br class="ltx_break"></span></span></span>
<span id="A1.SS3.p5.pic1.2.2" class="ltx_p ltx_align_left"><span id="A1.SS3.p5.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Verify that each concept is general enough to be valid for improving the given task. A valid concept should: 
<br class="ltx_break"></span></span>
<span id="A1.I1" class="ltx_itemize ltx_align_left">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Be generalizable to similar examples within the task.</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Directly address weaknesses or improve performance for the task.</span></span>
</span></span>
</span>
<span id="A1.SS3.p5.pic1.2.3" class="ltx_p ltx_align_left"><span id="A1.SS3.p5.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">A concept is defined as a general instruction derived or inferred from specific instances or occurrences of a task. Your goal is to preserve the clearest, most concise, and generalizable version of each valid concept.</span></span>
<span id="A1.SS3.p5.pic1.2.4" class="ltx_p ltx_align_left"><span id="A1.SS3.p5.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;user&gt;<span id="A1.SS3.p5.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Here is the list of concepts generated for the task: <span id="A1.SS3.p5.pic1.2.4.1.1.1" class="ltx_text ltx_font_typewriter">{concepts}</span> 
<br class="ltx_break">The original task is: <span id="A1.SS3.p5.pic1.2.4.1.1.2" class="ltx_text ltx_font_typewriter">{original_task}</span> 
<br class="ltx_break"></span></span></span>
<span id="A1.SS3.p5.pic1.2.5" class="ltx_p ltx_align_left"><span id="A1.SS3.p5.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please return a list of unique, valid concepts. Your output should only include the refined concepts without any additional explanations or preambles.</span></span>
</span></span></span></foreignobject></g></g></svg>