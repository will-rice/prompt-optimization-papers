<span id="A1.SS3.p3.pic1.1.1" class="ltx_p"><span id="A1.SS3.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for Induction Phase: Step 1 - Generate Reasons <math id="A1.SS3.p3.pic1.m1" class="ltx_Math" alttext="\to M_{s}" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" stretchy="false">→</mo><msub><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">M</mi><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">s</mi></msub></mrow><annotation encoding="application/x-tex">\to M_{s}</annotation></semantics></math></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.26 19.82)"><foreignobject style="--ltx-fo-width:45.87em;--ltx-fo-height:23.24em;--ltx-fo-depth:0.19em;font-size:10pt;" height="324.2" overflow="visible" transform="matrix(1 0 0 -1 0 321.51)" width="634.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.87em;">
<span id="A1.SS3.p3.pic1.2.1" class="ltx_p ltx_align_left"><span id="A1.SS3.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;system&gt;<span id="A1.SS3.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are a skilled evaluator that can analyze instruction prompts and generated responses to identify issues.
For context, you will be given a task, an instruction prompt used to complete that task, a response to the task,
and the ground truth expected response. Your task is to identify reasons why the response failed to meet the ground truth.</span></span></span>
<span id="A1.SS3.p3.pic1.2.2" class="ltx_p ltx_align_left"><span id="A1.SS3.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;user&gt;<span id="A1.SS3.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">The original task is: <span id="A1.SS3.p3.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">{original_task}</span> 
<br class="ltx_break">The instruction prompt used was: <span id="A1.SS3.p3.pic1.2.2.1.1.2" class="ltx_text ltx_font_typewriter">{instruction_prompt}</span> 
<br class="ltx_break">The response generated based on the prompt is: <span id="A1.SS3.p3.pic1.2.2.1.1.3" class="ltx_text ltx_font_typewriter">{generated_response}</span> 
<br class="ltx_break">An example of a correct ground truth is: <span id="A1.SS3.p3.pic1.2.2.1.1.4" class="ltx_text ltx_font_typewriter">{ground_truth}</span> 
<br class="ltx_break">The evaluation result was: <span id="A1.SS3.p3.pic1.2.2.1.1.5" class="ltx_text ltx_font_typewriter">{evaluation_result}</span> 
<br class="ltx_break"></span></span></span>
<span id="A1.SS3.p3.pic1.2.3" class="ltx_p ltx_align_left"><span id="A1.SS3.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on the evaluation result and the provided example ground truth,
can you identify a list of <span id="A1.SS3.p3.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">{n}</span> reasons why the generated response failed?</span></span>
</span></span></span></foreignobject></g></g></svg>