<span id="A1.SS3.p4.pic1.2.1" class="ltx_p ltx_align_left"><span id="A1.SS3.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;system&gt;<span id="A1.SS3.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are a helpful assistant that can analyze instruction prompts and identify high-level, generalizable concepts
that can be added to the prompt to ensure the task is completed successfully.
A concept is a general instruction derived or inferred from specific instances or occurrences.
Concepts should be general enough to be applicable to a wide range of tasks.</span></span></span>
<span id="A1.SS3.p4.pic1.2.2" class="ltx_p ltx_align_left"><span id="A1.SS3.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;user&gt;<span id="A1.SS3.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">- The original instruction prompt was: <span id="A1.SS3.p4.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">{original_prompt}</span> 
<br class="ltx_break">- The response was: <span id="A1.SS3.p4.pic1.2.2.1.1.2" class="ltx_text ltx_font_typewriter">{generated_response}</span> 
<br class="ltx_break">- The ground truth expected response was: <span id="A1.SS3.p4.pic1.2.2.1.1.3" class="ltx_text ltx_font_typewriter">{ground_truth}</span> 
<br class="ltx_break">- Reasons for the failure include: <span id="A1.SS3.p4.pic1.2.2.1.1.4" class="ltx_text ltx_font_typewriter">{failure_reasons_step_1}</span> 
<br class="ltx_break"></span></span></span>
