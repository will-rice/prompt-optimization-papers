</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:47.46em;--ltx-fo-height:16.35em;--ltx-fo-depth:0.19em;font-size:10pt;" height="228.93" overflow="visible" transform="matrix(1 0 0 -1 0 226.24)" width="656.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SSx4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.46em;">
<span id="A3.SSx4.p2.pic1.2.1" class="ltx_p"><span id="A3.SSx4.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert in Natural Language Inference (NLI). Your task is to determine the logical relation between a given premise (a long text) and a hypothesis (a short text).
<br class="ltx_break">There are three possible labels:
<br class="ltx_break">1. “entailment” - The hypothesis logically follows from the premise.
<br class="ltx_break">2. “contradiction” - The hypothesis is logically inconsistent with the premise.
<br class="ltx_break">3. “neutral” - The hypothesis is neither entailed nor contradicted by the premise.
<br class="ltx_break">Return the result in the following JSON format:
<br class="ltx_break">{
<br class="ltx_break"> “label”: “entailment” / “contradiction” / “neutral”,
<br class="ltx_break"> “confidence”: float between 0 and 1,
<br class="ltx_break"> “reasoning”: a brief explanation of your decision.
<br class="ltx_break">}
<br class="ltx_break">Premise:
<br class="ltx_break">Hypothesis:</span></span>
</span></span></span></foreignobject></g></g></svg>