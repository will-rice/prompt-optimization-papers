<svg id="A1.F11.pic1" class="ltx_picture ltx_centering" height="683.89" overflow="visible" version="1.1" viewbox="0 0 653.15 683.89" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,683.89) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.63 L 0 661.84 C 0 664.4 2.07 666.47 4.63 666.47 L 648.52 666.47 C 651.08 666.47 653.15 664.4 653.15 661.84 L 653.15 4.63 C 653.15 2.07 651.08 0 648.52 0 L 4.63 0 C 2.07 0 0 2.07 0 4.63 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 4.63 L 0.69 661.84 C 0.69 664.02 2.45 665.78 4.63 665.78 L 648.52 665.78 C 650.7 665.78 652.46 664.02 652.46 661.84 L 652.46 4.63 C 652.46 2.45 650.7 0.69 648.52 0.69 L 4.63 0.69 C 2.45 0.69 0.69 2.45 0.69 4.63 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 7.87 658.6)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 25.29 L 280.87 25.29 L 280.87 0 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 1.57 1.57 L 1.57 23.72 L 279.3 23.72 L 279.3 1.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.19)"><foreignobject style="--ltx-fo-width:15.97em;--ltx-fo-height:0.6em;--ltx-fo-depth:0.17em;font-size:11.5pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="254.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.F11.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Error Pattern Update Meta Prompt</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.96)"><foreignobject style="--ltx-fo-width:44.26em;--ltx-fo-height:46.11em;--ltx-fo-depth:0.25em;font-size:10pt;" height="641.47" overflow="visible" transform="matrix(1 0 0 -1 0 638.01)" width="612.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.26em;">
<span id="A1.F11.pic1.2.1" class="ltx_p"><span id="A1.F11.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert error-pattern analyst.</span></span>
<span id="A1.F11.pic1.2.2" class="ltx_p"><span id="A1.F11.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your job: refine an existing error-pattern description by incorporating new evidence from bad cases.</span></span>
<span id="A1.F11.pic1.2.3" class="ltx_p"><span id="A1.F11.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The updated pattern must be concise, generalizable, and actionable — it will be used as a RULE to prevent similar mistakes in the future.</span></span>
<span id="A1.F11.pic1.2.4" class="ltx_p"><span id="A1.F11.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">An existing error pattern needs to be updated because a new bad case has been added to its cluster.</span></span>
<span id="A1.F11.pic1.2.5" class="ltx_p"><span id="A1.F11.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;CURRENT_PATTERN&gt;</span></span>
<span id="A1.F11.pic1.2.6" class="ltx_p"><span id="A1.F11.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">{current_pattern}</span></span>
<span id="A1.F11.pic1.2.7" class="ltx_p"><span id="A1.F11.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/CURRENT_PATTERN&gt;</span></span>
<span id="A1.F11.pic1.2.8" class="ltx_p"><span id="A1.F11.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;HISTORICAL_BAD_CASES&gt;</span></span>
<span id="A1.F11.pic1.2.9" class="ltx_p"><span id="A1.F11.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">The following are existing bad cases already in this error pattern cluster.</span></span>
<span id="A1.F11.pic1.2.10" class="ltx_p"><span id="A1.F11.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">{historical_bad_cases}</span></span>
<span id="A1.F11.pic1.2.11" class="ltx_p"><span id="A1.F11.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/HISTORICAL_BAD_CASES&gt;</span></span>
<span id="A1.F11.pic1.2.12" class="ltx_p"><span id="A1.F11.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;NEW_BAD_CASE&gt;</span></span>
<span id="A1.F11.pic1.2.13" class="ltx_p"><span id="A1.F11.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">This is the new bad case that triggered the update.</span></span>
<span id="A1.F11.pic1.2.14" class="ltx_p"><span id="A1.F11.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">question: {new_question}</span></span>
<span id="A1.F11.pic1.2.15" class="ltx_p"><span id="A1.F11.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">correct_answer: {new_ground_truth}</span></span>
<span id="A1.F11.pic1.2.16" class="ltx_p"><span id="A1.F11.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">wrong_answer: {new_wrong_pred}</span></span>
<span id="A1.F11.pic1.2.17" class="ltx_p"><span id="A1.F11.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">reflection: {new_reflection}</span></span>
<span id="A1.F11.pic1.2.18" class="ltx_p"><span id="A1.F11.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/FAILED_ATTEMPTS&gt;</span></span>
<span id="A1.F11.pic1.2.19" class="ltx_p"><span id="A1.F11.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">Instructions:</span></span>
<span id="A1.F11.pic1.2.20" class="ltx_p"><span id="A1.F11.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Read the current pattern and historical bad cases to understand the existing error pattern.</span></span>
<span id="A1.F11.pic1.2.21" class="ltx_p"><span id="A1.F11.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Analyze the NEW bad case — determine whether it introduces a genuinely new dimension to the pattern.</span></span>
<span id="A1.F11.pic1.2.22" class="ltx_p"><span id="A1.F11.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. If the new bad case is very similar to the historical ones and the current pattern already covers it well, you may keep the current pattern UNCHANGED.</span></span>
<span id="A1.F11.pic1.2.23" class="ltx_p"><span id="A1.F11.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. Otherwise, produce a refined, generalizable one-sentence pattern description that:</span></span>
<span id="A1.F11.pic1.2.24" class="ltx_p"><span id="A1.F11.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Covers BOTH the new bad case and the historical ones</span></span>
<span id="A1.F11.pic1.2.25" class="ltx_p"><span id="A1.F11.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Is more precise or more general than the current pattern if the new evidence warrants it</span></span>
<span id="A1.F11.pic1.2.26" class="ltx_p"><span id="A1.F11.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Is actionable — it should clearly state what to do or avoid</span></span>
<span id="A1.F11.pic1.2.27" class="ltx_p"><span id="A1.F11.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">You MUST respond with a JSON object in exactly this format and nothing else:</span></span>
<span id="A1.F11.pic1.2.28" class="ltx_p"><span id="A1.F11.pic1.2.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">{</span></span>
<span id="A1.F11.pic1.2.29" class="ltx_p"><span id="A1.F11.pic1.2.29.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;analysis&quot;: &quot;brief reasoning about whether the new bad case changes or confirms the pattern&quot;,</span></span>
<span id="A1.F11.pic1.2.30" class="ltx_p"><span id="A1.F11.pic1.2.30.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;updated&quot;: &quot;true or false (whether the pattern needs to be updated)&quot;</span></span>
<span id="A1.F11.pic1.2.31" class="ltx_p"><span id="A1.F11.pic1.2.31.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;pattern&quot;: &quot;one-sentence error-pattern description (refined if updated=true, or the original current pattern if updated=false)&quot;</span></span>
<span id="A1.F11.pic1.2.32" class="ltx_p"><span id="A1.F11.pic1.2.32.1" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span></span></foreignobject></g></g></svg>