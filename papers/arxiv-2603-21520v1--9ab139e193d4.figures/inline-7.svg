<svg id="A1.F10.pic1" class="ltx_picture ltx_centering" height="517.85" overflow="visible" version="1.1" viewbox="0 0 653.15 517.85" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,517.85) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.63 L 0 495.8 C 0 498.36 2.07 500.43 4.63 500.43 L 648.52 500.43 C 651.08 500.43 653.15 498.36 653.15 495.8 L 653.15 4.63 C 653.15 2.07 651.08 0 648.52 0 L 4.63 0 C 2.07 0 0 2.07 0 4.63 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 4.63 L 0.69 495.8 C 0.69 497.97 2.45 499.74 4.63 499.74 L 648.52 499.74 C 650.7 499.74 652.46 497.97 652.46 495.8 L 652.46 4.63 C 652.46 2.45 650.7 0.69 648.52 0.69 L 4.63 0.69 C 2.45 0.69 0.69 2.45 0.69 4.63 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 7.87 492.55)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 25.29 L 275.87 25.29 L 275.87 0 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 1.57 1.57 L 1.57 23.72 L 274.3 23.72 L 274.3 1.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.19)"><foreignobject style="--ltx-fo-width:15.65em;--ltx-fo-height:0.6em;--ltx-fo-depth:0.17em;font-size:11.5pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="249.11"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.F10.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Error Summarization Meta Prompt</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.96)"><foreignobject style="--ltx-fo-width:44.26em;--ltx-fo-height:34.11em;--ltx-fo-depth:0.25em;font-size:10pt;" height="475.43" overflow="visible" transform="matrix(1 0 0 -1 0 471.97)" width="612.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F10.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.26em;">
<span id="A1.F10.pic1.2.1" class="ltx_p"><span id="A1.F10.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert error-pattern analyst.</span></span>
<span id="A1.F10.pic1.2.2" class="ltx_p"><span id="A1.F10.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your job: given a question, its correct answer, and multiple failed attempts with reflections, synthesize ONE concise, generalizable error-pattern description that can prevent similar mistakes in the future.</span></span>
<span id="A1.F10.pic1.2.3" class="ltx_p"><span id="A1.F10.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">A model attempted the following question multiple times and FAILED every time. Analyze all attempts holistically and extract the root-cause error pattern.</span></span>
<span id="A1.F10.pic1.2.4" class="ltx_p"><span id="A1.F10.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;QUESTION&gt;</span></span>
<span id="A1.F10.pic1.2.5" class="ltx_p"><span id="A1.F10.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{question}</span></span>
<span id="A1.F10.pic1.2.6" class="ltx_p"><span id="A1.F10.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/QUESTION&gt;</span></span>
<span id="A1.F10.pic1.2.7" class="ltx_p"><span id="A1.F10.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;CORRECT_ANSWER&gt;</span></span>
<span id="A1.F10.pic1.2.8" class="ltx_p"><span id="A1.F10.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">{correct_pred}</span></span>
<span id="A1.F10.pic1.2.9" class="ltx_p"><span id="A1.F10.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/CORRECT_ANSWER&gt;</span></span>
<span id="A1.F10.pic1.2.10" class="ltx_p"><span id="A1.F10.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;FAILED_ATTEMPTS&gt;</span></span>
<span id="A1.F10.pic1.2.11" class="ltx_p"><span id="A1.F10.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">{failed_attempts}</span></span>
<span id="A1.F10.pic1.2.12" class="ltx_p"><span id="A1.F10.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/FAILED_ATTEMPTS&gt;</span></span>
<span id="A1.F10.pic1.2.13" class="ltx_p"><span id="A1.F10.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Instructions:</span></span>
<span id="A1.F10.pic1.2.14" class="ltx_p"><span id="A1.F10.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Compare all failed attempts — identify the COMMON root cause, not just surface-level symptoms.</span></span>
<span id="A1.F10.pic1.2.15" class="ltx_p"><span id="A1.F10.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Consider whether the errors stem from misunderstanding the question, flawed reasoning, calculation mistakes, or missing domain knowledge and so on.</span></span>
<span id="A1.F10.pic1.2.16" class="ltx_p"><span id="A1.F10.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Abstract the lesson into a generalizable rule that applies beyond this specific question.</span></span>
<span id="A1.F10.pic1.2.17" class="ltx_p"><span id="A1.F10.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">You MUST respond with a JSON object in exactly this format and nothing else:</span></span>
<span id="A1.F10.pic1.2.18" class="ltx_p"><span id="A1.F10.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">{</span></span>
<span id="A1.F10.pic1.2.19" class="ltx_p"><span id="A1.F10.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;root_cause&quot;: &quot;brief description of the common root cause across all attempts&quot;,</span></span>
<span id="A1.F10.pic1.2.20" class="ltx_p"><span id="A1.F10.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;reflection&quot;: &quot;one-sentence generalizable rule to prevent this category of error in the future&quot;</span></span>
<span id="A1.F10.pic1.2.21" class="ltx_p"><span id="A1.F10.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span></span></foreignobject></g></g></svg>