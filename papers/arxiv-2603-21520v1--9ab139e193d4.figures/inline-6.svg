<svg id="A1.F9.pic1" class="ltx_picture ltx_centering" height="559.78" overflow="visible" version="1.1" viewbox="0 0 653.15 559.78" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,559.78) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.63 L 0 537.74 C 0 540.29 2.07 542.37 4.63 542.37 L 648.52 542.37 C 651.08 542.37 653.15 540.29 653.15 537.74 L 653.15 4.63 C 653.15 2.07 651.08 0 648.52 0 L 4.63 0 C 2.07 0 0 2.07 0 4.63 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 4.63 L 0.69 537.74 C 0.69 539.91 2.45 541.68 4.63 541.68 L 648.52 541.68 C 650.7 541.68 652.46 539.91 652.46 537.74 L 652.46 4.63 C 652.46 2.45 650.7 0.69 648.52 0.69 L 4.63 0.69 C 2.45 0.69 0.69 2.45 0.69 4.63 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 7.87 534.49)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 25.29 L 241.66 25.29 L 241.66 0 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 1.57 1.57 L 1.57 23.72 L 240.08 23.72 L 240.08 1.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.19)"><foreignobject style="--ltx-fo-width:13.59em;--ltx-fo-height:0.6em;--ltx-fo-depth:0.17em;font-size:11.5pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="216.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.F9.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Template Merge Meta Prompt</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.96)"><foreignobject style="--ltx-fo-width:44.26em;--ltx-fo-height:37.14em;--ltx-fo-depth:0.25em;font-size:10pt;" height="517.37" overflow="visible" transform="matrix(1 0 0 -1 0 513.91)" width="612.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.26em;">
<span id="A1.F9.pic1.2.1" class="ltx_p"><span id="A1.F9.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert template librarian for a retrieval-augmented problem-solving system.</span></span>
<span id="A1.F9.pic1.2.2" class="ltx_p"><span id="A1.F9.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your job: given a full list of templates, identify groups of templates that are semantically similar or overlapping and can be merged into a single, more general template without losing coverage.</span></span>
<span id="A1.F9.pic1.2.3" class="ltx_p"><span id="A1.F9.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The template library has grown too large ({total}) templates, limit is {limit}). Identify groups of templates that can be merged to reduce the total count.</span></span>
<span id="A1.F9.pic1.2.4" class="ltx_p"><span id="A1.F9.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;ALL_TEMPLATES&gt;</span></span>
<span id="A1.F9.pic1.2.5" class="ltx_p"><span id="A1.F9.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{all_templates}</span></span>
<span id="A1.F9.pic1.2.6" class="ltx_p"><span id="A1.F9.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/ALL_TEMPLATES&gt;</span></span>
<span id="A1.F9.pic1.2.7" class="ltx_p"><span id="A1.F9.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Instructions:</span></span>
<span id="A1.F9.pic1.2.8" class="ltx_p"><span id="A1.F9.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Read ALL templates carefully. Identify groups where the when_to_use scenarios overlap significantly or the strategies are highly similar / complementary.</span></span>
<span id="A1.F9.pic1.2.9" class="ltx_p"><span id="A1.F9.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Only merge templates that are truly related — do NOT force-merge unrelated templates just to reduce count.</span></span>
<span id="A1.F9.pic1.2.10" class="ltx_p"><span id="A1.F9.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. For each merge group, produce a single merged template that covers all the scenarios and combines the best parts of each strategy.</span></span>
<span id="A1.F9.pic1.2.11" class="ltx_p"><span id="A1.F9.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. Templates NOT included in any merge group will be kept as-is.</span></span>
<span id="A1.F9.pic1.2.12" class="ltx_p"><span id="A1.F9.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. Try to reduce the total template count to at most {target} through merging.</span></span>
<span id="A1.F9.pic1.2.13" class="ltx_p"><span id="A1.F9.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">You MUST respond with a JSON object in exactly this format and nothing else:</span></span>
<span id="A1.F9.pic1.2.14" class="ltx_p"><span id="A1.F9.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">{</span></span>
<span id="A1.F9.pic1.2.15" class="ltx_p"><span id="A1.F9.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;merge_groups&quot;: [</span></span>
<span id="A1.F9.pic1.2.16" class="ltx_p"><span id="A1.F9.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">{</span></span>
<span id="A1.F9.pic1.2.17" class="ltx_p"><span id="A1.F9.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;template_ids&quot;: [&quot;1&quot;, &quot;3&quot;],</span></span>
<span id="A1.F9.pic1.2.18" class="ltx_p"><span id="A1.F9.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;reason&quot;: &quot;brief explanation of why these templates should be merged&quot;,</span></span>
<span id="A1.F9.pic1.2.19" class="ltx_p"><span id="A1.F9.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;merged_when_to_use&quot;: &quot;combined scenario description covering all merged templates&quot;,</span></span>
<span id="A1.F9.pic1.2.20" class="ltx_p"><span id="A1.F9.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;merged_strategy&quot;: &quot;combined strategy incorporating the best of each template&quot;</span></span>
<span id="A1.F9.pic1.2.21" class="ltx_p"><span id="A1.F9.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
<span id="A1.F9.pic1.2.22" class="ltx_p"><span id="A1.F9.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">]</span></span>
<span id="A1.F9.pic1.2.23" class="ltx_p"><span id="A1.F9.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
<span id="A1.F9.pic1.2.24" class="ltx_p"><span id="A1.F9.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">If no templates can be reasonably merged, return: {&quot;merge_groups&quot;: []}</span></span>
</span></span></span></foreignobject></g></g></svg>