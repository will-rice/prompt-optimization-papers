<svg id="A1.F8.pic1" class="ltx_picture ltx_centering" height="1032.58" overflow="visible" version="1.1" viewbox="0 0 653.15 1032.58" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1032.58) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.63 L 0 1010.54 C 0 1013.09 2.07 1015.16 4.63 1015.16 L 648.52 1015.16 C 651.08 1015.16 653.15 1013.09 653.15 1010.54 L 653.15 4.63 C 653.15 2.07 651.08 0 648.52 0 L 4.63 0 C 2.07 0 0 2.07 0 4.63 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 4.63 L 0.69 1010.54 C 0.69 1012.71 2.45 1014.47 4.63 1014.47 L 648.52 1014.47 C 650.7 1014.47 652.46 1012.71 652.46 1010.54 L 652.46 4.63 C 652.46 2.45 650.7 0.69 648.52 0.69 L 4.63 0.69 C 2.45 0.69 0.69 2.45 0.69 4.63 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 7.87 1007.29)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 25.29 L 249.04 25.29 L 249.04 0 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 1.57 1.57 L 1.57 23.72 L 247.46 23.72 L 247.46 1.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.19)"><foreignobject style="--ltx-fo-width:14.02em;--ltx-fo-height:0.6em;--ltx-fo-depth:0.17em;font-size:11.5pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="223.15"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.F8.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Template Update Meta Prompt</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.96)"><foreignobject style="--ltx-fo-width:44.26em;--ltx-fo-height:71.31em;--ltx-fo-depth:0.25em;font-size:10pt;" height="990.17" overflow="visible" transform="matrix(1 0 0 -1 0 986.71)" width="612.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.26em;">
<span id="A1.F8.pic1.2.1" class="ltx_p"><span id="A1.F8.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert template manager for a retrieval-augmented problem-solving system.</span></span>
<span id="A1.F8.pic1.2.2" class="ltx_p"><span id="A1.F8.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your job: given a new successfully solved case and the recalled templates, decide the best action to keep the template library accurate, non-redundant, and maximally useful.</span></span>
<span id="A1.F8.pic1.2.3" class="ltx_p"><span id="A1.F8.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">A model just answered a question correctly. Review the recalled templates and decide what actions to take.</span></span>
<span id="A1.F8.pic1.2.4" class="ltx_p"><span id="A1.F8.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;RECALLED_TEMPLATES&gt;</span></span>
<span id="A1.F8.pic1.2.5" class="ltx_p"><span id="A1.F8.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{recalled_templates}</span></span>
<span id="A1.F8.pic1.2.6" class="ltx_p"><span id="A1.F8.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/RECALLED_TEMPLATES&gt;</span></span>
<span id="A1.F8.pic1.2.7" class="ltx_p"><span id="A1.F8.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;NEW_GOOD_CASE&gt;</span></span>
<span id="A1.F8.pic1.2.8" class="ltx_p"><span id="A1.F8.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">question: {question}</span></span>
<span id="A1.F8.pic1.2.9" class="ltx_p"><span id="A1.F8.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">correct_answer: {correct_pred}</span></span>
<span id="A1.F8.pic1.2.10" class="ltx_p"><span id="A1.F8.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/NEW_GOOD_CASE&gt;</span></span>
<span id="A1.F8.pic1.2.11" class="ltx_p"><span id="A1.F8.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">{reflections_block}</span></span>
<span id="A1.F8.pic1.2.12" class="ltx_p"><span id="A1.F8.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must decide an action for EACH recalled template, and optionally add new templates. Rules:</span></span>
<span id="A1.F8.pic1.2.13" class="ltx_p"><span id="A1.F8.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Each recalled template must appear EXACTLY ONCE in the actions list.</span></span>
<span id="A1.F8.pic1.2.14" class="ltx_p"><span id="A1.F8.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Each action targets ONE template.</span></span>
<span id="A1.F8.pic1.2.15" class="ltx_p"><span id="A1.F8.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Available actions:</span></span>
<span id="A1.F8.pic1.2.16" class="ltx_p"><span id="A1.F8.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. <span id="A1.F8.pic1.2.16.1.1" class="ltx_text ltx_font_bold">none</span>: The recalled template already covers this case well (semantically equivalent). Keep it unchanged. Specify the template_id.</span></span>
<span id="A1.F8.pic1.2.17" class="ltx_p"><span id="A1.F8.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. <span id="A1.F8.pic1.2.17.1.1" class="ltx_text ltx_font_bold">update</span>: The recalled template is relevant but its when_to_use or strategy can be enriched / made more comprehensive with information from the new case. Specify the template_id and provide updated fields.</span></span>
<span id="A1.F8.pic1.2.18" class="ltx_p"><span id="A1.F8.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">- &quot;when_to_use&quot;: a concise description of WHEN this template should be applied (what kind of question/scenario triggers it). Set to null to keep unchanged.</span></span>
<span id="A1.F8.pic1.2.19" class="ltx_p"><span id="A1.F8.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">- &quot;strategy&quot;: the abstracted step-by-step reasoning procedure for this type of problem, including pitfalls to avoid if reflections are available. Set to null to keep unchanged.</span></span>
<span id="A1.F8.pic1.2.20" class="ltx_p"><span id="A1.F8.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. <span id="A1.F8.pic1.2.20.1.1" class="ltx_text ltx_font_bold">delete</span>: The recalled template conflicts with the new case (e.g. wrong strategy, contradictory advice) or is fully superseded. Specify the template_id.</span></span>
<span id="A1.F8.pic1.2.21" class="ltx_p"><span id="A1.F8.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. <span id="A1.F8.pic1.2.21.1.1" class="ltx_text ltx_font_bold">add</span>: The new case represents a genuinely new problem type not covered by ANY recalled template. Create a new template. (Use sparingly — only when none of the recalled templates can be updated to cover this case.)</span></span>
<span id="A1.F8.pic1.2.22" class="ltx_p"><span id="A1.F8.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">- &quot;when_to_use&quot;: a concise description of WHEN this template should be applied (what kind of question/scenario triggers it).</span></span>
<span id="A1.F8.pic1.2.23" class="ltx_p"><span id="A1.F8.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">- &quot;strategy&quot;: the abstracted step-by-step reasoning procedure for this type of problem, including pitfalls to avoid if reflections are available.</span></span>
<span id="A1.F8.pic1.2.24" class="ltx_p"><span id="A1.F8.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">IMPORTANT:</span></span>
<span id="A1.F8.pic1.2.25" class="ltx_p"><span id="A1.F8.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Only use template_id values that appear in RECALLED_TEMPLATES above. Do NOT invent template_ids.</span></span>
<span id="A1.F8.pic1.2.26" class="ltx_p"><span id="A1.F8.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Every recalled template_id must appear exactly once across all actions.</span></span>
<span id="A1.F8.pic1.2.27" class="ltx_p"><span id="A1.F8.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">You MUST respond with a JSON object containing an &quot;actions&quot; list:</span></span>
<span id="A1.F8.pic1.2.28" class="ltx_p"><span id="A1.F8.pic1.2.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">{</span></span>
<span id="A1.F8.pic1.2.29" class="ltx_p"><span id="A1.F8.pic1.2.29.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;actions&quot;: [</span></span>
<span id="A1.F8.pic1.2.30" class="ltx_p"><span id="A1.F8.pic1.2.30.1" class="ltx_text" style="--ltx-fg-color:#000000;">{&quot;action&quot;: &quot;none&quot;, &quot;template_id&quot;: &quot;…&quot;},</span></span>
<span id="A1.F8.pic1.2.31" class="ltx_p"><span id="A1.F8.pic1.2.31.1" class="ltx_text" style="--ltx-fg-color:#000000;">{&quot;action&quot;: &quot;update&quot;, &quot;template_id&quot;: &quot;…&quot;, &quot;when_to_use&quot;: &quot;… or null&quot;, &quot;strategy&quot;: &quot;… or null&quot;},</span></span>
<span id="A1.F8.pic1.2.32" class="ltx_p"><span id="A1.F8.pic1.2.32.1" class="ltx_text" style="--ltx-fg-color:#000000;">{&quot;action&quot;: &quot;delete&quot;, &quot;template_id&quot;: &quot;…&quot;},</span></span>
<span id="A1.F8.pic1.2.33" class="ltx_p"><span id="A1.F8.pic1.2.33.1" class="ltx_text" style="--ltx-fg-color:#000000;">{&quot;action&quot;: &quot;add&quot;, &quot;when_to_use&quot;: &quot;…&quot;, &quot;strategy&quot;: &quot;…&quot;}</span></span>
<span id="A1.F8.pic1.2.34" class="ltx_p"><span id="A1.F8.pic1.2.34.1" class="ltx_text" style="--ltx-fg-color:#000000;">]</span></span>
<span id="A1.F8.pic1.2.35" class="ltx_p"><span id="A1.F8.pic1.2.35.1" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span></span></foreignobject></g></g></svg>