y="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.96)"><foreignobject style="--ltx-fo-width:44.26em;--ltx-fo-height:44.85em;--ltx-fo-depth:0.25em;font-size:10pt;" height="624.01" overflow="visible" transform="matrix(1 0 0 -1 0 620.55)" width="612.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.26em;">
<span id="A1.F6.pic1.2.1" class="ltx_p"><span id="A1.F6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a precise self-reflection assistant.</span></span>
<span id="A1.F6.pic1.2.2" class="ltx_p"><span id="A1.F6.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your job: analyze why the previous answer was wrong and extract a concise, actionable lesson.</span></span>
<span id="A1.F6.pic1.2.3" class="ltx_p"><span id="A1.F6.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your previous answer to the following question is likely WRONG. Re-examine your reasoning and find the mistake.</span></span>
<span id="A1.F6.pic1.2.4" class="ltx_p"><span id="A1.F6.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;QUESTION&gt;</span></span>
<span id="A1.F6.pic1.2.5" class="ltx_p"><span id="A1.F6.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{question}</span></span>
<span id="A1.F6.pic1.2.6" class="ltx_p"><span id="A1.F6.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/QUESTION&gt;</span></span>
<span id="A1.F6.pic1.2.7" class="ltx_p"><span id="A1.F6.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;RULES&gt;</span></span>
<span id="A1.F6.pic1.2.8" class="ltx_p"><span id="A1.F6.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">The following rules are summarized from historical error</span></span>
<span id="A1.F6.pic1.2.9" class="ltx_p"><span id="A1.F6.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">{rules}</span></span>
<span id="A1.F6.pic1.2.10" class="ltx_p"><span id="A1.F6.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/RULES&gt;</span></span>
<span id="A1.F6.pic1.2.11" class="ltx_p"><span id="A1.F6.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;TEMPLATES&gt;</span></span>
<span id="A1.F6.pic1.2.12" class="ltx_p"><span id="A1.F6.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are retrieved templates.</span></span>
<span id="A1.F6.pic1.2.13" class="ltx_p"><span id="A1.F6.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">{templates}</span></span>
<span id="A1.F6.pic1.2.14" class="ltx_p"><span id="A1.F6.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/TEMPLATES&gt;</span></span>
<span id="A1.F6.pic1.2.15" class="ltx_p"><span id="A1.F6.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;REFLECTIONs&gt;</span></span>
<span id="A1.F6.pic1.2.16" class="ltx_p"><span id="A1.F6.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">{reflections}</span></span>
<span id="A1.F6.pic1.2.17" class="ltx_p"><span id="A1.F6.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/REFLECTIONs&gt;</span></span>
<span id="A1.F6.pic1.2.18" class="ltx_p"><span id="A1.F6.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;YOUR_ANSWER&gt;</span></span>
<span id="A1.F6.pic1.2.19" class="ltx_p"><span id="A1.F6.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">{wrong_pred}</span></span>
<span id="A1.F6.pic1.2.20" class="ltx_p"><span id="A1.F6.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/YOUR_ANSWER&gt;</span></span>
<span id="A1.F6.pic1.2.21" class="ltx_p"><span id="A1.F6.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">Instructions:</span></span>
<span id="A1.F6.pic1.2.22" class="ltx_p"><span id="A1.F6.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Re-read the question carefully and check whether your answer actually addresses all constraints and conditions.</span></span>
<span id="A1.F6.pic1.2.23" class="ltx_p"><span id="A1.F6.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Trace through your reasoning step by step — identify any logical gaps, unjustified assumptions, or calculation errors.</span></span>
<span id="A1.F6.pic1.2.24" class="ltx_p"><span id="A1.F6.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Consider alternative interpretations or approaches you may have overlooked.</span></span>
<span id="A1.F6.pic1.2.25" class="ltx_p"><span id="A1.F6.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. If prior reflections exist, do NOT repeat the same analysis — dig deeper or try a completely different angle.</span></span>
<span id="A1.F6.pic1.2.26" class="ltx_p"><span id="A1.F6.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">You MUST respond with a JSON object in exactly this format and nothing else:</span></span>
<span id="A1.F6.pic1.2.27" class="ltx_p"><span id="A1.F6.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">{</span></span>
<span id="A1.F6.pic1.2.28" class="ltx_p"><span id="A1.F6.pic1.2.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;analysis&quot;: &quot;your detailed step-by-step analysis of what went wrong&quot;,</span></span>
<span id="A1.F6.pic1.2.29" class="ltx_p"><span id="A1.F6.pic1.2.29.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;reflection&quot;: &quot;one-sentence actionable lesson to avoid this mistake next time&quot;</span></span>
<span id="A1.F6.pic1.2.30" class="ltx_p"><span id="A1.F6.pic1.2.30.1" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span></span></foreignobject></g></g></svg>