<svg id="A1.F7.pic1" class="ltx_picture ltx_centering" height="634.08" overflow="visible" version="1.1" viewbox="0 0 653.15 634.08" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,634.08) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.63 L 0 612.03 C 0 614.59 2.07 616.66 4.63 616.66 L 648.52 616.66 C 651.08 616.66 653.15 614.59 653.15 612.03 L 653.15 4.63 C 653.15 2.07 651.08 0 648.52 0 L 4.63 0 C 2.07 0 0 2.07 0 4.63 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 4.63 L 0.69 612.03 C 0.69 614.2 2.45 615.97 4.63 615.97 L 648.52 615.97 C 650.7 615.97 652.46 614.2 652.46 612.03 L 652.46 4.63 C 652.46 2.45 650.7 0.69 648.52 0.69 L 4.63 0.69 C 2.45 0.69 0.69 2.45 0.69 4.63 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 7.87 608.78)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 25.29 L 257.93 25.29 L 257.93 0 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 1.57 1.57 L 1.57 23.72 L 256.36 23.72 L 256.36 1.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.19)"><foreignobject style="--ltx-fo-width:14.61em;--ltx-fo-height:0.6em;--ltx-fo-depth:0.17em;font-size:11.5pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="232.49"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.F7.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Template Creation Meta Prompt</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.96)"><foreignobject style="--ltx-fo-width:44.26em;--ltx-fo-height:42.51em;--ltx-fo-depth:0.25em;font-size:10pt;" height="591.66" overflow="visible" transform="matrix(1 0 0 -1 0 588.2)" width="612.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.26em;">
<span id="A1.F7.pic1.2.1" class="ltx_p"><span id="A1.F7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert at abstracting reusable problem-solving templates.</span></span>
<span id="A1.F7.pic1.2.2" class="ltx_p"><span id="A1.F7.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your job: given a question and its correct answer, extract a generalizable template that can guide solving similar problems in the future.</span></span>
<span id="A1.F7.pic1.2.3" class="ltx_p"><span id="A1.F7.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">A model answered the following question correctly. Abstract this success into a reusable template.</span></span>
<span id="A1.F7.pic1.2.4" class="ltx_p"><span id="A1.F7.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;QUESTION&gt;</span></span>
<span id="A1.F7.pic1.2.5" class="ltx_p"><span id="A1.F7.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{question}</span></span>
<span id="A1.F7.pic1.2.6" class="ltx_p"><span id="A1.F7.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/QUESTION&gt;</span></span>
<span id="A1.F7.pic1.2.7" class="ltx_p"><span id="A1.F7.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;REFLECTIONs&gt;</span></span>
<span id="A1.F7.pic1.2.8" class="ltx_p"><span id="A1.F7.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">{reflections}</span></span>
<span id="A1.F7.pic1.2.9" class="ltx_p"><span id="A1.F7.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/REFLECTIONs&gt;</span></span>
<span id="A1.F7.pic1.2.10" class="ltx_p"><span id="A1.F7.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;CORRECT_ANSWER&gt;</span></span>
<span id="A1.F7.pic1.2.11" class="ltx_p"><span id="A1.F7.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">{correct_pred}</span></span>
<span id="A1.F7.pic1.2.12" class="ltx_p"><span id="A1.F7.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/CORRECT_ANSWER&gt;</span></span>
<span id="A1.F7.pic1.2.13" class="ltx_p"><span id="A1.F7.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">{reflections_block}</span></span>
<span id="A1.F7.pic1.2.14" class="ltx_p"><span id="A1.F7.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">Instructions:</span></span>
<span id="A1.F7.pic1.2.15" class="ltx_p"><span id="A1.F7.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Analyze the question type, scenario characteristics, and what makes this kind of problem recognizable.</span></span>
<span id="A1.F7.pic1.2.16" class="ltx_p"><span id="A1.F7.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Abstract the general solution procedure based on the successful reasoning trajectory. Describe the key reasoning or analysis steps needed to solve this type of problem. Each step should represent a high-level reasoning operation and can be directly reusable for a new problem that matches the same scenario. Keep the steps minimal, non-redundant, and sufficient for a single-pass solution attempt.</span></span>
<span id="A1.F7.pic1.2.17" class="ltx_p"><span id="A1.F7.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. If prior failed attempts and reflections are provided, incorporate the lessons learned as pitfalls to avoid in the strategy.</span></span>
<span id="A1.F7.pic1.2.18" class="ltx_p"><span id="A1.F7.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. Produce:</span></span>
<span id="A1.F7.pic1.2.19" class="ltx_p"><span id="A1.F7.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">- &quot;when_to_use&quot;: a concise description of WHEN this template should be applied (what kind of question/scenario triggers it)</span></span>
<span id="A1.F7.pic1.2.20" class="ltx_p"><span id="A1.F7.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">- &quot;strategy&quot;: the abstracted step-by-step reasoning procedure for this type of problem, including pitfalls to avoid if reflections are available</span></span>
<span id="A1.F7.pic1.2.21" class="ltx_p"><span id="A1.F7.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">You MUST respond with a JSON object in exactly this format and nothing else:</span></span>
<span id="A1.F7.pic1.2.22" class="ltx_p"><span id="A1.F7.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">{</span></span>
<span id="A1.F7.pic1.2.23" class="ltx_p"><span id="A1.F7.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;when_to_use&quot;: &quot;one-sentence description of the applicable scenario&quot;,</span></span>
<span id="A1.F7.pic1.2.24" class="ltx_p"><span id="A1.F7.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;strategy&quot;: &quot;concise general reasoning strategy for this type of problem&quot;</span></span>
<span id="A1.F7.pic1.2.25" class="ltx_p"><span id="A1.F7.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span></span></span></foreignobject></g></g></svg>