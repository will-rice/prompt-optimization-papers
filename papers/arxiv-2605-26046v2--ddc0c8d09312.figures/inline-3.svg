</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.3 11.76)"><foreignobject style="--ltx-fo-width:46em;--ltx-fo-height:7.9em;--ltx-fo-depth:0.25em;font-size:10pt;" class="ltx_minipage" height="112.77" overflow="visible" transform="matrix(1 0 0 -1 0 109.31)" width="43.81em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A6.SS1.p2.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are measuring how focused a piece of
textual feedback (called a &quot;gradient&quot;) is on
a specific evaluation task, versus being
diluted with generic advice or advice that
belongs to other tasks.

The target task is &quot;{task}&quot;. The possible
tasks are: fluency, relevance, coherence,
consistency.

Rate from 1 to 10 how well this gradient
focuses on the &quot;{task}&quot; task.
1 = completely generic or mostly addresses
    other tasks.
10 = laser-focused on &quot;{task}&quot; with concrete,
     task-specific fixes.

## The Gradient
{gradient_text}

Respond with ONLY a single integer from 1
to 10. No explanation.
</pre></span></span></foreignobject></g></g></svg>