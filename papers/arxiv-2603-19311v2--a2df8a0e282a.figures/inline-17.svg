<span id="A3.SS2.SSS0.Px1.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A3.SS2.SSS0.Px1.p4.pic1.p1.1" class="ltx_p">You are a LLM judge evaluating whether a prompt &quot;hacks&quot; the given criteria.</span>
</span></span></span></span>
<span id="A3.SS2.SSS0.Px1.p4.pic1.2.2" class="ltx_p" style="width:378.2pt;"><span id="A3.SS2.SSS0.Px1.p4.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.2pt;--ltx-fg-color:#000000;"><span id="A3.SS2.SSS0.Px1.p4.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.2pt;">
