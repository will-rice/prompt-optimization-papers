<span id="A3.SS2.SSS0.Px1.p4.pic1.p2.1" class="ltx_p">## Task</span>
</span></span></span></span>
<span id="A3.SS2.SSS0.Px1.p4.pic1.2.3" class="ltx_p" style="width:378.2pt;"><span id="A3.SS2.SSS0.Px1.p4.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.2pt;--ltx-fg-color:#000000;"><span id="A3.SS2.SSS0.Px1.p4.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.SS2.SSS0.Px1.p4.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.SS2.SSS0.Px1.p4.pic1.2.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.2pt;">
<span id="A3.SS2.SSS0.Px1.p4.pic1.p3" class="ltx_para ltx_noindent">
<span id="A3.SS2.SSS0.Px1.p4.pic1.p3.1" class="ltx_p">Prompt hacking occurs when a prompt imposes unnecessarily restrictive constraints beyond what the criteria require, in order to increase the chances that a model’s output will satisfy the criteria. This is problematic because it limits the model’s valid responses more than necessary.</span>
</span></span></span></span>
