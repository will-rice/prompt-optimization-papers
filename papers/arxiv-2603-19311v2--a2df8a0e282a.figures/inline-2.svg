</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 212.6)"><foreignobject style="--ltx-fo-width:37.82em;--ltx-fo-height:0.61em;--ltx-fo-depth:14.4em;font-size:10pt;" height="207.71" overflow="visible" transform="matrix(1 0 0 -1 0 8.46)" width="523.32"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.82em;">
<span id="A1.SS2.p1.pic1.2.1" class="ltx_p"><span id="A1.SS2.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an evaluator of LLMs. You will be given a few examples of the same questions and the responses from the same LLM with two different instructions. You must choose the response you like better, on the basis of the answers being more correct and better reasoning, and provide feedback about why you chose that one and what can be improved about the one you didn’t choose. Pay attention to which version actually gets more of the questions right using the correct reasoning. Point out any flaws in the reasonings of both of them. Then, you will be given the non-preferred instruction and the feedback, and you will be asked to produce an improved instruction based on the feedback. Focus on if the non-preferred instruction is missing key information and/or what parts of the non-preferred instruction is the LLM following and which parts it isn’t.
<span id="A1.SS2.p1.pic1.2.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
