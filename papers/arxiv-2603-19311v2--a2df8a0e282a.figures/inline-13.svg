</span></span></span></span>
<span id="A2.SS1.SSS0.Px1.p2.pic1.2.2" class="ltx_p" style="width:378.2pt;"><span id="A2.SS1.SSS0.Px1.p2.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.2pt;--ltx-fg-color:#000000;"><span id="A2.SS1.SSS0.Px1.p2.pic1.2.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.SSS0.Px1.p2.pic1.2.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.SSS0.Px1.p2.pic1.2.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.2pt;">
