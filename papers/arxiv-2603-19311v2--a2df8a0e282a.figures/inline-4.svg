<span id="A1.SS2.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS2.p3.pic1.p1.1" class="ltx_p">You are an expert evaluator comparing LLM responses using two different instructions. You will first look at the outputs of using these different instructions, evaluate which one is better according to the criteria that are specified and provide feedback on what the nonpreferred version didn’t do and what was good about the preferred version.</span>
</span></span></span></span>
<span id="A1.SS2.p3.pic1.2.2" class="ltx_p" style="width:378.2pt;"><span id="A1.SS2.p3.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.2pt;--ltx-fg-color:#000000;"><span id="A1.SS2.p3.pic1.2.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS2.p3.pic1.2.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS2.p3.pic1.2.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.2pt;">
<span id="A1.SS2.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS2.p3.pic1.p2.1" class="ltx_p">    Then you will use this feedback to actually make an improved instruction.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>