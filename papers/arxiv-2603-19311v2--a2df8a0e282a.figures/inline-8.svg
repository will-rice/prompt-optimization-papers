<span id="A1.SS3.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.89em;">
<span id="A1.SS3.p3.pic1.1.1" class="ltx_p"><span id="A1.SS3.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Optimizer System Prompt (IFEval-Hard)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 13.35)"><foreignobject style="--ltx-fo-width:37.82em;--ltx-fo-height:7.81em;--ltx-fo-depth:0em;font-size:10pt;" height="108.08" overflow="visible" transform="matrix(1 0 0 -1 0 108.08)" width="523.32"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.82em;">
<span id="A1.SS3.p3.pic1.2.1" class="ltx_p"><span id="A1.SS3.p3.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.2pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p3.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p3.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p3.pic1.2.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.2pt;">
<span id="A1.SS3.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS3.p3.pic1.p1.1" class="ltx_p">You are an expert evaluator comparing LLM responses using two different instructions. You will first look at the outputs of using these different instructions, evaluate which one is better according to the criteria that are specified and provide feedback on what the nonpreferred version didn’t do and what was good about the preferred version.</span>
</span></span></span></span>
<span id="A1.SS3.p3.pic1.2.2" class="ltx_p" style="width:378.2pt;"><span id="A1.SS3.p3.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:378.2pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p3.pic1.2.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p3.pic1.2.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS3.p3.pic1.2.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:378.2pt;">
<span id="A1.SS3.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS3.p3.pic1.p2.1" class="ltx_p">    Then you will use this feedback to actually make an improved instruction.</span>
</span></span></span></span>
<span id="A1.SS3.p3.pic1.2.3" class="ltx_p"><span id="A1.SS3.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Note: The optimizer model call is passed the entire message history from the discriminator and then the user prompt below is concatenated after so they share the same system prompt. This is done to provide the optimizer with maximum context and doing this through the OpenAI API allows the model access to the hidden reasoning chain for even more contextual awareness.</span></span>
</span></span></span></foreignobject></g></g></svg>