<span id="A2.SS5.SSS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A2.SS5.SSS1.p1.pic1.2.1" class="ltx_p"><span id="A2.SS5.SSS1.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given multiple candidate answers to a question, each supported by one or more passages and associated confidence indicators. Your task is to carefully verify the correctness and reliability of each candidate answer by cross-checking the supporting passages for consistency, factual accuracy, and strength of evidence. Consider any confidence indicators provided as part of your assessment. If some answers conflict, analyze the evidence to determine which answer is most trustworthy. If no answer is sufficiently supported, indicate that no reliable answer could be determined. Finally, rank the candidate answers from most to least reliable and provide a clear explanation for your ranking and the final selected answer.</span></span>
