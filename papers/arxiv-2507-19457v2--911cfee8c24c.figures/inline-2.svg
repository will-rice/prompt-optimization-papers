<svg id="S1.F2.pic2" class="ltx_picture ltx_centering ltx_figure_panel" height="1631.2" overflow="visible" version="1.1" viewbox="0 0 550 1631.2" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1631.2) matrix(1 0 0 -1 0 0)"><g style="--ltx-stroke-color:#808080;--ltx-fill-color:#808080;--ltx-fg-color:#808080;" color="#808080" fill="#808080" fill-opacity="0.5" stroke="#808080" stroke-opacity="0.5"><path style="stroke:none" d="M 3.54 -3.54 L 3.54 1620.76 C 3.54 1624.57 6.63 1627.65 10.43 1627.65 L 546.65 1627.65 C 550.46 1627.65 553.54 1624.57 553.54 1620.76 L 553.54 -3.54 Z" /></g><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 1626.08 C 0 1628.91 2.29 1631.2 5.12 1631.2 L 544.88 1631.2 C 547.71 1631.2 550 1628.91 550 1626.08 L 550 0 Z" /></g><g style="--ltx-fill-color:#E9F0FF;" fill="#E9F0FF" fill-opacity="1.0"><path style="stroke:none" d="M 1.18 1.18 L 1.18 1594.75 L 548.82 1594.75 L 548.82 1.18 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.87 1616.47)"><foreignobject style="--ltx-fo-width:31.94em;--ltx-fo-height:0.69em;--ltx-fo-depth:1.2em;font-size:10pt;" height="26.21" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="441.96"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.F2.pic2.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.94em;">
<span id="S1.F2.pic2.1.1" class="ltx_p"><span id="S1.F2.pic2.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">GEPA’s Optimized Prompt for Second-Hop of Multi-Hop QA System, GPT-4.1 Mini</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.87 172.12)"><foreignobject style="--ltx-fo-width:36.73em;--ltx-fo-height:101.96em;--ltx-fo-depth:11.5em;font-size:10pt;" height="1569.96" overflow="visible" transform="matrix(1 0 0 -1 0 1410.84)" width="508.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.F2.pic2.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.73em;">
<span id="S1.F2.pic2.2.1" class="ltx_p"><span id="S1.F2.pic2.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">You will be given two input fields: <span id="S1.F2.pic2.2.1.1.1" class="ltx_text ltx_font_typewriter">question</span> and <span id="S1.F2.pic2.2.1.1.2" class="ltx_text ltx_font_typewriter">summary_1</span>.<span id="S1.F2.pic2.2.1.1.3" class="ltx_text ltx_font_medium"> </span>Your task:<span id="S1.F2.pic2.2.1.1.4" class="ltx_text ltx_font_medium"> Generate a new search query (<span id="S1.F2.pic2.2.1.1.4.1" class="ltx_text ltx_font_typewriter">query</span>) <em id="S1.F2.pic2.2.1.1.4.2" class="ltx_emph ltx_font_italic">optimized for the second hop</em> of a multi-hop retrieval system.</span></span></span>
<span id="S1.I1" class="ltx_itemize">
<span id="S1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S1.I1.i1.p1.1" class="ltx_p"><span id="S1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The original user question is typically complex and requires information from multiple documents to answer.</span></span>
</span></span>
<span id="S1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S1.I1.i2.p1.1" class="ltx_p"><span id="S1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The first hop query is the original question (used to retrieve initial documents).</span></span>
</span></span>
<span id="S1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I1.i3.p1" class="ltx_para">
<span id="S1.I1.i3.p1.1" class="ltx_p"><span id="S1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your goal: generate a query to retrieve documents </span><em id="S1.I1.i3.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">not</em><span id="S1.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> found in first hop but necessary to answer the question completely.</span></span>
</span></span>
</span>
<span id="S1.F2.pic2.2.2" class="ltx_p"><span id="S1.F2.pic2.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input Understanding:<span id="S1.F2.pic2.2.2.1.1" class="ltx_text ltx_font_medium"> <span id="S1.F2.pic2.2.2.1.1.1" class="ltx_text ltx_font_typewriter">question</span> is the original multi-hop question posed by the user. <span id="S1.F2.pic2.2.2.1.1.2" class="ltx_text ltx_font_typewriter">summary_1</span> is a concise summary of information from a document retrieved in the first hop, which partially addresses the question.</span></span></span>
<span id="S1.F2.pic2.2.3" class="ltx_p"><span id="S1.F2.pic2.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Purpose and Context:<span id="S1.F2.pic2.2.3.1.1" class="ltx_text"></span></span></span>
<span id="S1.I2" class="ltx_itemize">
<span id="S1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="S1.I2.i1.p1.1" class="ltx_p"><span id="S1.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your generated </span><span id="S1.I2.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">query</span><span id="S1.I2.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> aims to find the </span><em id="S1.I2.i1.p1.1.4" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">missing pieces</em><span id="S1.I2.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> of information needed to fully answer the question. …</span></span>
</span></span>
<span id="S1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I2.i2.p1" class="ltx_para">
<span id="S1.I2.i2.p1.1" class="ltx_p"><span id="S1.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The query must retrieve relevant documents </span><em id="S1.I2.i2.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">NOT</em><span id="S1.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> found in first hop …for final answer extraction.</span></span>
</span></span>
</span>
<span id="S1.F2.pic2.2.4" class="ltx_p"><span id="S1.F2.pic2.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Key Observations and Lessons:<span id="S1.F2.pic2.2.4.1.1" class="ltx_text"></span></span></span>
<span id="S1.I3" class="ltx_itemize">
<span id="S1.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="S1.I3.i1.p1.1" class="ltx_p"><span id="S1.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">First-hop documents often cover one entity or aspect.</span></span>
</span></span>
<span id="S1.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="S1.I3.i2.p1.1" class="ltx_p"><span id="S1.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Remaining relevant documents often involve connected or higher-level concepts mentioned in </span><span id="S1.I3.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">summary_1</span><span id="S1.I3.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> but not explicitly asked in the original question. The </span><span id="S1.I3.i2.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">query</span><span id="S1.I3.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> should target these </span><em id="S1.I3.i2.p1.1.6" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">missing</em><span id="S1.I3.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">, but logically linked, documents.</span></span>
</span></span>
<span id="S1.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I3.i3.p1" class="ltx_para ltx_noindent">
<span id="S1.I3.i3.p1.1" class="ltx_p"><span id="S1.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoid merely paraphrasing the original question or restating known facts from </span><span id="S1.I3.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">summary_1</span><span id="S1.I3.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S1.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I3.i4.p1" class="ltx_para ltx_noindent">
<span id="S1.I3.i4.p1.1" class="ltx_p"><span id="S1.I3.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Infer what broader or related entities/concepts might provide the crucial missing information.</span></span>
</span></span>
<span id="S1.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I3.i5.p1" class="ltx_para ltx_noindent">
<span id="S1.I3.i5.p1.1" class="ltx_p"><span id="S1.I3.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For example:</span></span>
<span id="S1.I3.i5.I1" class="ltx_itemize">
<span id="S1.I3.i5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S1.I3.i5.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="S1.I3.i5.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S1.I3.i5.I1.i1.p1.1" class="ltx_p"><span id="S1.I3.i5.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If </span><span id="S1.I3.i5.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">summary_1</span><span id="S1.I3.i5.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> describes a population for a small civil parish, but the question wants the total population of the wider region, your query should target that wider region (e.g., “Madeira archipelago population in 2011”).</span></span>
</span></span>
<span id="S1.I3.i5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S1.I3.i5.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="S1.I3.i5.I1.i2.p1" class="ltx_para">
<span id="S1.I3.i5.I1.i2.p1.1" class="ltx_p"><span id="S1.I3.i5.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If </span><span id="S1.I3.i5.I1.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">summary_1</span><span id="S1.I3.i5.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> covers a song and the question asks for the album, target album-level documents.</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="S1.F2.pic2.2.5" class="ltx_p"><span id="S1.F2.pic2.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">How to Build the Query:<span id="S1.F2.pic2.2.5.1.1" class="ltx_text"></span></span></span>
<span id="S1.I4" class="ltx_itemize">
<span id="S1.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I4.i1.p1" class="ltx_para ltx_noindent">
<span id="S1.I4.i1.p1.1" class="ltx_p"><span id="S1.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify entities or topics mentioned in </span><span id="S1.I4.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">summary_1</span><span id="S1.I4.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> that are related but different from first-hop documents.</span></span>
</span></span>
<span id="S1.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I4.i2.p1" class="ltx_para ltx_noindent">
<span id="S1.I4.i2.p1.1" class="ltx_p"><span id="S1.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reframe the query to explicitly mention these broader or related entities </span><em id="S1.I4.i2.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">connected to the original question</em><span id="S1.I4.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S1.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I4.i3.p1" class="ltx_para ltx_noindent">
<span id="S1.I4.i3.p1.1" class="ltx_p"><span id="S1.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Include relevant key context from the question to maintain specificity, but shift focus to the missing piece.</span></span>
</span></span>
<span id="S1.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I4.i4.p1" class="ltx_para">
<span id="S1.I4.i4.p1.1" class="ltx_p"><span id="S1.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The goal is to retrieve documents that link or complement what was retrieved initially.</span></span>
</span></span>
</span>
<span id="S1.F2.pic2.2.6" class="ltx_p"><span id="S1.F2.pic2.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Practical Strategy:<span id="S1.F2.pic2.2.6.1.1" class="ltx_text"></span></span></span>
<span id="S1.I5" class="ltx_itemize">
<span id="S1.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I5.i1.p1" class="ltx_para ltx_noindent">
<span id="S1.I5.i1.p1.1" class="ltx_p"><span id="S1.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read the </span><span id="S1.I5.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">summary_1</span><span id="S1.I5.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> carefully to spot references to bigger contexts or other entities not covered in the first hop.</span></span>
</span></span>
<span id="S1.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I5.i2.p1" class="ltx_para ltx_noindent">
<span id="S1.I5.i2.p1.1" class="ltx_p"><span id="S1.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ask: “What entity or aspect does this summary hint at that could answer the original question but was not found yet?”</span></span>
</span></span>
<span id="S1.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I5.i3.p1" class="ltx_para">
<span id="S1.I5.i3.p1.1" class="ltx_p"><span id="S1.I5.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Formulate a precise, focused factual query targeting that entity or concept to retrieve the missing documents.</span></span>
</span></span>
</span>
<span id="S1.F2.pic2.2.7" class="ltx_p"><span id="S1.F2.pic2.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="S1.F2.pic2.2.7.1.1" class="ltx_text"></span></span></span>
<span id="S1.I6" class="ltx_itemize">
<span id="S1.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I6.i1.p1" class="ltx_para ltx_noindent">
<span id="S1.I6.i1.p1.1" class="ltx_p"><span id="S1.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Produce </span><span id="S1.I6.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">query</span><span id="S1.I6.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> as a clear, concise question or keyword phrase designed for efficient retrieval of second-hop documents.</span></span>
</span></span>
<span id="S1.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I6.i2.p1" class="ltx_para">
<span id="S1.I6.i2.p1.1" class="ltx_p"><span id="S1.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure the query relates logically to the original question while targeting the broader or complementary knowledge identified in </span><span id="S1.I6.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">summary_1</span><span id="S1.I6.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">. … Do not include the original question or simply rephrase it. Do not duplicate information already well-covered by the first hop
retrieval …</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>