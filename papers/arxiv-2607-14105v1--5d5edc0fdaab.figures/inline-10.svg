<svg id="A3.F17.pic1" class="ltx_picture" height="596.99" overflow="visible" version="1.1" viewbox="0 0 477.38 596.99" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,596.99) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#36454F;" fill="#36454F" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 591.09 C 0 594.35 2.64 596.99 5.91 596.99 L 471.47 596.99 C 474.73 596.99 477.38 594.35 477.38 591.09 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 570.42 L 475.41 570.42 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g style="--ltx-fill-color:#36454F;" fill="#36454F" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 572.39 L 1.97 591.09 C 1.97 593.26 3.73 595.02 5.91 595.02 L 471.47 595.02 C 473.65 595.02 475.41 593.26 475.41 591.09 L 475.41 572.39 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 579.56)"><foreignobject style="--ltx-fo-width:23.24em;--ltx-fo-height:0.83em;--ltx-fo-depth:0.23em;font-size:10pt;" height="14.76" overflow="visible" transform="matrix(1 0 0 -1 0 11.53)" width="321.58"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.F17.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:23.24em;">
<span id="A3.F17.pic1.1.1" class="ltx_p"><span id="A3.F17.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#FFFFFF;">Prompt template for the adversary</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:33.91em;--ltx-fo-height:39.2em;--ltx-fo-depth:0.18em;font-size:10pt;" height="544.84" overflow="visible" transform="matrix(1 0 0 -1 0 542.42)" width="469.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.F17.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="A3.F17.pic1.2.1" class="ltx_p"><span id="A3.F17.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Given the following task:
<br class="ltx_break"></span></span>
<span id="A3.F17.pic1.2.2" class="ltx_p"><span id="A3.F17.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">task_description
<br class="ltx_break"></span></span>
<span id="A3.F17.pic1.2.3" class="ltx_p"><span id="A3.F17.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">And an instruction that was generated using knowledge of the reference answer:
<br class="ltx_break"></span></span>
<span id="A3.F17.pic1.2.4" class="ltx_p"><span id="A3.F17.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">prompt
<br class="ltx_break"></span></span>
<span id="A3.F17.pic1.2.5" class="ltx_p"><span id="A3.F17.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Your goal is to reconstruct the exact expected answer from the instruction.
<br class="ltx_break"></span></span>
<span id="A3.F17.pic1.2.6" class="ltx_p"><span id="A3.F17.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The instruction may contain partial, indirect, or subtle clues about the answer. You must extract and combine all such clues.
<br class="ltx_break"></span></span>
<span id="A3.F17.pic1.2.7" class="ltx_p"><span id="A3.F17.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Follow these steps carefully:</span></span>
<span id="A3.I1" class="ltx_enumerate">
<span id="A3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I1.i1.p1" class="ltx_para">
<span id="A3.I1.i1.p1.1" class="ltx_p"><span id="A3.I1.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Identify all potentially relevant signals in the instruction:</span></span>
<span id="A3.I1.i1.I1" class="ltx_itemize">
<span id="A3.I1.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i1.I1.i1.p1" class="ltx_para">
<span id="A3.I1.i1.I1.i1.p1.1" class="ltx_p"><span id="A3.I1.i1.I1.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">numbers, entities, or phrases that could appear in the answer</span></span>
</span></span>
<span id="A3.I1.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i1.I1.i2.p1" class="ltx_para">
<span id="A3.I1.i1.I1.i2.p1.1" class="ltx_p"><span id="A3.I1.i1.I1.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">constraints that restrict what the answer could be</span></span>
</span></span>
<span id="A3.I1.i1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i1.I1.i3.p1" class="ltx_para">
<span id="A3.I1.i1.I1.i3.p1.1" class="ltx_p"><span id="A3.I1.i1.I1.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">hints about the reasoning steps or structure of the answer</span></span>
</span></span>
<span id="A3.I1.i1.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i1.I1.i4.p1" class="ltx_para">
<span id="A3.I1.i1.I1.i4.p1.1" class="ltx_p"><span id="A3.I1.i1.I1.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">formatting patterns (e.g., step-by-step reasoning, final statement)</span></span>
</span></span>
</span>
</span></span>
<span id="A3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I1.i2.p1" class="ltx_para">
<span id="A3.I1.i2.p1.1" class="ltx_p"><span id="A3.I1.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Based on these signals, infer what the answer must look like:</span></span>
<span id="A3.I1.i2.I1" class="ltx_itemize">
<span id="A3.I1.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i2.I1.i1.p1" class="ltx_para">
<span id="A3.I1.i2.I1.i1.p1.1" class="ltx_p"><span id="A3.I1.i2.I1.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">what components it contains</span></span>
</span></span>
<span id="A3.I1.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i2.I1.i2.p1" class="ltx_para">
<span id="A3.I1.i2.I1.i2.p1.1" class="ltx_p"><span id="A3.I1.i2.I1.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">how it is structured</span></span>
</span></span>
<span id="A3.I1.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i2.I1.i3.p1" class="ltx_para">
<span id="A3.I1.i2.I1.i3.p1.1" class="ltx_p"><span id="A3.I1.i2.I1.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">any key values or conclusions</span></span>
</span></span>
</span>
</span></span>
<span id="A3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I1.i3.p1" class="ltx_para">
<span id="A3.I1.i3.p1.1" class="ltx_p"><span id="A3.I1.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Construct the most likely full answer that is consistent with all extracted clues.</span></span>
<span id="A3.I1.i3.I1" class="ltx_itemize">
<span id="A3.I1.i3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i3.I1.i1.p1" class="ltx_para">
<span id="A3.I1.i3.I1.i1.p1.1" class="ltx_p"><span id="A3.I1.i3.I1.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">If information is missing, infer the most plausible completion</span></span>
</span></span>
<span id="A3.I1.i3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i3.I1.i2.p1" class="ltx_para">
<span id="A3.I1.i3.I1.i2.p1.1" class="ltx_p"><span id="A3.I1.i3.I1.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Prefer a complete and coherent answer over a partial one</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A3.F17.pic1.2.8" class="ltx_p"><span id="A3.F17.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You must make a best effort reconstruction, even if the clues are incomplete.</span></span>
</span></span></span></foreignobject></g></g></svg>