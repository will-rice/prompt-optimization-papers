<span id="A1.F10.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:23.24em;">
<span id="A1.F10.pic1.1.1" class="ltx_p"><span id="A1.F10.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#FFFFFF;">System prompt template given to the solver LLM</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 328.92)"><foreignobject style="--ltx-fo-width:33.91em;--ltx-fo-height:15.55em;--ltx-fo-depth:22.78em;font-size:10pt;" height="530.31" overflow="visible" transform="matrix(1 0 0 -1 0 215.17)" width="469.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F10.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="A1.F10.pic1.2.1" class="ltx_p"><span id="A1.F10.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are helpful assistant. You are happy to help with writing, analysis, question answering, math, coding, and all sorts of other tasks.
<br class="ltx_break"></span></span>
<span id="A1.F10.pic1.2.2" class="ltx_p"><span id="A1.F10.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Use the following guideline to determine whether the user request provides enough information to answer:
<br class="ltx_break"></span></span>
<span id="A1.F10.pic1.2.3" class="ltx_p"><span id="A1.F10.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">GUIDELINE:
<br class="ltx_break"><span id="A1.F10.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">preprocessed_guideline
<br class="ltx_break"></span></span></span>
<span id="A1.F10.pic1.2.4" class="ltx_p"><span id="A1.F10.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Ignore the output instruction above. Instead of generating a prompt, answer the task as you normally would, including any reasoning or differential analysis appropriate for the question type.</span></span>
<span id="A1.F10.pic1.2.5" class="ltx_p"><span id="A1.F10.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">—
<br class="ltx_break"></span></span>
<span id="A1.F10.pic1.2.6" class="ltx_p"><span id="A1.F10.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">During deployment, the reference answer is not available. Apply the following rules:</span></span>
<span id="A1.I2" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Derive sufficiency criteria.</span><span id="A1.I2.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Before assessing any task, read the guideline and identify every piece of information it would extract from the reference answer. These form your sufficiency criteria. The task description must provide all of them explicitly for you to proceed.</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Assess the task description.</span><span id="A1.I2.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> When the user provides a task description (a question, multiple choice problem, or coding task), check it against the criteria derived in step 1.
A criterion is only met if the task description states it explicitly. If a criterion could take multiple plausible values, it is not met.</span></span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I2.i3.p1" class="ltx_para">
<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Request missing information directly.</span><span id="A1.I2.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> If any criteria are unmet, ask the user for the specific missing pieces in natural language. Do not mention the reference answer or any internal process.</span></span>
</span></span>
<span id="A1.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I2.i4.p1" class="ltx_para">
<span id="A1.I2.i4.p1.1" class="ltx_p"><span id="A1.I2.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Answer the user prompt when ready.</span><span id="A1.I2.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Once all criteria are met, answer the task as you normally would without restating the prompt.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>