<span id="S3.F3.pic1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:11.14em;">
<span id="S3.F3.pic1.p1.pic1.2.1" class="ltx_p"><span id="S3.F3.pic1.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:50%;--ltx-fg-color:#000000;">Query (<math id="S3.F3.pic1.p1.pic1.m1" class="ltx_Math" alttext="\boldsymbol{q}_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">\boldsymbol{q}_{i}</annotation></semantics></math>)<span id="S3.F3.pic1.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium">: I am not feeling well today. <span id="S3.F3.pic1.p1.pic1.2.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#D85A30;">What should I do?
<br class="ltx_break"></span></span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.26 8.6)"><foreignobject style="--ltx-fo-width:11.14em;--ltx-fo-height:23.47em;--ltx-fo-depth:0.14em;font-size:6.81pt;" height="222.39" overflow="visible" transform="matrix(1 0 0 -1 0 221.05)" width="104.91"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.F3.pic1.p1.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:11.14em;">
<span id="S3.F3.pic1.p1.pic1.3.1" class="ltx_p"><span id="S3.F3.pic1.p1.pic1.3.1.1" class="ltx_text ltx_font_bold" style="font-size:50%;--ltx-fg-color:#000000;">Reference answer (<math id="S3.F3.pic1.p1.pic1.m2" class="ltx_Math" alttext="\boldsymbol{a}_{i}^{*}" display="inline" intent=":literal"><semantics><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msubsup><annotation encoding="application/x-tex">\boldsymbol{a}_{i}^{*}</annotation></semantics></math>)<span id="S3.F3.pic1.p1.pic1.3.1.1.1" class="ltx_text ltx_font_medium">:
Based on the patients symptoms (<span id="S3.F3.pic1.p1.pic1.3.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#085037;--ltx-bg-color:#CFE2DB;"> sore throat</span>, <span id="S3.F3.pic1.p1.pic1.3.1.1.1.2" class="ltx_text" style="--ltx-fg-color:#085037;--ltx-bg-color:#CFE2DB;"> mild fever</span>, <span id="S3.F3.pic1.p1.pic1.3.1.1.1.3" class="ltx_text" style="--ltx-fg-color:#085037;--ltx-bg-color:#CFE2DB;"> fatigue</span>, <span id="S3.F3.pic1.p1.pic1.3.1.1.1.4" class="ltx_text" style="--ltx-fg-color:#085037;--ltx-bg-color:#CFE2DB;"> headache</span>, and <span id="S3.F3.pic1.p1.pic1.3.1.1.1.5" class="ltx_text" style="--ltx-fg-color:#085037;--ltx-bg-color:#CFE2DB;"> mild cough</span>) with a rapid onset over <span id="S3.F3.pic1.p1.pic1.3.1.1.1.6" class="ltx_text" style="--ltx-fg-color:#085037;--ltx-bg-color:#CFE2DB;"> 24 hours</span>, a viral upper respiratory infection is most likely. […] Due to the patient’s <span id="S3.F3.pic1.p1.pic1.3.1.1.1.7" class="ltx_text" style="--ltx-fg-color:#085037;--ltx-bg-color:#CFE2DB;"> allergies to ibuprofen</span>, I would recommend </span>paracetamol<span id="S3.F3.pic1.p1.pic1.3.1.1.2" class="ltx_text ltx_font_medium"> to lessen symptoms.</span></span></span>
</span></span></span></foreignobject></g></g></svg>