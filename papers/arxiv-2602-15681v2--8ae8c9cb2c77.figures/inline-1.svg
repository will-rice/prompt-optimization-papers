<svg id="S5.SS4.SSS0.Px2.p2.pic1" class="ltx_picture" height="482.64" overflow="visible" version="1.1" viewbox="0 0 477.38 482.64" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,482.64) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8C8C8C;" fill="#8C8C8C" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.01 L 0 478.63 C 0 480.84 1.8 482.64 4.01 482.64 L 473.36 482.64 C 475.58 482.64 477.38 480.84 477.38 478.63 L 477.38 4.01 C 477.38 1.8 475.58 0 473.36 0 L 4.01 0 C 1.8 0 0 1.8 0 4.01 Z" /></g><g style="--ltx-fill-color:#DFDFDF;" fill="#DFDFDF" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 4.01 L 1.25 459.97 L 476.13 459.97 L 476.13 4.01 C 476.13 2.48 474.89 1.25 473.36 1.25 L 4.01 1.25 C 2.48 1.25 1.25 2.48 1.25 4.01 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.95 467.85)"><foreignobject style="--ltx-fo-width:29em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="401.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS4.SSS0.Px2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:29em;">
<span id="S5.SS4.SSS0.Px2.p2.pic1.1.1" class="ltx_p"><span id="S5.SS4.SSS0.Px2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Results Summary</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.95 431.36)"><foreignobject style="--ltx-fo-width:33.35em;--ltx-fo-height:1.68em;--ltx-fo-depth:30.7em;font-size:10pt;" height="448.09" overflow="visible" transform="matrix(1 0 0 -1 0 23.29)" width="461.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS4.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.35em;">
<span id="S5.I5" class="ltx_itemize ltx_leftmargin_flush">
<span id="S5.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I5.i1.p1" class="ltx_para">
<span id="S5.I5.i1.p1.1" class="ltx_p"><span id="S5.I5.i1.p1.1.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">OmniTune</span><span id="S5.I5.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> handles a wide range of refinement problems, including ones not supported by existing solutions, and outperforms the baselines in nearly all settings.</span></span>
</span></span>
<span id="S5.I5.i2" class="ltx_item" style="list-style-type:none;padding-top:3.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I5.i2.p1" class="ltx_para">
<span id="S5.I5.i2.p1.1" class="ltx_p"><span id="S5.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">With its best-performing LLM (Mistral, the weakest model), </span><span id="S5.I5.i2.p1.1.2" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">OmniTune</span><span id="S5.I5.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> finds an </span><math id="S5.I5.i2.p1.m1" class="ltx_Math" alttext="\varepsilon" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ε</mi><annotation encoding="application/x-tex">\varepsilon</annotation></semantics></math><span id="S5.I5.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">-satisfying refinement (success rate) in </span><math id="S5.I5.i2.p1.m2" class="ltx_Math" alttext="100\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#007300;" mathcolor="#007300">100</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">100\%</annotation></semantics></math><span id="S5.I5.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> of the tasks with an average optimality of </span><math id="S5.I5.i2.p1.m3" class="ltx_Math" alttext="89.8\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#007300;" mathcolor="#007300">89.8</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">89.8\%</annotation></semantics></math><span id="S5.I5.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S5.I5.i3" class="ltx_item" style="list-style-type:none;padding-top:3.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I5.i3.p1" class="ltx_para">
<span id="S5.I5.i3.p1.1" class="ltx_p"><span id="S5.I5.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The two-step OPRO scheme and the history representation of </span><span id="S5.I5.i3.p1.1.2" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">OmniTune</span><span id="S5.I5.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> consistently improve results across all LLMs, over Single-Step OPRO and complete history, respectively. The two-step scheme improves Mistral’s success rate and optimality by </span><math id="S5.I5.i3.p1.m1" class="ltx_Math" alttext="39\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#007300;" mathcolor="#007300">39</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">39\%</annotation></semantics></math><span id="S5.I5.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> and </span><math id="S5.I5.i3.p1.m2" class="ltx_Math" alttext="55\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#007300;" mathcolor="#007300">55</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">55\%</annotation></semantics></math><span id="S5.I5.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, and the history representation improves Gemini’s by </span><math id="S5.I5.i3.p1.m3" class="ltx_Math" alttext="53\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#007300;" mathcolor="#007300">53</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">53\%</annotation></semantics></math><span id="S5.I5.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> and </span><math id="S5.I5.i3.p1.m4" class="ltx_Math" alttext="78\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#007300;" mathcolor="#007300">78</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">78\%</annotation></semantics></math><span id="S5.I5.i3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S5.I5.i4" class="ltx_item" style="list-style-type:none;padding-top:3.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I5.i4.p1" class="ltx_para">
<span id="S5.I5.i4.p1.1" class="ltx_p"><span id="S5.I5.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Increasing the horizon </span><math id="S5.I5.i4.p1.m1" class="ltx_Math" alttext="T" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><annotation encoding="application/x-tex">T</annotation></semantics></math><span id="S5.I5.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> and the number of refinements per iteration </span><math id="S5.I5.i4.p1.m2" class="ltx_Math" alttext="K" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><annotation encoding="application/x-tex">K</annotation></semantics></math><span id="S5.I5.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> improves quality at a higher token cost, with </span><math id="S5.I5.i4.p1.m3" class="ltx_Math" alttext="T=K=5" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></mrow><annotation encoding="application/x-tex">T=K=5</annotation></semantics></math><span id="S5.I5.i4.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> yielding the best tradeoff.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>