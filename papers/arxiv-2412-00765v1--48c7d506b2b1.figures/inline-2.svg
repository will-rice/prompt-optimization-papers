<svg id="A3.SS2.p2.pic1" class="ltx_picture" height="1196.67" overflow="visible" version="1.1" viewbox="0 0 653.15 1196.67" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1196.67) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1190.77 C 0 1194.03 2.64 1196.67 5.91 1196.67 L 647.24 1196.67 C 650.51 1196.67 653.15 1194.03 653.15 1190.77 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1172.56 L 651.18 1172.56 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1181.16)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.SS2.p2.pic1.1.1" class="ltx_p"><span id="A3.SS2.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Adversarial Prompts Generation Template</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:82.7em;--ltx-fo-depth:0.19em;font-size:10pt;" height="1146.99" overflow="visible" transform="matrix(1 0 0 -1 0 1144.3)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.SS2.p2.pic1.2.1" class="ltx_p"><span id="A3.SS2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a knowledge graph triplet and a sentence generated from this triplet.
Your task is to paraphrase the sentence while keeping the semantic meaning of the new sentence unchanged.
The paraphrased sentence should be classified into a different label from the current one.
Use the given information about subjects, objects, their aliases, and the predicate to guide your paraphrasing.</span></span>
<span id="A3.SS2.p2.pic1.2.2" class="ltx_p"><span id="A3.SS2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here are the detailed steps for the task:</span></span>
<span id="A3.SS2.p2.pic1.2.3" class="ltx_p"><span id="A3.SS2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. <span id="A3.SS2.p2.pic1.2.3.1.1" class="ltx_text ltx_font_bold">Paraphrase the Sentence</span>:</span></span>
<span id="A3.I3" class="ltx_itemize">
<span id="A3.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I3.i1.p1" class="ltx_para">
<span id="A3.I3.i1.p1.1" class="ltx_p"><span id="A3.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Rewrite the given sentence in a different way.</span></span>
</span></span>
<span id="A3.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I3.i2.p1" class="ltx_para">
<span id="A3.I3.i2.p1.1" class="ltx_p"><span id="A3.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure that the rewritten sentence maintains the same semantic meaning as the original sentence.</span></span>
</span></span>
</span>
<span id="A3.SS2.p2.pic1.2.4" class="ltx_p"><span id="A3.SS2.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. <span id="A3.SS2.p2.pic1.2.4.1.1" class="ltx_text ltx_font_bold">Change the Classification</span>:</span></span>
<span id="A3.I4" class="ltx_itemize">
<span id="A3.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I4.i1.p1" class="ltx_para">
<span id="A3.I4.i1.p1.1" class="ltx_p"><span id="A3.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The new paraphrased sentence should be classified into a different label from the current label.</span></span>
</span></span>
<span id="A3.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I4.i2.p1" class="ltx_para">
<span id="A3.I4.i2.p1.1" class="ltx_p"><span id="A3.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The possible labels are [&quot;true&quot;, &quot;entity_error&quot;, &quot;predicate_error&quot;].</span></span>
</span></span>
<span id="A3.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I4.i3.p1" class="ltx_para">
<span id="A3.I4.i3.p1.1" class="ltx_p"><span id="A3.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">true: The triplet and the sentence accurately reflect the true content.</span></span>
</span></span>
<span id="A3.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I4.i4.p1" class="ltx_para">
<span id="A3.I4.i4.p1.1" class="ltx_p"><span id="A3.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">entity_error: The triplet contains an error related to the Subject or Object, as well as the sentence.</span></span>
</span></span>
<span id="A3.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I4.i5.p1" class="ltx_para">
<span id="A3.I4.i5.p1.1" class="ltx_p"><span id="A3.I4.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">predicate_error: The triplet contains an error related to the Predicate, as well as in the sentence.</span></span>
</span></span>
</span>
<span id="A3.SS2.p2.pic1.2.5" class="ltx_p"><span id="A3.SS2.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">(Here is five examples that fit the guidance:
Original Sentence: {<span id="A3.SS2.p2.pic1.2.5.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">original sentence 1</span>} -&gt; Paraphrased Sentence: {<span id="A3.SS2.p2.pic1.2.5.1.2" class="ltx_text" style="--ltx-fg-color:#FF0000;">paraphrased sentence 1</span>} 
<br class="ltx_break">… 
<br class="ltx_break">Original Sentence: {<span id="A3.SS2.p2.pic1.2.5.1.3" class="ltx_text" style="--ltx-fg-color:#FF0000;">original sentence 5</span>} -&gt; Paraphrased Sentence: {<span id="A3.SS2.p2.pic1.2.5.1.4" class="ltx_text" style="--ltx-fg-color:#FF0000;">paraphrased sentence 5</span>})</span></span>
<span id="A3.SS2.p2.pic1.2.6" class="ltx_p"><span id="A3.SS2.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the input triplet and sentence for you to paraphrase:</span></span>
<span id="A3.SS2.p2.pic1.2.7" class="ltx_p"><span id="A3.SS2.p2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Triplet:<span id="A3.SS2.p2.pic1.2.7.1.1" class="ltx_text ltx_font_medium">
{
{ &quot;subs&quot;: {<span id="A3.SS2.p2.pic1.2.7.1.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">subject</span>}, &quot;sub_aliases&quot;: {<span id="A3.SS2.p2.pic1.2.7.1.1.2" class="ltx_text" style="--ltx-fg-color:#FF0000;">subject alias</span>}, &quot;predicate&quot;: { &quot;predicate&quot;: {<span id="A3.SS2.p2.pic1.2.7.1.1.3" class="ltx_text" style="--ltx-fg-color:#FF0000;">predicate</span>}, &quot;template&quot;: {<span id="A3.SS2.p2.pic1.2.7.1.1.4" class="ltx_text" style="--ltx-fg-color:#FF0000;">predicate template</span>}, &quot;description&quot;: {<span id="A3.SS2.p2.pic1.2.7.1.1.5" class="ltx_text" style="--ltx-fg-color:#FF0000;">predicate description</span>} }, &quot;objs&quot;: {<span id="A3.SS2.p2.pic1.2.7.1.1.6" class="ltx_text" style="--ltx-fg-color:#FF0000;">object</span>}, &quot;obj_aliases&quot;: {<span id="A3.SS2.p2.pic1.2.7.1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">object alias</span>}, &quot;label&quot;: {<span id="A3.SS2.p2.pic1.2.7.1.1.8" class="ltx_text" style="--ltx-fg-color:#FF0000;">label</span>} }
}</span></span></span>
<span id="A3.SS2.p2.pic1.2.8" class="ltx_p"><span id="A3.SS2.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Where:</span></span>
<span id="A3.I5" class="ltx_itemize">
<span id="A3.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I5.i1.p1" class="ltx_para">
<span id="A3.I5.i1.p1.1" class="ltx_p"><span id="A3.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;subs&quot; is a list of subjects.</span></span>
</span></span>
<span id="A3.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I5.i2.p1" class="ltx_para">
<span id="A3.I5.i2.p1.1" class="ltx_p"><span id="A3.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;sub_aliases&quot; is a list of subject aliases.</span></span>
</span></span>
<span id="A3.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I5.i3.p1" class="ltx_para">
<span id="A3.I5.i3.p1.1" class="ltx_p"><span id="A3.I5.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;predicate&quot; is an object containing the name, template, and description of the relationship.</span></span>
</span></span>
<span id="A3.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I5.i4.p1" class="ltx_para">
<span id="A3.I5.i4.p1.1" class="ltx_p"><span id="A3.I5.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;objs&quot; is a list of objects.</span></span>
</span></span>
<span id="A3.I5.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I5.i5.p1" class="ltx_para">
<span id="A3.I5.i5.p1.1" class="ltx_p"><span id="A3.I5.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;obj_aliases&quot; is a list of object aliases.</span></span>
</span></span>
<span id="A3.I5.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I5.i6.p1" class="ltx_para">
<span id="A3.I5.i6.p1.1" class="ltx_p"><span id="A3.I5.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;label&quot; is the current label of the triplet, which is one of [&quot;true&quot;, &quot;entity_error&quot;, &quot;predicate_error&quot;].</span></span>
</span></span>
</span>
<span id="A3.SS2.p2.pic1.2.9" class="ltx_p"><span id="A3.SS2.p2.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sentence:<span id="A3.SS2.p2.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> {<span id="A3.SS2.p2.pic1.2.9.1.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">sentence</span>}</span></span></span>
<span id="A3.SS2.p2.pic1.2.10" class="ltx_p"><span id="A3.SS2.p2.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Important:<span id="A3.SS2.p2.pic1.2.10.1.1" class="ltx_text ltx_font_medium"> The classification of this sentence is: ’{<span id="A3.SS2.p2.pic1.2.10.1.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">sentence label</span>}’, and label of the sentence after paraphrase should be ’{<span id="A3.SS2.p2.pic1.2.10.1.1.2" class="ltx_text" style="--ltx-fg-color:#FF0000;">wrong label 1</span>}’ or ’{<span id="A3.SS2.p2.pic1.2.10.1.1.3" class="ltx_text" style="--ltx-fg-color:#FF0000;">wrong label 2</span>}’.</span></span></span>
<span id="A3.SS2.p2.pic1.2.11" class="ltx_p"><span id="A3.SS2.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Only output the paraphrased sentence without anything else. 
<br class="ltx_break"><span id="A3.SS2.p2.pic1.2.11.1.1" class="ltx_text ltx_font_bold">Paraphrased Sentence:</span></span></span>
