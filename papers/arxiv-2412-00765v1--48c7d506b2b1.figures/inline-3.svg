<svg id="A3.SS4.p2.pic1" class="ltx_picture" height="478.9" overflow="visible" version="1.1" viewbox="0 0 653.15 478.9" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,478.9) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 473 C 0 476.26 2.64 478.9 5.91 478.9 L 647.24 478.9 C 650.51 478.9 653.15 476.26 653.15 473 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 453.25 L 651.18 453.25 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 462.62)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.SS4.p2.pic1.1.1" class="ltx_p"><span id="A3.SS4.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">(Non-)Adversarial Prompt Template</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:30.66em;--ltx-fo-depth:0.25em;font-size:10pt;" height="427.67" overflow="visible" transform="matrix(1 0 0 -1 0 424.21)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.SS4.p2.pic1.2.1" class="ltx_p"><span id="A3.SS4.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a sentence that describes the content of a triplet in the form (Subject, Predicate, Object).
Each triplet and its corresponding sentence are classified into one of the three categories based on the accuracy of the content and the type of error:</span></span>
<span id="A3.I6" class="ltx_enumerate">
<span id="A3.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I6.i1.p1" class="ltx_para">
<span id="A3.I6.i1.p1.1" class="ltx_p"><span id="A3.I6.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">true</span><span id="A3.I6.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The triplet and the sentence accurately reflect the true content.</span></span>
</span></span>
<span id="A3.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I6.i2.p1" class="ltx_para">
<span id="A3.I6.i2.p1.1" class="ltx_p"><span id="A3.I6.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">entity_error</span><span id="A3.I6.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The triplet contains an error related to the Subject or Object, which is reflected in the sentence.</span></span>
</span></span>
<span id="A3.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I6.i3.p1" class="ltx_para">
<span id="A3.I6.i3.p1.1" class="ltx_p"><span id="A3.I6.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">predicate_error</span><span id="A3.I6.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The triplet contains an error related to the Predicate, which is reflected in the sentence.</span></span>
</span></span>
</span>
<span id="A3.SS4.p2.pic1.2.2" class="ltx_p"><span id="A3.SS4.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here are some examples to help you understand:</span></span>
<span id="A3.I7" class="ltx_enumerate">
<span id="A3.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I7.i1.p1" class="ltx_para">
<span id="A3.I7.i1.p1.1" class="ltx_p"><span id="A3.I7.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Sentence: &quot;Albert Einstein discovered the Theory of Relativity.&quot; </span>
<br class="ltx_break"><span id="A3.I7.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Category: true</span></span>
</span></span>
<span id="A3.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I7.i2.p1" class="ltx_para">
<span id="A3.I7.i2.p1.1" class="ltx_p"><span id="A3.I7.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Sentence: &quot;Albert Einstein discovered Radium.&quot; </span>
<br class="ltx_break"><span id="A3.I7.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Category: entity_error</span></span>
</span></span>
<span id="A3.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I7.i3.p1" class="ltx_para">
<span id="A3.I7.i3.p1.1" class="ltx_p"><span id="A3.I7.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Sentence: &quot;Albert Einstein disproved the Theory of Relativity.&quot; </span>
<br class="ltx_break"><span id="A3.I7.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Category: predicate_error</span></span>
</span></span>
</span>
<span id="A3.SS4.p2.pic1.2.3" class="ltx_p"><span id="A3.SS4.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to analyze the given sentence and determine which of the three categories it belongs to: &quot;true,&quot; &quot;entity_error,&quot; or &quot;predicate_error.&quot;</span></span>
<span id="A3.SS4.p2.pic1.2.4" class="ltx_p"><span id="A3.SS4.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now, please classify the following sentence based on its content. Only output the category without anything else:</span></span>
<span id="A3.SS4.p2.pic1.2.5" class="ltx_p"><span id="A3.SS4.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sentence:<span id="A3.SS4.p2.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> &quot;<span id="A3.SS4.p2.pic1.2.5.1.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">sentence</span>&quot; 
<br class="ltx_break"></span>Category (choose one from true, entity_error, predicate_error):<span id="A3.SS4.p2.pic1.2.5.1.2" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>