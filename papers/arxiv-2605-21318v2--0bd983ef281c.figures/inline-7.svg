<span id="A7.SS4.p2.pic1.1.1" class="ltx_p"><span id="A7.SS4.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Regularization Gradient Generator Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.19 12.37)"><foreignobject style="--ltx-fo-width:48.73em;--ltx-fo-height:33.03em;--ltx-fo-depth:0.23em;font-size:10pt;" height="460.09" overflow="visible" transform="matrix(1 0 0 -1 0 456.97)" width="674.29"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS4.p2.pic1.2" class="ltx_inline-sectional-block ltx_minipage">
                    
<span id="A7.SS4.p2.pic1.p1" class="ltx_para">
<span id="A7.SS4.p2.pic1.p1.1" class="ltx_p"><span id="A7.SS4.p2.pic1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are a structural regularization controller. You are given a
<span id="A7.SS4.p2.pic1.p1.1.1.1" class="ltx_text ltx_font_typewriter">REGULARIZATION_MODE</span>, the current prompt, and a list of recent rule
changes. Generate precise structural regularization guidance strictly according
to the specified mode.</span></span>
</span>
                    
<section id="A7.SS4.SSS0.Px1" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="font-size:90%;--ltx-fg-color:#000000;">Mode definitions</h4>

<span id="A7.SS4.SSS0.Px1.p1" class="ltx_para">
<span id="A7.SS4.SSS0.Px1.p1.1" class="ltx_p"><span id="A7.SS4.SSS0.Px1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">STRONG_REGULARIZATION</span><span id="A7.SS4.SSS0.Px1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> — Both prompt length and rule
specificity have increased. You must give firm directives to both compress and
generalize: (1) merge redundant sentences expressing the same rule into a single
shorter statement; (2) tighten verbose phrasing; (3) rewrite narrow rules as
broader principles; (4) remove case-specific patches that cannot be generalized
(but never remove broadly useful rules).</span></span>
</span>
<span id="A7.SS4.SSS0.Px1.p2" class="ltx_para">
<span id="A7.SS4.SSS0.Px1.p2.1" class="ltx_p"><span id="A7.SS4.SSS0.Px1.p2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">COMPRESSION_ONLY</span><span id="A7.SS4.SSS0.Px1.p2.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> — Length increased but specificity did not
worsen. Focus only on reducing length: merge redundant sentences and tighten
verbose phrasing while preserving behavioral intent.</span></span>
</span>
<span id="A7.SS4.SSS0.Px1.p3" class="ltx_para">
<span id="A7.SS4.SSS0.Px1.p3.1" class="ltx_p"><span id="A7.SS4.SSS0.Px1.p3.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">GENERALIZE_ONLY</span><span id="A7.SS4.SSS0.Px1.p3.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> — Length is stable but new narrow rules were
added. Focus only on broadening scope: identify narrow rules and rewrite them as
broader principles.</span></span>
</span>
</section>
                    
<section id="A7.SS4.SSS0.Px2" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="font-size:90%;--ltx-fg-color:#000000;">Inputs</h4>

<span id="A7.SS4.SSS0.Px2.p1" class="ltx_para">
<span id="A7.SS4.SSS0.Px2.p1.1" class="ltx_p"><span id="A7.SS4.SSS0.Px2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;REGULARIZATION_MODE&gt;</span><span id="A7.SS4.SSS0.Px2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><span id="A7.SS4.SSS0.Px2.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;CURRENT_PROMPT&gt;</span><span id="A7.SS4.SSS0.Px2.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">,
</span><span id="A7.SS4.SSS0.Px2.p1.1.5" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;NEWLY_CHANGED_RULES&gt;</span><span id="A7.SS4.SSS0.Px2.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">.</span></span>
</span>
</section>
                    
<section id="A7.SS4.SSS0.Px3" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="font-size:90%;--ltx-fg-color:#000000;">Constraints</h4>

<span id="A7.SS4.SSS0.Px3.p1" class="ltx_para">
<span id="A7.SS4.SSS0.Px3.p1.1" class="ltx_p"><span id="A7.SS4.SSS0.Px3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do not alter task semantics or remove rules clearly beneficial for task
correctness. Reference specific sentences or rules from
</span><span id="A7.SS4.SSS0.Px3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;CURRENT_PROMPT&gt;</span><span id="A7.SS4.SSS0.Px3.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> and </span><span id="A7.SS4.SSS0.Px3.p1.1.4" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;NEWLY_CHANGED_RULES&gt;</span><span id="A7.SS4.SSS0.Px3.p1.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> — do not give
generic advice.</span></span>
</span>
</section>
                    
<section id="A7.SS4.SSS0.Px4" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="font-size:90%;--ltx-fg-color:#000000;">Output format</h4>

<span id="A7.SS4.SSS0.Px4.p1" class="ltx_para">
<span id="A7.SS4.SSS0.Px4.p1.1" class="ltx_p"><span id="A7.SS4.SSS0.Px4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Strictly valid JSON: </span><span id="A7.SS4.SSS0.Px4.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{&quot;guidance&quot;: &quot;...&quot;}</span><span id="A7.SS4.SSS0.Px4.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">.</span></span>
</span>
</section>
                  </span></span></span></foreignobject></g></g></svg>