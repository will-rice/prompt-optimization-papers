<span id="A7.SS1.p2.pic1.1.1" class="ltx_p"><span id="A7.SS1.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Dual-Evidence Gradient Purification Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.19 12.37)"><foreignobject style="--ltx-fo-width:48.73em;--ltx-fo-height:39.33em;--ltx-fo-depth:0.23em;font-size:10pt;" height="547.33" overflow="visible" transform="matrix(1 0 0 -1 0 544.22)" width="674.29"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS1.p2.pic1.2" class="ltx_inline-sectional-block ltx_minipage">
                    
<span id="A7.SS1.p2.pic1.p1" class="ltx_para">
<span id="A7.SS1.p2.pic1.p1.1" class="ltx_p"><span id="A7.SS1.p2.pic1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are the “Gradient Purifier”. Your job is to decide whether a proposed
feedback (gradient) contains genuinely generalizable improvements, and if so,
synthesize them into a concise principle. You output either a purified summary
or an empty string.</span></span>
</span>
                    
<section id="A7.SS1.SSS0.Px1" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="font-size:90%;--ltx-fg-color:#000000;">Input data</h4>

<span id="A7.SS1.SSS0.Px1.p1" class="ltx_para">
<span id="A7.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A7.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I1.i1.p1" class="ltx_para">
<span id="A7.I1.i1.p1.1" class="ltx_p"><span id="A7.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;CURRENT_SYSTEM_PROMPT&gt;</span><span id="A7.I1.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A7.I1.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{current_prompt}</span></span>
</span></span>
<span id="A7.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I1.i2.p1" class="ltx_para">
<span id="A7.I1.i2.p1.1" class="ltx_p"><span id="A7.I1.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;EXECUTION_CONTEXT&gt;</span><span id="A7.I1.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: the user input and model output that
triggered this gradient, </span><span id="A7.I1.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{gradient_context}</span></span>
</span></span>
<span id="A7.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I1.i3.p1" class="ltx_para">
<span id="A7.I1.i3.p1.1" class="ltx_p"><span id="A7.I1.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;PROPOSED_GRADIENT&gt;</span><span id="A7.I1.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A7.I1.i3.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{gradient_text}</span></span>
</span></span>
<span id="A7.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I1.i4.p1" class="ltx_para">
<span id="A7.I1.i4.p1.1" class="ltx_p"><span id="A7.I1.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;RULEBANK_SUMMARY&gt;</span><span id="A7.I1.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: previously accepted generalizable rules
and their frequency, </span><span id="A7.I1.i4.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{rulebank_summary}</span></span>
</span></span>
</span>
</span>
</section>
                    
<section id="A7.SS1.SSS0.Px2" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="font-size:90%;--ltx-fg-color:#000000;">Task</h4>

<span id="A7.SS1.SSS0.Px2.p1" class="ltx_para">
<span id="A7.SS1.SSS0.Px2.p1.1" class="ltx_p"><span id="A7.SS1.SSS0.Px2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Internally classify the gradient into one of three categories:</span></span>
</span>
<span id="A7.SS1.SSS0.Px2.p2" class="ltx_para">
<span id="A7.SS1.SSS0.Px2.p2.1" class="ltx_p"><span id="A7.SS1.SSS0.Px2.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Category 1 — Generalizable Logic Fix</span><span id="A7.SS1.SSS0.Px2.p2.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><math id="A7.SS1.SSS0.Px2.p2.m1" class="ltx_Math" alttext="\to" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em" stretchy="false">→</mo><annotation encoding="application/x-tex">\to</annotation></semantics></math><span id="A7.SS1.SSS0.Px2.p2.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> output purified text.
The feedback identifies a reasoning flaw or logical gap that applies broadly
across many inputs. If the RuleBank contains a similar rule with high
</span><span id="A7.SS1.SSS0.Px2.p2.1.4" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">mention_count</span><span id="A7.SS1.SSS0.Px2.p2.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, lean toward accepting. Strip specific entities, numbers,
and scenario details; merge overlapping points; each sentence must describe a
distinct actionable rule.</span></span>
</span>
<span id="A7.SS1.SSS0.Px2.p3" class="ltx_para">
<span id="A7.SS1.SSS0.Px2.p3.1" class="ltx_p"><span id="A7.SS1.SSS0.Px2.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Category 2 — Narrow Edge-Case Patch</span><span id="A7.SS1.SSS0.Px2.p3.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><math id="A7.SS1.SSS0.Px2.p3.m1" class="ltx_Math" alttext="\to" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em" stretchy="false">→</mo><annotation encoding="application/x-tex">\to</annotation></semantics></math><span id="A7.SS1.SSS0.Px2.p3.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> output empty string.
The fix is tailored to the rare scenario in </span><span id="A7.SS1.SSS0.Px2.p3.1.4" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;EXECUTION_CONTEXT&gt;</span><span id="A7.SS1.SSS0.Px2.p3.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> and
lacks RuleBank support.</span></span>
</span>
<span id="A7.SS1.SSS0.Px2.p4" class="ltx_para">
<span id="A7.SS1.SSS0.Px2.p4.1" class="ltx_p"><span id="A7.SS1.SSS0.Px2.p4.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Category 3 — Pure Style / Formatting</span><span id="A7.SS1.SSS0.Px2.p4.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><math id="A7.SS1.SSS0.Px2.p4.m1" class="ltx_Math" alttext="\to" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em" stretchy="false">→</mo><annotation encoding="application/x-tex">\to</annotation></semantics></math><span id="A7.SS1.SSS0.Px2.p4.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> output empty string.
The feedback only concerns tone, formatting, or presentation with zero impact
on task correctness.</span></span>
</span>
</section>
                    
<section id="A7.SS1.SSS0.Px3" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="font-size:90%;--ltx-fg-color:#000000;">Output format</h4>

<span id="A7.SS1.SSS0.Px3.p1" class="ltx_para">
<span id="A7.SS1.SSS0.Px3.p1.1" class="ltx_p"><span id="A7.SS1.SSS0.Px3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Respond with valid JSON: </span><span id="A7.SS1.SSS0.Px3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{&quot;purified_gradient&quot;: &quot;...&quot;}</span><span id="A7.SS1.SSS0.Px3.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">.</span></span>
</span>
</section>
                  </span></span></span></foreignobject></g></g></svg>