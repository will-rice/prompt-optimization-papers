<section id="A7.SS7.SSS0.Px1" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="font-size:90%;--ltx-fg-color:#000000;">Prefix template</h4>

<span id="A7.SS7.SSS0.Px1.p1" class="ltx_para"><pre id="A7.SS7.SSS0.Px1.p1.1" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
Here is the role of the variable you will improve:
&lt;ROLE&gt;{variable_desc}&lt;/ROLE&gt;.

The variable is the text within the following span:
&lt;VARIABLE&gt; {variable_short} &lt;/VARIABLE&gt;

{reg_section}Here is the context and task feedback we got
for the variable:

&lt;CONTEXT&gt;{variable_grad}&lt;/CONTEXT&gt;
</pre>
</span>
</section>
                    
<section id="A7.SS7.SSS0.Px2" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="font-size:90%;--ltx-fg-color:#000000;">Reg-feedback section (filled into <span id="A7.SS7.SSS0.Px2.1" class="ltx_text ltx_font_typewriter">{reg_section}</span> when
