<span id="A7.SS5.p2.pic1.p1" class="ltx_para">
<span id="A7.SS5.p2.pic1.p1.1" class="ltx_p"><span id="A7.SS5.p2.pic1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are part of an optimization system that improves text (i.e., variable). You
will be asked to creatively and critically improve prompts, solutions to
problems, code, or any other text-based variable. You will receive some
feedback, and use the feedback to improve the variable. The feedback may be
noisy; identify what is important and what is correct. Pay attention to the role
description of the variable, and the context in which it is used. You MUST give
your response by sending the improved variable between
<span id="A7.SS5.p2.pic1.p1.1.1.1" class="ltx_text ltx_font_typewriter">{new_variable_start_tag}</span> <span id="A7.SS5.p2.pic1.p1.1.1.2" class="ltx_text ltx_font_typewriter">{{improved variable}}</span>
<span id="A7.SS5.p2.pic1.p1.1.1.3" class="ltx_text ltx_font_typewriter">{new_variable_end_tag}</span> tags.</span></span>
</span>
                    
<section id="A7.SS5.SSS0.Px1" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="font-size:90%;--ltx-fg-color:#000000;">Tag glossary</h4>

<span id="A7.SS5.SSS0.Px1.p1" class="ltx_para">
<span id="A7.SS5.SSS0.Px1.p1.1" class="ltx_p"><span id="A7.SS5.SSS0.Px1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;LM_SYSTEM_PROMPT&gt;</span><span id="A7.SS5.SSS0.Px1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><span id="A7.SS5.SSS0.Px1.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;LM_INPUT&gt;</span><span id="A7.SS5.SSS0.Px1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><span id="A7.SS5.SSS0.Px1.p1.1.5" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;LM_OUTPUT&gt;</span><span id="A7.SS5.SSS0.Px1.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">,
</span><span id="A7.SS5.SSS0.Px1.p1.1.7" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;FEEDBACK&gt;</span><span id="A7.SS5.SSS0.Px1.p1.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><span id="A7.SS5.SSS0.Px1.p1.1.9" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;CONVERSATION&gt;</span><span id="A7.SS5.SSS0.Px1.p1.1.10" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><span id="A7.SS5.SSS0.Px1.p1.1.11" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;FOCUS&gt;</span><span id="A7.SS5.SSS0.Px1.p1.1.12" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><span id="A7.SS5.SSS0.Px1.p1.1.13" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;ROLE&gt;</span><span id="A7.SS5.SSS0.Px1.p1.1.14" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">,
</span><span id="A7.SS5.SSS0.Px1.p1.1.15" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;REG_FEEDBACK&gt;</span><span id="A7.SS5.SSS0.Px1.p1.1.16" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (</span><span id="A7.SS5.SSS0.Px1.p1.1.17" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">TextReg</span><span id="A7.SS5.SSS0.Px1.p1.1.18" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">-specific: semantic edit regularization
feedback; follow its structural directives to control prompt length and
specificity).</span></span>
</span>
