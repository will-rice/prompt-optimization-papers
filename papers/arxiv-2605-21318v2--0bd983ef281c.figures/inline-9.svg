<svg id="A7.SS6.p2.pic1" class="ltx_picture" height="391.53" overflow="visible" version="1.1" viewbox="0 0 650 391.53" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,391.53) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 17.13 L 0 374.4 C 0 383.86 7.67 391.53 17.13 391.53 L 632.87 391.53 C 642.33 391.53 650 383.86 650 374.4 L 650 17.13 C 650 7.67 642.33 0 632.87 0 L 17.13 0 C 7.67 0 0 7.67 0 17.13 Z" /></g><g style="--ltx-fill-color:#FFFFF2;" fill="#FFFFF2" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 17.13 L 1.38 368.59 L 648.62 368.59 L 648.62 17.13 C 648.62 8.43 641.57 1.38 632.87 1.38 L 17.13 1.38 C 8.43 1.38 1.38 8.43 1.38 17.13 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.19 376.6)"><foreignobject style="--ltx-fo-width:45.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="623.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS6.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.07em;">
<span id="A7.SS6.p2.pic1.1.1" class="ltx_p"><span id="A7.SS6.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Regularization-Guided Prompt Update User Message Trailing</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.19 11.68)"><foreignobject style="--ltx-fo-width:48.73em;--ltx-fo-height:25.23em;--ltx-fo-depth:0.18em;font-size:10pt;" height="351.46" overflow="visible" transform="matrix(1 0 0 -1 0 349.04)" width="674.29"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS6.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:48.73em;">
<span id="A7.SS6.p2.pic1.2.1" class="ltx_p"><span id="A7.SS6.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Improve the variable (<span id="A7.SS6.p2.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">{variable_desc}</span>) by integrating both the task
feedback in <span id="A7.SS6.p2.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">&lt;FEEDBACK&gt;</span> and the regularization feedback in
<span id="A7.SS6.p2.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">&lt;REG_FEEDBACK&gt;</span>. Both contain concrete instructions; read them together
and apply them as follows:</span></span>
<span id="A7.I3" class="ltx_itemize ltx_leftmargin_flush">
<span id="A7.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I3.i1.p1" class="ltx_para">
<span id="A7.I3.i1.p1.1" class="ltx_p"><span id="A7.I3.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">When the task feedback and the regularization feedback point to the
same part of the prompt, apply them as one combined edit.</span></span>
</span></span>
<span id="A7.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I3.i2.p1" class="ltx_para">
<span id="A7.I3.i2.p1.1" class="ltx_p"><span id="A7.I3.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">When they target different parts, apply both.</span></span>
</span></span>
<span id="A7.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I3.i3.p1" class="ltx_para">
<span id="A7.I3.i3.p1.1" class="ltx_p"><span id="A7.I3.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">When they conflict (e.g., the task feedback asks you to add a new
rule while the regularization feedback asks you to merge or shorten),
address the task feedback in the form most consistent with what the
regularization feedback specifies — by folding the task fix into the change
that the regularization feedback proposes, so the two are realized through
a single coordinated edit instead of two unrelated ones.</span></span>
</span></span>
</span>
<span id="A7.SS6.p2.pic1.2.2" class="ltx_p"><span id="A7.SS6.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">If a specific task feedback item genuinely cannot be addressed without violating
a regularization feedback item, prioritize that task feedback item and apply it
completely, even if this means setting aside that specific regularization item.
All other regularization items in <span id="A7.SS6.p2.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter">&lt;REG_FEEDBACK&gt;</span> still apply normally
to the rest of the prompt.</span></span>
</span></span></span></foreignobject></g></g></svg>