<span id="A7.T25.pic1.1.1" class="ltx_p"><span id="A7.T25.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">MIPROv2 optimized prompt for ContractNLI</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 11.09)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:22.29em;--ltx-fo-depth:0em;font-size:10pt;" height="308.49" overflow="visible" transform="matrix(1 0 0 -1 0 308.49)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.T25.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A7.T25.pic1.2.1" class="ltx_p"><span id="A7.T25.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a contract analyst performing 3-way natural language inference on NDA clauses.
<br class="ltx_break">Label <span id="A7.T25.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">‘not_mentioned’</span> (0): the contract is silent on the hypothesis.
<br class="ltx_break">Label <span id="A7.T25.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">‘entailment’</span> (1): the contract entails the hypothesis.
<br class="ltx_break">Label <span id="A7.T25.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">‘contradiction’</span> (2): the contract contradicts the hypothesis.</span></span>
<span id="A7.T25.pic1.2.2" class="ltx_p"><span id="A7.T25.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Important:
<br class="ltx_break"><span id="A7.T25.pic1.2.2.1.1" class="ltx_text ltx_font_medium">– Do not judge whether the clause is desirable or compliant in general.
<br class="ltx_break">– Only decide whether the contract text entails, contradicts, or stays silent on the hypothesis.</span></span></span>
<span id="A7.T25.pic1.2.3" class="ltx_p"><span id="A7.T25.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output your final label as an integer: 0 for <span id="A7.T25.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">‘not_mentioned’</span>, 1 for <span id="A7.T25.pic1.2.3.1.2" class="ltx_text ltx_font_typewriter">‘entailment’</span>, 2 for <span id="A7.T25.pic1.2.3.1.3" class="ltx_text ltx_font_typewriter">‘contradiction’</span>.</span></span>
</span></span></span></foreignobject></g></g></svg>