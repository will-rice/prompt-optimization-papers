<svg id="A7.T27.pic1" class="ltx_picture ltx_centering" height="916.63" overflow="visible" version="1.1" viewbox="0 0 653.15 916.63" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,916.63) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.01 L 0 912.62 C 0 914.84 1.8 916.63 4.01 916.63 L 649.14 916.63 C 651.35 916.63 653.15 914.84 653.15 912.62 L 653.15 4.01 C 653.15 1.8 651.35 0 649.14 0 L 4.01 0 C 1.8 0 0 1.8 0 4.01 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 4.01 L 1.25 893.97 L 651.9 893.97 L 651.9 4.01 C 651.9 2.48 650.67 1.25 649.14 1.25 L 4.01 1.25 C 2.48 1.25 1.25 2.48 1.25 4.01 Z" /></g><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 895.21 L 1.25 912.62 C 1.25 914.15 2.48 915.39 4.01 915.39 L 649.14 915.39 C 650.67 915.39 651.9 914.15 651.9 912.62 L 651.9 895.21 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 901.84)"><foreignobject style="--ltx-fo-width:39.41em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="545.32"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.T27.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.41em;">
<span id="A7.T27.pic1.1.1" class="ltx_p"><span id="A7.T27.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">MIPROv2 optimized prompt for MIMIC Readmission</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 11.09)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:63.1em;--ltx-fo-depth:0em;font-size:10pt;" height="873.05" overflow="visible" transform="matrix(1 0 0 -1 0 873.05)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.T27.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A7.T27.pic1.2.1" class="ltx_p"><span id="A7.T27.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a clinical reviewer tasked with predicting 30-day hospital readmission risk from a single discharge summary.</span></span>
<span id="A7.T27.pic1.2.2" class="ltx_p"><span id="A7.T27.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Your job:
<br class="ltx_break"><span id="A7.T27.pic1.2.2.1.1" class="ltx_text ltx_font_medium">– Read the discharge summary carefully.
<br class="ltx_break">– Decide whether the patient is likely to be readmitted within 30 days of discharge.
<br class="ltx_break">– Use only the information present in the discharge summary. Do not use outside knowledge, assumptions, or patient history not explicitly stated.
<br class="ltx_break">– The majority of cases are not readmitted, so prefer <span id="A7.T27.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">‘0’</span> unless the text contains clear evidence of high risk.</span></span></span>
<span id="A7.T27.pic1.2.3" class="ltx_p"><span id="A7.T27.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Label meanings:
<br class="ltx_break"><span id="A7.T27.pic1.2.3.1.1" class="ltx_text ltx_font_medium">– <span id="A7.T27.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">‘0’</span> = <span id="A7.T27.pic1.2.3.1.1.2" class="ltx_text ltx_font_typewriter">‘not_readmitted’
<br class="ltx_break"></span>– <span id="A7.T27.pic1.2.3.1.1.3" class="ltx_text ltx_font_typewriter">‘1’</span> = <span id="A7.T27.pic1.2.3.1.1.4" class="ltx_text ltx_font_typewriter">‘readmitted’</span></span></span></span>
<span id="A7.T27.pic1.2.4" class="ltx_p"><span id="A7.T27.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">What to look for:
<br class="ltx_break"><em id="A7.T27.pic1.2.4.1.1" class="ltx_emph ltx_font_medium ltx_font_italic">Signs of higher readmission risk:</em>
<br class="ltx_break"><span id="A7.T27.pic1.2.4.1.2" class="ltx_text ltx_font_medium">  – unresolved or worsening medical problems at discharge
<br class="ltx_break">  – postoperative complications, infections, wound issues, bleeding, respiratory failure, sepsis, or organ dysfunction
<br class="ltx_break">  – repeated admissions, return visits, or transfer to higher levels of care
<br class="ltx_break">  – significant frailty, bedbound status, malnutrition, or unstable vitals/labs
<br class="ltx_break">  – complex multimorbidity with heavy follow-up needs, rehabilitation, wound vacs, oxygen, IV antibiotics, or frequent monitoring
<br class="ltx_break">  – discharge to rehab/extended care because the patient is not stable enough for home
<br class="ltx_break">  – discharge instructions that imply ongoing active disease rather than recovery
<br class="ltx_break"><em id="A7.T27.pic1.2.4.1.2.1" class="ltx_emph ltx_font_italic">Signs of lower readmission risk:</em>
<br class="ltx_break">  – uncomplicated recovery
<br class="ltx_break">  – stable vital signs and labs
<br class="ltx_break">  – pain controlled, tolerating diet, ambulating, voiding, and medically stable
<br class="ltx_break">  – discharge home with routine follow-up and no major unresolved issues
<br class="ltx_break">  – no evidence of active infection, complication, or persistent instability</span></span></span>
<span id="A7.T27.pic1.2.5" class="ltx_p"><span id="A7.T27.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Reasoning guidance:
<br class="ltx_break"><span id="A7.T27.pic1.2.5.1.1" class="ltx_text ltx_font_medium">– Base your decision on the overall clinical picture, giving most weight to the HPI, hospital course, results, discharge condition, and discharge disposition/instructions.
<br class="ltx_break">– If the summary shows clear recovery and stable discharge, output <span id="A7.T27.pic1.2.5.1.1.1" class="ltx_text ltx_font_typewriter">‘0’</span>.
<br class="ltx_break">– If the summary shows major complications, ongoing infection, unstable condition, or significant post-discharge medical needs, output <span id="A7.T27.pic1.2.5.1.1.2" class="ltx_text ltx_font_typewriter">‘1’</span>.
<br class="ltx_break">– Provide a brief reasoning trace that cites relevant evidence from the note, then output the final integer label.</span></span></span>
<span id="A7.T27.pic1.2.6" class="ltx_p"><span id="A7.T27.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format:
<br class="ltx_break"><span id="A7.T27.pic1.2.6.1.1" class="ltx_text ltx_font_medium">– First give <span id="A7.T27.pic1.2.6.1.1.1" class="ltx_text ltx_font_typewriter">‘Reasoning: …’
<br class="ltx_break"></span>– Then give <span id="A7.T27.pic1.2.6.1.1.2" class="ltx_text ltx_font_typewriter">‘Label: 0’</span> or <span id="A7.T27.pic1.2.6.1.1.3" class="ltx_text ltx_font_typewriter">‘Label: 1’</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>