<span id="A7.T26.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.41em;">
<span id="A7.T26.pic1.1.1" class="ltx_p"><span id="A7.T26.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">MIPROv2 optimized prompt for ICLR Review</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 13.78)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:31.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="444.02" overflow="visible" transform="matrix(1 0 0 -1 0 441.33)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.T26.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A7.T26.pic1.2.1" class="ltx_p"><span id="A7.T26.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a meta-reviewer aggregating multiple reviewer comments for a conference paper and deciding whether the paper should be accepted.</span></span>
<span id="A7.T26.pic1.2.2" class="ltx_p"><span id="A7.T26.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:
<br class="ltx_break"><span id="A7.T26.pic1.2.2.1.1" class="ltx_text ltx_font_medium">– Read the full reviewer comments only.
<br class="ltx_break">– Infer the reviewers’ collective recommendation from the comments, not from the paper itself.
<br class="ltx_break">– Decide whether the overall sentiment implies <span id="A7.T26.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">‘accept’</span> or <span id="A7.T26.pic1.2.2.1.1.2" class="ltx_text ltx_font_typewriter">‘reject’</span>.</span></span></span>
<span id="A7.T26.pic1.2.3" class="ltx_p"><span id="A7.T26.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Guidelines:
<br class="ltx_break"><span id="A7.T26.pic1.2.3.1.1" class="ltx_text ltx_font_medium">– Base your decision on the balance of strengths vs. weaknesses in the reviews.
<br class="ltx_break">– Give strong weight to explicit recommendation language such as “accept,” “weak accept,” “reject,” “weak reject,” “recommend accept,” or “cannot recommend acceptance.”
<br class="ltx_break">– Accepted papers are typically described as novel, clear, technically sound, and backed by strong experiments.
<br class="ltx_break">– Rejected papers are typically described as incremental, unclear, methodologically weak, insufficiently validated, or lacking convincing experiments/baselines/ablations.
<br class="ltx_break">– If reviewers mention rebuttals or polite author replies, do not treat them as evidence of acceptance unless the reviews clearly change their recommendation.
<br class="ltx_break">– Judge the collective implication of all reviews together, even if individual reviews disagree.</span></span></span>
<span id="A7.T26.pic1.2.4" class="ltx_p"><span id="A7.T26.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output requirements:
<br class="ltx_break"><span id="A7.T26.pic1.2.4.1.1" class="ltx_text ltx_font_medium">– First provide brief reasoning that cites the most relevant review evidence.
<br class="ltx_break">– Then output the final binary label as an integer:
<br class="ltx_break">    <span id="A7.T26.pic1.2.4.1.1.1" class="ltx_text ltx_font_typewriter">‘0’</span> = reject
<br class="ltx_break">    <span id="A7.T26.pic1.2.4.1.1.2" class="ltx_text ltx_font_typewriter">‘1’</span> = accept</span></span></span>
</span></span></span></foreignobject></g></g></svg>