<span id="A3.SS4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.41em;">
<span id="A3.SS4.p2.pic1.1.1" class="ltx_p"><span id="A3.SS4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rule Update — False Coverage (Update LLM)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 11.09)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:34.29em;--ltx-fo-depth:0em;font-size:10pt;" height="474.54" overflow="visible" transform="matrix(1 0 0 -1 0 474.54)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A3.SS4.p2.pic1.2.1" class="ltx_p"><span id="A3.SS4.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to generate a new rule to avoid overly broad coverage mistakes
by augmenting the exceptions and examples in an existing rule. Follow
these steps:</span></span>
<span id="A3.SS4.p2.pic1.2.2" class="ltx_p"><span id="A3.SS4.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Review the provided existing rule:</span></span>
<span id="A3.SS4.p2.pic1.2.3" class="ltx_p"><span id="A3.SS4.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;EXISTING_RULE&gt;
<br class="ltx_break">{RULE}
<br class="ltx_break">&lt;/EXISTING_RULE&gt;<span id="A3.SS4.p2.pic1.2.3.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS4.p2.pic1.2.4" class="ltx_p"><span id="A3.SS4.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;EXCEPTION_NOTES&gt;
<br class="ltx_break">{EXCEPTIONS}
<br class="ltx_break">&lt;/EXCEPTION_NOTES&gt;<span id="A3.SS4.p2.pic1.2.4.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS4.p2.pic1.2.5" class="ltx_p"><span id="A3.SS4.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Keep the rule label unchanged as <span id="A3.SS4.p2.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">{RULE_LABEL}</span>.</span></span>
<span id="A3.SS4.p2.pic1.2.6" class="ltx_p"><span id="A3.SS4.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the core pattern or principle that led to the mistake described
in the existing rule.</span></span>
<span id="A3.SS4.p2.pic1.2.7" class="ltx_p"><span id="A3.SS4.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Determine any exceptions where the rule should not apply.</span></span>
<span id="A3.SS4.p2.pic1.2.8" class="ltx_p"><span id="A3.SS4.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Formulate a new rule using the following structure:</span></span>
<span id="A3.SS4.p2.pic1.2.9" class="ltx_p"><span id="A3.SS4.p2.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;RULE_NAME&gt;[Concise, descriptive new name]&lt;/RULE_NAME&gt;<span id="A3.SS4.p2.pic1.2.9.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS4.p2.pic1.2.10" class="ltx_p"><span id="A3.SS4.p2.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;RULE_DESCRIPTION&gt;
<br class="ltx_break">Trigger Pattern:
<br class="ltx_break">[Keep original pattern in the existing rule, clarify if needed]<span id="A3.SS4.p2.pic1.2.10.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS4.p2.pic1.2.11" class="ltx_p"><span id="A3.SS4.p2.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Exceptions:
<br class="ltx_break">[Keep original exceptions]
<br class="ltx_break">[Add new exceptions to restrict over-broad coverage]<span id="A3.SS4.p2.pic1.2.11.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS4.p2.pic1.2.12" class="ltx_p"><span id="A3.SS4.p2.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Examples
<br class="ltx_break">[Keep existing examples]
<br class="ltx_break">[Add new examples if needed]:
<br class="ltx_break">Source text: [Relevant source text if any]
<br class="ltx_break">Wrong:   [Example of violation]
<br class="ltx_break">Correct: [Example of compliance]
<br class="ltx_break">&lt;/RULE_DESCRIPTION&gt;<span id="A3.SS4.p2.pic1.2.12.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS4.p2.pic1.2.13" class="ltx_p"><span id="A3.SS4.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure the rule has a new name.</span></span>
</span></span></span></foreignobject></g></g></svg>