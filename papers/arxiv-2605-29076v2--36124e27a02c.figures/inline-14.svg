<svg id="A4.SS4.SSS0.Px3.p2.pic1" class="ltx_picture" height="979.82" overflow="visible" version="1.1" viewbox="0 0 653.15 979.82" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,979.82) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.01 L 0 975.81 C 0 978.02 1.8 979.82 4.01 979.82 L 649.14 979.82 C 651.35 979.82 653.15 978.02 653.15 975.81 L 653.15 4.01 C 653.15 1.8 651.35 0 649.14 0 L 4.01 0 C 1.8 0 0 1.8 0 4.01 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 4.01 L 1.25 955.62 L 651.9 955.62 L 651.9 4.01 C 651.9 2.48 650.67 1.25 649.14 1.25 L 4.01 1.25 C 2.48 1.25 1.25 2.48 1.25 4.01 Z" /></g><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 956.86 L 1.25 975.81 C 1.25 977.34 2.48 978.58 4.01 978.58 L 649.14 978.58 C 650.67 978.58 651.9 977.34 651.9 975.81 L 651.9 956.86 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 964.26)"><foreignobject style="--ltx-fo-width:39.41em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="545.32"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.SSS0.Px3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.41em;">
<span id="A4.SS4.SSS0.Px3.p2.pic1.1.1" class="ltx_p"><span id="A4.SS4.SSS0.Px3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Groundedness Prompt (Evaluation Judge)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 11.09)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:67.55em;--ltx-fo-depth:0em;font-size:10pt;" height="934.7" overflow="visible" transform="matrix(1 0 0 -1 0 934.7)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.SSS0.Px3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A4.SS4.SSS0.Px3.p2.pic1.2.1" class="ltx_p"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given an evidence excerpt. You will then be given a reasoning trace generated by an AI model that <span id="A4.SS4.SSS0.Px3.p2.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">{task_description}</span>.</span></span>
<span id="A4.SS4.SSS0.Px3.p2.pic1.2.2" class="ltx_p"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to rate the reasoning on one metric. Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.</span></span>
<span id="A4.SS4.SSS0.Px3.p2.pic1.2.3" class="ltx_p"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Criteria.<span id="A4.SS4.SSS0.Px3.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
Groundedness (1–5) — the degree to which the reasoning’s CONCLUSION (its predicted label / verdict) is directly tied to specific cited evidence from <span id="A4.SS4.SSS0.Px3.p2.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">{evidence_phrase}</span>.
<br class="ltx_break">Anchored scale:
<br class="ltx_break"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.3.1.1.2" class="ltx_text ltx_font_typewriter">  5 =</span> Conclusion explicitly named AND directly tied to specific cited evidence (“entailment because Section 3.1 prohibits X”, “recommend acceptance because Reviewer 2 raised score to 6”, “low risk because no recent admissions, no malignancy”). Multi-step reasoning chain to verdict.
<br class="ltx_break"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.3.1.1.3" class="ltx_text ltx_font_typewriter">  4 =</span> Conclusion named and tied to at least one specific citation (section #, named reviewer/score, clinical value, named rule).
<br class="ltx_break"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.3.1.1.4" class="ltx_text ltx_font_typewriter">  3 =</span> Conclusion stated but justified by general paraphrase or “broadly consistent” framing — no specific citation linking evidence to verdict.
<br class="ltx_break"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.3.1.1.5" class="ltx_text ltx_font_typewriter">  2 =</span> Conclusion stated but weakly supported; reasoning relies on unstated assumptions.
<br class="ltx_break"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.3.1.1.6" class="ltx_text ltx_font_typewriter">  1 =</span> At least one claim is refuted by <span id="A4.SS4.SSS0.Px3.p2.pic1.2.3.1.1.7" class="ltx_text ltx_font_typewriter">{evidence_phrase}</span>, OR the text contains no analytical claim leading to a verdict (bare lists, boilerplate, anonymization markers).</span></span></span>
<span id="A4.SS4.SSS0.Px3.p2.pic1.2.4" class="ltx_p"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">CALIBRATION (apply STRICTLY):</span></span>
<span id="A4.I2" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A4.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i1.p1" class="ltx_para">
<span id="A4.I2.i1.p1.1" class="ltx_p"><span id="A4.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Generic verdict-justification (“the contract supports X”, “the patient is low risk”) with no specific citation is anchor 3.</span></span>
</span></span>
<span id="A4.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i2.p1" class="ltx_para">
<span id="A4.I2.i2.p1.1" class="ltx_p"><span id="A4.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Rule-attribution paired with concrete textual evidence (“Per R5: novelty weak because incremental contribution”) tied to verdict counts as specific citation.</span></span>
</span></span>
<span id="A4.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i3.p1" class="ltx_para">
<span id="A4.I2.i3.p1.1" class="ltx_p"><span id="A4.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Exclusion enumeration tied to verdict (“low risk because no malignancy, no recent chemo”) = anchor 4–5.</span></span>
</span></span>
<span id="A4.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i4.p1" class="ltx_para">
<span id="A4.I2.i4.p1.1" class="ltx_p"><span id="A4.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Fragmented text is a 1.</span></span>
</span></span>
</span>
<span id="A4.SS4.SSS0.Px3.p2.pic1.2.5" class="ltx_p"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">APPLY THE RUBRIC STRICTLY.</span></span>
<span id="A4.SS4.SSS0.Px3.p2.pic1.2.6" class="ltx_p"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Steps.<span id="A4.SS4.SSS0.Px3.p2.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A4.I3" class="ltx_enumerate" style="--ltx-enum-leftmargin:1.5em;">
<span id="A4.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I3.i1.p1" class="ltx_para">
<span id="A4.I3.i1.p1.1" class="ltx_p"><span id="A4.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read </span><span id="A4.I3.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{evidence_phrase}</span><span id="A4.I3.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> carefully and identify the specific facts.</span></span>
</span></span>
<span id="A4.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I3.i2.p1" class="ltx_para">
<span id="A4.I3.i2.p1.1" class="ltx_p"><span id="A4.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Find the reasoning’s CONCLUSION (predicted label / verdict).</span></span>
</span></span>
<span id="A4.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I3.i3.p1" class="ltx_para">
<span id="A4.I3.i3.p1.1" class="ltx_p"><span id="A4.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Check whether the conclusion is DIRECTLY tied to specific cited evidence (section #, reviewer #/score, clinical value, named rule + evidence, or exclusion enumeration). General verdict-justification without specific citation = anchor 3.</span></span>
</span></span>
<span id="A4.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A4.I3.i4.p1" class="ltx_para">
<span id="A4.I3.i4.p1.1" class="ltx_p"><span id="A4.I3.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Apply the CALIBRATION strictly.</span></span>
</span></span>
</span>
<span id="A4.SS4.SSS0.Px3.p2.pic1.2.7" class="ltx_p"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example.
<br class="ltx_break"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.7.1.1" class="ltx_text ltx_font_medium">Evidence: <span id="A4.SS4.SSS0.Px3.p2.pic1.2.7.1.1.1" class="ltx_text ltx_font_typewriter">{source}
<br class="ltx_break"></span>Reasoning: <span id="A4.SS4.SSS0.Px3.p2.pic1.2.7.1.1.2" class="ltx_text ltx_font_typewriter">{reasoning}
<br class="ltx_break"></span>Evaluation Form (scores ONLY):
<br class="ltx_break"><span id="A4.SS4.SSS0.Px3.p2.pic1.2.7.1.1.3" class="ltx_text ltx_font_typewriter">- Groundedness:</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>