<svg id="A6.T23.pic1" class="ltx_picture ltx_centering" height="386.06" overflow="visible" version="1.1" viewbox="0 0 653.15 386.06" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,386.06) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.01 L 0 382.05 C 0 384.26 1.8 386.06 4.01 386.06 L 649.14 386.06 C 651.35 386.06 653.15 384.26 653.15 382.05 L 653.15 4.01 C 653.15 1.8 651.35 0 649.14 0 L 4.01 0 C 1.8 0 0 1.8 0 4.01 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 4.01 L 1.25 348.71 L 651.9 348.71 L 651.9 4.01 C 651.9 2.48 650.67 1.25 649.14 1.25 L 4.01 1.25 C 2.48 1.25 1.25 2.48 1.25 4.01 Z" /></g><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 349.96 L 1.25 382.05 C 1.25 383.58 2.48 384.81 4.01 384.81 L 649.14 384.81 C 650.67 384.81 651.9 383.58 651.9 382.05 L 651.9 349.96 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 353.9)"><foreignobject style="--ltx-fo-width:39.41em;--ltx-fo-height:1.95em;--ltx-fo-depth:0em;font-size:10pt;" height="26.98" overflow="visible" transform="matrix(1 0 0 -1 0 26.98)" width="545.32"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.T23.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.41em;">
<span id="A6.T23.pic1.1.1" class="ltx_p"><span id="A6.T23.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">MIMIC Readmission Rule 3 (fires <math id="A6.T23.pic1.m1" class="ltx_Math" alttext="\to" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" stretchy="false">→</mo><annotation encoding="application/x-tex">\to</annotation></semantics></math> readmitted): High-Risk Obstetric Discharge With Persistent Preterm-Birth Threat</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 13.78)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:23.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="327.79" overflow="visible" transform="matrix(1 0 0 -1 0 325.1)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.T23.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A6.T23.pic1.2.1" class="ltx_p"><span id="A6.T23.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Trigger Pattern:<span id="A6.T23.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Apply label 1 when a pregnant patient is discharged after a threatened preterm labor / cervical insufficiency admission and the pregnancy remains high risk and unresolved. Strong indicators include:
<br class="ltx_break">– cervical shortening, funneling, or dilation despite treatment,
<br class="ltx_break">– need for magnesium sulfate, cerclage-related management, bedrest/pelvic rest, progesterone change, or NICU counseling,
<br class="ltx_break">– high-risk features such as twin gestation, prior preterm birth, breech presentation, or planned imminent steroids/close follow-up.</span></span></span>
<span id="A6.T23.pic1.2.2" class="ltx_p"><span id="A6.T23.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Exceptions:<span id="A6.T23.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Do not apply label 1 for routine uncomplicated obstetric admissions with no cervical change, no threatened preterm labor, and no ongoing high-risk pregnancy issue.</span></span></span>
<span id="A6.T23.pic1.2.3" class="ltx_p"><span id="A6.T23.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example.
<br class="ltx_break"><span id="A6.T23.pic1.2.3.1.1" class="ltx_text ltx_font_medium ltx_font_italic">Source text:<span id="A6.T23.pic1.2.3.1.1.1" class="ltx_text ltx_font_upright"> “23-week pregnancy with short cervix, funneling to cerclage, 1 cm dilation, modified bedrest and pelvic rest, progesterone changed, NICU consulted, betamethasone planned soon.”
<br class="ltx_break"></span>Wrong:<span id="A6.T23.pic1.2.3.1.1.2" class="ltx_text ltx_font_upright"> Predict label 0 because there was no infection or active labor at discharge.
<br class="ltx_break"></span>Correct:<span id="A6.T23.pic1.2.3.1.1.3" class="ltx_text ltx_font_upright"> Predict label 1: imminent preterm delivery in this high-risk pregnancy is the dominant near-term driver of readmission, even without current infection or active labor.</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>