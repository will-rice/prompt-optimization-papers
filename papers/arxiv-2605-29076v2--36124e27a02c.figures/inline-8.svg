<svg id="A3.SS5.p2.pic1" class="ltx_picture" height="782.87" overflow="visible" version="1.1" viewbox="0 0 653.15 782.87" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,782.87) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.01 L 0 778.86 C 0 781.08 1.8 782.87 4.01 782.87 L 649.14 782.87 C 651.35 782.87 653.15 781.08 653.15 778.86 L 653.15 4.01 C 653.15 1.8 651.35 0 649.14 0 L 4.01 0 C 1.8 0 0 1.8 0 4.01 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 4.01 L 1.25 758.67 L 651.9 758.67 L 651.9 4.01 C 651.9 2.48 650.67 1.25 649.14 1.25 L 4.01 1.25 C 2.48 1.25 1.25 2.48 1.25 4.01 Z" /></g><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 759.92 L 1.25 778.86 C 1.25 780.39 2.48 781.63 4.01 781.63 L 649.14 781.63 C 650.67 781.63 651.9 780.39 651.9 778.86 L 651.9 759.92 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 767.31)"><foreignobject style="--ltx-fo-width:39.41em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="545.32"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS5.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.41em;">
<span id="A3.SS5.p2.pic1.1.1" class="ltx_p"><span id="A3.SS5.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">New Rule Synthesis — Blind Spot (Update LLM)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 11.09)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:53.32em;--ltx-fo-depth:0em;font-size:10pt;" height="737.75" overflow="visible" transform="matrix(1 0 0 -1 0 737.75)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A3.SS5.p2.pic1.2.1" class="ltx_p"><span id="A3.SS5.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert at analyzing patterns and developing precise rules for
<span id="A3.SS5.p2.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">{CLASSIFICATION_TASK}</span>. Your task is to systematically evaluate error
patterns and create a clear, actionable and strict rule to prevent
similar mistakes in future classifications.</span></span>
<span id="A3.SS5.p2.pic1.2.2" class="ltx_p"><span id="A3.SS5.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The goal is to identify the truly exceptional instances, not just average
ones.</span></span>
<span id="A3.SS5.p2.pic1.2.3" class="ltx_p"><span id="A3.SS5.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Generate rules with label <span id="A3.SS5.p2.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">{TARGET_LABEL}</span>.</span></span>
<span id="A3.SS5.p2.pic1.2.4" class="ltx_p"><span id="A3.SS5.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return at most <span id="A3.SS5.p2.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">{MAX_NEW_RULES}</span> new rule(s).</span></span>
<span id="A3.SS5.p2.pic1.2.5" class="ltx_p"><span id="A3.SS5.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Review the existing rules:</span></span>
<span id="A3.SS5.p2.pic1.2.6" class="ltx_p"><span id="A3.SS5.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;EXISTING_RULES&gt;
<br class="ltx_break">{RULES}
<br class="ltx_break">&lt;/EXISTING_RULES&gt;<span id="A3.SS5.p2.pic1.2.6.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS5.p2.pic1.2.7" class="ltx_p"><span id="A3.SS5.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Error patterns from misclassifications:</span></span>
<span id="A3.SS5.p2.pic1.2.8" class="ltx_p"><span id="A3.SS5.p2.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;ERROR_PATTERNS&gt;
<br class="ltx_break">{ERROR_PATTERNS}
<br class="ltx_break">&lt;/ERROR_PATTERNS&gt;<span id="A3.SS5.p2.pic1.2.8.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS5.p2.pic1.2.9" class="ltx_p"><span id="A3.SS5.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">First, conduct a structured error analysis:
<br class="ltx_break"><span id="A3.SS5.p2.pic1.2.9.1.1" class="ltx_text ltx_font_typewriter">&lt;ERROR_ANALYSIS&gt;
<br class="ltx_break">1. Context Assessment
<br class="ltx_break">   What was the intended behavior?
<br class="ltx_break">   What actually happened?
<br class="ltx_break">   What key factors contributed?
<br class="ltx_break">2. Rule Evaluation
<br class="ltx_break">   Do existing rules partially cover this?
<br class="ltx_break">   What aspects are unique?
<br class="ltx_break">   How can we make the rule robust?
<br class="ltx_break">&lt;/ERROR_ANALYSIS&gt;</span></span></span>
<span id="A3.SS5.p2.pic1.2.10" class="ltx_p"><span id="A3.SS5.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide the error analysis in the error_analysis field.</span></span>
<span id="A3.SS5.p2.pic1.2.11" class="ltx_p"><span id="A3.SS5.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Then, formulate a new rule using this structure:</span></span>
<span id="A3.SS5.p2.pic1.2.12" class="ltx_p"><span id="A3.SS5.p2.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;RULE_NAME&gt;[Concise, descriptive name that clearly identifies the pattern]&lt;/RULE_NAME&gt;<span id="A3.SS5.p2.pic1.2.12.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS5.p2.pic1.2.13" class="ltx_p"><span id="A3.SS5.p2.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;RULE_DESCRIPTION&gt;
<br class="ltx_break">Trigger Pattern: [Clear description of when this rule applies, with 2-3
<br class="ltx_break">                  specific indicators that should trigger the rule]<span id="A3.SS5.p2.pic1.2.13.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS5.p2.pic1.2.14" class="ltx_p"><span id="A3.SS5.p2.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Exceptions: [Specific cases where the rule should not be applied, even if
<br class="ltx_break">             the pattern appears to match]<span id="A3.SS5.p2.pic1.2.14.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS5.p2.pic1.2.15" class="ltx_p"><span id="A3.SS5.p2.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Example [One clear example]:
<br class="ltx_break">Source text: [Relevant source text if any]
<br class="ltx_break">Wrong:   [Example of violation]
<br class="ltx_break">Correct: [Example of compliance]
<br class="ltx_break">&lt;/RULE_DESCRIPTION&gt;<span id="A3.SS5.p2.pic1.2.15.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS5.p2.pic1.2.16" class="ltx_p"><span id="A3.SS5.p2.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please analyze the error examples thoroughly and formulate a new rule that
would prevent similar classification errors in the future.</span></span>
</span></span></span></foreignobject></g></g></svg>