<span id="A3.SS1.p2.pic1.1.1" class="ltx_p"><span id="A3.SS1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Reasoning Prompt with Rules (R-SFT teacher)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 13.78)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:21.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="294.58" overflow="visible" transform="matrix(1 0 0 -1 0 291.89)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A3.SS1.p2.pic1.2.1" class="ltx_p"><span id="A3.SS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below is a rulebook of patterns relevant to the task. Treat the rulebook
as internal guidance — it shapes what to look for in the
<span id="A3.SS1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">{input_noun}</span>, but should not be cited in your reasoning.</span></span>
<span id="A3.SS1.p2.pic1.2.2" class="ltx_p"><span id="A3.SS1.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;RULES&gt;
<br class="ltx_break">{rulebook}
<br class="ltx_break">&lt;/RULES&gt;<span id="A3.SS1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS1.p2.pic1.2.3" class="ltx_p"><span id="A3.SS1.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{input_tag}
<br class="ltx_break">{text}
<br class="ltx_break">&lt;/…&gt;<span id="A3.SS1.p2.pic1.2.3.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS1.p2.pic1.2.4" class="ltx_p"><span id="A3.SS1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">When writing your reasoning, analyze the <span id="A3.SS1.p2.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">{input_noun}</span> directly.
Do not name or enumerate rules in your reasoning.</span></span>
<span id="A3.SS1.p2.pic1.2.5" class="ltx_p"><span id="A3.SS1.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return exactly in this format:
<br class="ltx_break"><span id="A3.SS1.p2.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">REASONING:
<br class="ltx_break"></span>your reasoning</span></span>
<span id="A3.SS1.p2.pic1.2.6" class="ltx_p"><span id="A3.SS1.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">LABEL: &lt;one of {labels}&gt;<span id="A3.SS1.p2.pic1.2.6.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
