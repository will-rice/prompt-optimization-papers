<span id="A3.SS6.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.41em;">
<span id="A3.SS6.p3.pic1.1.1" class="ltx_p"><span id="A3.SS6.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rulebook Revision — Strategy Taxonomy Merge (Stage 2)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 13.78)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:28.07em;--ltx-fo-depth:0.19em;font-size:10pt;" height="391.13" overflow="visible" transform="matrix(1 0 0 -1 0 388.44)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS6.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A3.SS6.p3.pic1.2.1" class="ltx_p"><span id="A3.SS6.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are reasoning strategy taxonomies discovered in three independent rounds
of analysis on the same set of model reasoning traces. Many strategies across
rounds describe the same underlying analytical pattern in different words.</span></span>
<span id="A3.SS6.p3.pic1.2.2" class="ltx_p"><span id="A3.SS6.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Round 1:
<br class="ltx_break"><span id="A3.SS6.p3.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter">{ROUND_1_STRATEGIES}</span></span></span>
<span id="A3.SS6.p3.pic1.2.3" class="ltx_p"><span id="A3.SS6.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Round 2:
<br class="ltx_break"><span id="A3.SS6.p3.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">{ROUND_2_STRATEGIES}</span></span></span>
<span id="A3.SS6.p3.pic1.2.4" class="ltx_p"><span id="A3.SS6.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Round 3:
<br class="ltx_break"><span id="A3.SS6.p3.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">{ROUND_3_STRATEGIES}</span></span></span>
<span id="A3.SS6.p3.pic1.2.5" class="ltx_p"><span id="A3.SS6.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Merge these into a single deduplicated taxonomy.</span></span>
<span id="A3.I1" class="ltx_itemize">
<span id="A3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i1.p1" class="ltx_para">
<span id="A3.I1.i1.p1.1" class="ltx_p"><span id="A3.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Merge strategies that describe the SAME analytical method, even if worded
differently. Keep the clearest analysis.</span></span>
</span></span>
<span id="A3.I1.i2" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i2.p1" class="ltx_para">
<span id="A3.I1.i2.p1.1" class="ltx_p"><span id="A3.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Keep strategies that are genuinely distinct — do not force-merge
strategies that differ in analytical approach just because they sound
vaguely similar.</span></span>
</span></span>
<span id="A3.I1.i3" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i3.p1" class="ltx_para">
<span id="A3.I1.i3.p1.1" class="ltx_p"><span id="A3.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If a strategy from one round is a sub-case of a broader one, keep the
broader one and note the sub-case in its analysis.</span></span>
</span></span>
</span>
<span id="A3.SS6.p3.pic1.2.6" class="ltx_p"><span id="A3.SS6.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output the merged taxonomy:</span></span>
<span id="A3.SS6.p3.pic1.2.7" class="ltx_p"><span id="A3.SS6.p3.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;STRATEGY id=&quot;N&quot;&gt;
<br class="ltx_break">Analysis: [Merged analysis. Note which round entries were merged.]
<br class="ltx_break">Label: [3--6 word name]
<br class="ltx_break">&lt;/STRATEGY&gt;<span id="A3.SS6.p3.pic1.2.7.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS6.p3.pic1.2.8" class="ltx_p"><span id="A3.SS6.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output as many strategies as the data warrants.</span></span>
</span></span></span></foreignobject></g></g></svg>