<svg id="A6.T14.pic1" class="ltx_picture ltx_centering" height="419.27" overflow="visible" version="1.1" viewbox="0 0 653.15 419.27" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,419.27) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.01 L 0 415.26 C 0 417.47 1.8 419.27 4.01 419.27 L 649.14 419.27 C 651.35 419.27 653.15 417.47 653.15 415.26 L 653.15 4.01 C 653.15 1.8 651.35 0 649.14 0 L 4.01 0 C 1.8 0 0 1.8 0 4.01 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 4.01 L 1.25 381.92 L 651.9 381.92 L 651.9 4.01 C 651.9 2.48 650.67 1.25 649.14 1.25 L 4.01 1.25 C 2.48 1.25 1.25 2.48 1.25 4.01 Z" /></g><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 383.17 L 1.25 415.26 C 1.25 416.78 2.48 418.02 4.01 418.02 L 649.14 418.02 C 650.67 418.02 651.9 416.78 651.9 415.26 L 651.9 383.17 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 387.1)"><foreignobject style="--ltx-fo-width:39.41em;--ltx-fo-height:1.95em;--ltx-fo-depth:0em;font-size:10pt;" height="26.98" overflow="visible" transform="matrix(1 0 0 -1 0 26.98)" width="545.32"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.T14.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.41em;">
<span id="A6.T14.pic1.1.1" class="ltx_p"><span id="A6.T14.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">ContractNLI Rule 1 (fires <math id="A6.T14.pic1.m1" class="ltx_Math" alttext="\to" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" stretchy="false">→</mo><annotation encoding="application/x-tex">\to</annotation></semantics></math> entailment): Paraphrased NDA Duty or Definition Still Entails</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 13.78)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:25.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="361" overflow="visible" transform="matrix(1 0 0 -1 0 358.31)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.T14.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A6.T14.pic1.2.1" class="ltx_p"><span id="A6.T14.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Trigger Pattern:<span id="A6.T14.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Apply label 1 when the hypothesis is a semantic paraphrase of an express contractual duty or definition, even if the wording is different. Look for 2–3 indicators such as:
<br class="ltx_break">– the contract uses different but equivalent legal phrasing, e.g. “oral or written form” = verbally conveyed;
<br class="ltx_break">– party-role equivalents like “Recipient” / “Receiving Party”;
<br class="ltx_break">– broader wording that clearly covers the same fact, such as “existence and nature of this Agreement” covering disclosure that the agreement was agreed or negotiated.</span></span></span>
<span id="A6.T14.pic1.2.2" class="ltx_p"><span id="A6.T14.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Exceptions:<span id="A6.T14.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Do not apply this rule if:
<br class="ltx_break">– the contract merely discusses a related topic but does not clearly cover the hypothesis;
<br class="ltx_break">– the hypothesis requires a stronger or different obligation than the source text;
<br class="ltx_break">– the contract language is only tangentially related and not a true semantic match.</span></span></span>
<span id="A6.T14.pic1.2.3" class="ltx_p"><span id="A6.T14.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example.
<br class="ltx_break"><span id="A6.T14.pic1.2.3.1.1" class="ltx_text ltx_font_medium ltx_font_italic">Source text:<span id="A6.T14.pic1.2.3.1.1.1" class="ltx_text ltx_font_upright"> “Recipient agrees to keep the existence and nature of this Agreement confidential.”
<br class="ltx_break"></span>Wrong:<span id="A6.T14.pic1.2.3.1.1.2" class="ltx_text ltx_font_upright"> Label 0 (NotMentioned) for “The Receiving Party shall not disclose the fact that the Agreement was agreed or negotiated.”
<br class="ltx_break"></span>Correct:<span id="A6.T14.pic1.2.3.1.1.3" class="ltx_text ltx_font_upright"> Label 1 (Entailment) because confidentiality of the agreement’s existence and nature supports nondisclosure of the fact it was negotiated.</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>