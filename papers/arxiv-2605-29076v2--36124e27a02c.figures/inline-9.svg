<span id="A3.SS6.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.41em;">
<span id="A3.SS6.p2.pic1.1.1" class="ltx_p"><span id="A3.SS6.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rulebook Revision — Strategy Taxonomy Discovery (Stage 2)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 13.78)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:30.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="427.41" overflow="visible" transform="matrix(1 0 0 -1 0 424.72)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS6.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A3.SS6.p2.pic1.2.1" class="ltx_p"><span id="A3.SS6.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are analyzing reasoning traces from a model trained with reinforcement
learning to improve on hard examples.</span></span>
<span id="A3.SS6.p2.pic1.2.2" class="ltx_p"><span id="A3.SS6.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;TASK&gt;
<br class="ltx_break">{TASK_DESCRIPTION}
<br class="ltx_break">&lt;/TASK&gt;<span id="A3.SS6.p2.pic1.2.2.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS6.p2.pic1.2.3" class="ltx_p"><span id="A3.SS6.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are <span id="A3.SS6.p2.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">{NUM_SAMPLES}</span> correct reasoning traces from different input
categories:</span></span>
<span id="A3.SS6.p2.pic1.2.4" class="ltx_p"><span id="A3.SS6.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{ROLLOUT_ENTRIES}<span id="A3.SS6.p2.pic1.2.4.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS6.p2.pic1.2.5" class="ltx_p"><span id="A3.SS6.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the distinct REASONING STRATEGIES used across these traces.</span></span>
<span id="A3.SS6.p2.pic1.2.6" class="ltx_p"><span id="A3.SS6.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">A reasoning strategy is a reusable analytical METHOD — how the model reasons,
not what specific input topic it reasons about. Group by HOW the model reasons
(analytical method), not by WHAT topic or input content it reasons about.
Traces on different topics that use the same analytical approach belong to the
same strategy. Two traces that reach the same conclusion via different
analytical paths count as different strategies.</span></span>
<span id="A3.SS6.p2.pic1.2.7" class="ltx_p"><span id="A3.SS6.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each strategy, output in this exact format:</span></span>
<span id="A3.SS6.p2.pic1.2.8" class="ltx_p"><span id="A3.SS6.p2.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;STRATEGY id=&quot;N&quot;&gt;
<br class="ltx_break">Analysis: [Describe the shared analytical method across traces
<br class="ltx_break">          that use this strategy. What steps does the reasoning
<br class="ltx_break">          follow? What makes it distinct from other strategies?
<br class="ltx_break">          Do not reference specific input topics --- describe the
<br class="ltx_break">          abstract pattern.]
<br class="ltx_break">Label: [3--6 word name for this strategy]
<br class="ltx_break">&lt;/STRATEGY&gt;<span id="A3.SS6.p2.pic1.2.8.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A3.SS6.p2.pic1.2.9" class="ltx_p"><span id="A3.SS6.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify as many genuinely distinct strategies as you find. Do not force a
predetermined number.</span></span>
</span></span></span></foreignobject></g></g></svg>