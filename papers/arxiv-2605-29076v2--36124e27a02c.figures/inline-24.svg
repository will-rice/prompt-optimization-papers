<svg id="A6.T22.pic1" class="ltx_picture ltx_centering" height="421.96" overflow="visible" version="1.1" viewbox="0 0 653.15 421.96" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,421.96) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.01 L 0 417.95 C 0 420.16 1.8 421.96 4.01 421.96 L 649.14 421.96 C 651.35 421.96 653.15 420.16 653.15 417.95 L 653.15 4.01 C 653.15 1.8 651.35 0 649.14 0 L 4.01 0 C 1.8 0 0 1.8 0 4.01 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 4.01 L 1.25 381.92 L 651.9 381.92 L 651.9 4.01 C 651.9 2.48 650.67 1.25 649.14 1.25 L 4.01 1.25 C 2.48 1.25 1.25 2.48 1.25 4.01 Z" /></g><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 383.17 L 1.25 417.95 C 1.25 419.48 2.48 420.71 4.01 420.71 L 649.14 420.71 C 650.67 420.71 651.9 419.48 651.9 417.95 L 651.9 383.17 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 389.8)"><foreignobject style="--ltx-fo-width:39.41em;--ltx-fo-height:1.95em;--ltx-fo-depth:0.19em;font-size:10pt;" height="29.67" overflow="visible" transform="matrix(1 0 0 -1 0 26.98)" width="545.32"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.T22.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.41em;">
<span id="A6.T22.pic1.1.1" class="ltx_p"><span id="A6.T22.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">MIMIC Readmission Rule 2 (fires <math id="A6.T22.pic1.m1" class="ltx_Math" alttext="\to" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" stretchy="false">→</mo><annotation encoding="application/x-tex">\to</annotation></semantics></math> readmitted): Complicated Postoperative Discharge With Foley or Unresolved Recovery Milestone</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 13.78)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:25.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="361" overflow="visible" transform="matrix(1 0 0 -1 0 358.31)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.T22.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A6.T22.pic1.2.1" class="ltx_p"><span id="A6.T22.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Trigger Pattern:<span id="A6.T22.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Apply label 1 when the discharge summary shows a recent major surgery plus unresolved short-term postoperative complications that still require active management after discharge. Strong indicators include:
<br class="ltx_break">– failed voiding trial, urinary retention, high post-void residuals, or discharge with an indwelling Foley catheter,
<br class="ltx_break">– need for catheter-related prophylaxis, device care, or planned early catheter removal follow-up,
<br class="ltx_break">– persistent postoperative issues such as wound drainage, infection concern, ileus, uncontrolled pain, or significant anemia requiring close follow-up.</span></span></span>
<span id="A6.T22.pic1.2.2" class="ltx_p"><span id="A6.T22.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Exceptions:<span id="A6.T22.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Do not apply this rule for routine postoperative discharges with no unresolved complication, no device dependence, and no early follow-up for a specific recovery problem.</span></span></span>
<span id="A6.T22.pic1.2.3" class="ltx_p"><span id="A6.T22.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example.
<br class="ltx_break"><span id="A6.T22.pic1.2.3.1.1" class="ltx_text ltx_font_medium ltx_font_italic">Source text:<span id="A6.T22.pic1.2.3.1.1.1" class="ltx_text ltx_font_upright"> “Total abdominal hysterectomy with sling/cystoscopy complicated by urinary retention; failed voiding trial, discharged home with Foley catheter, nitrofurantoin prophylaxis, and follow-up for catheter removal.”
<br class="ltx_break"></span>Wrong:<span id="A6.T22.pic1.2.3.1.1.2" class="ltx_text ltx_font_upright"> Predict label 0 because the patient was discharged home and described as stable.
<br class="ltx_break"></span>Correct:<span id="A6.T22.pic1.2.3.1.1.3" class="ltx_text ltx_font_upright"> Predict label 1 because the postoperative course was not resolved and Foley/device dependence with early follow-up creates high 30-day return risk.</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>