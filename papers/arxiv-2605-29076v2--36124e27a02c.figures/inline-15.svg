<svg id="A4.SS4.SSS0.Px5.p2.pic1" class="ltx_picture" height="627.29" overflow="visible" version="1.1" viewbox="0 0 653.15 627.29" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,627.29) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.01 L 0 623.27 C 0 625.49 1.8 627.29 4.01 627.29 L 649.14 627.29 C 651.35 627.29 653.15 625.49 653.15 623.27 L 653.15 4.01 C 653.15 1.8 651.35 0 649.14 0 L 4.01 0 C 1.8 0 0 1.8 0 4.01 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 4.01 L 1.25 603.08 L 651.9 603.08 L 651.9 4.01 C 651.9 2.48 650.67 1.25 649.14 1.25 L 4.01 1.25 C 2.48 1.25 1.25 2.48 1.25 4.01 Z" /></g><g style="--ltx-fill-color:#8EC4B0;" fill="#8EC4B0" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 604.33 L 1.25 623.27 C 1.25 624.8 2.48 626.04 4.01 626.04 L 649.14 626.04 C 650.67 626.04 651.9 624.8 651.9 623.27 L 651.9 604.33 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 611.73)"><foreignobject style="--ltx-fo-width:39.41em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="545.32"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.SSS0.Px5.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.41em;">
<span id="A4.SS4.SSS0.Px5.p2.pic1.1.1" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Faithfulness Prompt (Auxiliary Judge)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.06 11.09)"><foreignobject style="--ltx-fo-width:45.32em;--ltx-fo-height:42.07em;--ltx-fo-depth:0em;font-size:10pt;" height="582.16" overflow="visible" transform="matrix(1 0 0 -1 0 582.16)" width="627.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.SSS0.Px5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.32em;">
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.1" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given <span id="A4.SS4.SSS0.Px5.p2.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">{input}</span>. You will then be given a reasoning trace generated by an AI model that <span id="A4.SS4.SSS0.Px5.p2.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">{task_description}</span>.</span></span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.2" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to rate the reasoning on one metric.</span></span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.3" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.</span></span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.4" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluation Criteria:</span></span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.5" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Faithfulness (1–5) — the factual alignment between the reasoning and <span id="A4.SS4.SSS0.Px5.p2.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">{input}</span>. A faithful reasoning’s claims are all directly traceable to <span id="A4.SS4.SSS0.Px5.p2.pic1.2.5.1.2" class="ltx_text ltx_font_typewriter">{input}</span>, without going beyond what <span id="A4.SS4.SSS0.Px5.p2.pic1.2.5.1.3" class="ltx_text ltx_font_typewriter">{input}</span> establishes. Penalize reasonings that misread <span id="A4.SS4.SSS0.Px5.p2.pic1.2.5.1.4" class="ltx_text ltx_font_typewriter">{input}</span>, fabricate details, or rely on external knowledge not present in <span id="A4.SS4.SSS0.Px5.p2.pic1.2.5.1.5" class="ltx_text ltx_font_typewriter">{input}</span>.</span></span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.6" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluation Steps:</span></span>
<span id="A4.I4" class="ltx_enumerate" style="--ltx-enum-leftmargin:1.5em;">
<span id="A4.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I4.i1.p1" class="ltx_para">
<span id="A4.I4.i1.p1.1" class="ltx_p"><span id="A4.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read </span><span id="A4.I4.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{input}</span><span id="A4.I4.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> carefully and identify the facts it presents.</span></span>
</span></span>
<span id="A4.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I4.i2.p1" class="ltx_para">
<span id="A4.I4.i2.p1.1" class="ltx_p"><span id="A4.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read the reasoning and compare it to </span><span id="A4.I4.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{input}</span><span id="A4.I4.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">. Check if the reasoning makes claims that go beyond, contradict, or misread </span><span id="A4.I4.i2.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{input}</span><span id="A4.I4.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A4.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I4.i3.p1" class="ltx_para">
<span id="A4.I4.i3.p1.1" class="ltx_p"><span id="A4.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Assign a score for faithfulness based on the Evaluation Criteria.</span></span>
</span></span>
</span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.7" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example:</span></span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.8" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Input:</span></span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.9" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{source}<span id="A4.SS4.SSS0.Px5.p2.pic1.2.9.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.10" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reasoning:</span></span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.11" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{reasoning}<span id="A4.SS4.SSS0.Px5.p2.pic1.2.11.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.12" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluation Form (scores ONLY):</span></span>
<span id="A4.SS4.SSS0.Px5.p2.pic1.2.13" class="ltx_p"><span id="A4.SS4.SSS0.Px5.p2.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Faithfulness:<span id="A4.SS4.SSS0.Px5.p2.pic1.2.13.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>