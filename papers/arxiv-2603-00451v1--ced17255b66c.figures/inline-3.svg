<br class="ltx_break">❷ Must NOT break existing correct classifications 
<br class="ltx_break">❸ Must be COMPATIBLE with fixes for <math id="S4.F4.pic1.m10" class="ltx_Math" alttext="(1\to 2)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(1\to 2)</annotation></semantics></math>, <math id="S4.F4.pic1.m11" class="ltx_Math" alttext="(0\to 2)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0\to 2)</annotation></semantics></math> 
<br class="ltx_break">❹ Edit budget: <span id="S4.F4.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">medium</span> (2–3 new rules)</span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
