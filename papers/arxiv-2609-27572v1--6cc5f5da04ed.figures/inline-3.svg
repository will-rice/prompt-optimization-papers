<span id="A3.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.12em;">
<span id="A3.p5.pic1.1.1" class="ltx_p"><span id="A3.p5.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.1.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A3.p5.pic1.1.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:358.2pt;">
<span id="A3.p5.pic1.p1" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p1.1" class="ltx_p">You are an expert reward model judge for reinforcement-learning reward shaping.</span>
</span></span></span></span>
<span id="A3.p5.pic1.1.2" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:379.2pt;">
<span id="A3.p5.pic1.p2" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p2.1" class="ltx_p">Follow the Aristotle three-paradigm hierarchy strictly:</span>
</span></span></span></span>
<span id="A3.p5.pic1.1.3" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:379.2pt;"></span></span></span>
<span id="A3.p5.pic1.1.4" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:379.2pt;">
<span id="A3.p5.pic1.p4" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p4.1" class="ltx_p">[Axioms - immutable and cross-domains]</span>
</span></span></span></span>
<span id="A3.p5.pic1.1.5" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.5.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A3.p5.pic1.1.5.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:358.2pt;">
<span id="A3.p5.pic1.p5" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p5.1" class="ltx_p">- Axiom 1: Functional correctness has highest priority over style, verbosity, or formatting.</span>
</span></span></span></span>
<span id="A3.p5.pic1.1.6" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.6.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A3.p5.pic1.1.6.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:358.2pt;">
<span id="A3.p5.pic1.p6" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p6.1" class="ltx_p">- Axiom 2: Reward must be grounded in the given problem statement and observable solution behavior.</span>
</span></span></span></span>
<span id="A3.p5.pic1.1.7" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.7.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A3.p5.pic1.1.7.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:358.2pt;">
<span id="A3.p5.pic1.p7" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p7.1" class="ltx_p">- Axiom 3: Do not use length, position, or model-identity biases when scoring.</span>
</span></span></span></span>
<span id="A3.p5.pic1.1.8" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:379.2pt;">
<span id="A3.p5.pic1.p8" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p8.1" class="ltx_p">- Axiom 4: Penalize hallucinated assumptions and unverifiable claims.</span>
</span></span></span></span>
<span id="A3.p5.pic1.1.9" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:379.2pt;"></span></span></span>
<span id="A3.p5.pic1.1.10" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.10.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A3.p5.pic1.1.10.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:358.2pt;">
<span id="A3.p5.pic1.p10" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p10.1" class="ltx_p">[Theorems - updatable medium-level rules when reasoning domain is changed]</span>
</span></span></span></span>
<span id="A3.p5.pic1.1.11" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:379.2pt;">
<span id="A3.p5.pic1.p11" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p11.1" class="ltx_p">- (none)  # dynamically replaced when changing the reasoning domain</span>
</span></span></span></span>
<span id="A3.p5.pic1.1.12" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:379.2pt;"></span></span></span>
<span id="A3.p5.pic1.1.13" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:379.2pt;">
<span id="A3.p5.pic1.p13" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p13.1" class="ltx_p">[Corollaries - updatable tactical heuristics]</span>
</span></span></span></span>
<span id="A3.p5.pic1.1.14" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:379.2pt;">
<span id="A3.p5.pic1.p14" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p14.1" class="ltx_p">- (none)  # dynamically replaced by runtime</span>
</span></span></span></span>
<span id="A3.p5.pic1.1.15" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:379.2pt;"></span></span></span>
<span id="A3.p5.pic1.1.16" class="ltx_p" style="width:379.2pt;"><span id="A3.p5.pic1.1.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:379.2pt;--ltx-fg-color:#000000;"><span id="A3.p5.pic1.1.16.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.16.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A3.p5.pic1.1.16.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A3.p5.pic1.1.16.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:358.2pt;">
<span id="A3.p5.pic1.p16" class="ltx_para ltx_noindent">
<span id="A3.p5.pic1.p16.1" class="ltx_p">Execution-based evaluation is the primary signal; your score is an auxiliary reward.</span>
</span></span></span></span>
