<svg id="A4.SS1.SSS2.p2.pic1" class="ltx_picture" height="461.88" overflow="visible" version="1.1" viewbox="0 0 477.38 461.88" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,461.88) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 455.97 C 0 459.23 2.64 461.88 5.91 461.88 L 471.47 461.88 C 474.73 461.88 477.38 459.23 477.38 455.97 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 441.56 L 475.41 441.56 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 447.46)"><foreignobject style="--ltx-fo-width:36.5em;--ltx-fo-height:0.66em;--ltx-fo-depth:0em;font-size:9.25pt;" height="8.51" overflow="visible" transform="matrix(1 0 0 -1 0 8.51)" width="467.17"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.5em;">
<span id="A4.SS1.SSS2.p2.pic1.1.1" class="ltx_p"><span id="A4.SS1.SSS2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold ltx_font_smallcaps" style="font-size:90%;--ltx-fg-color:#FFFFFF;">ExtractFeatures</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 11.09)"><foreignobject style="--ltx-fo-width:35.51em;--ltx-fo-height:33.11em;--ltx-fo-depth:0.19em;font-size:9.25pt;" height="426.18" overflow="visible" transform="matrix(1 0 0 -1 0 423.76)" width="454.5"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.51em;">
<span id="A4.SS1.SSS2.p2.pic1.2.1" class="ltx_p"><span id="A4.SS1.SSS2.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are an expert at analyzing text and rating it on specific features. For each text object, assign a value in [0, 1] for each feature based on the feature description.</span></span>
<span id="A4.SS1.SSS2.p2.pic1.2.2" class="ltx_p"><span id="A4.SS1.SSS2.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">These text objects are system prompts for an AI assistant performing the following task:
<span id="A4.SS1.SSS2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{task_context}</span></span></span>
<span id="A4.SS1.SSS2.p2.pic1.2.3" class="ltx_p"><span id="A4.SS1.SSS2.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Rate each text object considering how the features relate to this specific task.</span></span>
<span id="A4.SS1.SSS2.p2.pic1.2.4" class="ltx_p"><span id="A4.SS1.SSS2.p2.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Be consistent: similar texts should get similar scores. Use the full range of [0, 1] – don’t cluster all values near the middle.</span></span>
<span id="A4.SS1.SSS2.p2.pic1.2.5" class="ltx_p"><span id="A4.SS1.SSS2.p2.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Respond with a JSON object keyed by text object ID, where each value is an object mapping feature names to numeric values.</span></span>
<span id="A4.SS1.SSS2.p2.pic1.2.6" class="ltx_p"><span id="A4.SS1.SSS2.p2.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example:</span></span><pre id="A4.SS1.SSS2.p2.pic1.2.7" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
{
  &quot;0&quot;: {&quot;feature_a&quot;: 0.75, &quot;feature_b&quot;: 0.30},
  &quot;1&quot;: {&quot;feature_a&quot;: 0.45, &quot;feature_b&quot;: 0.80}
}
</pre>
<span id="A4.SS1.SSS2.p2.pic1.2.8" class="ltx_p"><span id="A4.SS1.SSS2.p2.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Features to rate:
<br class="ltx_break">— <span id="A4.SS1.SSS2.p2.pic1.2.8.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#800080;">{f.name}</span>: <span id="A4.SS1.SSS2.p2.pic1.2.8.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{f.description}</span>  <em id="A4.SS1.SSS2.p2.pic1.2.8.1.3" class="ltx_emph ltx_font_italic">[for each feature]</em></span></span>
<span id="A4.SS1.SSS2.p2.pic1.2.9" class="ltx_p"><span id="A4.SS1.SSS2.p2.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Text objects to rate:
<br class="ltx_break">— Text Object ID: “<span id="A4.SS1.SSS2.p2.pic1.2.9.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{tid}</span>” —
<br class="ltx_break"><span id="A4.SS1.SSS2.p2.pic1.2.9.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{content}</span>  <em id="A4.SS1.SSS2.p2.pic1.2.9.1.3" class="ltx_emph ltx_font_italic">[for each text in batch]</em></span></span>
<span id="A4.SS1.SSS2.p2.pic1.2.10" class="ltx_p"><span id="A4.SS1.SSS2.p2.pic1.2.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Rate each text object on each feature. Values must be numbers in [0, 1]. Return ONLY the JSON object.</span></span>
</span></span></span></foreignobject></g></g></svg>