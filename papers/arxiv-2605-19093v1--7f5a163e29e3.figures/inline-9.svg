<span id="A4.SS2.SSS5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.51em;">
<span id="A4.SS2.SSS5.p2.pic1.2.1" class="ltx_p"><span id="A4.SS2.SSS5.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are an expert prompt optimizer. Given a trajectory of system prompts and their performance scores, analyze what makes some perform better than others, then critique the current best prompt and generate improved variants.</span></span>
<span id="A4.SS2.SSS5.p2.pic1.2.2" class="ltx_p"><span id="A4.SS2.SSS5.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Task description:
<br class="ltx_break"><span id="A4.SS2.SSS5.p2.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{task_context}</span></span></span>
<span id="A4.SS2.SSS5.p2.pic1.2.3" class="ltx_p"><span id="A4.SS2.SSS5.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Trajectory of prior prompts and their scores (higher is better, sorted worst-to-best):</span></span>
<span id="A4.SS2.SSS5.p2.pic1.2.4" class="ltx_p"><span id="A4.SS2.SSS5.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#800080;">{history_text}</span><span id="A4.SS2.SSS5.p2.pic1.2.4.2" class="ltx_text"></span></span>
<span id="A4.SS2.SSS5.p2.pic1.2.5" class="ltx_p"><span id="A4.SS2.SSS5.p2.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Current best prompt (score: <span id="A4.SS2.SSS5.p2.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{best_score}</span>):
<br class="ltx_break"><span id="A4.SS2.SSS5.p2.pic1.2.5.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{best_prompt}</span></span></span>
<span id="A4.SS2.SSS5.p2.pic1.2.6" class="ltx_p"><span id="A4.SS2.SSS5.p2.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Step 1: briefly analyze the trajectory – what patterns separate high-scoring prompts from low-scoring ones?</span></span>
