<span id="A4.SS2.SSS5.p2.pic1.2.8" class="ltx_p"><span id="A4.SS2.SSS5.p2.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Step 3: generate exactly <span id="A4.SS2.SSS5.p2.pic1.2.8.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{q}</span> improved variants based on your analysis and critique. Each variant should address a different aspect of the critique.</span></span>
<span id="A4.SS2.SSS5.p2.pic1.2.9" class="ltx_p"><span id="A4.SS2.SSS5.p2.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Return a JSON array of <span id="A4.SS2.SSS5.p2.pic1.2.9.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{q}</span> strings, where each string is a complete improved system prompt.</span></span>
