<svg id="A4.SS1.SSS4.p2.pic1" class="ltx_picture" height="622.18" overflow="visible" version="1.1" viewbox="0 0 477.38 622.18" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,622.18) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 616.27 C 0 619.54 2.64 622.18 5.91 622.18 L 471.47 622.18 C 474.73 622.18 477.38 619.54 477.38 616.27 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 601.72 L 475.41 601.72 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 607.63)"><foreignobject style="--ltx-fo-width:36.5em;--ltx-fo-height:0.68em;--ltx-fo-depth:0em;font-size:9.25pt;" height="8.65" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="467.17"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.5em;">
<span id="A4.SS1.SSS4.p2.pic1.1.1" class="ltx_p"><span id="A4.SS1.SSS4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold ltx_font_smallcaps" style="font-size:90%;--ltx-fg-color:#FFFFFF;">FeatureGuidedRefine</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 11.79)"><foreignobject style="--ltx-fo-width:34.76em;--ltx-fo-height:45.57em;--ltx-fo-depth:0.24em;font-size:9.25pt;" height="586.35" overflow="visible" transform="matrix(1 0 0 -1 0 583.24)" width="444.9"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.76em;">
<span id="A4.SS1.SSS4.p2.pic1.2.1" class="ltx_p"><span id="A4.SS1.SSS4.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are an expert prompt engineer. Modify the given system prompt to better match target feature values.</span></span>
<span id="A4.SS1.SSS4.p2.pic1.2.2" class="ltx_p"><span id="A4.SS1.SSS4.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The system prompt is for an AI assistant performing the following task:
<span id="A4.SS1.SSS4.p2.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{task_context}</span></span></span>
<span id="A4.SS1.SSS4.p2.pic1.2.3" class="ltx_p"><span id="A4.SS1.SSS4.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Consider what text patterns in the reference examples correspond to the desired feature values, and what specific phrases in the current prompt are causing the gaps.</span></span>
<span id="A4.SS1.SSS4.p2.pic1.2.4" class="ltx_p"><span id="A4.SS1.SSS4.p2.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Rules:</span></span>
<span id="A4.I4" class="ltx_itemize">
<span id="A4.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i1.p1" class="ltx_para">
<span id="A4.I4.i1.p1.1" class="ltx_p"><span id="A4.I4.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Focus on the LARGEST gaps first (they are listed in order of priority).</span></span>
</span></span>
<span id="A4.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i2.p1" class="ltx_para">
<span id="A4.I4.i2.p1.1" class="ltx_p"><span id="A4.I4.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">MODIFY the existing text — do not rewrite from scratch.</span></span>
</span></span>
<span id="A4.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i3.p1" class="ltx_para">
<span id="A4.I4.i3.p1.1" class="ltx_p"><span id="A4.I4.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">PRESERVE aspects that are already well-aligned with their targets.</span></span>
</span></span>
<span id="A4.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i4.p1" class="ltx_para">
<span id="A4.I4.i4.p1.1" class="ltx_p"><span id="A4.I4.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Output ONLY the modified prompt text, with no additional commentary or formatting.</span></span>
</span></span>
</span>
<span id="A4.SS1.SSS4.p2.pic1.2.5" class="ltx_p"><em id="A4.SS1.SSS4.p2.pic1.2.5.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">[When reference examples are provided:]</em><span id="A4.SS1.SSS4.p2.pic1.2.5.2" class="ltx_text"></span></span>
<span id="A4.SS1.SSS4.p2.pic1.2.6" class="ltx_p"><span id="A4.SS1.SSS4.p2.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Reference examples (sorted by performance):
<br class="ltx_break"><span id="A4.SS1.SSS4.p2.pic1.2.6.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{examples_text}</span>  <em id="A4.SS1.SSS4.p2.pic1.2.6.1.2" class="ltx_emph ltx_font_italic">[TOP/BOTTOM labels, features, and scores]</em></span></span>
<span id="A4.SS1.SSS4.p2.pic1.2.7" class="ltx_p"><span id="A4.SS1.SSS4.p2.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Use the TOP examples as reference for the style and patterns that correspond to the desired feature values.</span></span>
<span id="A4.SS1.SSS4.p2.pic1.2.8" class="ltx_p"><em id="A4.SS1.SSS4.p2.pic1.2.8.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">[Then always:]</em><span id="A4.SS1.SSS4.p2.pic1.2.8.2" class="ltx_text"></span></span>
<span id="A4.SS1.SSS4.p2.pic1.2.9" class="ltx_p"><span id="A4.SS1.SSS4.p2.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Current system prompt:
<br class="ltx_break"><span id="A4.SS1.SSS4.p2.pic1.2.9.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{text}</span></span></span>
<span id="A4.SS1.SSS4.p2.pic1.2.10" class="ltx_p"><span id="A4.SS1.SSS4.p2.pic1.2.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Feature gap analysis (sorted by gap magnitude, largest first):
<br class="ltx_break"><span id="A4.SS1.SSS4.p2.pic1.2.10.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{gap_text}</span>  <em id="A4.SS1.SSS4.p2.pic1.2.10.1.2" class="ltx_emph ltx_font_italic">[JSON array; format shown below]</em></span></span>
<span id="A4.SS1.SSS4.p2.pic1.2.11" class="ltx_p"><span id="A4.SS1.SSS4.p2.pic1.2.11.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Modify the system prompt to reduce the largest feature gaps. Output ONLY the modified prompt text.</span></span>
<span id="A4.SS1.SSS4.p2.pic1.2.12" class="ltx_p"><em id="A4.SS1.SSS4.p2.pic1.2.12.1" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">[Gap analysis format:]</em><span id="A4.SS1.SSS4.p2.pic1.2.12.2" class="ltx_text"></span></span><pre id="A4.SS1.SSS4.p2.pic1.2.13" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
[
  {
    &quot;feature_name&quot;: &quot;step_by_step_guidance&quot;,
    &quot;definition&quot;: &quot;How explicitly the prompt instructs...&quot;,
    &quot;target&quot;: 0.85,
    &quot;current&quot;: 0.3,
    &quot;gap&quot;: 0.55,
    &quot;direction&quot;: &quot;increase&quot;
  },
  ...
]
</pre>
</span></span></span></foreignobject></g></g></svg>