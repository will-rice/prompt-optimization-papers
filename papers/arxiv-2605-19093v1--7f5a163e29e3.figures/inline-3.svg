<span id="A4.SS1.SSS3.p2.pic1.1.1" class="ltx_p"><span id="A4.SS1.SSS3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Initial Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 11.09)"><foreignobject style="--ltx-fo-width:35.51em;--ltx-fo-height:42.19em;--ltx-fo-depth:0.19em;font-size:9.25pt;" height="542.42" overflow="visible" transform="matrix(1 0 0 -1 0 540)" width="454.5"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.51em;">
<span id="A4.SS1.SSS3.p2.pic1.2.1" class="ltx_p"><span id="A4.SS1.SSS3.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are an expert prompt engineer. Generate a system prompt for an AI assistant performing the following task:
<span id="A4.SS1.SSS3.p2.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{task_context}</span></span></span>
<span id="A4.SS1.SSS3.p2.pic1.2.2" class="ltx_p"><span id="A4.SS1.SSS3.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The prompt should match specific target feature values.</span></span>
<span id="A4.SS1.SSS3.p2.pic1.2.3" class="ltx_p"><span id="A4.SS1.SSS3.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You will be given:</span></span>
<span id="A4.I3" class="ltx_enumerate">
<span id="A4.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I3.i1.p1" class="ltx_para">
<span id="A4.I3.i1.p1.1" class="ltx_p"><span id="A4.I3.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Feature definitions with their semantics.</span></span>
</span></span>
<span id="A4.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I3.i2.p1" class="ltx_para">
<span id="A4.I3.i2.p1.1" class="ltx_p"><span id="A4.I3.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example prompts labeled [TOP] or [BOTTOM] by performance, with their feature values and scores.</span></span>
</span></span>
<span id="A4.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I3.i3.p1" class="ltx_para">
<span id="A4.I3.i3.p1.1" class="ltx_p"><span id="A4.I3.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">A target feature vector to aim for.</span></span>
</span></span>
</span>
<span id="A4.SS1.SSS3.p2.pic1.2.4" class="ltx_p"><span id="A4.SS1.SSS3.p2.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Study what makes the TOP-scoring examples effective and what makes the BOTTOM-scoring examples less effective. Learn from the best examples — understand the patterns and approaches that lead to high performance.</span></span>
<span id="A4.SS1.SSS3.p2.pic1.2.5" class="ltx_p"><span id="A4.SS1.SSS3.p2.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The target feature vector indicates a promising direction to explore. Generate a NEW system prompt that combines the successful patterns from the TOP examples while matching the target feature values.</span></span>
<span id="A4.SS1.SSS3.p2.pic1.2.6" class="ltx_p"><span id="A4.SS1.SSS3.p2.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Output ONLY the generated prompt text, with no additional commentary or formatting.</span></span>
<span id="A4.SS1.SSS3.p2.pic1.2.7" class="ltx_p"><span id="A4.SS1.SSS3.p2.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Feature definitions:
<br class="ltx_break">— <span id="A4.SS1.SSS3.p2.pic1.2.7.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#800080;">{f.name}</span>: <span id="A4.SS1.SSS3.p2.pic1.2.7.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{f.description}</span>  <em id="A4.SS1.SSS3.p2.pic1.2.7.1.3" class="ltx_emph ltx_font_italic">[for each feature]</em></span></span>
<span id="A4.SS1.SSS3.p2.pic1.2.8" class="ltx_p"><span id="A4.SS1.SSS3.p2.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example prompts (sorted by performance, with tier labels):
<br class="ltx_break"><span id="A4.SS1.SSS3.p2.pic1.2.8.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{examples_text}</span>  <em id="A4.SS1.SSS3.p2.pic1.2.8.1.2" class="ltx_emph ltx_font_italic">[TOP/BOTTOM labels, features, and scores]</em></span></span>
<span id="A4.SS1.SSS3.p2.pic1.2.9" class="ltx_p"><span id="A4.SS1.SSS3.p2.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Target feature vector:
<br class="ltx_break"><span id="A4.SS1.SSS3.p2.pic1.2.9.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{target_text}</span>  <em id="A4.SS1.SSS3.p2.pic1.2.9.1.2" class="ltx_emph ltx_font_italic">[JSON dict, e.g. <span id="A4.SS1.SSS3.p2.pic1.2.9.1.2.1" class="ltx_text ltx_font_upright">{</span>&quot;conciseness&quot;: 0.85, &quot;step_guidance&quot;: 0.70<span id="A4.SS1.SSS3.p2.pic1.2.9.1.2.2" class="ltx_text ltx_font_upright">}</span>]</em></span></span>
<span id="A4.SS1.SSS3.p2.pic1.2.10" class="ltx_p"><span id="A4.SS1.SSS3.p2.pic1.2.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Generate a system prompt that combines the best patterns from the TOP examples while matching the target features. Output ONLY the prompt text.</span></span>
</span></span></span></foreignobject></g></g></svg>