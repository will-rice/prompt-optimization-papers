<svg id="A5.SS0.SSS0.Px9.pic1" class="ltx_picture" height="990.61" overflow="visible" version="1.1" viewbox="0 0 653.15 990.61" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,990.61) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#808080;" fill="#808080" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 990.61 L 653.15 990.61 L 653.15 0 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 0.55 L 0.55 990.05 L 652.6 990.05 L 652.6 0.55 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.62 28.15)"><foreignobject style="--ltx-fo-width:43.35em;--ltx-fo-height:68.92em;--ltx-fo-depth:1.39em;font-size:10pt;" height="972.91" overflow="visible" transform="matrix(1 0 0 -1 0 953.61)" width="599.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS0.SSS0.Px9.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.35em;">
<span id="A5.I6" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i1.p1" class="ltx_para">
<span id="A5.I6.i1.p1.1" class="ltx_p"><span id="A5.I6.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Preserve all named individuals mentioned as representatives
or key actors, even if mentioned briefly or infrequently.</span><span id="A5.I6.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span>
<span id="A5.I6.i1.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I6.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A5.I6.i1.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A5.I6.i1.I1.i1.p1" class="ltx_para">
<span id="A5.I6.i1.I1.i1.p1.1" class="ltx_p"><span id="A5.I6.i1.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Do not replace specific names with
generic entities unless explicitly stated.
</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i2.p1" class="ltx_para">
<span id="A5.I6.i2.p1.1" class="ltx_p"><span id="A5.I6.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Preserve all numerical data exactly, including vote
counts, funding amounts, dates, and other quantitative details.</span><span id="A5.I6.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span>
<span id="A5.I6.i2.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I6.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A5.I6.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A5.I6.i2.I1.i1.p1" class="ltx_para">
<span id="A5.I6.i2.I1.i1.p1.1" class="ltx_p"><span id="A5.I6.i2.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Do not summarize or
approximate numbers.
</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i3.p1" class="ltx_para">
<span id="A5.I6.i3.p1.1" class="ltx_p"><span id="A5.I6.i3.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Avoid merging multiple speakers’ statements into generic summaries that
lose attribution or specificity.</span><span id="A5.I6.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span>
<span id="A5.I6.i3.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I6.i3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A5.I6.i3.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A5.I6.i3.I1.i1.p1" class="ltx_para">
<span id="A5.I6.i3.I1.i1.p1.1" class="ltx_p"><span id="A5.I6.i3.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Maintain clear, unambiguous speaker labels for all
utterances, especially questions and key statements.
</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i4.p1" class="ltx_para">
<span id="A5.I6.i4.p1.1" class="ltx_p"><span id="A5.I6.i4.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Omit or condense procedural or
conversational details only if they do not contain critical facts or actors relevant to the
question.</span><span id="A5.I6.i4.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span>
</span></span>
<span id="A5.I6.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i5.p1" class="ltx_para">
<span id="A5.I6.i5.p1.1" class="ltx_p"><span id="A5.I6.i5.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Avoid ellipses, ambiguous placeholders, or fragmented phrasing that obscure
meaning.</span><span id="A5.I6.i5.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span>
<span id="A5.I6.i5.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I6.i5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A5.I6.i5.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A5.I6.i5.I1.i1.p1" class="ltx_para">
<span id="A5.I6.i5.I1.i1.p1.1" class="ltx_p"><span id="A5.I6.i5.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Use concise, complete sentences with logical connectors to maintain coherence and
semantic clarity.
</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I6.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i6.p1" class="ltx_para">
<span id="A5.I6.i6.p1.1" class="ltx_p"><span id="A5.I6.i6.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Use abstractive summarization to rephrase content concisely but completely,
ensuring no key factual information, names, roles, sentiments, or dates are omitted or altered.</span><span id="A5.I6.i6.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span>
<span id="A5.I6.i6.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I6.i6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A5.I6.i6.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A5.I6.i6.I1.i1.p1" class="ltx_para">
<span id="A5.I6.i6.I1.i1.p1.1" class="ltx_p"><span id="A5.I6.i6.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Use compact notation and abbreviations only when clarity and unambiguous understanding are
maintained.
</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I6.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i7.p1" class="ltx_para">
<span id="A5.I6.i7.p1.1" class="ltx_p"><span id="A5.I6.i7.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Prioritize semantic completeness and clarity over strict length limits.</span><span id="A5.I6.i7.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span>
<span id="A5.I6.i7.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I6.i7.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A5.I6.i7.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A5.I6.i7.I1.i1.p1" class="ltx_para">
<span id="A5.I6.i7.I1.i1.p1.1" class="ltx_p"><span id="A5.I6.i7.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">It
is acceptable to exceed length constraints moderately to preserve critical facts, semantic roles,
sentiments, and temporal details.
</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I6.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i8.p1" class="ltx_para">
<span id="A5.I6.i8.p1.1" class="ltx_p"><span id="A5.I6.i8.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Stop compressing if clarity, semantic completeness, or
solvability is at risk.</span><span id="A5.I6.i8.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span>
</span></span>
<span id="A5.I6.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i9.p1" class="ltx_para">
<span id="A5.I6.i9.p1.1" class="ltx_p"><span id="A5.I6.i9.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Before finalizing, perform a thorough self-check to verify that all
critical facts—dates, times, named entities, official titles, numerical data, actor-action pairs,
sentiments, and mandates—are present, unambiguous, and correctly represented.</span><span id="A5.I6.i9.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span>
<span id="A5.I6.i9.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I6.i9.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A5.I6.i9.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A5.I6.i9.I1.i1.p1" class="ltx_para">
<span id="A5.I6.i9.I1.i1.p1.1" class="ltx_p"><span id="A5.I6.i9.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Reinsert or
rephrase any missing or altered critical information.
</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I6.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i10.p1" class="ltx_para">
<span id="A5.I6.i10.p1.1" class="ltx_p"><span id="A5.I6.i10.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Maintain consistent formatting and naming
conventions across all compressed chunks to ensure coherence and avoid contradictory or fragmented
information.</span><span id="A5.I6.i10.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span>
</span></span>
<span id="A5.I6.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i11.p1" class="ltx_para">
<span id="A5.I6.i11.p1.1" class="ltx_p"><span id="A5.I6.i11.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Focus on preserving content related to council members’ expressions of
gratitude, mentoring, personal acknowledgments, historical figure mentions, and procedural
details.</span><span id="A5.I6.i11.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span>
<span id="A5.I6.i11.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I6.i11.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A5.I6.i11.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A5.I6.i11.I1.i1.p1" class="ltx_para">
<span id="A5.I6.i11.I1.i1.p1.1" class="ltx_p"><span id="A5.I6.i11.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Use proxy keywords such as “gratitude,” “mentoring,” “thank,” “historical figure,”
“Councilmember [Name]” to guide focus without revealing answers.
</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A5.SS0.SSS0.Px9.pic1.1.1" class="ltx_p"><span id="A5.SS0.SSS0.Px9.pic1.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Examples:<span id="A5.SS0.SSS0.Px9.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A5.I7" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i1.p1" class="ltx_para">
<span id="A5.I7.i1.p1.1" class="ltx_p"><span id="A5.I7.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Good:
“Councilman Ortega seconded the motion.”
</span></span>
</span></span>
<span id="A5.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i2.p1" class="ltx_para">
<span id="A5.I7.i2.p1.1" class="ltx_p"><span id="A5.I7.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Bad: “A council member seconded the motion.”
</span></span>
</span></span>
<span id="A5.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i3.p1" class="ltx_para">
<span id="A5.I7.i3.p1.1" class="ltx_p"><span id="A5.I7.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Good:
“Councilmember Richardson thanked Councilwoman Gonzalez for mentoring.”
</span></span>
</span></span>
<span id="A5.I7.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i4.p1" class="ltx_para">
<span id="A5.I7.i4.p1.1" class="ltx_p"><span id="A5.I7.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Bad: “Councilwoman
Gonzalez thanked someone.”
</span></span>
</span></span>
<span id="A5.I7.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i5.p1" class="ltx_para">
<span id="A5.I7.i5.p1.1" class="ltx_p"><span id="A5.I7.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Good: “The working session was held on April 12th.”
</span></span>
</span></span>
<span id="A5.I7.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i6.p1" class="ltx_para">
<span id="A5.I7.i6.p1.1" class="ltx_p"><span id="A5.I7.i6.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Bad: “The
working session date was not mentioned.”
</span></span>
</span></span>
<span id="A5.I7.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i7.p1" class="ltx_para">
<span id="A5.I7.i7.p1.1" class="ltx_p"><span id="A5.I7.i7.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Good: “Motion withdrawn by Councilor Smith.”
</span></span>
</span></span>
<span id="A5.I7.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i8.p1" class="ltx_para">
<span id="A5.I7.i8.p1.1" class="ltx_p"><span id="A5.I7.i8.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Bad:
“Motion withdrawn.”
</span></span>
</span></span>
<span id="A5.I7.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i9.p1" class="ltx_para">
<span id="A5.I7.i9.p1.1" class="ltx_p"><span id="A5.I7.i9.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Good: “Funding increased by $300,000 for FY 2020.”
</span></span>
</span></span>
<span id="A5.I7.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i10.p1" class="ltx_para">
<span id="A5.I7.i10.p1.1" class="ltx_p"><span id="A5.I7.i10.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Bad: “Funding
increased by several thousand dollars.”
</span></span>
</span></span>
</span>
<span id="A5.SS0.SSS0.Px9.pic1.1.2" class="ltx_p"><span id="A5.SS0.SSS0.Px9.pic1.1.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Remember, the compressed transcript is the sole context for answering questions;
ensure it contains all information needed to answer temporal, factual, and named-entity questions
accurately.<span id="A5.SS0.SSS0.Px9.pic1.1.2.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>