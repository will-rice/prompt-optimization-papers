<span id="S5.SS3.SSS2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.2em;">
<span id="S5.SS3.SSS2.p4.pic1.1.1" class="ltx_p"><span id="S5.SS3.SSS2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Finding 3:<span id="S5.SS3.SSS2.p4.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Through quantitative analysis, we found that while PET-Select does not always select the most efficient technique in terms of token usage, it still manages to provide correct answers by choosing techniques that are capable of generating the correct code. Additionally, qualitative analysis revealed that PET-Select’s improvement over the best individual PET can be explained by its ability to select
simpler
PET when appropriate which reduces token usage while maintaining a high generated code passing rate.</span></span></span>
