<span id="S5.SS2.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.2em;">
<span id="S5.SS2.p6.pic1.1.1" class="ltx_p"><span id="S5.SS2.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Finding 2:<span id="S5.SS2.p6.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Overall, PET-Select outperforms other baseline approaches across different versions of GPT on both datasets, achieving comparable or up to 1.9% of accuracy improvement with up to 74.8% fewer tokens. Compared to other baselines, PET-Select effectively selects the appropriate techniques based on embeddings adjusted by the contrastive learning CodeBERT model.</span></span></span>
