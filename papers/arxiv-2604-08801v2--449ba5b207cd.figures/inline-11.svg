/mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6,000,000</mn></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">a^{2}b+a^{2}c+b^{2}a+b^{2}c+c^{2}a+c^{2}b=6,000,000.</annotation></semantics></math></span>
