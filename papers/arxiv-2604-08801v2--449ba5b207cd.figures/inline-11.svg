<span id="A1.SS3.SSS2.pic3.p3.1" class="ltx_p"><span id="A1.SS3.SSS2.pic3.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">AIME Prompt:<span id="A1.SS3.SSS2.pic3.p3.1.1.1" class="ltx_text ltx_font_medium"> Find the number of triples of nonnegative integers <math id="A1.SS3.SSS2.pic3.m1" class="ltx_Math" alttext="(a,b,c)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(a,b,c)</annotation></semantics></math> satisfying <math id="A1.SS3.SSS2.pic3.m2" class="ltx_Math" alttext="a+b+c=300" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">300</mn></mrow><annotation encoding="application/x-tex">a+b+c=300</annotation></semantics></math> and</span></span></span>
