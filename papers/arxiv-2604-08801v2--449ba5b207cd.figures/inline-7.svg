<svg id="A1.SS3.SSS2.pic1" class="ltx_picture" height="903.17" overflow="visible" version="1.1" viewbox="0 0 550 903.17" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,903.17) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 897.27 C 0 900.53 2.64 903.17 5.91 903.17 L 544.09 903.17 C 547.36 903.17 550 900.53 550 897.27 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 897.27 C 1.97 899.44 3.73 901.2 5.91 901.2 L 544.09 901.2 C 546.27 901.2 548.03 899.44 548.03 897.27 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:63.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="875.62" overflow="visible" transform="matrix(1 0 0 -1 0 872.93)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS3.SSS2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A1.SS3.SSS2.pic1.p3" class="ltx_para">
<span id="A1.SS3.SSS2.pic1.p3.1" class="ltx_p"><span id="A1.SS3.SSS2.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">AIME Prompt:<span id="A1.SS3.SSS2.pic1.p3.1.1.1" class="ltx_text ltx_font_medium"> Let <math id="A1.SS3.SSS2.pic1.m1" class="ltx_Math" alttext="ABC" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi></mrow><annotation encoding="application/x-tex">ABC</annotation></semantics></math> be a triangle inscribed in circle <math id="A1.SS3.SSS2.pic1.m2" class="ltx_Math" alttext="\omega" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ω</mi><annotation encoding="application/x-tex">\omega</annotation></semantics></math>. Let the tangents to <math id="A1.SS3.SSS2.pic1.m3" class="ltx_Math" alttext="\omega" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ω</mi><annotation encoding="application/x-tex">\omega</annotation></semantics></math> at <math id="A1.SS3.SSS2.pic1.m4" class="ltx_Math" alttext="B" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><annotation encoding="application/x-tex">B</annotation></semantics></math> and <math id="A1.SS3.SSS2.pic1.m5" class="ltx_Math" alttext="C" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi><annotation encoding="application/x-tex">C</annotation></semantics></math> intersect at point <math id="A1.SS3.SSS2.pic1.m6" class="ltx_Math" alttext="D" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><annotation encoding="application/x-tex">D</annotation></semantics></math>, and let <math id="A1.SS3.SSS2.pic1.m7" class="ltx_Math" alttext="\overline{AD}" display="inline" intent=":literal"><semantics><mover accent="true"><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="true">¯</mo></mover><annotation encoding="application/x-tex">\overline{AD}</annotation></semantics></math> intersect <math id="A1.SS3.SSS2.pic1.m8" class="ltx_Math" alttext="\omega" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ω</mi><annotation encoding="application/x-tex">\omega</annotation></semantics></math> at <math id="A1.SS3.SSS2.pic1.m9" class="ltx_Math" alttext="P" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><annotation encoding="application/x-tex">P</annotation></semantics></math>. If <math id="A1.SS3.SSS2.pic1.m10" class="ltx_Math" alttext="AB=5" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></mrow><annotation encoding="application/x-tex">AB=5</annotation></semantics></math>, <math id="A1.SS3.SSS2.pic1.m11" class="ltx_Math" alttext="BC=9" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></mrow><annotation encoding="application/x-tex">BC=9</annotation></semantics></math>, and <math id="A1.SS3.SSS2.pic1.m12" class="ltx_Math" alttext="AC=10" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn></mrow><annotation encoding="application/x-tex">AC=10</annotation></semantics></math>, <math id="A1.SS3.SSS2.pic1.m13" class="ltx_Math" alttext="AP" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi></mrow><annotation encoding="application/x-tex">AP</annotation></semantics></math> can be written as the form <math id="A1.SS3.SSS2.pic1.m14" class="ltx_Math" alttext="\frac{m}{n}" display="inline" intent=":literal"><semantics><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mfrac><annotation encoding="application/x-tex">\frac{m}{n}</annotation></semantics></math>, where <math id="A1.SS3.SSS2.pic1.m15" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math> and <math id="A1.SS3.SSS2.pic1.m16" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> are relatively prime integers. Find <math id="A1.SS3.SSS2.pic1.m17" class="ltx_Math" alttext="m+n" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><annotation encoding="application/x-tex">m+n</annotation></semantics></math>.</span></span></span>
</span>
