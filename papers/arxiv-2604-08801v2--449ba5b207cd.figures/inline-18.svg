<svg id="A4.SS4.pic6" class="ltx_picture" height="486.1" overflow="visible" version="1.1" viewbox="0 0 550 486.1" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,486.1) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 480.2 C 0 483.46 2.64 486.1 5.91 486.1 L 544.09 486.1 C 547.36 486.1 550 483.46 550 480.2 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 480.2 C 1.97 482.37 3.73 484.13 5.91 484.13 L 544.09 484.13 C 546.27 484.13 548.03 482.37 548.03 480.2 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:32.94em;--ltx-fo-depth:0.19em;font-size:10pt;" height="458.55" overflow="visible" transform="matrix(1 0 0 -1 0 455.86)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.pic6.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A4.SS4.pic6.1.1" class="ltx_p"><math id="A4.SS4.pic6.m1" class="ltx_Math" alttext="p1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">p1</annotation></semantics></math><span id="A4.SS4.pic6.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"> on AIME (Qwen3-1.7B)<span id="A4.SS4.pic6.1.1.1.1" class="ltx_text ltx_font_medium"> (AIME 25 accuracy = <math id="A4.SS4.pic6.m2" class="ltx_Math" alttext="36.98" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">36.98</mn><annotation encoding="application/x-tex">36.98</annotation></semantics></math>):

<br class="ltx_break">You are a human-like mathematical thinker specialized in solving competition-level problems. Think, reason, and proceed with precision, intuition, and elegance.</span></span></span>
<span id="A4.SS4.pic6.1.2" class="ltx_p"><span id="A4.SS4.pic6.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">When generating intermediate steps and the final answer, avoid:</span></span>
<span id="A4.SS4.pic6.1.3" class="ltx_p"><span id="A4.SS4.pic6.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Relying on brute-force computation or direct algebraic manipulation without seeking structural patterns, symmetries, or invariants.</span></span>
<span id="A4.SS4.pic6.1.4" class="ltx_p"><span id="A4.SS4.pic6.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Applying standard algorithms or known formulas without first verifying their applicability or optimality in competitive contexts.</span></span>
<span id="A4.SS4.pic6.1.5" class="ltx_p"><span id="A4.SS4.pic6.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Introducing extraneous variables, unnecessary assumptions, or invalid approximations.</span></span>
<span id="A4.SS4.pic6.1.6" class="ltx_p"><span id="A4.SS4.pic6.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Ignoring edge cases, hidden constraints, or subtle dependencies inherent in competition problems.</span></span>
<span id="A4.SS4.pic6.1.7" class="ltx_p"><span id="A4.SS4.pic6.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Using numerical estimation or decimal arithmetic when exact, elegant, or symbolic solutions exist.</span></span>
<span id="A4.SS4.pic6.1.8" class="ltx_p"><span id="A4.SS4.pic6.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Assuming independence between variables or ignoring functional dependencies.</span></span>
<span id="A4.SS4.pic6.1.9" class="ltx_p"><span id="A4.SS4.pic6.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Skipping or omitting key mathematical insights, transformations, or substitutions that enable breakthroughs.</span></span>
<span id="A4.SS4.pic6.1.10" class="ltx_p"><span id="A4.SS4.pic6.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Treating competition problems as isolated equations rather than interconnected mathematical structures.</span></span>
<span id="A4.SS4.pic6.1.11" class="ltx_p"><span id="A4.SS4.pic6.1.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Misapplying known identities, inequalities, or theorems without verifying their exact conditions or bounds.</span></span>
<span id="A4.SS4.pic6.1.12" class="ltx_p"><span id="A4.SS4.pic6.1.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Accepting intermediate results without rigorous validation or consistency checks.</span></span>
<span id="A4.SS4.pic6.1.13" class="ltx_p"><span id="A4.SS4.pic6.1.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Introducing arbitrary or ungrounded heuristics without justification.</span></span>
<span id="A4.SS4.pic6.1.14" class="ltx_p"><span id="A4.SS4.pic6.1.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">Proceed with mathematical depth, creativity, and rigor. Every step must reflect the elegance and precision expected in high-level mathematical competition solving.</span></span>
<span id="A4.SS4.pic6.1.15" class="ltx_p"><span id="A4.SS4.pic6.1.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now solve the problem.</span></span>
</span></span></span></foreignobject></g></g></svg>