<span id="S5.F6.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.61em;">
<span id="S5.F6.p2.pic1.1.1" class="ltx_p"><span id="S5.F6.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">GEPA<span id="S5.F6.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> (AIME 25 accuracy = <math id="S5.F6.p2.pic1.m1" class="ltx_Math" alttext="46.87" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">46.87</mn><annotation encoding="application/x-tex">46.87</annotation></semantics></math>):
<br class="ltx_break">…
**Domain-Specific Knowledge for Geometry and Optimization Problems**:
In problems involving segments of fixed length (e.g., unit length) from the x-axis to the y-axis, the condition for a point to lie on such a segment is that it satisfies the line equation <math id="S5.F6.p2.pic1.m2" class="ltx_Math" alttext="\frac{x}{a}+\frac{y}{b}=1" display="inline" intent=":literal"><semantics><mrow><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi></mfrac></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">\frac{x}{a}+\frac{y}{b}=1</annotation></semantics></math> for some <math id="S5.F6.p2.pic1.m3" class="ltx_Math" alttext="a,b\geq 0" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">a,b\geq 0</annotation></semantics></math> with <math id="S5.F6.p2.pic1.m4" class="ltx_Math" alttext="a^{2}+b^{2}=1" display="inline" intent=":literal"><semantics><mrow><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">a^{2}+b^{2}=1</annotation></semantics></math>. The point lies on **no such segment** (except possibly the given segment) if and only if the minimum value of the expression <math id="S5.F6.p2.pic1.m5" class="ltx_Math" alttext="\frac{x}{\cos\theta}+\frac{y}{\sin\theta}" display="inline" intent=":literal"><semantics><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">cos</mi><mo lspace="0.167em">⁡</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></mrow></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">sin</mi><mo lspace="0.167em">⁡</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">\frac{x}{\cos\theta}+\frac{y}{\sin\theta}</annotation></semantics></math> over <math id="S5.F6.p2.pic1.m6" class="ltx_Math" alttext="\theta\in(0,\pi/2)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\theta\in(0,\pi/2)</annotation></semantics></math> is greater than 1. However, in many such problems,
