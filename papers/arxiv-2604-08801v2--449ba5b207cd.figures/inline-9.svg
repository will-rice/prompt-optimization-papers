<svg id="A1.SS3.SSS2.pic2" class="ltx_picture" height="1750" overflow="visible" version="1.1" viewbox="0 0 550 1750" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1750) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1744.09 C 0 1747.35 2.64 1750 5.91 1750 L 544.09 1750 C 547.36 1750 550 1747.35 550 1744.09 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1744.09 C 1.97 1746.27 3.73 1748.03 5.91 1748.03 L 544.09 1748.03 C 546.27 1748.03 548.03 1746.27 548.03 1744.09 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:124.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="1722.46" overflow="visible" transform="matrix(1 0 0 -1 0 1719.77)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS3.SSS2.pic2.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A1.SS3.SSS2.pic2.p3" class="ltx_para">
<span id="A1.SS3.SSS2.pic2.p3.1" class="ltx_p"><span id="A1.SS3.SSS2.pic2.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">AIME Prompt:<span id="A1.SS3.SSS2.pic2.p3.1.1.1" class="ltx_text ltx_font_medium"> Let <math id="A1.SS3.SSS2.pic2.m1" class="ltx_Math" alttext="ABCD" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi></mrow><annotation encoding="application/x-tex">ABCD</annotation></semantics></math> be a tetrahedron such that <math id="A1.SS3.SSS2.pic2.m2" class="ltx_Math" alttext="AB=CD=\sqrt{41}" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">41</mn></msqrt></mrow><annotation encoding="application/x-tex">AB=CD=\sqrt{41}</annotation></semantics></math>, <math id="A1.SS3.SSS2.pic2.m3" class="ltx_Math" alttext="AC=BD=\sqrt{80}" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">80</mn></msqrt></mrow><annotation encoding="application/x-tex">AC=BD=\sqrt{80}</annotation></semantics></math>, and <math id="A1.SS3.SSS2.pic2.m4" class="ltx_Math" alttext="BC=AD=\sqrt{89}" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">89</mn></msqrt></mrow><annotation encoding="application/x-tex">BC=AD=\sqrt{89}</annotation></semantics></math>. There exists a point <math id="A1.SS3.SSS2.pic2.m5" class="ltx_Math" alttext="I" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">I</mi><annotation encoding="application/x-tex">I</annotation></semantics></math> inside the tetrahedron such that the distances from <math id="A1.SS3.SSS2.pic2.m6" class="ltx_Math" alttext="I" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">I</mi><annotation encoding="application/x-tex">I</annotation></semantics></math> to each of the faces of the tetrahedron are all equal. This distance can be written in the form <math id="A1.SS3.SSS2.pic2.m7" class="ltx_Math" alttext="\frac{m\sqrt{n}}{p}" display="inline" intent=":literal"><semantics><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo lspace="0em" rspace="0em">​</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msqrt></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi></mfrac><annotation encoding="application/x-tex">\frac{m\sqrt{n}}{p}</annotation></semantics></math>, where <math id="A1.SS3.SSS2.pic2.m8" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math>, <math id="A1.SS3.SSS2.pic2.m9" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>, and <math id="A1.SS3.SSS2.pic2.m10" class="ltx_Math" alttext="p" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><annotation encoding="application/x-tex">p</annotation></semantics></math> are positive integers, <math id="A1.SS3.SSS2.pic2.m11" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math> and <math id="A1.SS3.SSS2.pic2.m12" class="ltx_Math" alttext="p" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><annotation encoding="application/x-tex">p</annotation></semantics></math> are relatively prime, and <math id="A1.SS3.SSS2.pic2.m13" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> is not divisible by the square of any prime. Find <math id="A1.SS3.SSS2.pic2.m14" class="ltx_Math" alttext="m+n+p" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi></mrow><annotation encoding="application/x-tex">m+n+p</annotation></semantics></math>.</span></span></span>
</span>
<span id="A1.SS3.SSS2.pic2.p1" class="ltx_para ltx_noindent">
<span id="A1.SS3.SSS2.pic2.p1.1" class="ltx_p"><span id="A1.SS3.SSS2.pic2.p1.1.1" class="ltx_text ltx_align_left ltx_inline-block" style="width:366.2pt;--ltx-fg-color:#000000;"><span class="ltx_inline-block"><svg id="A1.SS3.SSS2.pic2.p1.pic1" class="ltx_picture" height="1.11" overflow="visible" version="1.1" viewbox="0 0 507.8 1.11" width="507.8"><g style="--ltx-stroke-color:#B3B3B3;--ltx-fill-color:#B3B3B3;--ltx-fg-color:#B3B3B3;" color="#B3B3B3" fill="#B3B3B3" stroke="#B3B3B3" stroke-dasharray="3.0pt,3.0pt" stroke-dashoffset="0.0pt" stroke-width="0.8pt" transform="translate(0,1.11) matrix(1 0 0 -1 0 0) translate(0.55,0) translate(0,0.55)"><path style="fill:none" d="M 0 0 L 506.69 0" /></g></svg>