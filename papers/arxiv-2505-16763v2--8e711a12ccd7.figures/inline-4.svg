<span id="A4.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.p6.pic1.2.1" class="ltx_p ltx_align_left"><span id="A4.p6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a helpful and precise assistant for checking the quality of the answers.</span></span>
<span id="A4.p6.pic1.2.2" class="ltx_p ltx_align_left"><span id="A4.p6.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given the input:</span></span>
