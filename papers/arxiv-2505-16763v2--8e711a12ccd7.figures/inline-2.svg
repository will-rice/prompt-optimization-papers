<span id="A4.p4.pic1.1.1" class="ltx_p"><span id="A4.p4.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Alignment Score Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:55.95em;--ltx-fo-depth:0.19em;font-size:10pt;" height="776.88" overflow="visible" transform="matrix(1 0 0 -1 0 774.19)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.p4.pic1.2.1" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please evaluate the alignment of two pictures (“Image 1” and “Image 2”) to the text (“Text”) using the 6-
level judging system described below.</span></span>
<span id="A4.p4.pic1.2.2" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The two images given are independent, and should be evaluated separately and step by step, ensuring that the
order in which the images were presented does not affect your judgment.</span></span>
<span id="A4.p4.pic1.2.3" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">You need to first consider what appears in the image, then whether what is described in the text appears in the
image, and finally give a score based on the system.</span></span>
<span id="A4.p4.pic1.2.4" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Judging system:</span></span>
<span id="A4.p4.pic1.2.5" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- No Match (Score: 0): The image does not contain any of the objects or elements mentioned in the text. There is no recognizable connection between the text and the image.</span></span>
<span id="A4.p4.pic1.2.6" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Poor Match (Score: 1): The image contains one or a few of the objects mentioned in the text, but these are
peripheral and do not capture the primary content or relationships described. Quantitative relationships are
ignored or inaccurately represented.</span></span>
<span id="A4.p4.pic1.2.7" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Fair Match (Score: 2): Some of the primary objects mentioned in the text are present in the image, and at least
one quantitative relationship or object relationship is correctly depicted. However, several key objects or
relationships are missing or inaccurately represented.</span></span>
<span id="A4.p4.pic1.2.8" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Good Match (Score: 3): The majority of the objects mentioned in the text are present, and many of the
described quantitative relationships and object relationships are accurately depicted. Minor details may be
missing or slightly altered.</span></span>
<span id="A4.p4.pic1.2.9" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Excellent Match (Score: 4): Nearly all objects described in the text are accurately represented in the image,
including precise quantitative relationships and interactions between objects. Only trivial discrepancies or
omissions are present, which do not significantly impact the overall accuracy.</span></span>
<span id="A4.p4.pic1.2.10" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Perfect Match (Score: 5): The image perfectly matches the text in terms of the presence of all described
objects, accurate quantitative relationships, and the exact relationships between objects. Every detail mentioned
in the text is present and correctly depicted in the image.</span></span>
<span id="A4.p4.pic1.2.11" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Text: <math id="A4.p4.pic1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FF0000;" mathcolor="#FF0000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math><span id="A4.p4.pic1.2.11.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">PROMPT<math id="A4.p4.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FF0000;" mathcolor="#FF0000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math></span></span></span>
<span id="A4.p4.pic1.2.12" class="ltx_p ltx_align_left"><span id="A4.p4.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please provide a comprehensive explanation of your score.
Note that the score has nothing to do with image input order.</span></span>
