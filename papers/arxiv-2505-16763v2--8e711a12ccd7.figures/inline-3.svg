<span id="A4.p5.pic1.1.1" class="ltx_p"><span id="A4.p5.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Pick Score Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:58.35em;--ltx-fo-depth:0.19em;font-size:10pt;" height="810.09" overflow="visible" transform="matrix(1 0 0 -1 0 807.4)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.p5.pic1.2.1" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please evaluate how well these two images (“Image 1” and “Image 2”) generated based on the text (“Text”) are
preferred by humans using the 6-level judging system described below.</span></span>
<span id="A4.p5.pic1.2.2" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The two images given are independent, and should be evaluated separately and step by step, ensuring that the
order in which the images were presented does not affect your judgment.</span></span>
<span id="A4.p5.pic1.2.3" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">In this system, ’attractiveness’ refers to the visual appeal of an image to the human in terms of color, composition,
lighting, style, and detail.</span></span>
<span id="A4.p5.pic1.2.4" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Judging system:</span></span>
<span id="A4.p5.pic1.2.5" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Poor (Score: 0): The image is repulsive or offensive, lacking any attractiveness. It is completely irrelevant to
the text information and presents the text in a manner that is unpleasant or unacceptable to the audience.</span></span>
<span id="A4.p5.pic1.2.6" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Below Average (Score: 1): The image has almost no attractiveness, and the audience is indifferent to it. Its
relevance to the text information is low, and the presentation style is not attractive enough, making the audience
find it rather dull.</span></span>
<span id="A4.p5.pic1.2.7" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Average (Score: 2): The image lacks attractiveness, is ordinary and lacks visual highlights, the conveyed text
information is not sufficiently clear, and the presentation style is rather ordinary, lacking novelty or appeal.</span></span>
<span id="A4.p5.pic1.2.8" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Above Average (Score: 3): The image’s attractiveness is average, without any particular outstanding features
but also not mediocre, conveying the text information and presenting the text in a generally acceptable manner,
albeit not particularly outstanding.</span></span>
<span id="A4.p5.pic1.2.9" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Very Good (Score: 4): The image is highly attractive, with good visual effects, conveying the text information
basically, and presenting the text in a way that is appealing to humans, allowing the audience to understand and
resonate to some extent.</span></span>
<span id="A4.p5.pic1.2.10" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Excellent (Score: 5): The image is extremely attractive, with outstanding visual effects, clearly and accurately
conveying the text, and presenting the text in a way that resonates deeply with the audience and evokes strong
emotional connections.</span></span>
<span id="A4.p5.pic1.2.11" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Text: <math id="A4.p5.pic1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FF0000;" mathcolor="#FF0000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math><span id="A4.p5.pic1.2.11.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">PROMPT<math id="A4.p5.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FF0000;" mathcolor="#FF0000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math></span></span></span>
<span id="A4.p5.pic1.2.12" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please provide a comprehensive explanation of your score.</span></span>
<span id="A4.p5.pic1.2.13" class="ltx_p ltx_align_left"><span id="A4.p5.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Note that the score has nothing to do with image input order.</span></span>
