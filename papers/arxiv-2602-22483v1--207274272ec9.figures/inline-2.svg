<span id="A1.p2.pic1.2.1" class="ltx_p"><span id="A1.p2.pic1.2.1.1" class="ltx_text ltx_font_sansserif" style="--ltx-fg-color:#000000;">The following is a medical narrative about a patient. You are a skilled medical doctor reviewing the clinical text. The text is either correct or contains one error. The text has one sentence per line. Each line starts with the sentence ID, followed by a pipe character then the sentence to check. Check every sentence of the text. If the text is correct return the following output: CORRECT. If the text has a medical error related to treatment, management, cause, or diagnosis, return the sentence id of the sentence containing the error, followed by a space, and then a corrected version of the sentence. Finding and correcting the error requires medical knowledge and reasoning.</span></span>
