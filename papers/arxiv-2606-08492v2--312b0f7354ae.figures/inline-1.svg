<span id="S6.SS4.p2.pic1.1.1" class="ltx_p"><span id="S6.SS4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example 1: FaithT2I VQA Dataset</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 851.74)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:5.49em;--ltx-fo-depth:0em;font-size:10pt;" height="75.91" overflow="visible" transform="matrix(1 0 0 -1 0 75.91)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.SS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="S6.SS4.p2.pic1.2.1" class="ltx_p"><span id="S6.SS4.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt:<span id="S6.SS4.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> In a dim art gallery hallway, a photographer on the right moves leftward with a camera raised. On the left, a curator adjusts a painting, facing the photographer. The photographer has one lens; the curator holds three placards. The photographer’s reflection glimmers slightly in a nearby glass case, blurred by motion.</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 797.9)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:2.18em;--ltx-fo-depth:56.9em;font-size:10pt;" height="817.55" overflow="visible" transform="matrix(1 0 0 -1 0 30.21)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.SS4.p2.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="S6.SS4.p2.pic1.3.1" class="ltx_p"><span id="S6.SS4.p2.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Omni-dimensional VQA Pairs:<span id="S6.SS4.p2.pic1.3.1.1.1" class="ltx_text"></span></span></span>
<span id="S6.I1" class="ltx_itemize">
<span id="S6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i1.p1" class="ltx_para">
<span id="S6.I1.i1.p1.1" class="ltx_p"><span id="S6.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">What object categories are explicitly mentioned besides people? </span>
<br class="ltx_break"><span id="S6.I1.i1.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Options:</span><span id="S6.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (A) A lens and placards, (B) A tripod and a frame, (C) A flashlight and a notebook, (D) A sculpture and a bench, (E) None </span>
<br class="ltx_break"><span id="S6.I1.i1.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer: A</span></span>
</span></span>
<span id="S6.I1.i2" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i2.p1" class="ltx_para">
<span id="S6.I1.i2.p1.1" class="ltx_p"><span id="S6.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">What are the described attributes of the gallery hallway? </span>
<br class="ltx_break"><span id="S6.I1.i2.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Options:</span><span id="S6.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (A) Bright and noisy, (B) Dim and quiet, (C) Crowded and colorful, (D) Empty and dark, (E) None </span>
<br class="ltx_break"><span id="S6.I1.i2.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer: B</span></span>
</span></span>
<span id="S6.I1.i3" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i3.p1" class="ltx_para">
<span id="S6.I1.i3.p1.1" class="ltx_p"><span id="S6.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">From a third-person perspective, where is the photographer located? </span>
<br class="ltx_break"><span id="S6.I1.i3.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Options:</span><span id="S6.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (A) On the left side, (B) In the center, (C) On the right side, (D) Behind the glass case, (E) None </span>
<br class="ltx_break"><span id="S6.I1.i3.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer: C</span></span>
</span></span>
<span id="S6.I1.i4" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i4.p1" class="ltx_para">
<span id="S6.I1.i4.p1.1" class="ltx_p"><span id="S6.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">What is the facing orientation of the curator? </span>
<br class="ltx_break"><span id="S6.I1.i4.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Options:</span><span id="S6.I1.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (A) Facing away, (B) Facing the painting, (C) Facing right, (D) Facing the photographer, (E) None </span>
<br class="ltx_break"><span id="S6.I1.i4.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer: D</span></span>
</span></span>
<span id="S6.I1.i5" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i5.p1" class="ltx_para">
<span id="S6.I1.i5.p1.1" class="ltx_p"><span id="S6.I1.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How are the photographer and the curator arranged in the scene? </span>
<br class="ltx_break"><span id="S6.I1.i5.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Options:</span><span id="S6.I1.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (A) One behind the other, (B) On opposite sides, (C) Next to each other, (D) In a diagonal line, (E) None </span>
<br class="ltx_break"><span id="S6.I1.i5.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer: B</span></span>
</span></span>
<span id="S6.I1.i6" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i6.p1" class="ltx_para">
<span id="S6.I1.i6.p1.1" class="ltx_p"><span id="S6.I1.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How does the number of placards compare to the number of lenses? </span>
<br class="ltx_break"><span id="S6.I1.i6.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Options:</span><span id="S6.I1.i6.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (A) Fewer placards than lenses, (B) Same number, (C) More placards than lenses, (E) None </span>
<br class="ltx_break"><span id="S6.I1.i6.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer: C</span></span>
</span></span>
<span id="S6.I1.i7" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i7.p1" class="ltx_para">
<span id="S6.I1.i7.p1.1" class="ltx_p"><span id="S6.I1.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given the photographer is moving leftward toward the curator, which person is the photographer getting closer to? </span>
<br class="ltx_break"><span id="S6.I1.i7.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Options:</span><span id="S6.I1.i7.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (A) A visitor, (B) The curator, (C) A security guard, (D) A gallery assistant, (E) None </span>
<br class="ltx_break"><span id="S6.I1.i7.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer: B</span></span>
</span></span>
<span id="S6.I1.i8" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i8.p1" class="ltx_para">
<span id="S6.I1.i8.p1.1" class="ltx_p"><span id="S6.I1.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">According to the scene, is any object described as being occluded or partially hidden? </span>
<br class="ltx_break"><span id="S6.I1.i8.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Options:</span><span id="S6.I1.i8.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (A) Face hidden by camera, (B) Placards hidden by body, (C) No occlusion mentioned, (D) Glass case hides reflection, (E) None </span>
<br class="ltx_break"><span id="S6.I1.i8.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer: C</span></span>
</span></span>
<span id="S6.I1.i9" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i9.p1" class="ltx_para">
<span id="S6.I1.i9.p1.1" class="ltx_p"><span id="S6.I1.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">What is the described motion interaction between the photographer and the curator? </span>
<br class="ltx_break"><span id="S6.I1.i9.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Options:</span><span id="S6.I1.i9.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (A) Moving away from each other, (B) Photographer moving toward curator, (C) Curator walking toward photographer, (D) Standing still, (E) None </span>
<br class="ltx_break"><span id="S6.I1.i9.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer: B</span></span>
</span></span>
<span id="S6.I1.i10" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i10.p1" class="ltx_para">
<span id="S6.I1.i10.p1.1" class="ltx_p"><span id="S6.I1.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">What causes the photographer’s reflection to appear blurred in the glass case? </span>
<br class="ltx_break"><span id="S6.I1.i10.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Options:</span><span id="S6.I1.i10.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (A) Dim lighting, (B) Photographer’s motion, (C) Dirty glass, (D) Placards blocking view, (E) None </span>
<br class="ltx_break"><span id="S6.I1.i10.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer: B</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>