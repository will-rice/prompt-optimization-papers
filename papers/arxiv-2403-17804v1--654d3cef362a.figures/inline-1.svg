<span id="S0.F1" class="ltx_figure">
<span class="ltx_caption" style="--ltx-fg-color:#000000;"><span class="ltx_tag ltx_tag_figure"><span id="S0.F1.5" class="ltx_text" style="font-size:90%;">Figure 1</span>: </span><span id="S0.F1.6" class="ltx_text" style="font-size:90%;">Overview of our backpropagation-free text-to-image optimization by prompting approach that rewrites user prompts with the goal of improving prompt-image consistency. Our framework is composed of a text-to-image generative model (T2I), a large language model (LLM) and a consistency objective (Scorer). The LLM iteratively leverages a history of prompt-score pairs to suggest revised prompts. In the depicted example, our system improves the consistency score by over 30% in terms of Davidsonian Scene Graph score.</span></span>
</span></span></span></span></foreignobject></g></g></svg>