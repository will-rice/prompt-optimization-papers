<span id="as1_S5.F16.pic1.1.3" class="ltx_p"><span id="as1_S5.F16.pic1.1.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">PrismVAU:<span id="as1_S5.F16.pic1.1.3.1.1" class="ltx_text ltx_font_medium"> The video shows two individuals entering an elevator in a building lobby. The scene is considered normal because there are no unusual or anomalous behaviors, such as sudden acceleration, unusual crowd clustering, suspicious objects, or contextual mismatches that could indicate criminal activity. The individuals enter the elevator and the doors close. The scene concludes with the elevator moving upwards.
