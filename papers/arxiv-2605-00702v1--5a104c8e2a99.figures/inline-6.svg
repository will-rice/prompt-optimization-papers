<svg id="A7.F16.pic1" class="ltx_picture" height="924.95" overflow="visible" version="1.1" viewbox="0 0 653.15 924.95" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,924.95) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8080FF;" fill="#8080FF" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.87 L 0 921.07 C 0 923.21 1.73 924.95 3.87 924.95 L 649.28 924.95 C 651.42 924.95 653.15 923.21 653.15 921.07 L 653.15 3.87 C 653.15 1.73 651.42 0 649.28 0 L 3.87 0 C 1.73 0 0 1.73 0 3.87 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 3.87 L 1.11 902.41 L 652.04 902.41 L 652.04 3.87 C 652.04 2.35 650.8 1.11 649.28 1.11 L 3.87 1.11 C 2.35 1.11 1.11 2.35 1.11 3.87 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 910.22)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:0.7em;--ltx-fo-depth:0.2em;font-size:10pt;" height="12.45" overflow="visible" transform="matrix(1 0 0 -1 0 9.69)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.F16.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A7.F16.pic1.1.1" class="ltx_p"><span id="A7.F16.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">TEMPLATE_LOSS: Contrastive Feedback for Memory Update</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 876.62)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:0.98em;--ltx-fo-depth:62.39em;font-size:10pt;" height="876.83" overflow="visible" transform="matrix(1 0 0 -1 0 13.55)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.F16.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A7.F16.pic1.2.1" class="ltx_p"><span id="A7.F16.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">TEMPLATE_LOSS<span id="A7.F16.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> = &quot;&quot;&quot; 
<br class="ltx_break">Below are two examples of memory updates: one labeled as <span id="A7.F16.pic1.2.1.1.1.1" class="ltx_text ltx_font_typewriter">correct_case</span> and the other as <span id="A7.F16.pic1.2.1.1.1.2" class="ltx_text ltx_font_typewriter">wrong_case</span>. 
<br class="ltx_break">These examples illustrate the process of updating memory blocks based on a user’s question using <span id="A7.F16.pic1.2.1.1.1.3" class="ltx_text ltx_font_typewriter">template_evolve</span> 
<br class="ltx_break">by querying a Large Language Model. 
<br class="ltx_break"></span></span></span>
<span id="A7.F16.pic1.2.2" class="ltx_p"><span id="A7.F16.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to apply <span id="A7.F16.pic1.2.2.1.1" class="ltx_text ltx_font_bold">contrastive learning principles</span> to thoroughly compare the correct and incorrect samples. 
<br class="ltx_break">Analyze the reasons why the <span id="A7.F16.pic1.2.2.1.2" class="ltx_text ltx_font_bold">correct sample is successful</span> and identify the factors contributing to the <span id="A7.F16.pic1.2.2.1.3" class="ltx_text ltx_font_bold">failure of the wrong sample</span>. 
<br class="ltx_break">Critically evaluate the issues present in <span id="A7.F16.pic1.2.2.1.4" class="ltx_text ltx_font_typewriter">template_evolve</span>, and propose how it can better capture <span id="A7.F16.pic1.2.2.1.5" class="ltx_text ltx_font_bold">user preferences</span>. 
<br class="ltx_break">Provide <span id="A7.F16.pic1.2.2.1.6" class="ltx_text ltx_font_bold">actionable suggestions and feedback</span> for optimizing the template. 
<br class="ltx_break"></span></span>
<span id="A7.F16.pic1.2.3" class="ltx_p"><span id="A7.F16.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;correct_sample&gt;<span id="A7.F16.pic1.2.3.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"><span id="A7.F16.pic1.2.3.1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{correct_sample}</span> 
<br class="ltx_break"></span>&lt;/correct_sample&gt;<span id="A7.F16.pic1.2.3.1.2" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span></span></span>
<span id="A7.F16.pic1.2.4" class="ltx_p"><span id="A7.F16.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;wrong_sample&gt;<span id="A7.F16.pic1.2.4.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"><span id="A7.F16.pic1.2.4.1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{wrong_sample}</span> 
<br class="ltx_break"></span>&lt;/wrong_sample&gt;<span id="A7.F16.pic1.2.4.1.2" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span></span></span>
<span id="A7.F16.pic1.2.5" class="ltx_p"><span id="A7.F16.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"># Definitions:<span id="A7.F16.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"># - <span id="A7.F16.pic1.2.5.1.1.1" class="ltx_text ltx_font_typewriter">user_question_or_message</span>: Represents the question or message provided by the user. 
<br class="ltx_break"># - <span id="A7.F16.pic1.2.5.1.1.2" class="ltx_text ltx_font_typewriter">correct_answer</span>: Denotes the correct answer to the given question. 
<br class="ltx_break"># - <span id="A7.F16.pic1.2.5.1.1.3" class="ltx_text ltx_font_typewriter">model_response</span>: Indicates the model’s response, derived by combining the <span id="A7.F16.pic1.2.5.1.1.4" class="ltx_text ltx_font_typewriter">user_question_or_message</span> with the <span id="A7.F16.pic1.2.5.1.1.5" class="ltx_text ltx_font_typewriter">memory_bank</span>. 
<br class="ltx_break"># - <span id="A7.F16.pic1.2.5.1.1.6" class="ltx_text ltx_font_typewriter">memory_bank</span>: Refers to a storage area that is updated during the memory refinement process. 
<br class="ltx_break"></span></span></span>
<span id="A7.F16.pic1.2.6" class="ltx_p"><span id="A7.F16.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"># The template requiring further refinement and optimization is as follows:<span id="A7.F16.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"></span></span></span>
<span id="A7.F16.pic1.2.7" class="ltx_p"><span id="A7.F16.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;template_evolve&gt;<span id="A7.F16.pic1.2.7.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"><span id="A7.F16.pic1.2.7.1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{template_evolve}</span> 
<br class="ltx_break"></span>&lt;/template_evolve&gt;<span id="A7.F16.pic1.2.7.1.2" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span></span></span>
<span id="A7.F16.pic1.2.8" class="ltx_p"><span id="A7.F16.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"># Please provide suggestions and feedback on how this template can be improved and optimized.<span id="A7.F16.pic1.2.8.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"># Do not directly update the template content; focus solely on providing recommendations. 
<br class="ltx_break">&quot;&quot;&quot;</span></span></span>
</span></span></span></foreignobject></g></g></svg>