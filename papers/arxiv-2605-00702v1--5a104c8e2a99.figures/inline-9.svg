<span id="A7.F19.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A7.F19.pic1.1.1" class="ltx_p"><span id="A7.F19.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">TEMPLATE_EVOLVE_STEP50: Evidence-Bound Memory Update from a New Chunk</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 896.15)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:0.98em;--ltx-fo-depth:63.8em;font-size:10pt;" height="896.36" overflow="visible" transform="matrix(1 0 0 -1 0 13.55)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.F19.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A7.F19.pic1.2.1" class="ltx_p"><span id="A7.F19.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">TEMPLATE_EVOLVE_STEP50<span id="A7.F19.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> = &quot;&quot;&quot; 
<br class="ltx_break"></span></span></span>
<span id="A7.F19.pic1.2.2" class="ltx_p"><span id="A7.F19.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">You are given a question with options, some new memory, and previous user memory.<span id="A7.F19.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Read the new section and update the user memory by prioritizing </span>recent and relevant information<span id="A7.F19.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> that aligns with the user’s </span>preferences and experiences<span id="A7.F19.pic1.2.2.1.3" class="ltx_text ltx_font_medium">. 
<br class="ltx_break"></span></span></span>
<span id="A7.F19.pic1.2.3" class="ltx_p"><span id="A7.F19.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;memory&gt;<span id="A7.F19.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> <span id="A7.F19.pic1.2.3.1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{memory}</span> </span>&lt;/memory&gt;<span id="A7.F19.pic1.2.3.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"></span></span></span>
<span id="A7.F19.pic1.2.4" class="ltx_p"><span id="A7.F19.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;section&gt;<span id="A7.F19.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> <span id="A7.F19.pic1.2.4.1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{chunk}</span> </span>&lt;/section&gt;<span id="A7.F19.pic1.2.4.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"></span></span></span>
<span id="A7.F19.pic1.2.5" class="ltx_p"><span id="A7.F19.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Update rules:<span id="A7.F19.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">- </span>Evidence-bound:<span id="A7.F19.pic1.2.5.1.2" class="ltx_text ltx_font_medium"> Extract candidate memory items from chunk. Every stored item must be </span>directly supported<span id="A7.F19.pic1.2.5.1.3" class="ltx_text ltx_font_medium"> by chunk. 
<br class="ltx_break">- </span>Relevance &amp; stability:<span id="A7.F19.pic1.2.5.1.4" class="ltx_text ltx_font_medium"> Store </span>long-term preferences<span id="A7.F19.pic1.2.5.1.5" class="ltx_text ltx_font_medium">, </span>stable facts<span id="A7.F19.pic1.2.5.1.6" class="ltx_text ltx_font_medium">, </span>recurring habits<span id="A7.F19.pic1.2.5.1.7" class="ltx_text ltx_font_medium">, </span>long-term goals<span id="A7.F19.pic1.2.5.1.8" class="ltx_text ltx_font_medium">, and </span>interaction preferences<span id="A7.F19.pic1.2.5.1.9" class="ltx_text ltx_font_medium">. Do </span>not<span id="A7.F19.pic1.2.5.1.10" class="ltx_text ltx_font_medium"> store one-off details (e.g., transient locations, momentary moods) unless explicitly stated as long-term. 
<br class="ltx_break">- </span>Conflict handling:<span id="A7.F19.pic1.2.5.1.11" class="ltx_text ltx_font_medium"> If new info contradicts existing memory, prefer the </span>most recent supported<span id="A7.F19.pic1.2.5.1.12" class="ltx_text ltx_font_medium"> info as active, and mark the older one as </span>deprecated<span id="A7.F19.pic1.2.5.1.13" class="ltx_text ltx_font_medium"> with a short reason. 
<br class="ltx_break">- </span>Privacy:<span id="A7.F19.pic1.2.5.1.14" class="ltx_text ltx_font_medium"> Do </span>NOT<span id="A7.F19.pic1.2.5.1.15" class="ltx_text ltx_font_medium"> store highly sensitive or uniquely identifying data (exact address, account credentials, financial/medical specifics, etc.). 
<br class="ltx_break">- </span>No domain bias:<span id="A7.F19.pic1.2.5.1.16" class="ltx_text ltx_font_medium"> Do not assume any specific hobbies or interests unless stated in chunk. 
<br class="ltx_break">- If chunk contains explicit user corrections/ratings about previous outputs, store them under </span>&quot;interaction_feedback&quot;<span id="A7.F19.pic1.2.5.1.17" class="ltx_text ltx_font_medium">. Otherwise, do not create feedback entries. 
<br class="ltx_break">- Merge into a </span>structured memory profile<span id="A7.F19.pic1.2.5.1.18" class="ltx_text ltx_font_medium">. Keep it concise, non-redundant, and internally consistent. 
<br class="ltx_break"></span></span></span>
<span id="A7.F19.pic1.2.6" class="ltx_p"><span id="A7.F19.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;&quot;&quot;</span></span>
</span></span></span></foreignobject></g></g></svg>