<section id="S3.SS1.SSS0.Px1" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Rationale for the agentic LLM approach in <span id="S3.SS1.SSS0.Px1.1" class="ltx_text ltx_font_smallcaps">PersonaGym</span>:</h4>

<span id="S3.SS1.SSS0.Px1.p1" class="ltx_para">
<span id="S3.SS1.SSS0.Px1.p1.1" class="ltx_p"><span id="S3.SS1.SSS0.Px1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We employ different LLMs in a multi-agent setup—including the </span><span id="S3.SS1.SSS0.Px1.p1.1.2" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">User</span><span id="S3.SS1.SSS0.Px1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="S3.SS1.SSS0.Px1.p1.1.4" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Assistant</span><span id="S3.SS1.SSS0.Px1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, and </span><span id="S3.SS1.SSS0.Px1.p1.1.6" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Distractor</span><span id="S3.SS1.SSS0.Px1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> agent—for two reasons.
First, prior work </span><cite class="ltx_cite ltx_citemacro_cite"><span id="S3.SS1.SSS0.Px1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">[</span><a href="#bib.bib71" title class="ltx_ref">60</a><span id="S3.SS1.SSS0.Px1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;">]</span></cite><span id="S3.SS1.SSS0.Px1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> has shown that instruction-tuned LLMs can serve as effective simulators of user behaviors.
Second, using separate LLMs disentangles the different sources of variation in interactive data: the </span><span id="S3.SS1.SSS0.Px1.p1.1.11" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">User</span><span id="S3.SS1.SSS0.Px1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> agent controls goal- and preference-conditioned behavior; the </span><span id="S3.SS1.SSS0.Px1.p1.1.13" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Assistant</span><span id="S3.SS1.SSS0.Px1.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;"> agent provides responses whose quality can be evaluated; and the </span><span id="S3.SS1.SSS0.Px1.p1.1.15" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Distractor</span><span id="S3.SS1.SSS0.Px1.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;"> agent injects controlled stochasticity that mimics real-world interaction noise.</span></span>
</span>
</section>
                  </span></span></span></foreignobject></g></g></svg>