<section id="S3.SS3.SSS0.Px2" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Why is the stylization stochastic?</h4>

<span id="S3.SS3.SSS0.Px2.p1" class="ltx_para">
<span id="S3.SS3.SSS0.Px2.p1.1" class="ltx_p"><span id="S3.SS3.SSS0.Px2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We deliberately do </span><em id="S3.SS3.SSS0.Px2.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">not</em><span id="S3.SS3.SSS0.Px2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> stylize every seed query for two reasons.
</span><span id="S3.SS3.SSS0.Px2.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">(i)</span><span id="S3.SS3.SSS0.Px2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><em id="S3.SS3.SSS0.Px2.p1.1.6" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Intermittent signals.</em><span id="S3.SS3.SSS0.Px2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">
In practice, users alternate between plain task-only requests and preference-revealing formulations, so stylizing all queries would unrealistically densify personalization cues.
</span><span id="S3.SS3.SSS0.Px2.p1.1.8" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">(ii)</span><span id="S3.SS3.SSS0.Px2.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><em id="S3.SS3.SSS0.Px2.p1.1.10" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Avoiding biased optimization.</em><span id="S3.SS3.SSS0.Px2.p1.1.11" class="ltx_text" style="--ltx-fg-color:#000000;">
Over-stylized histories can bias the optimizer toward the initial query and reduce reliance on preference signals expressed in later feedback. As a result, stochastic stylization mitigates this by mixing clean and persona-tinted queries, encouraging preference recovery under partial observability.</span></span>
</span>
</section>
                    </span></span></span></foreignobject></g></g></svg>