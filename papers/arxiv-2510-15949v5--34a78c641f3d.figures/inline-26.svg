<span id="A9.I1" class="ltx_enumerate">
<span id="A9.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A9.I1.i1.p1" class="ltx_para">
<span id="A9.I1.i1.p1.1" class="ltx_p"><span id="A9.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Introduced a 5-step </span><span id="A9.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">THINK</span><span id="A9.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A9.I1.i1.p1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="A9.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A9.I1.i1.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">CHECK</span><span id="A9.I1.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A9.I1.i1.p1.m2" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="A9.I1.i1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A9.I1.i1.p1.1.8" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">ACT</span><span id="A9.I1.i1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> workflow that linearly converts market inputs into compliant orders, minimizing reasoning omissions.</span></span>
</span></span>
<span id="A9.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A9.I1.i2.p1" class="ltx_para">
<span id="A9.I1.i2.p1.1" class="ltx_p"><span id="A9.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Added an explicit </span><span id="A9.I1.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">PRE-ORDER RISK CHECKLIST</span><span id="A9.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (cash, short limit, catalyst validity, </span><math id="A9.I1.i2.p1.m1" class="ltx_Math" alttext="\geq" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><annotation encoding="application/x-tex">\geq</annotation></semantics></math><span id="A9.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> 2:1 R:R) to curb rule violations and low-edge trades.</span></span>
</span></span>
<span id="A9.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A9.I1.i3.p1" class="ltx_para">
<span id="A9.I1.i3.p1.1" class="ltx_p"><span id="A9.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Elevated the four context feeds (technical, news, fundamentals, reflection) into a single </span><span id="A9.I1.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">MARKET SITUATION</span><span id="A9.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> dashboard that the workflow must reference, ensuring holistic analysis.</span></span>
</span></span>
<span id="A9.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A9.I1.i4.p1" class="ltx_para">
<span id="A9.I1.i4.p1.1" class="ltx_p"><span id="A9.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Moved the strict JSON schema into its own boxed section immediately before output instructions; this reduces formatting errors.</span></span>
</span></span>
<span id="A9.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A9.I1.i5.p1" class="ltx_para">
<span id="A9.I1.i5.p1.1" class="ltx_p"><span id="A9.I1.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Kept language concise but directive, reinforcing trader autonomy while preventing over-trading with a </span><span id="A9.I1.i5.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">PATIENCE</span><span id="A9.I1.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> override.</span></span>
</span></span>
<span id="A9.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A9.I1.i6.p1" class="ltx_para">
<span id="A9.I1.i6.p1.1" class="ltx_p"><span id="A9.I1.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Preserved every required {{placeholder}} and {% if %} block exactly, guaranteeing template compatibility.</span></span>
</span></span>
